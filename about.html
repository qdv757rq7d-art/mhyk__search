晶	そうですね……。なんだか、教える方にも手探り感がありましたね……。
`},
{id:10919,title:"時を超える声（９）",type:"personal",characters:["スノウ","ホワイト"],memo:"ブラッドリー",
text:`スノウとホワイトと時の洞窟を歩いていると、イェストゥルムの羽音と、水滴の音に混ざって、
時を超えた会話が聞こえてきた。
~~~~~~~~~	~~~~~~~~~
冷厳な子供の声	おぬしと北の国で会うとはいつ以来かのう。世界征服とやらはもうやめたのか？
寂寥な男の声	ホワイト様が居なくなって、オズがやる気をなくしたんですよ。
	まさか、あなたたちが殺し合うなんて。
	ただでさえ、この世が虚しくて始めた世界征服だったのに。
	余計、虚しくなっちゃったんじゃないですか。
	俺も、また新しく何かやることを探さなきゃ。充実した日々だったのに。
	いい迷惑です。
冷厳な子供の声	ホワイトは居なくなってなどおらぬ。ずっと我のそばにおる。
寂寥な男の声	……とうとうイカれたんですか？
冷厳な子供の声	我の魔力で魂をつなぎとめ、今まで通り２人仲良く暮らしておるのじゃ。
冷厳な子供に似た声	ほほほ。久しぶりじゃな。驚いたかの？
寂寥な男の声	……そんな……。それじゃあ……。
	オズも北に戻ってきたし、元通り、なんですかね……？
冷厳な２人の子供の声	さよう。ハッピーエンドじゃの。
~~~~~~~~~	~~~~~~~~~
ちらちらと、コウモリの目が光っている。
スノウ･ホワイト	……ほほほ。
~~~~~~~~~	~~~~~~~~~
選択	ハッピーエンドである。
晶	（……本人たちが幸せなら、それがハッピーエンドでいいのかな……）
~~~~~~~~~	~~~~~~~~~
選択	ハッピーエンドではない。
晶	（いや……、ハッピーエンドで片付けるにはちょっと問題が多すぎるのでは……）
`},
{id:10920,title:"北の国について",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリー、調子が良さそうですね。
	やっぱり、故郷に帰ってくるのは嬉しいですか？
ブラッドリー	土地が体に合うからか？嬉しいとか感慨とかは、別にねえけどな。
晶	でも、魔法使いならどこにでも行けるのに、ずっと北の国にいたんですよね。
	好きだったからじゃないんですか？
ブラッドリー	だって、魔法使いも土地の魔力も、北が一番強えじゃねえか。
	他の国に行ったってしょうもねえだろ。強いやつもいねえし、高価なマナ石もねえ。
	何よりダセェじゃん。
晶	ダサい……？他の国のこと、ダサいって思うんだ……。
	西や中央は華やかですけど、ダサいですか？
ブラッドリー	は！そんなもん、数ばっか増えた人間が作ったような文化じゃねえか。
	北の国は魔法使いが好き勝手やってて、人間は隙間で生きてんだよ。
	弱くて何もできねえんだから当たり前だろ。
	なのに他の国は、人間どもが幅きかせてチャラッチャラしててよ。
	それに合わせて隠れて生きてる魔法使いまでいるんだぜ？
	くだらねえし、バカみてえだし、死ぬほどダセェだろうが。
	俺はそんなのまっぴらごめんだね。
晶	力の強い魔法使いだと、そういう風に感じるんですね……。
ブラッドリー	おい、賢者。間違うなよ。弱くても、もがくバカは好きさ。
	弱いのを理由に、他人の顔色伺いながら、
	何もしようとしねえのが賢いと思ってるのがダセェって言ってんだよ。
`},
{id:10921,title:"〈大いなる厄災〉について",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリーは投獄中に賢者の魔法使いに選ばれたんですよね。
	〈大いなる厄災〉がやってくる夜だけ、牢獄から出してもらえたんですか？
ブラッドリー	ああ。ついてるよな。
	年に一度、厄災相手に暴れられたし、前後の数日間は魔法舎の中なら自由だしで、羽伸ばせるしよ。
	こないだのなんか始めから手強くて、こりゃ何日かかるのか？って一瞬喜んだくらいだぜ。
晶	今までとはやっぱり全然違う感じだったんですね……。
ブラッドリー	いつもは一晩だけの祭りみてえなもんだ。
	集まって、盃打って、飲んで食って、やるかーって戦って、お開き。
	でもこないだのは、どんどんどんどん近づいてきて、やってもやっても引き上げる気配がねえ。
	力負けするやつが出てきたくらいで、ミスラが、「あ、これ、まずいですね」つって、
	居なくなった。
晶	えっ……！？逃げちゃったんですか？
ブラッドリー	そりゃ逃げるさ！
	気付いたらオーエンも居ねえし、当然、俺もずらかるつもりだったが……。
	南の弱いやつらは遠くに行けねえなと思って振り返ったら、もう石になってやがった。
晶	…………。
ブラッドリー	それでいよいよヤバいから俺も離脱した。
	オズと双子がいなけりゃ、世界はあのまま終わってただろうな。
`},
{id:10922,title:"スポットにいた魔法使い",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	この辺りに住んでいた時のブラッドリーの盗賊団には、どんな人たちがいたんですか？
ブラッドリー	ここにいた時か……。
	コウモリ野郎の話はしたよな。あとはまあ、コックの相棒と……。
	１番の古株もまだいた頃だな。酒飲みで、筋肉隆々で、刺青が好きで、中身は、頭使わねえ俺って感じのやつだよ。
	南の羊飼いに似たやつもいたぜ。ずっと黙ってて、従順で忠実で、仕事が早え。
	だが、たまにキレて手がつけられなくなる。
	あと、長い間、偵察隊を任してたやつ。
	器用な魔法が得意で、ネロの最初の上司だった。
	話し上手で、調子が良くて、……あ、いや。
晶	なんですか？
ブラッドリー	あいつはここに来る前に石になっちまったんだったかもしれねえな。
	……この話、面白えか？
晶	お、面白いです。
	あ……、変な意味じゃなくて、ブラッドリーがどんな人たちと過ごしてたのか、興味あります。
ブラッドリー	ふうん。ま、みんな居なくなっちまったけどよ。
~~~~~~~~~	~~~~~~~~~
選択	１番弱い魔法使いは？
晶	１番弱い魔法使いは？
ブラッドリー	当たり前だが弱えやつはすぐ入れ替わっちまう。
	もともと、北じゃひとりで生きられねえ奴らが寄り集まってんだしな。
晶	そうなんですか？
ブラッドリー	弱くてやっていけなくても、北以外じゃ生きられねえ奴がいんのさ。
	連むのが嫌いでも、石になるよりはマシだろ。
~~~~~~~~~	~~~~~~~~~
選択	１番かっこいい魔法使いは？
晶	１番かっこいい魔法使いは？
ブラッドリー	俺だぜ？容姿の話なら魔法で変えられるんだからな。
	目に見えるもの信じすぎてると痛い目に合うぞ。
	だが、1度、大物を狙う時に手を組んだ、色男がいたっけな。呪術に詳しくて。
	西から来たって言ってたぜ。西のパイプ飲みをシャキッとさせた感じだよ。
	腕が良かったが、あいつとはあれっきりだ。
	魔力も強かったし、まだ生きてるだろうな。
~~~~~~~~~	~~~~~~~~~
選択	魔女はいなかったんですか？
晶	魔女はいなかったんですか？
ブラッドリー	魔女は男をからかうのが趣味なんだよ。
	うちの団は純朴なやつばっかりですぐ揉めやがるし。男所帯だったぜ。
	それでも、野垂れ死にたくねえって、男に化けて混ざってたのもいたけどな。
	案の定、他の部下とくっついて出て行った。
晶	それは……ハッピーエンドですね。
ブラッドリー	ああ。ハッピーエンドだぜ。
`},
{id:10923,title:"危険な場所",type:"personal",characters:["オーエン"],memo:"ブラッドリー",
text:`晶	あれ、洞窟の奥の方に明かりが……。
	わ……、あそこ、緑色に光ってる？石か、苔なのかな？幻想的で綺麗だな。
	もう少し近くで見て……。
オーエン	賢者様。
晶	わっ……！？オーエン……、居たんですね。びっくりした……。
オーエン	それ、虫だよ。
晶	え？
オーエン	光ってるやつ。小さい虫だよ。たくさん、岩に張り付いてるんだ。
	よく見て、動いてる。
晶	……………………。本当だ……。
	オーエンは、虫とも話せるんですか？こっちに来ないように、頼んでもらえませんか？
オーエン	虫は喋らないさ。でも、賢者様の目が光ってたら、きみのこと好きになると思うよ。
	そいつら、太陽じゃない光に寄ってくる習性がある。魔法できらきらさせてあげるね。
晶	え、目を？ちょっ……、ちょっと待ってください……！！
オーエン	ふふ。
	《クアーレ・モリト》
晶	っぎゃーー！！
`},
{id:10924,title:"スポットの名物",type:"personal",characters:["ネロ"],memo:"ブラッドリー",
text:`ネロ	あっ……。
晶	え？
ネロ	今、外光ったか？
晶	ど、どうでしょう？雷とかですか？
ネロ	いや、この辺り、光る雪が降るんだよ。それに砂糖が混じってるんだ。
	見間違いかな……。
晶	光る雪に砂糖が……？
ネロ	ああ。星屑糖っていう珍しい砂糖なんだ。
	光ってて、口の中でパチパチはじけて、味もそこそこ良いんだぜ。
晶	この辺りの特産品なんですね。外、少し見に行ってみましょうか？
ネロ	悪いな。持って帰って何か作ってやったら、お子様たちが喜ぶかなと思って。
晶	きっと喜びます。ネロは前にも星屑糖を集めたことがあるんですか？
ネロ	あはは、あるある。
	滅多に降ってこねえから、見つけたら、仲間全員ザル持って外に立たせてさ。
	寒ィ寒ィって言いながら、みんなで降ってくる雪集めて、
	それでやっと、こんくらいの瓶ひとつ分とれるんだ。
晶	貴重なんですね……！ネロのお菓子で食べられるのが楽しみです！
`},
{id:10925,title:"楽しい場所",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`ブラッドリー	おう、賢者。ここ、見てみろよ。
晶	何か彫ってある……。絵ですか？よく見ると、壁いっぱいにありますね。
	ブラッドリーが描いたんですか？
ブラッドリー	俺じゃねえよ。この洞窟を見つけた時にはもうあったんだ。
	大昔に誰かが描いたんじゃねえかな。
	ほらここ。俺はドラゴンを追っかけてる狩人に見えるんだけどよ。
	仲間連中じゃ、喧嘩してる男と女だとか、でけえ風呂に入ってるだとか
	意見が割れてさ。
	あんたは何に見える？
~~~~~~~~~	~~~~~~~~~
選択	手を繋いでる双子。
晶	手を繋いでる双子に見えます。
	２人が周りの動物みたいなのをやっつけたって感じでしょうか。
ブラッドリー	ははあ、スノウとホワイトか。人間のためになんか狩ってたのかもしれねえし、
	倒れてんのは人間って可能性もありそうだな。
晶	スノウとホワイトが、そんなことしますかね？
ブラッドリー	は？中央の王子みてえな寝ぼけたこと言ってんなよ。
~~~~~~~~~	~~~~~~~~~
選択	ドクロを持ったミスラ。
晶	これがドクロで、こっちがミスラみたいに見えます。周りにあるのはご馳走かな……？
ブラッドリー	ミスラの魔道具はもともとチレッタのもんだ。
	真ん中にいるのはチレッタかもしんねえな。大食いだったって聞くし。
晶	こんなに食べますかね？
ブラッドリー	食うよ食う。俺様だって食うぜ。
~~~~~~~~~	~~~~~~~~~
選択	杖を掲げるオズ。
晶	杖を掲げてるオズに見えます。たくさんの敵を倒したところかな？
ブラッドリー	ああ、あり得るぜ。昔は好き放題暴れてたからな。
	相当昔から絵心あるやつにもトラウマ残してんだな。
~~~~~~~~~	~~~~~~~~~
晶	この壁画、貴重なものなんじゃ……。
ブラッドリー	さあな。興味ねえけど、面白えだろ？
`},
{id:10926,title:"マナエリア",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
	「マナエリア」と呼ぶとも聞きました。ブラッドリーにもマナエリアがありますか？
ブラッドリー	ああ。俺のマナエリアは、北の洞産にある地底湖だな。
	光る石がそこらじゅうに生えてて明るい、青くて広くて冷たくて静かなところだ。
	じっと立ってると、頭が冴え冴えとしてくる。
	喧嘩は頭を使うのも大事だからな。でけえ仕事の前にはよく出かけてた。
晶	なるほど……。気力を充電するっていうよりは、精神の集中や安定に使うんですね。
ブラッドリー	他のやつはどうだか知らねえけどな。
	マナエリアの使い方なんて、魔法と一緒でそれぞれ違うもんだろう。
	俺の場合はどんなに熱くなってても、頭ん中はあの地底湖みてえに冷えてなきゃ、強い魔法は操れねえ。
	気に入って根城にしてた間は、魔法の調子もすこぶる良かったぜ。
	オズにもよくケンカ売りに行ってたわ。
`},
{id:10927,title:"アミュレット",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	ブラッドリーもアミュレットを持ってますか？
ブラッドリー	ああ、アミュレットな。あるぜ。
ブラッドリーは、ガラス棚に置いてある石を掴んで、俺に手渡した。
割れた石の断面は青く輝いて、年輪のような美しい模様が浮かんでいる。
ブラッドリー	俺のマナエリアの洞窟にあった石だ。
	普段は洞窟の中で光ってるが、明かりは割ると消えちまう。
	洞窟の地底湖は、それと似たような青色をしてんだよな。模様が入ってて綺麗だろ。
晶	はい……。宝石みたいですね。
ブラッドリー	あっはは！目が利くじゃねえか。豪邸が立つほどのお宝の原石だよ。
晶	高価なものなんですか？
ブラッドリー	俺様の部屋に、高価じゃねえものなんてあるかよ。欲しけりゃ奪ってみるんだな。
`},
{id:10928,title:"珍しい寝顔",type:"personal",characters:["ブラッドリー","ネロ"],memo:"ブラッドリー",
text:`ネロ	賢者さん？
晶	ネロ、こんばんは。もう夜も遅いので明かりを消そうかと……あ。
ブラッドリー	ぐー…………。
ネロ	悪い、もうそんな時間か。俺も部屋に戻るよ。
晶	いえ、読書中にすみません。ブラッドリー、よく寝てますね。
ネロ	ああ。まったく呑気なもんだよな。おいブラッド。いつまで寝てんだ、起きろ。
ブラッドリー	んん……。
~~~~~~~~~	~~~~~~~~~
選択	ちょっと顔を覗いてみてもいいですか。
ネロ	こいつの顔なんか覗いても楽しくねえだろ。落書きでもすんのか？
晶	そういうわけではないんですが……。うわ、鼻高い。
	やっぱり魔法使いってみんな顔がいいんだな。
~~~~~~~~~	~~~~~~~~~
選択	ちょっと髪を触ってみてもいいですか。
ネロ	そんなもん触って楽しいのか……？
晶	なんかこう、ブラッドリーって犬っぽい毛質してそうだなと思って、気になって……。
~~~~~~~~~	~~~~~~~~~
ブラッドリー	……人の寝顔を無断で覗くとは、いい趣味してんじゃねえか。賢者様よ。
晶	ぎゃっ、ブラッドリー！起きてたんですか……！？
ブラッドリー	目の前でべらべら喋られて寝てられるかよ。俺様は繊細だからな。
ネロ	よく言うぜまったく。脅かしてやんなよ。
晶	す、すみませんでした。とりあえずその銃を下ろしてくれると嬉しいです……。
`},
{id:10929,title:"家族",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリーは北の国の魔法使いですけど、生まれも北の国なんですか？
ブラッドリー	なんだそりゃ。当たり前だろうが。
晶	す、すみません。オズやフィガロは北の国生まれなのに、別の国の魔法使いとして召喚されていたから……。
ブラッドリー	ははあ、確かにあの二人、気に食わねえよなあ。
	オズなんて特に、北の魔法使いの代名詞みてえなやつなのによ。
	俺は生粋の北の魔法使いだぜ。生まれも育ちも、ってやつだ。
晶	そうなんですね……。北の国は住んでいる人間が少ないって聞きましたが、
	どんな家族だったんですか？
ブラッドリー	俺は親父も魔法使いだった。そこそこの悪党で見習う所も多い男だったが、縄張り争いに負けて石になっちまった。
	魔法使いの息子が欲しかったらしくて、たくさん子供を作っててよ。俺がアタリだ。
	大勢いた兄弟たちが最初の子分だな。
	俺たちも、親父を石にしたやつに殺されかけたがなんとか逃げた。
	しばらく後で、仇は取ったけどな。
晶	軽く話してもらった割に壮絶ですけど……。
	お父さん思いだったんですね、ブラッドリー。
ブラッドリー	馬鹿、情で仇討ちしたわけじゃねえよ。
	落とし前はきっちりつけなきゃ、示しがつかねえだろうが。
	組織の頭は、誰かに舐められたまま生きてくことなんてできねえ。
	手下に寝首かかれて終わりだ。
	覚えとけよ、賢者。
`},
{id:10930,title:"相棒の真意",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリー。数日見かけないから心配してました。戻ってきてたんですね。
ブラッドリー	ああ。奇妙な傷のせいで、西の国のど真ん中まで飛ばされちまったぜ。
	腹ペコで堪んねえよ。
	どうせ、ネロのやつがなんか作り置きしてやがるだろうと思って……
	ほら、あったあった。
~~~~~~~~~	~~~~~~~~~
選択	勝手に食べたら怒られませんか？
ブラッドリー	大丈夫、大丈夫。見ろよ、ちゃんと俺の好物だろ。俺様用だぜ。
晶	（ポジティブだな……）
~~~~~~~~~	~~~~~~~~~
選択	よかったら温めましょうか？
ブラッドリー	ああ、いいっていいって。こいつは冷めても美味いように作ってあんだ。
	気が利いてるだろ？
晶	（我が物顔だ……）
~~~~~~~~~	~~~~~~~~~
ブラッドリー	夜食なんて食ってると思い出すな。……昔は俺にも、相棒みたいなやつがいたんだよ。
	俺がいねえとやってけねえやつだと思って、俺なりに、よく面倒見てやってるつもりだった。
	だが、突然姿を消しちまってさ。居ないとなると、不便でしょうがねえんだ。
	そのおかげで、スノウやホワイトに捕まったようなもんだぜ。
	ひとりになって、やってけなくなったのは、まさか、俺の方じゃねえよなって。
	未だに考えることもあるんだよな。
晶	いなくなった人を探し出して、理由を聞いたりはしないんですか？
ブラッドリー	いやあ、気にはなってるが、どうだかな……。
	あんなに信用してたやつに、嫌いだったなんて言われたら落ち込むじゃねえか。
	思い返せば、多少、雑に扱ってた自覚あるしな。
晶	ブラッドリーは北の魔法使いなのに、人情味がありますよね。
	再会したら、大事にできるといいですね。
ブラッドリー	はは、うるせえよ。
`},
{id:10931,title:"魚の仕分けもお手の物",type:"personal",characters:["ブラッドリー","レノックス"],memo:"ブラッドリー",
text:`晶	レノックス。
	……と、ブラッドリー？珍しいですね、二人揃って。
レノックス	賢者様。魚釣りに行ってきたんですが、検分すると引き留められて……。
ブラッドリー	よう、賢者。おまえ、ひょろっこいから、骨の多い魚を食えよ。こいつだな。
ブラッドリーが指先を振るうと、桶の中で泳ぐ魚の一匹に、刺青のような印がついた。
晶	ありがとうございます……。みんなの魚を振り分けてくれてるんですか？
ブラッドリー	そうとも。獲物を最初に見つけたのは俺様だ。上前をはねるのは当然だろ。
レノックス	釣ってきたのは俺だろう。
ブラッドリー	ああ？俺の方が強いんだ。文句があるならてめえを殺して奪ったっていいんだぜ。
レノックス	川魚のために殺されるのは嫌だな……。
ブラッドリー	わかったら楯突くんじゃねえよ。
	……ほら、この一番デカくて、身がしまってそうなやつは俺のだ。
レノックス	大きい魚は子供達に。
ブラッドリー	いちいちうるせえなあ。ならこっちの、これとこれでいいだろ。
	こいつらは卵が入ってそうだ。
晶	あはは。今夜の夕食が楽しみですね。
`},
{id:10932,title:"カード越しの眼差し",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリー。トランプと睨めっこなんて珍しいですね。
ブラッドリー	……ん？ちょっとな。戦略を練ってた。
晶	戦略ですか？
ブラッドリー	こないだ西のおかっぱの兄ちゃんとポーカーやったんだけどよ。
	あいつまじでめちゃくちゃ強えのな。
	俺も昔はそこそこやり込んでたはずなのにまったく歯が立たなかった。
晶	ムル、強いですよね。以前俺も勝負したんですけど、ぼろ負けでした。
	遊びだと分かってても悔しかったです……。
ブラッドリー	だよな。俺も負けっぱなしは癪だから、どうにか勝てねえかと思ってよ。
	……そうだ。おまえ、ルールはわかるんだよな？
晶	はい。一応一通りは。
ブラッドリー	そこ座れ。ちょっと相手してくれよ。
晶	でも、俺は全然強くないですよ。もっと上手い人の方が……。
ブラッドリー	つれねえこと言うなよ。夜はまだまだこれからだろ？
晶	あはは、なんだか悪い遊びみたいですね。
ブラッドリー	ならせっかくだ、賭けようぜ。身ぐるみ全部剥がれて泣くなよ、賢者様？
`},
{id:10933,title:"大乱闘はすぐそこに",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	え、何だ！？
ブラッドリー	危ねえとこだった……！
晶	ブラッドリー。あの、この爆発音は一体……。
ブラッドリー	賢者、こんなところで何してる！死にてえのか……！
晶	えぇっ！
ブラッドリー	逃げるぞ！
晶	あ、うわ。そんな急に脇に抱えなくても、ぐえっ。
	ブラッドリー、お忙しいところすみません。何があったかだけ聞いてもいいですか？
ブラッドリー	ああ？見て分かんだろ、オズとミスラだよ！
	あんなにブチ切れたミスラは久々に見た。こりゃ荒れるぜ。
晶	なるほど、やっぱり北の魔法使いって激しいんですね。
ブラッドリー	おまえもなかなか図太え野郎だと思うけどな……。
`},
{id:10934,title:"得意な魔法",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリーは、得意な魔法ってありますか？ブラッドリーにしか使えない魔法とか。
ブラッドリー	魔力強化だな。敵とやりあう前に、自分自身や、仲間の魔力を上げることができる。
	この魔法のおかげで、ミスラやオーエンに、でかい顔されなくて済んでるぜ。
晶	なるほど……。
	ブラッドリーがライバルの味方になると、困ってしまうってことですね。
ブラッドリー	そういや、前の賢者とも同じ話をした気がするな。おまえの世界の言葉でたしか……。
	ばぶ。
晶	ばぶ……？
ブラッドリー	……ん？違うな。「バフ」だったか？
晶	ゲーム用語ですね……！その魔法はやっぱり、俺には効果ないんでしょうか。
ブラッドリー	てめえにや魔力がねえからなあ。だが、土気を上げることは出来るぜ。
	《アドノポテンスム》！
晶	なんか、すごくやる気が出てきました！！今なら誰にも負けない気がします！
ブラッドリー	あっはは！その意気だ。
	ついでだから、このブラッドリー様が、正しい喧嘩の売り方を教えてやるよ。
	オズの部屋に乗り込むぜ。
晶	はい！！
`},
{id:10935,title:"手入れもぬかりなく",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	お邪魔します。ブラッドリー、いますか？
ブラッドリー	ああ。なんだ、賢者か。
晶	お届け物を持ってきました。シャイロックから預かったブランデーです。
	すみません、銃のお手入れ中に。
ブラッドリー	おう。そこ置いといてくれ。
晶	（集中してる……。あの長銃、ブラッドリーの魔道具だ。
	　男っぽい雰囲気によく似合うなあ）
ブラッドリー	なにじろじろ見てやがんだ？
~~~~~~~~~	~~~~~~~~~
選択	優しい表情だなって
ブラッドリー	そりゃ、至福の時間だからな。こいつは俺が持ってる銃の中でも特に自慢の品だ。
	おまえが持ってきた酒を片手に煽れば、そりゃもう贅沢空間よ。
~~~~~~~~~	~~~~~~~~~
選択	手つきが丁寧だなと思って。
ブラッドリー	そりゃあそうだろ。物持ちの良さは手入れで変わるからな。
	特に銃なんて男の浪漫だろ。
~~~~~~~~~	~~~~~~~~~
晶	でもブラッドリー、この間その銃を振り回してミスラと喧嘩してましたよね……。
ブラッドリー	ああ、長銃はリーチが長えし鈍器にもなるんだよ。
	魔法舎の中で実弾をぶっ放すと双子がうるせえからな。
	（その辺は若干配慮してくれてるんだ……）
`},
{id:10936,title:"紋章",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	賢者の魔法使いには、目印になる賢者の紋章が身体に現れるって聞きました。
	ブラッドリーの紋章はどこにあるんですか？
ブラッドリー	右の脇腹だよ。ホラ。
ブラッドリーは雑な手つきでスラックスからシャツの裾を引き抜くと、服を捲って見せてくれた。
黒いあざのような紋章が、脇腹の肌を大きく覆っている。
ブラッドリー	牢にブチ込まれてだいぶ経ったクソ暇な時に出てきてよ。
	さすが、俺はついてる男だと思ったぜ。
晶	ついてる、ですか？嬉しかったってことですか？
ブラッドリー	当たり前だろうが！捕まって数十年間、一度も外に出られなかったのに……。
	賢者の魔法使いになったとありゃあ、
	〈大いなる厄災〉と戦う時は、絶対に牢から出されるじゃねえか。
	即、檻の中でわめき散らしてやったぜ。賢者の魔法使いさんよお！
	こんな所に閉じ込めてよお！てめえらの世界が大事じゃねえのかよ！つってな。
晶	あはは……。
	笑っちゃいけないかもしれないですけど、閉じ込めていた人たちは困ったでしょうね。
ブラッドリー	俺だって高笑いさ！今は双子じじいの監視付きとはいえ、毎日自由に歩き回れて最高だぜ。
	厄災様々って感じだよ。
	次の厄災も大いに暴れてくれりゃあここでの暮らしだ続いてありがてえんだがな。
`},
{id:10937,title:"肉こそ正義",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`ブラッドリー	いつも飯作りに来る人間の女いるだろ。
	あいつはよく料理のリクエスト聞いてくるんだけどよ。
晶	カナリアさんですか？よくキッチンでお二人がお話ししてるの見かけてましたが、
	あれはメニューの相談だったんですね。
ブラッドリー	おう。食いてえもんあったら遠慮なく言ってくれっていうから、
	俺は毎回メニュー作りに協力してるわけだ。
	……けど、だいたいネロに捻じ曲げられる。
晶	ネロにですか？
ブラッドリー	ああ、あいつキッチンの主気取りだからな。食いてえもんがいつも通るとは限らねえ。
	だから最近は毎日賭けみたいな気分でいる。
	肉が出た日は俺が勝ったと思ってくれ。野菜が出た日は負けだ。
晶	なるほど。そういう仕組みだったんですね。
ブラッドリー	ケチくせえよなあ。肉ぐらい毎日出してくれたっていいじゃねえか。なあ。
晶	……ちなみにブラッドリーって、毎日どんなものリクエストしてるんですか？
ブラッドリー	あ？そんなもん、昨日は肉で、一昨日も肉……。
晶	ネロ、毎日栄養バランス考えてくれてるんですね……。
ブラッドリー	あ？なんか言ったか？
`},
{id:10938,title:"刺激を求めて",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリー！部屋から大きな音がしましたが、大丈夫ですか？
ブラッドリー	あっはっは。悪ィ悪ィ。こないだ手に入れた銃をちょっとばかり弄ってたんだよ。
晶	大丈夫ですか……！？暴発しちゃったとか？
ブラッドリー	そんなヘマするか。興が乗ってきて、ついな。久々に短銃が撃ちたくなっちまって。
晶	部屋の中ではやめてください！？
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
ブラッドリー	寝たり、酒飲んだり、銃の手入れをしたりか？
	牢獄に比べりゃずいぶんマシとはいえ、魔法舎じゃろくに暴れられねえしよ。暇だぜ。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
ブラッドリー	ひとりが退屈なときはネロに……、
	いや、調理場のやつにつまみ作らせて一緒に飲むけど、あんまり来たがらねえな。
	ブラッドリースノウとホワイトは、呼んでねえのに勝手に入って来やがる。
	鬱陶しいぜ。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
ブラッドリー	飯の時間が決まってやがるからな。それだけは合わせてやってるが、あとは自由だ。
	牢獄にいた時も時間は自由だったが、何にもできなくてよ。
	双子の監視は窮屈だが、ずいぶんマシだぜ。
~~~~~~~~~	~~~~~~~~~
晶	ストレスが溜まってるんですかね……。運動をしてみたらどうですか？
カインやレノックスみたいに筋トレをするとか。
ブラッドリー	馬鹿が。そんなもんで数百年分の鬱憤が晴れるわけねえだろうが。
	あーあ！パーっと悪逆の限りを尽くしたいぜ！
	いつかのオズみてえにやれりゃあ、さぞ爽快だろうけどなあ！
`},
{id:10939,title:"つまみ食い犯を捕まえろ",type:"personal",characters:["リケ","ブラッドリー","ミチル"],memo:"ブラッドリー",
text:`ブラッドリー	おい、おまえ！
晶	ブラッドリー。そんなに急いでどうし……。
	（後ろから羽交い締めに……！？）
ブラッドリー	確保だ賢者！いいところに来たな！
ミチル	見つけましたよブラッドリーさん……って、わあ！
リケ	賢者様が人質に……！
ブラッドリー	おうおまえら、それ以上近づいてみろ。こいつがどうなってもいいのか！
晶	あの、これは一体……？
ミチル	ボクたち、ネロさんからブラッドリーさんを捕まえてくれってお願いされたんです！
リケ	つまみ食いは愚かな行為ですし、捕まえてきたらおやつをくれるんですって。
	逃がしませんよ！
ブラッドリー	あはは、やれるもんならやってみやがれ！
晶	（みんなめちゃくちゃ楽しそうじゃん……！）
`},
{id:10940,title:"一枚上手の心理戦",type:"personal",characters:["カイン","ブラッドリー"],memo:"ブラッドリー",
text:`カイン	うーん……。
ブラッドリー	迷いすぎだぜ、中央の騎士様。勝負の時は直感も大事だ。
カイン	なら、こっちだ。
ブラッドリー	お？本当にいいのか、それで。
カイン	……、じゃあ……。
ブラッドリー	あーあー、そうだろうなあ。てめえはそう来ると思ったんだよなあ。
晶	珍しいですね、カインとブラッドリーが一緒にいるなんて……。カードゲームですか？
カイン	ああ、賢者様。二人でたまにやってるんだ。
	ブラッドリーは揺さぶりが上手くて面白い。
ブラッドリー	てめえはフェイントに引っかかりすぎだ。
	剣で戦ってても牽制や目眩しくらい使うだろ。どうしてカードで出来ねえんだよ。
カイン	不思議だよな。体が勝手に動くまで落とし込めてないせいか？
晶	素直なのはカインのいいところですもんね。頑張ってください！
ブラッドリー	さあさあ、これで決まるぜ。どうするどうする。
カイン	むむむ……。
`},
{id:10941,title:"物々交換の達人",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリー、お帰りなさい!急にいなくなるから心配してたんです。
ブラッドリー	好きでいなくなったんじゃねえよ。まったく、どうにかならねえのかこの厄介な傷。
晶	くしゃみで飛んじゃうの大変ですよね。
	ところでその、肩に担いでるブロック肉は……。
ブラッドリー	おう、これか？さっきそこで交換してやった。今日はこれで豪勢にやろうぜ。
晶	交換ですか？
ブラッドリー	ああ。
	最初に飛ばされたとき、引っ掴んでたブランケットもそのまま持って行っちまってよ。
	そしたら目の前に震えてるばばあがいて……。仕方ねえからくれてやったんだ。
	礼に林檎をくれた。
晶	（こ、この流れはもしかして）
ブラッドリー	歩いてたら今度はジュース屋のじじいが林檎が足りねえっていうからよ。
晶	あげちゃったんですね。それでジュース屋さんからお礼をもらって、
	それもさらに誰かと交換して今に至る、と。
ブラッドリー	なんだおまえ、話が早いじゃねえか。
	いろいろ面倒だったが、でけえ肉持って帰れたことだし、まあ結果オーライだな！
晶	（ブランケットが最終的に大きなお肉に……。わらしべ長者かな？）
`},
{id:10942,title:"男の勲章",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリー。ずっと気になってたことがあるんです。
ブラッドリー	あ？なんだよ改まって。
晶	その顔の傷についてなんですけど……。
ブラッドリー	ああ、そんなことか。
	真面目な顔して聞いてくるから、何事かと思ったぜ。
晶	あれ、結構カラッとしてるんですね。
ブラッドリー	まあ、昔は暴れまわってたからな。いろいろあったんだが、男の勲章だよ。
	結構気に入ってんだぜ。
晶	ワイルドでかっこいいですよね！ブラッドリーらしくて素敵です。
ブラッドリー	はは、そうだろ。ただ、それだけで満足されちゃあ困るな。
晶	え、どういうことですか？
ブラッドリー	体だよ。顔にある傷だけが勲章だなんて小せえもんだ。脱いだらすげえぜ……見るか？
晶	え……そんなに傷跡が残るなんて、ちゃんと治療したんですか！？
	痛いのは我慢したらダメですよ
ブラッドリー	…………おまえ、変な奴だな。
`},
{id:10943,title:"北の国の常識人？",type:"personal",characters:["北"],memo:"ブラッドリー",
text:`晶	ブラッドリーもバーに来るんですね。いつも部屋で飲んでるイメージでした。
ブラッドリー	ここの雰囲気は悪くねえからな。
	しかしじじいども、よくそんな甘いもんばっか飲めるな。
スノウ	やかましいわい。可愛い我らにぴったりじゃろうが。
ホワイト	我らは野蛮なおぬしとは違うからのう。
ブラッドリー	はっ、酒に弱えだけだろ。
スノウ	むむう！ブラッドリーちゃん、いつからそんな反抗期になったんじゃ！
ホワイト	我らは寂しいぞ！
ブラッドリー	うるせえ、ギャーギャー騒ぐな。ミスラも氷を手づかみで食うなよ。
ミスラ	何故です。別にあなたに迷惑かけてないでしょう。
オーエン	これ、蜂蜜みたいな色なのに全然甘くない。シロップを入れて美味しくしてあげるよ。
ブラッドリー	馬鹿野郎、勝手に人のグラスに触んな。おまえら、ちょっとは大人しくできねえのか！
晶	（北の魔法使いの中でブラッドリーが実は一番の常識人なのでは……？）
`},
//東
//ファウスト
{id:11001,title:"スポットの印象（１）",type:"personal",characters:["シノ"],memo:"ファウスト",
text:`シノ	シャーウッドの森はずっと平地だったけど、ここは山あり谷ありで面白い。
	山自体あまり来たことがなかったが、視界も悪いし、人や動物も隠れやすそうで、管理するのが大変そうだ。
晶	シノの故郷の森とは、結構違う感じですか？
シノ	全然違う。見たことのない生き物がたくさんいる。植物も虫も種類が多くて、楽しい。
	精霊も多いから気配がうるさいな。落ち着きがなくて、やたらと構ってくる。
	泊まっても、きっとゆっくりできない。
	オレ的には、ひとりになりたくて引きこもる場所って感じじゃないな。
晶	気配がうるさいって思うんですね……。
	たしかに、魔力のない俺でもざわざわした印象を受けました。
シノ	土地に慣れれば構わなくなるのかもな。
	魔力がみなぎってる感じで、精霊たちと親しくなれば強い魔法が使えそうだ。
	逃げ込んだ悪党を捕まえたりとか、何かを探したりとか、そういうことがしたい。
晶	（……たしかに、狙った獲物に飛びかかる寸前の猫みたいな感じになってるかも……）
シノ	ん？　今、何か聞こえたか？
	ちょっと見てくる。
晶	あっ！　シノ！あんまり遠くに行かないでくださいね！
	シノ……！
`},
{id:11002,title:"スポットの印象（２）",type:"personal",characters:["ネロ"],memo:"ファウスト",
text:`ネロ	はー……、なんだか、いかにも魔法使いっぽいところだな。
晶	そうなんですか？
ネロ	そうでもねえ？俺はもうちょっと、人がいる方が好きなんだよな……。どうしてもさ。
	こういう場所の方が、本当は楽なんだろうけどな。
	やっぱり、飯を作ったら誰かに食ってほしいって思っちまうからなあ……。
晶	たしかに、ネロの作った料理をネロしか食べられないのは、もったいない感じがします。
ネロ	優しいねえ、賢者さんは。まあ、若い時に集団生活してたせいかもしれねえな。
晶	それはファウストも同じじゃないですか？
	革命軍にいた頃は、たくさんの人と一緒に生活してたって聞きましたよ。
ネロ	あいつは自分があるからさ。
	人の中にいても、孤独な谷の隠者生活でも、それは変わらない。
	朝起きて、今日は何しようって決めて、自分の生活をして、満足して眠れるんだろう。
	……俺はそれだと、ちょっと寂しいんだよ。
	自分の面倒を見るよりも、人の面倒を見る方が好きなんだろうな。
`},
{id:11003,title:"スポットの印象（３）",type:"personal",characters:["フィガロ"],memo:"ファウスト",
text:`フィガロ	ここがファウストに優しい土地で良かったな。
	精霊が多いけど、あの子が気に入られてるのがわかるよ。
晶	土地に優しくされるんですか？
フィガロ	そう。土地の精霊に気に入られて、優しくされるから土地の魔法使いになるんだよ。
	俺も南の精霊に気に入られてるのさ。
	あの子は元から真面目で優しかったし、コツコツと努力ができるタイプだったから、東の精霊からも受け入れられたんだろうね。
晶	じゃあ、フィガロも歓迎されていますか？
	南の魔法使いも優しい気質だと思いますけど……。
フィガロ	うーん……。
	ここの精霊は、俺が最後には人間の味方しちゃうってわかってると思うんだよね。
	たぶん、ファウストは精霊達の肩を持ってこの土地を保とう
	って気持ちがあるだろうけど、俺はほら、今の所は思い入れもないし。
	人間がどうしても開拓したいって言うなら、じゃあいいよって言っちゃうのがなんとなくバレてる気がするな。
晶	そうなんですね……。
	土地の精霊と気が合わないと、力を発揮できなかったりするんですか？
フィガロ	発揮できないってほどじゃないけど、やりにくさはあるかな？
	膝まで水に浸かっているくらい。
	でもいいなって思うよ。この谷と、この谷で暮らしてるファウストのことをさ。
晶	いいなって、羨ましいってことですか？
フィガロ	そうだね。俺は絶対にさみしいもん。こんなところ、ひとりで堪えられないよ。
	なのに、あの子はこの谷の孤独に堪えて、むしろ癒されてたんだ。
	ここまでひとりでいるファウストって、そこまで不幸じゃない感じがするだろ？
	そういう感じがいいなあって。自分に合った療養所みたいなところだよね。
`},
{id:11004,title:"スポットの印象（４）",type:"personal",characters:["レノックス"],memo:"ファウスト",
text:`レノックス	この薬草は痛み止めに使うものです。南の国では見られない種類で……。懐かしいな。
	誰かが怪我をすると、昔はよく、ファウスト様が煎じてくださっていました。
~~~~~~~~~	~~~~~~~~~
選択	昔の革命軍の仲間にですか？
晶	昔の革命軍の仲間にですか？
レノックス	ええ。アレク様なんかは、特に怪我の多い方でしたから、手当てをしながらよく怒っていましたよ。
晶	アレクさんって、ファウストの幼馴染だった人ですよね。どんな人だったんですか？
レノックス	そうだな……。
	アーサー様のような勇猛果敢さと無垢さがあり、シノのような野心と決断の早さがあり……。
	フィガロ様やブラッドリーのように、智謀と策略に富んだ頭の冴える方でしたね。
	心理戦にも強かったです。
晶	……めっちゃハイスペックじゃないですか……？
レノックス	一国を築いた方ですしね……。
	けれど、根っこに幼さや、少し夢見がちな危うさもありました。
	革命が終わったらファウスト様と村に帰ってのんびり暮らせると、戦の半ばまで信じていらしたようでした。
晶	そうだったんですか……。
~~~~~~~~~	~~~~~~~~~
選択	レノックスも治療を受けたんですか？
晶	レノックスも治療を受けたんですか？
レノックス	もちろんです。戦をしていた頃は、怪我が多かったので、ファウスト様の薬はよく効きましたよ。
	母君や祖母君から教わったのだとおっしゃっていまいした。
晶	今みたいに魔法で治していたんじゃなかったんですね。
レノックス	フィガロ様がいらっしゃるまではそうですね。
	皆の知恵を集めて、弱い治癒魔法と薬を使って凌いでいました。
	フィガロ様が革命軍に加わって、魔法で治癒してくださるようになってから、たくさんの仲間の命が救われたんですよ。
晶	そうだったんですか……。
~~~~~~~~~	~~~~~~~~~
レノックス	……ここは、少し寂しいところですね。
	俺は、いつでも人に囲まれ慕われているファウスト様しか知りませんでした。
	だから……。
	町の中で人のふりをしているでもなく、森の中で本当にひとりでいらしたんだと……。
	そこは、どうしても、寂しくなってしまいます。
`},
{id:11005,title:"ブレイクタイム（１）",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`ファウスト	エルダーの木に花が咲いているな。時期でもないのに……。
晶	季節外れの花なんですね。これも精霊たちの影響でしょうか。
	俺たちが近づいてしまったから？
ファウスト	悪い発露ではないよ。精霊たちが気に入って魔除けに使う木だ。
	花はお茶やシロップに、実はワインになる。
晶	わあ、美味しそうですね！
ファウスト	……たしかに、このまま花を落として帰るのはもったいないな……。
ファウストの手元がふわりと光って、木で編んだ籠が、ふたつ現れた。
魔法に共鳴するように辺りの木々がざわめく。
強く風が吹いて俺とファウストの髪を揺らすと、
身を寄せ合うように枝先に咲いていた小さな花たちが、ほろほろと散り始める。
ファウスト	拾ってくれ。
籠を手渡されて、俺は花の群れている枝へ手を伸ばし、猫の喉を撫でる仕草でくすぐった。
ほろほろとこぼれ落ちてくる可憐な花を籠で受け止める。
雨粒のような小花がファウストと俺の髪や肩をかすめて行く。
晶	わー！　たくさん降ってきた！こんなに簡単に落ちてくるんですね！
	あはは、爽やかでいい匂い……。
隣で笑う吐息が聞こえて、子供っぽかったかと、少しだけ恥ずかしい気分になる。何も言わずに、ファウストは作業を続けた。
谷で暮らす間、何度も繰り返していただろう、慣れた手つきだった。
ファウスト	戻ったらシロップを作ろうか。果物と合わせて漬けても美味しくなる。
	きみも手伝ってくれるだろ？
`},
{id:11006,title:"ブレイクタイム（２）",type:"personal",characters:["ファウスト","ヒースクリフ"],memo:"ファウスト",
text:`ヒースクリフ	本当に、綺麗で不思議なところですね……。
	どんな森でもわりと好きになるんですけど、ここは特に居心地がいいというか……。
晶	精霊が多いと、魔法使いには騒がしく感じるって聞きましたけど、ヒースクリフに合ってたなら良かったです。
	でも、そろそろ戻った方が良くないですか？
	なんだか、この道の奥の方だんだん暗くなっていく気がしますし。
ヒースクリフ	あ……。……でも……、もう少し奥の方に行ってみたくて……。
晶	……なんだか珍しいですね。ヒースクリフがそんなことを言うなんて。
ヒースクリフ	…………。
	そう……、ですよね……。
ファウスト	そこから先は危険だ。戻れ。
ヒースクリフ	あ……。ファウスト先生。
ファウスト	悪い精霊に気に入られたな。ヒースは感応しやすくて見目好い。
	この谷に引き止めておきたがったんだろう。
	それ以上奥へ向かうと、森に囚われてしまう。あれを見てみろ。
ファウストに示された森の奥。重く暗い気配のする大樹の影を観察して俺は息を吞んだ。
大きな角を持った鹿のようなものが、様々な植物や、小さな花や、苔に覆われて、生死もわからぬ状態で囚われている。
獣とも植物とも言えないそれは、神秘的で恐ろしく、生々しくて美しい、森の不思議が生んだ芸術品のようだ。
ファウスト	大きくて立派な美しい角の牡鹿だろう。
	精霊たちに気に入られて、引き寄せられて、嵐の谷に取り込まれたんだ。
ヒースクリフ	……人間や魔法使いでも、あんな風になってしまうんですか？
ファウスト	なる。
晶・ヒースクリフ	…………。
`},
{id:11007,title:"スポットの思い出（１）",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	こんなところに家を作るのは大変そうですね。魔法で建てたんですか？
ファウスト	ああ……。少しずつな。
	ここに来たばかりの時、僕は怪我をしていて、最初は木の洞で雨を凌いでいた。
	食べるものもなくて、じきに死ぬだろうと思っていたが……。
	嵐の谷は、精霊たちの生命力がみなぎる強い土地だった。
	その影響なのか、なかなか死ねなくて……。だんだんと、怪我が治って来た。
晶	…………。
ファウスト	少しだけ動けるようになって、小さな小屋のようなものを建てたんだ。
	そこから年月をかけて家の形にしていった。
晶	……なんだか、壮絶な話ですね。
	動けないような怪我をして、じっとひとりで耐えてたなんて……。
ファウスト	あの時はひとりの方が楽だったさ。
	自暴自棄になっていて、不安定で、あの頃の、十数年の記憶はあまりないんだ。
	だけど……、不思議と幸運が続いて、生き延びたように思う。
晶	幸運……？ファウストの魔法ですか？それとも、土地の精霊？
ファウスト	たしかに、無意識に魔法を使っていたのかもしれない。土地の力もあるはずだが……。
	それだけではなかった気がする。
	どこかで祝福の魔法をかけられていたのかもしれないな。
`},
{id:11008,title:"スポットの思い出（２）",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	ここで呪い屋の仕事をしていたんですよね。
	呪いを職業にしたきっかけは、なにかあったんですか？
ファウスト	……嵐の谷にたどり着いた頃、僕は全てを憎んでいた。
	特に、僕や仲間を裏切った人間は、ひとり残らず呪ってやると思って、呪術について調べたんだ。
	様々な手段を試そうとして、必要なものを集めて、呪具も揃った頃に、谷に迷い込んだ魔法使いに出会った。
	そいつが、僕の家を見て、おまえは呪い屋なのかと尋ねてきた。
	違うとも、そうだとも、僕は答えなかったが……。
	呪い殺したい人間がいるから、手伝ってくれないかと言われた。
	僕に断る理由がなかった。
晶	そのひとが、お客さん第一号なんですか？
ファウスト	そうなるのかもな。
	礼は必要ないと言ったのに、向こうが勝手に支払って行って……。
	しばらくして、話を聞いたというやつがまたやってきた。
	……それ以降は報酬を受け取るようにした。
晶	じゃあ、頼み事を聞いてるうちに、口伝てで依頼がくるようになったんですね。
	でも、お客さんが魔法使いなのは意外でした。
	相手が人間でも魔法が効かなかったり、呪いを扱えない魔法使いがいるってことでしょうか？
ファウスト	魔法使いにも得手不得手があるし、呪いの魔法を使った影響が悪く出る者もいる。
	相手が人間だったとしても……。
	誰かの祝福の魔法を先に受けていたり、守護の効果のあるものを持っていたり、土地の幸運を独占しているとかかりにくい。
	客のほとんどは魔法使いだった。基本的には手を貸す形で依頼を受けていたよ。
`},
{id:11009,title:"ファウストへの印象（１）",type:"personal",characters:["シノ"],memo:"ファウスト",
text:`シノ	ファウストに出会って最初の頃は、あれも駄目これも駄目って、怒ってばかりのやつかと思ってた。
	でも、魔法の訓練が始まったら、なんでも手本を見せてくれるし、教え方も分かりやすくて上手い。
	魔力も強いし、実力を感じるところが好きだ。
	口やかましいだけじゃなくて、こいつがいうならって自然に思える。
晶	シノは、魔法舎に来てから、初めてちゃんと魔法を教わったんでしたよね。
シノ	ああ。オレとヒースの前の師匠は魔法がまるで駄目だったからな。
	今まで勘や感覚でやってたことに、理屈や仕組みがあったんだ。
	力の掛け方、心の在り方、不思議の力の理……。
晶	魔法にも、コツがあるってことですか？
シノ	ああ。運動だってそうだろ。目的によって鍛える場所や方法は違う。
	お行儀よくなんでも順番にやりたがるから、ちょっと焦れったいけどな。
	一度出来たことを何度も復習したり。
晶	あはは。ファウストの授業は基礎をしっかりやるスタイルなんですね。
シノ	初めは先生なんて必要ないって思ってたけど、今はオレの先生が一番だって思ってるぜ。
	オズや双子やフィガロやシャイロックに負けないでほしいし、いざ勝負をつける時が来たら命がけで援護する。
晶	勝負なんて……。仲間同士で争ったりしないでしょう？
シノ	そうかもな。でも、オレはちょっと試してみたい。
晶	（シノはたまに、身近なひとのことを、強いカブトムシみたい思ってるところがあるな……）
`},
{id:11010,title:"ファウストへの印象（２）",type:"personal",characters:["ヒースクリフ"],memo:"ファウスト",
text:`晶	ヒースクリフは、みんなが魔法舎で暮らし始める前から、ファウストと知り合いだったんですよね。
	ファウストのこと、どう思っていますか？
ヒースクリフ	ファウスト先生は命の恩人です。
	〈大いなる厄災〉との戦いで庇ってくれたことはもちろんそうですけど……。
	これからの長い人生の中で、先生から教わる魔法の知識に助けられることは、
	本当に多くなるだろうなって思うんです。心から感謝しています。
晶	ヒースクリフと会ったばかりの頃も、やっぱり親切だったんですか？
ヒースクリフ	そうですね。最初はやっぱり、少しだけ怖い人かなって思ってたんですけど……
	優しかったです。前の師匠の横柄な態度を見かねて声をかけてくれました。
	その時、呪文や魔道具についても教えてくれて。
	その日から、師匠のいいなりにならずにすんだんです。
	ちゃんとした呪文を使ったら、俺の方が強かったんですよね。
晶	なら、その時からファウストに助けられてるんですね。
ヒースクリフ	はい……。本当にその通りです。
	俺は貴族の生まれだったから、子供の頃から家庭教師がたくさんいて、先生たちに色々なことを教わって来たけど……。
	ファウスト先生が、一番の先生です。
`},
{id:11011,title:"ファウストへの印象（３）",type:"personal",characters:["ネロ"],memo:"ファウスト",
text:`晶	ネロから見て、ファウストってどんな印象ですか？
ネロ	ファウストか……。
	お互いに人嫌いなんだろうなって雰囲気があったから、煩わせないようにしてやろうと思ってたけど……。
	案外、テキパキしてるっていうか、思ったよりしっかりしてる感じだよ。
晶	たしかにファウストって、自分では引きこもりだなんて言いますけど、頼りになるし、なんでも自分でしますよね。
ネロ	そうそう。態度も大人だしな。居心地よくて付き合いやすいよ。
	たまに一緒に飲んだりもするんだ。
晶	二人で飲む時は、どんな話をしてるんですか？
ネロ	はは、お互いあんまりしゃべらねえんだけど……。
	最近どうだとか、今日はこうだったとか。他愛もない感じさ。
	でも、なんだかほっとするんだよな。
晶	よかった……。二人がいい関係を築けてて俺も嬉しいです。
ネロ	なんていうか、これだけ生きてて、もう、新しい友達なんてできねえだろうと思ってたんだけどさ。
	できるもんなんだなあって。
晶	…………。
ネロ	あー……。今のはちょっと、恥ずかしかったか……。
	ファウストには内緒な。
`},
{id:11012,title:"ファウストへの印象（４）",type:"personal",characters:["レノックス"],memo:"ファウスト",
text:`晶	レノックスはファウストと付き合いが長いんですよね。
	昔のファウストって、どんな感じでしたか？
レノックス	ファウスト様は、何もお変わりありません。
	最初に、名前だけ知りました。人間と手を組んだ、魔法使いの革命家がいるんだと。
	失礼ながら直接お会いするまでは、若さゆえの血潮で、気炎を掲げる勢いのままで大軍を率いている
	危うい人物かと想像していて……。
晶	予想は外れましたか？
レノックス	はい。凛として、生真面目で、けれど、どんな人の話にも耳を貸す柔軟さのある方でした。
	ただ、俺が出会った時期は、四六時中張り詰めていたせいか、あまり笑わない印象で……。
	真剣に考え事をしたり悩んだり、会議に出たり、まだ若かったから、大人のやり口に素直に傷つかれたりして。
	見守るような気持ちでお側にいたんですが、ある日、ふと余裕ができたときに、誰かの冗談でファウスト様が笑ったんです。
	それが、驚くほど屈託のない笑顔で。
	俺は思わず、「ファウスト様も笑うんですね」と……。
晶	レノックスが聞いたんですか？ファウストは、なんて？
レノックス	目を丸くして、それから、少しむっとして、「おまえに言われるとは思わなかった」と。
晶	あはは！
レノックス	俺たちも大笑いしました。それが、初めて二人で笑いあった思い出です。
	あの顔を、今でも覚えているんです。
`},
{id:11013,title:"ファウストへの印象（５）",type:"personal",characters:["フィガロ"],memo:"ファウスト",
text:`晶	フィガロとファウストは、昔から面識があったんですよね。
	ファウストのこと、どう思っていますか？
フィガロ	うーん、この話長くなるけど全部聞いてくれる？
	ひと晩くらいかかるから飲みながら話そうよ。
晶	……今日のところはさわりだけで……。
~~~~~~~~~	~~~~~~~~~
選択	初めて会った時のこと。
フィガロ	ファウストの名前は噂で聞いてたんだよね。
	革命家なんて、どんな粋がったやつが教えを請いに来たんだと思ったら……。
	素直だし、真面目だし、若くて見た目もいいし、そこそこ強いし、時代をときめく有名人だし。
	あっいいな、って思って。
晶	それでファウストを弟子にしたんですね……。
	それまでは、他の魔法を教わりに来た人はいなかったんですか？
フィガロ	頼まれはしたけどさ。
	せっかく俺が教えるのに、とも思うし、なんのために教わりたいとかもあるじゃない。
	強くなりたいって言われてもねえ。
	オズ以上は無理なのになーって思いながら自分の弟子を育てるのは何だか虚しいだろ？
	世界を良くするために魔法を教えてください、なんて言われたのは初めてだったからね。
	嬉しくて、浮かれてオズに報告しに行っちゃった。
~~~~~~~~~	~~~~~~~~~
選択	会えてない間のこと。
フィガロ	革命軍を離れてからしばらくの間は、ファウストのことも、中央の国のことも、
	わざと耳に入れないようにしてたところはある。
晶	フィガロ……。
フィガロ	俺がいないままのファウストや革命軍の栄光の問題なんて知りたくなかったんだよ。
	それでも、呪い屋になったって噂を聞いて心配したよ。
	きっとうらびれた汚いところで暮らしてるんだと思った。
	汚い髪で、汚い服を纏って、ケケケケケ……って笑ってる所を想像して、すごく絶望して悲しんでたのに。
	再会してみたら、あれだろ？隠れ家に来てみれば、これだろ？
	全然、元のままじゃないか！って思った。
	すごく嬉しかったよ。
~~~~~~~~~	~~~~~~~~~
選択	再会した時のこと。
フィガロ	もうその話するの？
	まあ、いいよ。昔のファウストの方が、退屈しないなってところはあるかもね。
	退屈しないなってところがありつつ、昔のファウストも気に入ってたから戻ってほしい気持ちがあるけど……。
	単純に戻って欲しいっていうよりは、らしくないことやめたら？って感じかな。
	きみから見てもわかるだろ？
晶	そう……ですね。どうしても悪い人には思えないというか……。
フィガロ	そうなんだよね。人を呪って喜ぶタイプじゃないんだもん。
	無理してるなって思っちゃうよ。
晶	フィガロなりに、大事にしていたお弟子さんだったんですね……。
フィガロ	そりゃそうさ。弟子にしたのも、二つ返事でってわけじゃない。
	「俺の修行に耐えられるかな」って感じでね。
	レノを二人で俺の家に訪ねて来たから、あの子だけ一年近く預かって、結構厳しくやったんだよ。
	それでも、ちゃんとついて来たからさ。意外と根性があるところも気に入ったし、志も高くて綺麗で可愛げもあって……。
	これが天命だったのかなって思いながら本腰入れてしばらく修行を続けて、いざ軍に合流したら、俺はお客さんだった。
	ありがとうございます。またいらしてくださいね。
	って、言われる前に家に帰ったんだよ。
`},
{id:11014,title:"スポットゆかりの話（１）",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	嵐の谷って名前に理由はあるんですか？　やっぱり嵐の日が多いとか？
ファウスト	嵐が生まれる土地だとか、嵐が必ず通る谷だと言われているな。
	精霊由来の天候変化が多いから、そう呼ばれるようになったんだろう。
	何もなければ、普段は落ち着いている。
晶	精霊由来って……、精霊が嵐を起こしたりするんですか？
ファウスト	そうだ。
	ここは精霊の数が多く力が強いために、ちょっとしたきっかけで場が脈動する。
	些細な刺激でも波紋が大きく広がって、岩場にぶつかった波が飛沫を上げるように、弾けたエネルギーが事故を起こす。
	その事故のひとつが嵐だ。精霊が騒いで場が狂乱すると天候が崩れることもよくある。
	植物が急成長したり、おかしな動物を呼び寄せたり、生物や気象や自然現象に影響が出るんだ。
晶	なるほど……。精霊を刺激するっていうのはどんなことなんですか？
	気をつけた方がいいんですよね。
ファウスト	元々は土地にない物が現れたりすることかな。馴染みのないものに敏感になる。
晶	えっ……。それじゃあ、俺たちが嵐の谷に来ること自体、刺激になってるんじゃ……。
ファウスト	そうだよ。きみたちが来てからずっと騒がしくしている。
晶	…………。
ファウスト	怖がることはない。普通にしていれば、危害を加えてくるわけじゃない。
	ただ、血を嫌がるから、怪我をしないようにな。
	誰かがやって来るとこうして精霊が騒ぐからすぐ気づけるんだ。
	僕にとってはとても暮らしやすい場所だよ。
`},
{id:11015,title:"スポットゆかりの話（２）",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	この辺り、いろんな花や草が植えてありますね。
ファウスト	ああ、あまり近寄らない方がいい。
	精霊を呼び集めたり、呪いや呪い返しに使うハーブだ。
~~~~~~~~~	~~~~~~~~~
選択	本当に人を呪ってたんですか？
ファウスト	は？呪い屋をしていたと言ったろう。信じていなかったのか？
晶	そういうわけじゃないんですけど、
	ファウストにそういうイメージがあまり湧かなくて……。
ファウスト	そんなことはない。　僕は呪い屋然としている。
~~~~~~~~~	~~~~~~~~~
選択	精霊を呼べるんですか？
ファウスト	精霊たちは香りに敏感だから、香を撒いたりすると集まって来るんだ。
晶	ファウストには精霊が見えるんですか？俺にも見られるでしょうか。
ファウスト	精霊には原則実体がない。自然や不思議の力そのもののことだ。
	人や動物の姿をしていれば見られるよ。
	彼らの好むものを食べ続けたり、鎖や刃物にまじないをかけて姿を映したり。
晶	そうなんですよね……。誰かを呪う時は、どんなものを使うんですか？
ファウスト	ここにあるハーブや、ハーブのオイル、針やキャンドルを使う術も多い。
	強い呪術には呪いたい相手の髪や爪や血液……。体の一部があるといいんだ。
	きみも誰かに髪や爪を寄越せと言われても
	絶対に預けたり取られたりしないよう気をつけておきなさい。
晶	わ、わかりました。
	でも、魔法舎でみんな一緒に暮らしてたら髪の毛なんかは落ちてそうですけど……。
ファウスト	だから初めはみんな嫌がっていただろう。
	互いに気を許しているように見えても、そういう部分の気は抜いていない。
	若い連中ならともかく、強い魔法使いの髪や爪は、隅々まで掃除しても手に入らないさ。
`},
{id:11016,title:"東の国について",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	長く暮らそうと思う土地を東の国にしたのには理由があったんですか？
ファウスト	…………。
	元いた場所には居られなかった。
	僕自身、一刻も早く、少しでも遠くへ離れたくて、行けるところまで飛んだんだ。
	誰も居ない場所ならどこでもよかった。
	誰にも会いたくなかったから、無意識に、森の多い東の国に向かったのかもな。
	暮らしてみたら理想的だったよ。
	穏やかすぎず、明るすぎず、他人とも必要最低限の関わりだけで過ごせた。
晶	じゃあ……、賢者の魔法使いになった時、
	東の国の魔法使いとして呼ばれたことに不思議はなかったですか？
ファウスト	…………。
	四百年も人と関わらずにいると、こうなるのかとは思った。
晶	…………。
ファウスト	ただ、今まで巡り合った誰よりも、
	この谷の精霊たちとの付き合いの方が長くなっていたからな。
	初めて来た時はえらく騒がれたものだったが、
	ずいぶん僕を買ってるじゃないかと、多少、気味のいい出来事でもあったよ。
`},
{id:11017,title:"〈大いなる厄災〉について",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`ファウスト	〈大いなる厄災〉が近づく夜は、世界に不思議の力がみなぎる。
	この辺りは特に精霊が多くて、場が狂乱したようになるんだ。
	ひと晩中、凶々しい気配と生命力に満ち溢れている。
	呪い屋としての仕事も特に捗る日だ。
	本気を出す時や手の掛かる呪術は、厄災が来る時期を狙って行っていた。
晶	（呪い屋の本気のお仕事か……。なんだか怖くて詳しく聞けないな……）
	厄災が近づくと、魔法使いも影響を受けて、体調を崩したりするって聞きました。
	ファウストは大丈夫だったんですか？
ファウスト	いつもそれなりに備えていたからな。だいぶ安定して暮らせていた。
	騒がしくて、眠るのに多少苦労するくらいだ。
	だが、そうだな……。たまにだけ、調子の悪い時に重なってしまうことがあって……。
	そういう夜は決まって、いつか感じた怒りや憎しみが、生々しく蘇るんだ。
晶	……それは……、かなりつらそうですね……。
ファウスト	ただ、数十年前に賢者の魔法使いに選ばれてからは、厄災のやって来る夜も気が紛れていた。
	堪えて苦しむことも、どうにか発散しようとしてくたびれることもなくなった。
	面倒な役目だけど、そこだけは良かったと思っている。
`},
{id:11018,title:"嵐の谷での暮らし",type:"personal",characters:["東"],memo:"ファウスト",
text:`晶	こういう場所だと、一日どんな感じで過ごすんですか？
ファウスト	魔法舎にいるときも引きこもってほとんどひとりなんだ。あまり変わらないよ。
シノ	そんなことないだろ。森での暮らしと魔法舎の生活は全然違う。
ファウスト	自分のことを自分でする時間が主になるだけだ。
	夜明けに起きて水を汲んで……。
	顔を洗って、食事の確保をして、掃除や繕い物や大工仕事をして、少し休んでいるうちに日が暮れる。
	そうしたら、夕食を作って食べて眠る。呪い屋の仕事があればやっていた。
~~~~~~~~~	~~~~~~~~~
選択	衣類について聞く。
晶	衣類はどこで買っていたんですか？
ファウスト	着るものにこだわりはない。
	山の麓まで行くと小さな村があって、布だけ手に入れて、魔法で作ることが多かった。
ヒースクリフ	いつも着ている服、先生の手作りだったんですね……。
	服装のせいか、最初は少し近寄り難かったんです。
ファウスト	呪い屋らしいだろ。
ヒースクリフ	そう……ですね……。
	でも、先生の授業を受けるようになってからは、少し印象と違うなって、感じるかもしれません。
	明るい服を着た先生も、いつか見てみたいです。
~~~~~~~~~	~~~~~~~~~
選択	食事について聞く。
晶	食べ物はどうしていたんですか？
ネロ	家の裏に小さい畑があったよな。
	この辺り、ハーブもキノコも木の実も多いし、食うには困らなかったんじゃねえの？
ファウスト	よく見ているな……。
ネロ	魚や肉はちゃんと食ってたのか？
ファウスト	川に魚がいる。山鳩や雉も。
ネロ	あはは、ご馳走じゃん。あんた、なんだかんだ生きる力が強いよな。
	そういうところ好きだよ。
~~~~~~~~~	~~~~~~~~~
選択	住まいについて聞く。
晶	家の中も質素で綺麗でしたよね……。
	俺が見た限りだと、あまり呪い屋って感じがしませんでしたけど……。
シノ	呪具は多かったな。棚にしまってあった。
	なあ、ベッドをもっとでっかくするか、二つ置いておけよ。
ファウスト	は？　何のために？
シノ	たまにみんなで泊まりに来よう。西のやつらはよくシャイロックの店に行くだろ。
	隠れ家みたいな場所がオレたちにも欲しかった。
ファウスト	ひとの家を勝手に溜まり場にするな。
シノ	いいじゃないか。この谷も、ファウストの家も、オレは気に入ったぜ。
`},
{id:11019,title:"スポットの人々",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	この辺りに人間は住んでいないんですか？
ファウスト	山の麓まで行けば小さな村がある。あの山を越えていったところには街もある。
晶	ずいぶん遠いな……。じゃあ、本当に人間が滅多に来ない場所なんですね。
ファウスト	ああ。東の国の人間なんて、魔法使いと聞けば忌み嫌い、避けるやつばかりだ。
	悪い噂を撒いてくれるからこちらも助かってたよ。
	たまに迷い込む者がいるくらいだな。
	狼の声で脅かして、山を下りる道に誘導したりはしていた。
晶	親切ですね……。その人がもし怪我をしていたら、どうしてましたか？
ファウスト	……まあ、魔法で手当くらいは。
晶	……ファウストって、やっぱり優しいですよね。人が憎いなんて言っているのに……。
ファウスト	憎いさ。
	けど、きみだって、例えば蛇が苦手でも、怪我をしている蛇なら助けるだろう。
晶	……そう、ですね……。いや、どうかな……？
	ファウストは蛇でも助けるんですか？
ファウスト	まあ……、暇だったら。
晶	でも、だいたい暇なんですよね。
ファウスト	何が言いたい。
晶	いえ……。助けてもらった人たちは、感謝してただろうなって思ったんです。
ファウスト	感謝なんて必要ない。僕は早く谷から出て行って欲しかっただけだ。
	魔法使いに恩を返したいなんていう奴は、変に生真面目で、二度と来るなと言い聞かせるのが大変なんだよ。
`},
{id:11020,title:"スポットにいた魔法使い",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	わ……！　この花、急に光り始めましたよ。……綺麗だけど、何か危険なものですか？
ファウスト	いや。あの山の奥に住んでいる魔法使いが戻ってきたみたいだ。
	あちらも珍しく出掛けていたんだな。
晶	魔法使いが近づくと、花が光るんですか……？
ファウスト	谷に住む精霊たちが魔法使いの気配を察知して共鳴し、反応しあっている。
	その影響で森に不思議な現象が起こるんだ。
	どこでもあることだが、この谷は特に精霊の力が強くて、遠くまで反応する。
晶	なるほど、これも精霊の影響だったんだ……。
	あの山の魔法使いって、つまりはファウストのご近所さんってことですよね。
ファウスト	まあ、そうなるな。
	顔を合わせたことはないが、僕よりも昔からこの谷に暮らしていた。
	僕の他にも数人の魔法使いが、嵐の谷に住み着いている。
	精霊の力も手伝って、みな、互いの気配は感じ合っているはずだよ。
晶	数百年も暮らしているのに、一度もお隣さんに会ったことがないんですか？
ファウスト	わざとさ。
	こんな所に住んでいるのは誰にも会いたくない人種だと分かっているから、互いに干渉しないだ。
	お互いのテリトリー意識も強い。
	僕もあの高い木よりも向こうに立ち入ったことはないよ。
晶	気配って、どんなものですか？
	さっきみたいに花が光ったりすれば、俺にもわかるんですけど……。
ファウスト	言葉にはしにくいな。
	雰囲気に近いが、寄り付く精霊の気質も似ているから、人物像はうっすら感じ取れる。
晶	今も嵐の谷に魔法使いがいるんですよね。
	みんな、いい人たちなんですか？
ファウスト	僕は関わり合いがないからな。良いか悪いかはきみの基準だろう。
	だけど、よそ者だった僕がここに住み着いても追い出したりしなかった。
	元々は誰かの縄張りだったはずだが、譲ってくれたんだ。
	そのことにはずっと感謝している。
`},
{id:11021,title:"危険な場所",type:"personal",characters:["アーサー","ファウスト"],memo:"ファウスト",
text:`突然、前触れもなく風が起こって、辺りの枯葉が舞い上がった。
晶	わ、わあ……っ！　な、なんでしょう、これ……！？
アーサー	なんだか……、この土地の精霊に拒絶されている気配がします。
晶	えっ、アーサーがですか！？
アーサー	おそらく……。　少し、説得してみます。
強い風が枯葉を宙にかき集める。その塊は、恐ろしい形相をした人の顔のように見え始めた。
ざわざわと森がうごめく。じっとその様子を見つめていたアーサーが、凶々しい気配へ手を伸ばした。
アーサー	どうか気を鎮めてくれ。おまえたちを脅かす者ではない。　私は……。
ファウスト	……ッ、馬鹿か！
晶	枯葉が元に戻った……！　怖い気配も消えた……？
ファウスト	危険なものだと見てわかるだろう！　どうしておまえはいつも……！
	……あっ……。……すまない、咄嗟につい……。
アーサー	…………。
	今のはファウストが？　私を？　はたいたのか？
ファウスト	おい……。生まれて初めて叩かれたような顔をするな。罪悪感が増すだろ。
アーサー	生まれて初めて叩かれた。
	オズ様も、城の者にも、そのように叱る者はいなかったから……。
ファウスト	な……。嘘だろ？
	……いや、慌てたとはいえ、僕が悪かった。オズには黙っていてくれ。
アーサー	いや、なんだか新鮮だった！　助かった、ファウスト。
晶	（ファウスト、昔の友達に似てるからって思わずツッコんじゃった動きだったな……）
`},
{id:11022,title:"ファウストの評判",type:"personal",characters:["ネロ"],memo:"ファウスト",
text:`ネロ	ふーん。先生、この辺りの精霊にだいぶ好かれているみたいだな。
晶	精霊に好かれているかどうかって、どうやって判断するものなんですか？
ネロ	魔法使いなら、魔法が使いやすくなる。息がしやすいとか、身体が軽い感覚に近いか。
	ここでは、ファウストの知り合いってことで、俺たちも歓迎されてるんだろうな。
	最初は警戒されてたけど、だんだん馴染んで来た感じがするよ。
晶	なるほど……。
ネロ	あとは、そうだなあ、普段はあまり近づかない種類の精霊が顔を出してたり、家のそばにいたりする。
	呪いとかの気配が苦手なやつらも。
	そういうのは、呪いの魔法なんて使ってたら、普通は戻ってこなくなっちまうもんだが……。
	ファウストが呪術を使うたびにいなくなって、それでもまた寄って来てるんなら、相当好かれてるってことだろうな。
晶	そうなんですね。精霊に好かれるのに、何かコツとかはあるんですか？
ネロ	この谷の精霊は特に東の国っぽい性質だから、干渉しすぎず、寄り添うように魔法を使う、ファウストみたいなやつが好きなんだよ。
	北や、中央の魔法使いなら、もっと使役する感じで魔法を使うんだけどさ。
晶	それは、どういう……？
ネロ	あー、わかりにくよな。
	例えば中央の精霊は、魔法使いをリーダーにして力を合わせたり、主従の関係性で動くのが好きだよ。
	北の精霊は、北の魔法使いを気質が同じさ。
	自分より強いやつだけ従って、隙を見せればすぐに牙を剥いてくる感じ。
	ファウストは、この谷の性質に極力合わせて魔法を使ってたんだろう。
	そういう優しいとこが評判いいんじゃねえかな。
`},
{id:11023,title:"スポットの名物",type:"personal",characters:["ヒースクリフ"],memo:"ファウスト",
text:`ヒースクリフ	あっ、嵐塩……！
不意にヒースクリフが小さな声を上げた。彼が指差した木々の間に、何かがキラキラと光っている。
晶	あれは……、小さな竜巻？光る竜巻ですか？
ヒースクリフ	あれは嵐塩です。砂嵐みたいに移動する塩なんです。
	……あっ、見失っちゃう。賢者様、追いかけてもいいですか？ 
	ネロが欲しがっていたんですけど、呼んでいる時間もなさそうで……。
晶	は、はい！
ヒースクリフ	嵐塩は北に向かって移動するので、
	瓶に入れて方角を調べたり、魔除けや危険察知にも使えるんです。
	シノも森番の仕事用に持っていました。塩だから、もちろん料理にも使うんですけど。
晶	山で塩が採れるなんてすごいですね！？　もしかして、珍しい種類なんですか？
ヒースクリフ	そうなんです。
	今追いかけてるのは南向きに移動していて、滅多にないもので……。
	追いつけそうだ……。
	《レプセヴァイヴルプ・スノス》！
ヒースクリフが呪文を唱えると、蓋つきの瓶が現れた。
晶	どうやって捕まえるんですか？
ヒースクリフ	あの中に飛び込んで瓶をかざしていると勝手にいっぱいになるんです。
	俺、ちょっと採ってきますね！
晶	気をつけてくださいね……！
ヒースクリフ	大丈夫です、危なくはな……。
	ッ……、いた、痛たたた滲みる……！　あっ、あっ、しょっぱ……！
晶	ヒース……！
	（天然の塩揉みだ……！でも、ヒースが擦り傷作ったらシノが心配しないかな……！？）
`},
{id:11024,title:"スポットでの発見",type:"personal",characters:["シノ"],memo:"ファウスト",
text:`シノ	賢者、これを見てくれ。
晶	うわ……。　毒々しいくらい真っ赤で、大きな花ですね……。
シノ	強そうで、綺麗だ。
	ヒースに見せてやりたい。だけど、摘んだらすごくまずい気配がする。
晶	まずい気配？
シノ	精霊が、こいつは取るなって言ってる。
	しゃべってるのが聞こえるわけじゃないが、そういう気配だ。
	だが……。精霊より、オレの方が上だしな。
晶	…………？
	なんだか急に、森の温度が下がったような……。
シノ	賢者。この花を手折ったら、何かやばいことが起きると思ってるだろ？
晶	はい。
シノ	オレもそう思う。
	迷うな……。
	この花に何か災いがついてたら、奥様に見せた時に迷惑がかかるかもしれない。
晶	迷うならやめましょううよ！？
	それか、せめて、ファウストに相談してからにしませんか？
シノ	たしかに。
	ファウストのところに持って行って、やばかったら浄化してもらえばいいのか。
	さすがだぜ、賢者。――よし。
晶	そ、そうじゃなくって……！
シノ	《マッツァー・スディーパス》！
`},
{id:11025,title:"楽しい場所",type:"personal",characters:["ラスティカ"],memo:"ファウスト",
text:`ラスティカ	おや、これは……。
晶	……わ、すごい！　絵本に出てきそうな赤いキノコですね。
ラスティカ	形は可愛らしいのですが、これには毒があるんですよ。
晶	めっちゃそんな感じがします。
ラスティカ	けれど、妖精達のダンスパーティーの目印でもあります。
	ほら、円を描くように生えているでしょう。
	この円の外側を踊りながら周っていると、妖精たちのダンスに混ざることができるんですよ。
ラスティカは右手をひらめかせると、木で作ったフルートのような笛が現れた。
魔法に反応したように、ざわざわと、あたりの木々が騒ぎ始める。
晶	混ざるって……。もしかして、俺も妖精を見られるってことですか？
ラスティカ	ええ。以前、ご覧になりたいとおっしゃっていたでしょう。
	僕が演奏しますから、賢者様はダンスを。
晶	お、踊りですか！？　俺、盆踊りくらいしか踊れないんですが……。
ラスティカ	素晴らしい！　異世界のダンスなのですね。
	妖精たちは好奇心旺盛ですから、みな、きっと歓迎してくれますよ。
	まずは、時計周りに三周。
晶	（むっ……無茶振りだけど……、妖精は見てみたい……！！）
	えーい！
	みーぎ、ひだり、パパンがパン。まーえ、まーえ、パパンがパン。
`},
{id:11026,title:"マナエリア",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
ファウスト	……それは、マナエリアのことじゃないのか？
	マナエリアは、精神を落ち着かせ、集中させて、魔力を高めるために訪れる、それぞれの原風景のような場所のことだ。
晶	きっと、それです！　ファウストにもマナエリアがありますか？
ファウスト	僕のマナエリアは、深い森や、山の奥深くの、火のそばだな。
晶	火のそば……。焚き火とかでしょうか？
ファウスト	ああ。
	自然の静けさを感じながら、炎の揺らめきを見つめているうちに、同じ熱が胸に宿る。
	静寂の中の小さな光が、僕の魔力を呼び覚ましてくれる。
晶	クールな印象だったのに、
	魔法を使うファウストの心の中で火が燃えているなんて、少し意外です。
ファウスト	……怨みの炎だ。決まってるだろ。
`},
{id:11027,title:"アミュレット",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	ファウストもアミュレットを持っていますか？
ファウスト	ああ。僕のアミュレットはそこにあるキャンドルだ。
ファウストが机の上で火を灯しているキャンドルを視線で示す。赤い炎がゆらゆら揺れていた。
ファウスト	魔力を保つには、普段暮らす場所でも、マナエリアを身近に感じられる方が好ましい。
	そのためにアミュレットを置いておく。
	僕のマナエリアは深い森の火のそばだ。
	陽の光よりも、炎の明かりに使う方が落ち着く。
晶	なるほど……。
	ファウストの部屋、独特な雰囲気だなって思ってましたけど、魔力に必要な感じだったんですね……。
ファウスト	は？　趣味だけど。
晶	（趣味なんだ……）
	あと、カーテンが燃えないように、気をつけてくださいね。
ファウスト	…………。
晶	（あ……。位置を直してる……）
`},
{id:11028,title:"鏡の話",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	すみません、ファウスト。明日の討伐に関して、相談があるんですが――。
	あっ……。床に鏡が落ちていますよ！
ファウスト	壁にかけていたのが落ちたんだな。あとで直しておくよ。
晶	……ファウストの部屋には鏡がたくさん飾ってありますよね。
	夜、怖くなったりしませんか？
ファウスト	なにを怖がる必要があるんだ。
晶	俺のいた世界には鏡にまつわる不思議な話が多かったんです。
	例えば――。
~~~~~~~~~	~~~~~~~~~
選択	ムラサキカガミの話をする
晶	ムラサキカガミという言葉を、２０歳まで覚えていると、鏡の破片に全身を刺されて死ぬみたいな話があって。
ファウスト	きみの世界の呪いの言葉ということか？
	だが、僕はそんな呪い聞いたことがないし、その言葉に特別な力も感じない。
~~~~~~~~~	~~~~~~~~~
選択	合わせ鏡の話をする
晶	鏡を二枚合わせると別の世界への入り口ができて、無理やり異世界へ連れていかれてしまうと言われているんです。
ファウスト	きみはその合わせ鏡とやらをしてこの世界にやってきたのか？
	違うなら迷信の可能性が高いと思うが。
	全てを否定するわけではないが、不必要に怖がることもないんじゃないか。
~~~~~~~~~	~~~~~~~~~
晶	そうですよね……。なんだかちょっと安心しました。
	ありがとうございます、ファウスト。
ファウスト	……まあ、僕の部屋に来る度にきみに怯えられるのも癪だからな。
`},
{id:11029,title:"家族",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	差し支えなければ、ファウストの家族のことを教えてもらえませか？
ファウスト	家族……？　唐突だな。
晶	ファウストの優しくて真面目な部分は、ご家族の影響なのかと思って。
	呪い屋になる前にどんな暮らしをしていたのか、聞いてみたかったんです。
	話すのが嫌なら、言わなくても構いませんが……。
ファウスト	……別に、普通だよ。子供の頃に父親がいなくなった。
	そのあとは母親と妹と、祖父母の家で暮らしていた。
	その時代は今より魔法使いが忌み嫌われていて、僕も魔法のことは隠していたが……。
晶	見つかってしまったんですか？
ファウスト	……ああ。同じ年頃の子供だった。猫の怪我を治しているところを見られて……。
	だが、言いふらしたりせずにいてくれた。
晶	よかった……。優しい人達がいる場所に住んでいたんですね。
	その子とは友達になれましたか？
ファウスト	…………。
	どうだったんだろうな……。
	間も無く、住んでいた村も戦乱に巻き込まれ、成長したそいつに戦地に赴こうと誘われた。
	僕はついて行ったが……。
	それが良いことだったかどうか、長い時間考えているが、答えは出ないままだ。
`},
{id:11030,title:"若い魔法使いたちへ",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`ファウスト	賢者か。何を食べている。
晶	……わっ！　びっくりした……。チョコレートです。ファウストも食べますか？
ファウスト	貰おう。疲れて、甘いものが欲しかった。
晶	大丈夫ですか……？今日は確か、魔法の実践の授業で森に出かけていたんですよね。
ファウスト	シノもヒースも熱心なのは結構だが、相手をするのには体力を使うな。
	何度も、今日はここまでと言ったのに聞かなくて、こんな時間だよ。
~~~~~~~~~	~~~~~~~~~
選択	シノの様子はどうでしたか？
ファウスト	シノは特にやる気がある上に、負けず嫌いなところがあるからな。
	注文通りに付き合ってるとくたくただ。
	ヒースも、シノ相手には意外と張り合う節がある。
	お互いに刺激しあっていて、いい環境だな。
~~~~~~~~~	~~~~~~~~~
選択	ヒースの様子はどうでしたか？
ファウスト	普段は大人しいが、一度集中すると、同じことをずっと繰り返していても苦にならないタイプだ。
	新しいことを教えると、ヒースが先に覚える。そうなると、シノも黙っていないだろ。
	お互い刺激しあっていて、良い環境だな。……二人を見ていると、若い頃を思い出す。
	僕はもう、手放してしまったけど、熱意や切実さや、そんなようなもの……。
	だから、柄にもなく、応えたくなるのかもな。
~~~~~~~~~	~~~~~~~~~

晶	……魔法の訓練、上手く行ってるみたいで良かったです。
ファウスト	…………。少し、話しすぎたな。
晶	俺は話が聞けて嬉しかったですよ。
	今日はゆっくり休んで、明日からもまた、頑張ってくださいね。
`},
{id:11031,title:"師匠と従者",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	レノックスは、ファウストがかつて英雄だった時の従者だったんですよね。
ファウスト	人違いだ。英雄だった覚えはない。
晶	でも、レノックスが言うには……。
ファウスト	…………。
	……くそ。彼を嘘つきにするわけにはいかないじゃないか。ああ、その通りだよ。
晶	（珍しい……。
	　レノックスは誠実な人だから、そんなところにファウストも弱いんだろうな。）
	レノックスが従者で、フィガロが師匠だったんですよね。
ファウスト	は？　違うけど。あいつはそんなことを吹聴しているのか？
	そればかりは本当の本当に違う。
晶	（今度はどっちが本当だ……？）
~~~~~~~~~	~~~~~~~~~
選択	そうなんですね。
ファウスト	……多少、師事してもらったことはある。だが、あいつは勝手にいなくなった。
	そんな無責任な師がいるものか。
~~~~~~~~~	~~~~~~~~~
選択	そうなんですか？
ファウスト	あいつの言うことに騙されるな。今だって無名の魔法使いの振りをしているだろ。
	人を騙して、馬鹿にするのが好きなんだよ。
晶	（そんなこともないと思うけど……。レノックスとは逆で、信用がないんだな）
	昔はレノックスをフィガロと３人で、遊んだりしたことがあったんですか？
ファウスト	遊ぶ余裕がある時代ではなかった。
	……だが、まあ、慕っていた偉大な魔法使いと、信頼する部下といる時は心安らかだったよ。
	もう二度と戻りはしないがな。
`},
{id:11032,title:"放っておけない",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	（廊下の隅で誰かうずくまってる……？　あれってもしかして……！）
	ファウスト！　何処か具合が悪いんですか！？
ファウスト	……大丈夫だ。心配かけたな。
晶	顔、真っ青じゃないですか。フィガロに診てもらいましょう。
ファウスト	少し目眩がしただけだ。僕のことは放っておいてくれ。
晶	今日の討伐で怪我をしたと聞きました。無理をしているんじゃないですか？
ファウスト	きみは心配性だな。大丈夫だと言っている。
晶	じゃあ、せめて部屋まで送らせてください。俺の肩貸しますから。
ファウスト	きみの肩を借りることになるとはな。……ありがとう。
`},
{id:11033,title:"危険な落し物",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	あのキラキラしたのは……イヤリング？
	誰かの落とし物かもしれないし、届けてあげないと。
ファウスト	待ちなさい。
晶	こんにちは、ファウスト。もしかして、これはファウストのイヤリングですか？
ファウスト	違うが、それに触れないほうがいい。呪われるぞ。
晶	の、呪い！？　なんでこんなところにそんな危険なアイテムが……。
ファウスト	さあな。ミスラかオーエンあたりが、うっかり落としたんじゃないのか。
晶	（うっかりがすぎる……！）
ファウスト	《サティルクナート・ムルクリード》
	呪いを解いておいたから、もう触れても大丈夫だ。
	まったく、もっと気をつけて行動しろ。
晶	ありがとうございます。
	ちなみに呪われたまま拾っていたら俺はどうなってたんですか？
ファウスト	……聞きたいのか。
晶	……すみません、やっぱりやめておきます。
`},
{id:11034,title:"得意な魔法",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	ファウストは、得意な魔法ってありますか？ファウストにしか使えない魔法とか。
ファウスト	呪いをかけることだ。
晶	職業にするくらいですもんね……。　少し、物騒ですね。
ファウスト	ふん。
	僕の呪いは相手の幸運を操作する魔法だ。
	呪いを受けた本人に不幸を呼ぶ気質がなければ成立しない。
	呪ってくれなんて頼まれるようなやつは、普段から恨みを買う振る舞いをしてるんだ。
	自業自得なのさ。
晶	そんな……。誰からも恨まれないように生きるなんて、不可能じゃないですか……？
ファウスト	かもな。
	僕は、呪いたいほど恨む気持ちがあるが、同じ強さで呪われる覚悟も持っている。
	きみはどうなんだ？
`},
{id:11035,title:"ファウストのこと",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	このページに書かれていることって……。
ファウスト	賢者、真剣な顔をしてどうした。
晶	ファウスト！？え、えーっと……。賢者の書を読んでいたんですけど……。
[カップの倒れる音]
晶	すみません、紅茶が……！　濡れてないですか？
ファウスト	僕は大丈夫だ。それよりも、賢者の書の心配をした方がいいんじゃないか？
晶	わっ、びしょびしょだ……！　どうしよう、大切なものなのに……。
ファウスト	…………。
	《サティルクナート・ムルクリード》
晶	すごい。ページが元どおりになった……。ファウスト、ありがとうございます！
ファウスト	大切なものなら大切に扱え。次も僕がそばにいるとは限らないからな。
晶	はい、気をつけます……。
ファウスト	それに何が書いてあったのかは知らないが、もう夜も遅い。
	熱心になりすぎて、あまり夜更かししないように。
	『ファウストのこと最初はめっちゃ怖いし根暗いし近寄り難いと思ってた。
	　けど、なんだかんだ気に掛けてくれるし意外と優しい奴なのかも』
晶	（前の賢者様……俺も同感です）
`},
{id:11036,title:"紋章",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	賢者の魔法使いには、目印になる賢者の紋章が身体に現れるって聞きました。
	ファウストの紋章はどこにあるんですか？
ファウスト	左肩の後ろだ。僕の紋章は他の魔法使いよりも大きめに出ているみたいだな。
晶	そうなんですね。少し見せてもらってもいいですか？
ファウスト	嫌だ。服をほとんど脱ぐことになる。
晶	そうか、ファウストの服、脱ぎ着するの大変そうですもんね……。すみません。
ファウスト	そういう問題か……？
晶	その位置だと、自分では見えませんよね。紋章が出たことには気付けたんですか？
ファウスト	紋章が浮かぶ時は熱を持って光る。
	始めは誰かから呪いを受けたのかと思ったが、それよりも忌まわしいものだったな。
	自分の背負った運命も、鏡越しでしか確かめられない。
	皮肉だが、僕にはふさわしいのかもしれないな。
`},
{id:11037,title:"ファウストと朝食",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	ファウスト。朝食の時間もいなかったですけど今起きたんですか？
	それとも体調が……。
ファウスト	体調は問題ない。
	今日は天気がいいから、日差しが落ち着くまで部屋に引きこもっていただけだ。
晶	天気がいいから、部屋にいただなんて少し珍しいですね。
	普通は逆のタイプが多い気がしますが……。
ファウスト	普通なんて知らないよ。僕は引きこもりだから、日差しなんて似合わない。
	それより、きみはここで何をしているんだ。
晶	ファウストの様子を見にきたんです。
	今日のネロの朝食がとても美味しかったんですよ。
	だから、ファウストも食べないと勿体ないと思って、呼びに来たんです！
ファウスト	もう朝食の時間とはいえないが……まあ、せっかくの料理を余らせるのも悪いしな。
	行くとしようか、賢者。
`},
{id:11038,title:"お土産をファウストに",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	こんばんは、ファウスト。
	今日は中央の都に出かけたので、お土産を買って来たんです。
ファウスト	……わざわざ僕に？必要ないのに……。何だ？
晶	似合いそうな毛糸の帽子なんです。
	いつも帽子を被ってるから、好きなのかと思って。
ファウスト	……似合いそうか？　これ……。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
ファウスト	読書。　他にすることがないときは、何もしていない。
	最近は、魔法の授業の資料を事前に作ることがあるくらいか。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
ファウスト	呼ばないよ。自分の部屋に誰か来るのは嫌いだ。引きこもりだからな。
	双子やフィガロが勝手に入って来て迷惑することがある。
	最近はシノもだ。きみからもやめるよう伝えてくれ。
~~~~~~~~~	~~~~~~~~~
~~~~~~~~~	~~~~~~~~~
選択	一日のタイムスケジュールは？
ファウスト	起きて、世界中を呪って、食事をして、授業をする日はする。
	夜は夢を見ないように祈って眠る。その繰り返しだ。
~~~~~~~~~	~~~~~~~~~
晶	外出するのもいいと思いますよ。
	少しファッションを変えてみたら、気持ちが明るくなるかも……。
ファウスト	余計なお世話だ。……まあ、土産はありがとう。次からは気を遣わなくていいからな。
晶	気に入りませんでしたか？　ちょっと被ってもらえませんか？
ファウスト	今は遠慮しておく。あとで、ひとりの時に試してみるよ。
`},
{id:11039,title:"先生のお仕事",type:"personal",characters:["ファウスト","フィガロ"],memo:"ファウスト",
text:`フィガロ	やっぱり、こういう引っかけ問題も入れておかないと。
ファウスト	相変わらず底意地が悪いな。
晶	二人とも、何をしているんですか？
フィガロ	やあ、賢者様。次の訓練で筆記試験を出すから、その問題を作ってたんだ。
晶	魔法の訓練なのに、筆記試験もあるんですね……！
ファウスト	魔法の訓練はただ体を動かせばいいというものでもないからな。
フィガロ	今回は中々難問揃いだよ。でも、ミチルはどんな問題を出しても、毎回満点だけどね。
	やっぱり優秀な先生に似るのかな？
ファウスト	へえ、おまえには勿体ない生徒だな。
フィガロ	何？羨ましいの？　うちは優しくて努力家な子たちが多いからな～。
ファウスト	僕だって十分生徒には恵まれている。優しく、勤勉な子達だ。
フィガロ	あはは。今の言葉、きみの愛弟子たちに聞かせてやりたいね。
ファウスト	……うるさいな。
晶	（この二人って案外、気が合うのかも……）
`},
{id:11040,title:"気の合う二人？",type:"personal",characters:["オズ","ファウスト"],memo:"ファウスト",
text:`晶	ファウストとオズが一緒にいるのって、珍しいですね。何をしてるんですか？
ファウスト	東の国の授業のための資料作りをオズに手伝ってもらっていた。
	世界を支配した北の魔法使いに、頼み事をするのは気が引けたが、他の先生連中より、まだ生徒思いで誠実だ。
晶	そうなんですね……。
	意外ですけど、他の先生はスノウとホワイトとフィガロとシャイロックで、自由そうですもんね。
ファウスト	ああ。僕も意外だったが、助かっている。　なあ、オズ。
オズ	……フィガロにはアーサーが幼い頃に、何かと世話になったからな。借りを返しているだけだ。
ファウスト	……？　何の話だ？
オズ	フィガロはおまえが初めての弟子だと。
ファウスト	は？　僕はフィガロの弟子じゃない。
	あいつへの借りを返すために僕に手を貸していたのか？
オズ	…………。
	フィガロはおまえが初めての弟子だと……。
ファウスト	違う。そういう理由ならオズの手助けを受けない。あいつと僕は無関係なんだ。
オズ	…………。
	……私が意外に生徒思いで誠実だから、おまえを手伝う。これならいいか？
ファウスト	…………。　なら、いいが……。
晶	（あ……。黙々と作業を再開した……。
	　魔王だとか、呪い屋だとか言われているのに、二人とも妙に真面目だよな……）
`},
{id:11041,title:"東の国の先生は",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	ファウスト、何を書いているんですか？
	ノートにびっしり文字が書いてあるみたいですが……。
ファウスト	きみはこの世界の文字が読めないんだったな。
	これはただの授業に使う用のメモだ。東の魔法使いたちの授業の傾向をまとめている。
晶	傾向？
ファウスト	筆記・実技・得意魔法・苦手魔法……。そういったことだ。
	別に面白いものでもないだろう。
晶	すごいですね……！
	けど、こんなにたくさん大変だったんじゃないですか。
ファウスト	別に。　事実を書いているだけだからな。
晶	（当然だと思ってるみたいだけど、
	　真剣にみんなのことを考えているからこそ出来るんだろうな。俺も見習わないと）
	こんなに熱心な先生を持てて、東の国の皆さんは幸せですね。
ファウスト	ふん……。どうだかな。
`},
{id:11042,title:"賢者と猫とファウストと",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	あ、よくここに遊びにくる子だ。よしよーし……。
ファウスト	そんなところにうずくまって、何をしてるんだ？
晶	あ、ファウスト！　見てください！
ファウスト	……猫か。
晶	最近遊びに来る頻度が増えた気がします。
	この子、餌を食べてる時の美味しそうな顔がすごく可愛いんですよ。
ファウスト	確かにな。それに随分ときみに気を許しているようだ。
晶	本当ですか？　それなら嬉しいですが……。
	初めて会った頃は威嚇ばかりされていましたから。
ファウスト	ふふ。間抜けな顔だな。きみに話しかけられて嬉しいんだろう。
	まったく、おまえは幸せそうでいいな。
晶	（えっ！　ファウストが頭を撫でたら３秒で寝た！？）
	俺だってこの子の寝顔はまだ見たことなかったのに……！
ファウスト	こら、静かに。この子が起きてしまうだろう。
晶	す、すみません。……俺の完敗です……。
`},
{id:11043,title:"東の国の反省会",type:"personal",characters:["東"],memo:"ファウスト",
text:`ファウスト	いいか、きみたち。
	今日の討伐は結果的に無事に終わったからよかったものの、まだまだ課題が多すぎる。
晶	（東の魔法使いたち……。
	　討伐から帰ってきたばかりなのに、反省会をしているみたいだ。真面目だ。）
ファウスト	まずはシノ。俊敏な攻撃は見事だった。だが、無鉄砲に突っ込みすぎだ。
	怪我でもしたら、他の皆にも迷惑がかかるんだぞ。
シノ	……次からは気をつける。
ファウスト	ヒース。きみはコントロールは上手いが、魔法を使うタイミングが遅い時がある。
	もう少し自信を持った方がいい。
ヒースクリフ	すみません、自分の反応が合ってるか不安になってしまって……。
	でも、いつまでもそれじゃいけないですよね。
ネロ	まあまあ。あんまりきつく言ってやんなって。
ファウスト	ネロ。お前も自分だけの力で強引に押し切ろうとするときがあるぞ。
	フォローするだけじゃなく、されることも覚えろ。
ネロ	はは……。わかったよ、ファウスト先生。俺ももっとこいつらを頼るようにするよ。
ファウスト	わかってくれたならいい。
	魔法の使い方について気になることがあれば、次の訓練で聞こう。
	今日は疲れただろう。皆、部屋に戻ってゆっくり休むんだ。
晶	（絶妙な飴と鞭のバランスというか……。ファウストは本当にいい先生だな）
`},
//シノ
{id:11101,title:"スポットの印象（１）",type:"personal",characters:["ファウスト"],memo:"シノ",
text:`ファウスト	広大で、静けさの保たれているいい森だ。
晶	そうですね……。でも、夜になると、少し怖くないですか？
ファウスト	僕はこういう場所が好きだから、いくらでも過ごせる。
	もう少し奥に行けば、人にも会わずに済むだろう。住んでもいいくらいだ。
晶	ファウストにしては、大絶賛ですね……。
ファウスト	ああ。ここは資源も豊富だ。
	きみの足もとに生えてる草も、そこの木の実も食べられるものだし、
	あっちに群生してる葉も薬草になる。
	……１００年くらいここで暮らしたいな。
晶	そんなにいい森なんですね……。
ファウスト	ああ。あの二人が、いい環境で育ったようで安心した。
	けど、黙って住み着いたら、森番のシノに追い出されるだろうな。
	ヒースクリフに許可を取ればいいのか？
	隠居して住処を変える時のために、二人には恩を売っておくとしよう。
晶	（ファウスト……。珍しくご機嫌だ……）
`},
{id:11102,title:"スポットの印象（２）",type:"personal",characters:["ネロ"],memo:"シノ",
text:`晶	魔法使いは、こういう森にいると元気が出るって聞きました。
	ネロも住んでみたくなったりしましたか？
ネロ	いやー……。俺はどうかねえ。気分転換に来るならいいだろうけど。
	住み着くとなるとちょっと寂しいかな。
	もっと拓けてる場所か、もしくは、暮らすのには少し厳しいくらいが好みかも。
晶	そうなんですか……。ちょっと意外でした。
ネロ	そう？
晶	なんというか……、賑やかな場所は煩わしいのかと、少し思っていたので……。
ネロ	ああ……。まあ、それはそうなんだけど。ほら、俺、料理以外無趣味だからさ。
	こういうやることなさそうな場所に長く居るのは苦手なんだよ。
	シノはこの森で暮らしてたんだろ？相当、一人遊びが上手いんだと思うぜ。
`},
{id:11103,title:"スポットの印象（３）",type:"personal",characters:["ルチル"],memo:"シノ",
text:`ルチル	わあ……、この森の土、とても柔らかいんですね。小川や池も見つけました。
	水が多くて緑がとても綺麗……。
晶	楽しそうですね、ルチル。シャーウッドの森、気に入りましたか？
ルチル	はい、とても！南の土地は痩せていて、ここみたいな深い森は育ちませんから。
晶	そうか……。南の国は、荒野や岩山が多いんでしたっけ。
ルチル	ええ。……あ、でも、私は故郷も大好きなんですよ。
	ただ、見たことのない草花がたくさんで、南の学校の生徒たちも連れてきてあげたいと思ったんです。
晶	確かに、魔法が使えない人たちには、移動が難しい距離ですもんね……。
ルチル	今の私では難しいですが、
	魔法舎でたくさん魔法の練習をして魔力が強くなったら……。
	大きな空飛ぶ絨毯にみんなを乗せて、ここまで連れてきてあげたいなと思うんです。
晶	……ルチルが、魔法で飛ぶ……？
	（めちゃめちゃ速く着きそうだ）
ルチル	やる気が出てきました！頑張ろうっと。
`},
{id:11104,title:"ブレイクタイム（１）",type:"personal",characters:["⑪"],memo:"シノ",
text:`シノ	ほら、賢者、この樹だ。この森で一番背が高い。
晶	わあ……、立派な樹ですね。
シノ	あそこの枝に毎年、軍艦鳥が巣を作る。今はないけど。
	あんたもどうせ、この森で一番高いのてっぺんに登ってみたいんだろ？
晶	えっ？い、いや、俺は特には……。
シノ	遠慮しなくていい。観光で来たやつらがよくねだるんだ。
	《マッツァー・スディーパス》！
晶	わ、わ、わあ……っ！！
シノ	よいしょ……。ほら、着いたぞ、賢者。
晶	たたたたたたた高い……！
シノ	どんな気分だ？
~~~~~~~~~	~~~~~~~~~
選択	さ、最高です……！
シノ	だよな。シャーウッドの森の夕焼けは綺麗だろ。
晶	こ、怖いところに来るだけの甲斐がありますね……！
	ありがとうございます……！
シノ	ガクガクしてるぞ、賢者。
~~~~~~~~~	~~~~~~~~~
選択	お、降りたいです……！
シノ	え？もう？せっかくてっぺんなのに。遠慮しなくていいぞ。
晶	マジのやつです……！
`},
{id:11105,title:"ブレイクタイム（２）",type:"personal",characters:["⑪"],memo:"シノ",
text:`シノ	ここからもっと東の奥へ行くと川があって、そこより北側は狼や熊が出るんだ。
晶	狼や熊……！？人が襲われたりするんですか？
シノ	近くに行けばな。でも、安心しろ。川よりこっちにはほとんど来ない。
	シャーウッドの昔話でそう言われてる。
晶	昔話……？
シノ	昔々、ずる賢くて悪い熊が、魔女を騙して食べ物を独り占めした。
	魔女は怒って、木の実を毒に変えた。
	熊は食べるものがなくなって、森の奥に引っ込んだ。そんな言い伝えだ。
晶	そうなんですね……。
	この辺りに熊が出て来ないなら、本当にあった話なんでしょうか？
シノ	あはは。昔話を信じるなんて、可愛いところがあるんだな。賢者。
	森の奥の方が餌がたくさんあるんだ。わざわざこっちに来ないだけさ。
	川のそばに、毒の木の実があるのは本当だけどな。
晶	なるほど。さすが、詳しいですね。
	シノに道案内を任せられたら、この広い森も安心です。
シノ	ふふん。まあね。
`},
{id:11106,title:"スポットの思い出（１）",type:"personal",characters:["⑪"],memo:"シノ",
text:`晶	シノとヒースクリフは、この森で魔法の練習をしてたんですか？
シノ	ああ。前にも話したが、オレたちには、魔法使いの師匠がいた。
晶	ヒースからも聞いたことがあります。
	ヒースとお師匠様が、二人で、賢者の魔法使いに選ばれたって。
シノ	そうだ。初めて会った時から胡散臭くて、適当なこと言うやつだって思ってた。
	でも、旦那様の紹介だったし、ヒースも真面目に付き合ってるから、オレも最初は従ってたけど……。
	結局、乱暴で、嘘つきで、いい加減なやつだったよ。
晶	そうだったんですか……。
シノ	ほら、あの木の上の方。幹に削れてるとこがあるだろ。
晶	あ、本当だ。獣の爪痕にしては、高い位置にあるような……。
シノ	オレがやった。
	強い魔法を試して失敗したんだ。
	師匠の適当な教え方のせいで、あの頃は力の制御がうまくできなかった。
	師匠の顔スレスレを、魔法の刃が飛んで……。
	師匠の片眉と、木の幹を削った。
	片眉のない師匠の顔は面白かったから、あんたにも見せたかったな。
`},
{id:11107,title:"スポットの思い出（２）",type:"personal",characters:["⑪"],memo:"シノ",
text:`晶	あそこの小屋の壁の下の方、何か書いてあるみたいです。黄色の線と、青色の線？
シノ	それは身長の記録。オレとヒースで、壁に線を引いていたんだ。
晶	二人とも、こんなに小さかったんですね。
シノ	当たり前だろ。誰だってガキの時代はあるからな。
晶	（この黄色の線、一つ一つの間隔が広い。成長期だったのかな
	 青色の線は小刻みに引かれてる。もしかして……）
シノ	おい、賢者。どうしたんだ、ぼうっとして。
	……あ。おい、あまり青い線の方は見るな！
	オレの成長期は、多分もうちょっとしたら来るはずなんだ。
`},
{id:11108,title:"スポットの思い出（３）",type:"personal",characters:["ヒースクリフ"],memo:"シノ",
text:`ヒースクリフ	森のこの辺りは、ブランシェット城の狩場になってるんです。
	貴族の間では、狩猟は一般的な娯楽なんですが、俺はあんまり得意じゃなくて。
晶	狩りですか……。俺もうまく出来なそうです……。
ヒースクリフ	賢者様もですか？
	俺は、獲物を見つけても、生き物だと思うと、可哀想で撃てないんですよね……。
	初めて狩りに出た時も一匹も獲れなくて。
	まあいいかなって思ってたんですけど、付いてきたシノが怒って……。
晶	シノが？
ヒースクリフ	手ぶらで帰ったら笑われる、周りのみんなにカッコつかないだろって。
	それで、どこからか兎を獲ってきたんです。
晶	あ……、ヒースの代わりに……？
ヒースクリフ	そうです。自分の手柄にしろって。もちろん喧嘩になりました。
	そんなの必要ないって言っても聞かないし。
	狩りなんて、酷いし、可哀想だけど……。
	自分で撃ったんじゃなければ、何も思わずに夕食で肉を食べるんですよね。
	シノは、そのことを、ちゃんと分かってたんだと思います。
晶	…………。
ヒースクリフ	俺はその夜、混乱して、悲しくなっちゃって……。毛布にくるまって泣いてました。
	翌日には仲直りできたけど……、未だに狩りは苦手ですね。
`},
{id:11109,title:"シノへの印象（１）",type:"personal",characters:["ファウスト"],memo:"シノ",
text:`晶	ファウストから見て、シノはどんな子ですか？
ファウスト	……口は悪いが、生い立ちの割に素直で、根が良い子供だ。
	苦難にあっても立ち向かえる強さを持っているだろう。心配はしてない。
	ただ、ヒースクリフに甘えているところがあって、時に横暴だ。よく喧嘩になる。
晶	……そうですね。そういうのは少し、感じるかもしれません。
ファウスト	面倒だから、揉め事を起こさないようになるといいが……。
	ヒースクリフもあれで、案外意固地になる時がある。難しいかもな。
晶	うーん……。確かに……。
ファウスト	あとは、たまに褒めてやると、パイを焼いてくれと強請られる。
	おまえのママじゃないと断るが、そういう時はネロのところに行くらしい。
晶	ネロなら、料理のリクエストはなんだかんだ言いながら聞いてくれますもんね。
ファウスト	そういうしたたかなところと、へこたれないところは、長所だろうな。
`},
{id:11110,title:"シノへの印象（２）",type:"personal",characters:["ヒースクリフ"],memo:"シノ",
text:`晶	ヒースクリフは、シノのこと、どう思ってますか？
	あ、すみません。
	なんとなく、この森にいる二人は、いつも以上に生き生きしてる感じがして。
	主従の関係だとは思いますけど、兄弟とか、親友みたいに見えたんです。
ヒースクリフ	えっ、シノですか？いきなりですね……。え……、そんな感じでした？
	ちょっと恥ずかしいな……。
~~~~~~~~~	~~~~~~~~~
選択	特にシノが元気ですね。
ヒースクリフ	あはは……。すみません、あいつ、ここにいるとみんなに色々案内できるから、
	はしゃいでるっていうか……。
	兄貴ぶりたがりますよね。たぶん、頼られたいんだと思います。
	……甘えたがることもよくあるのに。
晶	シノは頼もしいですよ。俺もしょっちゅう助けられます。
ヒースクリフ	実を言えば、俺も少し頼ってる時があるんです。
	賢者様にそう言ってもらえると、なんだか俺も嬉しいです。
~~~~~~~~~	~~~~~~~~~
選択	シノはどんな存在ですか？
ヒースクリフ	そうですね……。友達で、たまに弟みたいな感じかな。
	危なかっしくてほっとけないけど、シノも俺の面倒を見てるつもりだと思うんですよね。
晶	お互いがそう思ってるんですね。なんとなく、わかります。
	いい関係だなって思いますよ。
ヒースクリフ	そうですか？
	子供っぽいなと思ってたけど、そう言ってもらえるなら、いいのかな……。
~~~~~~~~~	~~~~~~~~~
選択	約束についてどう思っていますか？
ヒースクリフ	ここだけの話、約束のことがなくても、
	ずっと一緒にいられたらいいなって俺は思ってるけど……。
	約束が、あいつの重荷になってないかだけ、ちょっと心配ですね。
晶	約束のことがなくても、シノもずっと、ヒースと一緒にいるつもりだと思いますよ。
	俺からはそう見えます。
ヒースクリフ	そうなのかな……。
	でも、そう言って貰えて、ちょっとホッとしました。
~~~~~~~~~	~~~~~~~~~

ヒースクリフ	ありがとうございます、賢者様。
`},
{id:11111,title:"シノへの印象（３）",type:"personal",characters:["ネロ"],memo:"シノ",
text:`晶	先輩魔法使いのネロから見て、シノはどうですか？
ネロ	またざっくりした聞き方だなあ。でも、そうだな……。
	将来的に、けっこう強くなると思うぜ。
	今時珍しく、子供の頃から自然の中でのびのび魔法を使ってたのもあるかもな。
晶	なるほど。慣れが大事なんですね。
ネロ	そうそう。中身はまだまだやんちゃ坊主って感じだけどさ。
	ちょっと褒めてやると、
すぐ、好物のパイやらクッキーやら焼いてくれって言ってくるだろ？
	今まで一人でやって来たわりに、そういうところは可愛げがあるよな。
晶	ネロからすると、可愛い感じなんですね。
ネロ	そりゃもう、赤ちゃんみたいなもんだよ。長生きの連中はみんなそうじゃないか？
	あいつなりに、ヒースに忠誠を尽くしてるっぽいところも可愛いし。
	なんだかんだ、ファウストから、一生懸命学ぼうとしてるところも可愛いな。
`},
{id:11112,title:"シノへの印象（４）",type:"personal",characters:["レノックス"],memo:"シノ",
text:`晶	レノックスは、シノのことどう思いますか？
レノックス	……どう、とは。
晶	あ、すみません、あまり深い意味はないんですけど、様子はどうかな、くらいの……。
レノックス	樣子⋯⋯。
	先日、俺のところに来ました。素手で戦う技を教えてほしいと。
	ですが……、俺は、教えるのが下手なもので、実技で伝えるしかなくて。
晶	実技っていうと……、実際に技を掛け合ったりするような？
レノックス	そうです。
	それで、何度か負かしているうちに、覚えてろ、と言っていなくなりました。
晶	（相当悔しかったんだろうな……）
レノックス	怒らせたのかと心配しましたが、
	夜には、「昼間はどうも」と、羊用に草を持ってきてくれました。
	それから、勝てるようになったらまた来ると。
晶	ガッツありますね……。
レノックス	俺も、できるなら、少し手加減したかったんですが、その……。
晶	ああ、わかります。手を抜いたら怒りそうです、シノ。
レノックス	はは……。そうなんです。
	負けん気が強いですが、心も体も、しっかりしていると思いますよ。
`},
{id:11113,title:"シノへの印象（５）",type:"personal",characters:["ラスティカ"],memo:"シノ",
text:`ラスティカ	シノは元気が良いですね。テキパキしているから、僕はたまに怒られます。
晶	なんとなく珍しい組み合わせですね。ラスティカは、シノと遊んだりするんですか？
ラスティカ	遊びかどうかはわかりませんが、
	チェンバロを弾いていると、シノがよく聴きに来ますよ。
晶	シノが？それは少し意外かも……。
ラスティカ	そうですか？魔法使いはみな、感性に身を任せるのが好きなんです。
	この静かな森に住んでいたのなら、彼は今まで、音楽に触れる機会が少なかったのかもしれません。
晶	そうか……。
	シノが魔法舎で新しく好きなことを見つけるのは、なんとなく嬉しいです。
ラスティカ	僕もです。よろしければ賢者様も是非、ご一緒にいらしてくださいね。
	シノは、興味深そうに聴いたあと、いつも一言だけ感想をくれるから、
	僕はそれを楽しみにしているんですよ。
`},
{id:11114,title:"スポットゆかりの話（１）",type:"personal",characters:["⑪"],memo:"シノ",

晶	狼や熊……！？人が襲われたりするんですか？
シノ	近くに行けばな。でも、安心しろ。川よりこっちにはほとんど来ない。
	シャーウッドの昔話でそう言われてる。
晶	昔話……？
シノ	昔々、ずる賢くて悪い熊が、魔女を騙して食べ物を独り占めした。
	魔女は怒って、木の実を毒に変えた。
	熊は食べるものがなくなって、森の奥に引っ込んだ。そんな言い伝えだ。
晶	そうなんですね……。
	この辺りに熊が出て来ないなら、本当にあった話なんでしょうか？
シノ	あはは。昔話を信じるなんて、可愛いところがあるんだな。賢者。
	森の奥の方が木の実はたくさんあるんだ。わざわざこっちに来ないだけさ。
	川のそばに、毒の木の実があるのは本当だけどな。
晶	なるほど。さすが、詳しいですね。
	シノに道案内を任せられたら、この広い森も安心です。
シノ	ふふん。まあね。
`},
{id:11115,title:"スポットゆかりの話（２）",type:"personal",characters:["⑪"],memo:"シノ",
text:`シノ	太古の時代は、この森自体が神様だって言われていたらしい。
晶	ファウストも言っていましたね。森は神聖なものだって。
シノ	神様なんているかわからないが、森に意思があるのは感じられる。
	だから、森の正体がわからない人間が神様みたいに思う気持ちはわかるな。
晶	森の意思……。
	魔法使いは、木や草花とか、自然の声みたいなものが聞こえたりするんですか？
シノ	おしゃべりなんかしないさ。
	ただ、気配があるんだ。力も貸してくれる。
晶	気配ですか……。俺には全然……。
シノ	オレには、その方が信じられないな。
	シャーウッドの森は、ブランシェット家のことが好きだ。守ろうとしてるのがわかる。
	この森とは気が合う。
`},
{id:11116,title:"東の国について",type:"personal",characters:["ヒースクリフ"],memo:"シノ",
text:`晶	ヒースはやっぱり、東の国が一番暮らしやすいですか？
ヒースクリフ	どうかな……。中央の国に行ってみたら、
	この国は少し窮屈なのかもしれないって、思うようになりました。
	ブランシェット領はそうでもないけど、首都の方は法律も多くて厳しいですし。
	誰かと関わりながら暮らすなら、東の国よりも、中央や南の方が、いいのかもしれないです。
晶	なるほど……。
ヒースクリフ	あっ、でも、いいところも、もちろん多いんですよ。
	俺は自然の多いところが好きだし、
	この森にいる時が、一番自分らしくいられる気がします。
晶	確かに、いつもよりリラックスしてるような感じがするかも……。
ヒースクリフ	あはは……。賢者様が魔法舎に来てから、いろんな場所へご一緒しましたけど……。
	自然だけは、東の国が一番美しいって。そう思うんですよね。
`},
{id:11117,title:"〈大いなる厄災〉について",type:"personal",characters:["⑪"],memo:"シノ",
text:`シノ	子供の頃、〈大いなる厄災〉が来る日は、旦那様が城に入れてくれた。
	ひとりじゃ怖いだろうからって。
	旦那様や奥様やヒースと過ごすのが嬉しくて、災が来る日を楽しみにしてたら、
	使用人たちから魔法使いめ！って言われたけどな。
晶	ひどいですけど、たしかに本来なら縁起の悪いものなんですもんね……。
シノ	ヒースは心配性だからいつもビビってて、オレが励ましてやってた。
	毎年、空に還っていくんだから、今回だって大丈夫に決まってるって言っても、
	律儀に怖がってたな。
	…………。
晶	どうしましたか？
シノ	……思い出したんだ。あの時のこと。
	もしも賢者の魔法使いになったら、オレが〈大いなる厄災〉を追い払ってやるって。
	だから安心しろって、言ってやってた。
晶	シノ……。小さな頃から優しかったんですね。
シノ	そんなんじゃないさ。
	でもまあ、今年は有言実行しないとな。
`},
{id:11118,title:"スポットの人々",type:"personal",characters:["ネロ"],memo:"シノ",
text:`ネロ	賢者さん。ちょっと寄りたい所ができたんで、行ってきてもいいか？
	日が沈む前には戻るからさ。
晶	それは構いませんけど……。どちらに行かれるんですか？
ネロ	ブランシェット城のそばに狩場があるらしくてさ。覗いてこようかなって。
晶	狩場？ネロが狩りをするんですか？
ネロ	そうそう。あっちの方で、この森の狩人に会ったんだよ。
	猪も、鹿も、兎も、雉も、なんでもいるって言うんで、お裾分けしてもらおうと思って。
晶	なるほど。地元の方と仲良くなったんですね。
ネロ	まあな。最初は警戒されたけど、
ヒースクリフ坊ちゃんの名前を出したら色々教えてくれたよ。
	ああそうだ、だから、ヒースクリフも借りてくわ。
	どこにいる？
晶	たぶんあっちの方です。気をつけて行ってきてくださいね。
ネロ	ありがとさん。夕食、楽しみにしててくれよ。
`},
{id:11119,title:"森の番人",type:"personal",characters:["⑪"],memo:"シノ",
text:`シノ	賢者、待て。誰かいる。
晶	え？
シノ	……おい。そこのやつ、出てこい。痛い目にあいたいのか。
シノが木の陰に向かって呼びかけると、体格のいい男が数人、姿を現した。
体格のいい男	森番のシノじゃないか……！？しばらく留守だって聞いてたのに、どうして……。
シノ	おまえら……。また森を荒らしに来たのか？
	以前、捕まえた時、二度とこの森に立ち入るなと言ったはずだ。
	その耳、ついてるだけ無駄だな。
	《マッツァー・スディーパス》
体格のいい男	うわあああ……！出ていく！今すぐ出ていくから勘弁してくれ！
体格のいい男	に、逃げろ……。
シノ	チッ……。賢者、ここにいろ。追いかけて懲らしめてくる。
晶	わ、わかりました。
	でも、被害が出てないなら、お手柔らかにしてあげてくださいね……。
シノ	おまえは甘いな。まあ、加減は最近覚えたから大丈夫だ。
	行ってくる。
`},
{id:11120,title:"スポットにいた魔法使い",type:"personal",characters:["ファウスト"],memo:"シノ",
text:`ファウスト	昔、この森の近くに、子供をさらう魔女がいたらしい。
晶	子供を……？どうしてそんなことを……。
ファウスト	どうして、か。
	今も迫害や偏見の残る、この国の魔法使いなら、理由はいくらでもあるだろう。
晶	あ……。
ファウスト	人を憎んでいたのか、ひとりに耐えかねたのか、呪術の贄を探していたのか……。
	いずれにせよ、長い孤独をやり過ごすには、
	他人や自分を攻撃するか、ひたすら耐えて慣れるしかない。
晶	……ファウストも、ずっとひとりでいることに慣れたんですか？
ファウスト	…………。
	どうだろうな。
晶	(もちろんそうだ、って、言われると思ったのに……)
ファウスト	今はもう、この森に魔女の気配はない。
	追い払われたか、石になったか、どちらかだろう。
`},
{id:11121,title:"危険な場所",type:"personal",characters:["⑪"],memo:"シノ",
text:`シノ	賢者、ほら、ここ。
晶	あ……。地面に穴が空いてますね。動物のですか？
シノ	そうだ。もっと近くで見るか？ここのところ。
晶	はい。結構大きいですね。
シノ	これは狼の巣穴だ。この辺りには狼の群れがいる。
晶	…………え……？
シノ	だから近寄ったら危ない。覚えておけよ。
晶	あ、あわわわ……。
シノ	今は使われない季節だから大丈夫だ。そばに狼の気配もない。
	道案内で態度が悪いやつに会ったら、わざとこの辺を通る。
	狼の遠吠えが聞こえ始めると、だいたいベソかいて謝ってくるんだ。
晶	森の中では、シノを怒らせないようにしたいです……。
`},
{id:11122,title:"シノの評判",type:"personal",characters:["アーサー"],memo:"シノ",
text:`晶	アーサー。ここにいたんですね。誰かと話をしていたんですか？
アーサー	ええ、この森の木こりに会ったのです。
	以前、倒れた木の下敷きになったところをシノに助けられたことがあるそうで。
晶	シノが人助けを？
アーサー	はい。
	魔法を使ったようなのですが、木こりは、魔法使いを悪人だと思って酷く怯えてしまったらしくて……。
	そのことを、とても申し訳ながっていました。シノは気にしていなかったそうですが。
晶	そんなことがあったんですね……。
	気にしないシノは、なんとなく、想像できる気がします。
アーサー	そうですね。私も魔法使いなのだと明かしたら、やはり驚いていましたが……。
	シノの仲間なら信用できると言ってくれたんですよ。
	東の人々は魔法使いに懐疑的だと聞きますが、それでも、こんな風に慕われるシノは頼もしく、誇らしいです。
晶	ええ……、俺もそう思います。
アーサー	魔法舎に戻ったら、シノからも話を聞いてみたいと思っているんです。
	私もシノのように頑張らなくてはいけませんね。
`},
{id:11123,title:"スポットでの名物",type:"personal",characters:["⑪"],memo:"シノ",
text:`シノ	この木が月光樹だ。シャーウッドの森には、特にたくさんある。
	夜になると丸い実が発光して、道案内に使うんだ。
	よっ……と、ほら、賢者。取ってやったから食べてみろ。
晶	すごい。幻想的ですね……。いただきます。
	…………。
	（柔らかくて甘い。桃みたいな味だ！）
シノ	もっと、大きくかじって。
晶	は、はい。ん……んむ……。
シノ	……。
晶	ん？……うわ！？胃の中で光ってる……！？うわわ、わっ……！
	身体も光り始めた……！
シノ	あははは。賢者は反応がよくて面白い。
	それでしばらく、明かりの代わりになる。
晶	シ、シノ……。こ、これ、直るんですか！？
シノ	そのうちな。
	……んっ、もぐもぐ……。
	うん。
	やっぱりうちの実が一番美味い。みんなにも食わそう。
	行くぞ、賢者。
`},
{id:11124,title:"スポットでの発見",type:"personal",characters:["クロエ"],memo:"シノ",
text:`クロエ	あ！見てみて、賢者様！これ、きっとグリーンフラワーだ！
晶	グリーンフラワー？
クロエ	形が可愛いでしょう。東と南にしか咲かない花だよ。
	……いや、もしかしたら野菜なのかも。これ、サラダにして食べると美味しいし。
	……すごいなあ。
	シャーウッドの森には、見たことない綺麗な花がいっぱい咲いてるね。
晶	クロエは花が好きなんですか？
クロエ	花っていうより、花の形かな。刺繍にしたらきっと綺麗だろうなって思って。
晶	なるほど。素敵になりそうです。
クロエ	でしょ？賢者様はどんな模様が好き？
~~~~~~~~~	~~~~~~~~~
選択	大きな花の柄……。
クロエ	いいね！肩口から胸元に大輪の花を飾ってみたり……。
	派手だけど気高いイメージだから、ラスティカとか、
	ムル……シノやアーサーにも似合いそう！
~~~~~~~~~	~~~~~~~~~
選択	小さな花の柄とか……。
クロエ	なるほど！襟や袖口に細かく入れたら、さりげなさが凄くおしゃれになりそうだね！
	繊細で優しい感じだから、ルチルやヒース、リケにも似合いそう。
	意外とシャイロックもいけるんじゃないかな？
~~~~~~~~~	~~~~~~~~~
選択	草や蔦の柄とか……。
クロエ	面白いね！
	片身頃にだけ模様を入れてもいいし、背中や、裾に入ってても楽しいかも。
	綺麗だけど強さも感じる。ネロとか、レノとか、ファウストにも似合いそうだよね！
~~~~~~~~~	~~~~~~~~~
クロエ	アイデア湧いてきた！
	うまくデザイン出来たら、賢者様の服にもあしらってあげるね！
晶	ありがとうございます、クロエ。楽しみにしていますね。
`},
{id:11125,title:"楽しい場所",type:"personal",characters:["⑪"],memo:"シノ",
text:`シノ	この辺りは木が多い。ほら、ここにもたくさんある。
	あっちに行くとキノコや山菜も採れる。
	よっ……と。ほら、食ってみろ。
晶	ありがとうございます……。
	ん……。
	うわ……。酸っぱそうに見えたのに、すごく甘いんですね。
シノ	そうだろ。ここに実をつける木苺が、シャーウッドの森の中で一番甘い。
	オレがヒースを案内して、よく採りに来た。ここは、オレしか知らない穴場なんだ。
	このままでも美味いけど、たくさん摘んで持っていくと、奥様がパイやケーキを作ってくれた。
晶	なるほど。パイやケーキも美味しそうですね。
シノ	ああ。それで、賢者は何を作ってくれるんだ？
晶	んぐ……。えっ……。
シノ	ただで食べるつもりじゃないだろ？
晶	え！？え、えーっと……。
	……そうだ！
~~~~~~~~~	~~~~~~~~~
選択	ネロと相談してみます！
シノ	ネロか。そうだな。楽しみにしてる。
~~~~~~~~~	~~~~~~~~~
選択	何かチャレンジしてみます！
シノ	やった。パイがいい。初心者には難しいって聞いたことがある。頑張れよ。
~~~~~~~~~	~~~~~~~~~
選択	シノが作ってみるのは？
シノ	おい。それだと最初から最後までオレがやることになるじゃないか。
晶	摘むのは手伝います！
シノ	じゃあ、しっかりな。
`},
{id:11126,title:"マナエリア",type:"personal",characters:["⑪"],memo:"シノ",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
	「マナエリア」と呼ぶとも聞きました。シノにもマナエリアがありますか？
シノ	ああ。この前の授業で、ファウストが言ってたやつだな。
	オレのマナエリアは、オレの故郷。夜のシャーウッドの森だ。
晶	夜の森……。シノのマナエリアは、シノに馴染みの深い場所なんですね。
シノ	だいたいのやつがそうなるって教わったぜ。
	それぞれの、げん……、原風景？みたいな場所がマナエリアになりやすいって。
	夜の森は静かそうに見えて、たくさんの気配が蠢いてる。
	そいつらの秩序を守るためにオレは森番をしてた。
	気配のひとつひとつを捉えようとして耳を澄ましてるうちに、
	指の先まで精神が集中していくのを感じたんだ。
晶	たしかに、魔力が高まりそうなイメージです！
シノ	ああ。言われて初めて、夜の方が調子が出るってこともわかった。
	ファウストは物知りだ。魔法使いが知ってるべきことを、ちゃんと知ってるし。
	前の師匠とは大違いだな。ファウストがオレの先生になってよかったよ。
`},
{id:11127,title:"アミュレット",type:"personal",characters:["⑪"],memo:"シノ",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	シノもアミュレットを持ってますか？
シノ	ああ、アミュレットな。この間、ファウストに教わった。
	オレのはこれだよ。
シノは、棚に置いていた細長い一輪挿しの花瓶を俺に見せてくれた。
花の代わりに、葉のついた木の枝が生けてある。
シノ	オレのマナエリアはシャーウッドの森だ。
	だから、植物を部屋に置くようにしろと言われた。
	花よりも、木の方が馴染み深いから、枝を取って来てさしてるんだ。
晶	なるほど……。効果はありますか？
シノ	どうだかな。
	魔法舎の近くに森があるから、そっちに行った方が魔法は冴える気がする。
	でも、アミュレットを置いてから、部屋にいるときも、落ち着く感じがするかもな。
	魔法舎にきてしばらく寝つきが悪かったが、そういうのがなくなった。
晶	（シノが眠れないなんて……。
	 魔法と、過ごしてる環境って、けっこう繊細な関わりがあるみたいだな……）
`},
{id:11128,title:"森での交流",type:"personal",characters:["⑪"],memo:"シノ",
text:`晶	シノ、木の上で何して……。それは鳥の巣箱ですか？
シノ	いいところに来た。そこのロープを取ってくれ。
晶	はい、どうぞ。
	その巣箱、シノが作ったんですか？かわいいですね！
シノ	あとは固定したら完成だ。
	この辺りは野鳥が多いからな。世話をしてやるのも森番の役目だ。
晶	あはは、この森もすっかりシノの縄張りですね。
小鳥	『ちゅんちゅん。』
シノ	お、来たな。
晶	この野鳥は――
~~~~~~~~~	~~~~~~~~~
選択	シノのお友達ですか？
シノ	友達な訳ないだろ。こいつがでかくなったらフライドチキンにしてやる予定だ。
晶	そ、そんな……。
シノ	冗談だ。
~~~~~~~~~	~~~~~~~~~
選択	名前はなんていうんですか？
シノ	鳥だ。
晶	そのまま……！
~~~~~~~~~	~~~~~~~~~
小鳥	『ちゅんちゅん！』
シノ	おい、待て。まだ終わってない。はしゃぐなって。
晶	（なんだかんだ言って、シノと仲良しみたいだ……）
`},
{id:11129,title:"家族",type:"personal",characters:["⑪"],memo:"シノ",
text:`晶	シノは孤児だって言ってましたよね。家族を探したりはしなかったんですか？
シノ	探してどうするんだ？オレを捨てたやつらを。
	そいつらの所へ戻ったとして、オレが歓迎されるとでも思うのか？
~~~~~~~~~	~~~~~~~~~
選択	す、すみません……。
シノ	別に怒ってない。全然覚えてないし、未練がないだけだ。
~~~~~~~~~	~~~~~~~~~
選択	両親もシノを探しているかも。
シノ	ずいぶん楽天的な考えだ。平和なところで育ったんだな、賢者。
~~~~~~~~~	~~~~~~~~~
シノ	アーサーは、捨てられた所をオズに拾われたって聞いたな。
	オレもオズに拾われたかった。
	そうすれば、今頃もっと強くなれたのに。
	強くなってからブランシェット城に行けば、オレがヒースの師匠だったかもしれないだろ。
晶	でも、オズに拾われたシノは、
	ブランシェット家のことをずっと知らないままじゃないですか？
シノ	……たしかにそうか。
	奥様や旦那様やヒースと会えずに、人生を過ごすのは嫌だな。
	なかなか難しいな。
`},
{id:11130,title:"あいつという存在",type:"personal",characters:["⑪"],memo:"シノ",
text:`晶	シノはヒースクリフの家の小間使いで、ヒースクリフの友達ですよね。
	部下であり、幼馴染であると言うか……。
シノ	まあね。
晶	どちらの気持ちの方が強いんですか？
	主君として推したりする時もあれば、友達として気さくに接してる時もありますけど。
シノ	どうして知りたい。
晶	俺も元の世界に友達はいました。
	でも、主君というものはいなかったので、シノはどういう気持ちでいるのかなって……。
シノ	…………。
	ヒースクリフは主君だ。あいつとオレは対等な友達にはなれない。
	身分の差があるからな。
晶	あ……。
シノ	だが、喜ばせてやりたいと思うのは、主君でも友達でも同じことだ。
	その区別はオレにはつかない。
	よく叱られたけどな。
	ブランシェットの召使いや執事たちに、馴れ馴れしいとか、無礼だとか。
	ヒースは多分、オレと友達でいたがってる。オレも多分、そうだけど……。
晶	だけど……？
シノ	あいつが格好いい主君ぽい時は、ぞくぞくする。口笛を吹きたい気分になる。
	だから、どっちだっていい。どうだっていいのさ。この関係に付く名前が何かなんて。
`},
{id:11131,title:"褒められたい",type:"personal",characters:["東"],memo:"シノ",
text:`シノ	ファウスト、ネロ。賢者も一緒か。ちょうどいい。
晶	シノ。何かありましたか？
シノ	この前、ファウストの授業でできなかった魔法、使えるようになったぞ。
ネロ	へえ。あのあと自主練してたのか？相変わらず熱心だな。
ファウスト	見せてみろ。
シノ	よし。
	《マッツァー・スディーパス》！
シノが呪文を唱えると、一枚の銀貨が現れ、表面に刻まれた肖像がじわじわと形を変えて、
ヒースクリフの横顔になった。
晶	うわ……！コインの形を変えたんですか？すごいですね！
シノ	ふふん。どうだ？
ファウスト	集中力が上がって、魔力の制御が上手くなった。
	課題にしたコントロールも上達してる。顔も似ているし。よくやったな、シノ。
ネロ	頑張ったなあ。
	それにおまえ、何かできるようになるたびいちいち見せに来るとこ、可愛げあるよな。
シノ	褒められるの好きだからな。ファウストとネロも、褒めるの上手いから気分いいぜ。
ファウスト・ネロ	はは、それはどうも。
シノ	じゃあ、次はヒースに見せて来る。あいつ、照れると思うぜ。
`},
{id:11132,title:"呪文の秘密",type:"personal",characters:["⑪"],memo:"シノ",
text:`晶	東の国にいたとき、シノとヒースクリフには、魔法使いのお師匠様がいたんですよね。
シノ	ああ。初めから胡散臭いと思ってたが、本当にろくでもないじじいだった。
	魔法舎に来て分かった。
	思い返せば、魔力も弱かったし、ファウストが教えてくれることの、半分の知識もなかったみたいだ。
	何より、俺とヒースを騙して約束させた。
~~~~~~~~~	~~~~~~~~~
選択	やっぱり嫌でしたか？
シノ	嫌に決まってるだろ。どうせ約束するなら、ヒースと話し合って決めたかった。
	今更言っても仕方ないことだけどな。
~~~~~~~~~	~~~~~~~~~
選択	恨んでいますか？
シノ	もう石になった。恨んでも仕方がないし、今はどうとも思ってない。
	でも、本当にくそ野郎だったぜ？
~~~~~~~~~	~~~~~~~~~
シノ	自分の呪文があることも、ヒースがファウストから教わって、初めて分かったんだ。
晶	じゃあ、それまでは、違う呪文を使っていたんですか？
シノ	そうだ。師匠は呪文で魔法の強さが決まると思ってた。
	最強の呪文を、最強の魔法使いに教わったって。
	《アシアシノール・イン・サエサエクーロ》
シノが呪文を唱えると、指先に小さな花が現れて、……すぐに枯れて消えてしまった
晶	本当だ……。なんだか長い呪文なんですね。
	この言葉にも何か意味があるんですか？
シノ	ファウストが言うには、『バカは永遠にバカ』だ。
	もともと師匠も、誰かに騙されたのかもしれないな。
`},
{id:11133,title:"シノの役目",type:"personal",characters:["⑪"],memo:"シノ",
text:`晶	シノ、いますか？
シノ	賢者。何しに来た。
晶	シノがここで訓練をしていると聞いたので、差し入れを持ってきました。
	今は休憩中ですか？
シノ	森の整備をしていた。
晶	整備？
シノ	ここはミチルやリケが遊び半分で来るからな。弱いくせに。
晶	（さすがに直球すぎでは……！？）
シノ	だからあいつらが怪我しないように伸びた根っこを切ったり、枝を踏み慣らしたりしてた。
晶	あ、本当だ！このあたりの道歩きやすくなってますね。
	道も綺麗になってる気がします。
シノ	ふふん、まあね。
晶	シノは頼もしいですね！何か俺にもできることはありますか？
シノ	ない。
晶	えっ。
シノ	あんたの魔法使いとして、ここを守るのもオレの役目だ。
	賢者はおとなしく見守ってればいい。
`},
{id:11134,title:"オレが守る",type:"personal",characters:["シノ","ムル","クロエ"],memo:"シノ",
text:`シノ	…………。
晶	シノ、どうして空なんて見つめて……。あっ綺麗な鳥！なんていう鳥だろう！
	もふもふでつぶらな瞳……文鳥に似てる。こっちに来ないかな。
シノ	あいつ、様子がおかしい。
晶	えっ？
シノ	……っ！ 下がれ賢者！
晶	（うわ！？急旋回してこっちに向かって……！）
シノ	《マッツァー・スディーパス》！
	賢者、無事か。
晶	は、はい。ありがとうございます。
	鳥、紙吹雪みたいに散ってしまいましたね……。
シノ	おまえを狙っている敵かもな。安心しろ。オレが守ってや……。
クロエ	わー！ごめんごめん！そっちに飛んでいっちゃった？
ムル	俺の魔法の紙人形！バラバラになってる！面白い！ 
`},
{id:11135,title:"得意な魔法",type:"personal",characters:["⑪"],memo:"シノ",
text:`シノ	《マッツァー・スディーパス》！
晶	調子良さそうですね、シノ。魔法の練習、はかどってますか？
シノ	やりたい練習はだいぶいい。やりたくない練習はこれからだ。
晶	やりたくない練習……。魔法にも、得意や不得意があるんですか？
シノ	やりたくないだけだ。不得意ってわけじゃない。
	ファウストには、基礎の魔力が強くて、瞬発力が高いってめられた。
	新しい魔法を作ったり、応用するのも上手いって。
	森番の仕事は工夫が必要だったからな。
晶	たしかに、シノの魔法が力強いのは、見ているだけでもすごく伝わってきますもんね。
シノ	ふふん。……だけど、忍耐力や、正確さや繊細さが足りないってさ。
	その練習のために、細かい作業をしなけりゃならないんだ。
	シュガーを丁寧に作ったり、魔法で細工したり。
	コントロールで獲物を狙うより、大きな物を投げて的に当てた方が早いのに。
晶	シノらしいですけど、どちらも大切なことだと思いますよ。
	練習、頑張ってくださいね！
シノ	おまえがそういうなら、……明日からな。
`},
{id:11136,title:"努力の先に",type:"personal",characters:["⑪"],memo:"シノ",
text:`晶	シノの魔道具って大きくて格好いいですよね。
シノ	なんだ急に。
晶	ずっと思ってたんです。シノより大きいのに、重くないのかなって。
シノ	持ってみるか。
晶	ありがとうございます。じゃあ、お言葉に甘えて……うっ！
	（想像以上に重い……！）
シノ	ふん、情けない顔だな。貸してみる。
晶	わ、軽々持ってる。魔法で重さを調整してるんですか？
シノ	そんな面倒な真似はしない。鍛えているだけだ。
晶	さらっと言っちゃうところがすごい…….。シノは本当に努力家なんですね。
シノ	当然だろ。オレは英雄になる男だからな。
晶	か、格好いい……！
`},
{id:11137,title:"紋章",type:"personal",characters:["⑪"],memo:"シノ",
text:`晶	賢者の魔法使いには、目印になる賢者の紋章が身体に現れるって聞きました。
	シノの紋章はどこにあるんですか？
シノ	肩のところだ。見るか？
言い終える前に、シノは服の襟を開いて、右肩の肌を見せてくれた。
黒いあざのような紋章がはっきり刻まれている。
シノ	急に光って熱くなったんだ。
	厄災が来て森も変だったし、最初はヤバいやつかと思って驚いた。
	でも、ヒースの紋章を見たことあったから、
	これが賢者の魔法使いの印だってすぐ分かったし、嬉しかった。
晶	シノは、月に選ばれたことが嬉しかったんですか？
シノ	〈大いなる厄災〉との戦いに、ヒースをひとりで行かせなくて済むだろ。
	もともと、オレの方が強いんだから、オレが行く方がいいって思ってたんだ。
晶	……友達思いですね、シノは。
シノ	主君を守るのが従者の勤めだ。それに、約束もあるしな。
	紋章が出て、ヒースになんて話そうかわくわくした。
	あいつも喜ぶだろうと思ったのに……。
	あんまり喜んでなかったからムカついたな。
`},
{id:11138,title:"いつもと違う朝",type:"personal",characters:["⑪"],memo:"シノ",
text:`？？？	……さま、賢者様。
晶	うん……？
シノ	賢者様、おはようございます。朝ですよ。
晶	えっ、シノ？
シノ	朝食の準備ができています。身支度をお手伝いしましょうか。
晶	（シノが起こしに来てくれるなんて珍しい……。でも、いつもと様子が違うような？）
シノ	どうした。朝飯食わないのか。
晶	あれ、いつものシノだ！
	どうしたんですか。今日はなんだか丁寧に接してくれている気がします。
シノ	……ヒースがうるさいんだ。オレはいつも賢者の扱いが雑だって。
	だからヒースの真似をしてみた。
晶	そうだったんですね……。
	新鮮すぎてちょっと驚きましたけど、シノの気持ちはすごく嬉しいですよ。
シノ	なら良い。一応、おまえのことはいつも大事にしてるつもりだったんだが、難しいな。
晶	シノ……！ 
`},
{id:11139,title:"コミュニケーション上手",type:"personal",characters:["⑪"],memo:"シノ",
text:`晶	こんばんは、シノ。今日の任務で南の街に出かけたので、お土産を買って来たんです。
シノ	お菓子か？
晶	当たりです。
	崩れやすい焼き菓子なので、こぼさないように気をつけてくださいね。
	どうして分かったんですか？
シノ	ふふん。いい匂いがしたからな。ありがとう、賢者。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
シノ	暇なのは苦手だ。誰かに会いに行く。魔法舎はどこかに誰かがいるからいい。
	ひとりになりたいときは森に行ってる。
	退屈も嫌いだけど、構われたくない時に構われるのも嫌だ。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
シノ	部屋のこと自慢したくてひと通り呼んだ。
	ファウストやネロやシャイロックは、綺麗にしてるってほめて帰った。
	ヒースはよく来る。俺も行くしな。カインはカードゲームを持って来てくれた。
	ムルもたまに勝手に来る。
	~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
シノ	そんなの決めてない。自由に過ごしてる。魔法舎は色々あるから面白い。
	でも、ファウストの宿題だけは寝る前にやるかな。やらないと怒るからな。
~~~~~~~~~	~~~~~~~~~
シノ	これ、ひとつ食べてみていいか？
晶	もちろん。小麦粉と砂糖と、ラードを混ぜて焼いてるそうです。
	俺の世界にも、似た味のお菓子が……。
シノ	あむ……。あっ。崩れた……。
晶	あっ！……あはは、言ったのに……。ほっぺと襟に付いてますよ。
シノ	んっ……、モグ……。
	……美味いな、これ。ネロの分もあるか？一緒に持って行こう。
	今度作ってくれるようにねだっておく。
`},
{id:11140,title:"討伐に行きたい",type:"personal",characters:["ファウスト","シノ"],memo:"シノ",
text:`シノ	ファウスト、座学はもう飽きた。討伐に行きたい。
ファウスト	ダメに決まってるだろ。
晶	（さっきからずっとこの問答を繰り返してる……）
シノ	オレは早く強くなりたいんだ。座学だけじゃ物足りない。
ファウスト	だから言っているだろう。魔法の基礎も知らないやつが強くなれるはずはない。
	賢者もなんとか言ってやってくれ。ここ数日毎日こんな調子なんだ。
晶	実は俺も座学はあまり得意じゃなくて。
	あ、そんな目で見ないで……。
シノ	賢者もこう言ってる。なあ、明日はみんなで討伐に行こう。
ファウスト	……はあ、まったく。生徒が意欲的すぎるのも困ったものだ。
シノ	意欲的だって。聞いたか、賢者。
ファウスト	今のは皮肉だ。
シノ	ふふん。
`},
{id:11141,title:"シュガーでわかる",type:"personal",characters:["シノ","ヒースクリフ","ムル"],memo:"シノ",
text:`ヒースクリフ	ほらシノ、そうやって力任せにするから形がまとまらないんだよ。
シノ	どうせ崩すんだから形なんてどうだっていいだろ。
晶	皆さん楽しそうですね。何してるんですか？
ネロ	魔法のコントロールの練習だとよ。菓子に使うシュガーを作ってもらってる。
晶	手作りシュガー！素敵ですね。
	こっちがヒースクリフで、こっちがシノが作ったやつですか？
シノ	なんでわかるんだ。
晶	なんとなく？ヒースクリフのは綺麗な星型で、
	シノは真四角で……あれ、ちょっと角が崩れてる。
シノ	…………。
ヒースクリフ	シノはもう少し細かいコントロールも覚えたほうがいいよ。ほら、こうやって。
シノ	わかってる。すぐにヒースより綺麗なシュガーを作ってやるから待ってろ、賢者。
ネロ	いいから早く出してくれ。これじゃ料理が進まねえよ。
晶	（ムキになってるシノ、ちょっと可愛いな……）
`},
{id:11142,title:"パイが食べたい",type:"personal",characters:["⑪"],memo:"シノ",
text:`シノ	賢者。
晶	シノ、どうかしましたか？
シノ	腹が減った。パイが食べたい。作れるか？
晶	パイですか！？えっと……。
シノ	……作れないのか？
晶	（う、そんな露骨に寂しそうな顔を……！）
	……作ったことはないんですけど、やってみましょう！きっとなんとかなるはずです。
シノ	やった。
晶	良かったら、シノも一緒に作りませんか？シノの好きなものをたくさん入れましょう。
シノ	オレは食べる専門だが、好きなものをたくさん入れる案には賛成だ。
	レモンと木苺と、それから……！
晶	あっ、でも、夕飯前なので、あまり食べ過ぎてはだめですよ。
シノ	育ち盛りだから大丈夫だ。パイも飯も、たくさん食える。
晶	あはは、それなら良かったです。では、キッチンに向かいましょうか！ 
`},
{id:11143,title:"何に変身する？",type:"personal",characters:["東"],memo:"シノ",
text:`晶	力の強い魔法使いは変身ができるって聞いたんですけど本当なんですか？
ファウスト	ああ。魔力のコントロールが甘いうちは難しい魔法だが。
ネロ	俺は苦手なんだよな。自分の姿を変えるのも、他人の姿を変えるのも。
シノ	自分だけじゃなくて、人の姿も変えられるのか？
	面白い。やってくれよ、ネロ。
ネロ	だから苦手だって言っただろ。
晶	小動物とかにも変身できたりするんですか？
ファウスト	やろうと思えばな。
シノ	へえ、楽しそうだ。
ヒースクリフ	けど、俺たちが小動物にって、なかなか想像がつかないですね……。
	例えば、ファウストはロシアンブルー、ネロは……アメリカンショートヘアかな。
シノ	オレは？
晶	うーん……。 豆柴？
`},
//ヒースクリフ
{id:11201,title:"スポットの印象（１）",type:"personal",characters:["カイン"],memo:"ヒースクリフ",
text:`晶	カインから見て、ブランシェッドの城や領地はどんな印象ですか？
カイン	騎士としては城の造りが気になるよ。
	ここの攻略は難しそうだなとか、このあたりは手強そうだとか。
晶	攻略側の視点なんですか？
カイン	いざとなれば、攻め入る場所にもなるからな。
	いいところは中央の国にも活かしたいし。
晶	なるほど……。軍人っぽい見方ですね。
カイン	個人的な印象としては……。俺……。なんか……。城の人たちに嫌われてないか……？
晶	え！？そんなことはないと思いますけど、何か言われたんですか？
カイン	言葉に棘があるっていうか……。
	姿は見えないから、俺の気のせいかもしれないけどさ。
ヒースクリフ	カイン！
カイン	おお、ヒース！
晶	（自然に肩を抱いた。なんだか兄弟みたいで微笑ましいな。……ん？
	　…………！執事さんが怖い顔で睨んでる！
	　そりゃそうか！よくわからない他国の元騎士団長と
	　自分の大事なお坊ちゃんだもんな……）
執事	ごほん！中央の国の魔法使いどの。ここはブランシェッド城ですので。
カイン	ん？知ってるぞ。新設にありがとうな！
晶	（直接的に注意しない東の国の人と、直接言わないとわからないカイン……。
	　たしかに相性悪そうだ……）
`},
{id:11202,title:"スポットの印象（２）",type:"personal",characters:["ラスティカ"],memo:"ヒースクリフ",
text:`晶	ラスティカも貴族なんですよね。ブランシェットの城はどのような印象ですか？
ラスティカ	素敵な城ですね。
	西の国の城がばらの花だとしたら、東の国の城はりんどうの花のようです。
	こうして佇んでいると身が引き締まるような心持ちになります。
晶	（お城の前でむラスティカ、やっぱり、絵になるな……）
ラスティカ	ですが……。肩の力を抜いて、賑やかな演奏がしたい気持ちにもなります。
	ちょうど、そんな気分だったところです。賢者様がいらしてくれて良かった。
	《アモレスト・ヴィエッセ》
晶	え！？
ラスティカが呪文を唱えると、片手ほどの大きさの鉄琴とスティックが現れた。
ラスティカが鉄琴を響かせると音に合わせて踊るように、庭園の噴水が高く吹き上がった。
それはお城のてっぺんを超えて、きらきらと、七色の水飛沫を撒き散らす。
城の人	な、何事だ！？
晶	ら、ラスティカ、人が……。
ラスティカ	おや、観客が集まってくれたのですね。それでは、さらに技に磨きをかけましょう。
	ふふ、ここからが本番ですよ。
晶	いや、あの……っ。
ラスティカ	《アモレスト・ヴィエッセ》
`},
{id:11203,title:"スポットの印象（３）",type:"personal",characters:["アーサー","シノ"],memo:"ヒースクリフ",
text:`晶	あれっ、アーサー。ブランシェットに来ていたんですね。
アーサー	しーっ。申し訳ありません、賢者様。私がここにいることはどうかご内密に。
	来ていると分かれば、ヒースクリフの両親や、城のものが、気を遣ってしまいますので……。
晶	たしかに、隣国の王子様が突然現れたら、大騒ぎになりそうです……。
	何か用事があったんですか？
アーサー	いえ、私用です。
	シノと故郷の話をしていたら、城や森を案内すると、連れて来てくれて。
晶	（シノ、自慢したかったのかな……）
アーサー	シノの話していたとおり、城を取り囲むシャーウッドの森は広大で威厳を感じますね。
	森が城壁の代わりになると聞きましたが、たしかに、難攻不落の土地というのもうなずけます。
	森番を任されているシノは優秀だな。きっと、みなから重宝されていたでしょう。
シノ	ここにいたのか、王子様。こっちだ、テキパキついてこい。
アーサー	ああ。
晶	お城に行くんですか？
シノ	ヒースの部屋に忍び込むんだ。アーサーがいたら驚くぜ、あいつ。
アーサー	どきどきしてきたな！
晶	（サプライズだったんだ……）
`},
{id:11204,title:"ブレイクタイム（１）",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ブランシェット城には、からくり仕掛けのものがたくさんありますね。
	見ていて面白いです。
ヒースクリフ	はい。この噴水にも面白い仕掛けがありますよ。ちょうど今、動き出すはず……。
晶	わあ……！音楽が聞こえてきた。ヒース。この噴水はどんな仕組みが――。
ヒースクリフ	…………。
晶	ど、どうしました？もしかして何か気になることでも？
ヒースクリフ	………！ぼうっとしていました。すみません。
晶	いえ。でも、ヒースがぼんやりするなんて珍しいですね。
ヒースクリフ	はは……。俺、この噴水が気に入っていて。
晶	ヒースのお気に入り……。ということは、仕組みが特に凝っているとか？
ヒースクリフ	仕組みも勿論なんですが、それだけじゃなくて。
	この噴水が、させてくれる体験も好きなんです。
	音楽が聴こえてくると、わくわくして……。
	子供の頃から、噴水の近くで本を読むのが好きでした。
	……あ！話が逸れてしまいました。噴水の仕掛けについてですよね。
	これは水圧を利用して、一定時間が経つとパイプオルガンが演奏されるようになっています。それに……。
晶	（ヒース、生き生きしてる。
	　普段は落ち着いているけど、機械の話をしているときは年相応で可愛いな）
`},
{id:11205,title:"ブレイクタイム（２）",type:"personal",characters:["ファウスト"],memo:"ヒースクリフ",
text:`晶	ファウスト……。庭にテーブルとティーセットなんて豪華ですね。
	ひとりでお茶会をしてるんですか？
ファウスト	……用があってヒースクリフを待っているだけだったんだが……。
	城の者たちに見つかって、この有様だよ。
ファウストの座るテーブルは上品に飾られ、ひとりでは食べきれないほどの軽食やお菓子やお茶が並んでいた。
晶	ずいぶん丁重なおもてなしを受けたんですね……。
ファウスト	こんな賓客扱い、かえって迷惑だと言ったんだが、ヒースの手前、無下に断ることもできなくてな。
	さっきまで、使用人がひと通り挨拶に来ていた。
	ヒースクリフはよっぽど僕を持ち上げて伝えていたんだろう。
	それこそ人違いだと言いたかったよ。
晶	前の厄災との戦いで、
	ファウストはヒースを庇って怪我をしたって聞きましたよ。
	ここの人たちにとっても恩人ですもんね。
ファウスト	たまたまさ。次はどうなるのかもわからない。
	勝手に期待して、失望されても困るのに。
そう言ったファウストの表情には、言葉ほどの棘はなかった。
大事な人をもてなすための食器やお茶菓子は、そのままヒースクリフへの愛情を感じさせる。
それは俺にとっても嬉しい事に思えた。ファウストも同じように感じたのかもしれない。
晶	ご一緒してもいいですか？
ファウスト	ああ、たくさん食べてくれ。ヒースクリフが戻ったらあの子にも手伝ってもらおう。
	僕の用事はその後だな。
`},
{id:11206,title:"スポットの思い出（１）",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ブランシェット城は素敵なお城ですね。
	ヒースはお城の中で、お気に入りの場所ってありますか？
ヒースクリフ	自分の部屋は、やっぱり落ち着きます。趣味にも没頭ができるので。
	あ……。あとは、書庫かな。
	歴史や作法を学べる本から、小説まで、いろんな種類の本があるんです。
	それに、あの場所にいると、なんとなく父の優しさを感じられるというか……。
晶	優しさ？
ヒースクリフ	本棚にいつのまにか、機械やからくりに関する本が増えていることがあったんです。
	俺が好きそうな本だからって、こっそり揃えてくれていたみたいで。
晶	そういうのいいなあ……。素敵なお父さんですね！
ヒースクリフ	はい。厳しいところもありますが、優しくて格好良くて、俺の憧れなんです。
	……あ。賢者様、紅茶が切れていますね。
	新しいのをお淹れしましょうか？
晶	ありがとうございます。いただきます。
	（ヒースは、いつもさりげない気遣いをしてくれるけど……、
	　もしかしたら、お父さん譲りなのかもしれないな）
`},
{id:11207,title:"スポットの思い出（２）",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	シノとヒースは幼馴染なんですよね。
	シノがこの部屋に遊びに来たりすることはあったんですか？
ヒースクリフ	あったんですけど……。本当にたまにでした。
晶	そうなんですか？意外ですね。シノはヒースの部屋に来たがりそうなのに。
ヒースクリフ	……シノは外担当の小間使いなので、城の中に入るのを禁止されていましたから。
	あ、シノだけっていうわけじゃなく、
	基本的に外で働く使用人は入れない決まりになっているんですけど。
	だから、俺の部屋にいるのが誰かに見つかると、シノが怒られてしまうんです。
晶	そうなんですね……。ヒースは寂しくなかったですか？
ヒースクリフ	正直に言えば、寂しかったかな……。でも、嬉しいこともありました。
	たまにこっそりシノがやって来て窓からリスを見せてくれたり、嵐の日に声をかけてくれたりしてくれて。
	いつのまにか窓を叩く音を聞くとわくわくするようになっていました。
語尾が優しく霞む。俺がヒースを見ると、彼は微笑んだ。
ヒースクリフ	そうやって、俺たちは友達になっていったのかもしれません。
`},
{id:11208,title:"スポットの思い出（３）",type:"personal",characters:["シノ"],memo:"ヒースクリフ",
text:`シノ	シャーウッドの森番を任されるまでは、ブランシェット城で、庭仕事や小間使いみたいなことをしてた。
晶	お城の仕事って、具体的にはどんなことをするんですか？
シノ	大きな城だから、用事はたくさんある。
	庭の掃除とか、見回りとか、馬の世話とか、馬車や農具を磨いたりだとか。
	城の中でも、一番身分の低い仕事だ。
	だけど、屋根のあるところで寝られるし、必ず食事にありつける。最高だったな。
	オレは庭の手入れが好きだった。専門の庭師もいるけど、たまに手伝ってたんだ。
	あそこの垣根の木は、オレが植えた。
晶	ああ、あの道沿いにある背の低い木ですか？
シノ	これから大きくなるんだよ。
晶	シノのことを言ったわけじゃ……。
シノ	あの木は特別だ。冬になると白い花が咲く。
	冬にも花が咲くのはオレの木だけだからな。
	蕾がついたら、手折ってヒースにやってた。
	ヒースはいつも花瓶に枝を挿して、窓辺に置いてくれた。
	オレは庭仕事をしながら、その窓を眺めるのが好きだった。
	誰かがオレのした仕事を知ってる。
	オレの仕事が、冬でも、ヒース坊ちゃんの部屋を少しだけ華やかにしてる。
	そう思うと……。
	どんなに小さな仕事でも誇らしく思えた。
	ブランシェッドで貰った仕事は、そういう仕事だったよ。
`},
{id:11209,title:"ヒースクリフへの印象（１）",type:"personal",characters:["ファウスト"],memo:"ヒースクリフ",
text:`晶	ヒースクリフはファウストのことを先生としてとても慕っているように見えますけど、
	俺が魔法舎に来る前から親しかったんですか？
ファウスト	賢者の魔法使いたちと顔を合わせても、必要以上に関わらずにいるつもりだったが、
	ヒースは、見るに見兼ねて手を貸した。
	魔法もろくに使えない、知識にも乏しい、性格も本当にクソみたいな男に連れられていたからな。
晶	ヒースクリフの、前の師匠のことですよね……。
	ファウストがそんなふうに言うなんて、よっぽどだったんでしょうね……。
ファウスト	あの男は、自分の魔力が弱いことや、東の国での魔法使いの扱いへの劣等感をヒースクリフにぶつけていたんだよ。
	それでもヒースは従おうとしていた。
	だから見兼ねて助言をしただけだ。
晶	ヒースクリフは、正しい魔法の知識を教えてもらえて、心強かったと思いますよ。
ファウスト	そんなに大層なことは教えていない。前の師匠の出来が悪すぎただけだ。
	だけどそれ以降、何度僕はきみが思うような魔法使いじゃないと言っても、僕を善良だと疑わない。
	……意地悪が言いにくい。
晶	意地悪なんて。
	ファウストだって優しいんですから、普通に接してあげればいいのに。
ファウスト	呪い屋なんかに関われば家名に傷がつく。
	あの子は、貴族の子息としても、賢者の魔法使いとしても、立派に務めを果たしているのに。
	慕われすぎるのも問題だ。
	そろそろ、線引きしておかないとな。
	……今はまだ未熟だから、そのうち、だけれど。
`},
{id:11210,title:"ヒースクリフへの印象（２）",type:"personal",characters:["シノ"],memo:"ヒースクリフ",
text:`晶	シノは、ヒースクリフのこと、どう思ってるんですか？
シノ	格好いい。顔も麗だし、優しくて頭も良い。何より、オレの主君だ。
晶	理想のご主人様ですか？
シノ	至らないところもある。引っ込み思案だったり、恥ずかしがり屋なところ。
	でも、それを直せば、完璧だ。
	あんたもヒースのこと、すごいやつだって思うだろ。
晶	はい。素敵な人だなって思います。
シノ	そうさ。わからないやつは馬鹿だ。馬鹿の言うことなんて聞かなくていい。
	そんな奴らの文句なんて結局、魔法使いが怖いから弱い自分たちに近付くな、ってことなんだ。
	放っておけばいいのに、ヒースは優しいからな。
晶	シノ自身が、ヒースクリフの主君だったらって思ったことはないんですか？
ふと思い立ったことを尋ねると、シノは驚いたように瞬きした。
シノ	考えたこともない。
ヒースを、ブランシェットを守るのはオレだってずっと思ってた。
	従えようなんて、１度も思ったことはない。
	不敬な質問だぜ、賢者様。
`},
{id:11211,title:"ヒースクリフへの印象（３）",type:"personal",characters:["ネロ"],memo:"ヒースクリフ",
text:`晶	ネロはヒースクリフのこと、どう思ってるんですか？
ネロ	同じ東の魔法使いとして、まあ、共感の沸くタイプだよ。
	つい気になっちまうっていうかさ。
晶	共感……。
	ヒースクリフと似てるなって思うのはどんなところですか？
ネロ	ヒースは機械いじりが好きだろ。
	ひとりで引きこもって作業に没頭したいって気持ちはよくわかるかな。
	のめり込んで細かい作業に集中してる時って、地味な気持ちの良さがあるんだよな。
~~~~~~~~~	~~~~~~~~~
選択	あります。
ネロ	あるよなぁ……。
	でも、それが全然わからねえやつも世の中にはけっこういるんだよな……。
~~~~~~~~~	~~~~~~~~~
選択	ないです。
ネロ	ないんだ……。
	まあ、そのくらいの性格の方が、異世界で生きてくには丁度いいのかもな。
~~~~~~~~~	~~~~~~~~~

ネロ	幸い、俺は作業を仕事にできたけど、ヒースはそんなわけにもいかないだろうからさ。
	まあ、あと数十年は大変だろうな。
晶	貴族の子息で、いずれは家を継ぐとなると、社交も大切になりますもんね……。
ネロ	あいつの性格で、この国の魔法使いとして、貴族に生まれて来たってのは、そうとうキツかったと思うぜ。
	ヒースが引っ込み思案な分、ふてぶてしいシノが傍に控えてるから、まあ、大丈夫だとは思うけどな。
	あいつの性根が優しくていいやつだから、手を貸してくれるやつも多いみたいだ。
	そこは安心してるさ。
`},
{id:11212,title:"ヒースクリフへの印象（４）",type:"personal",characters:["カイン"],memo:"ヒースクリフ",
text:`晶	ヒースクリフが初めて魔法舎に来た時、カインにはすごくお世話になったって言ってましたよ。
カイン	はは、お世話ってほどじゃないけどな。
	貴族のお坊ちゃんだっていうのに控えめで、放っとけない感じに見えたんだよ。
	一緒に来た師匠だって男に顎で使われてたし、もうひとりの東の魔女も、ファウストも、最初はヒースに構ってなかったからさ。
	厄災討伐に参加してから、俺より若い魔法使いが選ばれたのも初めてだったし、俺の役目かなって。
晶	たしか、俺が来るまでは、魔法舎に寝泊まりしてる魔法使いは少なかったんですよね？
カイン	そうそう。だいたいみんな、〈大いなる厄災〉と戦う日だけ集まって来てた。
	たまに遊びに来るやつもいたけど。
	魔法舎によく居たのは、俺と、ヒースと、前の賢者様と、あと何人かくらいだよ。
~~~~~~~~~	~~~~~~~~~
選択	魔法舎に居た理由は？
カイン	当時の俺は騎士団を辞めたばかりで、中央の都には少しだけ居づらかったんだよな。
	まあその……、噂話が多くてさ。
	だから、ちょうど良かった。
	前の賢者様とも気が合ったし、広い魔法舎を占領できて快適だったぜ。
	ヒースも月に１度は顔を出してたな。
	魔法舎や、魔法舎にいる魔法使いに興味があったみたいだ。
晶	興味ですか？人見知りのヒースクリフにしては、珍しいですね。
カイン	シノや師匠以外の魔法使いに会ったことがなかったからさ。
	ヒースは自分の身分と生い立ちに悩んでた。
	自分以外の魔法使いがどうやって生きてるのか、知りたいんだって言ってたよ。
~~~~~~~~~	~~~~~~~~~
選択	魔法舎で何をしていましたか？
カイン	以前の魔法舎は平和でさ、のんびりしてたよ。普通に暮らしてただけだな。
	ヒースが来た時は中央の都に遊びに行ったり、少しだけ魔法について教えたり、前の賢者様と３人でカードをやったりさ。
	シノの話もよく聞いてた。
	幼馴染がいて、ちょっと傍若無人で、無愛想で、生意気で面白くて、弟みたいなやつだって。
	シノ本人に会った時はちょっと感激したんだよな。
	ああこいつだ！話のまんまだな！ってさ。
晶	あはは。
カイン	この城や、シャーウッドの森の話もたくさん聞いてたんだ。
	いい場所で、大好きなんだって。だから、ヒースの故郷を見に来れて、俺も嬉しいよ。
`},
{id:11213,title:"ヒースクリフへの印象（５）",type:"personal",characters:["クロエ"],memo:"ヒースクリフ",
text:`晶	クロエはヒースクリフとも仲が良いですよね。
クロエ	えっ！そう見える？俺は嬉しいけど、ヒースはどう思うかな。
	迷惑じゃないかな？
晶	迷惑だなんて思わないと思いますけど……。
	心配なんですか？
クロエ	だってこんなすごいお城に住んでるでしょう。
	いつもは仲良くしてもらってるけど、改めて、貴公子様なんだなって思っちゃった！
	ふふ、素敵だよね、ヒースって。
	ちょっと憧れてるから、ヒースが俺の服を気に入って着てくれると、すっごく嬉しいんだ！
	ヒースって、細工や彫刻が好きでしょう？
	だからたまに、装飾のデザインを相談することがあるんだよね。
	そうすると、すっごく話が盛り上がるんだ！
	だから今度、一緒に何か作ろうよって誘ってみたことがあるんだけど……。
晶	クロエとヒースがコラボした衣装、ぜひ見てみたいです！
	ヒースはなんて言ってましたか？
クロエ	うーん、なんかねえ……。
	やってはみたいけど、意見がかち合ったらどうしよう、喧嘩したくないな……って、空気だった。
晶	あぁ……。ちょっと、気持ちわかりますね。
クロエ	俺はね、ヒースのこだわりを知りたいし、
	一緒に作るなら絶対良いものを作りたいから、意見を言ってほしいし、
	言っちゃうと思うんだ。
	でも、もしかしたら、ヒースにはそういう俺の気持ちが負担になるのかもしれないよね。
	どこまで意見を言ってもいいかわかるくらい、ヒースもそれを楽しめるくらい
	仲良くなれたら、実現したいなって思ってるんだ！
`},
{id:11214,title:"スポットゆかりの話（１）",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	このお城は、どれくらい昔に建てられたんですか？
ヒースクリフ	中央のグランヴェル城が建てられるよりも前なので、かなり昔ですね。
	東の国で起きた戦争が落ち着いたときに今の城をここに建てたんです。
~~~~~~~~~	~~~~~~~~~
選択	とても歴史があるお城なんですね！
晶	ということは、ヒースの家は、かなり昔から続いている一族なんですか？
ヒースクリフ	はい。東の国家の成り立ちの時から、この土地の領主をしています。
	もともと王家から頼の厚い、領主だったそうですが、戦争で東の王家が衰退の危機に陥ったとき――。
	この土地で陛下を匿って助けたらしいです。
	それをきっかけに、ブランシェット家は有力貴族になったみたいですね。
~~~~~~~~~	~~~~~~~~~
選択	今の城ってどういうことですか？
晶	ということは、このお城が建つ前は、別のところにブランシェットのお城があったんですか？
ヒースクリフ	はい。最初はこの辺一帯の土地を統治する目的で建てられた
	強固な城塞に俺の一族は住んでいたそうです。
		ただ、城壁が古くなってしまったので、今後のことを考えてこの場所に新しい城を建てました。
	今の城に城壁はありませんが、代わりに周囲にある渓谷や森が、その役割を担ってくれているんです。
~~~~~~~~~	~~~~~~~~~

晶	なるほど……。
	教えてくれてありがとうございます。
	ヒースはお家の歴史にとても詳しいんですね。
ヒースクリフ	はは……。小さい頃から、父に何度も聴かせてもらっていたので。
	俺もいつか父親になったら、子供に語って聴かせたりするのかな……？
	まだちょっと、想像がつかないですけどね。
`},
{id:11215,title:"スポットゆかりの話（２）",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	このお城が建てられる前は、ヒースの一族は別の場所に建てられたお城に住んでいたんですよね。
	昔のお城と今のお城って、何か違うところがあるんですか？
ヒースクリフ	昔の城にも堅固な城壁がありましたが、武器が発達したり、戦術が発展したりして、通用しなくなっていったんです。
	先見の明があった先祖の城主が、シャーウッドの森や渓谷を利用して、半ば自然の城塞となる形にしました。
	そのために戦況に応じて柔軟に、増築や増強がしやすい造りになっています。
	ですが、新しい城を建てるわけですから、多くの資金と労働力が必要になるでしょう。
	当時は、反対する声も強かったようです。
晶	大変だったんですね……。
	ヒースのご先祖様はどうやって、その反対の声を抑えたんですか？
ヒースクリフ	人望、でしょうか。
	誠実で冷静で頭の良い方だったと聞いていますから。
	実際に戦乱の時代には、ブランシェットの城が国防の大きな助けになったそうです。
晶	このお城が国と人を守ったんだ……！
	ヒースのご先祖様は、とても思慮深い方だったんですね。
ヒースクリフ	はい。俺はその話を聞いて、誰かに信頼されることも、冷静に客観的に未来を見通すことも、大事だなって思いました。
	俺にもいつか出来るようになるといいんですけど……。
晶	（そうか。ヒースは未来の城主だから……）
	ヒースならきっと出来るようになりますよ。
	普段の言葉からも、冷静に物事を見てくれているなって感じますし。
ヒースクリフ	……ありがとうございます、賢者様。少しずつですが、頑張ります。
`},
{id:11216,title:"東の国について",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ヒースクリフは東の国をどんな風に思っているんですか？
ヒースクリフ	そうですね……。祖国ですから、愛情はもちろんあります。
	自然はきれいだし、人も静かですし。
	魔法使いには冷たいけれど、和を乱す、異端な者が敬遠されるのは、魔法使いだけではないし……。
晶	そうなんですね。
ヒースクリフ	人に合わせられない人は浮きますね。
	それに東の国では職人農夫か、牧場が好まれるんです。暮らしが堅実ですからね。
	有名な芸術家はいますが、芸術家を目指す者はあきれられます。
	真面目に勉強して学者になるのは歓迎されるけれど、変な発明をしていたら、変人だと思われますね。
晶	じゃあ、西の魔法使いたちは東の国では暮らしにくそうですね。
ヒースクリフ	そうですね……。
	足並みを揃えるのが得意だから、出来ない人はわがままに見えるんです。
	その分、一致団結した時には、物凄い力を発揮するんです。
	昔から、東の国は強兵の国なんですよ。
	そういうところは、少しだけ……。
	怖く感じる時がありますね。
`},
{id:11217,title:"〈大いなる厄災〉について",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	〈大いなる厄災〉が来る日はどんな風に過ごしていたんですか？
ヒースクリフ	何日か前から、いざという時のための食料を備えて、襲来する日は城で過ごしていました。
	例年被害は出ていなかったのですが、〈大いなる厄災〉を迎撃出来なければ、世界が滅びると聞いていたので……。
	幼い自分にとっては、死を一番身近に感じる時間でしたね。
	明日が来なかったら、どうしようとか。
晶	そうですよね……。
	世界の終わりの危険が毎年あるって、やっぱり、緊張しますよね……。
ヒースクリフ	でも……。
	楽しみにしていたこともあるんです。
晶	楽しみにしていたこと？
ヒースクリフ	〈大いなる厄災〉が襲来する日は、使用人も城の中で過ごしたんです。
	だから、大人たちに怒られないでシノの隣で朝まで過ごせる貴重な日でもあったんですよ。
	〈大いなる厄災〉を怖がりながら、その日のために、こっそり、お菓子や玩具を用意したりして……。
晶	あはは！かわいい！
ヒースクリフ	あの時のどきどきする気持ち……。
	今でも真夜中にシノと一緒にいるとなんとなく、思い出しますね。
`},
{id:11218,title:"泣いた理由",type:"personal",characters:["シノ","ヒースクリフ"],memo:"ヒースクリフ",
text:`シノ	昔、この噴水のそばで、ヒースを泣かしたことがある。
晶	えっ。子供の頃にですか？
ヒースクリフ	シノ……！恥ずかしい話するなよ、賢者様の前で……！
晶	ケンカしちゃったんですか？
シノ	ケンカもたくさんしたけどな。ここでは、オレの話をした。覚えてるか？ヒース。
ヒースクリフ	……覚えてるよ。
	シノと知り合って間もない頃……本当に、まだお互い小さかった頃ですよ。
	城で働く前のシノの話を聞いたんです。
	シノは物心ついた時からひとりで、ひどい目に遭いながら生きてきてて……。
	温室育ちの貴族の子供だった俺には、想像もできない悲惨な生活だったから、驚いて、悲しくなっちゃって、つい……。
シノ	ふふ。泣いたヒースは綺麗だった。もっと見たくて、たくさん話した。
晶	シノのたくましさには救われますね……。
ヒースクリフ	こんなことも、こんなことも、って聞かされて。
	耳を塞ぎたくなる話でしたけど、切り上げるような薄情な真似もできなくて……。
シノ	城のやつに見つかって、叱られそうになったけど、ヒースがかばってくれた。
	噴水に落ちて、オレが助けたって。
	濡れてるのは顔だけだったのにな。子供の頃のヒースは言い訳が下手だ。
	夕方、こっそり奥様のレモンパイを貰った。
	ブランシェットで暮らした中でもあの日はとびきりいい日だった。
`},
{id:11219,title:"スポットの人々",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ブランシェット領は、どんな気質の人が多いんですか？
ヒースクリフ	真面目で、誇り高い、職人気質の人たちが多いですね。
	家族や仲間をとても大事にしています。
	首都である雨の街では、他人と関わらないように暮らしている人達が多かったですけれど……。
	このあたりは職人や農夫が多いので、村長や親方を中心に、しっかり縦関係で結ばれています。
	ブランシェット城は国の要所ですから、有事には、みんな戦士となります。
	だから、軍人気質っていうのかな。
	今はにこやかな人も増えましたけど、祖父母の代にはそういう振る舞いは軽薄に見えていたようです。
晶	それじゃあ、わりと武闘派なんですね……。
ヒースクリフ	土地柄だけ……。俺も両親もそんな雰囲気じゃないんですけど……。
	過去に武勲を多く立てて、現在も産業が安定していますから、東の国の要を担っている自負はありますね。
	だからといって、発言権が強くならないように、父上は気をつけているみたいです。
晶	どうしてですか？
ヒースクリフ	王家の方々に、謀反や反乱を疑われないようにです。
	だから……。
	シノは手柄を立てたがるけれど、それはとても危険なことなんですよ。
`},
{id:11220,title:"スポットにいた魔法使い",type:"personal",characters:["シノ"],memo:"ヒースクリフ",
text:`晶	シノとヒースの魔法のお師匠様とも、このお城で出会ったんですよね。
シノ	ああ。師匠はくそじじいだった。
	威張ってて、陰湿で、酒浸りで、自慢話が多い割に話が薄っぺらい。
晶	ぼろくそ言いますね……。
シノ	本当のことだ。横暴さ加減に辟易してたぜ。オレはかなり我慢した。
	旦那様と奥様がヒースのために連れてきた男だったから、ヒースも両親の顔を潰せなくて黙って従ってた。
晶	そうだったんですか……。
シノ	東の国は、自分が魔法使いだって隠してるやつが多いだろ。
	陰気に暮らして、人間の陰口を叩くくらいなら、魔力があるんだからやり返せばいいのにとずっと思ってたが……。
	自分から表に出てくるようなやつもろくなのがいないんだと分かった。
晶	地域性なんでしょうか……。
シノ	さあな。ヒースやファウストみたいないい魔法使いが目立つ国なら、
	人間に舐められず済むのに、あいつらは嫌がる。
	賢者の魔法使いに選ばれたヒースと師匠が、魔法舎からしばらく帰ってこなかったから、心配でしょうがなかった。
	今はオレがそばでヒースの面倒を見てやれてほっとしてる。
	正しい魔法の知識も教えてもらえるしな。
`},
{id:11221,title:"危険な場所",type:"personal",characters:["シノ","ネロ"],memo:"ヒースクリフ",
text:`シノ	賢者。その道に用事か。
晶	あ、シノ。散歩をしてたんです。こっちには何かあるのかなと思って。
	……？どうしたんですか、にやにやして……。
シノ	ここから先はヒースが近づかない場所だ。どうしてかわかるか？
~~~~~~~~~	~~~~~~~~~
選択	危ない場所ですか？
シノ	魔法使いにとって危ない場所なんて、この城のそばにはないさ。
~~~~~~~~~	~~~~~~~~~
選択	怖い場所ですか？
シノ	ふふ、怖くなんかないさ。でも、ヒースにとってはそうかもな。
~~~~~~~~~	~~~~~~~~~
選択	貴族は立ち入り禁止とか？
シノ	貴族の立ち入れない場所なんてないさ。ルールを決めるのが貴族だからな。
	オレたち使用人が入れない場所はたくさんある。
~~~~~~~~~	~~~~~~~~~

シノ	オレが守ってるんだからな。この先には、亡霊が現れるって噂の井戸がある。
晶	亡霊ですか…？
シノ	昔、家の食器を割ったメイドが、当時の執事長から受けた折檻に耐えかねて井戸に身を投げたんだ。
	今でもたまに、井戸の底から、食器を探してすすり泣く女の声が聞こえるって……。
？？？	わっ！！
晶	ぎゃーーーーっ！？
ネロ	あっはっは、賢者さん、派手な驚き方だな。
シノ	ネロ、ナイス。
	それ以来、ブランシェットは、女の使用人にちょっとだけ優しいって話だ。
	薄情にすると、メイドに呪われるんだって。
	ヒースは怖がって近づかないが、誰にだって優しいから、あいつが気にする必要ないのにな。
`},
{id:11222,title:"ヒースクリフの評判",type:"personal",characters:["ファウスト"],memo:"ヒースクリフ",
text:`晶	ファウスト。どなたと話していたんですか？
	珍しくにこやかでしたけど……。
ファウスト	珍しいは余計だ。ブランシェット城の執事長だよ。
	ヒースクリフの話を聞いていたんだ。想像以上に、ヒースは優秀な子だな。
	学問の成績もいいし、馬術も優れてる。領内の知識も豊富だ。
	城主の不在時に起きた問題を、代わりに、解決したりもしている。
	シノが心酔するわけだ。
晶	そうなんですね。
	しっかりしてるとは思ってましたが、いつも控えめだから……。
ファウスト	性格が才覚の邪魔をしているな。ヒースが魔法使いでなければ……。
	自信に満ちた彼が、この城を颯爽と闊歩する姿が見られたのかもしれないが。
晶	ファウスト……。
ファウスト	だが、そうしたら僕のことを先生と慕ってくれることもなかっただろう。
	何が幸福かは、わからないな。
	彼は魔法使いだとしても、シノや城のみなに愛されている。
	……なんにせよ、いい人生を歩んでくれたらと、僕は願うよ。
`},
{id:11223,title:"スポットの名物",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`ヒースクリフ	ブランシェット領では、上質な木材を使用した精巧な工芸品が特産物なんです。
