{id:11201,title:"スポットの印象（１）",type:"personal",characters:["カイン"],memo:"ヒースクリフ",
text:`晶	カインから見て、ブランシェッドの城や領地はどんな印象ですか？
カイン	騎士としては城の造りが気になるよ。
	ここの攻略は難しそうだなとか、このあたりは手強そうだとか。
晶	攻略側の視点なんですか？
カイン	いざとなれば、攻め入る場所にもなるからな。
	いいところは中央の国にも活かしたいし。
晶	なるほど……。軍人っぽい見方ですね。
カイン	個人的な印象としては……。俺……。なんか……。城の人たちに嫌われてないか……？
晶	え！？そんなことはないと思いますけど、何か言われたんですか？
カイン	言葉に棘があるっていうか……。
	姿は見えないから、俺の気のせいかもしれないけどさ。
ヒースクリフ	カイン！
カイン	おお、ヒース！
晶	（自然に肩を抱いた。なんだか兄弟みたいで微笑ましいな。……ん？
	　…………！執事さんが怖い顔で睨んでる！
	　そりゃそうか！よくわからない他国の元騎士団長と
	　自分の大事なお坊ちゃんだもんな……）
執事	ごほん！中央の国の魔法使いどの。ここはブランシェッド城ですので。
カイン	ん？知ってるぞ。新設にありがとうな！
晶	（直接的に注意しない東の国の人と、直接言わないとわからないカイン……。
	　たしかに相性悪そうだ……）
`},
{id:11202,title:"スポットの印象（２）",type:"personal",characters:["ラスティカ"],memo:"ヒースクリフ",
text:`晶	ラスティカも貴族なんですよね。ブランシェットの城はどのような印象ですか？
ラスティカ	素敵な城ですね。
	西の国の城がばらの花だとしたら、東の国の城はりんどうの花のようです。
	こうして佇んでいると身が引き締まるような心持ちになります。
晶	（お城の前でむラスティカ、やっぱり、絵になるな……）
ラスティカ	ですが……。肩の力を抜いて、賑やかな演奏がしたい気持ちにもなります。
	ちょうど、そんな気分だったところです。賢者様がいらしてくれて良かった。
	《アモレスト・ヴィエッセ》
晶	え！？
ラスティカが呪文を唱えると、片手ほどの大きさの鉄琴とスティックが現れた。
ラスティカが鉄琴を響かせると音に合わせて踊るように、庭園の噴水が高く吹き上がった。
それはお城のてっぺんを超えて、きらきらと、七色の水飛沫を撒き散らす。
城の人	な、何事だ！？
晶	ら、ラスティカ、人が……。
ラスティカ	おや、観客が集まってくれたのですね。それでは、さらに技に磨きをかけましょう。
	ふふ、ここからが本番ですよ。
晶	いや、あの……っ。
ラスティカ	《アモレスト・ヴィエッセ》
`},
{id:11203,title:"スポットの印象（３）",type:"personal",characters:["アーサー","シノ"],memo:"ヒースクリフ",
text:`晶	あれっ、アーサー。ブランシェットに来ていたんですね。
アーサー	しーっ。申し訳ありません、賢者様。私がここにいることはどうかご内密に。
	来ていると分かれば、ヒースクリフの両親や、城のものが、気を遣ってしまいますので……。
晶	たしかに、隣国の王子様が突然現れたら、大騒ぎになりそうです……。
	何か用事があったんですか？
アーサー	いえ、私用です。
	シノと故郷の話をしていたら、城や森を案内すると、連れて来てくれて。
晶	（シノ、自慢したかったのかな……）
アーサー	シノの話していたとおり、城を取り囲むシャーウッドの森は広大で威厳を感じますね。
	森が城壁の代わりになると聞きましたが、たしかに、難攻不落の土地というのもうなずけます。
	森番を任されているシノは優秀だな。きっと、みなから重宝されていたでしょう。
シノ	ここにいたのか、王子様。こっちだ、テキパキついてこい。
アーサー	ああ。
晶	お城に行くんですか？
シノ	ヒースの部屋に忍び込むんだ。アーサーがいたら驚くぜ、あいつ。
アーサー	どきどきしてきたな！
晶	（サプライズだったんだ……）
`},
{id:11204,title:"ブレイクタイム（１）",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ブランシェット城には、からくり仕掛けのものがたくさんありますね。
	見ていて面白いです。
ヒースクリフ	はい。この噴水にも面白い仕掛けがありますよ。ちょうど今、動き出すはず……。
晶	わあ……！音楽が聞こえてきた。ヒース。この噴水はどんな仕組みが――。
ヒースクリフ	…………。
晶	ど、どうしました？もしかして何か気になることでも？
ヒースクリフ	………！ぼうっとしていました。すみません。
晶	いえ。でも、ヒースがぼんやりするなんて珍しいですね。
ヒースクリフ	はは……。俺、この噴水が気に入っていて。
晶	ヒースのお気に入り……。ということは、仕組みが特に凝っているとか？
ヒースクリフ	仕組みも勿論なんですが、それだけじゃなくて。
	この噴水が、させてくれる体験も好きなんです。
	音楽が聴こえてくると、わくわくして……。
	子供の頃から、噴水の近くで本を読むのが好きでした。
	……あ！話が逸れてしまいました。噴水の仕掛けについてですよね。
	これは水圧を利用して、一定時間が経つとパイプオルガンが演奏されるようになっています。それに……。
晶	（ヒース、生き生きしてる。
	　普段は落ち着いているけど、機械の話をしているときは年相応で可愛いな）
`},
{id:11205,title:"ブレイクタイム（２）",type:"personal",characters:["ファウスト"],memo:"ヒースクリフ",
text:`晶	ファウスト……。庭にテーブルとティーセットなんて豪華ですね。
	ひとりでお茶会をしてるんですか？
ファウスト	……用があってヒースクリフを待っているだけだったんだが……。
	城の者たちに見つかって、この有様だよ。
ファウストの座るテーブルは上品に飾られ、ひとりでは食べきれないほどの軽食やお菓子やお茶が並んでいた。
晶	ずいぶん丁重なおもてなしを受けたんですね……。
ファウスト	こんな賓客扱い、かえって迷惑だと言ったんだが、ヒースの手前、無下に断ることもできなくてな。
	さっきまで、使用人がひと通り挨拶に来ていた。
	ヒースクリフはよっぽど僕を持ち上げて伝えていたんだろう。
	それこそ人違いだと言いたかったよ。
晶	前の厄災との戦いで、
	ファウストはヒースを庇って怪我をしたって聞きましたよ。
	ここの人たちにとっても恩人ですもんね。
ファウスト	たまたまさ。次はどうなるのかもわからない。
	勝手に期待して、失望されても困るのに。
そう言ったファウストの表情には、言葉ほどの棘はなかった。
大事な人をもてなすための食器やお茶菓子は、そのままヒースクリフへの愛情を感じさせる。
それは俺にとっても嬉しい事に思えた。ファウストも同じように感じたのかもしれない。
晶	ご一緒してもいいですか？
ファウスト	ああ、たくさん食べてくれ。ヒースクリフが戻ったらあの子にも手伝ってもらおう。
	僕の用事はその後だな。
`},
{id:11206,title:"スポットの思い出（１）",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ブランシェット城は素敵なお城ですね。
	ヒースはお城の中で、お気に入りの場所ってありますか？
ヒースクリフ	自分の部屋は、やっぱり落ち着きます。趣味にも没頭ができるので。
	あ……。あとは、書庫かな。
	歴史や作法を学べる本から、小説まで、いろんな種類の本があるんです。
	それに、あの場所にいると、なんとなく父の優しさを感じられるというか……。
晶	優しさ？
ヒースクリフ	本棚にいつのまにか、機械やからくりに関する本が増えていることがあったんです。
	俺が好きそうな本だからって、こっそり揃えてくれていたみたいで。
晶	そういうのいいなあ……。素敵なお父さんですね！
ヒースクリフ	はい。厳しいところもありますが、優しくて格好良くて、俺の憧れなんです。
	……あ。賢者様、紅茶が切れていますね。
	新しいのをお淹れしましょうか？
晶	ありがとうございます。いただきます。
	（ヒースは、いつもさりげない気遣いをしてくれるけど……、
	　もしかしたら、お父さん譲りなのかもしれないな）
`},
{id:11207,title:"スポットの思い出（２）",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	シノとヒースは幼馴染なんですよね。
	シノがこの部屋に遊びに来たりすることはあったんですか？
ヒースクリフ	あったんですけど……。本当にたまにでした。
晶	そうなんですか？意外ですね。シノはヒースの部屋に来たがりそうなのに。
ヒースクリフ	……シノは外担当の小間使いなので、城の中に入るのを禁止されていましたから。
	あ、シノだけっていうわけじゃなく、
	基本的に外で働く使用人は入れない決まりになっているんですけど。
	だから、俺の部屋にいるのが誰かに見つかると、シノが怒られてしまうんです。
晶	そうなんですね……。ヒースは寂しくなかったですか？
ヒースクリフ	正直に言えば、寂しかったかな……。でも、嬉しいこともありました。
	たまにこっそりシノがやって来て窓からリスを見せてくれたり、嵐の日に声をかけてくれたりしてくれて。
	いつのまにか窓を叩く音を聞くとわくわくするようになっていました。
語尾が優しく霞む。俺がヒースを見ると、彼は微笑んだ。
ヒースクリフ	そうやって、俺たちは友達になっていったのかもしれません。
`},
{id:11208,title:"スポットの思い出（３）",type:"personal",characters:["シノ"],memo:"ヒースクリフ",
text:`シノ	シャーウッドの森番を任されるまでは、ブランシェット城で、庭仕事や小間使いみたいなことをしてた。
晶	お城の仕事って、具体的にはどんなことをするんですか？
シノ	大きな城だから、用事はたくさんある。
	庭の掃除とか、見回りとか、馬の世話とか、馬車や農具を磨いたりだとか。
	城の中でも、一番身分の低い仕事だ。
	だけど、屋根のあるところで寝られるし、必ず食事にありつける。最高だったな。
	オレは庭の手入れが好きだった。専門の庭師もいるけど、たまに手伝ってたんだ。
	あそこの垣根の木は、オレが植えた。
晶	ああ、あの道沿いにある背の低い木ですか？
シノ	これから大きくなるんだよ。
晶	シノのことを言ったわけじゃ……。
シノ	あの木は特別だ。冬になると白い花が咲く。
	冬にも花が咲くのはオレの木だけだからな。
	蕾がついたら、手折ってヒースにやってた。
	ヒースはいつも花瓶に枝を挿して、窓辺に置いてくれた。
	オレは庭仕事をしながら、その窓を眺めるのが好きだった。
	誰かがオレのした仕事を知ってる。
	オレの仕事が、冬でも、ヒース坊ちゃんの部屋を少しだけ華やかにしてる。
	そう思うと……。
	どんなに小さな仕事でも誇らしく思えた。
	ブランシェッドで貰った仕事は、そういう仕事だったよ。
`},
{id:11209,title:"ヒースクリフへの印象（１）",type:"personal",characters:["ファウスト"],memo:"ヒースクリフ",
text:`晶	ヒースクリフはファウストのことを先生としてとても慕っているように見えますけど、
	俺が魔法舎に来る前から親しかったんですか？
ファウスト	賢者の魔法使いたちと顔を合わせても、必要以上に関わらずにいるつもりだったが、
	ヒースは、見るに見兼ねて手を貸した。
	魔法もろくに使えない、知識にも乏しい、性格も本当にクソみたいな男に連れられていたからな。
晶	ヒースクリフの、前の師匠のことですよね……。
	ファウストがそんなふうに言うなんて、よっぽどだったんでしょうね……。
ファウスト	あの男は、自分の魔力が弱いことや、東の国での魔法使いの扱いへの劣等感をヒースクリフにぶつけていたんだよ。
	それでもヒースは従おうとしていた。
	だから見兼ねて助言をしただけだ。
晶	ヒースクリフは、正しい魔法の知識を教えてもらえて、心強かったと思いますよ。
ファウスト	そんなに大層なことは教えていない。前の師匠の出来が悪すぎただけだ。
	だけどそれ以降、何度僕はきみが思うような魔法使いじゃないと言っても、僕を善良だと疑わない。
	……意地悪が言いにくい。
晶	意地悪なんて。
	ファウストだって優しいんですから、普通に接してあげればいいのに。
ファウスト	呪い屋なんかに関われば家名に傷がつく。
	あの子は、貴族の子息としても、賢者の魔法使いとしても、立派に務めを果たしているのに。
	慕われすぎるのも問題だ。
	そろそろ、線引きしておかないとな。
	……今はまだ未熟だから、そのうち、だけれど。
`},
{id:11210,title:"ヒースクリフへの印象（２）",type:"personal",characters:["シノ"],memo:"ヒースクリフ",
text:`晶	シノは、ヒースクリフのこと、どう思ってるんですか？
シノ	格好いい。顔も麗だし、優しくて頭も良い。何より、オレの主君だ。
晶	理想のご主人様ですか？
シノ	至らないところもある。引っ込み思案だったり、恥ずかしがり屋なところ。
	でも、それを直せば、完璧だ。
	あんたもヒースのこと、すごいやつだって思うだろ。
晶	はい。素敵な人だなって思います。
シノ	そうさ。わからないやつは馬鹿だ。馬鹿の言うことなんて聞かなくていい。
	そんな奴らの文句なんて結局、魔法使いが怖いから弱い自分たちに近付くな、ってことなんだ。
	放っておけばいいのに、ヒースは優しいからな。
晶	シノ自身が、ヒースクリフの主君だったらって思ったことはないんですか？
ふと思い立ったことを尋ねると、シノは驚いたように瞬きした。
シノ	考えたこともない。
ヒースを、ブランシェットを守るのはオレだってずっと思ってた。
	従えようなんて、１度も思ったことはない。
	不敬な質問だぜ、賢者様。
`},
{id:11211,title:"ヒースクリフへの印象（３）",type:"personal",characters:["ネロ"],memo:"ヒースクリフ",
text:`晶	ネロはヒースクリフのこと、どう思ってるんですか？
ネロ	同じ東の魔法使いとして、まあ、共感の沸くタイプだよ。
	つい気になっちまうっていうかさ。
晶	共感……。
	ヒースクリフと似てるなって思うのはどんなところですか？
ネロ	ヒースは機械いじりが好きだろ。
	ひとりで引きこもって作業に没頭したいって気持ちはよくわかるかな。
	のめり込んで細かい作業に集中してる時って、地味な気持ちの良さがあるんだよな。
~~~~~~~~~	~~~~~~~~~
選択	あります。
ネロ	あるよなぁ……。
	でも、それが全然わからねえやつも世の中にはけっこういるんだよな……。
~~~~~~~~~	~~~~~~~~~
選択	ないです。
ネロ	ないんだ……。
	まあ、そのくらいの性格の方が、異世界で生きてくには丁度いいのかもな。
~~~~~~~~~	~~~~~~~~~

ネロ	幸い、俺は作業を仕事にできたけど、ヒースはそんなわけにもいかないだろうからさ。
	まあ、あと数十年は大変だろうな。
晶	貴族の子息で、いずれは家を継ぐとなると、社交も大切になりますもんね……。
ネロ	あいつの性格で、この国の魔法使いとして、貴族に生まれて来たってのは、そうとうキツかったと思うぜ。
	ヒースが引っ込み思案な分、ふてぶてしいシノが傍に控えてるから、まあ、大丈夫だとは思うけどな。
	あいつの性根が優しくていいやつだから、手を貸してくれるやつも多いみたいだ。
	そこは安心してるさ。
`},
{id:11212,title:"ヒースクリフへの印象（４）",type:"personal",characters:["カイン"],memo:"ヒースクリフ",
text:`晶	ヒースクリフが初めて魔法舎に来た時、カインにはすごくお世話になったって言ってましたよ。
カイン	はは、お世話ってほどじゃないけどな。
	貴族のお坊ちゃんだっていうのに控えめで、放っとけない感じに見えたんだよ。
	一緒に来た師匠だって男に顎で使われてたし、もうひとりの東の魔女も、ファウストも、最初はヒースに構ってなかったからさ。
	厄災討伐に参加してから、俺より若い魔法使いが選ばれたのも初めてだったし、俺の役目かなって。
晶	たしか、俺が来るまでは、魔法舎に寝泊まりしてる魔法使いは少なかったんですよね？
カイン	そうそう。だいたいみんな、〈大いなる厄災〉と戦う日だけ集まって来てた。
	たまに遊びに来るやつもいたけど。
	魔法舎によく居たのは、俺と、ヒースと、前の賢者様と、あと何人かくらいだよ。
~~~~~~~~~	~~~~~~~~~
選択	魔法舎に居た理由は？
カイン	当時の俺は騎士団を辞めたばかりで、中央の都には少しだけ居づらかったんだよな。
	まあその……、噂話が多くてさ。
	だから、ちょうど良かった。
	前の賢者様とも気が合ったし、広い魔法舎を占領できて快適だったぜ。
	ヒースも月に１度は顔を出してたな。
	魔法舎や、魔法舎にいる魔法使いに興味があったみたいだ。
晶	興味ですか？人見知りのヒースクリフにしては、珍しいですね。
カイン	シノや師匠以外の魔法使いに会ったことがなかったからさ。
	ヒースは自分の身分と生い立ちに悩んでた。
	自分以外の魔法使いがどうやって生きてるのか、知りたいんだって言ってたよ。
~~~~~~~~~	~~~~~~~~~
選択	魔法舎で何をしていましたか？
カイン	以前の魔法舎は平和でさ、のんびりしてたよ。普通に暮らしてただけだな。
	ヒースが来た時は中央の都に遊びに行ったり、少しだけ魔法について教えたり、前の賢者様と３人でカードをやったりさ。
	シノの話もよく聞いてた。
	幼馴染がいて、ちょっと傍若無人で、無愛想で、生意気で面白くて、弟みたいなやつだって。
	シノ本人に会った時はちょっと感激したんだよな。
	ああこいつだ！話のまんまだな！ってさ。
晶	あはは。
カイン	この城や、シャーウッドの森の話もたくさん聞いてたんだ。
	いい場所で、大好きなんだって。だから、ヒースの故郷を見に来れて、俺も嬉しいよ。
`},
{id:11213,title:"ヒースクリフへの印象（５）",type:"personal",characters:["クロエ"],memo:"ヒースクリフ",
text:`晶	クロエはヒースクリフとも仲が良いですよね。
クロエ	えっ！そう見える？俺は嬉しいけど、ヒースはどう思うかな。
	迷惑じゃないかな？
晶	迷惑だなんて思わないと思いますけど……。
	心配なんですか？
クロエ	だってこんなすごいお城に住んでるでしょう。
	いつもは仲良くしてもらってるけど、改めて、貴公子様なんだなって思っちゃった！
	ふふ、素敵だよね、ヒースって。
	ちょっと憧れてるから、ヒースが俺の服を気に入って着てくれると、すっごく嬉しいんだ！
	ヒースって、細工や彫刻が好きでしょう？
	だからたまに、装飾のデザインを相談することがあるんだよね。
	そうすると、すっごく話が盛り上がるんだ！
	だから今度、一緒に何か作ろうよって誘ってみたことがあるんだけど……。
晶	クロエとヒースがコラボした衣装、ぜひ見てみたいです！
	ヒースはなんて言ってましたか？
クロエ	うーん、なんかねえ……。
	やってはみたいけど、意見がかち合ったらどうしよう、喧嘩したくないな……って、空気だった。
晶	あぁ……。ちょっと、気持ちわかりますね。
クロエ	俺はね、ヒースのこだわりを知りたいし、
	一緒に作るなら絶対良いものを作りたいから、意見を言ってほしいし、
	言っちゃうと思うんだ。
	でも、もしかしたら、ヒースにはそういう俺の気持ちが負担になるのかもしれないよね。
	どこまで意見を言ってもいいかわかるくらい、ヒースもそれを楽しめるくらい
	仲良くなれたら、実現したいなって思ってるんだ！
`},
{id:11214,title:"スポットゆかりの話（１）",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	このお城は、どれくらい昔に建てられたんですか？
ヒースクリフ	中央のグランヴェル城が建てられるよりも前なので、かなり昔ですね。
	東の国で起きた戦争が落ち着いたときに今の城をここに建てたんです。
~~~~~~~~~	~~~~~~~~~
選択	とても歴史があるお城なんですね！
晶	ということは、ヒースの家は、かなり昔から続いている一族なんですか？
ヒースクリフ	はい。東の国家の成り立ちの時から、この土地の領主をしています。
	もともと王家から頼の厚い、領主だったそうですが、戦争で東の王家が衰退の危機に陥ったとき――。
	この土地で陛下を匿って助けたらしいです。
	それをきっかけに、ブランシェット家は有力貴族になったみたいですね。
~~~~~~~~~	~~~~~~~~~
選択	今の城ってどういうことですか？
晶	ということは、このお城が建つ前は、別のところにブランシェットのお城があったんですか？
ヒースクリフ	はい。最初はこの辺一帯の土地を統治する目的で建てられた
	強固な城塞に俺の一族は住んでいたそうです。
		ただ、城壁が古くなってしまったので、今後のことを考えてこの場所に新しい城を建てました。
	今の城に城壁はありませんが、代わりに周囲にある渓谷や森が、その役割を担ってくれているんです。
~~~~~~~~~	~~~~~~~~~

晶	なるほど……。
	教えてくれてありがとうございます。
	ヒースはお家の歴史にとても詳しいんですね。
ヒースクリフ	はは……。小さい頃から、父に何度も聴かせてもらっていたので。
	俺もいつか父親になったら、子供に語って聴かせたりするのかな……？
	まだちょっと、想像がつかないですけどね。
`},
{id:11215,title:"スポットゆかりの話（２）",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	このお城が建てられる前は、ヒースの一族は別の場所に建てられたお城に住んでいたんですよね。
	昔のお城と今のお城って、何か違うところがあるんですか？
ヒースクリフ	昔の城にも堅固な城壁がありましたが、武器が発達したり、戦術が発展したりして、通用しなくなっていったんです。
	先見の明があった先祖の城主が、シャーウッドの森や渓谷を利用して、半ば自然の城塞となる形にしました。
	そのために戦況に応じて柔軟に、増築や増強がしやすい造りになっています。
	ですが、新しい城を建てるわけですから、多くの資金と労働力が必要になるでしょう。
	当時は、反対する声も強かったようです。
晶	大変だったんですね……。
	ヒースのご先祖様はどうやって、その反対の声を抑えたんですか？
ヒースクリフ	人望、でしょうか。
	誠実で冷静で頭の良い方だったと聞いていますから。
	実際に戦乱の時代には、ブランシェットの城が国防の大きな助けになったそうです。
晶	このお城が国と人を守ったんだ……！
	ヒースのご先祖様は、とても思慮深い方だったんですね。
ヒースクリフ	はい。俺はその話を聞いて、誰かに信頼されることも、冷静に客観的に未来を見通すことも、大事だなって思いました。
	俺にもいつか出来るようになるといいんですけど……。
晶	（そうか。ヒースは未来の城主だから……）
	ヒースならきっと出来るようになりますよ。
	普段の言葉からも、冷静に物事を見てくれているなって感じますし。
ヒースクリフ	……ありがとうございます、賢者様。少しずつですが、頑張ります。
`},
{id:11216,title:"東の国について",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ヒースクリフは東の国をどんな風に思っているんですか？
ヒースクリフ	そうですね……。祖国ですから、愛情はもちろんあります。
	自然はきれいだし、人も静かですし。
	魔法使いには冷たいけれど、和を乱す、異端な者が敬遠されるのは、魔法使いだけではないし……。
晶	そうなんですね。
ヒースクリフ	人に合わせられない人は浮きますね。
	それに東の国では職人農夫か、牧場が好まれるんです。暮らしが堅実ですからね。
	有名な芸術家はいますが、芸術家を目指す者はあきれられます。
	真面目に勉強して学者になるのは歓迎されるけれど、変な発明をしていたら、変人だと思われますね。
晶	じゃあ、西の魔法使いたちは東の国では暮らしにくそうですね。
ヒースクリフ	そうですね……。
	足並みを揃えるのが得意だから、出来ない人はわがままに見えるんです。
	その分、一致団結した時には、物凄い力を発揮するんです。
	昔から、東の国は強兵の国なんですよ。
	そういうところは、少しだけ……。
	怖く感じる時がありますね。
`},
{id:11217,title:"〈大いなる厄災〉について",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	〈大いなる厄災〉が来る日はどんな風に過ごしていたんですか？
ヒースクリフ	何日か前から、いざという時のための食料を備えて、襲来する日は城で過ごしていました。
	例年被害は出ていなかったのですが、〈大いなる厄災〉を迎撃出来なければ、世界が滅びると聞いていたので……。
	幼い自分にとっては、死を一番身近に感じる時間でしたね。
	明日が来なかったら、どうしようとか。
晶	そうですよね……。
	世界の終わりの危険が毎年あるって、やっぱり、緊張しますよね……。
ヒースクリフ	でも……。
	楽しみにしていたこともあるんです。
晶	楽しみにしていたこと？
ヒースクリフ	〈大いなる厄災〉が襲来する日は、使用人も城の中で過ごしたんです。
	だから、大人たちに怒られないでシノの隣で朝まで過ごせる貴重な日でもあったんですよ。
	〈大いなる厄災〉を怖がりながら、その日のために、こっそり、お菓子や玩具を用意したりして……。
晶	あはは！かわいい！
ヒースクリフ	あの時のどきどきする気持ち……。
	今でも真夜中にシノと一緒にいるとなんとなく、思い出しますね。
`},
{id:11218,title:"泣いた理由",type:"personal",characters:["シノ","ヒースクリフ"],memo:"ヒースクリフ",
text:`シノ	昔、この噴水のそばで、ヒースを泣かしたことがある。
晶	えっ。子供の頃にですか？
ヒースクリフ	シノ……！恥ずかしい話するなよ、賢者様の前で……！
晶	ケンカしちゃったんですか？
シノ	ケンカもたくさんしたけどな。ここでは、オレの話をした。覚えてるか？ヒース。
ヒースクリフ	……覚えてるよ。
	シノと知り合って間もない頃……本当に、まだお互い小さかった頃ですよ。
	城で働く前のシノの話を聞いたんです。
	シノは物心ついた時からひとりで、ひどい目に遭いながら生きてきてて……。
	温室育ちの貴族の子供だった俺には、想像もできない悲惨な生活だったから、驚いて、悲しくなっちゃって、つい……。
シノ	ふふ。泣いたヒースは綺麗だった。もっと見たくて、たくさん話した。
晶	シノのたくましさには救われますね……。
ヒースクリフ	こんなことも、こんなことも、って聞かされて。
	耳を塞ぎたくなる話でしたけど、切り上げるような薄情な真似もできなくて……。
シノ	城のやつに見つかって、叱られそうになったけど、ヒースがかばってくれた。
	噴水に落ちて、オレが助けたって。
	濡れてるのは顔だけだったのにな。子供の頃のヒースは言い訳が下手だ。
	夕方、こっそり奥様のレモンパイを貰った。
	ブランシェットで暮らした中でもあの日はとびきりいい日だった。
`},
{id:11219,title:"スポットの人々",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ブランシェット領は、どんな気質の人が多いんですか？
ヒースクリフ	真面目で、誇り高い、職人気質の人たちが多いですね。
	家族や仲間をとても大事にしています。
	首都である雨の街では、他人と関わらないように暮らしている人達が多かったですけれど……。
	このあたりは職人や農夫が多いので、村長や親方を中心に、しっかり縦関係で結ばれています。
	ブランシェット城は国の要所ですから、有事には、みんな戦士となります。
	だから、軍人気質っていうのかな。
	今はにこやかな人も増えましたけど、祖父母の代にはそういう振る舞いは軽薄に見えていたようです。
晶	それじゃあ、わりと武闘派なんですね……。
ヒースクリフ	土地柄だけ……。俺も両親もそんな雰囲気じゃないんですけど……。
	過去に武勲を多く立てて、現在も産業が安定していますから、東の国の要を担っている自負はありますね。
	だからといって、発言権が強くならないように、父上は気をつけているみたいです。
晶	どうしてですか？
ヒースクリフ	王家の方々に、謀反や反乱を疑われないようにです。
	だから……。
	シノは手柄を立てたがるけれど、それはとても危険なことなんですよ。
`},
{id:11220,title:"スポットにいた魔法使い",type:"personal",characters:["シノ"],memo:"ヒースクリフ",
text:`晶	シノとヒースの魔法のお師匠様とも、このお城で出会ったんですよね。
シノ	ああ。師匠はくそじじいだった。
	威張ってて、陰湿で、酒浸りで、自慢話が多い割に話が薄っぺらい。
晶	ぼろくそ言いますね……。
シノ	本当のことだ。横暴さ加減に辟易してたぜ。オレはかなり我慢した。
	旦那様と奥様がヒースのために連れてきた男だったから、ヒースも両親の顔を潰せなくて黙って従ってた。
晶	そうだったんですか……。
シノ	東の国は、自分が魔法使いだって隠してるやつが多いだろ。
	陰気に暮らして、人間の陰口を叩くくらいなら、魔力があるんだからやり返せばいいのにとずっと思ってたが……。
	自分から表に出てくるようなやつもろくなのがいないんだと分かった。
晶	地域性なんでしょうか……。
シノ	さあな。ヒースやファウストみたいないい魔法使いが目立つ国なら、
	人間に舐められず済むのに、あいつらは嫌がる。
	賢者の魔法使いに選ばれたヒースと師匠が、魔法舎からしばらく帰ってこなかったから、心配でしょうがなかった。
	今はオレがそばでヒースの面倒を見てやれてほっとしてる。
	正しい魔法の知識も教えてもらえるしな。
`},
{id:11221,title:"危険な場所",type:"personal",characters:["シノ","ネロ"],memo:"ヒースクリフ",
text:`シノ	賢者。その道に用事か。
晶	あ、シノ。散歩をしてたんです。こっちには何かあるのかなと思って。
	……？どうしたんですか、にやにやして……。
シノ	ここから先はヒースが近づかない場所だ。どうしてかわかるか？
~~~~~~~~~	~~~~~~~~~
選択	危ない場所ですか？
シノ	魔法使いにとって危ない場所なんて、この城のそばにはないさ。
~~~~~~~~~	~~~~~~~~~
選択	怖い場所ですか？
シノ	ふふ、怖くなんかないさ。でも、ヒースにとってはそうかもな。
~~~~~~~~~	~~~~~~~~~
選択	貴族は立ち入り禁止とか？
シノ	貴族の立ち入れない場所なんてないさ。ルールを決めるのが貴族だからな。
	オレたち使用人が入れない場所はたくさんある。
~~~~~~~~~	~~~~~~~~~

シノ	オレが守ってるんだからな。この先には、亡霊が現れるって噂の井戸がある。
晶	亡霊ですか…？
シノ	昔、家の食器を割ったメイドが、当時の執事長から受けた折檻に耐えかねて井戸に身を投げたんだ。
	今でもたまに、井戸の底から、食器を探してすすり泣く女の声が聞こえるって……。
？？？	わっ！！
晶	ぎゃーーーーっ！？
ネロ	あっはっは、賢者さん、派手な驚き方だな。
シノ	ネロ、ナイス。
	それ以来、ブランシェットは、女の使用人にちょっとだけ優しいって話だ。
	薄情にすると、メイドに呪われるんだって。
	ヒースは怖がって近づかないが、誰にだって優しいから、あいつが気にする必要ないのにな。
`},
{id:11222,title:"ヒースクリフの評判",type:"personal",characters:["ファウスト"],memo:"ヒースクリフ",
text:`晶	ファウスト。どなたと話していたんですか？
	珍しくにこやかでしたけど……。
ファウスト	珍しいは余計だ。ブランシェット城の執事長だよ。
	ヒースクリフの話を聞いていたんだ。想像以上に、ヒースは優秀な子だな。
	学問の成績もいいし、馬術も優れてる。領内の知識も豊富だ。
	城主の不在時に起きた問題を、代わりに、解決したりもしている。
	シノが心酔するわけだ。
晶	そうなんですね。
	しっかりしてるとは思ってましたが、いつも控えめだから……。
ファウスト	性格が才覚の邪魔をしているな。ヒースが魔法使いでなければ……。
	自信に満ちた彼が、この城を颯爽と闊歩する姿が見られたのかもしれないが。
晶	ファウスト……。
ファウスト	だが、そうしたら僕のことを先生と慕ってくれることもなかっただろう。
	何が幸福かは、わからないな。
	彼は魔法使いだとしても、シノや城のみなに愛されている。
	……なんにせよ、いい人生を歩んでくれたらと、僕は願うよ。
`},
{id:11223,title:"スポットの名物",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`ヒースクリフ	ブランシェット領では、上質な木材を使用した精巧な工芸品が特産物なんです。
	特に、時間を報せてくれる鳩時計は旅人に人気のお土産なんですよ。
晶	時計、友達の家で見たことがあります。あれって機械仕掛けだったんですね。
ヒースクリフ	後は家具なんかも人気です。
	ブランシェットの家具は３代使えるって有名なんです。
	家具に施す彫刻や彫金も発達して、優美な細やかさが特徴の模様は、ブランシェット彫りと呼ばれています。
	俺も好きで……。
	魔道具の懐中時計の模様や、シノの大鎌の模様は俺が彫刻したんです。
晶	すごいですね！
	俺も何か欲しくなってきました。街の家具屋さんを覗いてみようかな。
ヒースクリフ	ぜひご一緒させてください。気に入ったものがあったら、プレゼントしますよ。
晶	いいんですか？
ヒースクリフ	もちろん。
	賢者様のためなら城の職人が特注品を作るって言いそうですけど。
晶	（高級家具のオーダーメイド……。元の世界に帰りたくなくなりそうだな）
`},
{id:11224,title:"スポットでの発見",type:"personal",characters:["ネロ"],memo:"ヒースクリフ",
text:`晶	わあ……。庭に立派な石像がある。
	ブランシェット城には、からくりだけじゃなく、美術品や装飾品もたくさんありますね。
ネロ	ああ。城の中もすごかったな。絨毯、柱、食器、廊下の絵画。全てが一級品だった。
晶	そ、そうだったんですね！軽い気持ちで触らなくてよかった……。
	あれ？この石像、よく見ると目に宝石がはまっていますね。
ネロ	それは西の国でつくられたものだな。
	東の職人が作ったものと比べると、少し派手に見える。
	この国の職人は仕事が丁寧だからさ。細工が繊細なものが多いからわかりやすいんだ。
晶	じゃあ、このベンチは？金の装飾がとても綺麗ですけど……。
	きらきらしてるから、これも西の国かな？
ネロ	いや。それは、中央の国でつくられたものだな。
	高級な木材が使われてるし、フォルムがどっしりしてる。
	まあどれも献上品ってとこだろ。
	高く売れそうなものばかりで、つい目移りしちまうよな。
	どうした、賢者さん。不思議そうな顔をして。
晶	ずいぶんと美術品に詳しいんだなって思って。
	もしかして、どこかで勉強をしたことがあるんですか？見る機会が多くあったとか。
ネロ	はは……。ないない。そうだったらいいなって、適当に言ってるだけさ。
	ほら、これを売っぱらったら、きっと良い値になるだろうなあとか、それくらい普通に思うだろ？
晶	う、うーん。思うかな……？
`},
{id:11225,title:"楽しい場所",type:"personal",characters:["ネロ"],memo:"ヒースクリフ",
text:`晶	ブランシェット城の見学、楽しかったですね！
	ネロが印象に残った場所はありますか？
ネロ	やっぱ城の中の厨房かな。厨房自体も大きいし、貯蔵庫もしっかりしてる。
	かまどの設備なんかも一流だったよ。
	職人が多い土地だけあって、工夫が細かくってさ。
	包丁の研ぎひとつにかけても、主君に出す料理を作るプライドが感じられたね。
晶	なるほど。街のお店の厨房とは、やっぱり違うものですか？
ネロ	違う違う。道具の質がまず違う。いい職人がいい鉄や土で作ってる鍋ばかりだよ。
	シルバーも一流のものだし、これなんか細工が丁寧だろ。
晶	も、持ってきちゃったんですか？
ネロ	後でヒースに返しておくよ。かまどや鍋の作りが良いと熱の通りがいいんだ。
	シルバーがいいと舌触りがいいだろ。
	焼き場もでかくて良かったな！串に刺した肉を炙り焼きにしたら絶対美味い。
	炭もまた、いい炭使ってるんだよ。
	あれが魔法舎にもあったらいいなってちょっと思ったよ。
	他にもいろんな料理が作れそうだし。
晶	なるほど……。ネロもキッチンの設備は、こだわりたいタイプなんですね。
	魔法舎のキッチンも他に、本当はこれがあったらいいなあとか、もっとこうしたいなあとかあるんですか？
ネロ	もちろんなくはないけど。
	ただ、設備や調理器具にこだわり始めると際限がなくなるからさ。
	ほどほどくらいにしておかないとなって、思ってるよ。
	でも、１回くらいあそこで料理してえな……。
`},
{id:11226,title:"マナエリア",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
	「マナエリア」と呼ぶとも聞きました。ヒースクリフも知っていますか？
ヒースクリフ	はい。もともとは知らなかったんですけど、ファウスト先生に教えてもらいました。
	自然と心が安定して集中できる、自分自身の原風景のような場所のことだって。
晶	ファウストの授業、しっかりしてそうですね……。
	ヒースクリフにもマナエリアがありますか？
ヒースクリフ	俺のマナエリアは、少し恥ずかしいんですけど……、雨の日のベッドの中です。
	ブランシェットの屋敷にいた頃から、目が覚めて雨音が聞こえると、意識が冴えて、集中しやすくなるのを感じてました。
	雨水が土に浸透するみたいに、魔力で身体が潤っていくような……。
	そんな感覚になるんですよね。
晶	ゆっくりで静かなイメージは、ヒースクリフっぽい感じがします。
	雨の日は、無理に起こさないようにしますね。
ヒースクリフ	あはは……、大丈夫ですよ。
	賢者様がいらっしゃる頃にはもう、目を覚まして雨の音を聞いてると思います。
`},
{id:11227,title:"アミュレット",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	ヒースクリフもアミュレットを持ってますか？
ヒースクリフ	はい。ファウスト先生が教えてくれました。俺のアミュレットはサシェですね。
ヒースクリフは寝台の枕の下を探って、手のひらに収まる小さな布の袋を取り出すと、俺に手渡してくれた。
晶	これがサシェ……？中には何が入ってるんですか？
ヒースクリフ	乾燥させたハーブとか、木の切り屑とか、でしょうか。
	その時の気分で中身は変えてます。
	俺のマナエリアは寝台の中だから、落ち着く香りのものを置いて、リラックスできるようにするといいって。
晶	…………。本当だ、いい香りがしますね。
ヒースクリフ	マナエリアを意識して、アミュレットを置くようにしてから、魔法の調子がいい気がします。
	香りや環境でこんなに変わるなんてファウスト先生に教わるまで知りませんでした。
	サシェも、香りは体が覚えるから、遠征の時に持ち出せていいだろうって、先生に選んでもらったんですよ。
晶	魔法の勉強、楽しそうですね。
	魔法舎で暮らすことが、プラスになってるみたいで良かったです！
`},
{id:11228,title:"家事に奮闘中",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	（あ……。シャツが干してある）
ヒースクリフ	こんにちは、賢者様。
晶	こんにちは。もしかして、この服……。
~~~~~~~~~	~~~~~~~~~
選択	ヒースクリフの服ですか？
ヒースクリフ	そうなんです。これは俺の部屋着なんですが……。
~~~~~~~~~	~~~~~~~~~
選択	シノの服かな？
ヒースクリフ	あ……。実はこれ、俺の部屋着なんです。
	シノはもっと動きやすそうな服を着ることが多いですね。
~~~~~~~~~	~~~~~~~~~

ヒースクリフ	昨日、紅茶を飲んでいたら、シャツに零してしまって。
晶	なるほど。それで、洗濯をしていたんですね。ヒースクリフは家事が得意なんですか？
ヒースクリフ	正直、あまり……。
	実家にいたころはいつも召使いがやってくれていたので、まだまだできないことが多いんです。
晶	（そうか、ヒースクリフはブランシェットの領主の息子さんだった）
	ヒースクリフ	あれ、袖のところがシワになってる……！こういう時はどうしたらいいんだっけ……。
	すみません、ちょっとカナリアさんに聞いてきます！
晶	慣れない家事に挑戦する姿が、初々しくて応援したくなる……。
`},
{id:11229,title:"家族",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ヒースクリフの家ってお城なんですよね。みんな一緒に住んでいる感じなんですか？
ヒースクリフ	ええ。実家の城では、両親と、使用人で暮らしていました。魔法使いは俺だけです。
	城にはシノの部屋もあったんですけど、ひとりがいいって言って居付かなくて。
	森の小屋で寝泊まりしてましたね。
~~~~~~~~~	~~~~~~~~~
選択	どんなお父さんでしたか？
ヒースクリフ	父は、そうですね……。立派で、領民や王家からの信頼も厚い人です。
	強くて明るくて、前向きで公正で、優しくて、でも、叱るときは厳しくて……。
	俺は、いつも憧れていました。
晶	格好良いお父さんですね！
~~~~~~~~~	~~~~~~~~~
選択	どんなお母さんでしたか？
ヒースクリフ	母は、そうだな……。
	みんなに優しくて明るくて、料理上手で、少しだけ感激屋で、涙もろい人です。
	教養も深くて、学校を休みがちだったときは、母からも色々なことを教わっていました。
晶	素敵なお母さんですね！
~~~~~~~~~	~~~~~~~~~

ヒースクリフ	……はい。息子の立場からは少し言い難いんですけど、本当に、非の打ち所のない両親なんです。
	だから、自分が魔法使いに生まれたことが、二人の唯一の欠点に思えて辛かったです。
	ずっと、両親に申し訳なくて。
晶	ヒースクリフ……。
ヒースクリフ	こんな話をすると、きっと叱られてしまうんですけどね。
	今は、世界を守る使命を与えられて、二人を守る力を持って生まれてきたんだって、少しだけ思えるようになりました。
	まだ、シノみたいに強くはなれないけど、いつか、きっと、両親が誇れる自分になりたいんです。
`},
{id:11230,title:"いつまでも君と",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ヒースクリフはシノの主君で、シノの友達なんですよね。
	主人であり、幼馴染であると言うか……。
ヒースクリフ	まあ。そうなりますね。
晶	どちらの気持ちの方が強いんですか？
	俺から見ていると、主従を超えた絆があるように思えますけど。
ヒースクリフ	俺は……。シノの主人でいるよりは、シノのいい友達でいたいと思っています。
	同じ魔法使い同士だし、シノには何でも話せるし、子供の頃から、ずっと一緒にいたから。
	でも、シノは……。
晶	シノは……？
ヒースクリフ	シノは急に、俺を主君にしたがるんです。
	ずるいですよね。いつもは気軽に呼んだり、背中を叩いたりするのに。
	俺に名誉を手に入れさせたがるんです。
	きっと、俺のためを思ってくれているんだって、わかるんですけど……。
	そのたび、いきなり、線を引かれたみたいで戸惑います。
	隣に並ぶな、上に行けって、言われてるみたいで。
晶	そうなんですね……。シノには話したことがあるんですか？
ヒースクリフ	何度もあります。出世したり、目立つつもりはないよって。
	……だけど、ずっと、平行線のままだな。
	いつまでも、シノと仲良く出来るなら、俺はそれだけで何もいらないんですけどね。
`},
{id:11231,title:"頼りにしてる存在",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ヒースクリフはカインと仲がいいですよね。初めて会った時も、二人一緒でしたし。
ヒースクリフ	そうですね。
	カインは俺が魔法舎に来た時から親切で、気軽に接してくれていたので……。
晶	カイン、気さくですもんね。初めて会った時、どんな印象でしたか？
ヒースクリフ	えっと……。俺は東の国の首都から離れた、森に囲まれた静かな場所で育ったので。
	華やかな中央の国の首都に住んでいて、すらっとして、良く喋って、行動的なカインに、最初は少し気圧されていたんです。
晶	（地方の上品なお坊ちゃんが、都会の若者に圧倒される感じかな……？）
ヒースクリフ	でも、すぐに心根のあたたかさが伝わって、それから、ずっと頼りにしていました。
	一緒に賢者の魔法使いに選ばれた師匠に、『いつもカインの影に隠れてる』と、からかわれていたくらいです。
	俺は師匠が少し苦手だったので……。
	師匠からも庇ってもらったりして、カインには本当に助けられっぱなしだったな。
晶	なるほど。ヒースクリフにとって、頼れるお兄さんというところなんですね。
ヒースクリフ	はい。でも、そう言うとシノが怒るんです。シノは俺の兄のつもりでいるから。
	俺にとっては、俺が兄で、シノは可愛いみたいな感じなんですけど。
	賢者様もそう思いませんか？
`},
{id:11232,title:"焼き芋を囲んで",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	（いい匂い……。よし、そろそろ焼けたかな）
	焼き芋……。
	サツマイモっぽい味のだし、うまく再現できると良いな。
ヒースクリフ	賢者様。
	何をしていらっしゃ……わっ！落ち葉が燃えてる……！？
	下がってください！
	《レプセヴァイ――》！
晶	待って、ヒースクリフ……！これは火事じゃないんです！
ヒースクリフ	え？
晶	これは、焼き芋っていう、
	俺の世界でよく行われていた、外で芋を焼く習慣といいますか……。
ヒースクリフ	そ、そうなんですか……？
	すみません、遠目に火が見えたので、思わず慌ててしまって。恥ずかしいな……。
晶	こちらこそ、ご心配おかけしてすみません。
	でも、焚き火で焼くと美味しくなるんですよ。食べてみますか？
ヒースクリフ	賢者様がおっしゃるなら……。もぐ……。
	わ……。熱いけど、甘くて美味しいですね……。
~~~~~~~~~	~~~~~~~~~
選択	よかったです！
ヒースクリフ	ありがとうございます。
	外でおやつを食べるなんて少し行儀が悪いけど、なんだか楽しいですね。
~~~~~~~~~	~~~~~~~~~
選択	もう一つ食べますか？
ヒースクリフ	え……。いただいていいんですか？なら、シノにあげようかな。
	あいつ、こういうの好きそうです。
~~~~~~~~~	~~~~~~~~~

ヒースクリフ	面白い習慣ですね。今度、東の魔法使いで庭掃除するときに、やってみようかな……。
晶	（焼き芋、気に入ってくれたのかな……）
`},
{id:11233,title:"前賢者の嘘",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`ヒースクリフ	賢者様、洗い物をされてるんですね。俺も手伝います。
晶	ありがとうございます！ヒースのおかげで、いつも助かってます。
ヒースクリフ	いえ……。ハンサムですから。
晶	は……？
ヒースクリフ	あれ、何か変でしたか？
	前の賢者様が、『謙遜するときに使う言葉』だって教えてくださったんですけど……。
晶	ハンサムは「顔立ちが良い」って意味です。
	だから、自分に使う人はあまりいないかも……。
ヒースクリフ	ええ！
	今まで俺は、何回この言葉を使って来ただろう……。
	カインにも、シノにも言っちゃった気が……。
晶	でも、ヒースは確かにハンサムだから間違ってはないですよ！
	むしろ、正解です。
ヒースクリフ	あ、ありがとうございます……。
	けど、出来ればこの言葉の意味は他の皆には秘密にしてもらえませんか？
晶	わかりました。
	ヒースが自信を持ってこの言葉を言える日までは秘密にしておきましょう。
ヒースクリフ	あはは……。そんな日は来るんでしょうか。
`},
{id:11234,title:"意外な一面",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	…………。んん。ああ、居眠りしちゃってたみたいだ……。
	わ、ヒースクリフ！？
ヒースクリフ	起こしてしまってすみません。
	気持ち良さそうに寝ていたので、部屋までお連れしようと思ったんですが……。
晶	（だから、顔が近いのか……。！イケメンがよりイケメンに見える……。）
ヒースクリフ	けど、賢者様が起きてると思うと、ちょっとだけ照れ臭いですね……。
晶	いえ、お心遣いだけで嬉しいです。
	もしかして、この肩にかかっているブランケットもヒースクリフが？
ヒースクリフ	はい、すごくお疲れのようなので……。ご迷惑でしたか……？
晶	（部屋に運ぼうとしてくれたり、ヒースクリフは意外とたくましいところがあるよな）
`},
{id:11235,title:"得意な魔法",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ヒースクリフは、得意な魔法ってありますか？
	ヒースクリフにしか使えない魔法とか。
ヒースクリフ	得意なこととは違うかもしれませんが、
	この前の授業で、ファウスト先生に感応力が高いって言ってもらいました。
晶	感応力……ですか？
ヒースクリフ	はい。魔力や自然の中にある不思議の力を察知する能力のことです。
	影響を受けやすくもあるのかな。
	実を言うと……、俺は長い間、自分のことを臆病だと思っていたんです。
	だけどそれは、危険や悪い気配を察知する力が強いからだって、ファウスト先生が言ってくれて。
	……嬉しかったです。
	魔法舎に来て、先生のもとで魔法が学べて、良かったなって、改めて思いました。
晶	ヒースクリフが臆病だなんて、俺も思わないですよ。
	今の話、ファウストに伝えたら喜ぶんじゃないかな。
ヒースクリフ	どうかな……。先生は、自分を良く言われるのを、嫌がるような気がするから……。
	でも、そうですね。
	もう少し、打ち解けられた時に、話してみたいと思います。
`},
{id:11236,title:"光の正体は？",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	（散歩に来たつもりが……。景色が綺麗で、ずいぶん奥まで来ちゃったな）
	月明かりはあるけど、少し怖い……。早く魔法舎に戻らないと。
	…………。あれ？
突然、俺の周りを小さな光の玉のようなものが飛び始めた。
晶	（もしかして蛍……？この世界にもいたんだ。安心する、優しい光だな）
ヒースクリフ	賢者様……！ここにいらっしゃったんですね。ご無事で良かったです。
晶	ヒースクリフ！ご心配おかけして、すみません。
	もしかして、これは……。
ヒースクリフ	ああ……。俺が出しました。
	賢者様を探すのに、少し明るい方が探しやすいかと思って。
	驚かせてしまいましたか？
晶	いえ！俺の世界で見た光景を思い出して、少し懐かしくなったんです。
ヒースクリフ	賢者様……。
	《レプセヴァイヴルプ・スノス》
晶	わあ、小さな光の玉がたくさん……！綺麗ですね。
ヒースクリフ	足元は、俺が照らします。さあ、魔法舎まで一緒に帰りましょう。
`},
{id:11237,title:"紋章",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	賢者の魔法使いには、目印になる賢者の紋章が身体に現れるって聞きました。
	ヒースクリフの紋章はどこにあるんですか？
ヒースクリフ	あ……。俺は腰の後ろに出てきました。
	左側の、この辺りです。
ヒースクリフはそう言って、ベルト越しに腰の後ろに触れて示した。
晶	他の人の紋章も見せてもらったんです。
	あんなのが急に現れたら、驚きませんでしたか？
ヒースクリフ	驚きましたね……。
	役目が終わるまでは消えないと聞いて、すごく戸惑いました。
	俺は魔法使いでいる自分にずっと後ろめたさがあったから……。
	こんな証拠みたいな章があったら人間のフリもできないって。
	しばらくは人前に出たくなかったな……。
晶	ヒースクリフ……。
ヒースクリフ	だけど魔法舎に来て他の魔法使いと会ううちに、
	自分の中の偏見がなくなっていくのを感じるんです。
	今も複雑な気持ちはありますけど、それでも、少しだけ、魔法使いに生まれたことに前向きになったかな。
	紋章があって良かったって、思うようになれたんですよ。
`},
{id:11238,title:"腹話術に挑戦",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`？？？	け、賢者様！朝食の時間だよー、……です！起きてください、賢者様……。
晶	んん……。誰か起こしに来てくれたんですね。ありがとうございま……。え！？
俺が目を覚ますと、ヒースクリフがクマのぬいぐるみを手に持って、恥ずかしそうに動かしていた。
クマのぬいぐるみ	起きてくれてよかった！それじゃあ、俺はこれで……。
晶	待ってください、ヒース！すごく色々なことが気になります……！
ヒースクリフ	やっぱり俺だってわかりますよね。
晶	わかりますよ！どうしてぬいぐるみで腹話術を？
ヒースクリフ	賢者様が最近ベッドからなかなか出られなくて
	困ってると言っていたので……。俺に何かできないかなって思ったんです。
	カインに相談したら賢者様を驚かせば、すぐ目がさめるんじゃないかって。
	でも、よく考えたらぬいぐるみで腹話術なんて、子供っぽ過ぎますよね。
晶	（顔が真っ赤だ。時間差で恥ずかしくなったんだろうな……。）
`},
{id:11239,title:"抑えきれない感謝",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	こんばんは、ヒースクリフ。
	今日の任務で西の街に出かけたので、お土産を買って来たんですよ。
	そんなにすごいものなんですね！？ムルがカードに勝って手に入れてました。
	ぜひ分解して遊んでって言ってましたけど……。
ヒースクリフ	えっ。これ……技術者が何十年もかけて設計する、とても貴重なものなんですよ……。
	本当に俺が買っていいんですか？
	そ、そんな……。
晶	これ、卓上天文時計っていうそうで、ムルが蚤の市で見つけたんです。
ヒースが喜ぶだろうって。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
ヒースクリフ	考え事をしたり、本を読んだりでしょうか。
	あとは……、時計や機械をいじったり、細工を彫ったりもしています。
	もっと外に出て、体を鍛えたりした方がいいのかもしれないんですけど、俺は部屋で何かしてる方が性に合っていて……。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
ヒースクリフ	カインは、去年俺が魔法舎に来た時から面倒を見てくれてて。
	よく部屋で話したり、相談に乗ってもらったりしています。
	シノはノックせずに入ってくるんですよね。
	最近は、クロエやルチルやムルも、遊びに来てくれるかな。
	俺から声をかけるのはなんだか気が引けちゃうんですけど……。
	みんな気さくで、優しいですよね。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
ヒースクリフ	ちゃんと決めてはいないですけど、
	起きて顔を洗って、朝食を済ませて、ファウスト先生の授業を受けて……。
	自由な時間は、みんなと話したり、出かけたり、ひとりで部屋にいたりして、日付が変わる前に身支度して休む感じです。
~~~~~~~~~	~~~~~~~~~
ヒースクリフ	お土産、ありがとうございます……。
	でも、こんな貴重なものを分解するのは、ちょっと勇気がいりそうだな……。
晶	ヒースクリフの好きにしてください。置いておいても綺麗でかっこいいですよね。
ヒースクリフ	はい……。
	……ちょっと、今からムルのところにお礼に行ってきます！
	賢者様も、本当にありがとうございます。
晶	（珍しく興奮してる感じだ……。喜んで貰えたみたいでよかったな）
`},
{id:11240,title:"カインからの贈り物",type:"personal",characters:["カイン","ヒースクリフ"],memo:"ヒースクリフ",
text:`ヒースクリフ	良いね、この時計……。装飾もすごく凝ってる。
晶	ヒースクリフ。カインからプレゼントを貰ったんですか？
カイン	ああ。中央の都で骨董屋を見つけたんだ。ヒースなら気にいると思ってさ。
	ところで、秒針が止まったままみたいなんだが、これはどうやって動かすものなんだ？
晶	あ！よく見たら壊れてる……！
カイン	本当か？ちゃんと確かめなくて悪かったな。直してもらってから贈り直すよ。
ヒースクリフ	カイン……。
	直さなくても大丈夫だよ。この時計、このまま貰ってもいいかな？
カイン	え？壊れてるんだぞ？
ヒースクリフ	むしろ直すのが好きだから嬉しいんだ。
	この時計、すごく綺麗だから、きっと中の造りも美しくて繊細だと思うし。
	今夜中に動かせるよう、頑張ってみます。最高の贈り物をありがとう、カイン！
`},
{id:11241,title:"離れられない指先",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`ヒースクリフ	困ったな……。
晶	ヒースクリフ。どうしたんですか？
ヒースクリフ	賢者様……。実は、俺にくっついて離れてくれない子がいて……。
晶	あ、指先に小さい蝶が止まってる。
ヒースクリフ	さっき窓から入って来て、俺の指にとまったんです。
	けど、このあと訓練があるのでこのままって訳にもいかなくて……。
	ほら、早く飛んでおいき。外の方が楽しいよ。
小さい蝶	……………………。
ヒースクリフ	こんな感じで全然ダメなんですよね。
	この子、疲れているんでしょうか……。
晶	（ヒースの指が綺麗だから、気に入ってるんじゃないかな……）
`},
{id:11242,title:"優しい魔法",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`ヒースクリフ	賢者様はもしも魔法が使えたら、してみたいことってありますか？
晶	そうだな……。自分の体を小さくできたら、面白そうですね。
	猫の背中に乗って、散歩とか。それに、お菓子がビッグサイズで食べられますよね！
ヒースクリフ	なるほど……。それじゃあ。
	《レプセヴァイヴルプ・スノス》
晶	わっ！目の前のものが大きくなっていく……！
	あれ？俺が小さくなったのか……！ヒースクリフの魔法、すごいですね！
ヒースクリフ	すみません、賢者様……。その風景は、偽物なんです。
	俺にそこまでの魔力はありませんから。幻影を見せてるだけで……。
晶	幻影！？それはそれですごいですね！
ヒースクリフ	とんでもないです……！
	本当は猫も登場させたかったんですけど、上手くいかなくてすみません……。
晶	（気にするところ、そこなんだ……。）
`},
{id:11243,title:"レモンパイの譲り合い",type:"personal",characters:["東"],memo:"ヒースクリフ",
text:`晶	（シノとヒースが言い合ってる……。もしかして喧嘩？）
	ヒース、シノ！何があったんですか？
シノ	賢者か。ヒースが、おやつのレモンパイをオレに譲るっていうんだ。
ヒースクリフ	なんだよ。レモンパイはおまえの大好物じゃないか。素直に受け取ればいいだろう？
シノ	こんなに美味いもの、おまえが食べなくてどうするんだ。
ファウスト	きみたちは静かに食事もできないのか。
	……シノ、ヒースから受け取ってやれ。ヒースは代わりに僕のパイを食べるといい。
ヒースクリフ	そ、そんな！ファウスト先生からいただくなんて、できませんよ。
ネロ	わかった、わかった。
	すぐにお代わりを焼くから、みんなそれぞれ自分のパイを食べてくれ。
晶	（素直じゃないけど、仲間思いな東の国の魔法使いらしいやり取りだ……。）
`},
//ネロ
{id:11301,title:"スポットの印象（１）",type:"personal",characters:["ファウスト"],memo:"ネロ",
text:`晶	雨の街っていうから、もっとどんよりしてるのかと思いましたが、この街の雨はなんとなく爽やかですね。
ファウスト	山脈からの雨は澄んでいるし、雨雲が薄くてそんなに暗くはならない。
	そのせいじゃないか。
晶	この街の、ファウストの印象はどうですか？
	ネロは暮らしやすいって言ってましたけど。
ファウスト	雨はともかく、何もかも人間のための街という感じで、僕は気にくわないな。
	ルールがあれば便利で快適かもしれないが、優しさが義務になるのはいびつだ。
晶	優しさが義務になる、ですか？
ファウスト	この国の法典は、基本的に、皆が不愉快なものに出会わないように作られる。
	快適に暮らしやすいように、他人に迷惑をかけられないように、誰かに迷惑をかけないように。
	他人を慮る手間を規則に委ねているせいで、他人を慮ることが規則になっている。
	そんなものを、思いやりとは思えない。
	親切さえ自分の心に従えないなら、誰とも関わらず暮らせばいいんだ。
	人と関わることが煩わしいのに、誰かと寄り添っていたいだなんて。
	東の国の人間らしい、中途半端な街だと思うよ。
晶	（人嫌いで引きこもってたファウストが言うと、説得力あるな……）
`},
{id:11302,title:"スポットの印象（２）",type:"personal",characters:["ヒースクリフ"],memo:"ネロ",
text:`晶	ヒースクリフは、何度か雨の街に来たことがあるんでしたよね。
ヒースクリフ	はい。領主の父を一緒に、国王様へのご挨拶に来たり、大きな裁判や会議に呼ばれることがあって。
	俺は魔法使いだから、そういう用事で街に入る時は、審査も厳しかったですね。
	……だから個人的に、雨の街は少しだけ、魔法使いに冷たい印象があります。
	法典のせいだとはわかってるんですけど。
晶	ヒースクリフの地元は、規則が緩いんですか？
ヒースクリフ	もちろん同じ法典ですけど、両親が大らかだから、取り締まりや処罰は緩い方だと思います。
	ブランシェッド領では森や広場に集まって、話をする人たちや、遊んでる子供たちを、見るのが好きでしたけど……。
	この街では、そういう景色を一切見かけないないから、少し怖いかな……。
`},
{id:11303,title:"スポットの印象（３）",type:"personal",characters:["リケ"],memo:"ネロ",
text:`晶	雨の街に来てみて、どうですか？リケ。
リケ	整然として、奥ゆかしい、いい街です。どこも清潔で綺麗ですし。
	ただ、街の人と目が合っても、誰も挨拶もしてくれなくて驚きました。
	なのに、道に迷っていたら親切に教えてくれて。不思議な人たちの街ですね。
晶	東の国には色々法律があって、知らない人に挨拶するのは、違反になってしまうみたいですね……。
リケ	国ごとにこんなにルールがちがうなんてことも、初めて知ってびっくりしました。
	僕の暮らしていた教団の中と、中央の国でも規則は違っていましたし。
	どれが正しいのか決めてほしいです。
晶	何が正しいのかって、難しい問題ですね。
	住んでる人たちの気質や、時代にもよるものだと思いますし。
	自分に合う場所を探して暮らすのが、一番良いと思いますよ。
リケ	自分に合う場所……。僕に合う場所もあるんでしょうか？
晶	それは、きっとあると思います。
リケ	賢者様がそうおっしゃるなら、決めるのは保留にして、いろいろな国を見てみますね。
	雨の街は、優しいけれど、少し他人行儀で、ネロみたいな街だなって思います。
	僕には、合ってないわけじゃないと思います。
`},
{id:11304,title:"ブレイクタイム（１）",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	東の国はどこに行っても自然が豊かですね。
ネロ	田舎の風景って言えばそうなのかもしれねえけどな。
	公共の施設とか、貴族の屋敷とかは、土地の何割庭にしろだの、木を植えろだのって細かい法律があるんだよ。
晶	そんなことまでルールがあるんですか？
ネロ	面倒臭いが、おかげで景観はどこの国より綺麗だろ。
晶	たしかに癒されます……。ネロのお店も庭があったんですか？
ネロ	あったよ。小さい庭だけど。少しだけの野菜と果実とハーブを作ってた。
~~~~~~~~~	~~~~~~~~~
選択	自家製の野菜、いいですね！
ネロ	毎年作ってると、特別うまくいく年があったりして、意外とハマってさ。
晶	コツコツした作業、得意そうですよね。ネロの手作り野菜も食べてみたいです！
	魔法舎ではやらないんですか？
~~~~~~~~~	~~~~~~~~~
選択	果物はお店はお店に出してたんですか？
ネロ	まあまあな。形はあんまり綺麗にならなかったから、野苺なんかをジャムにしてデザートに使ったりさ。
晶	ネロの野苺ジャム、すごく美味しそうですね！今度ぜひ食べてみたいです！
	魔法舎では作らないんですか？
~~~~~~~~~	~~~~~~~~~

ネロ	あはは。魔法舎の中庭に、勝手に植えちまっていいのかな。
	みんな勝手に使ってるから、いいか？
	まあ、いつか実現できたらご馳走するよ。
晶	やった！楽しみにしていますね！
`},
{id:11305,title:"ブレイクタイム（２）",type:"personal",characters:["ブラッドリー"],memo:"ネロ",
text:`ブラッドリー	はあ……。
	見かける奴らはみんなだんまりだし、ずっと雨だし、辛気臭せえ街だな……。
	牢屋の中より辛気臭えよ。
晶	ブラッドリーは、投獄されていたことがあるんでしたね……。
	人間の牢屋とまた違うんですか？
ブラッドリー	さあ。似たようなもんだと思うが、
	看守が来たら足音が聞こえなくなるまで罵ったり出来た分、ここよりはマシだったぜ。
	俯いて歩く女だの、生気も感じねえ親父だのに、ヤジ飛ばしてもって感じだしなあ……。
	あいつはこんな街が気に入って、住み着いてたのか……。
	あいつもまあまあ辛気臭えところもあるしな……。
晶	ブラッドリー……。
ブラッドリー	おい、誰だとか言ってねえし、今のは悪口ってわけじゃねえからな。告げ口すんなよ。
	はあ……。ちょっと気分味わうために黙って歩いてみるか。着いてこいよ、賢者。
晶	あっ、待ってください！傘ささないと濡れますよ……！
`},
{id:11306,title:"スポットの思い出（１）",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	この街は標識が多いですね……。あの看板はどういう意味なんですか？
ネロ	ああ……、悪いけど教えてやれないんだ。役所に行ってもらわないと。
晶	…………？ネロにもわからないってことですか？
ネロ	いや当然知ってるよ。
でも、一般人が旅行に標識の意味を教えるのは法典で禁止されてるんだ。
	説明して間違ってたらトラブルになるだろ。
	だから、聞かれたら役所を案内しなきゃいけないルールなんだよ。
晶	うーん……。この街の役所、すごく並んでましたよね。
	でも、知らずに法典違反になるのは怖いし……。
ネロ	あはは。標識の意味を間違えた時の、良い言い訳を教えてやるよ。
	「自分が見た時とは表示が変わってる。きっと、魔法使いの仕業に違いない」
晶	そんな……！全部魔法使いに罪を着せられるんですか？
ネロ	こう言えば、たいてい見逃してもらえるし、犯人探しをするほどでもない悪戯だ。
	誰も下らないことで捕まらなくて合理的だろ。
晶	なんか、納得できません……。
ネロ	小さいトラブルは全部それで片付く。
	魔法使いだってバレなきゃ、快適な街なんだけどなあ……。
`},
{id:11307,title:"スポットの思い出（２）",type:"personal",characters:["⑬"],memo:"ネロ",
text:`ネロ	雨の街は、住人たちとある程度仲良くなりゃ、人情のあるいい街なんだよな。
	お互い軽はずみに通報したりしないって信頼関係が築ければ、みんな親切で親身に接してくれるしさ。
	移転したいって時に相談に乗ってくれた客や、店の開店記念日を聞かれて答えたらわざわざ贈り物をくれた客もいたんだ。
晶	お店の常連さんですか？そういう距離感はいいですね。
ネロ	だろ？嘘言わなきゃ良かったなって思ったよ。気のいい紳士だったのに。
晶	嘘？お店を開いた日を嘘ついたんですか？
ネロ	この日だったよねえ、みたいな、会話の流れでふわっとそんな話になって、わざわざ訂正するのもなんだしさ……。
	そうでしたっけね、って、曖昧に返事したんだよな。
	後から日付が間違ってたってバレたんだけど、その話はお互いスル―してうまくやってたよ。
	追求されたりしないし、いい人たちだろ？
晶	（ネロもお客さんも、会話が不得手そうなエピソードだ……）
`},
{id:11308,title:"スポットの思い出（３）",type:"personal",characters:["ファウスト"],memo:"ネロ",
text:`ファウスト	雨の街には、法典を手に入れるために来たことがある。
	東の国は当時からルールが多かったからな。
	何百年か前だが、その時すでに法典が３０巻くらいあって、一応、僕も覚えたが……。
晶	３０巻の法典全部ですか……！？
ファウスト	だいたいは、だ。
	覚えてる間にも追加だの改訂だの何度もあって、全く追いつかなかった。
	今はもう１００巻を超えていて、誰も正確に把握していないだろう。
晶	ファウストって、律儀ですよね……。
~~~~~~~~~	~~~~~~~~~
選択	本当は全部覚えていそう。
ファウスト	そんなわけないだろう。この国で暮らすにはコツがある。
	他人と必要以上に関わらないことだ。
	そうすれば、法律のほとんど守れるし、取り締まり自体はそこまで厳しくない。
	住人たちはトラブルを避けたがるから、よほどの迷惑を被らなければ、わざわざ通報するような者は少ないしな。
晶	まるでお互い深い関係にならないように、暮らしているような国ですね……。
	少し寂しい気もします。
ファウスト	その方が暮らしやすい者もいる。もちろん、僕もそのひとりだ。
~~~~~~~~~	~~~~~~~~~
選択	記念日を細かく覚えてくれそう。
ファウスト	記念日ってなんだ。国や街が出来た日だとか、ムルの研究が発表された日だとかか。
晶	そうじゃなくて、恋人の誕生日とか、告白した日とか、初めてデートした日とか、結婚した日とかです。
ファウスト	そんな相手、いたことがないから知らないが……。
	相手が恋人なら、特別な日なんだろう。誰でも覚えているものじゃないのか？
晶	（やっぱり律儀だな……！）
`},
{id:11309,title:"ネロへの印象（１）",type:"personal",characters:["ファウスト"],memo:"ネロ",
text:`晶	ファウストから見て、ネロはどんな印象ですか？
ファウスト	ネロか……。
	僕もあいつも東の魔法使いらしい、というのか。
	お互いがお互いに介入しないから、魔法舎で一緒にいても過ごしやすくはある。
晶	たしかにネロって、立ち入ってくる感じが全然ないですね。
	だけど、気が細やかで……。
ファウスト	そうだな。なんだかんだ、親切に子供たちの面倒も見てる。
	知識も豊富で、指南も押し付けがましくない。
	言動や魔力の感じが、僕より年上な気がするし、ネロが先生役で構わないと思うが。
晶	でも、ファウストが先生で上手くいっていますし、ネロにその意思があるかと言うと、ちょっと……。
ファウスト	…………。
	僕が先に賢者の魔法使いになっただけだから、いずれ役割を交代してもいいだろうと、尋ねたことがある。
晶	ネロはなんて言ってましたか？
ファウスト	「俺は責任感がないから無理だ」って。
晶	なるほど……。
ファウスト	別に、僕にもないけどな。
`},
{id:11310,title:"ネロへの印象（２）",type:"personal",characters:["シノ"],memo:"ネロ",
text:`晶	シノはネロのこと、どう思ってるんですか？
シノ	飯が美味い。
	あと、おまえの分はもうないって言わない。
晶	食事に気を配ってくれるところが好きなんですね。
シノ	飯は大事だろ。
	おまえの分はもうないって、よそではよく言われたけどネロは言わないし、
	オレも最近「おかわり」って言わなくなってきた。
	なんでかと思ったら、オレの皿の食事の量が少しずつ増えてたんだ。
	オレの飯、多く入れてるのか？って聞いたら、
	「おまえが毎回足りないって言うから、合わせて調節してるよ」って言われて……。
	使える男だと思った。
晶	細やかですね、ネロ……。料理人の信念も感じます。
シノ	そうだな。
	信用してる。
`},
{id:11311,title:"ネロへの印象（３）",type:"personal",characters:["ヒースクリフ"],memo:"ネロ",
text:`晶	ヒースクリフは、シノやファウストとは元々面識があるから、ネロだけ、知り合ってまだ間もない感じですね。
ヒースクリフ	そうですね……。でも、だいぶ馴染んできたと思います。
	最初はちょっと怖かったですけど……。
晶	怖かった？ネロがですか？
ヒースクリフ	はい……。なんていうか俺、
	自分自身、話しかけられるのが苦手なくせに、話しかけられたくない空気の人も苦手というか……。
晶	ああ……、それはなんとなく俺もわかります。迷惑なのかな、って思っちゃって。
ヒースクリフ	そうなんです。
	だけどネロって、俺以上に気を遣う人なんだって最近はだんだんわかってきました。
	叙任式の後くらいにネロから言われたんです。
	お互いに気を遣うたちなのがわかるから、必要以上に気にするのはやめようって。
	おまえは俺に迷惑をかけるタイプじゃないし、俺もおまえに迷惑はかけないと思うって。
	気楽にやりたいからって、頼むよって。
晶	……優しいですね、ネロ……。
ヒースクリフ	そうなんですよね。
	俺があれこれ心配する前に言ってくれて、大人っぽいなって思いました。
	だから今は、結構うまくやれてると思います。たぶん……、俺にしては、ですけど。
`},
{id:11312,title:"ネロへの印象（４）",type:"personal",characters:["ブラッドリー"],memo:"ネロ",
text:`晶	ネロって秘密主義のところがありますよね。
	ブラッドリーはネロのこと、どういう風に思ってるんですか？
ブラッドリー	お？なんで俺に聞いた？
	俺とあいつに何か縁があるように感じるのか？
	やっぱりなんかこう、醸し出てたか？絆的なものが。
晶	えっと……。
ブラッドリー	……やべえな、言いすぎたわ。怒られる。
	まあ、あいつとはここにきて会ったばっかりで、お互いよく知らねえんだけどな。
~~~~~~~~~	~~~~~~~~~
選択	そういうことになってるんですか？
ブラッドリー	馬鹿野郎。てめえ。
	バレたらおっかねえんだから止せよ。よく知らねえけどよ。あいつに言うなよ。
~~~~~~~~~	~~~~~~~~~
選択	内緒にされるのは嫌じゃないんですか？
ブラッドリー	やだよ。やだけどまあ、しょうがねえだろ。俺は囚人であいつはカタギだし。
	ガキでもねえし。お友達っつったじゃん！て仲でもねえ。
	だけど、モヤっとはしてるぜ。
~~~~~~~~~	~~~~~~~~~
選択	友達とかには見えませんでしたよ。
ブラッドリー	……ふーん。そうかよ。
	でもよ、案外ああいうタイプは俺みたいな奴が好きだぜ。
	案外、俺みたいな奴とウマが合うし、
	案外、俺みたいな奴の言うこと聞いてるのが楽だなって思ったりすんだよ。
~~~~~~~~~	~~~~~~~~~

晶	……じゃあ、ひと言で言うと、ネロはどんな人に見えますか？
ブラッドリー	あいつをひと言で言うのは難しいだろ……。でもまあ、居心地のいいやつ、だろうな。
	あいつに好かれると、不自由も過不足もねえ、
	自分にとって最高に都合のいい環境で暮らせる。あいつはその環境を黙って作る。
	だからそれが段々当たり前になってって、段々ありがたみがなくなってく。
	なくなってくるといなくなる。あいつと長く付き合いてえなら、気をつけることだな。
`},
{id:11313,title:"ネロへの印象（５）",type:"personal",characters:["リケ"],memo:"ネロ",
text:`晶	リケから見て、ネロはどういう印象ですか？
リケ	ネロですか？そうですね……。
	最初はやる気がないし、不真面目そうで、
	教団にいた頃に聞いていた、不徳の者とはこういう人かと思っていました。
晶	なるほど……。今はどうですか？
リケ	あまりやる気がないという印象は変わりませんがその中にも、
	なにかネロなりの優しさや、こだわりのようなものを感じるようになりました。
	私は彼を評価してますし、好意を持っています。
	でも、なんていうか、ネロはネロ自身のことを、あまり好きじゃなさそうだとも思います。
	遠慮なのかもしれませんが、深い関係を避けているみたいで……。
	内気な感じでもないのに、少し変わった人ですね。
晶	……ネロのそういうところ、やっぱり気になりますか？
リケ	直してほしいというほど、嫌なわけではありませんけど……。
	私は使徒として、人々に頼られ、求められてきました。
	だからか遠巻きな態度には戸惑うことがあります。
	今はネロに教わることが多いですけど、いつかは私がネロを導けると思うから。
	もっと私を必要として、私に介入してほしいです。
晶	……リケのまっすぐな気持ちと自信は、いつかネロの心を動かすかもしれないですね。
リケ	はい。まだ知り合ったばかりですから、ネロのこと、もっと色々知りたいんです。
`},
{id:11314,title:"スポットゆかりの話（１）",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	雨の街って名前、何か由来があるんでしょうか。やっぱり、雨が多いんですか？
ネロ	由来はあるよ。あんまりいい話じゃないけど。
	昔、この辺一帯が酷い水不足にあった時、国王からの依頼で、幾人かの魔法使いが魔力を合わせて雨を呼んだんだ。
	当時も魔法使いは毛嫌いされてたから、苦肉の策だったけどな。
	魔術は成功して、街は元に戻った。
晶	……その話が本当なら、この街はもっと、魔法使いに好意的になりそうですが……。
ネロ	その通り。
	国王から謝礼金が出たことで、水不足は魔法使いの自作自演じゃないかって疑いがかかった。
	裁判が行われて、雨を呼び寄せた魔法使いたちは多数決で街から追放された。
	人間たちも、次は魔法の力に頼らないように、水を確保する水路を整えた。
	雨から水を大切にする教訓を得た街、それがこの雨の街だ。
晶	……なんだか納得できません。魔法使いはそれでいいんですか？
	追放だなんて、酷すぎます。
ネロ	まあ、腹は立つけどさ。
	水路ができたのは俺たち魔法使いも助かったし、顔は魔法で変えられる。
	戻って来ようと思えば戻れる処罰だろ。
	そんなことを何度もやり過ごしながら住み着いてるような魔法使いが多い土地なんだ。
	この東の国はな。
`},
{id:11315,title:"スポットゆかりの話（２）",type:"personal",characters:["⑬"],memo:"ネロ",
text:`ネロ	ああ、賢者さん。そっちの道はダメだ。遠回りだが、迂回していこう。
晶	え？でも、来た時はこの道を通りましたけど……。
ネロ	夜はこの通りを歩いちゃいけない決まりなんだ。物騒だからさ。
晶	そうなんですか……。
	法律を守る人が多い街なのに、治安が悪い場所もやっぱりあるんですね。
ネロ	治安は悪いってほどでもないんだけどな。
	ここは特にルールがあるから誰も通らないし。
晶	……？決まりを守る人たちが住んでいる地域ってことですか……？
ネロ	そうさ。
	でも、歩いちゃいけない道を通るやつ、
	法典を守れないやつは、犯罪者に違いないって思われて通報される。
	元々は、客引きとかを追っ払うためのルールだったんだけどな。
	決まりだけが残ってる通りなんだよ。そういうわけだから、あっちの道を使う。
	ただあっちは追い払われた客引きがいるから、ちゃんとガラが悪い。
	気をつけろよ。あんまり俺と離れて歩かないようにな。
晶	（なんだか、すごくややこしい街だな……）
`},
{id:11316,title:"東の国について",type:"personal",characters:["⑬"],memo:"ネロ",
text:`ネロ	ルールは多いけど、俺みたいなやつには、東の国は住みやすいよ。
	もちろん完璧じゃないし、面倒だったり嫌なところもあるけど、他の国に比べたらさ。
	必要以上に他人に興味を持たないし、やらなきゃなんないことは真面目にやってるし、根っこはみんな善良だし。
	まあ、みんな人付き合いが下手だから、他人と付き合う時にルールがあると、ミスしないで済むから安心するんだろうな。
晶	ネロもそうなんですか？すごく話しやすくて、人付き合いが下手だなんて、あまり感じたことがないですが……。
ネロ	あはは、そりゃあ光栄だな。
	賢者さんくらいなら気にならないけどさ、あんまり周りからグイグイ来られるのは、ちょっと苦手かもな。
晶	そうですか……。気をつけますね。
ネロ	あんたは大丈夫だって！
	……でも、そうだな、例えばあんたみたいなやつに会った時……。
	珍しく興味が湧いて話しかけたくなっても、この国じゃ法律違反になることがあるからできない。
	黙って見送るだけだ。
	そこはちょっと、残念かもな。
`},
{id:11317,title:"〈大いなる厄災〉について",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	〈大いなる厄災〉が来る夜、雨の街の人たちはどんな様子ですか？
ネロ	他所に比べても、この街ではみんな怯えてる感じだな。
	だからってパニックを起こすやつもいないけど。
	不安を抱えながらも、備えをしっかりして家にこもってる感じで、厄災が来る数日前から誰も出歩かなくなる。
	正直、商売あがったりだよ。仕方ないけどな。
	この辺じゃ、厄災を見てると気が変になるって迷信があるくらい恐れられてるんだ。
晶	本当に迷信なんですか？
	〈大いなる厄災〉が近付きすぎた影響で、世界に異変が起こるほどなのに。
ネロ	確かに、厄災が来る時期は強い魔力を感じるよ。
	動物も植物も空気も、なんだか騒がしくなる。人間も多少感じるやつがいるのかもな。
晶	ネロは？調子が悪くなったりしないですか？
ネロ	俺もまあ……、うっすら、興奮しそうになるのかな。
	怒りっぽくなるような、感情的になるような、そわそわ落ち着かない感じだよ。
	個人差はあるけど、魔法使いはみんなそんな感じだ。
	だからあんたも、厄災が来る時は気をつけろよ。
	俺たちにな。
`},
{id:11318,title:"ネロのささやかな夢",type:"personal",characters:["⑬"],memo:"ネロ",
text:`ネロ	雨の街は住み心地が良くても、魔法使いは歓迎されない土地だから、長く留まれないのは難点かもな。
	年を取らないって分かると、近所になんとなく話が広がって、だんだん客が寄り付かなくなるんだよ。
晶	たしかに、魔法使いだってことを隠さなきゃいけない時に、長命なことは不利になるかもしれませんね。
ネロ	姿を変えたり、出会った人間の記憶を消したりするやつもいるみたいだけどな。
	それには魔力も気力も使うから、俺は店の場所を何十年に一回、変えることにしてる。
晶	大変そうですね……。
ネロ	引っ越し自体は面倒なだけだからいいけど、
	移動すると分かってると店の改装なんかは無理できないんだよな。
	繁盛しても、あんまり大きい店にするわけにもいかないしさ。
	シャイロックは気にせず定住してるから、店の内装、好きなだけこだわれて、羨ましいなって思う時があるよ。
晶	料理と同じくらいこだわった内装の、ネロのお店もいつか行ってみたいです。
ネロ	嬉しいこと言ってくれるなあ、賢者さん。
	魔法舎の食堂、誰かに頼んで、魔法でガラッと変えちまおうかな？
`},
{id:11319,title:"スポットの人々",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	ルールが多い街ですけど……、良かったなって所はありますか？
ネロ	いやいや、好みは分かれるかもしれないが、いい所もたくさんあるんだせ。
	例えば、俺みたいな素性の知れない男も、詮索されたりしないしさ。
	西の国に行った時は地獄だったぜ。
	目が合えば話しかけられるし、下向いてても話しかけられるし。
	東の国は、みんなシャイだけど、ちょうどいい距離感で接しやすいよ。
	根が真面目なやつが多いしな。
晶	それは、わかります。東の国の人たちって……。
~~~~~~~~~	~~~~~~~~~
選択	律儀で誠実だと思う。
ネロ	はは。まあ、そうなんだよな。俺以外はさ。
	~~~~~~~~~	~~~~~~~~~
選択	親切で優しいと思う。
ネロ	そうそう。そこにつけ込むやつもそんなにいないし、いい国なんだよ。
~~~~~~~~~	~~~~~~~~~

ネロ	それに、お願いしますっつって頼ると、ほとんどのやつが手を貸してくれるぜ。
	店を開きたいとか、娘にピアノを買ってやりたいとか、私的なことでもけっこう寄付が集まるんだ。
晶	そうなんですね！それは、なんとなく以外かもしれません。
	他者に興味が薄い印象があって……。
ネロ	あはは。そのイメージはあってると思うよ。
	でも、普段関わりが薄い分、みんな根っこでは人助けしたいのかもな。
`},
{id:11320,title:"スポットにいた魔法使い",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	この街で、他の魔法使いに会ったことはありますか？
	わかりやすい人はあまりいない感じですけど……。
ネロ	みんなトラブルを避けてるから、魔法使い同士でも名乗り合ったりすることはほとんどないだろうな。
	だけど、居ることは居るよ。俺みたいに商売してるやつもたまに。
晶	どんな職業なんですか？
ネロ	例えば、法律家。
	すごく記憶力がいいことになってるけど、魔法使いっぽいやつが何人かいるんだよな。
晶	魔法で記憶できるんですか？便利ですね……！
ネロ	いや、普通に覚えるんじゃないか？俺たち、時間だけはいくらでもあるからさ。
	役所に勤めてるようなのじゃなくて、街の案内を兼ねた、法律に詳しいやつらがいる。
	旅行者が雇って、一緒に行動するんだよ。
晶	なるほど。知らないうちに法律違反をしないようにですね。
ネロ	そうそう。だけど魔法使いは見た目が変わらないからさ。
	続けられてもせいぜい10年か20年くらいか。
	二人で組んで、何十年かごとに交代しながら働いてるやつとか、見かけたことがあるな。
晶	隠しながら働くのは大変ですね……。
	でも、そうまでしてこの街に暮らし続けるのは、魅力があるからなんですよね。
ネロ	東の国の、他人同士の距離感っていうのは独特だからな。
	一度ぴったり来ちまうと、他では暮らせないよ。
`},
{id:11321,title:"危険な場所",type:"personal",characters:["ヒースクリフ"],memo:"ネロ",
text:`ヒースクリフ	東の国は、暴動や大きな事件を起こすような血の気の多い人たちがいない代わりに、詐欺が多いとききますね。
晶	そうなんですか？東の国の人たちは、警戒心が強い気がしたので少し意外です。
ヒースクリフ	人見知りな気性の分、一度気を許した相手のことを疑いにくい傾向はあるのかもしれません。
	ルールさえ守っていれば安全だと思っている人も多いから、かえってつけ込まれやすい所があるのかも。
	俺の家も、一度お師匠様に騙されてますしね。
晶	ヒースクリフとシノのお師匠様……。
	二人に魔法を教えるのを買って出たけど、本当は魔力が弱かったんですよね。
ヒースクリフ	そうなんです。両親が授業料を払ってたんですけど、魔法舎で他の人たちに指摘されるまで騙されてて。
	他所でも、国王のお墨付きだとか、首都では有名だとか、オズの弟子だとか、話してみたいなんです。
晶	オズの弟子ですか……。
ヒースクリフ	あはは。本物のオズと、本物のオズの弟子に会った今なら、嘘だってすぐ見抜けたんですけどね。
`},
{id:11322,title:"ネロの評判",type:"personal",characters:["ブラッドリー"],memo:"ネロ",
text:`晶	ブラッドリー。どうしたんですか？なんだか機嫌がよさそうですね。
ブラッドリー	ふふん。まあな。
	この辺にあった美味い飯屋が急に店仕舞いしちまったって嘆かれてるのを耳に挟んだんだ。
	気持ちわかるぜって話しかけたら、逃げちまいやがったけどな。
晶	もしかして、ネロのお店でしょうか？
ブラッドリー	そりゃあそうだろ。
	あいつの作る料理は、どこの国に行ったって、そうそう出会えるもんじゃねえ。
	毎日食ってるとありがたみがなくなるが、いざ食えねえとなると、どうしても食いたくなる味なんだ。
晶	わかります。ネロのご飯、本当に美味しいんですよね。
ブラッドリー	うまく言葉にできねえが、なんつうか、毎食丁寧で感動するよな。
	作るやつの性格が良く出てるわ。
	ふわっと美味いが、美味いもの食った後にしか働かねえ細胞が、脳で一斉に働く感じがして鳥肌が立つっつうか……。
晶	わかります、わかります……！話してたらなんだかお腹が空いてきました……。
ブラッドリー	そうだな。今日の仕事は切り上げて、飯食いに帰ろぜ。
`},
{id:11323,title:"スポットの名物",type:"personal",characters:["シャイロック"],memo:"ネロ",
text:`晶	雨の街は、名物や特産物はあるんでしょうか。魔法舎のみんなにお土産を探したくて。
シャイロック	この街の特産といえば水でしょうね。ここは山脈からの雨や川の水が綺麗な土地です。
	私も水割りや氷に使うための水を汲みに、何度か訪れたことがあります。
晶	そうだったんですね。お店で出してたんですか？
シャイロック	いいえ、自分で楽しむ用ですよ。
	でも、そうですね。
	お土産に持って帰れば、オズやフィガロが晩酌するのに喜びそうです。
晶	なるほど。お酒を飲む組にはお水でいいのかな……？
シャイロック	水が上質であれば野菜も美味しくなります。
	ネロがこの街に住み着いて、店を構えていたのも頷けますね。
	西の都心部では汚染も問題になってきました。
	野菜なんかは、だいたい塩漬けや酢漬けにしてしまうんです。
晶	じゃあ、新鮮な野菜も買って帰りましょう。
	シャイロック、選ぶの付き合ってもらえますか？
シャイロック	もちろん。喜んで。
`},
{id:11324,title:"スポットでの発見",type:"personal",characters:["シノ"],memo:"ネロ",
text:`シノ	賢者、これを見てくれ。
晶	旗……？可愛いですね。横断歩道を渡るときに使うやつみたいです。
シノ	面白いんだ。
シノはそう言うと、道端に備え付けられた箱から小さな旗を引き抜いてパタパタと振って見せた。
街の人たち	…………。
すると、道を行き交う人たちが旗を上げ、こちらを気にするように見つめた。
やがて、何人かがこちらに足を向ける。
街の人	旅行者の方ですか？道に迷ったならご案内しましょうか。
シノ	な？旗を振るとみんな寄ってくるんだ。
街の人	……何か困っているのでは……？
シノ	いや、あんたたちが声をかけてくるのが面白くて、旗を振ってみただけ。
街の人	それは違法行為なんですよ……。
	故意なら通報するころになるんですけど、子供のしたことなので今回は見逃しますね。
シノ	おい、誰が子供……むぐぐ。
晶	あ、ありがとうございます……！すみません、連れはちょっと好奇心旺盛で……。
シノ	離せ、賢者。なああんた、用事があるならいいんだろ。
	ブランシェッド領に行く道を教えてくれ。
街の人	ブランシェッド？ここからじゃずいぶん遠いけど……。
	二人で行くのかい？そんな軽装で？
晶	（この町の人たちも、話しかけてくれると親切なんだけどな……。
	　何となく、ネロっぽい街だな……）
`},
{id:11325,title:"楽しい場所",type:"personal",characters:["シノ"],memo:"ネロ",
text:`シノ	賢者。あそこの広場、公園だって。
賢者	本当だ。子供が笑いながら走り回ってますね……！
シノ	この街に来てから、あんな笑い声初めて聞いたな。
街の子供	お兄さん！ゲームの人数が足りないから、一緒にやらない？
シノ	話しかけられた……。おまえ、知らない奴を誘ったりして、怒られないのか。
街の子供	ここではみんなで遊ばなきゃいけないんだよ！笑顔でいない人も、法律違反なんだ。
シノ	強要されるのは気にくわないが、いいぜ。混ざってやるよ。
街の子供	やったー！こっちだよ！ルールを教えてあげるね！
晶	（大人も子供もみんな楽しそうだ。
	　この街にこんなに明るい場所があるなんて、少しホッとしちゃったな……）


晶	あれ、どこからか鐘の音が……。
シノ	ただいま。
晶	シノ。もう戻って来たんですか？
シノ	遊べる時間が決められてるらしい。あと５分でここから離れないと捕まるって。
街の役人	広場を施錠します。速やかに退場してください。
晶	わっ。広場に入る門を閉じちゃうんですね……。
シノ	やっぱり窮屈な街だな。
`},
{id:11326,title:"マナエリア",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
ネロ	ああ、マナエリアの話かな。ちょうどこの前、ファウストが授業でやってたよ。
	マナエリアっていうのは、それぞれが個人的に、精神の安定を得たり、集中して魔力を養う場所のことなんだけど。
晶	たぶん、それです！ネロにもマナエリアがありますか？
ネロ	俺のマナエリアは、傾いた日差しで金色に光る麦畑だ。
	あんまり詳しく覚えちゃないが、たぶん、故郷にそういう場所があったんじゃないかな。
	胸くらいの高さの穂を掻き分けて進むイメージがずっとあってさ。
	調子出ないときなんかは、埋まるみたいに昼寝しにいくと元気が出るんだよな。
晶	リラックスしたいイメージなんでしょうか。
	ネロは繊細だから、ゆっくりできる場所がマナエリアになるんですね。
ネロ	……別に繊細でもねえけどさ。
	まあ、ピリピリした感じが続いてると、魔法も料理も、イマイチになるのはたしかだな。
`},
{id:11327,title:"アミュレット",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって
	賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	ネロもアミュレットを持ってますか？
ネロ	ああ、アミュレットか。あるある。
ネロは、壁に掛けてある乾いた麦穂の束を手にとって、俺に見せてくれた。
ネロ	俺のマナエリアは麦畑だからさ。そのまま、麦の穂を置いてるよ。
晶	なるほど……。効果はありますか？
ネロ	まあ、ないよりはな。というか、大昔にアミュレットの話を聞いてから、身近にはずっと置くようにしてるからなあ。
	ない時との差がわからないかもな。今更手放すのは、なんかちょっと不安だし。
	初めて置いてみた時は、効果を体感した気もするけど。昔すぎて忘れちまったな。
`},
{id:11328,title:"キッチンの見物人",type:"personal",characters:["オズ","ネロ"],memo:"ネロ",
text:`晶	あれ、オズにネロ。こんなところでどうしたんですか？
	なんだか珍しいツーショットですね。
ネロ	賢者さんか……。パンケーキを焼いててさ。
オズ	それを見ていたところだ。もう戻る。
晶	ネロのパンケーキ！ふわふわで、美味しいですよね。
オズ	ああ。
ネロ	ど、どうも……。
オズ	邪魔したな、ネロ。
	混ぜすぎたせいで生地が膨らまないのも、焼き方のコツも、初めて知った。
ネロ	作って行かないのか？なんならキッチン空けるけど。
オズ	必要ない。食べさせる宛てもないしな。
晶	行っちゃいましたね……。パンケーキ好きなんでしょうか。
ネロ	食うのが好きなら食ってくだろ。単に珍しいだけじゃねえか？
	はあ……。今日こそ殺されんのかと思って緊張したぜ……。
	たまーに覗きに来て、心臓に悪いんだよな。
`},
{id:11329,title:"家族",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	ネロも長生きの魔法使いなんですよね。家族のことって覚えていますか？
ネロ	長生きっても、オズほどじゃない。まあ、覚えてるよ。うっすらとだけど。
晶	よかったら、聞きたいです。兄弟はいたんですか？
ネロ	あー、なんか、たぶん、かなり……。
	賢者さんが思ってる感じじゃねえな。もっとがっかりするような話だ。
晶	がっかり、ですか……？
ネロ	俺が生まれた場所は、あんまり治安の良くない場所でさ。
	だからまあ、家の中の治安も悪かったんだ。
	ろくでなしの親がいて、血が繋がってるのかどうかわからない兄弟が何人かいた。
	俺もそこそころくでなしだったが、幸い魔法が使えたんで、早々に家を出たよ。
	家の連中とは、それきりだな。
晶	そうだったんですね……。込み入ったことを聞いてしまってすみませんでした……。
ネロ	ああ、いいっていいって。気にしなさんな。うっすらとしか覚えてないって言ったろ？
	こんな話、魔法使いの間じゃ珍しくないしさ。
	でもまあ、あんたは気が優しいから、家族の話題を聞くときは気をつけたほうがいいかもな。
`},
{id:11330,title:"何でもない毎日",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	ネロ、休憩中ですか？
ネロ	ああ、賢者さん。シノとヒースが食事中に喧嘩しやがってさ。
	一緒に皿洗いしてもらってんだ。
晶	あはは。仲直りできるといいですね。
ネロ	あいつら見てると飽きねえよな。
	……昔は俺にも、相棒みたいなやつがいたんだよ。
	一緒に仕事して、夜は酒飲んで、俺が飯やつまみ作って、あいつが美味いって言って食って。
	まあ、何でもねえ毎日だったけど。いい話でも、悪い話でも、何かあったときに、気軽に話せる相手がいるのは悪くなかったな。
	賢者さんはどうだ？そういうやつ、そばにいるか？
~~~~~~~~~	~~~~~~~~~
選択	います。
ネロ	そうか。そりゃなによりだ。
~~~~~~~~~	~~~~~~~~~
選択	いません。
ネロ	そうか。まあ、俺も、今はこいつ、ってのはいないかもな。
~~~~~~~~~	~~~~~~~~~
選択	わからない。
ネロ	そうか。俺でよければ、何でも遠慮せず話してくれよ。
~~~~~~~~~	~~~~~~~~~
晶	相棒って響きは格好いいですね。少し憧れます。
ネロ	はは……。居るなら居るで、厄介なこともあるけどさ。
	時間が経つと、やっぱり、よかったことばかり思い出すもんなんだな。
`},
{id:11331,title:"おねだり上手",type:"personal",characters:["リケ","ネロ"],memo:"ネロ",
text:`ネロ	じゃあ次、これは？
リケ	玉ねぎですね！玉ねぎは確か……。
晶	ネロ、リケ。……お絵かきですか？
ネロ	ああ、賢者さんか。リケの文字書きの練習を見てやってたんだよ。
	俺が絵を描いて、リケがその文字を書いてさ。
リケ	ネロ、次はオムレツを書いてください。
	今夜はオムレツが食べたいですって、どう書けばいいですか？
ネロ	はは、そりゃ夕飯のリクエストだろ。
リケ	そうです。
	オムレツが食べたい時、ネロに手紙を書けば、直接伝えるよりも、聞き入れてくれる気がするんです。
	どうですか？ネロ。
ネロ	…………。
晶	あはは。たしかに、リケが一生懸命文字を書いてきたおねだりを、ネロは無下にできないかもしれませんね。
ネロ	子供の言うがままになるほど、安易な男だった覚えはねえんだけどなあ……。
リケ	ふふ。
	ネロが他のメニューに読み違えないように、オムレツだけはちゃんと覚えたいんです。
`},
{id:11332,title:"本日の買い出し班",type:"personal",characters:["リケ","ネロ"],memo:"ネロ",
text:`晶	リケと待ち合わせ？
ネロ	あぁ、中央の街に食材の買い物に行くんでついでに連れてってやるんだよ。
	リケのやつ、同じもんばっかり食いたがるからよくよく聞いたらさ。
	自分の好物がよくわかってないみたいなんだ。
	色んなもん味見して好みの味が見つかれば、リクエストされる甲斐もあるだろ？
	まあ、初めて覚えた味が俺の料理じゃ舌が肥えちまうだろうけど。
晶	それは……、確かにそうですね。
ネロ	あはは。俺の知ったことじゃねえけどな。
リケ	ネロ、お待たせしました。
	今日の買い物、楽しみにしてました！よろしくお願いしますね。
ネロ	市場の雰囲気も見ていくといい。
	ゆっくり付き合ってやるよ。それじゃあ行ってくるわ。
晶	はい。ふたりとも、気をつけていってらっしゃい。
`},
{id:11333,title:"力仕事の賜物",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	ネロー、今日の夕飯は何ですか？
ネロ	賢者さん！丁度いいところに来た。
	今ちょっと両手が離せねえんだけど、シャツの袖が下がってきちまってさ。
晶	わかりました、袖を捲ればいいんですよね？
	よいしょっと……。
ネロ	助かったよ。ありがとな。
晶	…………。
ネロ	……どうした？まじまじと腕なんか見て。
晶	いえ、結構筋肉があるなあと思って……。やっぱり、鍛えてたりするんですか？
ネロ	いや、鍛えてるっつーより、料理屋って意外と力仕事が多いから、自ずと腕の筋肉はつくんだよ。
晶	なるほど……。
ネロ	ありがとな。今日の夕飯は賢者さんの皿は肉多めにしとくよ。
晶	（俺も沢山肉を食べたらもっと筋肉がついたりしないかな？いや、むしろ料理をするべき？）
`},
{id:11334,title:"繊細な優しさ",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	……はあ。
ネロ	どうした？食欲がないのか？
晶	あっ、すみません。気を使わせてしまって……。
ネロ	いいよ、無理しなくて。誰にだってそういう日はあるさ。
	体調でも悪いのか？
晶	実は、少しだけ気疲れしてしまって。何か嫌なことがあるとかじゃないんですけど。
	元気が出なくて……。
ネロ	そういう時あるよな。何となく疲れちまって誰とも話したくなくなったりさ。
	別に誰が悪いとかじゃねえから、気を使わせるのも悪いしさ。
晶	そうなんです……！大きな理由がないからこそ、誰かに相談もしづらくって……。
ネロ	そういう時は一日部屋にこもってみるのもいいんじゃないか？
	心配性な奴らには俺から上手く言っておくからさ。
晶	ネロ……。ありがとうございます、何だかすごく安心しました。
	明日は思いっきり引きこもろうと思います！
ネロ	部屋で良いやすい軽めの食事持ってくよ。ベッドの上で食ってこぼすなよ？
`},
{id:11335,title:"得意な魔法",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	ネロは得意な魔法ってありますか？ネロにしか使えない魔法とか。
ネロ	俺にしか使えないなんて大層な魔法はないが、細かく操る、みたいなのが得意だよ。
	でけえのを一個、っていうよりは、細かいのを一度にたくさん、って感じだな。
晶	なるほど。わかりやすいです！
	ネロは、作ってくれる料理も繊細な感じがしますもんね。
ネロ	だろ？まあ、東の国の魔法使いは、そういう気質の奴が多いのかもしれねえな。
晶	そういえば、ネロは料理をする時にあまり魔法を使いませんよね。
	やっぱりこだわりがあるんですか？
ネロ	こだわりってほど大したもんじゃねえけどさ。
	材料に直接触って、作ってる実感がある方がいいだろ。
晶	いいっていうと……。
ネロ	だからまあ……。
	手で作る方が楽しいよ。
`},
{id:11336,title:"お手軽ピッキング",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	うーん……。
ネロ	賢者さん。何を唸ってんだ？
晶	ここのドアが開かなくて……。どの鍵も合わないみたいなんです。
ネロ	へえ。ちょっと貸してみな。
	《アドノディス・オムニス》
晶	えっ！
~~~~~~~~~	~~~~~~~~~
選択	直してくれたんですか？
ネロ	いや、こじ開けただけだ。このくらいなら朝飯前だよ。
~~~~~~~~~	~~~~~~~~~
選択	壊しちゃいましたか？
ネロ	どっかの馬鹿と一緒にしないでくれよ。鍵穴いじってこじ開けただけだ。
~~~~~~~~~	~~~~~~~~~

晶	すごい、ありがとうございます！なんだか手慣れてましたね。
ネロ	はは……。
	シンプルな錠前だったし、これくらいなら俺じゃなくてもできると思うけど。
晶	そんなことないですよ。手際の良さがまるで鍵開けのプロみたいで、感動しました。
ネロ	……やめてくれ。
`},
{id:11337,title:"紋章",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	賢者の魔法使いには、目印になる賢者の紋章が身体に現れるって聞きました。
	ネロの紋章はどこにあるんですか？
ネロ	ああ、この辺りだ。
ネロはそう言って、服の上から左の二の腕あたりをポンポンと叩いて示した。
ネロ	賢者の魔法使いに選ばれた時に、身体のどこかに紋章が浮かんでくるって話には聞いたことがあったんだけどな。
	急に光って……。まさか自分が、って感じで驚いたよ。
晶	たしかに、いきなりだと驚きますよね。
ネロ	そのうち慣れるもんかと思ったけど、まだダメだなあ。
	自分についてる紋章が他のやつらの身体にもあると思うと、なんていうか、違和感があって……。
	居心地悪いような、気持ち悪いようなさ。
	他人のベッドを借りるような、どうにもいい気分ではないんだよな。
晶	気持ち悪い感じ、ですか……？
ネロ	気にしすぎなのかもしれねえけど……。
	まあ、慣れだと思うから、あんたも気にしないでくれよ。
`},
{id:11338,title:"求：包丁スキル",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	わあ、野菜がたくさんですね！
ネロ	はは……まとめて買うと安いって言われて、つい買い過ぎちまってさ。
	お子さま達の為に、食べやすくしなくちゃな。
晶	俺もお手伝いしましょうか？お役に立てるかは分らないですが……。
ネロ	助かるよ。じゃあ、そこにある包丁とまな板使って細かく切ってくれるか？
	指切らないようにな。
晶	はい！
	（よし、ネロがいつも切ってるみたいに、綺麗で繊細な感じで真似をして……）


ネロ	調子はどうだ……ってなんだこりゃ！？
晶	すみません……努力してみたんですが、ネロみたいに上手くいかなくて、
	どんどん訳のわからない形に……。
ネロ	いや、全然構わないけどさ。っふふ、この形、なんかツボに入っちまって
	……っはは、あっははははは！
晶	（ネロがこんなに笑うなんて、珍しい……）
`},
{id:11339,title:"就寝前のティータイム",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	こんばんは、ネロ。今日の任務で北の国に出かけたので、お土産を採って来たんです。
ネロ	俺に？採ってって……、さては食材だな？
晶	はい！これ、前に話してましたよね。
	スノウとホワイトが、瓶に封じてくれたんですが……。
ネロ	サンダースパイスじゃないか！北のやつは見つけにくい分、特別上等なんだ。
	大変だったろうに、わざわざありがとうな。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
ネロ	ひとりのときはダラダラしてるよ。ベッドで本読んだりさ。
	専用のキッチンも作ったけど、そんなに熱心に料理研究するわけじゃない。
	まあ、今日はこれで試作を作ってみるけどな。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
ネロ	俺が呼んでるわけじゃないが、シノやリケが、腹減った時に訪ねてくる。
	北の連中も遠慮がねえな。
	だけどまあ、部屋で話そうぜ、っていうのより、
	用事がある時に声をかけられるくらいが、俺にちょうどいい距離感かもな。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
ネロ	早めに起きて、カナリアさんの朝食の準備と後片付けを手伝ってるかな。
	そのあとは魔法の訓練に出て……。
	昼寝して、夕食の支度手伝って、夜は適当に過ごして寝るよ。
~~~~~~~~~	~~~~~~~~~

晶	寝る前にお邪魔しちゃってすみませんでした。
ネロ	何言ってんだ。あんたこそ、疲れてるとこ来てくれたんだろ。
	よかったらお茶くらい淹れるけど。
	このスパイスをちょっとだけ茶葉に入れると、体があったまってまた美味しいんだよ。
晶	美味しそうですね……！じゃあ、少しだけ頂いていきますね！
`},
{id:11340,title:"余り物のおすそ分け",type:"personal",characters:["ファウスト","ネロ"],memo:"ネロ",
text:`ネロ	後片付けまで手伝ってくれてありがとな。
晶	いえいえ。
	いつも美味しい料理を食べさせてもらっているので、このくらいさせてください。
ファウスト	ネロ、何か昼食の余り物はないか？腹が減っているんだが。
ネロ	あんたがそんなことを言うなんて珍しいな。余り物ってどんなもんが欲しいんだ？
ファウスト	……小魚とか。ソーセージの切れ端でもいいが。
晶	小魚とソーセージって、何だか猫が好きそうな食べ物……。
ファウスト	賢者。僕が食べたい物にケチをつける気か？
晶	い、いえ、そんな滅相もないです！
ネロ	ソーセージなら確か余ってたはずだ。すぐ用意するから、少し待っててくれるか。
ファウスト	ああ、ありがとう。
ネロ	ファウストでも猫でもいいが、食べ過ぎには気をつけろよ。
`},
{id:11341,title:"衛生管理の鬼",type:"personal",characters:["⑬"],memo:"ネロ",
text:`ネロ	クッソ！あの野郎どこ行きやがった！？
	早く捕まえねえと、料理どころじゃねえぞ……。
晶	ネロ！どうしたんですか？もしかして、またブラッドリーがつまみ食いを……？
ネロ	今回ばかりはあいつの方だ幾分かマシだ！賢者さん、そっち見張っててくれ。
	こんなこと言いたくねえけど、ネズミが出たんだよ……。
	ありえねえ事態だよ、ったく……。
晶	ネズミ！？
	あっ、ネロ！あそこにいます！
ネロ	おらっ！チッ、逃したか！
	そこか！？くそ、すばしっこいな……。衛生管理は徹底してたはず、なんで……。
	あ！こんなとこに食い残しがあるんじゃねえか！？
	野菜の残し方からしてブラッドだな。
	あんだけ食い残しは放置するなっつったのに！
	絶対に仕留めてやる……。俺の聖域を荒らしたこと、後悔するんだな！
晶	（仕留められるのがネズミなのかブラッドリーなのか分らない……）
`},
{id:11342,title:"秘密の口止め料",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	あれ、ネロ何してるんですか？
ネロ	はは……見つかっちまったか。今日は夜風が心地よくってさ。ここで晩酌してるんだ。
晶	確かに、今日はいい夜ですね。
ネロ	だろ？ここは俺の秘密の晩酌スポットだから、できれば、誰にも言わないでくれよ。
~~~~~~~~~	~~~~~~~~~
選択	わかりました。
ネロ	ありがとさん。あんたはそう言ってくれると思ってた。
~~~~~~~~~	~~~~~~~~~
選択	絶対に誰にも言いません。
ネロ	あはは、そんな深刻になんなくてもいいけどさ。
~~~~~~~~~	~~~~~~~~~

ネロ	じゃあ、これは口止め料だ。
	ほら、口開けな。
晶	…………！甘い！
ネロ	甘いもんも酒には意外と合うもんだ。
	それに、こんな時間に食うチョコレートは格別だろ？
晶	すごく……罪深い味がしますね……！
ネロ	この味を一度知っちまったら、もう後戻りはできないな。
	口止料の分、頼むぜ賢者さん？秘密を守ってくれたら、またこいつをやるからさ。
`},
{id:11343,title:"授業参観",type:"personal",characters:["東"],memo:"ネロ",
text:`ネロ	おう、やってるか？
ヒースクリフ	ネロ、賢者様。一緒に来るなんて珍しいですね。
ネロ	廊下で会ったんだ。賢者さんも授業を見学したいんだとさ。
晶	みなさんがどんな風に魔法を学んでいるのか興味があって。
シノ	座学なんて見てても退屈なだけだ。ファウスト、実技の訓練に変えてくれ。
ファウスト	予定の変更はしない。ちゃんと座りなさい。
シノ	賢者に格好いいところをみせてやろうと思ったのに……。
ヒースクリフ	こら、シノ。そうやってすぐ拗ねるなよ。
ネロ	はは。やんちゃな生徒を持つと大変だな。ファウスト先生？
ファウスト	茶化すな。肘でつつくんじゃない。
晶	（もっとピリッとした雰囲気で授業をしているのかと思ったけど……）
	見知らぬ人には警戒心の強い猫が、仲間には心を許している、みたいな感じなのかも？
ネロ	ん？なんか言ったか？
`},

{id:12001,title:"スポットの印象（１）",type:"personal",characters:["ルチル"],memo:"レノックス",
text:`ルチル	レイタ山脈も、南の国の中では景色が綺麗で有名な場所です。いかがですか？賢者様。
晶	雲や空が近いですね。こんな高い山の高原には来たことがなかったです。
ルチル	大きい山のてっぺん近くにいるって思うと、なんだか感動しますよね。
	だけど、さすがに少し冷えるかな？寒かったら言ってくださいね。
晶	ありがとうございます。
	レノックスに言われて、中に暖かいものを着て来たので大丈夫です。
ルチル	夜や冬はもっと冷えると聞きますし、綺麗ですけど、きつい傾斜も崖も多いし……。
	この辺りで暮らす人たちは逞しいですね。
晶	そうですね。俺もこの世界に来てからかなり鍛えられましたけど、
	特に地形の厳しさを感じるというか。
	学校や仕事で街に出る人も大変そうですよね。
ルチル	たしかに、麓の町にも学校があるかはわからないですし、
	じゅうぶんに勉強できている子は少ないかもしれないです。
	だけど、自然のことなら、きっとここの子供達の方が詳しいし、賢いんじゃないかな。
	天気の読み方や、地形や地質の把握、植物や動物や鳥たちの生態……。
	暮らしに必要な知識がたくさんありますから。
	山脈で働いている子供たちは、教わったことを
	兄弟や年下に伝えていくのも仕事のひとつだから教え方も上手いんですよ。
晶	そうか……。どんなに小さな子でも、ここでは先生になるんですね。
`},
{id:12002,title:"スポットの印象（２）",type:"personal",characters:["ファウスト","レノックス"],memo:"レノックス",
text:`晶	ファウストも、この辺りに来るのは初めてですか？
ファウスト	そうだな。美しくて、穏やかで……。
	の事件のあと、きみに助けられて、手当てを受けた場所に似ている。
レノックス	……はい。
ファウスト	なんだ。
レノックス	……なんと言えばいいのか、未だに分からないでいるんです。
	あなたを探し続けていたかったです。それが俺の誠意だと思っていたから。
	後悔をしているわけではありません。ですが……。
レノックス	俺はここに居ついてしまった。
晶	…………。
ファウスト	僕だって、あの事件から、人間を呪い続けるのが僕の憎しみだと思っていた。
	それでも、思い出さずに過ごしてしまう日もあった。
	後悔しているわけではないけれど。
レノックス	……俺には、嬉しい事です。心から。
ファウスト	僕も、この雄麗な景色の中、きみが穏やかに過ごしていたのなら、それが嬉しいんだ。
	心から。
	わかるだろう？
レノックス	はい……。
ファウスト	この場所を気に入っていたんだな。僕と一緒にいた頃のきみを思い出すと、
	意外なような、納得するような、そんな景色だ。
`},
{id:12003,title:"スポットの印象（３）",type:"personal",characters:["シャイロック"],memo:"レノックス",
text:`晶	シャイロック。今日は一緒に来てくれてありがとうございました。
シャイロック	おや。私はあなたの可愛らしいおねだりなら、いつでも聞いて差し上げますよ。
	ねだってくださらないのは、賢者様の方では？
晶	あはは、えーと……。シャイロックの可愛い判定を押さえる自信がまだなくて……。
シャイロック	ふふ、つれないかた。
	今日の午後は休暇にしたんですよ。
	レノックスから星空が綺麗な場所だと聞いたので。
	夜を待って、一杯飲んで帰ろうかと。
晶	それはいいですね！南の国の風景はのんびりするのに向いてる気がします。
シャイロック	同感です。
	この景色がいつまでも変わらずにいてくれたらと願いますが……。
	南も開拓が進んでいると聞きます。人が住むには不便なところなんでしょうね。
晶	そうですね……。魔法が使えない人たちには、厳しい土地かもって思います。
シャイロック	世界は目まぐるしく変わり始めています。二百年、三百年と経った時、
	どんな景色になっているのか、もう誰にも予想ができません。
	せめて覚えておくために、
	この時代のいろいろな風景を見ておくのは、悪いことではない気がしますね。
晶	（そうか……。魔法使いは長生きだから、
	　世界が変わって行くのをずっと見続けることになるんだな……）
シャイロック	空が広くて、澄んだ風も心地いい……。夜空が華やぐ時間が楽しみです。
`},
{id:12004,title:"ブレイクタイム（１）",type:"personal",characters:["⑳"],memo:"レノックス",
text:`レノックス	すみません、賢者様。夜が明ける前から手伝ってもらってしまって。
晶	いえ、早朝の山って一度来てみたかったです。
	本当なら重装備じゃないと来られないのに、箒だとあっという間でしたね。
レノックス	ええ。寒かったらおっしゃってくださいね。
晶	大丈夫です！でも、霧がすごいですね。こんなところで仕事してたなんて凄いなあ……。
あたりに立ち込めた濃い霧を見回して言うと、レノックスは少しだけ何か言いたげに俺を見つめる。
晶	……どうかしましたか？
レノックス	……いえ、少し驚かせたくなってしまって。もうすぐ日の出ですよ。
青白い薄闇と、深い霧の奥、うっすらと明るくなって来た方向を示してレノックスが足を止めた。
風が吹いて、かすかに霧が薄くなる。
すると、霧と朝焼けの空の間に、ふわりとオレンジ色の陽光が輝いた。
それを合図にしたように、
辺りに立ち込めていた霧は波のようにうねり、もうもうと山峡へ流れ込んでいく。
目の前の景色を晴らして昇り始めた朝日が、
羊の毛を優しく撫でるように、雲の表面をきらきらと輝かせる。
気づくと、眼下の遥か彼方まで、雲の海が広がっていた。
晶	（霧じゃなくて、雲の中にいたんだ……）
絶景に、俺はしばらくの間、言葉を忘れて立ち尽くしていた。
レノックス	日が昇って山頂の気温が上がると、雲が麓に下りていくんです。
	ご一緒できてよかったです。この時間だけ見られる、ご褒美のような景色ですよ。
`},
{id:12005,title:"ブレイクタイム（２）",type:"personal",characters:["ファウスト","レノックス"],memo:"レノックス",
text:`レノックス	あの……。
晶・ファウスト	？
レノックス	あ、いえ…………。やっぱりいいです。
晶	珍しいですね。レノックスが言いよどむなんて。どうしました？
レノックス	実は、お二人にお見せしたかった景色があるんです。
	ですが、日暮れまで待つことになりますし、自己満足かもしれないと我に返って。
晶・ファウスト	…………。
ファウスト	そんな申し出を断ったりしないよ……。おかしな遠慮はしなくていい。
晶	そうですよ！ぜひ見てみたいです！
レノックス	……ありがとうございます。
晶	（この二人、やっぱりまだ少しギクシャクするところもあるみたいだ。
	　過去に色々あると大変そうだな……）
~~~~~~~~~	~~~~~~~~~
選択	話題を盛り上げる。
晶	レノックスがファウストの従者だった頃の話とか、よければ色々聞きたいです！
ファウスト	そうだな……。今と比べれば、もっとシャッキリしていたよな。
	ここまで穏やかな感じじゃなかったよ。
レノックス	……戦乱の時代でしたから。
	靴を脱いで寛いでいても、次の瞬間には逃げ出す必要があったんです。
	それに、それを言うなら、ファウスト様も同じです。もっと、覇気がありました。
	お忙しかったからですか。
ファウスト	言うじゃないか。
~~~~~~~~~	~~~~~~~~~
選択	二人で行くよう勧める。
晶	積もる話もあるでしょうし、二人で少しゆっくりして来たらどうですか？
	俺はみんなと先に帰っているので。
レノックス・ファウスト	……。
ファウスト	きみはどうしたい？
レノックス	いや……、もう少し気軽なつもりだったので、
	そう改まると緊張するというか、照れるというか……。
晶	（煮え切らないな……）
`},
{id:12006,title:"スポットの思い出（１）",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	レノックスの飼っていた牧羊犬って、どんな子だったんですか？
レノックス	あぁ……。そうだな……。
	自分の誕生日と同じ日に生まれた犬だったんです。
	最初は譲り受けるのを迷っていたんですが、なんとなく、運命的なものを感じて。
晶	そうだったんですね！それはたしかに縁がありそうです。
レノックス	はい。
	賢くて、気性も穏やかで、何より気が合いました。
	目を見れば、お互いが何をしたいのか、何をして欲しいのかが分かって。
	結婚を考えたことがあるとすれば、あいつだけですかね。
晶	……恋愛していたんですか？
レノックス	はは、恋ではないですよ。でも、そのくらい、大切な相方でした。
	あの辺りの斜面を気に入って、よく走り回っていたんです。
	ここを通るとやっぱり、思い出しますね。
`},
{id:12007,title:"スポットの思い出（２）",type:"personal",characters:["⑳"],memo:"レノックス",
text:`レノックス	昔、レイタ山脈の景色を気に入って、麓にレストランを開いた人がいました。
	「ヒウカーオ」という店で、コーヒーがとても美味くて。
	春に出かける時と、秋に帰ってきた時に通るたび、必ず立ち寄っていたんです。
晶	いいな！絶景を眺めながら飲むコーヒーは、格別に美味しそうですね。
レノックス	そうなんです。夕焼けから日が沈むまでの間、
	ゆっくりコーヒーを飲むのを毎年の楽しみにしていたんですが。
	一代で畳んでしまったんです。
	まだ続いていたなら、賢者様をお連れしたかったですね。
晶	ああ……、そうなんですね。残念です。
レノックス	店主とも親しくしていたので、続けてもらえないかと言ってみたんですが、
	そんなに言うなら跡を継いでくれと笑われて。
晶	冗談じゃなかったかもしれませんよ。
	レノックスは、喫茶店のマスターが似合う気がします。
レノックス	はは、俺は愛想がないからな……。
	気に入りのものを、誰かからいつまでも変わらずに提供してもらうことは難しいです。
	店主は最後の年まで楽しそうでした。
	本当に大切なものは、自分で作り出して育てるしかありませんね。
`},
{id:12008,title:"レノックスへの印象（１）",type:"personal",characters:["フィガロ"],memo:"レノックス",
text:`晶	フィガロはレノックスとも付き合いが長いんですよね。
	フィガロから見て、レノックスってどんな人ですか？
フィガロ	時代ごとに色々あるからなあ。俺が話しちゃったら怒られないかな。
晶	レノックスは怒ったりしないように思えますけど……。時代によって違うんですか？
フィガロ	いや、レノックス自体は変わらないよ。
	でも、見るものによって味わいが変わるみたいなところがあるよね。
	まず、基本的には頑固だ。最終的には言うことを聞いてくれるけど。
	それに、割り切らない。
	「まあしょうがないんじゃない」っていうのがない。できないのかもな。
	タイプ的にはオズに似てるよ。
晶	割り切らない、ですか……？
フィガロ	そうそう。割り切りを知っていれば、
	四百年も人探しなんてしないし、世界征服だってしないさ！
	でもまあ、いいやつだよ、すごく。最初は真面目なだけの軍人なんだと思ってたけど。
	あれが実直ってことなんだろう。あまりにも自分と違いすぎて……。
晶	違いすぎて、何ですか？
フィガロ	うーん。
	レノックスみたいになりたいとは思わないけど、
	レノックスみたいな人柄だったら真実の愛にも手が届くのかなって思ったかな。
`},
{id:12009,title:"レノックスへの印象（２）",type:"personal",characters:["ルチル"],memo:"レノックス",
text:`晶	ルチルは、子供の頃からレノックスと面識があるんですよね。
	レノックスのこと、どう思っているんですか？
ルチル	レノさんは、優しいお兄さん！って感じです。
	寡黙で大柄だから、少し怖いかもって思う人もいるかもしれないですけど……。
	どんな話もちゃんと全部聞いてくれるし、どんなことにも付き合ってくれるんです。
	嫌だって断ってる所を見たことがないくらい。
	できないときはできないときで、理由を話してくれるから、
	レノさんに拒絶されたと思ったことは一度もないんです。
晶	たしかに、なんでも受け止めてくれる感じしますね。包容力があるっていうか……。
ルチル	ですよね！魔法舎に来て初めて歴戦の勇者だったってお話を聞いたんですけど、
	そういうところもかっこいいです！
	ただでさえかっこいいのに、戦っても強いなんてどうするんだろ！って思います。
晶	あはは。なんだか、レノックスのファンみたいですね。
ルチル	私だけじゃないと思いますよ。
	優しくて頼もしくて、故郷のみんなや両親も、レノさんのことは大好きでしたから。
	母様はフィガロ先生とよくお話してたけど父様はレノさんと仲が良かった気がします。
	家具の修繕の仕方を教わったりしてました。
	そばにいてくれると、ほっと安心できる人なんですよね。
`},
{id:12010,title:"レノックスへの印象（３）",type:"personal",characters:["ミチル"],memo:"レノックス",
text:`ミチル	レノさんを見てると、これから冬が来るような気持ちになります。
晶	レノックスで季節を感じるんですか？
ミチル	はい。えへへ……。ちょっとおかしいかもしれないですけど……。
	レノさんは毎年春になると羊を連れて高原に出かけて行って、
	秋になると帰って来てたんです。
	だから……。
晶	羊飼いの仕事って、何ヶ月も高原を旅するんだって言ってましたもんね。
ミチル	はい。昔、薬学の勉強を始めた時に、高原にしか咲かない花で作る薬があって、
	レノさんにお願いしたことがあるんです。
	もし見かけたら、って言ったんですけど、
	その年の秋にはちゃんと採って来てくれたんですよ。
	でも、後でフィガロ先生に聞いたら、
	なかなか見つからない花なんだよって教えてくれて……。
	たぶん、すごく探してくれたんだと思うのに、レノさんは何も言わなかったんです。
	何も言わないけど、すごく優しい人なんだなって思いました。
晶	レノックスっぽいエピソードですね……。
	それじゃあ、２人が一緒に夏を過ごすのは魔法舎に来てからが初めてなんですか？
ミチル	そうなんです！
	レノさんはいつでも変わらない気がするけど、夏のレノさんと遊べるのは楽しみです。
	魔法はフィガロ先生に教わりましたけど、
	物作りとか、屋根の直し方とか、馬や牛の扱いはレノさんに教わりました。
	今度は、夏の魚の釣り方を教えてくれるんですって！
	大きいのが釣れたら、賢者様にも見せますね！
`},
{id:12011,title:"レノックスへの印象（４）",type:"personal",characters:["ファウスト"],memo:"レノックス",
text:`晶	ファウストはレノックスと付き合いが長いんですよね。
	レノックスのこと、どう思っていますか？
ファウスト	きみの知っている通りの魔法使いだよ。
	実直で、いい青年で、その反面、意志が強く強情で、譲らないところもある。
	……初めて会った時から変わらないな。
~~~~~~~~~	~~~~~~~~~
選択	初めて会った時っていうと……
ファウスト	四百年くらい昔の話だ。
	僕のいた軍に人が増え始めた頃に炭鉱夫の仲間と一緒にやって来た。
	荒くれ者の集まりなんじゃないかと少し警戒してたが、みな真面目だったな。
	だけが魔法使いで、僕付きの従者になった。
	僕より年上で身体も大きいし、最初は僕の方が恐縮してたくらいだ。
	も彼は気にせず忠義を尽くしてくれて……。
	もともと昔は人を疑うたちでもなかったけど、戦いの中でも、
	彼のそばにいれば安心できた。レノックスは初めから信用できる男だった。
~~~~~~~~~	~~~~~~~~~
選択	二人は上下関係が厳しそうですよね。
ファウスト	……言っておくが、僕が強いているわけじゃないからな。
	僕は敬語をやめるように言ったこともあるし、
	友人として彼の意見を聞きたいとも思ってた。
	気の許せる兄ができたような気持ちでいたこともあるくらいなのに……。
	彼のかしこまった態度がずっと変わらないから、
	いつの間にか部下として接するのが当たり前になったんだ。僕が譲ったんだよ。
~~~~~~~~~	~~~~~~~~~
選択	強情なんて意外です。
ファウスト	彼は強情で強引だよ。
	無礼だと思ったことはないけど、僕が折れることもそこそこあった。
晶	あまり想像つかないです。どんな時ですか？
ファウスト	レノックスが僕に休めと言う時には、
	僕がどれだけ大丈夫だと言っても聞いてもらえない。
	だけど、彼自身が無理をしている時には、僕がどれだけ休めと言っても聞かないんだ。
	命令だと言っても断られたことがある。
晶	あはは。なるほど、納得できました。

ファウスト	……彼には幸せになって欲しいと願ってる。彼は幸せになれる魔法使いだろうから。
晶	レノックスも同じことを言うと思いますよ。
	ファウストに幸せになってほしいって……。
ファウスト	僕はもう、幸せになるつもりなんてない。
	だから彼も僕とは関わらない方が幸せになれるだろう。
	四百年も彼の人生を費やさせてしまったことについては、
	どこかで責任を取るつもりだけど……。
	この景色みたいに穏やかで幸せな暮らしをしていて欲しいと思ってるよ。
`},
{id:12012,title:"レノックスへの印象（５）",type:"personal",characters:["フィガロ","レノックス"],memo:"レノックス",
text:`ジョン	わしがまだ子供の頃から、レノックスにはたびたび世話になっていたよ。
	レイタ山脈の羊飼いは皆そうだろう。
	息子のピーターが生まれた時も、レノックスに助けてもらったんだよ。
晶	レノックスに？
ジョン	産気づいた妻の容態が悪くなって、医者を呼ぼうと山を下り始めたら、
	天気が荒れ始めて、立ち往生しちまったんだ。
	雨の中、途方にくれてたら、レノックスが箒で飛んで来てくれた。
	「あんたが呼んでる気がしたから」って。
晶・フィガロ	かっこいい〜。
フィガロ	そんなのがわかる力なんてあったの？
レノックス	いえ、なんとなくです。魔力じゃないと思います。
晶	すごい！じゃあ、第六感ってやつですかね？
フィガロ	なにそれ。俺が死にそうになってたら、その時も駆けつけてくれる？
レノックス	……フィガロ様ならむしろ、俺が死にそうな時に駆けつけて欲しいですけど……。
フィガロ	あはは、そりゃそうか。
	でも、そんな時におまえが呼ぶ相手は俺じゃないと思うよ。
レノックス	時と場合によりますが、それはあなたも同じでしょう。
晶	まあまあ……。
	さすが、南の魔法使いというか、人助けすることが多いんですね。
レノックス	俺も困った時は助けられていました。
	山は厳しい土地ですから、山脈で働く者同士、助け合って仕事をしているんですよ。
`},
{id:12013,title:"レノックスへの印象（６）",type:"personal",characters:["ブラッドリー"],memo:"レノックス",
text:`ブラッドリー	何もねえとこだな。
	大陸の真逆にある場所なのに、雪が深けりゃ北の景色に似そうだぜ。
晶	レノックスはここで羊飼いをしてたそうですよ。
	ブラッドリーはレノックスのこと、どう思っていますか？
ブラッドリー	南の魔法使いのくせに物怖じしねえのは、
	魔力が弱くて相手の強さを測れねえだけなのか……。
	それとも、フィガロとも付き合いがあるっていうし、
	強い相手にも態度が変わらねえ奴なのか。
	どっちにしろ、北じゃすぐに死んじまうタイプだな。
晶	そうなんですか？
ブラッドリー	因縁つけられりゃ、弱え奴は謝るしかねえのが北の国だぜ。
	あいつ、中身は頑固そうだろ。
	まあ、どうしてもって頼むなら、俺様の手腕で盗賊に仕立ててやってもいいけどよ。
晶	盗賊、レノックスに向いてそうですかね……！？
ブラッドリー	身体はよく鍛えてるし、ガタイが良くて冷静だ。弱くてもハッタリが利く。
	強奪なんかは本来の性分じゃねえだろうが、
	何をしても生き延びてえって根性があるならできるだろ。
晶	うーん……。あんまりイメージがわかないです……。
ブラッドリー	まあ、ああいうやつは、自分のために働くよりも、
	何か守るものがある方が強くなるかもな。
`},
{id:12014,title:"スポットゆかりの話（１）",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	羊を群れで移動させながら育てるって、どんな意味があるんですか？
	大変そうだなって思いますけど……。
レノックス	同じ場所に留まっていると、どうしても食料にする草が足りなくなるんです。
	羊たちは栄養のある短い草しか食べなくて。
	俺が標高の高い場所を選んだのは、伝染病に掛かりにくいからですかね。
	他のルートを通っている羊飼いもいますよ。
	羊たちは群れるのが好きで、あまりはぐれないから面倒が見やすいです。
	数十匹なら、手間はそこまで変わらないですね。
晶	なるほど……。たしか、全部が全部、レノックスの羊ってわけじゃないんでしたよね。
レノックス	ええ。
	いくつかの家からまとめて預かって、春から秋にかけて代わりに放牧するんです。
	家財や命綱を預かるようなものなので、
	万が一、いなくなった時は、見つかるまで必死に探します。
	俺は魔法使いですから、箒に乗って追ったり、夜に灯りをつけたりできますが、
	人間がやるには大変な仕事ですよ。
晶	そうなんですね……。
	でも、魔法が使えるから簡単な仕事だってこともないと思いますよ。
レノックス	ありがとうございます、賢者様。
	羊を預けてくれる人たちから、あんたに任せておけば安心だと言われるのは、
	やはり嬉しいし、やりがいのある仕事ですね。
`},
{id:12015,title:"スポットゆかりの話（２）",type:"personal",characters:["⑳"],memo:"レノックス",
text:`レノックス	そうだ、賢者様。何か荷物からなくなったものがありませんか？
晶	なくなったもの……？確認してみますね。
突然の質問に驚きながら、俺はポケットや鞄の中を確かめた。
晶	……大丈夫みたいです。俺、落し物してましたか？
レノックス	いえ、それなら良かった。
	この辺りには悪戯好きの妖精が住んでいて、
	持ち物を隠されてしまうことがあるんです。
晶	妖精……。本物の妖精がいるんですか？レノックスは見たことがあるんですか？
レノックス	他の場所でならありますよ。
	ここの妖精たちは隠れるのが上手いので直接見たことはないですが。
晶	悪戯好きなんて、ちょっと西の国っぽいですね。
レノックス	そうですね。滅多に人の来ない場所だから、人恋しいのかもしれないな。
	なくなったことに気づくまで盗むので、
	「あれがなくなった、これがなくなった」と言いながら歩くと盗られないんですよ。
晶	あはは、おまじないみたい。盗られる前に盗られたフリをするんですね。
	じゃあ、ええと……。
	ハンカチがなくなったみたいだなー。……こんな感じでしょうか？
レノックス	お上手ですよ。俺は、替えの靴下が見当たらない。困ったな。
晶	あはは。じゃあ、予備の歯ブラシが……。
レノックス	羊の爪切りが……。
`},
{id:12016,title:"スポットゆかりの話（３）",type:"personal",characters:["フィガロ","レノックス"],memo:"レノックス",
text:`晶	フィガロはこの辺りに来たことがあるんですか？
フィガロ	あるよ。
	暇になった時に、レノ、今何してるかなって思って、顔見に来たりしてたよね。
レノックス	え？
フィガロ	え？
レノックス	いえ……。いつも何かのついでだとか、用事の途中だとおっしゃっていたのに。
フィガロ	あはは。そうだったっけ。
晶	本当はどっちなんですか？
フィガロ	顔を見に来てたんだよ。
	でも、面と向かって伝えるのは、なんだかちょっと恥ずかしいじゃない？
レノックス	そういうものですかね。
晶	今、話しててバレちゃったのは良いんですか？
フィガロ	今のは、言ってみたらどういう顔するのかなって。そっちの方が気になったんだ。
	もっと驚くと思ったのにさ。甲斐のないやつだな。
レノックス	驚きましたよ。
晶	顔に出ないですね……。
`},
{id:12017,title:"南の国について",type:"personal",characters:["⑳"],memo:"レノックス",
text:`レノックス	色々な国を旅しましたが、南の国が一番落ち着きます。
	旅疲れしていたせいもあるかもしれませんが。穏やかで安らげる時間が流れている。
晶	元の気質とも相性が良かったように思えますよ。
	レノックスが南の国の魔法使いだって、知れば知るほどしっくりくる気がします。
レノックス	そう言っていただけると誇らしいです。
	毎日、こつこつと生活を積み重ねて、周りの人たちと家族ぐるみでいる暮らしは、炭鉱にいた頃にも少しだけ似ています。
晶	そうか、レノックスは、炭鉱のある村で生まれ育ったって言ってましたもんね。
レノックス	炭鉱の方が閉鎖的で男社会でしたけどね。
	朝目覚めた瞬間から、動物や人々に手を貸して、自分もまた、必要な分だけ誰かの手を借りる。
	そうして皆が毎日働くことで、生活が成り立ち、この国の歴史が積み重なっていく。
晶	自分が一員でいる意味を実感しながら生きていけそうですね……。
	そんな風に考えたことなかったですけど……。
レノックス	どこにいても、生きている限り誰かの何かになっていくはずです。
	この国では、魔法は能力や個性と同じで、魔法使いということも隠さずに生きていける。
	それも、長く続いた積み重ねのひとつです。
	南の国のような場所がこの世界にあって、そこで暮らせて、自分は幸せだと思います。
`},
{id:12018,title:"〈大いなる厄災〉について",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	賢者の魔法使いになる前の、〈大いなる厄災〉が来る夜はどう過ごしていたんですか？
レノックス	あまり変わりませんでした。季節や天気と同じような日常のひとつで、
	自分には無縁のように思えていました。
	なんだか途方も無い話ですし、世界の仕組みにも俺は興味がなくて。
	自分が関わるなんて思ってもいませんでしたね。
	南の国に来てから、賢者の魔法使いに初めて会いました。
	俺と何も変わらない普通の魔法使いだったので、なんて言えばいいのか、
	それでようやく、それまでよりも身近に感じたくらいでしょうか。
晶	なるほど……。
	俺は賢者の魔法使いの方が馴染み深いですけど、本当はレアな存在なんですもんね。
レノックス	賢者様からすると、そうなるんですね。はは、なんだか面白いですね。
晶	〈大いなる厄災〉が近付くと、調子を崩す人もいるそうですけど、
	レノックスは影響はないですか？
レノックス	俺は、あまりないですね。自分でそう思っているだけなのかもしれませんが。
	月が近付いて来ると、もう１年経つのかと、
	その年も見つけることができなかったと、ファウスト様を思い出していました。
	賢者の魔法使いの役目で再会できたのは、ある意味、運命だったのかもしれません。
`},
{id:12019,title:"過去の魔道具",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	あれ、岩陰に何か置いてありますよ。これは……？
レノックス	槌ですね。誰かが忘れていったのかもしれません。
	農具の一種で岩を砕くのに使うものです。
	懐かしいな。俺の最初の魔道具もこいつだったんですよ。
~~~~~~~~~	~~~~~~~~~
選択	生まれ故郷にいた頃ですか？
レノックス	はい。故郷の炭鉱での仕事に使っていました。もう少し大きなものでしたが。
	毎日使っているうちに、いつのまにか魔道具になっていたみたいで。
	初めは気づきませんでした。
	炭鉱では、俺以外の魔法使いに出会う機会がなかったものですから、
	魔法の知識は噂で知る程度だったんです。
晶	じゃあ、お師匠様みたいな人はいなかったんですか？
レノックス	仕事の師は父親と炭鉱の仲間です。
	体を鍛えたり戦うことについては、自分でも試行錯誤していました。
	魔法の仕組みを詳しく学んだのは、
	ファウスト様や、革命軍の皆から教わったのが初めてですね。
~~~~~~~~~	~~~~~~~~~
選択	ファウストの従者だった頃ですか？
レノックス	ええ。あの頃の仕事は、主にファウスト様の身の回りのお世話でしたが、
	小隊の指揮をしていたこともありました。
晶	指揮官だったんですか？魔法使いの隊を？
レノックス	そちらはいつもファウスト様が。
	俺が任されるのは、アレク様が指揮する人間の部隊のうちのひとつでした。
	魔法使いたちは、魔法を使える分、体を鍛えている者が少なかったので、
	戦場にいると目立ってしまって。
	戦火の中、狙われやすかったんです。人間たちに混ざって俺が魔法を使っていると、
	人間の部隊も警戒されるようになるんですよ。
	そうやって、相手を驚かすような作戦はアレク様がお好きでしたね。
~~~~~~~~~	~~~~~~~~~
レノックス	革命軍に混ざってからは、装飾したメイスを魔道具にしていました。
	戦闘用の槌矛で、こういう感じの……。
レノックスが呪文を唱えると、手にしていた槌がふわりと光った。
頭部に重い装飾のある、杖のような形に変わる。
晶	ファンタジーゲームに出てくる武器っぽい……！
	これをレノックスが持ってたんですか？格好いいですね。
レノックス	はは……、格好良くはありません。
少しだけばつが悪そうに、レノックスは魔法を解いてしまった。
元に戻った質素な農具に視線を落としている。
俺はその横顔を見ながら、
歴戦の戦士と呼ばれ、メイスを魔道具に戦う魔法使いの姿を少しだけ想像した。
レノックス	こいつが持ち主のところに戻れるよう、縁を繋ぐ魔法をかけておきましょう。
	《フォーセタオ・メユーヴァ》
`},
{id:12020,title:"スポットの人々",type:"personal",characters:["ミチル"],memo:"レノックス",
text:`ミチル	レイタ山脈に暮らしている人たちから見ると、
	ボクたちが住んでいた雲の街も、都会に思えるんですね。
	都会の魔法使いさんだなんて言われて、照れ臭いけど、ちょっと嬉しかったです。
晶	雲の街には魔法科学のエレベーターがある塔も建っていますもんね。
ミチル	雲の街でも、住んでる人たち同士はみんな家族って感じがしていましたけど……。
	この辺りで暮らす人たちは、その絆がもっと強いような気がしました。
晶	家族ぐるみで仕事をしていて、家族それぞれも協力し合っているからでしょうか？
ミチル	そうかもしれません。
	この辺りに暮らす人たちは、ほとんどが家族と同じ仕事をするんだそうです。
	だから、ボクと同じくらいの年の子も、１０年以上同じ職場で働いていて、
	みんなが職人さんみたいになるんですって。
	南の国の人たちは働き者だってフィガロ先生も言ってましたけど、
	レイタ山脈の人たちは特別働き者な気がします。
晶	子供の頃からずっと仕事をしてるのは、偉いですけど、やっぱり大変そうですね……。
ミチル	でも、生まれた時からお師匠様のような人に仕事を見てもらえるなら、
	安心だなって思いました。
	兄様も、父様と同じように先生になりましたし。
	この辺りの人たちの生き方と似ているところがあるかもしれません。
晶	ミチルは先生の仕事に興味はないんですか？
	リケに勉強を教えてあげたりしてますよね。
ミチル	将来のことはまだわからないですけど……。
	実は、ちょっとだけ考えたことがあるんです。
	このまま勉強を頑張れば、ボクも、父様や兄様みたいな先生になれるでしょうか？
`},
{id:12021,title:"スポットにいた魔法使い",type:"personal",characters:["ルチル"],memo:"レノックス",
text:`晶	この辺りは、レノックスの他にも、魔法使いの羊飼いがいたりするんでしょうか？
ルチル	レノさんが初めて羊飼いになった頃は何人か居たって聞いたことがありますよ。
	今はどうでしょう？
	レノさんが仕事を引き継いだ羊飼いさんも、
	フィガロ先生のお知り合いの魔法使いだって聞いたことがあるような……。
晶	そうなんですね。じゃあ、羊飼いって魔法使いに多い職業なんでしょうか？
ルチル	人間がやるには大変なお仕事だから、そうかもしれないです。
	魔法使いがいないと不便な土地では、特に頼りにされると思いますし。
晶	たしかに、魔法で空を飛んだり、火を起こしたりできるところは、
	山の暮らしに向いてるかもしれないですね。
ルチル	困っている人が多くて、
	魔法で手助けができる場所に行ってあげたくなる気持ちはわかります。
	私も、雲の街の学校が大きくなったら、
	学校のないところでも先生をやりたいなって、ぼんやり思ってたんです。
	魔法使いも、先生も、お医者様も、他の仕事も、南の国ではまだまだ足りないから、
	どんな人も誰かの力になれる場所があるんですよ。
晶	そうか……。俺のいた世界は、人も物もたくさんあったから、
	そういう感覚はちょっと新鮮かもしれません。
ルチル	そうなんですね。賢者様の世界と行き来ができたら、きっと便利ですよね……。
	賢者様の世界の人たちが、
	こっちに出稼ぎに来てくれたら、南の国ももっと良くなりそうですね！
`},
{id:12022,title:"危険な場所",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	あれ……。あの岩のところ、赤い印みたいなものが書いてある。なんだろう……？
レノックス	賢者様！そちらは……！
晶	うわあ……っ！？
レノックス	……っ！
岩に近づいた途端、強烈な突風に煽られた。
突き飛ばされるような衝撃によろめいて、ふわりと、体が宙に浮きかける。
レノックス	《フォーセタオ・メユーヴァ》！
呪文と同時にレノックスの手元が光って、大きなフックのついた長い杖が現れた。
杖を器用に操ると、俺の後ろにフックを引っ掛けてぐいっと引き寄せる。
レノックス	……、……あっ……。
~~~~~~~~~	~~~~~~~~~
選択	助かりました！
晶	ありがとうございます、レノックス！助かりました……！
レノックス	ご無事で良かったです。危ない場所には、ああして、皆で目印をつけているんですよ。
~~~~~~~~~	~~~~~~~~~
選択	吹き飛ばされるかと思いました……！
晶	ありがとうございます、レノックス！吹き飛ばされるかと思いました……！
レノックス	飛ばされます。岩の向こうは崖になっていて、崖からの強い風が吹くんですよ。
~~~~~~~~~	~~~~~~~~~
レノックス	目印を教えていなくてすみません。
	それに、とっさに杖で引っ張るなんて、失礼なことをしてしまって……。
晶	え？そんなの、死ぬところだったのに気にしないですよ！
	魔法用の杖なのかと思いましたけど……。
レノックス	これは、羊飼いの牧羊杖なんです。
	子羊も同じ場所で吹き飛ぶので、普段もこれで捕まえていて……。
晶	（羊用……。それで恐縮してたのか……）
レノックス	すみません……。
`},
{id:12023,title:"スポットの名物",type:"personal",characters:["ミチル"],memo:"レノックス",
text:`ミチル	賢者様！これ見てください！
晶	わあ、カラフルで綺麗な織物ですね。しっかりした生地だし、上着にしたら暖かそう。
ミチル	羊毛なんですって！この辺りは織物が伝統工芸なんだそうです。
	模様に特徴があるでしょう。この柄は山脈に咲いてる花を表してるそうですよ。
ミチル	こっちは羊、こっちは鳥の柄ですね。
	動物柄は、最近新しく作ってみたんだって、麓の町の職人さんが言ってました。
晶	可愛いですね。クッションやラグにしても良さそうです。
ミチル	そうですよね！クロエさんのお土産にしたら喜んでくれるでしょうか？
晶	いいですね、きっと喜ぶと思いますよ！
	西の魔法使いは個性的なものが好きだから、この柄も気に入ってくれそうです。
ミチル	良かった！この柄、父様が持っていた帽子の柄によく似てるんです。
	もしかしたら、昔、この辺りの土地の人たちと交流があったのかもしれません。
晶	そうだったんですね。
	じゃあ、クロエにお願いして、帽子を作ってもらうのはどうですか？
	冬に被ったら暖かそうですよ。
ミチル	本当だ……！クロエさんとはあまり話したことがないから緊張するけど、
	兄様のお友達だからきっと優しいですよね……。
	魔法舎に戻ったら、お土産を渡す時に聞いてみますね！
`},
{id:12024,title:"スポットでの発見",type:"personal",characters:["ファウスト"],memo:"レノックス",
text:`晶	あっ、見てくださいファウスト。あそこ、草の陰に猫がいますよ！
ファウスト	猫？こんな場所に猫なんているわけが……。
晶	でも、ほら、あの動き。ちょっと太ってるけど、猫ですよ！
	あっ、こっち見た！可愛い！
ファウスト	……いや、あれはヤマネコの仲間だ。太ってるんじゃなくて骨格が太いんだよ。
	まだ子供だが、牙があるだろう。
晶	え！？野生動物ってことですか？
ファウスト	そうだ。親がどこかにいて、気を立てているかもしれない。近づかない方がいい。
晶	で、でも、見渡す限りどこにも親っぽい動物はいないみたいですよ。
	もしかしてはぐれたのかも……。
ファウスト	…………。
	《サティルクナート・ムルクリード》
	わずかだけだが、幸運を授ける魔法をかけた。
	たとえ1匹でも、しばらくは生き延びられるだろう。
晶	しばらくって、そのあとは……？
ファウスト	後は、あの子の運次第だよ。
	本来、自然の生き物には魔法を使ったりしないものなんだ。
晶	でも……！……いえ、そうですよね……。
	まだ子供とはいえ、
	今日からずっとひとりで生きていく運命だったのかもしれないですし……。
ファウスト	…………。きみがそんなに心配するなら、もう少しだけ……。
晶	…………！ありがとうございます、ファウスト！
`},
{id:12025,title:"楽しい場所",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	あ、ここ、花が咲いてますよ。花びらが半分透き通ってる……。
	葉っぱも花みたいだな。
	綺麗ですね。初めて見た形です。なんていう名前の花か分かりますか？
	ルチルに見せたら喜ぶかな。
レノックス	これは……。
	リンドウの一種なんですが、赤い花をつけるのは珍しいです。俺も初めて見ました。
晶	そうなんですか？レノックスが長い間通ってた道なのに……。
	じゃあ、レアな花なんですね。
レノックス	ええ。花弁が半透明なのは、光を集めやすくするためです。
	高山に咲く花は、昼間に熱をためて、夜の寒さに備えるんですよ。
	普段は青い花が咲くんですが……。
	花をつけること自体も珍しい種類だから、本当に貴重です。
	それとも、今まで別の花だと思って見過ごしていたのか……。
晶	……レノックスって、植物にも詳しかったんですね。好きなんですか？
	花とかそういうの。
レノックス	…………。いや、特にそういうわけではないんですが……。
	喋りすぎましたか？
晶	いや！そういう意味じゃないですよ！
	たしかに、たくさん話してくれるのは、花と同じくレアだなって思いましたけど……。
レノックス	失礼しました……。珍しいものに出会うと、つい、気が高ぶってしまうというか。
晶	わかります！
	俺も地元で有名人を見かけたらテンションが上がっちゃうと思うんで……。
	（個性的な魔法使いが多い中で、レノックスのちょっと普通なところは、
	　親近感が湧いて安心するなあ……）
`},
{id:12026,title:"マナエリア",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、
	賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
レノックス	パワースポット、ですか……。
	もしかして、マナエリアのことではないでしょうか。
	マナエリアというのは、魔法使い固有の、気力を養う場所、というか……。
	心が安定するような場所のことです。
晶	たぶん、それです！レノックスにもマナエリアがありますか？
レノックス	はい。俺のマナエリアは、生まれた場所にあった高原の景色ですね。
	広大な風景に広がる緑を見渡していると、
	自然と落ち着いて、集中することができました。
	地面に生えた草の先に触れながら、遠くまで心を飛ばしていくようなイメージが、
	魔法を操る感覚と重なるんです。
	だからなんとなく、普段からも、広い場所の方が力を発揮できる気がしますね。
晶	なるほど……。
	レノックスに魔法をお願いするときは、周りに何もないところを探しますね。
レノックス	はは……。精進いたします。
`},
{id:12027,title:"アミュレット",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	マナエリアから長く離れる魔法使いは、
	マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	レノックスもアミュレットを持ってますか？
レノックス	ええ。俺のはこれですね。
レノックスは、棚の上に置いていた一輪挿しのガラス瓶を、俺に手渡して見せてくれた。
シンプルで小さなガラスの花瓶に、白い花弁と蕾をつけた小さな花が生けられている。
晶	これがレノックスのアミュレット……。
レノックス	俺のマナエリアは故郷の高原です。
	そこにはそういう小さい花がよく咲いていたので、似たような花を摘んで飾ってます。
晶	そうなんですね……。可愛い感じのもので、少し意外でした。
レノックス	……そんな風に考えたことはなかったな。
	なんでもよかったんですが、草や石よりは部屋が華やぐかと思って。
晶	すみません、変な意味じゃないんです！
	むしろ、ギャップがあって、レノックスに似合うと思いました！
レノックス	はは……。そうでしょうか。ありがとうございます、賢者様。
`},
{id:12028,title:"笑顔の練習",type:"personal",characters:["⑳"],memo:"レノックス",
text:`レノックス	…………。
晶	（レノックスがめちゃくちゃ怖い顔で鏡を睨んでいる……）
レノックス	はっ、賢者様。いつからいらっしゃったんですか。
晶	すみません、覗き見る気はなかったのですが、
	レノックスが険しい顔をしていたので……。
レノックス	最近、あまり愛想が良くないと言われることが多いので、
	笑顔の練習をしていたんです。
晶	あれ、笑顔だったんですね……。
	そういうときって、誰かの笑顔を参考にするとうまくできたりしませんか？
レノックス	誰かの……。
~~~~~~~~~	~~~~~~~~~
選択	例えばファウストとか
レノックス	ファウスト様の笑顔はしばらく見ていませんが。
	確か上品で、繊細な笑顔をよく浮かべていた気がしますね。
~~~~~~~~~	~~~~~~~~~
選択	例えばルチルとか
レノックス	ルチルの笑顔は、皆を安心させてくれます。優しげで、明るくて、素敵だと思います。
~~~~~~~~~	~~~~~~~~~
選択	例えばフィガロとか
レノックス	フィガロ先生のことは尊敬していますが、あそこまで愛想のいい笑顔は……。
	俺には少し難しそうだな。
~~~~~~~~~	~~~~~~~~~
晶	あ！でも、今の笑顔、すごく自然で良かったですよ。もう一度やってみてください！
レノックス	もう一度……。
	こうですか？
`},
{id:12029,title:"家族",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	今更なんですが、レノックスは南の国に、家族がいたりしないんですか？
レノックス	ああ……。俺も、魔法使いですから、見た目よりはずっと長く生きているんです。
	両親と上と下に兄弟がいましたが、家族はずいぶん昔に故郷で死に別れていて。
晶	そうだったんですね……。
レノックス	そんな顔をしないでください。昔の事ですから。
	南の国に残してきた人がいないか、心配してくださったんですね。
晶	長く生きてるって言ってましたけど、その後もずっとひとりのままですか？
レノックス	ええ。結婚は約束をすることになるし、俺はまだ、その余裕がないですね。
	ただ、ルチルやミチルのことを、子供の頃から見ているから、
	勝手ですが、家族のような気がしています。
	二人に両親がいないこともあって、頼られることが多いですし。
	フィガロ様も同じじゃないかな。
晶	たしかに、南の魔法使いたちは家族みたいな温かい結びつきを感じますね。
レノックス	賢者様にそう言ってもらえて嬉しいです。
	自分のことを考えるのは、
	あの子達が大人になって、ファウスト様が落ち着かれた後ですかね。
`},
{id:12030,title:"アプローチの方法",type:"personal",characters:["ファウスト","レノックス"],memo:"レノックス",
text:`晶	あれ、レノックス。ファウストの部屋の前でどうしたんですか？
レノックス	賢者様。その……、少し、お話しさせて頂けないかと思って伺ったのですが……。
晶	部屋に入れてもらえなかったんですね……。
レノックス	はい……。どういう風に声をかけたら、聞き入れていただけるんでしょうか。
~~~~~~~~~	~~~~~~~~~
選択	気さくな感じで
晶	ファウストは昔のことを隠したがるし、
	気軽でフレンドリーな感じの方が、いいんじゃないでしょうか？
レノックス	そんな風に接したことは今まで一度もないのですが……。
	賢者様がおっしゃるなら、試してみます。
	よう、ファウスト。天気もいいし、一緒に筋トレでもしようぜ。
~~~~~~~~~	~~~~~~~~~
選択	可愛い感じで
晶	ファウストは面倒見もいいですし、
	可愛く甘える感じの方が、いいんじゃないでしょうか？
レノックス	そんな風に接したことは今まで一度もないのですが……。
	賢者様がおっしゃるなら、試してみます。
	ファウスト様。俺と一緒に遊んでくれませんか。
~~~~~~~~~	~~~~~~~~~
選択	真面目な感じで
晶	ファウストは真面目で誠実な人ですし、
	こちらも真剣な感じの方のが、いいんじゃないでしょうか？
レノックス	やはり、そうですね。もう一度、誠意をお伝えできるように、試してみます。
	ファウスト様。これからの俺の人生について、ご相談があるのですが。

ファウスト	……なんだ、今のは……。おまえ、もしかして、魔法舎に馴染めていないのか？
レノックス	ファウスト様……。いえ。上手くやれています。
ファウスト	嘘をつくな。明らかに異様だっただろ。
レノックス	それは……。
晶	（二人とも、めちゃくちゃ真面目だな……）
`},
{id:12031,title:"居心地のいい場所",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	レノックスは長い間旅をしていたんですよね。
	それでも南の国に落ち着いたのは、やっぱり、フィガロがいたからなんですか？
レノックス	そうですね……。
	しばらくどこかに定住することを勧めてくださったのがフィガロ様でした。
	ファウスト様を探す旅の途中で、
	フィガロ様とは連絡を取ったり、会いに伺ったりすることが多かったんです。
	それで、ある時、
	知り合いの人間が困っているから、仕事を手伝って欲しいと言われました。
晶	仕事ですか？
レノックス	はい。羊飼いの仕事です。時間はあったので、旅を休むことにして、引き受けました。
	春に羊を預かって、羊の食料になる草のある場所を移動しながら、
	荒野や山を歩いて行くんです。
	ひとりで景色を眺めながら、何も考えずにいる時間が増えた時、少しだけ、
	……疲れていたのかもしれないなと思いました。
晶	レノックス……。
レノックス	秋になって町に戻った時、フィガロ様に、羊飼いの仕事を続けてみないかと聞かれて。	しばらく、やってみることにしたんです。
晶	それからは、南の国で暮らしているんですね。
レノックス	はい。南の土地とは気性が合うなと思っていましたが、
	住んでみると、とても居心地のいい場所でした。
	……あの時、フィガロ様は、
	なんとなく俺のことを察して仕事を勧めてくださった気がしていて。
	南の国の魔法使いになれたことで、ファウスト様にもお会いできましたし。
	先生には、今も昔も感謝しているんです。
`},
{id:12032,title:"親戚の子供？",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	レノックスは、ルチルやミチルとも長い付き合いなんですか？
レノックス	長いかどうかはわかりませんが、小さな頃から知っています。
	二人の母親とも顔見知りだったので、俺が子守をすることもありました。
	南の国の町は小さいですから、みな、知り合いのようなもので、
	そういうことは多いんですよ。
~~~~~~~~~	~~~~~~~~~
選択	ルチルの子供の時の思い出は？
レノックス	母親のチレッタが溺愛していたので、最初に会った頃は母親にべったりでしたね。
	母親似だったし、女の子みたいでしたよ。
	眼鏡を掛けていると怖がって泣くので、ルチルに近づくときは外すようにと、
	チレッタに言われていました。
	ルチルが慣れてからも、素顔で覚えられていたみたいで、
	よく魔法で眼鏡を飛ばされたりしましたね。
~~~~~~~~~	~~~~~~~~~
選択	ミチルの子供の時の思い出は？
レノックス	赤ん坊の頃のミチルも見たことがあります。小さくて……、赤ん坊らしい顔でした。
	物心ついた頃に会いに行くと、大柄なのを怖がられてよく泣かれましたね。
	俺よりも、
	気を引くために連れてきた羊の方が先にミチルと仲良くなったみたいでした。

晶	レノックスは優しいから、すぐに子供達と仲良くなれたのかと思ってました。
レノックス	大人でも子供でも、始めはよく怖がられますね。
	でも、俺の見た目に慣れてからは、二人ともよく懐いてくれたように思います。
	母親のチレッタが亡くなってからは、家族に手を貸す機会が多かったかもしれません。
	だから二人とは、親戚の子供のような距離感かな。
`},
{id:12033,title:"力自慢の演技",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	よいしょ！
	うーん、どうしよう。やっぱり届かないな……。
レノックス	賢者様、なぜ飛び跳ねているのですか。
晶	あっ、レノックス！依頼書の束が風に飛ばされてしまって。
	そこの木に引っかかってるんですけど……。
レノックス	なるほど。わかりました。
晶	うわっ！？
	（軽々と持ち上げられてしまった……！）
レノックス	これで届きますか。
晶	は、はい！取れました！
	レノックスは力持ちなんですね。あんな猫みたいに持ち上げられたのはじめてでした。
レノックス	はっ、すみません。考えるより先に手が出てしまって……。
晶	いえ、助かりました！猫の気持ちも分かったし。
	ありがとうございます、レノックス！
`},
{id:12034,title:"得意な魔法",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	レノックスは、得意な魔法ってありますか？レノックスにしか使えない魔法とか。
レノックス	俺の魔力は、あまり強い方ではありません。俺にしか、という魔法はないですね。
	得意というのも難しいですが。
	何かの力を強めるよりは、力を抑えたり、逃す魔法が得意です。
晶	抑えたり、逃がしたり、ですか。
レノックス	ええ。少し、お見せしましょうか。強く拳を握ってみてください。

document.getElementById("result").addEventListener("click", e => {
  if (!e.target.classList.contains("favorite-btn")) return;

  const storyDiv = e.target.closest(".story");
  const storyId = Number(storyDiv.dataset.id); // divに data-id をセットしておく

  if (favorites.has(storyId)) {
    favorites.delete(storyId);
    e.target.style.color = "#ccc";
  } else {
    favorites.add(storyId);
    e.target.style.color = "gold";
  }

  localStorage.setItem("favorites", JSON.stringify([...favorites]));
});
document.getElementById("result").addEventListener("click", e => {

    if (e.target.classList.contains("favorite-btn")) return;

    const card = e.target.closest(".story");
    if (!card) return;

    const id = Number(card.dataset.id);
    const story = stories.find(s => s.id === id);

    document.getElementById("modalTitle").textContent = story.title;
    document.getElementById("modalBody").innerHTML =
    story.text ? formatStory(story.text) : "本文がありません";
    document.getElementById("storyModal").style.display = "block";
});
