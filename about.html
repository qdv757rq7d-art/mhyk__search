	特に、時間を報せてくれる鳩時計は旅人に人気のお土産なんですよ。
晶	時計、友達の家で見たことがあります。あれって機械仕掛けだったんですね。
ヒースクリフ	後は家具なんかも人気です。
	ブランシェットの家具は３代使えるって有名なんです。
	家具に施す彫刻や彫金も発達して、優美な細やかさが特徴の模様は、ブランシェット彫りと呼ばれています。
	俺も好きで……。
	魔道具の懐中時計の模様や、シノの大鎌の模様は俺が彫刻したんです。
晶	すごいですね！
	俺も何か欲しくなってきました。街の家具屋さんを覗いてみようかな。
ヒースクリフ	ぜひご一緒させてください。気に入ったものがあったら、プレゼントしますよ。
晶	いいんですか？
ヒースクリフ	もちろん。
	賢者様のためなら城の職人が特注品を作るって言いそうですけど。
晶	（高級家具のオーダーメイド……。元の世界に帰りたくなくなりそうだな）
`},
{id:11224,title:"スポットでの発見",type:"personal",characters:["ネロ"],memo:"ヒースクリフ",
text:`晶	わあ……。庭に立派な石像がある。
	ブランシェット城には、からくりだけじゃなく、美術品や装飾品もたくさんありますね。
ネロ	ああ。城の中もすごかったな。絨毯、柱、食器、廊下の絵画。全てが一級品だった。
晶	そ、そうだったんですね！軽い気持ちで触らなくてよかった……。
	あれ？この石像、よく見ると目に宝石がはまっていますね。
ネロ	それは西の国でつくられたものだな。
	東の職人が作ったものと比べると、少し派手に見える。
	この国の職人は仕事が丁寧だからさ。細工が繊細なものが多いからわかりやすいんだ。
晶	じゃあ、このベンチは？金の装飾がとても綺麗ですけど……。
	きらきらしてるから、これも西の国かな？
ネロ	いや。それは、中央の国でつくられたものだな。
	高級な木材が使われてるし、フォルムがどっしりしてる。
	まあどれも献上品ってとこだろ。
	高く売れそうなものばかりで、つい目移りしちまうよな。
	どうした、賢者さん。不思議そうな顔をして。
晶	ずいぶんと美術品に詳しいんだなって思って。
	もしかして、どこかで勉強をしたことがあるんですか？見る機会が多くあったとか。
ネロ	はは……。ないない。そうだったらいいなって、適当に言ってるだけさ。
	ほら、これを売っぱらったら、きっと良い値になるだろうなあとか、それくらい普通に思うだろ？
晶	う、うーん。思うかな……？
`},
{id:11225,title:"楽しい場所",type:"personal",characters:["ネロ"],memo:"ヒースクリフ",
text:`晶	ブランシェット城の見学、楽しかったですね！
	ネロが印象に残った場所はありますか？
ネロ	やっぱ城の中の厨房かな。厨房自体も大きいし、貯蔵庫もしっかりしてる。
	かまどの設備なんかも一流だったよ。
	職人が多い土地だけあって、工夫が細かくってさ。
	包丁の研ぎひとつにかけても、主君に出す料理を作るプライドが感じられたね。
晶	なるほど。街のお店の厨房とは、やっぱり違うものですか？
ネロ	違う違う。道具の質がまず違う。いい職人がいい鉄や土で作ってる鍋ばかりだよ。
	シルバーも一流のものだし、これなんか細工が丁寧だろ。
晶	も、持ってきちゃったんですか？
ネロ	後でヒースに返しておくよ。かまどや鍋の作りが良いと熱の通りがいいんだ。
	シルバーがいいと舌触りがいいだろ。
	焼き場もでかくて良かったな！串に刺した肉を炙り焼きにしたら絶対美味い。
	炭もまた、いい炭使ってるんだよ。
	あれが魔法舎にもあったらいいなってちょっと思ったよ。
	他にもいろんな料理が作れそうだし。
晶	なるほど……。ネロもキッチンの設備は、こだわりたいタイプなんですね。
	魔法舎のキッチンも他に、本当はこれがあったらいいなあとか、もっとこうしたいなあとかあるんですか？
ネロ	もちろんなくはないけど。
	ただ、設備や調理器具にこだわり始めると際限がなくなるからさ。
	ほどほどくらいにしておかないとなって、思ってるよ。
	でも、１回くらいあそこで料理してえな……。
`},
{id:11226,title:"マナエリア",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
	「マナエリア」と呼ぶとも聞きました。ヒースクリフも知っていますか？
ヒースクリフ	はい。もともとは知らなかったんですけど、ファウスト先生に教えてもらいました。
	自然と心が安定して集中できる、自分自身の原風景のような場所のことだって。
晶	ファウストの授業、しっかりしてそうですね……。
	ヒースクリフにもマナエリアがありますか？
ヒースクリフ	俺のマナエリアは、少し恥ずかしいんですけど……、雨の日のベッドの中です。
	ブランシェットの屋敷にいた頃から、目が覚めて雨音が聞こえると、意識が冴えて、集中しやすくなるのを感じてました。
	雨水が土に浸透するみたいに、魔力で身体が潤っていくような……。
	そんな感覚になるんですよね。
晶	ゆっくりで静かなイメージは、ヒースクリフっぽい感じがします。
	雨の日は、無理に起こさないようにしますね。
ヒースクリフ	あはは……、大丈夫ですよ。
	賢者様がいらっしゃる頃にはもう、目を覚まして雨の音を聞いてると思います。
`},
{id:11227,title:"アミュレット",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	ヒースクリフもアミュレットを持ってますか？
ヒースクリフ	はい。ファウスト先生が教えてくれました。俺のアミュレットはサシェですね。
ヒースクリフは寝台の枕の下を探って、手のひらに収まる小さな布の袋を取り出すと、俺に手渡してくれた。
晶	これがサシェ……？中には何が入ってるんですか？
ヒースクリフ	乾燥させたハーブとか、木の切り屑とか、でしょうか。
	その時の気分で中身は変えてます。
	俺のマナエリアは寝台の中だから、落ち着く香りのものを置いて、リラックスできるようにするといいって。
晶	…………。本当だ、いい香りがしますね。
ヒースクリフ	マナエリアを意識して、アミュレットを置くようにしてから、魔法の調子がいい気がします。
	香りや環境でこんなに変わるなんてファウスト先生に教わるまで知りませんでした。
	サシェも、香りは体が覚えるから、遠征の時に持ち出せていいだろうって、先生に選んでもらったんですよ。
晶	魔法の勉強、楽しそうですね。
	魔法舎で暮らすことが、プラスになってるみたいで良かったです！
`},
{id:11228,title:"家事に奮闘中",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	（あ……。シャツが干してある）
ヒースクリフ	こんにちは、賢者様。
晶	こんにちは。もしかして、この服……。
~~~~~~~~~	~~~~~~~~~
選択	ヒースクリフの服ですか？
ヒースクリフ	そうなんです。これは俺の部屋着なんですが……。
~~~~~~~~~	~~~~~~~~~
選択	シノの服かな？
ヒースクリフ	あ……。実はこれ、俺の部屋着なんです。
	シノはもっと動きやすそうな服を着ることが多いですね。
~~~~~~~~~	~~~~~~~~~

ヒースクリフ	昨日、紅茶を飲んでいたら、シャツに零してしまって。
晶	なるほど。それで、洗濯をしていたんですね。ヒースクリフは家事が得意なんですか？
ヒースクリフ	正直、あまり……。
	実家にいたころはいつも召使いがやってくれていたので、まだまだできないことが多いんです。
晶	（そうか、ヒースクリフはブランシェットの領主の息子さんだった）
	ヒースクリフ	あれ、袖のところがシワになってる……！こういう時はどうしたらいいんだっけ……。
	すみません、ちょっとカナリアさんに聞いてきます！
晶	慣れない家事に挑戦する姿が、初々しくて応援したくなる……。
`},
{id:11229,title:"家族",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ヒースクリフの家ってお城なんですよね。みんな一緒に住んでいる感じなんですか？
ヒースクリフ	ええ。実家の城では、両親と、使用人で暮らしていました。魔法使いは俺だけです。
	城にはシノの部屋もあったんですけど、ひとりがいいって言って居付かなくて。
	森の小屋で寝泊まりしてましたね。
~~~~~~~~~	~~~~~~~~~
選択	どんなお父さんでしたか？
ヒースクリフ	父は、そうですね……。立派で、領民や王家からの信頼も厚い人です。
	強くて明るくて、前向きで公正で、優しくて、でも、叱るときは厳しくて……。
	俺は、いつも憧れていました。
晶	格好良いお父さんですね！
~~~~~~~~~	~~~~~~~~~
選択	どんなお母さんでしたか？
ヒースクリフ	母は、そうだな……。
	みんなに優しくて明るくて、料理上手で、少しだけ感激屋で、涙もろい人です。
	教養も深くて、学校を休みがちだったときは、母からも色々なことを教わっていました。
晶	素敵なお母さんですね！
~~~~~~~~~	~~~~~~~~~

ヒースクリフ	……はい。息子の立場からは少し言い難いんですけど、本当に、非の打ち所のない両親なんです。
	だから、自分が魔法使いに生まれたことが、二人の唯一の欠点に思えて辛かったです。
	ずっと、両親に申し訳なくて。
晶	ヒースクリフ……。
ヒースクリフ	こんな話をすると、きっと叱られてしまうんですけどね。
	今は、世界を守る使命を与えられて、二人を守る力を持って生まれてきたんだって、少しだけ思えるようになりました。
	まだ、シノみたいに強くはなれないけど、いつか、きっと、両親が誇れる自分になりたいんです。
`},
{id:11230,title:"いつまでも君と",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ヒースクリフはシノの主君で、シノの友達なんですよね。
	主人であり、幼馴染であると言うか……。
ヒースクリフ	まあ。そうなりますね。
晶	どちらの気持ちの方が強いんですか？
	俺から見ていると、主従を超えた絆があるように思えますけど。
ヒースクリフ	俺は……。シノの主人でいるよりは、シノのいい友達でいたいと思っています。
	同じ魔法使い同士だし、シノには何でも話せるし、子供の頃から、ずっと一緒にいたから。
	でも、シノは……。
晶	シノは……？
ヒースクリフ	シノは急に、俺を主君にしたがるんです。
	ずるいですよね。いつもは気軽に呼んだり、背中を叩いたりするのに。
	俺に名誉を手に入れさせたがるんです。
	きっと、俺のためを思ってくれているんだって、わかるんですけど……。
	そのたび、いきなり、線を引かれたみたいで戸惑います。
	隣に並ぶな、上に行けって、言われてるみたいで。
晶	そうなんですね……。シノには話したことがあるんですか？
ヒースクリフ	何度もあります。出世したり、目立つつもりはないよって。
	……だけど、ずっと、平行線のままだな。
	いつまでも、シノと仲良く出来るなら、俺はそれだけで何もいらないんですけどね。
`},
{id:11231,title:"頼りにしてる存在",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ヒースクリフはカインと仲がいいですよね。初めて会った時も、二人一緒でしたし。
ヒースクリフ	そうですね。
	カインは俺が魔法舎に来た時から親切で、気軽に接してくれていたので……。
晶	カイン、気さくですもんね。初めて会った時、どんな印象でしたか？
ヒースクリフ	えっと……。俺は東の国の首都から離れた、森に囲まれた静かな場所で育ったので。
	華やかな中央の国の首都に住んでいて、すらっとして、良く喋って、行動的なカインに、最初は少し気圧されていたんです。
晶	（地方の上品なお坊ちゃんが、都会の若者に圧倒される感じかな……？）
ヒースクリフ	でも、すぐに心根のあたたかさが伝わって、それから、ずっと頼りにしていました。
	一緒に賢者の魔法使いに選ばれた師匠に、『いつもカインの影に隠れてる』と、からかわれていたくらいです。
	俺は師匠が少し苦手だったので……。
	師匠からも庇ってもらったりして、カインには本当に助けられっぱなしだったな。
晶	なるほど。ヒースクリフにとって、頼れるお兄さんというところなんですね。
ヒースクリフ	はい。でも、そう言うとシノが怒るんです。シノは俺の兄のつもりでいるから。
	俺にとっては、俺が兄で、シノは可愛いみたいな感じなんですけど。
	賢者様もそう思いませんか？
`},
{id:11232,title:"焼き芋を囲んで",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	（いい匂い……。よし、そろそろ焼けたかな）
	焼き芋……。
	サツマイモっぽい味のだし、うまく再現できると良いな。
ヒースクリフ	賢者様。
	何をしていらっしゃ……わっ！落ち葉が燃えてる……！？
	下がってください！
	《レプセヴァイ――》！
晶	待って、ヒースクリフ……！これは火事じゃないんです！
ヒースクリフ	え？
晶	これは、焼き芋っていう、
	俺の世界でよく行われていた、外で芋を焼く習慣といいますか……。
ヒースクリフ	そ、そうなんですか……？
	すみません、遠目に火が見えたので、思わず慌ててしまって。恥ずかしいな……。
晶	こちらこそ、ご心配おかけしてすみません。
	でも、焚き火で焼くと美味しくなるんですよ。食べてみますか？
ヒースクリフ	賢者様がおっしゃるなら……。もぐ……。
	わ……。熱いけど、甘くて美味しいですね……。
~~~~~~~~~	~~~~~~~~~
選択	よかったです！
ヒースクリフ	ありがとうございます。
	外でおやつを食べるなんて少し行儀が悪いけど、なんだか楽しいですね。
~~~~~~~~~	~~~~~~~~~
選択	もう一つ食べますか？
ヒースクリフ	え……。いただいていいんですか？なら、シノにあげようかな。
	あいつ、こういうの好きそうです。
~~~~~~~~~	~~~~~~~~~

ヒースクリフ	面白い習慣ですね。今度、東の魔法使いで庭掃除するときに、やってみようかな……。
晶	（焼き芋、気に入ってくれたのかな……）
`},
{id:11233,title:"前賢者の嘘",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`ヒースクリフ	賢者様、洗い物をされてるんですね。俺も手伝います。
晶	ありがとうございます！ヒースのおかげで、いつも助かってます。
ヒースクリフ	いえ……。ハンサムですから。
晶	は……？
ヒースクリフ	あれ、何か変でしたか？
	前の賢者様が、『謙遜するときに使う言葉』だって教えてくださったんですけど……。
晶	ハンサムは「顔立ちが良い」って意味です。
	だから、自分に使う人はあまりいないかも……。
ヒースクリフ	ええ！
	今まで俺は、何回この言葉を使って来ただろう……。
	カインにも、シノにも言っちゃった気が……。
晶	でも、ヒースは確かにハンサムだから間違ってはないですよ！
	むしろ、正解です。
ヒースクリフ	あ、ありがとうございます……。
	けど、出来ればこの言葉の意味は他の皆には秘密にしてもらえませんか？
晶	わかりました。
	ヒースが自信を持ってこの言葉を言える日までは秘密にしておきましょう。
ヒースクリフ	あはは……。そんな日は来るんでしょうか。
`},
{id:11234,title:"意外な一面",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	…………。んん。ああ、居眠りしちゃってたみたいだ……。
	わ、ヒースクリフ！？
ヒースクリフ	起こしてしまってすみません。
	気持ち良さそうに寝ていたので、部屋までお連れしようと思ったんですが……。
晶	（だから、顔が近いのか……。！イケメンがよりイケメンに見える……。）
ヒースクリフ	けど、賢者様が起きてると思うと、ちょっとだけ照れ臭いですね……。
晶	いえ、お心遣いだけで嬉しいです。
	もしかして、この肩にかかっているブランケットもヒースクリフが？
ヒースクリフ	はい、すごくお疲れのようなので……。ご迷惑でしたか……？
晶	（部屋に運ぼうとしてくれたり、ヒースクリフは意外とたくましいところがあるよな）
`},
{id:11235,title:"得意な魔法",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	ヒースクリフは、得意な魔法ってありますか？
	ヒースクリフにしか使えない魔法とか。
ヒースクリフ	得意なこととは違うかもしれませんが、
	この前の授業で、ファウスト先生に感応力が高いって言ってもらいました。
晶	感応力……ですか？
ヒースクリフ	はい。魔力や自然の中にある不思議の力を察知する能力のことです。
	影響を受けやすくもあるのかな。
	実を言うと……、俺は長い間、自分のことを臆病だと思っていたんです。
	だけどそれは、危険や悪い気配を察知する力が強いからだって、ファウスト先生が言ってくれて。
	……嬉しかったです。
	魔法舎に来て、先生のもとで魔法が学べて、良かったなって、改めて思いました。
晶	ヒースクリフが臆病だなんて、俺も思わないですよ。
	今の話、ファウストに伝えたら喜ぶんじゃないかな。
ヒースクリフ	どうかな……。先生は、自分を良く言われるのを、嫌がるような気がするから……。
	でも、そうですね。
	もう少し、打ち解けられた時に、話してみたいと思います。
`},
{id:11236,title:"光の正体は？",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	（散歩に来たつもりが……。景色が綺麗で、ずいぶん奥まで来ちゃったな）
	月明かりはあるけど、少し怖い……。早く魔法舎に戻らないと。
	…………。あれ？
突然、俺の周りを小さな光の玉のようなものが飛び始めた。
晶	（もしかして蛍……？この世界にもいたんだ。安心する、優しい光だな）
ヒースクリフ	賢者様……！ここにいらっしゃったんですね。ご無事で良かったです。
晶	ヒースクリフ！ご心配おかけして、すみません。
	もしかして、これは……。
ヒースクリフ	ああ……。俺が出しました。
	賢者様を探すのに、少し明るい方が探しやすいかと思って。
	驚かせてしまいましたか？
晶	いえ！俺の世界で見た光景を思い出して、少し懐かしくなったんです。
ヒースクリフ	賢者様……。
	《レプセヴァイヴルプ・スノス》
晶	わあ、小さな光の玉がたくさん……！綺麗ですね。
ヒースクリフ	足元は、俺が照らします。さあ、魔法舎まで一緒に帰りましょう。
`},
{id:11237,title:"紋章",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	賢者の魔法使いには、目印になる賢者の紋章が身体に現れるって聞きました。
	ヒースクリフの紋章はどこにあるんですか？
ヒースクリフ	あ……。俺は腰の後ろに出てきました。
	左側の、この辺りです。
ヒースクリフはそう言って、ベルト越しに腰の後ろに触れて示した。
晶	他の人の紋章も見せてもらったんです。
	あんなのが急に現れたら、驚きませんでしたか？
ヒースクリフ	驚きましたね……。
	役目が終わるまでは消えないと聞いて、すごく戸惑いました。
	俺は魔法使いでいる自分にずっと後ろめたさがあったから……。
	こんな証拠みたいな紋章があったら人間のフリもできないって。
	しばらくは人前に出たくなかったな……。
晶	ヒースクリフ……。
ヒースクリフ	だけど魔法舎に来て他の魔法使いと会ううちに、
	自分の中の偏見がなくなっていくのを感じるんです。
	今も複雑な気持ちはありますけど、それでも、少しだけ、魔法使いに生まれたことに前向きになったかな。
	紋章があって良かったって、思うようになれたんですよ。
`},
{id:11238,title:"腹話術に挑戦",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`？？？	け、賢者様！朝食の時間だよー、……です！起きてください、賢者様……。
晶	んん……。誰か起こしに来てくれたんですね。ありがとうございま……。え！？
俺が目を覚ますと、ヒースクリフがクマのぬいぐるみを手に持って、恥ずかしそうに動かしていた。
クマのぬいぐるみ	起きてくれてよかった！それじゃあ、俺はこれで……。
晶	待ってください、ヒース！すごく色々なことが気になります……！
ヒースクリフ	やっぱり俺だってわかりますよね。
晶	わかりますよ！どうしてぬいぐるみで腹話術を？
ヒースクリフ	賢者様が最近ベッドからなかなか出られなくて
	困ってると言っていたので……。俺に何かできないかなって思ったんです。
	カインに相談したら賢者様を驚かせば、すぐ目がさめるんじゃないかって。
	でも、よく考えたらぬいぐるみで腹話術なんて、子供っぽ過ぎますよね。
晶	（顔が真っ赤だ。時間差で恥ずかしくなったんだろうな……。）
`},
{id:11239,title:"抑えきれない感謝",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`晶	こんばんは、ヒースクリフ。
	今日の任務で西の街に出かけたので、お土産を買って来たんですよ。
	そんなにすごいものなんですね！？ムルがカードに勝って手に入れてました。
	ぜひ分解して遊んでって言ってましたけど……。
ヒースクリフ	えっ。これ……技術者が何十年もかけて設計する、とても貴重なものなんですよ……。
	本当に俺が買っていいんですか？
	そ、そんな……。
晶	これ、卓上天文時計っていうそうで、ムルが蚤の市で見つけたんです。
ヒースが喜ぶだろうって。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
ヒースクリフ	考え事をしたり、本を読んだりでしょうか。
	あとは……、時計や機械をいじったり、細工を彫ったりもしています。
	もっと外に出て、体を鍛えたりした方がいいのかもしれないんですけど、俺は部屋で何かしてる方が性に合っていて……。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
ヒースクリフ	カインは、去年俺が魔法舎に来た時から面倒を見てくれてて。
	よく部屋で話したり、相談に乗ってもらったりしています。
	シノはノックせずに入ってくるんですよね。
	最近は、クロエやルチルやムルも、遊びに来てくれるかな。
	俺から声をかけるのはなんだか気が引けちゃうんですけど……。
	みんな気さくで、優しいですよね。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
ヒースクリフ	ちゃんと決めてはいないですけど、
	起きて顔を洗って、朝食を済ませて、ファウスト先生の授業を受けて……。
	自由な時間は、みんなと話したり、出かけたり、ひとりで部屋にいたりして、日付が変わる前に身支度して休む感じです。
~~~~~~~~~	~~~~~~~~~
ヒースクリフ	お土産、ありがとうございます……。
	でも、こんな貴重なものを分解するのは、ちょっと勇気がいりそうだな……。
晶	ヒースクリフの好きにしてください。置いておいても綺麗でかっこいいですよね。
ヒースクリフ	はい……。
	……ちょっと、今からムルのところにお礼に行ってきます！
	賢者様も、本当にありがとうございます。
晶	（珍しく興奮してる感じだ……。喜んで貰えたみたいでよかったな）
`},
{id:11240,title:"カインからの贈り物",type:"personal",characters:["カイン","ヒースクリフ"],memo:"ヒースクリフ",
text:`ヒースクリフ	良いね、この時計……。装飾もすごく凝ってる。
晶	ヒースクリフ。カインからプレゼントを貰ったんですか？
カイン	ああ。中央の都で骨董屋を見つけたんだ。ヒースなら気にいると思ってさ。
	ところで、秒針が止まったままみたいなんだが、これはどうやって動かすものなんだ？
晶	あ！よく見たら壊れてる……！
カイン	本当か？ちゃんと確かめなくて悪かったな。直してもらってから贈り直すよ。
ヒースクリフ	カイン……。
	直さなくても大丈夫だよ。この時計、このまま貰ってもいいかな？
カイン	え？壊れてるんだぞ？
ヒースクリフ	むしろ直すのが好きだから嬉しいんだ。
	この時計、すごく綺麗だから、きっと中の造りも美しくて繊細だと思うし。
	今夜中に動かせるよう、頑張ってみます。最高の贈り物をありがとう、カイン！
`},
{id:11241,title:"離れられない指先",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`ヒースクリフ	困ったな……。
晶	ヒースクリフ。どうしたんですか？
ヒースクリフ	賢者様……。実は、俺にくっついて離れてくれない子がいて……。
晶	あ、指先に小さい蝶が止まってる。
ヒースクリフ	さっき窓から入って来て、俺の指にとまったんです。
	けど、このあと訓練があるのでこのままって訳にもいかなくて……。
	ほら、早く飛んでおいき。外の方が楽しいよ。
小さい蝶	……………………。
ヒースクリフ	こんな感じで全然ダメなんですよね。
	この子、疲れているんでしょうか……。
晶	（ヒースの指が綺麗だから、気に入ってるんじゃないかな……）
`},
{id:11242,title:"優しい魔法",type:"personal",characters:["⑫"],memo:"ヒースクリフ",
text:`ヒースクリフ	賢者様はもしも魔法が使えたら、してみたいことってありますか？
晶	そうだな……。自分の体を小さくできたら、面白そうですね。
	猫の背中に乗って、散歩とか。それに、お菓子がビッグサイズで食べられますよね！
ヒースクリフ	なるほど……。それじゃあ。
	《レプセヴァイヴルプ・スノス》
晶	わっ！目の前のものが大きくなっていく……！
	あれ？俺が小さくなったのか……！ヒースクリフの魔法、すごいですね！
ヒースクリフ	すみません、賢者様……。その風景は、偽物なんです。
	俺にそこまでの魔力はありませんから。幻影を見せてるだけで……。
晶	幻影！？それはそれですごいですね！
ヒースクリフ	とんでもないです……！
	本当は猫も登場させたかったんですけど、上手くいかなくてすみません……。
晶	（気にするところ、そこなんだ……。）
`},
{id:11243,title:"レモンパイの譲り合い",type:"personal",characters:["東"],memo:"ヒースクリフ",
text:`晶	（シノとヒースが言い合ってる……。もしかして喧嘩？）
	ヒース、シノ！何があったんですか？
シノ	賢者か。ヒースが、おやつのレモンパイをオレに譲るっていうんだ。
ヒースクリフ	なんだよ。レモンパイはおまえの大好物じゃないか。素直に受け取ればいいだろう？
シノ	こんなに美味いもの、おまえが食べなくてどうするんだ。
ファウスト	きみたちは静かに食事もできないのか。
	……シノ、ヒースから受け取ってやれ。ヒースは代わりに僕のパイを食べるといい。
ヒースクリフ	そ、そんな！ファウスト先生からいただくなんて、できませんよ。
ネロ	わかった、わかった。
	すぐにお代わりを焼くから、みんなそれぞれ自分のパイを食べてくれ。
晶	（素直じゃないけど、仲間思いな東の国の魔法使いらしいやり取りだ……。）
`},
//ネロ
{id:11301,title:"スポットの印象（１）",type:"personal",characters:["ファウスト"],memo:"ネロ",
text:`晶	雨の街っていうから、もっとどんよりしてるのかと思いましたが、この街の雨はなんとなく爽やかですね。
ファウスト	山脈からの雨は澄んでいるし、雨雲が薄くてそんなに暗くはならない。
	そのせいじゃないか。
晶	この街の、ファウストの印象はどうですか？
	ネロは暮らしやすいって言ってましたけど。
ファウスト	雨はともかく、何もかも人間のための街という感じで、僕は気にくわないな。
	ルールがあれば便利で快適かもしれないが、優しさが義務になるのはいびつだ。
晶	優しさが義務になる、ですか？
ファウスト	この国の法典は、基本的に、皆が不愉快なものに出会わないように作られる。
	快適に暮らしやすいように、他人に迷惑をかけられないように、誰かに迷惑をかけないように。
	他人を慮る手間を規則に委ねているせいで、他人を慮ることが規則になっている。
	そんなものを、思いやりとは思えない。
	親切さえ自分の心に従えないなら、誰とも関わらず暮らせばいいんだ。
	人と関わることが煩わしいのに、誰かと寄り添っていたいだなんて。
	東の国の人間らしい、中途半端な街だと思うよ。
晶	（人嫌いで引きこもってたファウストが言うと、説得力あるな……）
`},
{id:11302,title:"スポットの印象（２）",type:"personal",characters:["ヒースクリフ"],memo:"ネロ",
text:`晶	ヒースクリフは、何度か雨の街に来たことがあるんでしたよね。
ヒースクリフ	はい。領主の父を一緒に、国王様へのご挨拶に来たり、大きな裁判や会議に呼ばれることがあって。
	俺は魔法使いだから、そういう用事で街に入る時は、審査も厳しかったですね。
	……だから個人的に、雨の街は少しだけ、魔法使いに冷たい印象があります。
	法典のせいだとはわかってるんですけど。
晶	ヒースクリフの地元は、規則が緩いんですか？
ヒースクリフ	もちろん同じ法典ですけど、両親が大らかだから、取り締まりや処罰は緩い方だと思います。
	ブランシェッド領では森や広場に集まって、話をする人たちや、遊んでる子供たちを、見るのが好きでしたけど……。
	この街では、そういう景色を一切見かけないないから、少し怖いかな……。
`},
{id:11303,title:"スポットの印象（３）",type:"personal",characters:["リケ"],memo:"ネロ",
text:`晶	雨の街に来てみて、どうですか？リケ。
リケ	整然として、奥ゆかしい、いい街です。どこも清潔で綺麗ですし。
	ただ、街の人と目が合っても、誰も挨拶もしてくれなくて驚きました。
	なのに、道に迷っていたら親切に教えてくれて。不思議な人たちの街ですね。
晶	東の国には色々法律があって、知らない人に挨拶するのは、違反になってしまうみたいですね……。
リケ	国ごとにこんなにルールがちがうなんてことも、初めて知ってびっくりしました。
	僕の暮らしていた教団の中と、中央の国でも規則は違っていましたし。
	どれが正しいのか決めてほしいです。
晶	何が正しいのかって、難しい問題ですね。
	住んでる人たちの気質や、時代にもよるものだと思いますし。
	自分に合う場所を探して暮らすのが、一番良いと思いますよ。
リケ	自分に合う場所……。僕に合う場所もあるんでしょうか？
晶	それは、きっとあると思います。
リケ	賢者様がそうおっしゃるなら、決めるのは保留にして、いろいろな国を見てみますね。
	雨の街は、優しいけれど、少し他人行儀で、ネロみたいな街だなって思います。
	僕には、合ってないわけじゃないと思います。
`},
{id:11304,title:"ブレイクタイム（１）",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	東の国はどこに行っても自然が豊かですね。
ネロ	田舎の風景って言えばそうなのかもしれねえけどな。
	公共の施設とか、貴族の屋敷とかは、土地の何割庭にしろだの、木を植えろだのって細かい法律があるんだよ。
晶	そんなことまでルールがあるんですか？
ネロ	面倒臭いが、おかげで景観はどこの国より綺麗だろ。
晶	たしかに癒されます……。ネロのお店も庭があったんですか？
ネロ	あったよ。小さい庭だけど。少しだけの野菜と果実とハーブを作ってた。
~~~~~~~~~	~~~~~~~~~
選択	自家製の野菜、いいですね！
ネロ	毎年作ってると、特別うまくいく年があったりして、意外とハマってさ。
晶	コツコツした作業、得意そうですよね。ネロの手作り野菜も食べてみたいです！
	魔法舎ではやらないんですか？
~~~~~~~~~	~~~~~~~~~
選択	果物はお店はお店に出してたんですか？
ネロ	まあまあな。形はあんまり綺麗にならなかったから、野苺なんかをジャムにしてデザートに使ったりさ。
晶	ネロの野苺ジャム、すごく美味しそうですね！今度ぜひ食べてみたいです！
	魔法舎では作らないんですか？
~~~~~~~~~	~~~~~~~~~

ネロ	あはは。魔法舎の中庭に、勝手に植えちまっていいのかな。
	みんな勝手に使ってるから、いいか？
	まあ、いつか実現できたらご馳走するよ。
晶	やった！楽しみにしていますね！
`},
{id:11305,title:"ブレイクタイム（２）",type:"personal",characters:["ブラッドリー"],memo:"ネロ",
text:`ブラッドリー	はあ……。
	見かける奴らはみんなだんまりだし、ずっと雨だし、辛気臭せえ街だな……。
	牢屋の中より辛気臭えよ。
晶	ブラッドリーは、投獄されていたことがあるんでしたね……。
	人間の牢屋とまた違うんですか？
ブラッドリー	さあ。似たようなもんだと思うが、
	看守が来たら足音が聞こえなくなるまで罵ったり出来た分、ここよりはマシだったぜ。
	俯いて歩く女だの、生気も感じねえ親父だのに、ヤジ飛ばしてもって感じだしなあ……。
	あいつはこんな街が気に入って、住み着いてたのか……。
	あいつもまあまあ辛気臭えところもあるしな……。
晶	ブラッドリー……。
ブラッドリー	おい、誰だとか言ってねえし、今のは悪口ってわけじゃねえからな。告げ口すんなよ。
	はあ……。ちょっと気分味わうために黙って歩いてみるか。着いてこいよ、賢者。
晶	あっ、待ってください！傘ささないと濡れますよ……！
`},
{id:11306,title:"スポットの思い出（１）",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	この街は標識が多いですね……。あの看板はどういう意味なんですか？
ネロ	ああ……、悪いけど教えてやれないんだ。役所に行ってもらわないと。
晶	…………？ネロにもわからないってことですか？
ネロ	いや当然知ってるよ。
でも、一般人が旅行に標識の意味を教えるのは法典で禁止されてるんだ。
	説明して間違ってたらトラブルになるだろ。
	だから、聞かれたら役所を案内しなきゃいけないルールなんだよ。
晶	うーん……。この街の役所、すごく並んでましたよね。
	でも、知らずに法典違反になるのは怖いし……。
ネロ	あはは。標識の意味を間違えた時の、良い言い訳を教えてやるよ。
	「自分が見た時とは表示が変わってる。きっと、魔法使いの仕業に違いない」
晶	そんな……！全部魔法使いに罪を着せられるんですか？
ネロ	こう言えば、たいてい見逃してもらえるし、犯人探しをするほどでもない悪戯だ。
	誰も下らないことで捕まらなくて合理的だろ。
晶	なんか、納得できません……。
ネロ	小さいトラブルは全部それで片付く。
	魔法使いだってバレなきゃ、快適な街なんだけどなあ……。
`},
{id:11307,title:"スポットの思い出（２）",type:"personal",characters:["⑬"],memo:"ネロ",
text:`ネロ	雨の街は、住人たちとある程度仲良くなりゃ、人情のあるいい街なんだよな。
	お互い軽はずみに通報したりしないって信頼関係が築ければ、みんな親切で親身に接してくれるしさ。
	移転したいって時に相談に乗ってくれた客や、店の開店記念日を聞かれて答えたらわざわざ贈り物をくれた客もいたんだ。
晶	お店の常連さんですか？そういう距離感はいいですね。
ネロ	だろ？嘘言わなきゃ良かったなって思ったよ。気のいい紳士だったのに。
晶	嘘？お店を開いた日を嘘ついたんですか？
ネロ	この日だったよねえ、みたいな、会話の流れでふわっとそんな話になって、わざわざ訂正するのもなんだしさ……。
	そうでしたっけね、って、曖昧に返事したんだよな。
	後から日付が間違ってたってバレたんだけど、その話はお互いスル―してうまくやってたよ。
	追求されたりしないし、いい人たちだろ？
晶	（ネロもお客さんも、会話が不得手そうなエピソードだ……）
`},
{id:11308,title:"スポットの思い出（３）",type:"personal",characters:["ファウスト"],memo:"ネロ",
text:`ファウスト	雨の街には、法典を手に入れるために来たことがある。
	東の国は当時からルールが多かったからな。
	何百年か前だが、その時すでに法典が３０巻くらいあって、一応、僕も覚えたが……。
晶	３０巻の法典全部ですか……！？
ファウスト	だいたいは、だ。
	覚えてる間にも追加だの改訂だの何度もあって、全く追いつかなかった。
	今はもう１００巻を超えていて、誰も正確に把握していないだろう。
晶	ファウストって、律儀ですよね……。
~~~~~~~~~	~~~~~~~~~
選択	本当は全部覚えていそう。
ファウスト	そんなわけないだろう。この国で暮らすにはコツがある。
	他人と必要以上に関わらないことだ。
	そうすれば、法律のほとんど守れるし、取り締まり自体はそこまで厳しくない。
	住人たちはトラブルを避けたがるから、よほどの迷惑を被らなければ、わざわざ通報するような者は少ないしな。
晶	まるでお互い深い関係にならないように、暮らしているような国ですね……。
	少し寂しい気もします。
ファウスト	その方が暮らしやすい者もいる。もちろん、僕もそのひとりだ。
~~~~~~~~~	~~~~~~~~~
選択	記念日を細かく覚えてくれそう。
ファウスト	記念日ってなんだ。国や街が出来た日だとか、ムルの研究が発表された日だとかか。
晶	そうじゃなくて、恋人の誕生日とか、告白した日とか、初めてデートした日とか、結婚した日とかです。
ファウスト	そんな相手、いたことがないから知らないが……。
	相手が恋人なら、特別な日なんだろう。誰でも覚えているものじゃないのか？
晶	（やっぱり律儀だな……！）
`},
{id:11309,title:"ネロへの印象（１）",type:"personal",characters:["ファウスト"],memo:"ネロ",
text:`晶	ファウストから見て、ネロはどんな印象ですか？
ファウスト	ネロか……。
	僕もあいつも東の魔法使いらしい、というのか。
	お互いがお互いに介入しないから、魔法舎で一緒にいても過ごしやすくはある。
晶	たしかにネロって、立ち入ってくる感じが全然ないですね。
	だけど、気が細やかで……。
ファウスト	そうだな。なんだかんだ、親切に子供たちの面倒も見てる。
	知識も豊富で、指南も押し付けがましくない。
	言動や魔力の感じが、僕より年上な気がするし、ネロが先生役で構わないと思うが。
晶	でも、ファウストが先生で上手くいっていますし、ネロにその意思があるかと言うと、ちょっと……。
ファウスト	…………。
	僕が先に賢者の魔法使いになっただけだから、いずれ役割を交代してもいいだろうと、尋ねたことがある。
晶	ネロはなんて言ってましたか？
ファウスト	「俺は責任感がないから無理だ」って。
晶	なるほど……。
ファウスト	別に、僕にもないけどな。
`},
{id:11310,title:"ネロへの印象（２）",type:"personal",characters:["シノ"],memo:"ネロ",
text:`晶	シノはネロのこと、どう思ってるんですか？
シノ	飯が美味い。
	あと、おまえの分はもうないって言わない。
晶	食事に気を配ってくれるところが好きなんですね。
シノ	飯は大事だろ。
	おまえの分はもうないって、よそではよく言われたけどネロは言わないし、
	オレも最近「おかわり」って言わなくなってきた。
	なんでかと思ったら、オレの皿の食事の量が少しずつ増えてたんだ。
	オレの飯、多く入れてるのか？って聞いたら、
	「おまえが毎回足りないって言うから、合わせて調節してるよ」って言われて……。
	使える男だと思った。
晶	細やかですね、ネロ……。料理人の信念も感じます。
シノ	そうだな。
	信用してる。
`},
{id:11311,title:"ネロへの印象（３）",type:"personal",characters:["ヒースクリフ"],memo:"ネロ",
text:`晶	ヒースクリフは、シノやファウストとは元々面識があるから、ネロだけ、知り合ってまだ間もない感じですね。
ヒースクリフ	そうですね……。でも、だいぶ馴染んできたと思います。
	最初はちょっと怖かったですけど……。
晶	怖かった？ネロがですか？
ヒースクリフ	はい……。なんていうか俺、
	自分自身、話しかけられるのが苦手なくせに、話しかけられたくない空気の人も苦手というか……。
晶	ああ……、それはなんとなく俺もわかります。迷惑なのかな、って思っちゃって。
ヒースクリフ	そうなんです。
	だけどネロって、俺以上に気を遣う人なんだって最近はだんだんわかってきました。
	叙任式の後くらいにネロから言われたんです。
	お互いに気を遣うたちなのがわかるから、必要以上に気にするのはやめようって。
	おまえは俺に迷惑をかけるタイプじゃないし、俺もおまえに迷惑はかけないと思うって。
	気楽にやりたいからって、頼むよって。
晶	……優しいですね、ネロ……。
ヒースクリフ	そうなんですよね。
	俺があれこれ心配する前に言ってくれて、大人っぽいなって思いました。
	だから今は、結構うまくやれてると思います。たぶん……、俺にしては、ですけど。
`},
{id:11312,title:"ネロへの印象（４）",type:"personal",characters:["ブラッドリー"],memo:"ネロ",
text:`晶	ネロって秘密主義のところがありますよね。
	ブラッドリーはネロのこと、どういう風に思ってるんですか？
ブラッドリー	お？なんで俺に聞いた？
	俺とあいつに何か縁があるように感じるのか？
	やっぱりなんかこう、醸し出てたか？絆的なものが。
晶	えっと……。
ブラッドリー	……やべえな、言いすぎたわ。怒られる。
	まあ、あいつとはここにきて会ったばっかりで、お互いよく知らねえんだけどな。
~~~~~~~~~	~~~~~~~~~
選択	そういうことになってるんですか？
ブラッドリー	馬鹿野郎。てめえ。
	バレたらおっかねえんだから止せよ。よく知らねえけどよ。あいつに言うなよ。
~~~~~~~~~	~~~~~~~~~
選択	内緒にされるのは嫌じゃないんですか？
ブラッドリー	やだよ。やだけどまあ、しょうがねえだろ。俺は囚人であいつはカタギだし。
	ガキでもねえし。お友達っつったじゃん！て仲でもねえ。
	だけど、モヤっとはしてるぜ。
~~~~~~~~~	~~~~~~~~~
選択	友達とかには見えませんでしたよ。
ブラッドリー	……ふーん。そうかよ。
	でもよ、案外ああいうタイプは俺みたいな奴が好きだぜ。
	案外、俺みたいな奴とウマが合うし、
	案外、俺みたいな奴の言うこと聞いてるのが楽だなって思ったりすんだよ。
~~~~~~~~~	~~~~~~~~~

晶	……じゃあ、ひと言で言うと、ネロはどんな人に見えますか？
ブラッドリー	あいつをひと言で言うのは難しいだろ……。でもまあ、居心地のいいやつ、だろうな。
	あいつに好かれると、不自由も過不足もねえ、
	自分にとって最高に都合のいい環境で暮らせる。あいつはその環境を黙って作る。
	だからそれが段々当たり前になってって、段々ありがたみがなくなってく。
	なくなってくるといなくなる。あいつと長く付き合いてえなら、気をつけることだな。
`},
{id:11313,title:"ネロへの印象（５）",type:"personal",characters:["リケ"],memo:"ネロ",
text:`晶	リケから見て、ネロはどういう印象ですか？
リケ	ネロですか？そうですね……。
	最初はやる気がないし、不真面目そうで、
	教団にいた頃に聞いていた、不徳の者とはこういう人かと思っていました。
晶	なるほど……。今はどうですか？
リケ	あまりやる気がないという印象は変わりませんがその中にも、
	なにかネロなりの優しさや、こだわりのようなものを感じるようになりました。
	私は彼を評価してますし、好意を持っています。
	でも、なんていうか、ネロはネロ自身のことを、あまり好きじゃなさそうだとも思います。
	遠慮なのかもしれませんが、深い関係を避けているみたいで……。
	内気な感じでもないのに、少し変わった人ですね。
晶	……ネロのそういうところ、やっぱり気になりますか？
リケ	直してほしいというほど、嫌なわけではありませんけど……。
	私は使徒として、人々に頼られ、求められてきました。
	だからか遠巻きな態度には戸惑うことがあります。
	今はネロに教わることが多いですけど、いつかは私がネロを導けると思うから。
	もっと私を必要として、私に介入してほしいです。
晶	……リケのまっすぐな気持ちと自信は、いつかネロの心を動かすかもしれないですね。
リケ	はい。まだ知り合ったばかりですから、ネロのこと、もっと色々知りたいんです。
`},
{id:11314,title:"スポットゆかりの話（１）",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	雨の街って名前、何か由来があるんでしょうか。やっぱり、雨が多いんですか？
ネロ	由来はあるよ。あんまりいい話じゃないけど。
	昔、この辺一帯が酷い水不足にあった時、国王からの依頼で、幾人かの魔法使いが魔力を合わせて雨を呼んだんだ。
	当時も魔法使いは毛嫌いされてたから、苦肉の策だったけどな。
	魔術は成功して、街は元に戻った。
晶	……その話が本当なら、この街はもっと、魔法使いに好意的になりそうですが……。
ネロ	その通り。
	国王から謝礼金が出たことで、水不足は魔法使いの自作自演じゃないかって疑いがかかった。
	裁判が行われて、雨を呼び寄せた魔法使いたちは多数決で街から追放された。
	人間たちも、次は魔法の力に頼らないように、水を確保する水路を整えた。
	雨から水を大切にする教訓を得た街、それがこの雨の街だ。
晶	……なんだか納得できません。魔法使いはそれでいいんですか？
	追放だなんて、酷すぎます。
ネロ	まあ、腹は立つけどさ。
	水路ができたのは俺たち魔法使いも助かったし、顔は魔法で変えられる。
	戻って来ようと思えば戻れる処罰だろ。
	そんなことを何度もやり過ごしながら住み着いてるような魔法使いが多い土地なんだ。
	この東の国はな。
`},
{id:11315,title:"スポットゆかりの話（２）",type:"personal",characters:["⑬"],memo:"ネロ",
text:`ネロ	ああ、賢者さん。そっちの道はダメだ。遠回りだが、迂回していこう。
晶	え？でも、来た時はこの道を通りましたけど……。
ネロ	夜はこの通りを歩いちゃいけない決まりなんだ。物騒だからさ。
晶	そうなんですか……。
	法律を守る人が多い街なのに、治安が悪い場所もやっぱりあるんですね。
ネロ	治安は悪いってほどでもないんだけどな。
	ここは特にルールがあるから誰も通らないし。
晶	……？決まりを守る人たちが住んでいる地域ってことですか……？
ネロ	そうさ。
	でも、歩いちゃいけない道を通るやつ、
	法典を守れないやつは、犯罪者に違いないって思われて通報される。
	元々は、客引きとかを追っ払うためのルールだったんだけどな。
	決まりだけが残ってる通りなんだよ。そういうわけだから、あっちの道を使う。
	ただあっちは追い払われた客引きがいるから、ちゃんとガラが悪い。
	気をつけろよ。あんまり俺と離れて歩かないようにな。
晶	（なんだか、すごくややこしい街だな……）
`},
{id:11316,title:"東の国について",type:"personal",characters:["⑬"],memo:"ネロ",
text:`ネロ	ルールは多いけど、俺みたいなやつには、東の国は住みやすいよ。
	もちろん完璧じゃないし、面倒だったり嫌なところもあるけど、他の国に比べたらさ。
	必要以上に他人に興味を持たないし、やらなきゃなんないことは真面目にやってるし、根っこはみんな善良だし。
	まあ、みんな人付き合いが下手だから、他人と付き合う時にルールがあると、ミスしないで済むから安心するんだろうな。
晶	ネロもそうなんですか？すごく話しやすくて、人付き合いが下手だなんて、あまり感じたことがないですが……。
ネロ	あはは、そりゃあ光栄だな。
	賢者さんくらいなら気にならないけどさ、あんまり周りからグイグイ来られるのは、ちょっと苦手かもな。
晶	そうですか……。気をつけますね。
ネロ	あんたは大丈夫だって！
	……でも、そうだな、例えばあんたみたいなやつに会った時……。
	珍しく興味が湧いて話しかけたくなっても、この国じゃ法律違反になることがあるからできない。
	黙って見送るだけだ。
	そこはちょっと、残念かもな。
`},
{id:11317,title:"〈大いなる厄災〉について",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	〈大いなる厄災〉が来る夜、雨の街の人たちはどんな様子ですか？
ネロ	他所に比べても、この街ではみんな怯えてる感じだな。
	だからってパニックを起こすやつもいないけど。
	不安を抱えながらも、備えをしっかりして家にこもってる感じで、厄災が来る数日前から誰も出歩かなくなる。
	正直、商売あがったりだよ。仕方ないけどな。
	この辺じゃ、厄災を見てると気が変になるって迷信があるくらい恐れられてるんだ。
晶	本当に迷信なんですか？
	〈大いなる厄災〉が近付きすぎた影響で、世界に異変が起こるほどなのに。
ネロ	確かに、厄災が来る時期は強い魔力を感じるよ。
	動物も植物も空気も、なんだか騒がしくなる。人間も多少感じるやつがいるのかもな。
晶	ネロは？調子が悪くなったりしないですか？
ネロ	俺もまあ……、うっすら、興奮しそうになるのかな。
	怒りっぽくなるような、感情的になるような、そわそわ落ち着かない感じだよ。
	個人差はあるけど、魔法使いはみんなそんな感じだ。
	だからあんたも、厄災が来る時は気をつけろよ。
	俺たちにな。
`},
{id:11318,title:"ネロのささやかな夢",type:"personal",characters:["⑬"],memo:"ネロ",
text:`ネロ	雨の街は住み心地が良くても、魔法使いは歓迎されない土地だから、長く留まれないのは難点かもな。
	年を取らないって分かると、近所になんとなく話が広がって、だんだん客が寄り付かなくなるんだよ。
晶	たしかに、魔法使いだってことを隠さなきゃいけない時に、長命なことは不利になるかもしれませんね。
ネロ	姿を変えたり、出会った人間の記憶を消したりするやつもいるみたいだけどな。
	それには魔力も気力も使うから、俺は店の場所を何十年に一回、変えることにしてる。
晶	大変そうですね……。
ネロ	引っ越し自体は面倒なだけだからいいけど、
	移動すると分かってると店の改装なんかは無理できないんだよな。
	繁盛しても、あんまり大きい店にするわけにもいかないしさ。
	シャイロックは気にせず定住してるから、店の内装、好きなだけこだわれて、羨ましいなって思う時があるよ。
晶	料理と同じくらいこだわった内装の、ネロのお店もいつか行ってみたいです。
ネロ	嬉しいこと言ってくれるなあ、賢者さん。
	魔法舎の食堂、誰かに頼んで、魔法でガラッと変えちまおうかな？
`},
{id:11319,title:"スポットの人々",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	ルールが多い街ですけど……、良かったなって所はありますか？
ネロ	いやいや、好みは分かれるかもしれないが、いい所もたくさんあるんだせ。
	例えば、俺みたいな素性の知れない男も、詮索されたりしないしさ。
	西の国に行った時は地獄だったぜ。
	目が合えば話しかけられるし、下向いてても話しかけられるし。
	東の国は、みんなシャイだけど、ちょうどいい距離感で接しやすいよ。
	根が真面目なやつが多いしな。
晶	それは、わかります。東の国の人たちって……。
~~~~~~~~~	~~~~~~~~~
選択	律儀で誠実だと思う。
ネロ	はは。まあ、そうなんだよな。俺以外はさ。
	~~~~~~~~~	~~~~~~~~~
選択	親切で優しいと思う。
ネロ	そうそう。そこにつけ込むやつもそんなにいないし、いい国なんだよ。
~~~~~~~~~	~~~~~~~~~

ネロ	それに、お願いしますっつって頼ると、ほとんどのやつが手を貸してくれるぜ。
	店を開きたいとか、娘にピアノを買ってやりたいとか、私的なことでもけっこう寄付が集まるんだ。
晶	そうなんですね！それは、なんとなく以外かもしれません。
	他者に興味が薄い印象があって……。
ネロ	あはは。そのイメージはあってると思うよ。
	でも、普段関わりが薄い分、みんな根っこでは人助けしたいのかもな。
`},
{id:11320,title:"スポットにいた魔法使い",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	この街で、他の魔法使いに会ったことはありますか？
	わかりやすい人はあまりいない感じですけど……。
ネロ	みんなトラブルを避けてるから、魔法使い同士でも名乗り合ったりすることはほとんどないだろうな。
	だけど、居ることは居るよ。俺みたいに商売してるやつもたまに。
晶	どんな職業なんですか？
ネロ	例えば、法律家。
	すごく記憶力がいいことになってるけど、魔法使いっぽいやつが何人かいるんだよな。
晶	魔法で記憶できるんですか？便利ですね……！
ネロ	いや、普通に覚えるんじゃないか？俺たち、時間だけはいくらでもあるからさ。
	役所に勤めてるようなのじゃなくて、街の案内を兼ねた、法律に詳しいやつらがいる。
	旅行者が雇って、一緒に行動するんだよ。
晶	なるほど。知らないうちに法律違反をしないようにですね。
ネロ	そうそう。だけど魔法使いは見た目が変わらないからさ。
	続けられてもせいぜい10年か20年くらいか。
	二人で組んで、何十年かごとに交代しながら働いてるやつとか、見かけたことがあるな。
晶	隠しながら働くのは大変ですね……。
	でも、そうまでしてこの街に暮らし続けるのは、魅力があるからなんですよね。
ネロ	東の国の、他人同士の距離感っていうのは独特だからな。
	一度ぴったり来ちまうと、他では暮らせないよ。
`},
{id:11321,title:"危険な場所",type:"personal",characters:["ヒースクリフ"],memo:"ネロ",
text:`ヒースクリフ	東の国は、暴動や大きな事件を起こすような血の気の多い人たちがいない代わりに、詐欺が多いとききますね。
晶	そうなんですか？東の国の人たちは、警戒心が強い気がしたので少し意外です。
ヒースクリフ	人見知りな気性の分、一度気を許した相手のことを疑いにくい傾向はあるのかもしれません。
	ルールさえ守っていれば安全だと思っている人も多いから、かえってつけ込まれやすい所があるのかも。
	俺の家も、一度お師匠様に騙されてますしね。
晶	ヒースクリフとシノのお師匠様……。
	二人に魔法を教えるのを買って出たけど、本当は魔力が弱かったんですよね。
ヒースクリフ	そうなんです。両親が授業料を払ってたんですけど、魔法舎で他の人たちに指摘されるまで騙されてて。
	他所でも、国王のお墨付きだとか、首都では有名だとか、オズの弟子だとか、話してみたいなんです。
晶	オズの弟子ですか……。
ヒースクリフ	あはは。本物のオズと、本物のオズの弟子に会った今なら、嘘だってすぐ見抜けたんですけどね。
`},
{id:11322,title:"ネロの評判",type:"personal",characters:["ブラッドリー"],memo:"ネロ",
text:`晶	ブラッドリー。どうしたんですか？なんだか機嫌がよさそうですね。
ブラッドリー	ふふん。まあな。
	この辺にあった美味い飯屋が急に店仕舞いしちまったって嘆かれてるのを耳に挟んだんだ。
	気持ちわかるぜって話しかけたら、逃げちまいやがったけどな。
晶	もしかして、ネロのお店でしょうか？
ブラッドリー	そりゃあそうだろ。
	あいつの作る料理は、どこの国に行ったって、そうそう出会えるもんじゃねえ。
	毎日食ってるとありがたみがなくなるが、いざ食えねえとなると、どうしても食いたくなる味なんだ。
晶	わかります。ネロのご飯、本当に美味しいんですよね。
ブラッドリー	うまく言葉にできねえが、なんつうか、毎食丁寧で感動するよな。
	作るやつの性格が良く出てるわ。
	ふわっと美味いが、美味いもの食った後にしか働かねえ細胞が、脳で一斉に働く感じがして鳥肌が立つっつうか……。
晶	わかります、わかります……！話してたらなんだかお腹が空いてきました……。
ブラッドリー	そうだな。今日の仕事は切り上げて、飯食いに帰ろぜ。
`},
{id:11323,title:"スポットの名物",type:"personal",characters:["シャイロック"],memo:"ネロ",
text:`晶	雨の街は、名物や特産物はあるんでしょうか。魔法舎のみんなにお土産を探したくて。
シャイロック	この街の特産といえば水でしょうね。ここは山脈からの雨や川の水が綺麗な土地です。
	私も水割りや氷に使うための水を汲みに、何度か訪れたことがあります。
晶	そうだったんですね。お店で出してたんですか？
シャイロック	いいえ、自分で楽しむ用ですよ。
	でも、そうですね。
	お土産に持って帰れば、オズやフィガロが晩酌するのに喜びそうです。
晶	なるほど。お酒を飲む組にはお水でいいのかな……？
シャイロック	水が上質であれば野菜も美味しくなります。
	ネロがこの街に住み着いて、店を構えていたのも頷けますね。
	西の都心部では汚染も問題になってきました。
	野菜なんかは、だいたい塩漬けや酢漬けにしてしまうんです。
晶	じゃあ、新鮮な野菜も買って帰りましょう。
	シャイロック、選ぶの付き合ってもらえますか？
シャイロック	もちろん。喜んで。
`},
{id:11324,title:"スポットでの発見",type:"personal",characters:["シノ"],memo:"ネロ",
text:`シノ	賢者、これを見てくれ。
晶	旗……？可愛いですね。横断歩道を渡るときに使うやつみたいです。
シノ	面白いんだ。
シノはそう言うと、道端に備え付けられた箱から小さな旗を引き抜いてパタパタと振って見せた。
街の人たち	…………。
すると、道を行き交う人たちが旗を上げ、こちらを気にするように見つめた。
やがて、何人かがこちらに足を向ける。
街の人	旅行者の方ですか？道に迷ったならご案内しましょうか。
シノ	な？旗を振るとみんな寄ってくるんだ。
街の人	……何か困っているのでは……？
シノ	いや、あんたたちが声をかけてくるのが面白くて、旗を振ってみただけ。
街の人	それは違法行為なんですよ……。
	故意なら通報するころになるんですけど、子供のしたことなので今回は見逃しますね。
シノ	おい、誰が子供……むぐぐ。
晶	あ、ありがとうございます……！すみません、連れはちょっと好奇心旺盛で……。
シノ	離せ、賢者。なああんた、用事があるならいいんだろ。
	ブランシェッド領に行く道を教えてくれ。
街の人	ブランシェッド？ここからじゃずいぶん遠いけど……。
	二人で行くのかい？そんな軽装で？
晶	（この町の人たちも、話しかけてくれると親切なんだけどな……。
	　何となく、ネロっぽい街だな……）
`},
{id:11325,title:"楽しい場所",type:"personal",characters:["シノ"],memo:"ネロ",
text:`シノ	賢者。あそこの広場、公園だって。
賢者	本当だ。子供が笑いながら走り回ってますね……！
シノ	この街に来てから、あんな笑い声初めて聞いたな。
街の子供	お兄さん！ゲームの人数が足りないから、一緒にやらない？
シノ	話しかけられた……。おまえ、知らない奴を誘ったりして、怒られないのか。
街の子供	ここではみんなで遊ばなきゃいけないんだよ！笑顔でいない人も、法律違反なんだ。
シノ	強要されるのは気にくわないが、いいぜ。混ざってやるよ。
街の子供	やったー！こっちだよ！ルールを教えてあげるね！
晶	（大人も子供もみんな楽しそうだ。
	　この街にこんなに明るい場所があるなんて、少しホッとしちゃったな……）


晶	あれ、どこからか鐘の音が……。
シノ	ただいま。
晶	シノ。もう戻って来たんですか？
シノ	遊べる時間が決められてるらしい。あと５分でここから離れないと捕まるって。
街の役人	広場を施錠します。速やかに退場してください。
晶	わっ。広場に入る門を閉じちゃうんですね……。
シノ	やっぱり窮屈な街だな。
`},
{id:11326,title:"マナエリア",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
ネロ	ああ、マナエリアの話かな。ちょうどこの前、ファウストが授業でやってたよ。
	マナエリアっていうのは、それぞれが個人的に、精神の安定を得たり、集中して魔力を養う場所のことなんだけど。
晶	たぶん、それです！ネロにもマナエリアがありますか？
ネロ	俺のマナエリアは、傾いた日差しで金色に光る麦畑だ。
	あんまり詳しく覚えちゃないが、たぶん、故郷にそういう場所があったんじゃないかな。
	胸くらいの高さの穂を掻き分けて進むイメージがずっとあってさ。
	調子出ないときなんかは、埋まるみたいに昼寝しにいくと元気が出るんだよな。
晶	リラックスしたいイメージなんでしょうか。
	ネロは繊細だから、ゆっくりできる場所がマナエリアになるんですね。
ネロ	……別に繊細でもねえけどさ。
	まあ、ピリピリした感じが続いてると、魔法も料理も、イマイチになるのはたしかだな。
`},
{id:11327,title:"アミュレット",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって
	賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	ネロもアミュレットを持ってますか？
ネロ	ああ、アミュレットか。あるある。
ネロは、壁に掛けてある乾いた麦穂の束を手にとって、俺に見せてくれた。
ネロ	俺のマナエリアは麦畑だからさ。そのまま、麦の穂を置いてるよ。
晶	なるほど……。効果はありますか？
ネロ	まあ、ないよりはな。というか、大昔にアミュレットの話を聞いてから、身近にはずっと置くようにしてるからなあ。
	ない時との差がわからないかもな。今更手放すのは、なんかちょっと不安だし。
	初めて置いてみた時は、効果を体感した気もするけど。昔すぎて忘れちまったな。
`},
{id:11328,title:"キッチンの見物人",type:"personal",characters:["オズ","ネロ"],memo:"ネロ",
text:`晶	あれ、オズにネロ。こんなところでどうしたんですか？
	なんだか珍しいツーショットですね。
ネロ	賢者さんか……。パンケーキを焼いててさ。
オズ	それを見ていたところだ。もう戻る。
晶	ネロのパンケーキ！ふわふわで、美味しいですよね。
オズ	ああ。
ネロ	ど、どうも……。
オズ	邪魔したな、ネロ。
	混ぜすぎたせいで生地が膨らまないのも、焼き方のコツも、初めて知った。
ネロ	作って行かないのか？なんならキッチン空けるけど。
オズ	必要ない。食べさせる宛てもないしな。
晶	行っちゃいましたね……。パンケーキ好きなんでしょうか。
ネロ	食うのが好きなら食ってくだろ。単に珍しいだけじゃねえか？
	はあ……。今日こそ殺されんのかと思って緊張したぜ……。
	たまーに覗きに来て、心臓に悪いんだよな。
`},
{id:11329,title:"家族",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	ネロも長生きの魔法使いなんですよね。家族のことって覚えていますか？
ネロ	長生きっても、オズほどじゃない。まあ、覚えてるよ。うっすらとだけど。
晶	よかったら、聞きたいです。兄弟はいたんですか？
ネロ	あー、なんか、たぶん、かなり……。
	賢者さんが思ってる感じじゃねえな。もっとがっかりするような話だ。
晶	がっかり、ですか……？
ネロ	俺が生まれた場所は、あんまり治安の良くない場所でさ。
	だからまあ、家の中の治安も悪かったんだ。
	ろくでなしの親がいて、血が繋がってるのかどうかわからない兄弟が何人かいた。
	俺もそこそころくでなしだったが、幸い魔法が使えたんで、早々に家を出たよ。
	家の連中とは、それきりだな。
晶	そうだったんですね……。込み入ったことを聞いてしまってすみませんでした……。
ネロ	ああ、いいっていいって。気にしなさんな。うっすらとしか覚えてないって言ったろ？
	こんな話、魔法使いの間じゃ珍しくないしさ。
	でもまあ、あんたは気が優しいから、家族の話題を聞くときは気をつけたほうがいいかもな。
`},
{id:11330,title:"何でもない毎日",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	ネロ、休憩中ですか？
ネロ	ああ、賢者さん。シノとヒースが食事中に喧嘩しやがってさ。
	一緒に皿洗いしてもらってんだ。
晶	あはは。仲直りできるといいですね。
ネロ	あいつら見てると飽きねえよな。
	……昔は俺にも、相棒みたいなやつがいたんだよ。
	一緒に仕事して、夜は酒飲んで、俺が飯やつまみ作って、あいつが美味いって言って食って。
	まあ、何でもねえ毎日だったけど。いい話でも、悪い話でも、何かあったときに、気軽に話せる相手がいるのは悪くなかったな。
	賢者さんはどうだ？そういうやつ、そばにいるか？
~~~~~~~~~	~~~~~~~~~
選択	います。
ネロ	そうか。そりゃなによりだ。
~~~~~~~~~	~~~~~~~~~
選択	いません。
ネロ	そうか。まあ、俺も、今はこいつ、ってのはいないかもな。
~~~~~~~~~	~~~~~~~~~
選択	わからない。
ネロ	そうか。俺でよければ、何でも遠慮せず話してくれよ。
~~~~~~~~~	~~~~~~~~~
晶	相棒って響きは格好いいですね。少し憧れます。
ネロ	はは……。居るなら居るで、厄介なこともあるけどさ。
	時間が経つと、やっぱり、よかったことばかり思い出すもんなんだな。
`},
{id:11331,title:"おねだり上手",type:"personal",characters:["リケ","ネロ"],memo:"ネロ",
text:`ネロ	じゃあ次、これは？
リケ	玉ねぎですね！玉ねぎは確か……。
晶	ネロ、リケ。……お絵かきですか？
ネロ	ああ、賢者さんか。リケの文字書きの練習を見てやってたんだよ。
	俺が絵を描いて、リケがその文字を書いてさ。
リケ	ネロ、次はオムレツを書いてください。
	今夜はオムレツが食べたいですって、どう書けばいいですか？
ネロ	はは、そりゃ夕飯のリクエストだろ。
リケ	そうです。
	オムレツが食べたい時、ネロに手紙を書けば、直接伝えるよりも、聞き入れてくれる気がするんです。
	どうですか？ネロ。
ネロ	…………。
晶	あはは。たしかに、リケが一生懸命文字を書いてきたおねだりを、ネロは無下にできないかもしれませんね。
ネロ	子供の言うがままになるほど、安易な男だった覚えはねえんだけどなあ……。
リケ	ふふ。
	ネロが他のメニューに読み違えないように、オムレツだけはちゃんと覚えたいんです。
`},
{id:11332,title:"本日の買い出し班",type:"personal",characters:["リケ","ネロ"],memo:"ネロ",
text:`晶	リケと待ち合わせ？
ネロ	あぁ、中央の街に食材の買い物に行くんでついでに連れてってやるんだよ。
	リケのやつ、同じもんばっかり食いたがるからよくよく聞いたらさ。
	自分の好物がよくわかってないみたいなんだ。
	色んなもん味見して好みの味が見つかれば、リクエストされる甲斐もあるだろ？
	まあ、初めて覚えた味が俺の料理じゃ舌が肥えちまうだろうけど。
晶	それは……、確かにそうですね。
ネロ	あはは。俺の知ったことじゃねえけどな。
リケ	ネロ、お待たせしました。
	今日の買い物、楽しみにしてました！よろしくお願いしますね。
ネロ	市場の雰囲気も見ていくといい。
	ゆっくり付き合ってやるよ。それじゃあ行ってくるわ。
晶	はい。ふたりとも、気をつけていってらっしゃい。
`},
{id:11333,title:"力仕事の賜物",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	ネロー、今日の夕飯は何ですか？
ネロ	賢者さん！丁度いいところに来た。
	今ちょっと両手が離せねえんだけど、シャツの袖が下がってきちまってさ。
晶	わかりました、袖を捲ればいいんですよね？
	よいしょっと……。
ネロ	助かったよ。ありがとな。
晶	…………。
ネロ	……どうした？まじまじと腕なんか見て。
晶	いえ、結構筋肉があるなあと思って……。やっぱり、鍛えてたりするんですか？
ネロ	いや、鍛えてるっつーより、料理屋って意外と力仕事が多いから、自ずと腕の筋肉はつくんだよ。
晶	なるほど……。
ネロ	ありがとな。今日の夕飯は賢者さんの皿は肉多めにしとくよ。
晶	（俺も沢山肉を食べたらもっと筋肉がついたりしないかな？いや、むしろ料理をするべき？）
`},
{id:11334,title:"繊細な優しさ",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	……はあ。
ネロ	どうした？食欲がないのか？
晶	あっ、すみません。気を使わせてしまって……。
ネロ	いいよ、無理しなくて。誰にだってそういう日はあるさ。
	体調でも悪いのか？
晶	実は、少しだけ気疲れしてしまって。何か嫌なことがあるとかじゃないんですけど。
	元気が出なくて……。
ネロ	そういう時あるよな。何となく疲れちまって誰とも話したくなくなったりさ。
	別に誰が悪いとかじゃねえから、気を使わせるのも悪いしさ。
晶	そうなんです……！大きな理由がないからこそ、誰かに相談もしづらくって……。
ネロ	そういう時は一日部屋にこもってみるのもいいんじゃないか？
	心配性な奴らには俺から上手く言っておくからさ。
晶	ネロ……。ありがとうございます、何だかすごく安心しました。
	明日は思いっきり引きこもろうと思います！
ネロ	部屋で良いやすい軽めの食事持ってくよ。ベッドの上で食ってこぼすなよ？
`},
{id:11335,title:"得意な魔法",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	ネロは得意な魔法ってありますか？ネロにしか使えない魔法とか。
ネロ	俺にしか使えないなんて大層な魔法はないが、細かく操る、みたいなのが得意だよ。
	でけえのを一個、っていうよりは、細かいのを一度にたくさん、って感じだな。
晶	なるほど。わかりやすいです！
	ネロは、作ってくれる料理も繊細な感じがしますもんね。
ネロ	だろ？まあ、東の国の魔法使いは、そういう気質の奴が多いのかもしれねえな。
晶	そういえば、ネロは料理をする時にあまり魔法を使いませんよね。
	やっぱりこだわりがあるんですか？
ネロ	こだわりってほど大したもんじゃねえけどさ。
	材料に直接触って、作ってる実感がある方がいいだろ。
晶	いいっていうと……。
ネロ	だからまあ……。
	手で作る方が楽しいよ。
`},
{id:11336,title:"お手軽ピッキング",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	うーん……。
ネロ	賢者さん。何を唸ってんだ？
晶	ここのドアが開かなくて……。どの鍵も合わないみたいなんです。
ネロ	へえ。ちょっと貸してみな。
	《アドノディス・オムニス》
晶	えっ！
~~~~~~~~~	~~~~~~~~~
選択	直してくれたんですか？
ネロ	いや、こじ開けただけだ。このくらいなら朝飯前だよ。
~~~~~~~~~	~~~~~~~~~
選択	壊しちゃいましたか？
ネロ	どっかの馬鹿と一緒にしないでくれよ。鍵穴いじってこじ開けただけだ。
~~~~~~~~~	~~~~~~~~~

晶	すごい、ありがとうございます！なんだか手慣れてましたね。
ネロ	はは……。
	シンプルな錠前だったし、これくらいなら俺じゃなくてもできると思うけど。
晶	そんなことないですよ。手際の良さがまるで鍵開けのプロみたいで、感動しました。
ネロ	……やめてくれ。
`},
{id:11337,title:"紋章",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	賢者の魔法使いには、目印になる賢者の紋章が身体に現れるって聞きました。
	ネロの紋章はどこにあるんですか？
ネロ	ああ、この辺りだ。
ネロはそう言って、服の上から左の二の腕あたりをポンポンと叩いて示した。
ネロ	賢者の魔法使いに選ばれた時に、身体のどこかに紋章が浮かんでくるって話には聞いたことがあったんだけどな。
	急に光って……。まさか自分が、って感じで驚いたよ。
晶	たしかに、いきなりだと驚きますよね。
ネロ	そのうち慣れるもんかと思ったけど、まだダメだなあ。
	自分についてる紋章が他のやつらの身体にもあると思うと、なんていうか、違和感があって……。
	居心地悪いような、気持ち悪いようなさ。
	他人のベッドを借りるような、どうにもいい気分ではないんだよな。
晶	気持ち悪い感じ、ですか……？
ネロ	気にしすぎなのかもしれねえけど……。
	まあ、慣れだと思うから、あんたも気にしないでくれよ。
`},
{id:11338,title:"求：包丁スキル",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	わあ、野菜がたくさんですね！
ネロ	はは……まとめて買うと安いって言われて、つい買い過ぎちまってさ。
	お子さま達の為に、食べやすくしなくちゃな。
晶	俺もお手伝いしましょうか？お役に立てるかは分らないですが……。
ネロ	助かるよ。じゃあ、そこにある包丁とまな板使って細かく切ってくれるか？
	指切らないようにな。
晶	はい！
	（よし、ネロがいつも切ってるみたいに、綺麗で繊細な感じで真似をして……）


ネロ	調子はどうだ……ってなんだこりゃ！？
晶	すみません……努力してみたんですが、ネロみたいに上手くいかなくて、
	どんどん訳のわからない形に……。
ネロ	いや、全然構わないけどさ。っふふ、この形、なんかツボに入っちまって
	……っはは、あっははははは！
晶	（ネロがこんなに笑うなんて、珍しい……）
`},
{id:11339,title:"就寝前のティータイム",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	こんばんは、ネロ。今日の任務で北の国に出かけたので、お土産を採って来たんです。
ネロ	俺に？採ってって……、さては食材だな？
晶	はい！これ、前に話してましたよね。
	スノウとホワイトが、瓶に封じてくれたんですが……。
ネロ	サンダースパイスじゃないか！北のやつは見つけにくい分、特別上等なんだ。
	大変だったろうに、わざわざありがとうな。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
ネロ	ひとりのときはダラダラしてるよ。ベッドで本読んだりさ。
	専用のキッチンも作ったけど、そんなに熱心に料理研究するわけじゃない。
	まあ、今日はこれで試作を作ってみるけどな。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
ネロ	俺が呼んでるわけじゃないが、シノやリケが、腹減った時に訪ねてくる。
	北の連中も遠慮がねえな。
	だけどまあ、部屋で話そうぜ、っていうのより、
	用事がある時に声をかけられるくらいが、俺にちょうどいい距離感かもな。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
ネロ	早めに起きて、カナリアさんの朝食の準備と後片付けを手伝ってるかな。
	そのあとは魔法の訓練に出て……。
	昼寝して、夕食の支度手伝って、夜は適当に過ごして寝るよ。
~~~~~~~~~	~~~~~~~~~

晶	寝る前にお邪魔しちゃってすみませんでした。
ネロ	何言ってんだ。あんたこそ、疲れてるとこ来てくれたんだろ。
	よかったらお茶くらい淹れるけど。
	このスパイスをちょっとだけ茶葉に入れると、体があったまってまた美味しいんだよ。
晶	美味しそうですね……！じゃあ、少しだけ頂いていきますね！
`},
{id:11340,title:"余り物のおすそ分け",type:"personal",characters:["ファウスト","ネロ"],memo:"ネロ",
text:`ネロ	後片付けまで手伝ってくれてありがとな。
晶	いえいえ。
	いつも美味しい料理を食べさせてもらっているので、このくらいさせてください。
ファウスト	ネロ、何か昼食の余り物はないか？腹が減っているんだが。
ネロ	あんたがそんなことを言うなんて珍しいな。余り物ってどんなもんが欲しいんだ？
ファウスト	……小魚とか。ソーセージの切れ端でもいいが。
晶	小魚とソーセージって、何だか猫が好きそうな食べ物……。
ファウスト	賢者。僕が食べたい物にケチをつける気か？
晶	い、いえ、そんな滅相もないです！
ネロ	ソーセージなら確か余ってたはずだ。すぐ用意するから、少し待っててくれるか。
ファウスト	ああ、ありがとう。
ネロ	ファウストでも猫でもいいが、食べ過ぎには気をつけろよ。
`},
{id:11341,title:"衛生管理の鬼",type:"personal",characters:["⑬"],memo:"ネロ",
text:`ネロ	クッソ！あの野郎どこ行きやがった！？
	早く捕まえねえと、料理どころじゃねえぞ……。
晶	ネロ！どうしたんですか？もしかして、またブラッドリーがつまみ食いを……？
ネロ	今回ばかりはあいつの方だ幾分かマシだ！賢者さん、そっち見張っててくれ。
	こんなこと言いたくねえけど、ネズミが出たんだよ……。
	ありえねえ事態だよ、ったく……。
晶	ネズミ！？
	あっ、ネロ！あそこにいます！
ネロ	おらっ！チッ、逃したか！
	そこか！？くそ、すばしっこいな……。衛生管理は徹底してたはず、なんで……。
	あ！こんなとこに食い残しがあるんじゃねえか！？
	野菜の残し方からしてブラッドだな。
	あんだけ食い残しは放置するなっつったのに！
	絶対に仕留めてやる……。俺の聖域を荒らしたこと、後悔するんだな！
晶	（仕留められるのがネズミなのかブラッドリーなのか分らない……）
`},
{id:11342,title:"秘密の口止め料",type:"personal",characters:["⑬"],memo:"ネロ",
text:`晶	あれ、ネロ何してるんですか？
ネロ	はは……見つかっちまったか。今日は夜風が心地よくってさ。ここで晩酌してるんだ。
晶	確かに、今日はいい夜ですね。
ネロ	だろ？ここは俺の秘密の晩酌スポットだから、できれば、誰にも言わないでくれよ。
~~~~~~~~~	~~~~~~~~~~~~~~~~~~	~~~~~~~~~
選択	わかりました。
ネロ	ありがとさん。あんたはそう言ってくれると思ってた。
~~~~~~~~~	~~~~~~~~~
選択	絶対に誰にも言いません。
ネロ	あはは、そんな深刻になんなくてもいいけどさ。
~~~~~~~~~	~~~~~~~~~

ネロ	じゃあ、これは口止め料だ。
	ほら、口開けな。
晶	…………！甘い！
ネロ	甘いもんも酒には意外と合うもんだ。
	それに、こんな時間に食うチョコレートは格別だろ？
晶	すごく……罪深い味がしますね……！
ネロ	この味を一度知っちまったら、もう後戻りはできないな。
	口止料の分、頼むぜ賢者さん？秘密を守ってくれたら、またこいつをやるからさ。
`},
{id:11343,title:"授業参観",type:"personal",characters:["東"],memo:"ネロ",
text:`ネロ	おう、やってるか？
ヒースクリフ	ネロ、賢者様。一緒に来るなんて珍しいですね。
ネロ	廊下で会ったんだ。賢者さんも授業を見学したいんだとさ。
晶	みなさんがどんな風に魔法を学んでいるのか興味があって。
シノ	座学なんて見てても退屈なだけだ。ファウスト、実技の訓練に変えてくれ。
ファウスト	予定の変更はしない。ちゃんと座りなさい。
シノ	賢者に格好いいところをみせてやろうと思ったのに……。
ヒースクリフ	こら、シノ。そうやってすぐ拗ねるなよ。
ネロ	はは。やんちゃな生徒を持つと大変だな。ファウスト先生？
ファウスト	茶化すな。肘でつつくんじゃない。
晶	（もっとピリッとした雰囲気で授業をしているのかと思ったけど……）
	見知らぬ人には警戒心の強い猫が、仲間には心を許している、みたいな感じなのかも？
ネロ	ん？なんか言ったか？
`},
//西
//シャイロック
{id:11401,title:"スポットの印象（１）",type:"personal",characters:["クロエ"],memo:"シャイロック",
text:`クロエ	シャイロックのお店って、シャイロックらしいよね。大人っぽくて、かっこいいな。
晶	わかります。
	最初は気が引けてしまうけど、座っているととても居心地のいいところとか……。
クロエ	あはは、わかる！それに、こんなに知らない魔法使いが集まってる場所って新鮮だな。
	西の国中の魔法使いが、いろんな話を聞かせてくれるんだよ。
	中には別の国から来てる人もいるみたいだし。
	魔法舎の近くにあったら、毎週通っておしゃべりしたいくらい！
晶	クロエもおしゃべりが上手ですもんね。
	ラスティカと旅をしてる時は、こういうお店には入らなかったんですか？
クロエ	うーん、行ったことないわけじゃないけど、
	ラスティカが一緒だと、レストランやティールームの方が多かったんだ。
	西の国の人間たちの酒場は、ちょっと物騒だったりするし、何かとトラブルも多いから……。
	でも、シャイロックのお店なら安心だし、すごく落ち着いてて雰囲気もいいよね。
	俺に似合うかどうかは別として……常連さんになりたいお店だなって思うよ。
`},
{id:11402,title:"スポットの印象（２）",type:"personal",characters:["ネロ"],memo:"シャイロック",
text:`ネロ	ここがベネットの酒場か。さすが、いい店だなあ。西の国の一等地だし。
	店内が洗練されてるよな。
	ちぐはぐなものが一切なくて、シャイロックの年季の入った愛着を感じるよ。
晶	ネロも東の国でお店を開いてたんですよね。
	内装や小物にこだわったりはしてなかったんですか？
ネロ	そうだなあ。俺も多少はやってたけど、ここまでじゃなかったっていうか……。
	東の国じゃ魔法使いだって隠してたからな。
	同じ場所で長く店をやることはできなかった。
	何十年も老けない店主がいたらバレちまうだろ？
	あの国は他人に無関心だけど、異質なものには敏感だからさ。
	それに……。
晶	それに？
ネロ	これだけ愛情をかけた場所が、万が一なくなっちまったら嫌だろうなって、
	つい、考えちまうんだよな。
	シャイロックはどう思ってんのかなあ。
	西の国のやつらは楽観的だから、なくなるなんて思わねえのかもな……。
`},
{id:11403,title:"スポットの印象（３）",type:"personal",characters:["シノ"],memo:"シャイロック",
text:`晶	シャイロックのお店、素敵ですよね。シノはどう思いましたか？
シノ	狭いな。
	酒を飲む店って狭いよな。皿も小さいし、昼間なのに薄暗い。
晶	なるほど……。でも、いい雰囲気でしょう？
シノ	まあ、ここの明かりは眠くなるから、眠くなるくらいには落ち着いてるのかもな。
	シャイロックは話す時、ゆったりして優しい言葉遣いだから、
	店もそんな感じで広い所だと思ってた。
晶	あはは、たしかに、シャイロックのおしゃべりには余裕を感じますね。
シノ	だろ？オレは、自分の場所を作るなら、やっぱり城だな。
	広ければ広いほどいいし、大きければ大きいほどいい。
	シャイロックも、グランヴェル城の大広間くらい広い店にすればいいのにな。
`},
{id:11404,title:"ブレイクタイム（１）",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`シャイロック	賢者様、どうぞ。酔った波と積乱雲のカクテルです。
	ノンアルコールですよ。
晶	ありがとうございます。
	…………。
シャイロック	どうかなさいました？
晶	あ……。ひとりでバーに来るのって、少し緊張するなと思って。
シャイロック	そういえば、魔法舎にいる時も、同じようにおっしゃっていましたね。
	どんなことが気に掛かるんです？
~~~~~~~~~	~~~~~~~~~
選択	マナーが守れてるかなとか。
晶	マナーが守れてるかなとか。
シャイロック	マナーを気にかけてくださる方が気にするほどのマナーなどありません。
	店主の私と、この場所を愛している人たちに、ほんの少し親切にしてくだされば、
	それで十分です。
~~~~~~~~~	~~~~~~~~~
選択	場違いじゃないかなとか
晶	場違いじゃないかなとか。
シャイロック	どんな方でも、場違いなんてことはありませんよ。
	賢者様がこの場所を気に入って、この場所に気に入られようと思ってくだされば、
	それで十分です。
~~~~~~~~~	~~~~~~~~~
晶	シャイロックにそう言って貰えて、安心しました……。
	大人っぽいお店にひとりだと、気後れしてしまって。
シャイロック	たしかに、ひとりの時間を贅沢に楽しむ術は、
	歳を重ねるごとに上達するのかもしれません。
	この店は、ゆっくりとお酒を楽しみながら、ひとりでいる時間を上質にするための空間です。
	喜びに酔うことも、悲しみに酔うことも、思い出に酔うことも、心の思うまま、酩酊の波に身を任せることのできる場所。
	なによりここは私の店です。
	賢者様も、どうか心置きなくくつろいで行ってくださいね。
`},
{id:11405,title:"ブレイクタイム（２）",type:"personal",characters:["シャイロック","ムル"],memo:"シャイロック",
text:`ムル	ただいまー！
晶	ムル、シャイロックのお店に来ると、ただいまって気分になるんですね。
ムル	なる！これは俺のカウチ！
晶	ムルの？
シャイロック	魂が砕けてからのムルは、どこでも寝そべりたがったんですよ。
	ですが、私の店の中で、だらしなさすぎる風景があることを、どうしても許せなくて……。
	ムル専用のカウチを置いたんです。
	彼がどんな格好で寝ていても絵になるデザインのものを探して。
晶	徹底してますね……。
ムル	寝心地いい！
シャイロック	あなたが気に入ってくれて何よりですよ。
晶	わあ……。たしかに寝てるだけなのに、なんだか気怠げで格好良く見えます。
ムル	ふふふ。ごろごろ。
晶	（猫のいる喫茶店みたいだな……）
`},
{id:11406,title:"スポットの思い出（１）",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`晶	本当に素敵なお店ですね。内装や小物なんかにも、こだわりがあるんですか？
シャイロック	そうですね……｡むしろ、こだわっていないものは、ひとつも置いていませんね。
	たとえば、今お出ししているグラスも、西の国のカットグラス職人に、
	頼み込んで作ってもらったものですよ。
晶	本当だ……｡すごく綺麗で繊細な模様が入ってる。
	やっぱり作るのが難しいんですか？
シャイロック	難しさもありますが、私が出会った頃には、職人の彼が高齢で病に罹っていて、
	作るのはもうやめたと断られたんです。
	人間だったのですけれど、私は彼の作品の美しさに惚れ込んでいたので、
	無理を押して、どうしてもとお願いしました。
	何度も交渉した末、最後には折れてくださって。
	私も看病のために二年ほど一緒に暮らしながら、
	揃いの遺作を二十脚ほど作って頂いたんですよ。
晶	……すごいお話だな……。グラスのために何年も、なんて……｡
シャイロック	そうですか？
	人間も、欲しいもののために、数日かけて買い付けに行ったりするでしょう。
	寿命までの数十年のうちの数日を使うことと、感覚はそう変わらないと思いますよ。
	命そのものよりも技術の方が長く愛される。
	それをわかっている人間の作るものは、情熱に溢れていて、心奪われてしまうんです。
`},
{id:11407,title:"スポットの思い出（２）",type:"personal",characters:["シャイロック","ムル"],memo:"シャイロック",
text:`晶	ムルもお店の常連さんでしたよね。どんなお酒が好きだったんですか？
シャイロック	彼は気分屋でしたから、日によって、色々なカクテルを楽しんでいましたね。
	辛めのものが多かったでしょうか。
	今日はどれを飲みたいか当ててみて、と言ってくる、面倒臭い人でしたよ。
晶	あはは。当てられましたか？
シャイロック	だんだんと。
ムル	シャイロックー！おかわり頂戴！
	あっ！賢者様もいる！賢者様、俺が次に頼むお酒、なんだかわかる？当ててみて！
シャイロック	ほらね。賢者様、よろしければこの中から選んでやってください。
~~~~~~~~~	~~~~~~~~~
選択	月光冠のカクテル。
ムル	いいねえ！月をお洒落に着飾らせるお酒だ。
	何かをお祝いしたい気分の時に飲むやつだよ！
~~~~~~~~~	~~~~~~~~~
選択	早起きの猫のカクテル。
ムル	もうお開き？月ばかり眺めてないで、早く眠りなさいの合図のお酒だ。
	シャイロックが１日の終わりに出してくれるやつだよ！
~~~~~~~~~	~~~~~~~~~
選択	暗闇に輝ける星のカクテル。
ムル	これは月から見た俺のお酒！
	ここにいるよ！って、花火を上げたくなっちゃう味がする！
~~~~~~~~~	~~~~~~~~~
ムル	急にこれが飲みたくなったみたい。お願い、シャイロック！
シャイロック	かしこまりました。不思議と、魂が砕けても、味覚は変わらないんですよね。
ムル	うん！変わらない友情と味覚に、乾杯！
`},
{id:11408,title:"スポットの思い出（３）",type:"personal",characters:["ムル"],memo:"シャイロック",
text:`ムル	賢者様！シャイロックのこと、好き？
晶	え？はい、もちろん好きですが……。
ムル	昔、シャイロックのことが好きだった魔法使いがいたことを思い出したんだ。
	いつもその席に座って、口説いてた！
晶	口説いてたって、シャイロックを？
	……えっ、これ、恋バナですか！？
ムル	そうだよ！
	そして、俺の席にはもうひとり、シャイロックを狙ってる別の魔女が座ってた。
	いつもカウンターに並んで、順番にシャイロックに話しかけてたよ。
	あなたは世界に唯一無二のひと。結婚して！
晶	ちょっとどきどきする話ですね。
	シャイロック、やっぱりモテるんだな……。
ムル	シャイロックがいない時は二人で話してた。
	シャイロックの好きなところを褒めあったり、お互いの口説き文句を茶化したりして。
	やがて二人は結ばれた。
晶	えっ。
ムル	同じ人が好きな者同士、気が合ったみたい！
	シャイロックも普通に祝福してたから、
	俺は、やっぱりこの国の連中ってイカレてるなって思った！
晶	ムルでもそうなんですね……。
	たしかに、展開が豪速で、ちょっとついていけなかったです。
ムル	生まれた子供にシャイロックって名付けてたよ。
	子供は人間だったけど、何度か会いに行った。
晶	名前までつけるのは凄いな。シャイロックに似てましたか？
ムル	まさか！シャイロックみたいな人は、シャイロックしかいないさ！
`},
{id:11409,title:"シャイロックへの印象（１）",type:"personal",characters:["ムル"],memo:"シャイロック",
text:`晶	ムルはシャイロックとけっこう古い仲ですよね。
	シャイロックのこと、どう思っているんですか？
ムル	検討しがいのある質問だね！
	そのことについては、シャイロックとも、何度も議論してる！
	いくつも答えを出したけど、ひとことじゃ言えないな！
	あらゆる意味で、俺と繋がってるひとだけど！
晶	繋がっているひと……。
ムル	俺のことは好きだろうね！同時に嫌いでもあるんだろう。俺には問題が多いから！
	彼の興味は俺自身に向いてるかもしれないし、俺の知性にだけ関心があるのかもしれない。
	あるいは両方？それって願望？誰の願望？
	賢者様はどう思ってる？
晶	え……、ええっと……。
ムル	俺は興味の向くものは研究したい！あらゆる角度から切り開いて覗きたい。
	解剖して観察して思考して議論したいんだ。
	シャイロックはそうじゃないみたい。でも俺にして欲しいことがあるんだろう。
	だから長い間一緒にいるんだよ。
	彼が要求や観察をどうやって表現するのか、知りたいんだ。
	何百年も一緒にいるのに、まだわからない！
	わからないものってわくわくする！
	だからシャイロックとおしゃべりすると、わくわくしてどきどきするね！
晶	お気に入りな雰囲気は伝わってきた気がします……。
ムル	あはは、賢者様！お行儀のいい答えだなー！
`},
{id:11410,title:"シャイロックへの印象（２）",type:"personal",characters:["クロエ"],memo:"シャイロック",
text:`晶	クロエはシャイロックのこと、どう思っているんですか？
クロエ	大人っぽくって、落ち着いてて、おしゃれでかっこいいなって思ってるよ！
	賢者様もそうでしょう？
	いかにも西の魔法使いって感じの、マイペースで変わり者のところも好きだな。
	上品な人なのに、ムルと一緒にいるところとか。
	それなのに、たまに子供っぽいわがままを言ったりして
	「可愛いー！」って思うこともあるんだよね。
晶	シャイロックの子供っぽいところですか？そんなところ、ありますか？
クロエ	あるよ！たまにだけどね。
	この前、みんなの衣装を作ってる途中に、シャイロックが部屋に来たんだよ。
	それで、作りかけの服を見て、色々アドバイスをくれたんだけど……。
	｢このひとつしかない飾りが気に入ったので、どうしても私の服につけてくださいね」
	って……。
晶・クロエ	……可愛い〜っ！
晶	シャイロックも、そんなに可愛いことを言う時があるんですね！？
クロエ	可愛いよね！そんなこと言われたらシャイロックにあげちゃうよね！
	シャイロックは、魔法舎の中でも、身だしなみにこだわりがあって、
	常に気をつけてるひとだと思うんだ。
	そんな人が、俺の作った服を着てくれたり、褒めたりしてくれるのが、
	すっごく嬉しいんだよね。
`},
{id:11411,title:"シャイロックへの印象（３）",type:"personal",characters:["ラスティカ"],memo:"シャイロック",
text:`晶	ラスティカは、一緒に西の国の賢者の魔法使いに選ばれたシャイロックのこと、
	どう思っていますか？
ラスティカ	月に選ばれたことはとても驚きましたが、
	彼のような経験豊富な魔法使いが指南役でいてくれるのは、頼もしく思いますね。
	僕は昼間のゆったりした時間に詳しいですが、
	彼は夜のゆったりした時間に詳しいです。
	僕はもてなされるのが得意だけど、彼はもてなすのが得意ですね。
	そのせいか、お互いに満足した時間を長く過ごせる間柄だと感じています。
晶	たしかに、相性が良さそうというか、
	二人が一緒にいると、その場が優雅な雰囲気になる気がしますね。
ラスティカ	ふふ、ありがとうございます。
	ですが、僕たちは少しだけ上手くいきすぎて、
	たまに、お互いに物足りない気持ちになることがあるんです。
晶	上手くいきすぎていて……、刺激やトラブルが欲しくなるってことですか？
ラスティカ	そうですね。これは西の国生まれの性なのかもしれません。
	そんな時は、せーの、でおかしなことをするんです。
晶	そんなところまで気が合うんですね……。
	おかしなことって、どんなことですか？
ラスティカ	カエルを美女に変身させたり、誰が最初に声を掛けるか賭けたり、かな。
	他にも、色々ありますが……。
	賢者様にお話できる範囲だと、そういう感じのことですね。
`},
{id:11412,title:"シャイロックへの印象（４）",type:"personal",characters:["カイン","スノウ","ホワイト"],memo:"シャイロック",
text:`晶	カインはシャイロックと、賢者の魔法使いになってから知り合ったんでしたよね。
カイン	ああ。地元や騎士団にはいない、会ったことないタイプだから、シャイロックと話すのは新鮮だよ。
	優しいし、甘やかしてくれるけど、だらしなくしすぎると叱られる。
	でも、気に掛けて貰えるのは気分がいいんだよな。
晶	なんとなくわかります。たしなめられるって、こういうことかなって。
カイン	あはは、そうなんだよ。
	初めて会った時、あ、こいつ、モテるだろうなってすぐ分かった。
晶	カインもモテてたんじゃないですか？
カイン	それはそうだけど、もっと、年季の入った魅力を感じるというか……。
	実際、俺もすぐシャイロックが好きになったし。
	あんな感じでバーテンダーなんてやってると、何かと大変じゃないのかな。
	トラブルとかさ。
スノウ	ほほほ。シャイロックを己のものにできるなどと思うのは、人生経験が浅いからじゃ。
ホワイト	太陽にも北風にもなびかぬ男だからこそ、西の国の先生役が務まるのじゃ。
晶	わっ。びっくりした。
	スノウとホワイト、わりと浮いた話題が好きですよね……。
スノウ・ホワイト	さよう。いくつになっても気持ちだけは若くいたいもんねー。
`},
{id:11413,title:"シャイロックへの印象（５）",type:"personal",characters:["フィガロ"],memo:"シャイロック",
text:`晶	フィガロは賢者の魔法使いになる前から、シャイロックと顔見知りだったんですか？
フィガロ	そうだね。店主と客の間柄で、それ以上ではなかったけど。
	ホワイト様を俺の身内みたいに考えるなら、ムルもシャイロックの身内だろ？
	なら、多少困縁があるのかも？って程度かな。
	１０００年以上も長生きの魔法使い同士なら、何かと縁もできやすい。
	その範疇だろうね。
晶	なるほど……。フィガロはシャイロックのこと、どう思っているんですか？
フィガロ	シャイロックかぁ……。一言で言うなら、俺にとって、美味しいお酒そのものかな。
	シャイロックと軽快に会話できる自分は、かっこよく思えて気分が良くなる。
	賢者様もわかるだろう？
晶	なんとなく……。
	でも、俺はまだ、手のひらの上で撫でてもらっているような話しか、
	できてない気がして……。
フィガロ	そうなの？たまには切り込んでみたらいい。怒ったってきみなら許してくれるさ。
	俺は踏み込み過ぎて、よく怒らせちゃう。
	あーあって思うけど、彼のご機嫌を伺うのは孔雀の機嫌を取るみたいな気持ちになるだろ？
	それはそれで気分がいい。
	俺は誰かに、またまた～、機嫌損ねないでよって言うの、好きだしね。
晶	下手に出るのが好きってことですか……？
フィガロ	まあ、そうかな。力に頼らない俺って、寛大だなって気分になれるからかも？
	みんなが大人っぽいと思ってるシャイロックを子猫みたいに愛でてる自分って、
	寛容で、かっこいいなって思うじゃない？
	だから、シャイロックとおしゃべりするのはけっこう好きだよ。
`},
{id:11414,title:"スポットゆかりの話（１）",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`シャイロック	昔、ベネットの所有する土地には、質のいい葡萄の取れる畑があったんですよ。
晶	質のいい葡萄……。ワインを作っていたんですか？
シャイロック	ええ。
	今はもう、畑はなくなってしまいましたが、当たり年のワインを残してあるんです。
	ワインを寝かせておくのにも、本来は寿命がありますが、
	魔法を使っているので、数百年ものですね。
晶	すごい……。貴重なお酒なんですね。
	どんな時にどんな人が飲むんですか？
シャイロック	ベネットの家があった頃は、王侯貴族への献上品としていました。
	お店を持ってからは、私の気分次第で出していましたね。
	気のいいお客様や、再会できた古い友人などに。
	最近なら、お近づきの印にと、オズに一本差し上げた時に、
	とても気に入ってくださいましたよ。
晶	オズが？少し意外ですね。
シャイロック	同感です。お酒は意外な方が思いのほか喜んでくださるので、
	お薦めするのがとても楽しいですね。
	ベネットのワインも、残り数本です。飲み干してしまえば終わり……。
	どんな時に、何を思って、誰と開けるのか。
	私自身、とても楽しみにしているんですよ。
`},
{id:11415,title:"スポットゆかりの話（２）",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`晶	神酒の歓楽街は綺麗な街ですね。リゾート地だって聞いて、納得です。
シャイロック	賢者様にそう言っていただけるのは、光栄ですね。
	ですが、以前はもっと美しい場所でしたよ。
晶	そうなんですか？
シャイロック	ええ。窓から見える真っ白な砂浜と透き通った海までの眺めが素晴らしくて。
	今は視界を遮る建物が増えすぎました。海も、大気と同じように汚染されています。
	近くで見れば、よくわかりますよ。
	夜になれば、街明かりが目眩しのように全てを隠していますけれどね。
晶	そうだったんですね……。夜景が綺麗で、気づきませんでした……。
シャイロック	ムルによって魔法科学が発明されたことで、いずれこうなる未来は予想できました。
	もちろん、ムル自身に分からないはずがない。
	何度か説得はしましたが、私の愛した美しい海より、
	彼の興味の向くものを優先したのでしょう。
晶	……やっぱり、恨んでいますか？ムルのこと……。
シャイロック	そうですね。私の頼みを聞き入れてくれなかったことは今も恨めしいですが……｡
	友人の頼みを聞いて探求の手を止めるような物分かりのいい紳士は、ムルではないのですよね。
	彼は、彼のあるがままでいてほしい。
	それもまた私の願いです。だから複雑なんですよ。
`},
{id:11416,title:"西の国について",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`晶	シャイロックはずっと、この街に住んでいたんですよね。
	西の国について、どう思っていますか？
シャイロック	長く暮らして、変化を見守って来た国ですから、愛着や憎しみがありますね。
晶	憎しみも……、ですか？
シャイロック	ええ、思い入れが強くて。
	昔は良かったなんて、つまらないことを言い出しそうになります。
~~~~~~~~~	~~~~~~~~~
選択	昔の良かったところは？
シャイロック	もともと、楽観的で享楽的な者が多い国でしたが、
	昔はもう少し節度を知っていたんですよ。
	富を持つ者も、持たざる者も、ある意味寛容で、明るくて、おおらかな暮らしをしていましたね。
	そのぶん、学問や芸術のように、手間の掛かるものが愛されていました。
晶	シャイロックが、手間の掛かるものが好きだっていうのは、なんだか納得できますね。
シャイロック	ふふ、お恥ずかしい限りですが。
	今のこの国は、手軽な快楽ばかり求めて、本当の幸せを見失っているようです。
	……それでも、一度愛した昔の気配に、いつまでも心惹かれてしまうんですよ。
~~~~~~~~~	~~~~~~~~~
選択	今のいいところは？
シャイロック	この国でも、昔は魔法使いが怖れられていました。
	西の国に限らず、未知の力に畏怖の念を抱くのは仕方のないことですが、いささか過剰だと感じていたんです。
	賢者様なら、きっとお分かりになるでしょう。
	私たちは不思議の力を持ってはいても、人間と同じように傷つき、歓喜する。
晶	はい……。怖い魔法使いもいるのかもしれないけど、それは人も同じことだから……。
シャイロック	その通りですね。
	西の国の人々は、あなたと違って、魔法使いを理解する手間をかけずに、安易な魔法科学を手にしました。
	そして、魔法は恐ろしくないものだと自信をつけ、私たちを過剰に怖がる事はなくなったんです。
	風情は欠きますが、未知のものを恐れすぎなくなったこと自体は、好ましい傾向だと思っているんですよ。
`},
{id:11417,title:"〈大いなる厄災〉について",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`晶	〈大いなる厄災〉が来る夜、シャイロックのお店はどんな様子でしたか？
シャイロック	お店では毎年お祭り騒ぎでしたね。
	魔法使いたちが集まって、特別賑やかに過ごしていました。
	賢者の魔法使いたちが戦うところは見えませんが、
	想像して、それを肴に盛り上がるんですよ。
晶	応援するみたいな感じですか？
	俺の世界でも、スポーツ観戦しに、お店に集まったりする人たちがいました！
シャイロック	そうでしたか。誰かの情熱に感化されて熱狂する風習は、
	どのような文化でも生まれ得るのでしょうね。
	魔法使いたちは厄災の魔力の気配が近づくと、みな気が昂ぶるので、
	人間たちからすれば少々……。
	お行儀の悪い夜だったかもしれませんが。
晶	そ、そうなんだ……。
	（詳しく知りたいような知りたくないような……）
シャイロック	まあ、それも、私が賢者の魔法使いになるまでのことです。
	今は定例の休業日ですね。
晶	それじゃあ、お客さんたちは、残念がっているんじゃないですか？
シャイロック	そうですね。
	皆で集まりたいから、お店だけ開けてくれないかとよくせがまれるんですが。
	この国の魔法使いの素行は、私も良く知っていますから。丁重にお断りしています。
`},
{id:11418,title:"友好の証",type:"personal",characters:["シャイロック","フィガロ"],memo:"シャイロック",
text:`シャイロック	どうぞ、フィガロ様。
フィガロ	やあ、これは久しぶりだな。
	賢者様。このワインは、神酒の歓楽街の友好の証なんだよ。
晶	友好の証ですか？どんな由来があるものなんですか？
フィガロ	オズと一緒に世界征服をしてた時、このあたりにも視察に来たんだよね。
	いい港町で、人間たちの交通の要になる場所だ。
	その時に、魔法使いが集まるって噂のこの店に立ち寄った。
	店主は俺の話を聞いて、怯えるでもなくこう言ったんだ。
	「支配者が誰になろうと構わないし、最近の人間たちにはうんざりしてたから、
	　たまには火傷をさせてもいいんじゃないですか
	　だけど、この街を燃やしたら、西の魔法使いはあなたたちの美意識にがっかりすると思いますよ」って。
晶	店主って、シャイロックのことですよね……。
フィガロ	もちろん。最初は俺も、何言ってるんだこいつ、と思ったけど……。
	出されたワインを飲んで、これがこの街の美意識かって納得したんだよ。
	西の魔法使いは権力より美を大事にする。この街に来て美味しいお酒を飲んでると、
	俺も美を理解する魔法使いの気分になれるのさ。
	それで、進路を変えたんだ。気分の良くなる場所は、残しておきたかったからね。
`},
{id:11419,title:"スポットの人々",type:"personal",characters:["ムル"],memo:"シャイロック",
text:`晶	神酒の歓楽街は、西の国の人間たちにとっては、どんな場所なんですか？
ムル	首都からは少し離れてて不便だからね、貴族が休暇で遊びに来るような土地だよ！
	生活に余裕がある人間が多いのかな。
	そのせいか、最近は治安の取り締まりが厳しくなってるね！
	いずれ魔法使いが進入禁止になったりするかも！
晶	魔法使いが……？魔法使いがいると、治安が悪くなると思われてるんですか？
ムル	仕方ないよ！魔法使いは人間を騙したり脅かしたりするから！
晶	そんな……。本当にそんなことするんですか？
	濡れ衣を着せられてるとかじゃなくて？
ムル	…………。
	するー！
晶	するんだ……。
ムル	魔法使いにとっても、
	ちょっとゆっくりしようかなって思った時に来るような場所だけど……。
	脅かされたり騙されたりするんじゃないかって、
	ビクビクしてるような人間を見かけちゃうと、ついね！
	西の国の魔法使いだもの！仕方ない！
`},
{id:11420,title:"スポットにいた魔法使い",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`シャイロック	こちらは、神酒の歓楽街から望む海のカクテルです。
	昔、お客様に頼まれて作ったものなんですよ。
晶	碧くて、表面がキラキラしてますね。すごく綺麗です……。
	どんな方のオーダーだったんですか？
シャイロック	この街の海の見える風景が好きだと、
	毎日、丘の上から景色を眺めて暮らしている魔法使いのお客様です。
	好きが高じすぎたのか、そのうち、自分自身が景色の一部になりたいと言い出して、
	海の中で生きる魔法を模索し始めたんですが……。結局、石になってしまって。
晶	お、溺れちゃったってことですか……？
シャイロック	おそらくは。ですが、前向きに考えるなら、彼の求めた成果なのかもしれません。
	海の底に沈んだ彼の石は、そのままにしておくのが、長い間、
	西の魔法使いの矜持でしたけれど……。
	人間が浜辺を無粋に開拓するうちに、見つかって拾われたでしょうね。
晶	そうなんですね……。
シャイロック	景色を見たら自分を思い出して欲しいと言っていたので、
	今でもなんとなく、海を見ていると思い出すことがあるんです。
	そういう時には、このカクテルを海に流すんですよ。
	魔法科学道具なんかじゃなく、美しかった頃の景色の一部になったのだと。
	私も、そう思いたいんでしょうね。
`},
{id:11421,title:"危険な場所",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`晶	シャイロックのお店には、いろんな魔法使いがくるんですよね。
	魔法舎にいる魔法使いと、お店で会うこともあったんですか？
シャイロック	賢者様がご存知の魔法使いなら、スノウ様やホワイト様、フィガロ様、
	チレッタやミスラも来たことがありますよ。
晶	……なんだか、北の魔法使いが多いですね。怖くなかったですか？
シャイロック	ふふ、大丈夫ですよ。お店やお酒を奪うつもりなら、態度で分かります。
	お店の扉をくぐって入ってくる方なら、
	お酒を楽しむために来ているのだと初めから分かっていますから。
	それに、強い魔法使いであればあるほど、
	こんな酒場を襲ったり壊したりすることに、なんの意味もありません。
晶	なるほど……。それもそうですね。
シャイロック	西の、中途半端に魔力のある者や、
	人間たちが迷い込んで来てしまった時の方がトラブルになりましたね。
	北の魔法使いたちは、もちろんおしとやかではなかったですけれど、
	みなさん、いいお客様でしたよ。
`},
{id:11422,title:"シャイロックの評判",type:"personal",characters:["クロエ"],memo:"シャイロック",
text:`晶	クロエ、ここで飲んでいたんですね。知り合いの方がいらしたんですか？
クロエ	ううん。さっき仲良くなったんだ。シャイロックの店の常連なんだって！
	みんな、シャイロックが大好きみたい。
常連の魔法使い	ベネットの酒場に来るやつは誰だってそうさ。
西の魔法使いは大抵、美しくて高尚なものが好きなんだ。
	みな、シャイロックの気を引いて、「素敵ですね」と言ってもらいたがってる。
	彼の趣味はたしかだからね。
晶	ああ、その気持ちは、とてもよくわかります。
	シャイロックに褒められると、なんだか誇らしい気分になれますよね。
クロエ	でも、シャイロックは優しくて、誰にでも肯定的でしょう。
	だからなおさら、心から喜ばせて驚かせたいんだって。
晶	たしかに、サプライズは好きそうです。
~~~~~~~~~	~~~~~~~~~
選択	プレゼントを贈ってみるのは？
常連の魔法使い	ああ、そりゃあ、新参者のやることさ。
	だけど、必ず通る道だ。みな、彼に贈り物したがるね。
クロエ	ダメなの？俺はプレゼント嬉しいし、シャイロックも喜んでくれると思うな。
常連の魔法使い	シャイロックの趣味も理解できないのに、自分の趣味を押し付けるなんて、
	なんともはしたないことだよ。
~~~~~~~~~	~~~~~~~~~
選択	楽しい話をしてみるのは？
常連の魔法使い	シャイロックはそれが一番喜ぶだろうな。
	だけど、彼が好きそうな、上品で、刺激的で、混乱した物語なんて、
	なかなか出会えないものだよ。
晶	たしかに……。
クロエ	だからムルと一緒にいるのかもねえ。
~~~~~~~~~	~~~~~~~~~
晶	プレゼントのハードル、めちゃくちゃ上がりますね……。
常連の魔法使い	常連になればなるほど、彼には触れずに、眺めながら美酒を嗜むのが、
	この店の一番の楽しみ方だってわかるのさ。
クロエ	ふふ……。シャイロック、人気者だな。
	魔法舎で一緒に暮らしてるのが、得意な気分になっちゃうね！
`},
{id:11423,title:"スポットの名物",type:"personal",characters:["ラスティカ"],memo:"シャイロック",
text:`晶	あれ？ラスティカ……、なんだかいつもと違いますね。
	もしかして、お化粧してるんですか……？
ラスティカ	いいえ？……ああ、きっとこのカクテルのせいですね。
ラスティカは微笑んで、長い指で逆三角形のカクテルグラスをつまむと、赤いお酒を揺らして見せた。
ラスティカ	ルージュベリーのカクテルです。
	ルージュベリーの実は、食べると唇が実の色に染まるんですよ。
	赤いルージュベリーは西の国の特産品です。
	リキュールになっても、少しだけ効果が出るのかもしれません。
	よろしければ、賢者様もどうぞ。
シャイロックに頼んで、もう一杯作ってもらいましょう。
晶	あ、いや、俺は大丈夫です。
	でも、びっくりしました。唇の色だけで、けっこう雰囲気が変わるものですね……。
ラスティカ	そうですか？　……どんな風に？
晶	えーっと……。
答えに迷っている俺を優しく見つめながら、ラスティカがグラスに口をつけた。
いつもより色づいた唇は、どことなく生々しい。
ロ元を見すぎてた事に気づいて、目を逸らす。からかうように笑う吐息を聞いた気がする。
この感覚は知っている。
晶	……なんだか、シャイロックと話しているみたいな感じです。
ラスティカ	はは。この場所では、きっと褒め言葉ですね。
	乾杯、賢者様。次はシャイロックのようなあなたと、お話できますように。
`},
{id:11424,title:"スポットでの発見",type:"personal",characters:["シャイロック","レノックス"],memo:"シャイロック",
text:`晶	レノックスも、シャイロックのお店に来たことがあるんですか？なんだか意外です。
レノックス	ずいぶん昔の話ですよ。その……、人探しをしていた頃に。
シャイロック	お話を伺うに、相当あちこち探していたようで。
	それでも見つからないなら、どこかに隠れているのではと助言した覚えがありますね。
	それよりも彼自身が、思い詰めて疲れた顔をしていました。
	だから、引き止めてお酒をお勧めしたんです。
	この街は景色も良くて、お酒も美味しいところだから、少し癒されて行くと良いですよ、と。
晶	レノックスはなんて？
レノックス	俺は……。
	断りました。大切な人が傷ついているのに、自分だけ癒されることはできないと。
シャイロック	覚えていますよ。私は、その真面目で実直な返答が、とても気に入ったんです。
レノックス	だから親切にしてくれたのか……。シャイロックには、続けてこう言われました。
	「あなたの心が硬いままでは、探し人に再会できた時にも、
	その方を癒してあげられないでしょうね」……。
シャイロック	ふふ、それも覚えています。
	ですが、まさか南の魔法使いとして、あなたと再会するとは思いませんでした。
レノックス	俺もだ。乾杯を。
シャイロック・レノックス	すべての再会に。
`},
{id:11425,title:"凄腕の交渉術",type:"personal",characters:["オズ","ラスティカ"],memo:"シャイロック",
text:`晶	あれ、オズとラスティカ……？
	珍しい組み合わせですね。二人で飲みに来たんですか？
オズ	ああ。
ラスティカ	偶然、魔法舎のバーで鉢合わせたのですが、
	今日はシャイロックがこちらの店にいたので、バーが閉まっていたんです。
	ですが、オズ様と居合わせるなんて、
	僕にとっては貴重で興味深い機会でしたから、逃したくなくて。
	お願いして、一緒に連れて来ていただいたんですよ。
	賢者様にもお会いできるなんて、本当に素敵な夜ですね。
晶	……オズが了承するなんて、なんだか意外ですね。
オズ	断ったが、食い下がられた。
晶	すごいな……。どんな交渉をしたんですか？
ラスティカ	日が暮れたらあなたは魔法を使えなくなりますが今のうちなら、
	僕を連れてベネットの店まで行くことができますよ、とアドバイスしたんです。
晶	連れて行ってもらう側なのに……？
オズ	名案を思い付いたように頼み事をしてくる邪気のなさが、
	子供の頃のアーサーに似ていて、断りきれなくてな……。
晶	なるほど。
ラスティカ	オズ様、ありがとうございました。
	お礼に、僕のおすすめのワインをご馳走させてください。
晶	（西の国の魔法使いには、魔法舎の怖めの魔法使いたちも、
	　ちょっと振り回されてる感じがして面白いな……）
`},
{id:11426,title:"マナエリア",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
シャイロック	パワースポット……。マナエリアのことでしょうか？
	マナエリアとは、自然と精神が安定し、魔力の回復や集中力を得られる固有の場所のことです。
晶	それです！シャイロックにもマナエリアがありますか？
シャイロック	ええ。私のマナエリアはワイナリーです。
	元は、生まれた家が営んでいた醸造場がマナエリアだったのですが、時代の波に飲まれて潰れてしまって……。
	今は固定の場所ではなく、お気に入りのワイナリーのいくつかを、順番に訪れていますよ。
晶	そういうこともあるんですね……。
	やっぱり、お酒が好きだから、作っている場所が落ち着くんでしょうか？
シャイロック	そうかもしれません。
	作り手の手間や、整然と保たれた温度、その神経質さに反したワインの芳醇な甘い香り。
	あの薄暗くて居心地のいい空間に、様々な想いの交錯を感じて、胸が高まる感覚を覚えますね。
	考え事をするような時や、何も考えたくなくなった時に、訪ねるようにしています。
`},
{id:11427,title:"アミュレット",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`晶	マナエリアから長く離れる魔法使いは、
	マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	シャイロックもアミュレットを持ってますか？
シャイロック	ええ。私のアミュレットは、このワイングラスですね。
シャイロックは、机の上に置いてある、飲みかけのワインが入ったグラスを示した。
精巧な曲線がオレンジの照明を照り返している。
晶	アミュレットって、魔法使いのお守りみたいなものかと思いましたけど、
	シャイロックは普段使いしてるんですね。
シャイロック	こんなに美しいグラスを使わず飾って眺めるだけなのは可哀想でしょう。
	ワインを楽しむ時の相棒のようなものです。
	私のマナエリアはワイナリーです。
	思いを馳せる時に必ず手元にあるワイングラスが自然とアミュレットになりました。
	しばらくワイナリーに出向けない時も、このグラスに口をつければ、あの場所の湿度や香りを思い出せるんですよ。
晶	なるほど……。
	マナエリアにいる時のように浸れるアイテムがアミュレットになるんですね。
シャイロック	賢者様がアミュレットをお選びになる時は、ぜひご相談くださいね。
	あなたの友となるアイテムを、私がご紹介する時間は、とても楽しそうです。
`},
{id:11428,title:"嘘と悪戯",type:"personal",characters:["シャイロック","ムル"],memo:"シャイロック",
text:`ムル	賢者様！起きて、賢者様！
晶	…………は。ムル……。起こしてくれて、ありがとうございます。
	（知らぬ間に、ソファで寝ちゃってたみたいだ。あれ？なんだか、あったかい……）
シャイロック	……。
横を向くと、シャイロックの顔が目の前にある。
俺はシャイロックに寄りかかってしまっていたようだ。
晶	わっ！シャイロック、すみません……！
シャイロック	……。
晶	あれ？シャイロックも寝てるのか……。
ムル	ううん！シャイロックはこれ以上ないくらい起きてるよ！
晶	え！？
シャイロック	……ムル、意地の悪い人。賢者様の反応を楽しんでいたのに。
	ふふ。いたずらは甘い毒ですね。癖にならないよう、気をつけないと。
`},
{id:11429,title:"家族",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`晶	シャイロックは仕草が上品ですよね。
	やっぱり、貴族の出身だと、マナーが厳しかったんですか？
シャイロック	厳しくされた記憶はあまりありませんね。
	丁寧な振る舞いが求められましたが、私自身、丁寧な振る舞いが好きでしたから。
晶	じゃあ、自然に身についたものなんですね……。
	シャイロックの家族って、どんな人達だったんですか？
シャイロック	私は自分の店を開くまでの長い間、代替わりする一族たちと暮らしていました。
	ですから、色々な人がいましたね。
	賢い人、愚かな人、美しい人、醜い人、商売の上手い人、勘定の下手な人、優しい人、冷淡な人……。
	どんな人も面白くて、それなりに好きでした。
晶	なんとなく、賑やかそうな暮らしですね。
	この魔法舎のバーと、似たような雰囲気がする気がします。
シャイロック	ふふ。そうかもしれません。私といえば、魔法使いでしたから、
	時代や情勢に合わせて頼られたり疎まれたりしました。
	愛しい者たちに手をかけて面倒を見るのが、元々好きだったのかもしれませんね。
晶	それって、ムルも含まれるんですか？
シャイロック	さあ、どうでしょうね。
`},
{id:11430,title:"友人への想い",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`晶	シャイロックはムルの友達で、ムルの魂が砕け散ってしまった時から、
	ムルの面倒を見ているんですよね。
シャイロック	そうですね。
晶	すごく友達思いですね。
	別人みたいになってしまった友達のために、自分はそこまで出来るかどうか……。
シャイロック	違いますよ、賢者様。このエピソードは特に美談ではないんです。
	心温まるような友情の話とは別口です。
晶	と言うと……？
シャイロック	ただ、もう一度元のムルに会って、文句が言いたかったんです。
	人の忠告も聞かないで、仕様もない男だって。
	砕けた魂の欠片の行方も、最初は必死になって探していましたけれど、今はなすがままに任せていますしね。
晶	それはどうしてなんですか？
シャイロック	ムルがいない日々に慣れたことと、
	今傍にいるムルとの交流で、十分、満たされているからでしょうか。
	……ああ。やはり、十分というのは嘘ですね。
	いくらかは、かつてのムルに会いたいです。
	ふふ。恋しがるのも馬鹿らしいほど、憎らしい友人なのに……。
	私も結局、仕様もない男なんですよ。
`},
{id:11431,title:"素敵な夢",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`シャイロック	賢者様、髪の毛がまだ少し濡れていますね。ちゃんと乾かさないと風邪を引きますよ。
	どうぞ、そこに座ってください。
	《インヴィーベル》
晶	わっ、温かい風が……。もしかして髪の毛を乾かしてくれるんですか？
シャイロック	ええ。熱かったら教えてくださいね。
晶	（シャイロックって本当に面倒見がいいなあ。親みたいというか……。
	　そのせいかな。こうしていると、なんだか、とっても……落ち、着く……）
シャイロック	賢者様の髪は指通りがいいですね。何か特別な手入れをなさっているんですか？
晶	……すう、すう。
シャイロック	賢者様、眠ってしまわれたんですか？
	西の魔法使いをこんなに信用されては、悪戯もできずに困ってしまいますね。
	おやすみなさい、晶様。いい夢をご覧になりますよう。
`},
{id:11432,title:"嘘と微笑み",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`シャイロック	賢者様。ちょうどいいところにいらっしゃいました。
	特製魔法薬のカクテルを召し上がりませんか？
	飲むだけで疲れが吹き飛ぶ優れものです。今日の任務は大変だったと伺ったので。
晶	栄養ドリンクみたいなものかな……。
	ありがとうございます、シャイロック。さっそくいただきます。
~~~~~~~~~	~~~~~~~~~
選択	……甘い！
晶	うん、少し甘みがあるのに後味がスッキリしていてとても美味しいです！
シャイロック	……全部お飲みになったんですね。
	実はこのカクテル、目の前にいる者に恋をしてしまう媚薬なんです。
~~~~~~~~~	~~~~~~~~~
選択	……爽やか！
晶	ふわっとハーブの香りがしていて、ミントみたいな風味で爽やかですね！
	とても美味しいです！
シャイロック	……全部お飲みになったんですね。
	実はこのカクテル、目の前にいる者の思う通りの幻覚を見る薬なんです。
~~~~~~~~~	~~~~~~~~~
選択	……酸っぱい！
晶	わ、酸っぱい！
	けど、なんだかクセになる酸っぱさで、とても美味しいです！
シャイロック	……全部お飲みになったんですね。
	実はこのカクテル、目の前にいる者の言うことに何でも従ってしまう薬なんです。
~~~~~~~~~	~~~~~~~~~
晶	えっ……！？
シャイロック	私を見ていると、心臓が苦しくなって来ませんか？その反応が兆候なのですが……。
晶	……心臓は大丈夫ですが、心なしか体が軽くなった気がします。
	これ、やっぱり特製魔法薬ですよね？
シャイロック	ふふ、すみません。
	いつも頑張ってくださる賢者様にお礼のつもりでお作りしたんですよ。
晶	そうだったんですね、ありがとうございます。
	シャイロックの冗談は少しわかりにくいから、一瞬信じちゃいました。
シャイロック	……次回はちゃんと賢者様に効果が出るように改良いたします。
	楽しみに待っててくださいね。
晶	（じょ、冗談だったんだよね？）
`},
{id:11433,title:"感じたこと",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`シャイロック	賢者様、ご意見を伺っても良いでしょうか？
晶	はい、もちろんです。
シャイロック	そちらのノンアルコールカクテルは、まだ試作品なんです。
	賢者様は、何が足りないと思います？
晶	カクテルについてですか！？俺より、適任がいるのでは……。
	（シャイロックのセンスは抜群だし……。いい意見が出せるか自信がないな）
シャイロック	ふふ、賢者様。私が聞きたいのは、あなたの意見です。遠慮する必要はありませんよ。
晶	シャイロック……。ありがとうございます。
	それじゃあ、もう少し酸味があると、さっぱりして飲みやすいかも、と思いました。
シャイロック	なるほど。それでは、レモンを絞ってみましょう。
	今夜はこのまま、試飲に付き合っていただけますか？
	あなたの感じたことを、もっと聞かせください。
`},
{id:11434,title:"気分転換",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`晶	今日は何も予定がなくて……。せっかくだから気分転換をしてみようと思っています。
シャイロック	それなら、私に任せるのはいかがです？きっと気持ちのいい休日にして差し上げます。
晶	バーに来て欲しいと言われたけど……。何が起きるのかな？
シャイロック	いらっしゃいませ、賢者様。まずは、こちらのケープを召していただけますか？
シャイロックが、綺麗なケープを着せてくれた。繊細な飾りがしゃらしゃらと揺れている。
シャイロック	クロエが快く貸してくれました。次は髪を触っても良いですか？
晶	は、はい……。
シャイロック	そこにドリンクを用意してあります。髪の準備が整うまで、くつろいでくださいね。
晶	ありがとうございます。あの、これは一体……？
シャイロック	今日は、別人になりきって遊びませんか？
	西の魔法使い達も、あとで遊びに来るよう、誘っておきましたから。
	それまで、私に飾らせてくださいね、賢者様。
`},
{id:11435,title:"得意な魔法",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`晶	シャイロックは、得意な魔法ってありますか？シャイロックにしか使えない魔法とか。
シャイロック	ええ。ありますよ。たとえば、そうですね……。
シャイロックは長いパイプを取り出して、深くひとくち吸い込んだ。
花の香の煙を吐きながら、呪文を唱える。
シャイロック	《インヴィーベル》
晶	あ……、あれ……？
シャイロックの声が頭に響くと、突然、目の回るような眠気に襲われた。
細い指が、足元をふらつかせる俺の背を支えて、そばにあるソファへ促してくれる。
シャイロック	私の得意な魔法は、感覚を酔わせること。
	群衆を、ふんわりと、いい気分にすることができます。
	もちろん、悪い夢に溺れさせることも。
	ですが、安心してください。あなたに使うことはまずないでしょう。
晶	じゃあ……、急に眠くなったのは……、……シャイロックの魔法なんですね……。
	たしかに気持ちが良くて……、……本当に眠ってしまいそう……。
シャイロック	賢者様。昨夜は遅くまで、書類に目を通していたのだとか。
	お疲れが出て体調を崩す前に、少し休んで行かれるとよろしいですよ。
晶	んん……。……すー……、すー……。
シャイロック	ふふ。可愛らしい寝顔ですね。
`},
{id:11436,title:"私とダンスを",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`晶	シャイロック、こんばんは。あ、音楽がかかってる……。それは、蓄音機ですか？
シャイロック	ええ。曲が変わると、空間の雰囲気が変わるでしょう？
	今夜の人に、ちょっとしたサプライズです。
晶	（テンポが良くて、綺麗な曲……。舞踏会とかでかかっていそうだ）
シャイロック	賢者様。
シャイロックは、俺に手を差し出した。
シャイロック	私と踊っていただけますか？
晶	え、踊りですか……！？
~~~~~~~~~	~~~~~~~~~
選択	俺には難しそうだな……。
シャイロック	それなら、こうしましょう。
~~~~~~~~~	~~~~~~~~~
選択	教えていただけますか？
シャイロック	もちろん。まずはこちらで、慣れていきましょう。
~~~~~~~~~	~~~~~~~~~
シャイロック	《インヴィーベル》
晶	わっ、体が勝手に音楽に合わせて動いてる……！これは楽しいかも……！
シャイロック	ふふ。お上手ですね、賢者様
`},
{id:11437,title:"紋章",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`晶	シャイロックの賢者の紋章は、左胸にあるんですよね。
シャイロック	ええ。ご覧になりますか？
晶	……もしかして、紋章を見せてくれと言われたら、みんなに見せているんですか？
シャイロック	おや。
	ずいぶん可愛らしいことをおっしゃいますね。前の賢者様風に言えば、花まるですよ。
晶	ヤキモチを妬いたわけじゃないです……！なんとなく心配になって……。
シャイロック	ふふ。それはどうも。
	私も花まるの回答を返すとすれば、あなたにだけです。
晶	からかわないでください……。紋章が出てきた時は驚きましたか？
シャイロック	多少は、ですね。
	私も魔法使いの中では長生きな方ですから、いずれ順番が来るのかもとは思っていました。
	私より先に、ムルが賢者の魔法使いに選ばれて、役目や紋章の話は聞いていましたしね。
晶	ムルは、シャイロックが選ばれた時に、何か言っていましたか？
シャイロック	彼に伝えたら、「初めて一緒に仕事をするね」、と。
	私も、それは少し新鮮で、面白そうだと思いましたよ。
`},
{id:11438,title:"猫への仕掛け",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`晶	あ、子猫がいる……。おいで、ミルク持ってきてくるからね。
	ああ、向こうに行っちゃった。怖がらせちゃったかな。
シャイロック	賢者様、どなたとお話されてるんです？子供に話しかけるような口調でしたが。
晶	子猫がいたんです。でも、向こうに行ってしまって……。
シャイロック	そういうことでしたら。子猫さん、私と遊びましょうか。
シャイロックが呼びかけると、子猫がゆっくりこちらに近づいてくる。
そのままシャイロックの足にじゃれついて、頬ずりをしはじめた。
シャイロック	よしよし。良い子。
晶	すごい！子猫にどんな魔法を使ったんですか？
シャイロック	ふふ。魔法は使っていませんよ。
	仕掛けが気になるなら、賢者様にも試して差し上げます。
	今ここで、いかがでしょうか？
`},
{id:11439,title:"秘密のプレゼント",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`晶	こんばんは、シャイロック。俺を探していたって聞いたんですが、何かご用でしたか？
シャイロック	ああ、賢者様。お渡ししたいものがあったんですよ。
	私が生まれた地方のワインです。
	ノンアルコールのものですから、賢者様もお召しになれますよ。
晶	わあ……！前に話してくれたものですよね。ありがとうございます！
シャイロック	いえいえ。いつも頑張ってくださっているお礼です。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
シャイロック	朝食は取らないことも多いですね。
	ゆっくり起きて、西のみなの気が向いたら、魔法の授業や練習をしています。
	日が暮れる頃から魔法舎のバーを開けて、最後のお客様が帰ったら、
	私も部屋に戻って眠ります。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
シャイロック	魔法舎のバーにいるときは、グラスや道具の手入れをしています。
	部屋にいるときは、晩酌をしながら考え事をしたり好きなことをしていますよ。
	ゆっくりと、ひとりで過ごす時間はとても好きですね。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
シャイロック	ええ。誰かの話を聞くのはバーのカウンター越しがちょうどいいですが、
	私の話をする時は部屋に二人きりがいいですね。
	もちろん、ムルは勝手に遊びに来ますけど。
~~~~~~~~~	~~~~~~~~~
シャイロック	わざわざ来て頂いてすみません。
	バーのカウンターでお渡しすると、北の魔法使いに奪われかねなかったので。
晶	そんなにいいものなんですね……。大事に頂きます。
シャイロック	よろしければ、部屋で一杯飲んで行かれませんか。
	お渡ししたワインを開けてもいいですし。
晶	いいんですか？なら、これを早速！
シャイロック	ぜひ。お口に合いますように。
`},
{id:11440,title:"眺めるために",type:"personal",characters:["シャイロック","ムル"],memo:"シャイロック",
text:`晶	シャイロック。ここで本を読んでるんですか？
シャイロック	……静かに。
シャイロックは人差し指を口元に当てて、ゆっくり微笑んだ。
晶	（『静かに』のポーズかな？でも、どうして……あ）
ムル	…………。
晶	（ムルが猫みたいに丸まって寝てる……）
	じゃあ、シャイロックがここで本を読んでいるのって……。
ムル	読んでいるのって？
晶	わあ、ムル！ええっと、ですね……。
シャイロック	貴方を眺めるためですよ、ムル。
ムル	なんで？
シャイロック	さあ、自分で考えてみてください。
	あなただけには教えませんから。
`},
{id:11441,title:"寿命のグラス",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`シャイロック	では、こちらのグラスを洗っていただけますか？
晶	（シャイロックのバーの手伝い、緊張するな。グラスを割らないように気をつけないと）
	あ……！
シャイロック	賢者様、どういたしました？
晶	このグラス、飲み口が欠けてしまっているみたいです。
	俺が乱暴に洗ってしまったのかも。
シャイロック	いいえ、違いますよ。
	長く使っているグラスですから、寿命が来ていたのでしょうね。
晶	このグラス、とても綺麗なものなのに。
	魔法で直せたりしませんか……？
シャイロック	直せますよ。
	でも、直さないでそのままにしておこうと思います。
晶	どうしてですか？
シャイロック	何でも出来てしまうのは、便利でつまらないですから。
	少し不便な方が、私には楽しいです。
`},
{id:11442,title:"カクテルの秘密",type:"personal",characters:["⑭"],memo:"シャイロック",
text:`シャイロック	賢者様、今夜は特別なカクテルが手に入ったんです。ノンアルコールもありますよ。
晶	わあ……！海みたいな色合いですね！グラデーションが綺麗……。
	（それに、いい香り……。
	　思わず眠くなるような気持ちよくなるような不思議な香りだ）
	それじゃあ、いただきますね。
シャイロック	賢者様、お待ちください。実を言うと、これは飲めないカクテルなんです。
晶	え？
シャイロック	香りを楽しむための嗜好品です。
	魅惑的な香りで人を惹きつけて命を奪う毒花から蜜を採っています。
	主に、蜜を薄めて昏睡薬として使われますね。
晶	危険すぎませんか！？
シャイロック	嘘です。
晶	え！？じゃあ、飲んで大丈夫なやつですか？
シャイロック	はい。ふふ、賢者様の驚いた顔を拝見したくて、つい……。
晶	（嘘だと思えないくらい真実味がありすぎる……）
`},
{id:11443,title:"月明りの下で",type:"personal",characters:["西"],memo:"シャイロック",
text:`晶	西の国の魔法使いが、授業に出たまま戻ってこないけど……。
	何かあったのかな？
シャイロック	こんばんは、賢者様。お散歩ですか？
晶	シャイロック！何もなかったようで安心しました。他の皆さんはどこですか？
シャイロック	どうやらご心配をおかけしてしまったようですね。彼らはあちらに。
ムル	賢者様ー！見て！〈大いなる厄災〉とお茶会だよ！
クロエ	わあ、ムル！カップを持ったまま、飛んだら危ないよ！
ラスティカ	ふふ。なんて素敵な光景なんだろう。
シャイロック	ご覧の通り、授業終わりに、皆でお茶会をすることにしたんです。
~~~~~~~~~	~~~~~~~~~
選択	あの机と椅子はどこから……？
シャイロック	バーにあるものを、魔法でこちらに移動させました。
	月明かりの下で、お茶会するのも良いでしょう？
~~~~~~~~~	~~~~~~~~~
選択	お茶会？
シャイロック	根を詰めてばかりでは、つまらないですから。働いたぶんは、遊びましょう。
~~~~~~~~~	~~~~~~~~~
シャイロック	賢者様も、お茶を飲んで行かれます？
晶	いいんですか？
シャイロック	もちろん。素敵な夜にいたしましょう。あなたが、笑いくたびれてしまうまで。
`},
//ムル
{id:11501,title:"スポットの印象（１）",type:"personal",characters:["クロエ"],memo:"ムル",
text:`晶	未開の天文台は、静かで綺麗で、いいところですね。
クロエ	そうだね。でも、うーん、俺はちょっと寂しいかも。
晶	寂しいですか？
クロエ	この辺って、他に何にもないからさ。
	夜になると静かすぎて、昨夜はちょっと落ち着かなかったな。
	俺の故郷は慌ただしくて貸しい街だったからさ。
	夜の間も、何処かの店で誰かが働いてて、人の気配や灯りが絶えなかったんだ。
	だから静かすぎるところは、ひとりぼっちになったみたいで……、ちょっとね。
晶	なるほど。天体観測には向いてるんでしょうけど。
クロエ	魔法使いは、静かな場所が好きな人が多いかも。
	でも、西の国の魔法使いは、人の気配が好きなんだ。
	魔法舎のみんなにも変わってるって言われるの、少しわかった気がするよ。
`},
{id:11502,title:"スポットの印象（２）",type:"personal",characters:["カイン"],memo:"ムル",
text:`カイン	ここは夜空が綺麗だな。まるで星を見るために出来た場所みたいだ。
	こんな広大な空を見てると、いろんな考えが浮かんで消えていくよ。
晶	そうですね……。
カイン	宇宙のこととか、世界のこととか……、明日の夕飯はなんだろうってこととかさ。
晶	え？急に考え事の規模が身近になりましたね……？
カイン	いろんな考えだって言ったじゃないか。
	そうやって考えてるうちに、なんだか自分や、自分の悩み事なんかも、ちっぽけに思えてくるだろ。
晶	ああ、それはわかる気がします。
カイン	そうすると、迷ってたけど、市場で見かけたあのブーツ、買っちまおうかな、とか。
	思い切りがよくなって、ここにきたあとはいつも、何か買って帰っちまうんだよ。
	心のつっかえを取ってくれるような、気持ちのいい場所だよな。
`},
{id:11503,title:"スポットの印象（３）",type:"personal",characters:["ルチル"],memo:"ムル",
text:`ルチル	わあ、賢者様、ここは天文台も綺麗ですけど、海も見えて素敵なところですね！
	海だー！すごいなあ！
晶	ルチルは海が好きなんですか？
ルチル	私たちが住んでいたところは、海までとても遠かったんです。だから、珍しくって。
	西の国の海は、泳げる場所もあるそうですよ。
	賢者様は、海で泳いだことがありますか？
~~~~~~~~~	~~~~~~~~~
選択	あります。
ルチル	すごい！いいなあ。サメやクジラに会えましたか？
晶	そ、そこまで沖に出たことはないんですけど……。
~~~~~~~~~	~~~~~~~~~
選択	ないです。
ルチル	私と一緒ですね！じゃあ、今から海に飛び込んで、二人で初めて泳ぐ日にしませんか？
	この岬から、どぼーんと行きましょう！
晶	ま、待ってください。どぼーんって高さじゃないですよね！？
~~~~~~~~~	~~~~~~~~~
ルチル	そういえば、水の中って息ができないのに、
	魔法使いじゃない方はどうしてるんですか？
晶	えーっと……。泳ぎながら息継ぎをして……。
ルチル	ふむふむ……。
晶	海水浴ならもっと、波が落ち着いている所がいいと思いますよ。
	この辺は潮が強そうな感じです。
ルチル	そうなんですか。なら、今日は残念ですけど、いつか、海水浴をご一緒しましょうね。
`},
{id:11504,title:"ブレイクタイム（１）",type:"personal",characters:["ムル","ラスティカ"],memo:"ムル",
text:`ムル	すー、すー。
晶	わっ、ムル。こんなところで寝てると、風邪を引きますよ。
	あれ、メモが貼ってある……？
	ムルが書いたみたいだけど、こっちの世界の文字、読めないんだよな……。
	どうしよう。
	疲れてるのかもしれないけど、起きなきゃいけない用事があるかもしれないし……。
~~~~~~~~~	~~~~~~~~~
選択	起こしてみる
晶	ムル、起きてください。ムル……。
ムル	むにゃむにゃ……。
	がおー！！
晶	うわっ！？
ムル	……すー、すー。
~~~~~~~~~	~~~~~~~~~
選択	寝かしておく
ムル	すー、すー。
晶	うーん……。起こすのがかわいそうになる寝顔だな……。

晶	あ……、俺の膝を枕にしてまた眠っちゃった……。
俺は思わず寝てるムルの頭を撫でた。
ムル	むにゃむにゃ……。ゴロゴロゴロ……。
晶	（気持ち良さそうだ……）
~~~~~~~~~	~~~~~~~~~
ラスティカ	賢者様、ムル。お昼寝ですか？
晶	ラスティカ、ちょうどいいところに！このメモ、読めますか？
	ラスティカ	これは……、ムルの字ですね。
	「昨夜は徹夜で月の観測をしていて、今夜も徹夜で月の観測をするから、
	　誰も俺を起こさないで！」
晶	起こさないのが正解でしたか！
ラスティカ	賢者様のお膝は寝心地が良さそうです。ふふ、こんなに静かなムルは珍しいですね。
晶	たしかに……。
`},
{id:11505,title:"ブレイクタイム（２）",type:"personal",characters:["シャイロック"],memo:"ムル",
text:`晶	ここにいたんですね、シャイロック。星を見ていたんですか？
シャイロック	いいえ、賢者様。私は星よりも、海を見るのが好きなんです。
	この天文台は海が近くて、波の音が心地いい。
晶	本当だ、天文台のこちら側は、一面海が広がってるんですね。いい景色だな……。
シャイロック	私は港町生まれなので、海のそばは落ち着きます。ほら、賢者様、ご覧になって。
晶	海面ですか？あ……、海の中が光ってる……？あれは、星……？
シャイロック	ふふ、クラゲですよ。夜になると集まってくるんです。
晶	あ、クラゲなんだ！クラゲは俺の世界にもいました。あんなに光るんですね……。
	わ……。海の中も星空みたいになってきた。
シャイロック	この辺りは、今の西の国では珍しい、自然の多く残る、美しい場所です。
	……建てた者のセンスがいいんでしょうね。
`},
{id:11506,title:"スポットの思い出（１）",type:"personal",characters:["⑮"],memo:"ムル",
text:`ムル	天文台を建てる時、お金がなかった！
	だから、国中の富豪たちから、建設資金を集めたんだ。
晶	ムルが資金集めからやったんですね。
ムル	そうだよ！俺、誰かに、「お金出して！」って言いに行くの好きー！
晶	そ、そうなんだ……。
	でも、昔のムルは、なんていうか、人を怒らせがちだったんですよね……？
	みんな、いいですよって言ってくれましたか？
ムル	うん！１００％、いいって言うよ。
晶	１００％！？どんな交渉術で……。
ムル	出すって言うまで帰らない！そうすると、みんな出す！
晶	（厄介だな……）
ムル	賢者様にして欲しいことができたときも、多分同じことする！
	きっと賢者様も、１００％、いいって言うよ！
`},
{id:11507,title:"スポットの思い出（２）",type:"personal",characters:["⑮"],memo:"ムル",
text:`ムル	天文台を建てる時、俺が所長になれって言われて、初代所長のパティアと揉めた！
	俺は定職とか、定住とか、絶対無理！
晶	ムルは奔放なのが長所ですもんね。難しそうなのはわかります。
ムル	でも、昔は女の立場が弱くて、
	女が所長になんてなったら、天文台はすぐに潰されるって。
	それは正論だったけど、ロ八丁手八丁で、なんとかパティアを所長にしたんだ。
~~~~~~~~~	~~~~~~~~~
選択	口八丁って……？
ムル	たくさん褒めたり、たくさん宥めたりね！
~~~~~~~~~	~~~~~~~~~
選択	手八丁って……？
ムル	賢者様もやってみる？
~~~~~~~~~	~~~~~~~~~
ムル	ともかく、天文台の存続には、確かに根回しが必要だった。
	だから、彼女を売り込んだんだ。
晶	売り込み、ですか？
ムル	社交場やパーティーに出かけて、偉い人に気に入ってもらうんだ！
	俺の演説ですぐに彼女は人気者になったよ！
	でも色仕掛け用にドレスを送ったら、学者だからこんなの着れないって怒られた！
	いい方法だったのに。
晶	（昔からムルは、一緒にいると振り回されて大変なタイプだったんだなあ……）
`},
{id:11508,title:"スポットの思い出（３）",type:"personal",characters:["シャイロック"],memo:"ムル",
text:`晶	シャイロックは、前にも天文台に来たことがあるんですよね。
シャイロック	ええ。建設している間から、再三誘われていましたから。
	完成して、しばらく経ってから見に行きましたよ。
晶	そういえば、天文台の完成パーティーには、行かなかったって聞きました。
シャイロック	焦らしたほうが、ムルも楽しめるかと思ったんですけれど。
	私の店に来ても、天文台をいつ見に来るのかと、その話しかしなくなったので、
	仕方なく。
晶	我慢できないムルが目に浮かびますね。
	きっと、シャイロックにも、天文台を見て欲しかったんですよ。
シャイロック	彼が見せたかったのは、〈大いなる厄災〉でしょう。
	そのための天文台でしたからね。望遠鏡を覗く前に、こう言われました。
	「改めて、俺の好きな人を紹介するね！」
晶	うわあ……。
シャイロック	憎らしい人です。
晶	でも、仕返しをされたということは、
	ムルも、シャイロックが来てくれないことに、焦らされてたんじゃないですか？
シャイロック	おや、お優しいご意見ですね。
	たしかにそう思っていれば、いくぶん溜飲が下がります。
`},
{id:11509,title:"ムルへの印象（１）",type:"personal",characters:["シャイロック"],memo:"ムル",
text:`晶	心が砕け散ってしまったばかりの頃のムルって、どんなだったんですか？
シャイロック	最初は言葉も通じなくて、服も着ないで飛び回っていました。
	まるでけだものでしたね。
晶	元のムルは、とても知性的な紳士だったんですよね。
	ギャップはショックじゃなかったですか？
シャイロック	ショックもありましたが……。
	少しずつ、言葉や情緒を覚えていくムルは、とてもしおらしくて可愛らしかったですよ。
	元に戻らなくてもいいかな、という気持ちと、戦う方が大変でした。
晶	今のムルは、だいぶコミュニケーションが取れますよね。
	どんな風に情緒を育てたんですか？
シャイロック	おや、ご興味がおありなら、賢者様もおためしになりますか？
	少し刺激が強いかもしれませんけど。
`},
{id:11510,title:"ムルへの印象（２）",type:"personal",characters:["クロエ"],memo:"ムル",
text:`晶	クロエから見たムルは、どんな印象ですか？
クロエ	うーん。可愛くてやんちゃ、って感じ。
	あと、あんまり会ったことないタイプ。
晶	確かに、ムルみたいな人って、なかなかいないかもしれないですね……。
クロエ	でしょ？
	一緒にいると、動物と遊んでるみたいな気持ちになるのに、
	急に賢いこと言い出すから驚くよ。
晶	あはは。ちょっと、わかります。
クロエ	あとは、宝石に詳しいから、服の飾りに使う石を選ぶときに、
	買い出しについてきてもらうことがあるんだ。
	道端の石ころみたいな安く売ってる石でも、
	ムルに教えてもらったやつは、削って磨くとピカピカになるんだよね！
	今度、月モチーフのアクセサリーを作ってあげるんだ。ほら、これがデザイン画だよ。
晶	わあ、かっこいいですね。きっと、ムルが喜びます。
クロエ	えへへ。だといいな！
`},
{id:11511,title:"ムルへの印象（３）",type:"personal",characters:["ラスティカ"],memo:"ムル",
text:`晶	ラスティカは、ムルのこと、どう思っているんですか？
ラスティカ	偉大で素晴らしい方だと、お噂はかねがね聞いていました。
	行く先々で、その功績を耳にしましたね。
	実際は無邪気なところがあって、愛らしい子供や、動物のように感じる時がありますが……。
	不意に哲学的な投げかけを受けて、言葉を詰まらせてしまうこともあるのです。
晶	わかる気がします……。ラスティカは何を聞かれたんですか？
ラスティカ	先日、チェンバロを弾いているところに、ムルがやってきて、僕にこう尋ねました。
	「なぜきみは、チェンバロを弾くのか？」
晶	それは……、哲学者に改めて聞かれると悩みそうな質問ですね……。
ラスティカ	そうなんです。考え込んでも答えが出ずに、
	しばらくの間、僕はチェンバロが弾けなくなってしまいました。
	そうすると、またムルがやってきて、こう尋ねました。
	「なぜきみは、チェンバロを弾かないのか？」
晶	（うわあ……）
ラスティカ	それで僕は考えるのをやめて、チェンバロを弾くことにしました。心のままに。
	ですが、問いがなければ考えることもなかった。
	彼と一緒に自分を探るのは、とても不思議で興味深い時間ですよ。
`},
{id:11512,title:"ムルへの印象（４）",type:"personal",characters:["シノ","ムル"],memo:"ムル",
text:`晶	シノはたまにムルと遊んでますよね。ムルのこと、どう思ってるんですか？
シノ	別に遊んでない。向こうが勝手に絡んで来るだけだ。
	急に構って来たかと思えば、急にいなくなるしな。気まぐれだよ。
	それに、ちょっとおかしいだろ、あいつ。
晶	ま、まあ……、言い方を選ばないと、そういうところもあるかもしれないですね……。
シノ	おかしいよ。なんか変だし。森の道案内の客で来たら断るタイプだな。
晶	そうなんですか？
シノ	あんなやつに関わるなんて、リスクが高すぎる。
	まあ、今はだいぶ慣れたし、仲間だからうまくやるけどな。
ムル	シノー！ちょうちょいる！！
シノ	おい待て。そっと捕まえろ。殺すなよ。
晶	（行っちゃった……
	　なんだかんだ、仲良くやってるみたいでよかったな）
`},
{id:11513,title:"ムルへの印象（５）",type:"personal",characters:["レノックス"],memo:"ムル",
text:`晶	レノックスは、ムルのことをどう思ってるんですか？
レノックス	可愛いですよ。少し、やんちゃですけど。
	……と言っても、彼の方がだいぶ年上ですから失礼になるのかもしれませんが。
晶	そんな気持ちになるのはわかります。この前は、一緒に釣りに出かけていましたよね。
レノックス	ああ。釣ったそばから魚を持って行って、食べてしまうので大変でした。
	新鮮な魚は美味しいと言っていましたが……。
晶	そ、そうだったんですね……。
レノックス	ムルは釣りには不向きでしたね。じっとしていられなくて。
	でも、何匹か取った魚を見て、どの辺りに群れていそうだとか、
	このあとどんな魚が来そうだとか。そういう助言をしてくれて、全部当たりました。
晶	すごいですね。魚の生態や、川の流れを見てたんでしょうか……？
レノックス	おそらく。彼自身は待つのに飽きて、すぐどこかへ行ってしまったんですけどね。
`},
{id:11514,title:"スポットゆかりの話（１）",type:"personal",characters:["⑮"],memo:"ムル",
text:`ムル	あそこら辺の海域から、あそこら辺の山奥まで、全部西の国の王家の領地なんだ！
	その王家の取り決めで、王族であっても、俺の許可がないと、
	未開の天文台の近くには、明るい建物が建てられないようになってる。
晶	ムルの許可？
ムル	そうだよ。大昔に一筆書かせたんだ。天体観測には光がとっても邪魔だもの！
晶	王族と、そんな約束を交わせるなんて、すごいですね、ムル……。
ムル	若君と、ギャンブルして勝って、誓約書を貰った！
晶	な、なるほど……。
	だからこの辺りは、西の国にしては珍しく、自然が多く残ってるんですね。
ムル	そう！都会は工場の煙や街の明かりで、視界が悪くて最悪！
	って、シャイロックに言ったら、「誰のせいでしょうね」って言われた！
	やぶへびだった！
晶	そうか……。
	西の国の魔法科学技術の発展は、ムルの発明や発見のおかげなんでしたね。
	シャイロックに怒られちゃったんですか？
ムル	にゃーん、ってした！シャイロックが怒りそうな時は、にゃーん、ってする！
`},
{id:11515,title:"スポットゆかりの話（２）",type:"personal",characters:["⑮"],memo:"ムル",
text:`ムル	思い出した！
晶	ムル、急にどうしました？何か大事なことですか？
ムル	天文台を建てた時、シャイロックを一番に招待したんだ。
	でも、シャイロックは一番にこなかった。
	こういう時、シャイロックはいつも、二番手か、三番手くらいで見に来る！
	一番にこないのが格好いいと思ってる。
	もしくは、その方が俺に格好がつくと思ってる。
晶	な、なるほど。昔から、二人の友情は複雑ですね……。
ムル	今もそうかな？試してみたいな！
晶	結局、一番最初に来たお客さんは、誰だったんですか？
ムル	スノウとホワイト！
	双子は昔から、新し物好きで、ミーハー！
`},
{id:11516,title:"西の国について",type:"personal",characters:["⑮"],memo:"ムル",
text:`晶	ムルは長い間、西の国で暮らしていたんですよね。
	やっぱり、この国が気に入っているんですか？
ムル	面白い質問だね！
	賢者様は自分の暮らす場所が気に入ってる？気に入ってる場所だから暮らしてるの？
	俺の部屋が気に入ったら、俺の部屋で暮らすかい？俺はね、大歓迎！
晶	そういう意味じゃなくて……。えっと、じゃあ、西の国のことが好きなんですか？
ムル	あはは。誘いをはぐらかした。答えにくかった？なぜ？どうして？
	今も、昔も、好きとか嫌いとかは気にしてないけど、
	好きとか嫌いとかの話はしないようにしてるよ！
晶	そうなんですか？
ムル	そう！この国が好きとか嫌いの話は、シャイロックに怒られる！
晶	シャイロックが？
ムル	だって、今の西の国がこうなってるのは、半分は俺のせいだから！
晶	（そうか……。西の国の科学魔法技術は、ムルが発明したんだった）
ムル	シャイロックが嫌いな西の国は、ほとんど俺のせいかもね！
	だから、気を遣ってるんだよ！
`},
{id:11517,title:"〈大いなる厄災〉について",type:"personal",characters:["⑮"],memo:"ムル",
text:`晶	ムルは〈大いなる厄災〉に恋をしているんですよね……。
	やっぱり、厄災が近付く夜は、わくわくしたりするんですか？
ムル	もちろん！すごく近くに来てくれるから、すごく嬉しい！
	厄災が近付く夜が一番好きだよ！
晶	怖くはないですか？それともいっそ……、厄災が来てしまえばと思ったりしますか？
ムル	思わないこともないけど、世界が滅びちゃうしねー。
	厄災のことを知りたいけど、厄災以外に知りたいことも、まだまだたくさんあるから！
晶	そうなんですね……。少しホッとしました。
ムル	今は俺が思い焦がれてるだけで、この恋を充分楽しめてる。
	いつか俺の方から、月に会いにいけたらいいなって、そう思ってるよ！
`},
{id:11518,title:"一晩中俺と",type:"personal",characters:["⑮"],memo:"ムル",
text:`ムル	天文台を建てる時、莫大な資金を出す代わりに、
	月に自分の名前をつけたがるおっさんがいて、迷惑だった！
	大好きなものにおっさんの名前がついてるの、賢者様は許せる？俺は無理！
晶	確かにちょっと困りますね……。
	でも、例えばどんな名前なら、新しく付いてもいいですか？自分の名前とか？
ムル	賢者様は、好きなものに自分の名前をつけるの？それって自己愛じゃない？
	でも、確かに、恋は、自己愛だって説もあるからいいのかな？
晶	そんなに深く考えて聞いたわけじゃないんですけど……。
ムル	面白いね！一晩中話せそうなテーマだ。
	賢者様の初恋とナルシズムについて教えてよ！
晶	は、初恋ですか！？
ムル	早く早く！納得できるまで話してくれなきゃかじっちゃう！
`},
{id:11519,title:"スポットの人々",type:"personal",characters:["⑮"],memo:"ムル",
text:`晶	この辺りに住んでるのは、やっぱり天文学者さんが多いんでしょうか？
ムル	そうかもね！よく知らないけど。
	この辺りに住んでる人は、星以外に興味ない。俺も含めて。
晶	な、なるほど……。魔法使いの天文学者さんは、ムル以外にもいるんですか？
ムル	いるいる！少ないけどね！でも、魔法使いは長生きだから、学者に向いてる！
	自分の好きなことに何百年も没頭できる。
	何かを研究していると、時間なんていくらあっても足りないから！
晶	長生きのムルでも足りないって思いますか？
ムル	全然足りないよ！まだまだまだまだ長生きしたい！
	オズやフィガロより！双子よりもずっと！
晶	そうなんですね……。それってどれくらいなんですか？
ムル	んー。
	８億年くらいかな？
`},
{id:11520,title:"スポットにいた魔法使い",type:"personal",characters:["ラスティカ"],memo:"ムル",
text:`晶	（あれ、ラスティカが誰かと話してる。この辺りに住んでる人かな……？）
ラスティカ	楽しい時間でした。ごきげんよう。
ラスティカのそばにいた人影は、彼に向かって軽く会釈すると、箒を取り出して、岬から飛び立った。
晶	魔法使いだったんだ……！ラスティカ、お知り合いですか？
ラスティカ	賢者様。
	先ほどここで、出会った方です。
	紹介できればよかったのですが、入れ違いになってしまいましたね。
晶	天文台に来るってことは、学者や、研究者だったんですか？
ラスティカ	いいえ、彼は星空ではなく、海に用事があったんです。
	この天文台の岬のそばの海は、海流のぶつかる場所があって、自然のエネルギーを強く感じられるんです。
	西の国は自然が少ないですから、この天文台には、魔法使いたちがよく訪れるのだと言っていました。
晶	なるほど……。確かに、西の国の中心は、機械や人が多くて自然が少ないですもんね。
ラスティカ	魔法は心を使います。
	喧騒に慣れているといえど、西の国の魔法使いも、心落ち着く場所が必要不可欠なんですよ。
`},
{id:11521,title:"危険な場所",type:"personal",characters:["クロエ"],memo:"ムル",
text:`クロエ	あれ！賢者様、出かけるの？
晶	ムルにおつかいを頼まれて。街の方まで。
クロエ	賢者様に！？もう、研究に没頭してるムルは、人使いが荒いんだから！
	俺も一緒に行くよ、賢者様。日が沈むとこの辺は真っ暗になっちゃうんだ。
	街からここまで、なんにもないだろ？
晶	確かに、そうでしたね……。ありがとうございます、クロエ。
クロエ	危ないからさ！帰りは箒で飛んで帰ってこようよ。
	西の国で、夜がこんなに暗い土地って珍しいんだ。
	どこも宝石みたいに明るい国だからさ。
	こんなところに篭って、星を見てて、真夜中におっかなくならないのかな……？
	賢者様はどう思う？
~~~~~~~~~	~~~~~~~~~
選択	怖くはないですよ。
クロエ	そうなんだ！？さすが賢者様、勇気があるんだね……。
~~~~~~~~~	~~~~~~~~~
選択	ちょっと怖いかも。
クロエ	だよねえ……！よかった、わかってくれて……。
魔法使いが暗闇を怖がるなんて、笑われちゃうかもしれないって思ってさ、
みんなには言い出せなかったんだよね。
~~~~~~~~~	~~~~~~~~~
クロエ	……ねえ。もし今夜、ここに泊まることになったら、一緒の部屋で寝てもいい……？
`},
{id:11522,title:"ムルの評判",type:"personal",characters:["シャイロック"],memo:"ムル",
text:`晶	あれ……、なんだか、天文台の人たちがバタバタしてるような……？
シャイロック	どうかなさいましたか。
天文台の研究員	昔、ムル様が書き記した計算式のようなものが発見されたのです！
天文台の研究員	昨日から職員全員が解読に当たっていますが、一向に解ける気配がありません。
	本人に聞いても忘れてしまった様子で……。
天文台の研究員	他からも応援を呼んで、皆で解読しなければ！
	ムル様の残した暗号を解いて、新しい発見につながった事は、
	一度や二度ではありません！
晶	そうですか……。大変そうだけど、なんだかみなさん楽しそうですね。
シャイロック	賢者様のおっしゃる通り。
	求めていたものが手に入りそうな瞬間は、誰しも心浮き立つものです。
晶	暗号解読なんてちょっと面白いな。あ、ほら、これが問題の写しみたいですよ。
	シャイロックには読めますか？
シャイロック	ええ。……おや、これは……。
晶	もしかして、シャイロック、解読できそうですか？
シャイロック	カクテルのレシピですね。
晶	え？
シャイロック	彼がスミレのリキュールを気に入って、いくつか教えたんですよ。
	リキュール１と、白ワイン２に、氷。
	こちらは、ジン２、リキュール１、レモンジュース１ｇ。そういうメモです。
晶	計算式じゃなかったんだ……。職員さんたちに教えてあげましょうか……。
シャイロック	ふむ……。ですが、彼らの楽しみを奪うのは、いささか気が引けますね。
晶	たしかに……。ど、どうしよう……。
`},
{id:11523,title:"スポットの名物",type:"personal",characters:["リケ"],memo:"ムル",
text:`リケ	賢者様、これ、見てください！この辺りの名産品だそうです。
晶	瓶の中でキラキラ光ってる……。星の砂みたいですね。
リケ	星の砂？賢者様の故郷では、星屑が砂になるのですか？
	これは星屑糖という砂糖なんです。
	星の光が強い日に、星の光を当てて作られるそうです。
	賢者様も召し上がってみてください。ほら、ね。
手のひらに受けた星屑糖は、キラキラと自ら発光しているけど、確かに結晶の粒のように見える。
リケ	賢者様、どうぞ。早く早く。
晶	（リケ、なんだかワクワクしてる……？そんなに美味しかったのかな）
いつもよりテンションが高めのリケに見守られながら、俺は星屑糖をおそるおそる口に含んだ。
晶	……ッ！わっ！口の中で弾けた！
リケ	あはは！びっくりなさったでしょう。僕も、さっき食べてみて驚きました！
	甘くて、口の中でパチパチして、楽しいです。
	美味しくて楽しい食べ物は、初めて食べました！
晶	（驚かせようとして、うずうずしてたんだ……。
	　今まで、いたずらなんてしたことなさそうだもんな……。かわいいな……）
リケ	ふふ、魔法舎に持って帰って、ミチルにも食べさせてあげるんです。
	ミチルもきっと、驚きますよね、賢者様！
`},
{id:11524,title:"スポットでの発見",type:"personal",characters:["⑮"],memo:"ムル",
text:`ムル	あ！
晶	どうしました、ムル？
ムル	あそこ！見て！新しい星がある！
晶	ど、どこですか？
ムル	アルゲバルの東側！夕方には見えなかった！
	賢者様の名前は？
晶	え？
ムル	賢者様のいた世界では、新しい星に名前をつけるんでしょ。前の賢者様に聞いたよ！
晶	え！？俺の名前でいいんですか？普通は、見つけた人の名前が付くんですが……。
ムル	いいよ！だって空の半分が俺の名前の星じゃ、せっかくの夜空が退屈じゃない？
晶	そ、そんなにあるんだ……。
ムル	早く早く！賢者様の名前は？
晶	えっと……、晶、です。
ムル	晶だね！あそこの小さな青い星は晶！さっそく天体図に書き足してこよーっと！
晶	いいのかな……。
`},
{id:11525,title:"楽しい場所",type:"personal",characters:["ラスティカ"],memo:"ムル",
text:`ラスティカ	賢者様、足元に気をつけて。
晶	ありがとうございます。すごい星空ですね……。
ラスティカ	さすが、星を見るための場所ですね。……そろそろ時間かな。南の空ですよ、賢者様。
晶	え？
ラスティカが指差す方角へ目を向けた瞬間、一際明るい流星が、夜空を大きく横切った。
晶	流れ星だ……！
ラスティカ	今夜はいくつも星が流れるそうですよ。星の音は聞こえましたか？
晶	星の音……？流れ星に音がするんですか？
ラスティカ	この岬は、星が流れる音や、またたく音がまれに届くのです。ほら、また。
晶	あ……！……聞こえたような……？
ラスティカ	今夜は賑やかな夜になりそうですね。
	星の流れる音に合わせて、チェンバロを弾きましょう。
`},
{id:11526,title:"マナエリア",type:"personal",characters:["⑮"],memo:"ムル",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
	「マナエリア」と呼ぶとも聞きました。ムルにもマナエリアがありますか？
ムル	あるよ！俺のマナエリアは、月の映る池のほとり！
	綺麗な月が空に浮かんでるのに、わざわざ池を覗き込むなんて、
	自分の矛盾にぞわぞわしちゃう！
	でもみんな、そういうものが好きだよね！
	なんで？どうしてこんなこと？って、考え始めると止まらなくなるんだ。
晶	いつもと変わらないように思えますけど、特別考え事が捗ったりするんですか？
ムル	俺の場合は逆だね！マナエリアに行くと、全然集中できなくなっちゃう。
	まとめるのをやめて考えっぱなしにする感じ。かゆいところを掻かない感じ。
	居心地が悪いのに我慢する感じ……。
	うずうずする気持ちをぱんぱんに溜めて、最後にわっと吐き出す感じ！
晶	……なんとなく、セルフ焦らしプレイみたいな感じですね……。
ムル	あはは！それ、シャイロックにも言われた！
`},
{id:11527,title:"アミュレット",type:"personal",characters:["⑮"],memo:"ムル",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって
	ムルもアミュレットを持ってますか？
ムル	あるよ！見たい？
晶	はい。良かったらぜひ。
ムル	オッケー！えーっとね……。
	あれー？このへんにあったはずなのに。これじゃない、これじゃない……。
晶	あ……、案外放ったらかしにしてるんですね……。
ムル	あった！賢者様、見て！
晶	綺麗な指輪……。これがアミュレットですか？
ムル	そう！ムーンストーンって石だよ。
	本物の月の方が何倍も綺麗だけど、月の名前が付いててかっこいい！
	俺のマナエリアは月の映る池だから、
	月の名前を冠した、月とは無関係の石が、ちょうど良かったんだ。
	曇りの夜や、新月の、月に会えない日はこの指輪をしてるよ。
	早く本物に会いたいなって思いが募るでしょ！
晶	なんだか複雑な思いのあるアミュレットなんですね……。
`},
{id:11528,title:"ムルとかくれんぼ",type:"personal",characters:["⑮"],memo:"ムル",
text:`ムル	賢者様、ここは危険だよ！怪獣がやってくる！
晶	え？怪獣……！？
ムル	クロエとかくれんぼしてるんだ！俺と一緒に隠れよう！
晶	わあ、引っ張らないで……！ちょっと待ってー！
ムル	ふう。いい場所が見つかってよかったね！
晶	あの………。ここって、オズの部屋じゃないですか！？
ムル	いいんだ。ここが魔法舎で一番安全だからね！
晶	勝手に入ったら怒られそう……。オズにも悪いし、違う場所に隠れませんか？
ムル	わあ、暖炉だ！あったかい！賢者様、暖炉の前に座ろうよ！
晶	わっ、駄目ですよ……！見つかったらどうなるか……。
ムル	あったかい……むにゃ…………。
晶	寝てる………！！ムル、寝ないで！起きてくださいー！
`},
{id:11529,title:"家族",type:"personal",characters:["⑮"],memo:"ムル",
text:`晶	ムルは家族のこと、覚えているんですか？
ムル	覚えてるような、ないような？あんまり覚えてないってことは覚えてる。
晶	どんな仕事をしてたとか。ご両親や……、兄弟はいたんですか？
ムル	仕事は宝石商だよ！家族が宝石商だったから、俺も宝石商になったんだ！
	父親は商売が得意だった。
	財産を溜め込むより、パッと大きく賭けて、たっぷり儲けるやり方は悪くなかった。
	俺のことを嫌ってる兄もいた。俺は兄のことはどうでもよかった。
	母親は凡庸だった。ほとんど覚えてない！
	しばらく家族に付き合ったけど、俺にはもっともっと知りたいことややりたいことがあったんだ。
	だから、お気に入りの鉱石や宝石をいくつかもらって旅に出た。家族とはそれっきり！
	わかった？賢者様。
晶	は、はい。わかりました。思い出そうとすれば思い出せるんですね。
ムル	うん！でも、賢者様の用事が済んだなら、もう忘れちゃうね。
晶	えっ……。え！？そ、そんな……。
ムル	家族って退屈！頭の中が空いた分、賢者様のいた世界の話を聞かせてよ！
	賢者様のいた世界の話、面白くて好きー！
`},
{id:11530,title:"シャイロックとの思い出",type:"personal",characters:["⑮"],memo:"ムル",
text:`晶	ムルは〈大いなる厄災〉に近づきすぎて、魂が砕け散ってしまったと
	聞いていますけど、昔のことは覚えているんですか？
ムル	覚えてるかも？覚えてないかも？覚えてることを忘れちゃったかも？
晶	えっと……。例えばシャイロックとのことは覚えてますか？昔、何があったとか……。
ムル	覚えてたり、覚えてなかったり！シャイロックは俺の記憶は都合がいいって！
	都合が悪いことは覚えてないから！
晶	はは……。なるほど。
~~~~~~~~~	~~~~~~~~~
選択	どんなことを覚えていますか？
ムル	カウンターの向こうに立ってるシャイロック！俺を見て笑ってる。
	にやっと口の端を上げて。俺のことは何でも知ってるよって感じで。
	カードゲームをするみたいに、今夜は負けないぞって風にお喋りする。
	内容は覚えてないけど、俺はなんか、ご機嫌！
~~~~~~~~~	~~~~~~~~~
選択	初めて会った時のことは？
ムル	覚えてない！シャイロックも教えてくれないんだ。どうでもいいことだからって！
	でも、本当は大事なことなんだろうね。だから、俺自身に思い出して欲しいのかも？
~~~~~~~~~	~~~~~~~~~
晶	そうなんですね……。ムルにとってシャイロックは、どんな人なんですか？
ムル	大好きだよ！お気に入りのハンモックみたいに、ずっとゆらゆらしてて欲しい！
	でも、俺は都合の悪いことは忘れちゃうから、たまにそれも忘れちゃうんだ！
`},
{id:11531,title:"魔法使い当てゲーム",type:"personal",characters:["ミスラ","ブラッドリー","シャイロック","ムル"],memo:"ムル",
text:`ムル	賢者様！来て来て！ゲームをしよう！
晶	ゲーム？食堂でですか？
ムル	ここにいるみんなに魔法をかけたんだ！
	見た目と中身が違う中から、シャイロックを探すゲームだよ！
リケ？	早く終わらせろ。これから昼飯だってのに、こいつの胃袋、絶対小せえよ。
シャイロック？	はあ……。俺は口がついていれば、どんな姿でも構いませんけどね。
レノックス？	あはは！手掴みで食べてる！その顔で行儀が悪いのって、最悪で最高！
晶	めちゃくちゃですね……！？
~~~~~~~~~	~~~~~~~~~
選択	リケに違和感？
リケ？	おい！嘘だろ。おまえの目は節穴かよ、賢者。
~~~~~~~~~	~~~~~~~~~
選択	シャイロックに違和感？
シャイロック？	裏の裏をかいてるんですか？
	俺じゃないだろうっていうのは、俺でもわかりますけどね。
~~~~~~~~~	~~~~~~~~~
選択	レノックスに違和感？
レノックス？	おお〜！賢者様、鋭いね！ゲームに強い賢者様って好き！わくわくしちゃう！
~~~~~~~~~	~~~~~~~~~
ムル？	正解は……。
シャイロック	ムルですよ。
レノックス？	あはは！ここにいるみんなって言ったもんね！
	《エアニュー・ランブル》！
晶	えっ？じゃあ、さっきのムルはシャイロックのものまね？
	北の魔法使いも付き合い良いですね！？
シャイロック	ふふふ。
ブラッドリー	ようやく飯が食えるぜ。せっかくならオズとかに変えてくれよ。
ミスラ	もぐもぐ……。
ムル	楽しかったー！いただきまーす！
`},
{id:11532,title:"ムルの役目",type:"personal",characters:["⑮"],memo:"ムル",
text:`ムル	賢者様！何か探し物？それとも賢者様が探されてる？
晶	扉を開けた瞬間ネズミが入り込んでしまって……。
	どこに逃げたかわからなくなってしまったので探していたんです。
ムル	そうなんだ！
	うーん、でも俺、ネズミが苦手だから手伝ってあげられないかもしれないなあ。
晶	ムル、ネズミが苦手だったんですね！？なんだか意外です。
ムル	ニャーオ、冗談だよ！むしろ害獣駆除は得意な方さ。
晶	が、害獣……！
ムル	《エアニュー・ランブル》！
	これでもう大丈夫！ネズミは外へ逃がしておいたよ。
	次に会ったらぺろっと食べちゃおう！
晶	ありがとうございます、ムル。とても助かりました。
ムル	どういたしまして！
	賢者様の困りごとを作るのも、解決してあげるのも、俺の役目だからね！
`},
{id:11533,title:"月の秘密",type:"personal",characters:["⑮"],memo:"ムル",
text:`ムル	賢者様の居た世界には、月にまつわる話はある？
晶	そうですね……。
	月にうさぎが住んでいるっていうのは有名かもしれません。
	俺も小さい頃は信じていました。伝説って聞いたときは、少しがっかりしたなあ。
ムル	へえ……。
	賢者様の世界では、もうそこまで知られてるんだ。
晶	え？それってこの世界の月にはうさぎがいるってことですか？
ムル	さあね！
`},
{id:11534,title:"ムルと休息",type:"personal",characters:["⑮"],memo:"ムル",
text:`晶	もう夕方か……。時間が経つのが早いなあ。
ムル	賢者様、疲れてるね？なんかぐらぐらしてる！
晶	ムル。そうですね、今日は確認する書類が多くて。
ムル	じゃあ俺と遊ばないの？
晶	すみません……。今日の分は終わったんですが、なんとなく落ち着かなくて……。
	もう少しだけ確認しておこうかなと思ったんですが……わっ！
ムル	そういうことなら、俺と遊ぼう！
ムルが俺の手を取ると、体がふわりと軽くなった。
俺の手を取ったまま、二人で魔法舎の屋根に着地する。
晶	わ……綺麗……。
ムル	賢者様、ここにずっと居てくれる？
晶	え？
ムル	夕ご飯までここでぼんやりするゲームをしよう！
	今日済ませなくていいことを、今日済ませる必要はないからね！
`},
{id:11535,title:"得意な魔法",type:"personal",characters:["⑮"],memo:"ムル",
text:`晶	ムルは、得意な魔法ってありますか？ムルにしか使えない魔法とか。
ムル	あるよ！物の記憶を見る魔法！
晶	物の記憶ですか……？俺の記憶もわかっちゃうんですか？
ムル	きみの記憶はきみの頭に聞けばいい。
	俺が見るのは、脳のないものの記憶だよ。例えば……。
	《エアニュー・ランブル》！
晶	わっ……！俺の洋服のボタンが光った……！
ムル	ふむふむ。あはは。なるほどなるほど。
	この金ボタンの材料は、中央の国の南にある鉱山で取れた鉱物だね。
	東の国で加工されて中央の国に来たみたい！
晶	すごい……。そんな昔のことがわかるんですね。
ムル	最近のこともわかるよ！
	昨日は、みんなが魔法の訓練をしてる最中、賢者様は……居眠りしてた！
晶	や、やっぱり、俺のこともわかっちゃうんじゃないですか！
	個人情報だだ漏れじゃないですか！
ムル	身につけてるものだとどうしてもねー。それから、昨夜は部屋で……。
晶	も、もう大丈夫です！うう……、便利そうだけど、ちょっと恥ずかしい魔法だな……。
`},
{id:11536,title:"ムルと空のお散歩",type:"personal",characters:["⑮"],memo:"ムル",
text:`ムル	賢者様、俺と一緒にお出かけしない？
晶	いいですけど……わっ！箒でどこかに行くんですか？
ムル	じゃあ、早速行こうか！
	ああ、風が気持ちいい。あの夕日に突っ込もう！
晶	（お出かけって空を飛ぶことだったんだ。
	　それにしても、雲行きがあやしいような……）
	やっぱり雨が降ってきた！ムル、せっかくですけど魔法舎に戻った方が……。
ムル	本当だー！それなら雲に突っ込もう！進路変更！準備はいい？
~~~~~~~~~	~~~~~~~~~
選択	え！？
ムル	何も心配ないさ！さあ、俺に身をあずけて！
~~~~~~~~~	~~~~~~~~~
選択	準備万端です！
ムル	そうこなくちゃ！行くよー！
~~~~~~~~~	~~~~~~~~~
ムル	《エアニュー・ランブル！》
ムルと俺は、ぐんぐん空を昇って行く。雲の中も通り抜けて、見えた景色は……。
晶	わあ、晴れてる！雲の上まで、登ったからかな……？
ムル	そうだよ！雨が降ったなら、雨より上を飛べばいい！
晶	足の下に雲が見えるなんて……。おかしな気分だけど、すごく綺麗だ……。
ムル	あはは！それじゃあ、雲の上の旅にしゅっぱーつ！
`},
{id:11537,title:"紋章",type:"personal",characters:["⑮"],memo:"ムル",
text:`晶	ムルの賢者の紋章は、手のひらにあるんですね。
ムル	そう！ここだよ！
	舐めてみる？
晶	え！？味がするんですか？
ムル	りんご味かな？
晶	それはさっき、ムルがりんごを丸かじりしてたからでは……。
ムル	知ってる？くっつけると移るんだって。
	賢者様のほっぺたにあるとかっこいい。えーい！
晶	わっ……！？
	賢者が賢者の魔法使いになっちゃっても大丈夫なんですか？
	そもそも俺は魔法が使えないのに……。
ムル	うそ！あはは！
	一番近くまで月に会いに行ける権利だ。俺は誰かに渡したりなんかしないよ。
`},
{id:11538,title:"眠れない夜",type:"personal",characters:["⑮"],memo:"ムル",
text:`晶	窓から見える星が綺麗……。今日は空が澄んでいてよく見える。
	あ、何か光った。流れ星かな？……って、あれ……？
夜空の中、きらきら輝く流れ星のような光がすごい勢いで落ちてくる。
晶	（落下隕石……！？）
ムル	賢者様！
晶	ムル！
ムル	空を飛んで、流れ星ごっこしてた！どう？
晶	流れ星というより……。死ぬかと思いました。
ムル	賢者様、こんな時間に空見てるってことは眠れないの？
晶	あ……。はい、今日は寝つきが悪くて。
ムル	それなら、俺と一緒に寝る？
晶	え？
ムル	俺、あったかいんだって！
	毛布みたいに上に乗せる？それとも、ぬいぐるみみたいに抱きしめてもいいよ！
