  font-family: sans-serif;
  padding: 20px;
}
#numberButtons button, #nameButtons button {
  margin:4px; padding:6px 12px; border:2px solid #aaa; background:#f5f5f5;
  cursor:pointer; border-radius:6px; font-weight:bold;
}
#numberButtons button.active, #nameButtons button.active { color:#fff; border-color:currentColor; }

/* 結果全体をグリッド表示 */
#result {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
  margin-top: 12px;
}

/* 1件ずつのカード */
.story {
  border: 2px solid #ddd;
  border-radius: 10px;
  padding: 10px 12px;
  background: #fff;
  box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
}

/* タイトル＋種別を横並び */
.story-header {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* タイトル */
.story-header h3 {
  margin: 0;
  font-size: 16px;
}

/* 種別ラベル */
.story-type {
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 6px;
  background: #eee;
  white-space: nowrap;
}

/* 登場人物を少し小さく */
.story .characters {
  font-size: 12px;
  color: #555;
  margin-top: 6px;
}

/* メモ */
.story .memo {
  font-size: 15px;
  margin-top: 6px;
}

.story h3 .type {
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 12px;
  background: #eee;
}

.story-type.login { background:#d9edf7; }
.story-type.personal { background:#fde2e2; }

.story:hover {
  transform: translateY(-2px);
}


#toggleNameButtons {
  margin: 8px 0;
  padding: 6px 14px;
  border-radius: 6px;
  border: 2px solid #666;
  background: #f5f5f5;
  cursor: pointer;
  font-weight: bold;
}

#toggleNumberButtons {
  margin: 8px 0;
  padding: 6px 14px;
  border-radius: 6px;
  border: 2px solid #666;
  background: #f5f5f5;
  cursor: pointer;
  font-weight: bold;
}

.type-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.type-tabs button {
  padding: 6px 14px;
  border: 2px solid #666;
  background: #fff;
  border-radius: 999px;
  cursor: pointer;
  font-weight: bold;
}

.type-tabs button.active {
  background: #444;
  color: #fff;
}

.type-tabs button[data-type="login"].active {
  background: #d9edf7;
  color: #31708f;
  border-color: #31708f;
}

.type-tabs button[data-type="personal"].active {
  background: #fde2e2;
  color: #8a1f1f;
  border-color: #8a1f1f;
}
.header-area {
  display: flex;
  flex-direction: column; /* 縦に並べる */
  align-items: center;    /* 横方向中央 */
  gap: 10px;
  margin-bottom: 20px;
}

.header-area h2 {
  margin: 0;
}

.type-tabs {
  display: flex;
  gap: 8px;
}

/* ボタン見た目（既存と合わせるなら調整OK） */
.type-tabs button {
  padding: 6px 14px;
  border: 2px solid #666;
  border-radius: 16px;
  background: #fff;
  cursor: pointer;
}

.type-tabs button.active {
  background: #444;
  color: #fff;
}
.story .date {
  font-size: 11px;
  color: #666;

#sortButtons {

#sortToggleBtn {

/* 古い順のとき */

#showFavoritesBtn {

.modal{

    inset:0;
    background:rgba(0,0,0,.5);

function formatStory(text){
  let html = "";

  text.split("\n").forEach(line => {

    if(line.includes("\t")){
      const [name, dialog] = line.split("\t");

      html += `
      <div class="line">
        <span class="name">${name}</span>
        <span class="dialog">${dialog}</span>
      </div>`;
    }
    else if(line.trim() !== ""){
      html += `
      <div class="line">
        <span class="name"></span>
        <span class="dialog">${line}</span>
      </div>`;
    }

  });

  return html;
}

ミスラ	ちょっと、本当に俺たち向きなんでしょうね。
この前はわざわざ出向いて、
小娘の指に刺さった棘を抜いて帰っただけだったじゃないですか。
クックロビン	す、すみません！
最近、みなさん、どんな風に依頼書を書けば優先されるか
コツがわかってきたみたいで、大げさに盛られるんです……。
ブラッドリー	盛られるって何だよ。飯以外の大盛りはお断りだぜ。
オーエン	依頼書書いたやつの名前と毛髪つけてよ。次から呪ってやるから。
クックロビン	の、呪うのはちょっと……。
スノウ	ぶつくさ文句を言うでない。
おお、この異変は急いで片付けたほうが良いの。そなたら、北の国へ向かうぞ。
ホワイト	ミスラちゃん、あれやって〜。ぱっと北の国へ行けるやつ〜。
ミスラ	はあ……。面倒くさいなあ……。
スノウ・ホワイト	お願いだから〜！やって〜！
ブラッドリー	さっさと行ってこいよ。俺、くしゃみした設定で今回休みな。
ミスラ	くしゃみした設定ってなんですか。殺しますよ。
オーエン	僕もだるいし、働きたくない。
ミスラ	俺だって働きたくないですよ。
スノウ	じゃあ遊ぶ感じで行こう〜！次の討伐を一番早く片付けた人が、みんなのボスね！
ミスラ・オーエン・ブラッドリー	…………。
ブラッドリー	ボスなら俺だな……。
ミスラ	この中で一番強いのは俺でしょう。
オーエン	人の下ってなんか嫌。
スノウ	さあ、では出発じゃ！
`},
{id:200201,title:"正義と祝祭のプレリュード",type:"login",characters:["西"],memo:"（１）西の魔法使いの休み方",date:"2019-12-20",
text:`ラスティカ	西の国の聖なる祝祭が、無事に終わってよかったね。
クロエ	うん！少し大変だったけど、楽しかったなあ。
シャイロック	祝祭でお疲れでしょうから、私たちは一旦休息をとりましょうか。
クロエ	了解！
ムル	ねえ、何か忘れてない？何か大事な物を西の国に置いてきたよね？
クロエ	え？衣装も、裁縫道具もちゃんと持って帰ってきたはずだけど……。
ムル	遊びだよ。せっかくカジノに行ったっていうのに、俺たちは遊び尽くしてない。
	だから、もう一度戻ろう。西の国へ。
クロエ	ええ！？またあそこに戻るの？
ムル	そうさ。俺たちにとって、休息はなんだったか忘れた？
ラスティカ	休息とは、じっとしていることに限らない。
心赴くまま、心が喜ぶことをすることだね。
シャイロック	私も、その考えには同意です。どんな時も、休み方は自由に選んでいい。
クロエ	カジノは緊張するけど……。新しいことに挑戦するのは、楽しそう……！
ムル	それじゃあ、行こうか。俺たちの忘れ物を取りに！
`},
{id:200202,title:"正義と祝祭のプレリュード",type:"login",characters:["東"],memo:"（２）東の魔法使いの休み方",date:"2019-12-20",
text:`ヒースクリフ	無事に西の祝祭を終えられたのはよかったけど、討伐の依頼はまだ山積みですね。
ネロ	今回は留守番といっても、こっちはこっちでやることがたくさんあるな。
今日はどの討伐に出かけるんだ？
ファウスト	どこにも出かけない。ずっと魔法舎にいる。
シノ	は？目の前にこんなにたくさん任務があるって言うのに？
ネロ	なんだ、責任感の強いあんたらしくないな。
明るい西の奴らに揉まれて、疲れちまったのか？
ファウスト	……確かに彼らは騒がしいし、疲れたことは否定しない。
だが、それだけが理由じゃない。
シノ	じゃあ、何でだ。
ファウスト	きみたちの方こそ、聖なる祝祭で心も体も疲れている。
自分では気づいていないみたいだが。
	責任感が強いのはいいことだ。しかし、時には休むことも必要だ。
今日くらいは休みなさい。
ヒースクリフ	ファウスト先生……。
	もちろんです！今日はゆっくり休みましょう。おまえもちゃんと休むんだぞ、シノ。
シノ	わかった。けど、休んだ分だけ、明日から目を剥くくらい討伐してやるからな。
ファウスト	ああ。僕たちは僕たちの使命を果たそう。
ネロ	じゃあ、また明日から頑張りますか。
`},
{id:200203,title:"正義と祝祭のプレリュード",type:"login",characters:["北"],memo:"（３）北の魔法使いで褒め褒めゲーム",date:"2019-12-20",
text:`スノウ	よし、ようやく北の魔法使いが全員集まったようじゃ。それでは、ホワイトに注目。
ホワイト	今日はそなたたちに、大事な話がある。我らの今後に関わる話じゃ。
ブラッドリー	なんだよ、急に改まって……。
スノウ	北の国の魔法使いには、圧倒的に足りないものがある。
他の国にはあって、我らだけにないものじゃ。
ミスラ	なんですか？殺した数が足りないとか？
オーエン	生クリームが足りない。まだ食べられるのに。
スノウ	我らに足りないもの、それはチームワークじゃ！
ホワイト	だから、今日はチームワークを磨くために『褒め褒めゲーム』をしようと思う。
スノウ	相手のいいところをひとつひとつ言っていくと、
ほんわかして仲良くなれるらしいのじゃ！
ミスラ	へえ、それはいいですね。さようなら。
ブラッドリー	そんな茶番に付き合ってられるかよ。………あ？ドアが開かねえ！
スノウ	ほっほっほ。どうせこうなると思って、この部屋に魔法をかけたんじゃ。
ホワイト	ゲームが終わるまでこの部屋から絶対出さないもんね。
オーエン	……へえ。つまり、
きみたちの息の根を止めてあげれば、ここから出られるってことだ。
スノウ･ホワイト	え？我らの話聞いてた？
ブラッドリー	気にくわねえ奴らを無理やり褒めるよりも、手っ取り早くていいじゃねえか。
じじいども覚悟しやがれ！
ミスラ	ちょうどむしゃくしゃしてたので、気分転換になりそうですね。
スノウ	え、ちょ、まっ……。なんでこういう時ばっかり、団結力が強っ……。
スノウ･ホワイト	きゃーー！
`},

{id:200401,title:"奇跡と祝祭のプレリュード",type:"login",characters:["ムル","クロエ"],memo:"（１）勇気の手助け",date:"2020-01-07",
text:`クロエ	うーん。うーん……。
ムル	クロエ。同じところばかり歩いてどうしたの？
イカれておかしくなっちゃった？
クロエ	違うよ！ヒースが祝祭で東の国へ行くって聞いたから、お守りを作ったんだけど……。
いざ渡すとなると緊張してきちゃってさ。
ムル	そっかー！じゃあ、勇気が出る薬を飲む？
クロエ	えっ？そんな薬があるの？
ムル	あるよ。飲むだけで、なんでもできる気がしてくる魔法みたいな薬さ！
クロエ	（ムルの発明した魔法薬なのかな？怖いけど、ちょっと頼りたい……）
ムル、その薬買ってもいい？
俺、勇気が欲しいんだ！
ムル	いいよ！どうぞ召し上がれ。
クロエ	いただきます……。
これって……。
お酒じゃん！わっ、頬が熱くなってきた！
ムル	あはは！でも、思い切りがよくなるだろう？
クロエ	うう、酔った勢いじゃないと渡せないなんて、自分が情けなくなっちゃうな……。
ムル	ほら、肩を落としていないで。早くしないとヒースが出発しちゃう。
クロエ	た、確かに！行ってきます！ありがとう、ムル！
ムル	本当はお酒じゃないよ、クロエ。瞬間的に、頬が熱くなるだけの薬。
クロエの足を動かしたのはクロエの勇気だよ！
行ってらっしゃい！
`},
{id:200402,title:"奇跡と祝祭のプレリュード",type:"login",characters:["中央"],memo:"（２）オズにマッサージを",date:"2020-01-07",
text:`リケ	オズ、ソファに座ってください。
オズ	何故。
リケ	マッサージをしたいんです。
オズは中央の国の祝祭のときにみんなを守ってくれました。そのお礼をしたくて！
頑張った人を労う肩揉みというものがあるって、ルチルに聞きました。
僕、オズにやってみたいです。
オズ	そうか……。だが、私には必要がない。
リケ	無理しなくていいですよ！大人は肩が凝りやすいって教えてもらいましたから。
ほら、早くそこに座って。
オズ	…………。
リケ	ええっと、まずは首の下を握りしめて、潰すんですよね。
ネロがパンをこねる時みたいに……。
……わあ！とっても固い！やっぱりオズ、肩凝ってますよ。
オズ	そこは骨だ。
アーサー	オズ様、ここにいらっしゃったのですね。リケは何をしているのだ？
リケ	アーサー様、カイン、こんにちは。今オズに肩揉みをしていたんです。
オズの肩って、大きくて格好いいんですよ！
アーサー	オズ様に肩揉み……。
カイン	あはは。それは羨ましいな。リケ、良かったら俺の肩も揉んでくれないか。
リケ	いいですよ！オズが終わったら次はカインの番。
その次はアーサー様の肩揉みをします！
アーサー	ありがとう、リケ。
あの、オズ様。リケの番が終わったら、私もオズ様に肩揉みをしても良いでしょうか？
オズ	少しの間だけだ。
アーサー	ありがとうございます！それでは、精一杯頑張りますね。
`},
{id:200403,title:"奇跡と祝祭のプレリュード",type:"login",characters:["フィガロ","ルチル","ミチル"],memo:"（３）トカゲのお守り",date:"2020-01-07",
text:`ルチル	ミスラさんからもらったトカゲのお守り、どこに飾ろうかな〜♪
枕元に置こうかな？いっそ机の真ん中にどーんと飾るのも……。
フィガロ	ルチル、入るよ。小説を返しに。うわっ、それ……呪いのアイテム？
一瞬、間違えてファウストの部屋に来ちゃったのかと思ったよ。
ルチル	もー！フィガロ先生酷いです。
中央の祝祭のときに、ミスラさんにもらったトカゲのお守りですよ。
私も最初は気持ち悪いと思ってたけど、だんだんと愛着が生まれてきて……。
この独特の表情も、可愛く思えてきちゃいました！
フィガロ	これを可愛いというなんて、きみ、なかなかいい趣味してるよねえ。
相変わらず独特なセンスというか……。
ルチル	え？何か言いました？
フィガロ	あはは。なんでもないよ。
ミチル	兄様、そろそろお昼ご飯食べませんか？ネロさんが、今日はサンドウィッチを。
うわっ！気持ち悪いトカゲ！夜、動き出しそうで怖いです……！
ルチル	もー！ミチルまで！せっかくミスラさんがプレゼントしてくれたのに！
`},
{id:200501,title:"親愛と祝祭のプレリュード",type:"login",characters:["カイン","リケ"],memo:"（１）練習のあとの一杯に",date:"2020-01-20",
text:`リケ	カイン。今日は、魔法の練習に付き合ってくれてありがとうございました。
カイン	こちらこそ。いい鍛錬になったよ。だが、魔法舎に帰る前に……。
《グラディアス・プロセーラ》！
これを俺と一緒に楽しまないか？
リケ	ティーポットとカップ……？
甘い匂いがしますけど、一体何が入っているんですか？
カイン	ココアだよ。こっそり持ってきたんだ。あ、ちゃんと魔法で温めておいたからな。
リケ	ココア……？もしかして、チョコと水を混ぜた美味しい飲み物ですか？
ネロにいただいたことがあります。
でも、魔法舎に帰ってから飲むほうが良いんじゃないでしょうか。
ここは寒いですし、冷めちゃうんじゃ……。
カイン	いや、ここで飲むのがいいんだ。騙されたと思って飲んでみろって。
リケ	……美味しい……。前に飲んだ時よりも、もっと美味しい気がします……。
カイン	だろ！寒い日に外であったかいものを飲むと、特別美味しく感じるんだ。
これが寒い日のささやかな楽しみでさ。リケにも、教えてやりたかったんだ。
リケ	そうだったんですね……。ありがとうございます、カイン！
ふふ。明日の練習が楽しみになりますね。
明日はもっと、もっと、寒い日になりますように……。
カイン	うーん。それはちょっと困るかな……。
`},
{id:200502,title:"親愛と祝祭のプレリュード",type:"login",characters:["シノ","ヒースクリフ",""],memo:"（２）あなたのためのこたつを",date:"2020-01-20",
text:`ヒースクリフ	シノ。もうすぐ夕飯の時間だって―――。
ん、何だろうこれ？テーブルに毛布がかけられてる……。
シノ	ヒース。
ヒースクリフ	シノ！毛布の中に潜ってたのか……。
一体何をしていたんだ？
シノ	コタツだ。
ヒースクリフ	コタツ……？
シノ	賢者が言ってたんだ。机に毛布をかけて、
みかんとかいうオレンジみたいなものを食べると、コタツになるらしい。
ヒースクリフ	そうなんだ……？
よく分からないけど、賢者様の世界の文化なんだね。
シノ	ああ。これは、お前に入ってもらうために作った。
ヒースクリフ	えっ、どうして？俺がコタツに入ると何かあるの？
シノ	最近、寒いからな。お前が風邪をひいたら困る。ここで温まっていくといい。
ヒースクリフ	シノ……。俺のために、わざわざありが……。
シノ	ふふん、気にするな。ヒースは昔から軟弱だからな。
ヒースクリフ	…………。おまえは、いつもいつもそうやって……。
シノ	なんだよ。
ヒースクリフ	……もういいよ。あ。温かい……。なんだかほっとするな……。
シノ	だろ？南の国から帰ってきたら、賢者も入れてやろう。あいつ、きっと喜ぶぜ。
ヒースクリフ	そうだね。それまでに、オレンジも用意しないと。あと……。
俺、コタツのこと結構好きかも。ありがとう、シノ。
`},
{id:200503,title:"親愛と祝祭のプレリュード",type:"login",characters:["スノウ","ホワイト","ブラッドリー","ネロ"],memo:"（３）餅つき係",date:"2020-01-20",
text:`スノウ	おお。ブラッドリー、ネロ。よく来てくれた。
そなたたちにお願いしたいことがあっての。
ネロ	別に構わないよ。でも、なんで俺とこいつなんだ……？
ブラッドリー	依頼ってのは、財宝の強奪か？討伐か？
ネロ	はあ……。悪いが、そういうことなら俺は遠慮させてもらうよ。
スノウ	そうではない。おぬしらに任せたいのは、『餅つき』じゃ。
ブラッドリー	はあ？なんだそれ？
ホワイト	賢者の世界では『米』というものを叩くと、『餅』という物になるらしくてな。
それがとても美味だと言っておった。
スノウ	ブラッドリーの腕力と、ネロの料理の腕があれば、最高の『餅』を作れるはずじゃろ？
ホワイト	我ら、それを賢者にプレゼントしたいのじゃ！
手伝ってくれるかの？
ブラッドリー	くだらねえ……。んなこと、てめえらで勝手にやりゃあいいだろ。
俺は降りるぜ。じゃあな。
スノウ	ブラッドリーちゃん……。本当に、行っちゃうの？
ブラッドリー	ああ？
ホワイト	我ら、老い先短いのに……。若者の笑顔が見たいっていう、楽しみ奪っちゃうの？
ちょっと悲しいな……。
ブラッドリー	…………。
ったく、仕方ねえなあ！このハンマーで『気持ち米』をぶん殴れば良いのか？
スノウ・ホワイト	わーい！ブラッドリーは良い子じゃの！
ネロ	……お前、相変わらずこういうのに弱いんだな。
ブラッドリー	なんだよ？
ネロ	いや、別に。
さ。『餅』ってやつを作ろうぜ。賢者さんたちが南の国から帰ってくる前にな。
`},

{id:10201,title:"スポットの印象（１）",type:"personal",characters:["オズ"],memo:"アーサー",
text:`晶	オズから見た中央の国ってどうですか？
オズ	…………。
	人が多いな。馴れ馴れしい者が多い。
晶	俺は気さくだなって感じたんですけど、オズは馴れ馴れしいって思うんですね……。
オズ	ああ。
	気候はいい。暑さも寒さも、程度を知っている。
晶	過ごしやすいですよね！俺の住んでたところより、少し涼しい感じです。
オズ	そうか。
	あとは……、食べ物が美味い。
晶	えっ。オズが食べ物の話をするのなんだか意外ですね。
	中央の国で、何か気に入ったものはありましたか？
オズ	…………。栗か？ 
`},
{id:10202,title:"スポットの印象（２）",type:"personal",characters:["リケ"],memo:"アーサー",
text:`リケ	首都はやはり人が多いですね。お城の中だけでも、こんなにたくさんいるなんて。
晶	リケの住んでいたところはもっと少なかったんですか？
リケ	はい。教団の教えが理解できる者しか住んでいない場所でしたから。
晶	でも……、このお城も綺麗ですよ。好きになったところは一つもないですか？
リケ	ひとつもってことは……、ないですけれど……。
晶	本当？どこが気に入りました？
リケ	……市場には、見たことのない美味しいものや綺麗なものがありました。
	騒々しくて、慌しくて、教団で教わってきた神聖な精神とは真逆の喧騒でしたが……。
	でも皆、楽しそうでした。
	司教様から聞いていた、不浄な場所だという外の世界の印象とは、違っていて……。
晶	リケが感じたことは、きっと間違いじゃないですよ。
	今度一緒に、市場へ美味しいものを探しにいきませんか？
リケ	……賢者様がいうなら。ぜひ。
`},
{id:10203,title:"スポットの印象（３）",type:"personal",characters:["レノックス"],memo:"アーサー",
text:`晶	いつ見てもすごいお城ですね。
レノックス	……はい……。豊かで、美しい国です。
晶	あ、そうか。レノックスは、中央の国にいたことがあるんですよね。
懐かしい感じしますか？
レノックス	……懐かしいですが、思うところもあります。
晶	思うところ？
レノックス	この城や、この国が豊かなのは、
中央の国の初代王、アレク様の統治が、良いものだった証です。
	……ですが、建国に貢献した魔法使いが、一時的に排斥されたのも事実です。
	仕方ないことだったのかもしれません。俺も、仲間も、精一杯でした。
	だけど、なんというか……。
晶	複雑……？
レノックス	そうですね。……複雑です。
	でもやはり、美しくて、懐かしい国ですね。
`},
{id:10204,title:"ブレイクタイム（１）",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	綺麗な庭を眺めながらのんびりお茶するなんて、すごく贅沢な時間だな……。
アーサー	気持ちがいいでしょう。
私も、賢者様がご一緒なら、みなに気兼ねなく羽を伸ばせます。
	エア茶はお口に合いましたか？
晶	はい！スッキリしてて、喉がすっと通るような不思議な味ですね。
	でも、アーサーがお茶を煎れられるなんて、少し意外でした。
	王子様って、なんでも召使いさんにやってもらうようなイメージだったので……。
アーサー	確かに、そういう貴族は多いかもしれません。
でも、私はオズ様の城で仕込まれましたから。
	ふわぁ……。日差しが暖かくて、心地いいです……。
晶	（うわ、うとうとし始めちゃった……
レアなアーサーだ……）
うーん……、ぽかぽかしてるな……。なんだか……俺も眠たくなってきた……。
アーサー・晶	すーすー……。
`},
{id:10205,title:"ブレイクタイム（２）",type:"personal",characters:["リケ"],memo:"アーサー",
text:`リケ	わあ、夕焼けが美しいですね。賢者様の世界にも夕焼けはありますか？
晶	はい。でも、建物が高くて、
沈んでいく太陽を見ることはあまりなかったかもしれないです。
リケ	私の故郷の傍にある既知の遺跡から見る夕日も、雄大で素晴らしいものだそうです。
晶	綺麗なところだったんですね。
リケ	…………。
	故郷の話をすると、故郷が恋しくなりませんか？
晶	え？そう言われると、そうかも……？
リケ	寂しくないように、私が手を握っていて差し上げます。
	夕暮れが終わるまで。
晶	（もしかして、話してたら寂しくなっちゃったのかな
	リケは気丈だけど、見かけより幼いところもある気がする……）
晶	じゃあ……お願いします。
リケ	ええ。賢者様、お手をどうぞ。
`},
{id:10206,title:"スポットの思い出（１）",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	アーサーは子供の頃、このお城にいたんですよね。
何か思い出ってありますか？
アーサー	そうですね……。
ここを離れたのは４つの頃ですから覚えてることも少ないのですが……。
ちょうどこの城につながる橋の上を、
父上と母上と三人、手を繋いで渡った記憶があります。
晶	微笑ましくて可愛いエピソードですね。ロイヤルファミリーっぽい感じがして。
アーサー	うーん……。
晶	どうしました？
アーサー	王家の者は通常、馬車で移動するんです。
どこかへ出かけるために、この橋を歩いて渡ったとは考えにくくて。
	……おそらく、どうしてもこの橋を歩いてみたいと、
私がわがままを言ったのでしょう。
晶	あはは。子供の頃のアーサーはわんぱくだったって、オズも言ってましたもんね。
アーサー	お恥ずかしい限りです……。
`},
{id:10207,title:"スポットの思い出（２）",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	ここから見る景色は綺麗ですね……。
アーサー	はい。私も大好きです。
	オズ様の城からこちらに戻って寂しかった時は、自分の部屋や、このバルコニーから、
北の国の方角ばかり眺めていました。
	たまにオズ様の気配がした気がしてあたりを探すんです。
	でも、当然お姿はなくて……。
晶	…………。
アーサー	そうだ。代わりに、黒い鳥をよく見かけました。
ハヤブサのような……燃えるような赤い瞳の、美しくて凛々しい、不思議な鳥です。
晶	赤い瞳の……、黒い鳥？
アーサー	ええ。いつも離れた場所からこちらを伺っていて、
やがて街を旋回して翔び去って行くんです。
その姿を追ううちに、街並みの美しさに気付きました。
今はここに住む人々のために私があるということも。
晶	その鳥が、アーサーに元気をくれたんですね。
アーサー	元気も、勇気ももらいました。そういえば、最近見かけないけれど……。
	なんとなく、今も近くで見守ってくれてるような、そんな気がしているんです。
`},
{id:10208,title:"スポットの思い出（３）",type:"personal",characters:["カイン"],memo:"アーサー",
text:`晶	騎士団ではどんな仕事をしていたんですか？
カイン	ここのところ、大きな戦争もなかったからな。護衛や警備、あとは訓練。
賢者様の世界の騎士はどんなだった？
晶	俺がいたところには、騎士って職業はなかったんです。昔はいたんですけど。
	同じような仕事をしてるのは、警察になるのかな……？
カイン	警察。へえ。どんな馬に乗る？
晶	馬！？馬には乗らないですね……。カインは乗馬もできるんですか？
カイン	もちろん。箒に乗るより得意だぜ。乗ったことがないなら、今度乗せてやるよ。
晶	わ……。楽しみにしていますね！ 
`},
{id:10209,title:"アーサーへの印象（１）",type:"personal",characters:["オズ","アーサー"],memo:"アーサー",
text:`ドラモンド	アーサー様！ アーサー様！
アーサー	ああ、呼ばれているようです。
	すみません、賢者様。少し失礼いたします。
晶	はい。いってらっしゃい。
オズ	…………。
晶	忙しそうですね、アーサー。
オズ	ああ……。
	病に伏せる国王の公務も任されている。多忙だろうな。
晶	そうですか……。頑張りすぎてないか、少し心配だな。
オズ	…………。
	無理をしている時の顔色はわかる。
そそっかしいところはあるが、ここでの仕事はこなしているようだ。
	案ずる必要はないだろう。
晶	よかった。育ての親のオズが言うなら、大丈夫ですね。
	戻ってきたアーサーが休めるように、お茶を煎れて待っていましょうか。
オズ	ああ。……そうだな。
`},
{id:10210,title:"アーサーへの印象（２）",type:"personal",characters:["カイン"],memo:"アーサー",
text:`カイン	アーサー様に初めて会ったのは、俺がまだ騎士団にいた頃だ。
	死んだと思われてた王子が生きて帰って来たって言うんで、城内は大騒ぎさ。
晶	それは確かに、大変そうですね……。
カイン	俺にとっても新しい主君になる人だろ。
楽しみな気持ちも、言い方は悪いが品定めするような気持ちも、正直あったんだ。
	ちょうどこの広間で初めてアーサー王子に挨拶した。
当時は騎士団長だったから、そんな紹介で。
カイン	１３か、１４くらいだったろうが、幼いのに落ち着いてて、威厳を感じたよ。
	アーサー様はなんて言ったと思う？
晶	何でしょう。よろしく頼む、とか……？
カイン	「騎士団長か」
	「格好いいな」
晶	あはは！無邪気ですね！
カイン	だろ？一発で好きになっちまった。騎士団のやつらもそうさ。
	誰だって、格好いいと言われたくて、騎士になるんだからな。
`},
{id:10211,title:"アーサーへの印象（３）",type:"personal",characters:["リケ"],memo:"アーサー",
text:`晶	アーサーは、今晩はお城に泊まるそうです。
リケ	そうですか。一国の王子ともなると、やはりお忙しいのですね。
晶	アーサーのこと……、リケはどう思ってますか？
リケ	アーサー様を？そうですね……。
	アーサー様はいつも私の話をちゃんと聞いてくださいます。
	教団では、私が話を聞く役でした。司教様の話や、信徒の方たちの話……。
	だから、アーサー様と話すのは、少し、難しい……。
晶	難しい？
リケ	嫌なわけではありません。
でも、何をしたいか、どう思う、と、聞かれることはあまりなかったんです。
	アーサー様はいつも、私の話を聞いてくださいます。
	だから、ちゃんと話さなければと思って。
	難しいけれど、嬉しいです。
`},
{id:10212,title:"アーサーへの印象（４）",type:"personal",characters:["ファウスト"],memo:"アーサー",
text:`晶	アーサーのこと、ファウストから見てどうですか？
ファウスト	どうって？
晶	すみません、他意はないんですけど……。
ファウスト	…………。
	無鉄砲なところが、昔の友人に似ているかもな。
	僕はどうしても、そいつに重ねてしまう。
だから、アーサーに対する公正な印象にはならないだろう。
晶	（ファウストが中央の国を建国した人と関係があるって話、本当なのかもな……）
ファウスト	ただ、因縁を感じる。
晶	因縁？
ファウスト	魔法使いを信用できなかった初代国王の子孫が、賢者の魔法使いに選ばれた。
	それも、信用されなかった魔法使いと一緒に。
	ぞっとするような因縁だろう。総括すると、なんだこれ、って感じだよ。
	だが、まあ、アーサー自身は……。
	しっかりやっているんじゃないか。王子としても、賢者の魔法使いとしても。
	以上だ。
`},
{id:10213,title:"アーサーへの印象（５）",type:"personal",characters:["②"],memo:"アーサー",
text:`クックロビン	最近は、アーサー様の魔法で、色々な動物に変身する遊びをしてるんですよ。
俺の軍艦鳥っぷりを気に入ってくださってて。
晶	え！？そんな遊びを……？めちゃくちゃ仲良しっぽくないですか。
クックロビン	いやそんな、アーサー様は誰にでもそんな感じで、俺だけ特別だなんて、そんな……。
晶	（まんざらでもなさそうだ……）
~~~~~~~~~	~~~~~~~~~
選択	猫になったことはありますか？
クックロビン	ええ。ファウストさんが猫が好きだという噂を聞いて、
猫に変身して絡んでみてくれと頼まれました。
	それで、猫になりきってすり寄ってみたら、
「正体は分かっている。失せろ」って、
冷ややかな視線を受けたのでキュンとしました。
~~~~~~~~~	~~~~~~~~~
選択	馬になったことはありますか？
クックロビン	ありますよ！馬になってみたいってお願いしました！馬ってかっこいいですよね。
	ただ、カインさんがやって来て、
馬の俺を見るなり飛び乗って走らせようと脇腹や尻を叩かれたので、動揺しました。
~~~~~~~~~	~~~~~~~~~
選択	別人になったことはありますか？
クックロビン	これは内緒にして欲しいですが、
実は、ヴィンセント様の姿に変身させられたことがあります……。
	アーサー様の書類業務が溜まっていたそうで、
作業の間、サボらないように見ててくれ、と。
	大変捗った様子で、俺もちょっと偉そうにできて気分良かったです。
~~~~~~~~~	~~~~~~~~~
晶	変身するなんて、ちょっと怖そうかなと思ったんですけど、すごく楽しそうですね。
クックロビン	そうなんです。俺自身まだ、魔法って、
得体の知れない恐ろしいものだと思っていたところがありましたが……。
	アーサー様と遊んでいるうちに、怖いだとか奇妙だとかいう気持ちが薄れて、
楽しくて素敵だなって思うようになったんです。
	たまにやんちゃではらはらしますが、
アーサー様は、お優しくて、お強くて、本当に素晴らしい方です。
	どこか世間知らずなところもあって、
僭越ながら、弟のように感じることもありますね。
`},
{id:10214,title:"スポットゆかりの話（１）",type:"personal",characters:["アーサー","レノックス"],memo:"アーサー",
text:`アーサー	この城は戦乱の時代に、この辺りを制圧していた残忍な魔法使いが
人間から奪って住み着いていた城でした。
	のちにアレク初代国王陛下がそれを奪還し、
中央の国の建国の際、グランヴェル城として再建されたものです。
晶	古い歴史のある建物なんですね……。
アーサー	ええ。
	レノックスは建国の革命軍にいて、そこに立ち合ったそうですから、
今度ゆっくり話を聞けたらと思っています。
晶	えっ！？あっ、そうか！そうですね……。
	（そういえば魔法使いは長生きなんだった……。
なんていうか、歴史上の偉人たちと、
一緒に暮らしてるみたいな話なんだろうけど……）
はぐれた羊	メエ！　メエメエ！
アーサー	わっ！　羊……？
レノックス	アーサー様、賢者様！
	すみません、羊がはぐれてしまって……。
晶	（あんまり実感わかないな……）
`},
{id:10215,title:"スポットゆかりの話（２）",type:"personal",characters:["②"],memo:"アーサー",
text:`アーサー	中央建国の戦いに貢献した、
初代国王と聖なる魔法使いの逸話はこのグランヴェル城にも多く残ります。
	ほら、賢者様、あそこの……城の東の広間の窓が見えますか？
晶	ええと、大きなステンドグラスがある場所ですか？
アーサー	そうです。あのステンドグラスには紫が使われていないんです。
晶	紫が……。どんな意味があるんですか？
アーサー	言い伝えでは、
紫色は聖なる魔法使いファウストが好んで身につけた色なんだそうです。
	彼が再び城に戻った時、彼の魔法で紫を加えて装飾が完成するようにと、
初代国王アレクの願いが込められてるんですよ。
`},
{id:10216,title:"中央の国について",type:"personal",characters:["②"],memo:"アーサー",
text:`アーサー	賢者様は、この国に馴染んでこられましたか？
晶	そうですね……。
慣れないこともあるんですけど、
みんな親切にしてくれるし、景色や街並みも綺麗だし……。
	だんだん、好きになってきたように思います。
アーサー	そうですか。それは、この国も王子としても、とても嬉しいです。
晶	アーサーも、中央の国が好きですか？
アーサー	もちろん大好きです！
文化と学間を大事にするところや、流通が盛んで旅人が多く、賑やかなところも。
	ですが……、私もどこか、故郷は北の国だという気がしているのかもしれません。
	賢者様とは、少し境遇が似ているのかもしれませんね。
`},
{id:10217,title:"〈大いなる厄災〉について",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	〈大いなる厄災〉が来る時って、
他の場所にいる人たちは、どんな風に過ごしてるんですか？
アーサー	家の中から見守る者や、早々に寝てしまう者もいると聞きます。
みな、それぞれですね。
晶	アーサーは？
アーサー	子供の頃から、私は起きてることが多いです。
オズ様も、〈大いなる厄災〉が来る夜は、夜更かしを許してくださって。
晶	じゃあ、ちょっと楽しみだったんですか？
アーサー	……不謹慎ですが、そうかもしれません。
今回のような深刻な被害が出たのは稀で、
私が生まれてから一度もなかったことでした。
	魔力の強い、スノウ様とホワイト様が、賢者の魔法使いだということも
知っていたので、怖いと思ったことはありませんでした。
	大きくなった〈大いなる厄災〉が、空に還っていく姿を見るたびに、
お二人の活躍を想像し、胸を躍らせていました。
晶	そうなんですね……。
アーサー	ご心配なく、賢者様。
	次の戦いでは、美しく大きくなるだけの〈大いなる厄災〉を
ご覧に入れられるよう、みなで励みますから。
`},
{id:10218,title:"スポットの人々",type:"personal",characters:["②"],memo:"アーサー",
text:`お城の侍女	アーサー様、賢者様。ご機嫌よう。
アーサー	ああ。ありがとう。
晶	ご、ご機嫌ようです……！
	（お城の挨拶、いつまでも慣れないな……でも……）
	ここのみなさん、気さくですよね。すぐ打ち解けてくれるし。
アーサー	そうですね。みな、おおらかで真面目で、親しみやすい者たちばかりです。
晶	優しくて親切な人が多いですし、
俺がお世話になるのが、中央の国でよかったなって思います。
アーサー	わあ、本当ですか？賢者様にそう言っていただけると、きっとみなも喜びます！
	ああ、そこのきみ。聞いたか？今、賢者様がおまえたちのことを……。
お城の召使い	わっ、アーサー様！？わ、私ですか……！？
晶	（王子様が率先して気さくだもんな……）
`},
{id:10219,title:"アーサーの特効薬",type:"personal",characters:["オズ","アーサー"],memo:"アーサー",
text:`晶	あれ……。アーサー、少し顔色が悪くないですか？午後は無理せずに休んだ方が……。
アーサー	そういえば……、朝から少し、喉の調子が悪かったのです。
ただ、このあと会議の予定があって。
夜は早めに休むようにいたしますね。ご心配ありがとうございます、賢者様。
晶	（アーサー、若いのに、会社員みたいだ……。倒れたりはしないだろうけど……）
~~~~~~~~~	~~~~~~~~~
選択	思い切って休暇をもらっては？
晶	こじらせた方が大変そうですよ。
別の日に変更できるなら、大事をとって休んだ方がいいと思います。
アーサー	そんなに悪そうに見えますか？
……賢者様がそうおっしゃるなら、少し、相談してみます。
~~~~~~~~~	~~~~~~~~~
選択	アーサーがそう言うなら……。
晶	頑張りすぎないでくださいね。
アーサー	はい。……とは言っても、午後の会議は眠らないのが大変なくらい、
のんびりしているので大丈夫ですよ。
~~~~~~~~~	~~~~~~~~~
選択	代役はたてられませんか？
晶	誰か、代わりに出てもらうことはできないんですか？
アーサー	代役か……。ドラモンドなら任せられるかもしれません。あとで確認してみます。
~~~~~~~~~	~~~~~~~~~
アーサー	子供の頃なら、このくらいの体調不良はすぐ……。
オズ	無茶をするのはおまえの悪い癖だ。
アーサー	あ……、 オズ様！
不意に現れたオズが、指先をひらめかせた。
はっとして、アーサーが何かを受け止めるように両手を差し出す。
次の瞬間、ふわりとオズの手元が光り、
ころころとした、形のいい砂糖菓子が、アーサーの手のひらに転がった。
晶	シュガーですね！薬の代わりにもなるんですか？
アーサー	体力の回復の助けになるのです。
子供の頃に風邪をひくと、いつもオズ様がシュガーを作ってくださいました。
……オズ様、ご心配をお掛けしてすみません。ありがとうございます。
オズ	大事にな。
`},
{id:10220,title:"スポットにいた魔法使い",type:"personal",characters:["②"],memo:"アーサー",
text:`アーサー	聖なる魔法使いファウストは、
初代国王アレクと力を合わせ、多くの人々を救いました。
中央の国に生まれれば、誰しも一度は名前を耳にする、建国の英雄たちです。
晶	聖なる魔法使いファウストって……。
俺たちの仲間の、東の魔法使いのファウストと同じ人なんですか？
アーサー	どうでしょう。私も本人に尋ねてみたのですが、否定されてしまいました。
高潔で、思慮深く、文武に長けた優しい人物で……。
猫が好きだったと言い伝えられています。
晶	…………。猫派なんだ。
アーサー	はい。ちなみに、初代国王アレクは、犬好きだったそうです。
そのため、グランヴェル城には、犬の彫刻が施された柱があるんですよ。
ご覧になりますか？
`},
{id:10221,title:"危険な場所",type:"personal",characters:["オズ"],memo:"アーサー",
text:`晶	あれ、あの塔みたいなのはなんだろう？
	窓の格子の形が、他と違うような……。
オズ	賢者。そちらに何か用があるのか。
	なければ戻れ。
晶	オズ……。すみません。立ち入り禁止の場所でしたか？
オズ	…………。
	あそこの地下は牢獄だ。魔法使いのな。
晶	魔法使いの……。
	どんなところなんですか……？
オズ	私も入ったことはない。強い結界が張られている。
	ブラッドリーの方が詳しいだろう。
晶	（怖そうなところだ……）
`},
{id:10222,title:"アーサーの評判",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	カナリアさん。女性から見たアーサーの評判って、どんな感じなんでしょうか？
カナリア	お優しくて、聡明で、あのお顔立ちですもの！憧れと噂の的ですよ。
晶	やっぱり有名人なんですか？国中みんな、顔を知ってる感じとか。
カナリア	少なくとも中央の街では、知らない者はおりませんね。
	中央のお城に戻られた時から、民衆にお目見えする国王陛下のお仕事は、
アーサー様が取り仕切るようになりましたし。
	一度、街でパレードがあった時に、アーサー様のお顔を見たがった子供が飛び出して
隊列を止めてしまったことがあったんです。
	子供とはいえ、厳しい処罰を受けかねないのに、
アーサー様が取り成して収めてくださって！
それからまた、ファンが増えたみたいですよ。
晶	なるほど……。
~~~~~~~~~	~~~~~~~~~
選択	若い女性からの人気は？
カナリア	まさに憧れの王子様なんでしょうね。
アーサー様のお顔が彫ってあるメダルや、姿絵を集めている女の子も多いみたいです。
	この前の叙任式も、前方でアーサー様のお姿を見るために、
朝早くから並んでいた女性が多かったそうですよ
晶	（アイドルの追っかけみたいだ……）
~~~~~~~~~	~~~~~~~~~
選択	大人の女性からの人気は？
カナリア	大人の女性は……、本気の方が多いですね。
結婚や、旦那様を取り立てていただこうと、狙っている方も多そうです。
	私も、そのうちの一人だと言えば、そうなるのかもしれません。
クックロビンのこと、よろしくお願い致します。
晶	（しっかりしてる奥さんだな……）
~~~~~~~~~	~~~~~~~~~
選択	年配の女性からの人気は？
カナリア	年配の女性は、魔法使いに怖い印象を持たれてる方が多かったのですが、
アーサー様が来てから雰囲気が変わりました。
誰が相手でも、てらいなく素直に接してくださるお姿を間近に見ていると、
孫や息子のように感じるんじゃないでしょうか
アーサー様もわからないことがあると、身分も問わずなんでもお尋ねになりますから。
つい可愛くなってしまうのは仕方ないでしょうね。
`},
{id:10223,title:"スポットの名物",type:"personal",characters:["②"],memo:"アーサー",
text:`クックロビン	賢者様、こちらをどうぞ！グランヴェル城の特製品です。
晶	ありがとうございます。これはなんですか？メダル？
クックロビン	はい。祝日に城の一部を解放する際、見学に来た方へお配りしているんです。
	絵柄もいろいろあって、収集家もいるくらい好評なんですよ。
晶	すごい！お土産がもらえるんですね！表にグランヴェル城が彫ってある。
	裏面は……？
~~~~~~~~~	~~~~~~~~~
選択	……アーサーだ！
晶	……アーサーだ！
クックロビン	おお！ それは当たりです！
お優しいアーサー殿下のメダルは、どんな方でも欲しがるので。
	特に女性や、子供に人気ですね。
数年前までは、カイン元騎士団長のメダルもあって、それがまた評判良くて。
晶	わかる気がします……。大事にしますね！
~~~~~~~~~	~~~~~~~~~
選択	……ドラモンドさんだ！
晶	……ドラモンドさんだ！すごい！ドラモンドさんの柄もあるんですね！
クックロビン	お城の関係者の顔が彫ってあるんですよ。
あはは、ドラモンド様のメダルでそんなに喜ぶ方は初めて見ました。
	でも残念、ハズレでしたね！よろしければ、もう一枚どうぞ。
晶	（この人、上司の顔のメダルをハズレって言い放った……。
酷いけど、ちょっと親近感湧くな……）
~~~~~~~~~	~~~~~~~~~
選択	……知らないおじさんだ！
クックロビン	賢者様……！
それは国王陛下です……！！
晶	えっ、あっ！？……すみません！！
クックロビン	ここでおじさんはまずいですよ！！
晶	すみません、すみません……！
`},
{id:10224,title:"スポットでの発見",type:"personal",characters:["オズ"],memo:"アーサー",
text:`晶	あれ、紙くずが落ちてる。こんなに綺麗な庭なのに……。
たくさんあるな。書類を破いて捨てたのかな？とりあえず拾って……。
オズ	《ヴォクスノク》
晶	オズ……！？うわ！紙の破片が集まって来た……！
オズ	…………。
晶	書類が元に戻ってる！ありがとうございます。魔法って掃除に便利ですね。
オズ	これは……。
晶	なんて書いてありましたか？俺には読めない文字で……。
オズ	恋文の下書きだ。
……アーサー宛の。
晶	え！？恋文って……ラブレターのことですよね！？だ、誰が……。
オズ	賢者よ。
晶	は、はいっ。
オズ	これは、おまえに託す。
晶	えっ……。
オズ	頼んだぞ。
晶	消えた……！？ま、待ってください！
気まずいのはわかりますけど、こんなの無理ですよ……！
オズ！オズ……！
`},
{id:10225,title:"楽しい場所",type:"personal",characters:["カイン"],memo:"アーサー",
text:`カイン	賢者様。ちょっとついてきてくれ。
晶	カイン。何かありましたか？
カイン	ここから見る夕暮れが綺麗なんだ。あんたに見せてやりたくてな。
晶	あ……、ありがとうございます……。
カイン	ああ。もうすぐだ。
晶	（………夕日を見るために、ただ待つなんてこと、初めてかも
ここにきてから、なんだか、
贅沢でのんびりした時間をたくさん過ごしてるなあ……）
カイン	…………。
晶	…………。
カイン	…………。暇だな。早すぎたか？
晶	えっ。
カイン	今度にして、飲みに行こう。いい店があるんだ。
晶	（カインはわりとせっかちだな。夕日に向かって走るほうがいいかも……）
`},
{id:10226,title:"マナエリア",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、
賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
アーサー	パワースポット……。ああ、マナエリアのことでしょうか。
	マナエリアとは、それぞれ自分自身が持つ原風景のような、
自然と心の落ち着く場所のことです。
晶	たぶん、それです！アーサーにもマナエリアがありますか？
アーサー	私のマナエリアは、オズ様の城で暮らしている時に見た、オーロラの降る雪景色です。
	空一面に広がる幻想的な光を見つめていると、
私の身体が内側から目覚めるような、胸の奥から湧き上がる力を感じられました。
	心が落ち着く場所と言いましたが、私の場合は元気を貰うような感覚になります。
	集中して、やる気が出るような。
	落ち込んだ考えを吹き飛ばしたい時や、
朝、目覚めてすぐ、仕事の前に訪れたいような場所ですね。
晶	なるほど。気合を入れたい時や気持ちを切り替える時に行くんですね。
	なんとなく、前向きなアーサーらしいですね！
アーサー	ありがとうございます。
	賢者様にとってのマナエリアがわかったら、ぜひ教えてくださいね。
`},
{id:10227,title:"アミュレット",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	マナエリアから長く離れる魔法使いは、
マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アーサーもアミュレットを持ってますか？
アーサー	はい。私がグランヴェル城に戻る時に、オズ様が作ってくださいました。
アーサーは、机の上に置いていた足つきのガラスドームを両手で持ち上げて、俺に見せてくれた。
瓶の中で、輝くような光のカーテンがさらさらと流れ揺らめいている。
晶	すごい……。
アーサー	私のマナエリアは北の国のオーロラの風景です。
	似たものを持ち出せなかったので、
オズ様がオーロラの幻影を瓶に閉じ込めてくれました。
晶	幻影……。なら、これはオズの魔法なんですね……。
	すごく綺麗です。
アーサー	そうなんです！見惚れてしまいますよね。
	オズ様の城を出たあの日からずっと、このアミュレットに力を貰っていました。
	城で落ち込んだ時も、
この光を眺めていると、オズ様と見たオーロラを思い出して、心を持ち直せたのです。
晶	確かに、この綺麗な光を見つめてたら、
くよくよした気持ちが浄化されそうですね……。
アーサー	賢者様も、心の落ち着くものを見つけたら、
それをアミュレットとして部屋に置いておくと良いと思いますよ。
`},
{id:10228,title:"職業",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	アーサー！魔法舎に来てたんですね。
アーサー	賢者様。今、ご挨拶に行くところでした。城での仕事が早く終わったのです。
晶	そうだったんですね！お疲れ様です。お城と行き来するのは少し大変ですね。
アーサー	箒に乗って行きますから大丈夫ですよ。空を飛ぶのは好きですから。
晶	（俺の世界ならまだ高校生くらいなのに、
王子様の仕事も両立していて、偉すぎるな……）
~~~~~~~~~	~~~~~~~~~
選択	お城ではどんな仕事をしていますか？
アーサー	色々ありますが、父上の公務の手伝いをしています。
	今は、会議や式典への出席と、客人のもてなしや、それらの準備。
	王家の承認を求める書類の確認などが主ですね。

~~~~~~~~~	~~~~~~~~~
選択	王子様になって良かったことはありますか？
アーサー	良かったこと、ですか……。
	…………。
	贅沢でいい暮らしをさせて貰っているとは、思っているのですが……。
	あっ！王子になったおかげで、魔法使いたちのために出来ることが増えました。
それは、とても嬉しいです！
~~~~~~~~~	~~~~~~~~~
選択	好きな業務と嫌いな業務は？
アーサー	色々な者たちと会って話すのは楽しいです。
行ったことのない土地へ赴くのも好きですよ。
	反対に、書類の仕事は、調べなくてはならないことも多くて、
	どうしても眠くなってしまいますね……。

アーサー	明日は城での仕事が午後からなので、今夜は魔法舎に泊まる予定です。
晶	なら、今夜はゆっくりできますね。
シノたちが、新しいゲームに誘いたがってましたよ。
アーサー	それは楽しそうだな。すぐに着替えてきますね！
`},
{id:10229,title:"家族",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	アーサー。これからお城に戻るって聞きましたけど、用事があるんですか？
アーサー	ええ。今日は朝から父上のお加減が良かったので、
午後のお茶をご一緒にと、お誘いしたのです。
晶	そうだったんですね！アーサーのお父さん……、国王様って、どんな方なんですか？
アーサー	穏やかで優しい方ですよ。
公正で見識も広く、魔法使いの私にも、偏見なく接してくださいます。
	そして、身近な人たちをとても大切になさっています。
母上や私はもちろん、城や国のものたちを。
晶	王様らしい、立派な人なんですね……。
アーサー	そうですね。今は病に伏していますが、とても威厳があった方だと聞いていますし、
寝台の中であっても、その面影を感じます。
ですが、近寄りがたい雰囲気はありません。
病が治ったら一緒に中央の国を見て回ろうと、言ってくださいました。
	おそばにいて、学ぶことの多い方です。
私も、父上のようにみなを導けるよう、頑張らねばなりませんね。
`},
{id:10230,title:"オズとの暮らし",type:"personal",characters:["②"],memo:"アーサー",
text:`アーサー	魔法舎の談話室で寛いでいると、オズ様の城を思い出します。
晶	そうなんですね。北の国のオズの城も、この部屋みたいな感じなんですか？
アーサー	雰囲気はかなり違いますが、
広間に大きな暖炉があって、夜はその前で過ごすことが多かったのです。
夕食後のオズ様は、昼間よりももっと寡黙でした。
時折話す声も、低くてゆったりしていた。
幼い頃の私も、
なんとなく静かにしていなければと思って、オズ様のそばで本を読んでいました。
そのうち、いつの間にか眠ってしまって、オズ様に起こされて部屋に戻るんです。
晶	ゆったりしてて、なんだか優雅な暮らしですね……。
アーサー	ええ。何気ないですが、静かで楽しい毎日でした。
	私がどうして起きない時は、オズ様がベッドに連れて行ってくださるので、
	たまに、寝たふりをしてたんです。
	今思えば、オズ様は、私が起きていることに気付いていた気がします。
	少し、恥ずかしい思い出ですね。
`},
{id:10231,title:"頼れる魔法使い",type:"personal",characters:["アーサー","フィガロ"],memo:"アーサー",
text:`晶	アーサーとフィガロは、以前からの知り合いなんですよね。
フィガロ	そうそう。アーサーがまだ、こんな小さな頃からね。
	よくオズの城に遊びに行ってたよね。
アーサー	はい。フィガロ様に初めて会った時、
たくさんおしゃべりをしてくださる方だと、びっくりしたのを覚えています。
フィガロ	あはは。無口なオズと二人きりで暮らしてたら、
誰に会ったっておしゃべりだなって驚くさ。
アーサー	フィガロ様は楽しくて物知りでした。
色々な国と人々の話をしてくれましたし、たくさん構ってくれました。
	いつも私を気にかけてくださって、オズ様に言えないことができたら相談してと
会うたびおっしゃっていました！
フィガロ	その話、まだ有効だよ、アーサー。オズに内緒で、いつでも部屋においで。
晶	フィガロから少し、面白がってるような雰囲気を感じますけど……。
アーサー	私が中央の国に来てからも、何度か会いに来てくれたことがありました。
	前の賢者様にご紹介したこともあります。
晶	そう言えば、フィガロも前の賢者様と、面識があるって聞きましたね。
フィガロ	前の賢者様は俺のこと、どんなやつだって言ってた？
アーサー	たしか……。
	ちょいワルリア充の匂いがすると、おっしゃっていましたね。
`},
{id:10232,title:"お茶目な友達",type:"personal",characters:["②"],memo:"アーサー",
text:`アーサー	幼い頃、スノウ様とホワイト様にも、よく遊んでいただきました。
晶	スノウとホワイトは、オズやフィガロの、魔法のお師匠様だったんですよね。
アーサー	はい。私も、初めてお会いした頃はそのことを知らず、
年の近い魔法使いだと勘違いしてしまって。
お二人もご自分から誤解を解かれずに、「お兄ちゃまと呼ぶように」とおっしゃるので、
しばらくの間、そう呼んでおりました。
私も、子供同士なのだと思って、「こっち来て！」とか「あれやって！」などと、
平気で言っていましたね……。
晶	あはは！スノウとホワイトはいたずら好きですもんね。
どこで正体がバレたんですか？
アーサー	野原で駆け回っている時だったと思います。
急に大人の姿に変化なさって、我らは疲れたからオズに遊んでもらえ、と……。
晶	（気ままだ……）
アーサー	驚きましたし、子供の友達ができたと思っていたので、
当時は少しだけさみしかったのです。
今も、スノウ様とホワイト様は、
大人のお姿より、子供のお姿の時の方が、親しみを覚えますね。
`},
{id:10233,title:"前賢者との思い出",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	前の賢者様とは、どんな話をしていたんですか？
アーサー	お互いの世界についてです。仕事、生活、遊び、住居、それから、食べ物について。
	賢者様の世界の食事を再現することには、二人で何度か挑戦しました。
前の賢者様はラーメンがお好きでしたね。私はグラタンコロックが好きでした。
晶	グラタンコロッケ美味しいですよね！俺が好きだった食べ物は……。
~~~~~~~~~	~~~~~~~~~
選択	寿司です！
アーサー	寿司は前の賢者様に聞いたことがあります！
ぜひ食べて見たかったのですが、
中央の国は大陸の真ん中にあるので、新鮮な魚が手に入らなくて……。
	代わりに、きゅうりを、蒸した米穀で包んで食べました。
	それも寿司だと伺いましたが、本当ですか？
晶	（カッパ巻きだ……）
~~~~~~~~~	~~~~~~~~~
選択	肉まんとあんまんです！
アーサー	肉まんと、あんまん……。それは初めて聞く食べ物です。
	まん、とは、どんなものですか？
晶	えっ？えっと、ハンバーグっぽい肉を、白パンのようなもので包んで蒸したのが、
肉まんで……。
アーサー	なるほど。では、グラタンコロッケをまんで包むと、
グラタンコロッケまんになるのですね！
晶	お、おそらく……？
~~~~~~~~~	~~~~~~~~~
選択	タピオカミルクティーです！
アーサー	タピオカとは、初めて聞きました。茶葉の名前でしょうか？
晶	いえ、タピオカは黒くてもちもちしてる外国のお菓子で、甘くて美味しいんです。
アーサー	もちもち……？何でできているのですか？
晶	えっ……？か、考えたことなかった……。小麦粉……？果物……？野菜……？
	（あんなに飲んでたのに……。なんかショックだな……）

アーサー	食堂で、似たものが作れないか、試しに行ってみましょうか。
晶	アーサーが作るんですか？
アーサー	簡単な家事なら、一通りのことはできますから。
味見は、賢者様にお任せいたしますね。
`},
{id:10234,title:"本物の王子様",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	あっ……、うわっ！
アーサー	賢者様！
タイルに足を取られて転びそうになった瞬間、そばにいたアーサーが、俺の体を支えてくれた。
すぐに、心配そうに顔を覗き込んでくる。
アーサー	危なかった。お怪我はありませんか？
晶	はい、大丈夫です。ありがとう、アーサー。
アーサー	賢者様がご無事で良かったです。
	あ……、靴が脱げてしまいましたね。
いつのまにか転がっていた片方の靴を拾うと、
アーサーは、躊躇いなく俺の前に跪き、靴を履かせてくれた。
晶	（うわ……、本物……）
	あの、それ、めちゃくちゃ王子様っぽいですね……！
アーサー	そうですか？
晶	はい。ちょっとテンション上がりました……。
アーサー	あはは。喜んでいただけたのなら光栄です。
	夜の庭は、散歩するには少し暗かったですね。部屋に戻るまで、お手をどうぞ。
賢者様。
`},
{id:10235,title:"得意な魔法",type:"personal",characters:["②"],memo:"アーサー",
text:`アーサー	《パルノクタン・ニクスジオ》！
晶	すごい！先週から練習していた魔法、使えるようになったんですね！
アーサー	ありがとうございます。賢者様にお褒めいただき光栄です。
晶	（アーサーは、飲み込みが早くて、どんな魔法も上手くこなせる、
優等生タイプの魔法使いみたいだな）
	アーサーの得意な魔法ってあるんですか？
アーサー	得意か……。強いて挙げるとすれば攻撃魔法でしょうか。
晶	そうなんですね！？アーサーは優しいのに、ちょっと意外です。
アーサー	オズ様から、攻撃魔法を教わる機会が多かったのです。
晶	なるほど、オズらしいですね……。
アーサー	最初に教えていただいたのは、刃物のように、鋭く物質を切り裂く魔法です。
	普段は薪にする木を切るのに使っていましたね。
晶	（生活感ある……）
`},
{id:10236,title:"アーサーの初めての魔法",type:"personal",characters:["②"],memo:"アーサー",
text:`テーブルを離れようとした瞬間、指先に何かを引っ掛けた感触がした。
コーヒーカップだ。
晶	わっ……！
アーサー	あっ……！
	……はあ、よかった。間に合いました。
晶	魔法でカップが浮いたまま止まってる……。
	ありがとうございます、アーサー。割ってしまうところでした。
アーサー	お怪我がなくてよかったです。
ふわりと柔らかな動きで、カップは行儀よく元あった場所に戻る。不意に、アーサーが小さく笑った。
晶	どうかしましたか？
アーサー	初めて使った魔法も、同じような場面でした。
	中央の城にいた頃、
私のいたずらで、メイドが食器を落としそうになったのをとっさに止めたのです。
	幼い時から、物を落としたり、壊しそうになったりする、
慌ただしい子供だったとよく言われます。
	素早く魔法を使う術は、そういうことがきっかけで、身についたのかもしれませんね。
`},
{id:10237,title:"紋章",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	アーサーの賢者の紋章は、手の甲に出たんですよね。
アーサー	はい、ここです。
	以前、カインの紋章を見せてもらっていたので、
これが月に選ばれた紋章なのだと、すぐにわかりました。
~~~~~~~~~	~~~~~~~~~
選択	びっくりしましたか？
アーサー	ええ。城の者たちと、厄災の影響について話し合っている最中に、
急に光り始めたのです。
驚きましたが、私はやはり、嬉しかったです。
みなのために魔法を使えること、世界を守る使命を与えられたこと、
師や、仲間と、共に過ごし戦えること、全て。
~~~~~~~~~	~~~~~~~~~
選択	辛くはないですか？
アーサー	賢者様の魔法使いに選ばれたことを、辛いと思ったことはありません。
	以前から、魔法舎の手助けをしていたつもりですが、
これでようやく、直接力を貸すことができると、嬉しく思いました。

アーサー	もうひとつ、焼しかったのは、城で働いている子供に、話しかけられたことですね。
晶	子供に？
アーサー	手の模様は何？と。賢者様の紋章だと説明したら、格好いい、と言われて。
	次に会った時、真似をして、自分の手の甲に絵を描いていたのです。
	嬉しくて、身の引き締まる出来事でした。
`},
{id:10238,title:"大好物の為なら",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	あれ、エレベーターから物音が……。誰か来るのかな……？
アーサー	あっ……、賢者様！？
晶	アーサー！？びっくりした……。
	中央の街の塔から来たんですよね？
エレベーターを使って来るなんて、よっぽど急いでたんですね。
アーサー	それが、その……。
晶	（アーサーが言い澱むなんて。まさか、よくないことが……）
	アーサー、何かあったんですか？俺に手伝えることはありますか？
アーサー	ち、違うのです、賢者様。実は今夜……。
	魔法舎の夕食にシチューが出ると、カインが知らせてくれたのです。
私の好物だからと。
	ですが、用事で遅くなってしまったので、
夕食に間に合うように、エレベーターで……。
晶	このエレベーターって、確かマナ石の力で動くんでしたよね。
	マナ石は……高価なものじゃなかったですか？
アーサー	自分用に取っておいたものを使いました。
ネロの作る料理は美味しいので、どうしても冷めないうちに食べたくて……。
晶	（セレブの使い方だ……）
`},
{id:10239,title:"今はあなたと",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	アーサー、お茶を入れて来ました。部屋で仕事をしてるって聞いたので。
アーサー	賢者様！ありがとうございます。ちょうど今、終わったところでした。
晶	書類の持ち帰りなんて大変ですね……。
アーサー	城で済ませてもよかったのですが、魔法舎で、みなと夕食を食べたくて。
それに、この部屋で作業をすると、少しだける気がするのです。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
アーサー	今のように、城の仕事が残っていたらやっています。
	あとは、読書などでしょうか？
魔法舎では、ゆっくりくつろぐより、誰かと一緒にいることが多いかもしれません。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
アーサー	カインはよく尋ねて来てくれます。私が彼の部屋に行くことも多いですね。
リケも、一人でいると声をかけてくれます。
あとは、シノが空腹の時に来ることが多いので、
城で出た菓子を置いておくようにしています。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
アーサー	魔法舎に来る曜日や時間は決まっていません。
城での会議や謁見の仕事をして、午後からこちらに来ることが多いでしょうか。
ただ、今は厄災との戦いに備えるために、
魔法舎で魔法の訓練をする時間を、優先して取るようにしています。

アーサー	明日は朝からオズ様が魔法の授業をしてくださるので、
今夜は魔法舎に泊まって行く予定です。
晶	なら、このあとはゆっくりできるんですね。
お茶は談話室に持って行って、みんなと飲みましょうか。
アーサー	そうですね……。ですが、私は、賢者様ともう少しお話がしたいです。
	飲み終えてからでも構いませんか？
`},
{id:10240,title:"昔のようなひと時",type:"personal",characters:["オズ"],memo:"アーサー",
text:`晶	談話室のソファに誰かいる……。あの後ろ姿はオズかな？
オズ……、あっ……。
ソファを覗き込むと、オズにもたれてアーサーが眠り込んでいた。
見つかったオズは、少しだけ決まりの悪そうな顔をする。珍しく、俺より先にオズが口を開いた。
オズ	……話しながら眠ってしまった。
晶	疲れていたんでしょうか。
オズ	子供の頃からこうだ。
部屋に戻れと促しても聞かずに、話し続けて、そのまま寝入ってしまう。
晶	オズが聞いてくれるのが嬉しいんですよ。きっと。
オズ	そうか……。
晶	毛布を持って来ましょうか？
オズ	いや。もう、部屋に連れて行く。おまえも、早く休むといい。おやすみ、賢者。
ふわりと、オズが上着をアーサーに覆いかぶせると、二人はそのまま手品のように姿を消した。
`},
{id:10241,title:"パンケーキ論争",type:"personal",characters:["アーサー","ミスラ"],memo:"アーサー",
text:`晶	あれ……。アーサーとミスラが話してる。
珍しい組み合わせだけどちょっと心配だな……。
	アーサー、ミスラ。何かありましたか？
アーサー	賢者様。二人でオズ様のお部屋へ行くところなのです。
晶	オズの？
ミスラ	この子、オズがパンケーキを焼けるんだと言い張るんですよ。信じられなくて。
アーサー	私は嘘などつかない。オズ様は、パンケーキを焼くのだってとてもお上手だ。
	重ねて１０段まで積んだこともある。
二人では食べきれなくて、次からは控えようということになったが。
ミスラ	へえ……。俺ならきっと、食べきれますけどね。
アーサー	パンケーキを食べたことがないのか？
	パンケーキを食べていると喉が乾いて、ついミルクを飲んでしまうが……。
	ミルクを飲むと、スポンジが胃の中で水分を吸収して膨らんで、
すぐにお腹がいっぱいになってしまうのだ。
ミスラ	俺にはできますよ。オズには無理だったとしても。
晶	（張り合ってる……。喧嘩じゃないみたいだし、平和そうだ……）
	そうなんですね。みんなでおやつを食べるなら、あとで食堂に寄ってみます。
ミスラ	１０段でも２０段でも食べてやりますよ。
アーサー	食べられる分だけにしておけ。
代わりにバラの形に焼いてくださるよう、私がオズ様にお願いしてみよう。
`},
{id:10242,title:"勇敢で無垢な王子様",type:"personal",characters:["アーサー","クロエ"],memo:"アーサー",
text:`晶	わっ……！今、変な物音がしませんでしたか？
クロエ	俺も聞こえた……！何だろう、こんな夜に怖いな……。
アーサー	…………。上から気配がする。
	ちょっと見てこよう。
クロエ	え！？や、やめなって、アーサー。
アーサー	大丈夫だ。
俺たちに笑いかけると、アーサーはふわりと身体を浮かせ、天井を通り抜けるように消えてしまった。
クロエ	アーサー！
	行っちゃった……。誰か呼んできた方がいいかな……。
アーサー	必要ない。
晶	わ！戻ってきた！無事でよかったです……。
アーサー	大きなネズミが巣を作ろうとしていたのです。追い払っておきました。
クロエ	何だ、ネズミが……。
	助かったけど、王子様なのに危ないよ！
アーサーの命を狙ってる暗殺者だったら、どうするの？
アーサー	暗殺者？とても面白い発想だな！
クロエ	喜ばないで。もー、埃まみれだよ。綺麗にしてあげるね。
アーサー	ありがとう、クロエ。
晶	（迷わず、真っ先に危ないところを調べに行くなんて、アーサーらしいけど……
	　王子様って立場を思うとひやひやするな。
　これはドラモンドさんも苦労するはずだ……）
`},
{id:10243,title:"嘘つきは誰？",type:"personal",characters:["中央"],memo:"アーサー",
text:`晶	じゃあ、いきますね。アーサー。
アーサー	お願いします、賢者様。
晶	問題！アーサーのケーキを食べてしまった犯人は、この中の誰でしょうか？
オズ	私ではない。
カイン	俺じゃないぜ。
リケ	僕ではありません。
アーサー	……みな、本当のことを言っているように思います。別の誰かなのでは？
オズ	アーサー、犯人はこの中にいる。これは嘘を見抜く練習だと言っただろう。
カイン	アーサーは本当に騙されやすいからな。俺が城での護衛につけなくて心配だよ。
リケ	ケーキを食べた者は絶対に許さない！
と、怒りに燃えるといいのではないでしょうか？
アーサー	わかった、やってみよう。
	むむむ……。
晶	その調子で頑張ってください！正解したら、別のケーキをお出ししますね！
じゃあ、みんな、もう一度お願いします。
オズ	私ではない。
カイン	俺じゃあない。
リケ	僕ではありません。
アーサー	…………｡
	やはり、別の誰かなのでは？
`},
//カイン
{id:10301,title:"スポットの印象（１）",type:"personal",characters:["オズ"],memo:"カイン",
text:`晶	オズは長生きなんですよね。この街に来たことはありましたか？
オズ	街になってからは初めてだ。
晶	そうでしたか。栄光の街はどうですか？
オズ	サーペントの守護を感じる。街でなく、己の身を護っているのかもな。
	川辺だが水害の心配は当分ないだろう。
晶	そんなこともわかるんですね。街の人たちが喜びますよ、きっと。
オズ	……街の者は、賑やかで皆陽気だ。
	グランヴェル城の周りもそうだが、さらに陽気だな。この辺りは。
晶	確かに、ここと比べると、中央の街は都会な雰囲気があるかもしれません。
	ここは活気のある観光地って感じがするかも。
オズ	すぐに友人のように話しかけられる。
	「よう、にいちゃん」と言われるが……。
	私の方が年上だぞ。と、思いながらやり過ごす。
晶	オズ……。もしかして気に障りました……？
オズ	いや……。
	だが、戸惑う。
`},
{id:10302,title:"スポットの印象（２）",type:"personal",characters:["ヒースクリフ"],memo:"カイン",
text:`晶	……あれ？ヒースがいない……。
	さっきまで見えるとこにいたのに、はぐれちゃったのかな。
	ヒース？ヒース……。
ヒースクリフ	……賢者様……。
晶	わっ。びっくりした……！魔法で姿を消してたんですか？
ヒースクリフ	なんかこの街……。
	すごく話しかけられるし、すごく顔を褒められるし、すごく誘われるし……。
	みんな知らない人なのに……。それで、ちょっと……。
晶	そ、そっか……。ヒース、人見知りなんでしたね……。大丈夫ですか？
ヒースクリフ	はい……。嫌だってわけじゃないんですけど……。
晶	みなさん気さくですもんね。俺も最初は驚きました。
ヒースクリフ	そうですよね……。
	ちょっと、次に来るときは、栄光の街に行くぞ！って気合いを入れないと
	出かけられないかもしれません……。
晶	ああ……。無理はしないでくださいね。
ヒースクリフ	すみません……。しばらく失礼しています……。
`},
{id:10303,title:"スポットの印象（３）",type:"personal",characters:["シャイロック"],memo:"カイン",
text:`晶	シャイロックは、栄光の街には初めていらしたんですか？
シャイロック	何度か訪れたことがあります。陽気でいい街ですね。
	この辺りは水が美しいので、美酒との出会いも多いんですよ。
晶	そうでしたか。シャイロックは静かな場所が好きそうだから、
	賑やかな街だけど大丈夫かなと思ってたんです。
シャイロック	おや、お気遣いありがとうございます。
	私も出身が港町だったので、この街の雰囲気は嫌いじゃないですよ。
	人や物が、多く流れるところが好きです。
晶	人や物、ですか。
シャイロック	ええ。流通の激しいところには、出会いと別れも多い。
	ですが、この街は、感傷的になりすぎない。
	そんなところが好きなんです。
	だから、束の間の出会いを楽しみにたまに訪れることがあるんですよ。
晶	シャイロックにも、パーッとしたい気持ちになることがあるんですね……。
	なんだかちょっとホッとします。
シャイロック	ふふ。素直な人。
`},
{id:10304,title:"ブレイクタイム（１）",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	ほら、賢者様。コーヒーだ。そこのベンチで休もうぜ。
晶	ありがとうございます！テイクアウトコーヒーがこっちの世界で飲めるなんて……。
カイン	この辺りの店はだいたいなんでも持たせてくれる。
	みんな、川を眺めながらゆっくりするのが好きだからな。
晶	本当だ。いろんな人が、川に向かったベンチに座っておしゃべりしてますね。
カイン	ここは、ひとりで過ごすのもいい。コーヒーを飲みながら本を読んだりな。
晶	（カインが、川辺のベンチで、コーヒー片手に読書を……）
	想像しただけで絵になるな……。
カイン	え？
晶	……普段は体育会系なのに、なんか悔しいです。
カイン	なんだよ、体育会系って？
`},
{id:10305,title:"ブレイクタイム（２）",type:"personal",characters:["リケ"],memo:"カイン",
text:`晶	本当に綺麗な景色だな……。海外旅行に来たみたいだ。
	あ……、ゴンドラみたいなボートが、こっちに流れて来た……、あれ？
	乗ってるのは、リケ……？
リケ	け、賢者様……！
晶	リケ！い、一緒にボートに乗ってるのはどなたですか……？
リケ	カインの友達の船頭さんです……！
	あ、あの、さっき、カインといた時にお会いして……！
	せっかくだから乗せてもらえよって、カインに言われて……！
	迷ってるうちに乗せられてしまって……！
晶	だ、大丈夫ですか……！？
リケ	は、はい、たぶん……！楽しいは楽しいです……！
	すみませんが、ちょっと行ってきますね……！ご飯までには戻ります……！
晶	わ、わかりました！気をつけて……！
リケ	はい……！
晶	…………。
	いざとなったら、リケも箒で飛べるし、大丈夫かな……。
`},
{id:10306,title:"スポットの思い出（１）",type:"personal",characters:["③"],memo:"カイン",
text:`晶	思い出深いお祭りってありますか？
カイン	ここは祭りが多いからな。
	どれも大好きだが、特に印象深いのは水門に祈念する祭りかな。
晶	水門のお祭り。どんなものですか？
カイン	まず男たちが、街の中央の通りを歌ったり踊ったりしながら歩いて行く。
	大人たちは、この時点でもう酔っ払ってる。
晶	あはは。
カイン	集まった人たちは、そこへ月桂樹の花や、葉で編んだ冠を投げるんだ。
	窓からも飛んできて、冠は当たると結構痛い。
	それを拾い集めながら皆で水門へ向かって、水門や、川縁を飾る。
	その夜は、みんなで夜通し飲んで騒ぐ。夜が明けたら飾りは川に流す。
	これは、この街の人間や、旅人を、無事に送り出す意味合いもある。
晶	楽しそうです！川辺の街っぽい風習ですね。
カイン	伝説の蛇もちゃんといたからな……。
	俺が無事に中央の城に着いたのも、祭りのおかげだったかもしれない。
	そう考えると思い出深い。次の祭りには、あんたやみんなとも参加してみたいな。
`},
{id:10307,title:"スポットの思い出（２）",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	この街の川は懐かしいな。いろんな思い出がある。
晶	どんなものですか？聞きたいです。
カイン	…………。子供の頃、友達が川で溺れかけた。
	周りにいたのも子供ばかりで、どうにもできなくて。俺は魔法を使ったんだ。
晶	……カインは昔、自分が魔法使いだってことを内緒にしてたって……。
カイン	そうだ。親にも、人前では魔法を使うなと固く言われていた。
	魔法使いに寛容な国だなんて言っても、田舎町だ。偏見はまだ十分ある。
	友達は助かったが……。その場が、シーン、てなっちまって。
	まあ、バレた。たぶんな。
晶	たぶんって？
カイン	みんな、誰にも話さなかったんだ。俺が魔法使いだってことを。
	翌日から、何事もなかったように、今日まで付き合いが続いてる。
晶	よかった……。いい友達ですね！
カイン	ああ。
`},
{id:10308,title:"スポットの思い出（３）",type:"personal",characters:["オーエン"],memo:"カイン",
text:`オーエン	思い出したけど、この街、昔来たことがある。
晶	えっ、そうなんですか。昔と今と、比べてどうですか？
オーエン	あまり変わらない。どいつもこいつも、前向きでやりにくい。
晶	やりにくい……。
オーエン	前に来た時も、この街の人間を暗い気持ちにしてやろうとして接触したけど。
	他の場所より時間が掛かって面倒だった。
	話しかけてもさ。
	「そんな……。でも……、なんとかなるかな……」って、なかなか落ち込まない。
晶	（わかるかも……）
オーエン	カインもここ出身だって聞いて納得したよ。
晶	ポジティブさって大事ですね……。
オーエン	退屈だから早く帰りたいな。
`},
{id:10309,title:"カインへの印象（１）",type:"personal",characters:["オズ"],memo:"カイン",
text:`晶	オズから見て、カインはどんな魔法使いですか？
オズ	………。
	時代のせいかもしれないが。
	最近の若い魔法使いは私に対して馴れ馴れしくて驚く。
晶	……それは……、
	やっぱり、オズにも、目下からは敬われたい的な気持ちがあるんでしょうか？
オズ	そうではない。だが、カインは特に無作法だろう。
晶	……もしかして、何かありました？
オズ	………。
	先日、カードゲームの人数合わせに誘われた。
晶	う、うわ……。
オズ	「よう、オズ。暇そうだな。あんたも混ざれよ」と、言われた……。
晶	（軽ゥ……！）
オズ	長い時間を生きてきたが、こんなことは初めてだ。
`},
{id:10310,title:"カインへの印象（２）",type:"personal",characters:["アーサー"],memo:"カイン",
text:`晶	栄光の街にいるカインと、中央のお城で会うカインは、やっぱり違いますか？
アーサー	どうでしょう。
	心なしか羽を伸ばしてるような気もしますが、カインはいつも変わりません。
	格好良くて、頼もしくて、気さくで、仲間思いで……。
	彼ほど欠点のない人はいないでしょう。
	騎士団長として出会った時から、私にとって、兄のような存在です。
晶	そうか、カインは元騎士団長だから、
	魔法舎で一緒になる前から二人は知り合いだったんですね。
アーサー	はい。当時、カインは魔法使いということを隠して騎士団に所属していましたが……。
	魔法を使わずとも彼は優秀で、
	諸外国の客人からの評判も、部下からの信頼も厚い、誠実な騎士でした。
	のちに彼が魔法使いだということが発覚して、
	騎士団を解任された時も、本当は傍に置いておきたかったのですが……。
	魔法使い同士だから、贔屓しているのだと言われ、断念したのです。
晶	きっと気にしてないですよ。今の、カインが聞いたらすごく喜ぶと思います。
アーサー	そうですか？少し気恥ずかしいけれど、賢者様がそうおっしゃってくださるなら。
	あとで伝えてみようと思います。
`},
{id:10311,title:"カインへの印象（３）",type:"personal",characters:["リケ"],memo:"カイン",
text:`晶	リケはカインと馴染めましたか？
リケ	そうですね……。馴れ馴れしいところに困ったりもしますが、
	面倒見のいいところに助けられたりもします。
晶	困ったことって？
リケ	すぐに頭を撫でたり、肩や背中を叩いたりするのです。
	私は神の使徒だから、安易に触れては罰が当たると何度も言っているのに聞かなくて。
晶	ああ、なるほど……。でも、カインのことだから、悪気はないんだと思いますよ。
リケ	それはわかります。私自身、なんでもないときは、もう！と返せるんですけど……。
	物事が上手くいかないときに、大きくて暖かい手で撫でられると……。
	嬉しいのと、弱ってしまうのとで、胸が熱くなって、
	……何も言えなくなる時があるんです。
晶	リケ……｡
~~~~~~~~~	~~~~~~~~~
選択	思わず頭を撫でた。
リケ	……っ、賢者様……！賢者様まで頭を撫でないでください……！
晶	あっ、すみません！つい……。
	（カインの気持ちもわかる気がするな……）
~~~~~~~~~	~~~~~~~~~
選択	思わず背中を撫でた。
リケ	……賢者様……。
	大丈夫です、泣いたりなんてしていません。
	私は神の使徒ですから、いつでも心を強くしていなければ……。
晶	（リケは気丈だけど、確かに無理をしていないか心配になる時があるなあ……）
~~~~~~~~~	~~~~~~~~~
選択	思わずほっぺを撫でた。
リケ	……っ、賢者様……！？
	いきなり触ったりしてはだめだと話しているところでしたのに……！
晶	あっ、すみません！リケのほっぺがふくふくで、つい……。
リケ	もう！カインのような大雑把なごまかし方をして！もう……！
`},
{id:10312,title:"カインへの印象（４）",type:"personal",characters:["オーエン"],memo:"カイン",
text:`オーエン	へえ、この街、騎士様の出身地なのか。
	あいつに言うこと聞かせたかったら、この街を人質にすればいいんだね。
晶	オ、オーエン……。
オーエン	騎士様って、今まであまり会ったことないタイプだけど、この街自体もそうなのかな。
晶	会ったことない感じ……？カインがですか？
オーエン	そうでもない？……なら、別にそうでもないかも。
晶	…………。初めて会った時のカインの印象ってどんなでした？
オーエン	会ったことない感じだよ。
	騎士なのに、隠し事をしてた。魔法使いなのに、魔法使いじゃないふりして。
晶	隠し事……。
	たしか、カインが騎士団にいた時は、魔法使いだってことを黙ってたんでしたね。
オーエン	そうだよ。だから暴いてやろうと思ったんだ。嘘つきだってことをね。
	でも、戦ったら騎士っぽかった。仲間を庇ったりしてさ。
	だから殺すのはやめたけど、無傷で生かしておくのも変だろ。
	それで、目玉だけ獲ってやったんだ。
晶	……俺にとってカインは、親切で頼れるなって感じですけど……。
	オーエンにとっては、新鮮で特別な印象を与える人だったんですね。
オーエン	…………。別にそんなこと言ってない。
`},
{id:10313,title:"カインへの印象（５）",type:"personal",characters:["ヒースクリフ"],memo:"カイン",
text:`晶	最初にカインと会った時、どんな印象でしたか？
ヒースクリフ	カインですか？そうだな……。
	俺は、あまり社交的な方じゃないから、賢者の魔法使いになってどうしようって、
	結構、困ってたんですけど……。
	カインはすぐ話しかけてくれました。
	正直、最初は、俺には少し、圧が強めだなって思って……。
晶	あはは。……あ、すみません。その場面が想像できてしまって……。
ヒースクリフ	いいんです。俺も、カインが優しい人だってすぐに気づいたから。
	それから、賢者様が魔法舎に来るまでは、
	カインと一緒にいることが一番多かったかな。
晶	そうだったんですね。
	俺も一番最初に、カインとヒースに親切にしてもらったから、わかります。
ヒースクリフ	カインも、本当の初対面は俺に敬語だったんですよ。
	東のブランシェット家のヒースクリフ様ですか。お見知り置きを。……とか言って。
晶	あはは、騎士らしくてかっこいいですね。
ヒースクリフ	でも、翌日には「よう、ヒース」って話しかけられましたけどね……。
	なんだこの人、って思ったけど、まあ、似たようなやつが身近にいたんで……。
	すぐに慣れました。
`},
{id:10314,title:"スポットゆかりの話（１）",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	この川は、大陸を横断する大河へ繋がってる。
	中央の国の都市部へ、人や物を運ぶために開削して通した人工運河だ。
	水害が少ない川を使ったって話だが、
	封印されたサーペントが、川を守ってたのかもしれないな。
晶	なるほど……。
	（学校の授業みたいな話にファンタジーが混ざってきて、不思議な感じだな……）
カイン	栄光の街の船は速いので有名なんだ。帰りは船で帰ってもいいかもな。
	あんた、船酔いはするのか？
~~~~~~~~~	~~~~~~~~~
選択	します。
晶	船だと、酔うかもしれません……。
カイン	なら、魔法で甲板からちょっと浮かせておいてやるよ。揺れなきゃ酔わないんだ。
晶	……魔法、便利ですね……。
~~~~~~~~~	~~~~~~~~~
選択	しないです。
晶	しません。大丈夫です！
カイン	よかった。時間はかかるが、船旅も気持ちがいいんだぜ。
	あんたもきっと気に入るよ。
~~~~~~~~~	~~~~~~~~~
選択	わかりません。
晶	どうかな……、わからないです。
カイン	船に乗ったことがないのか？そりゃもったいない。なら、試してみよう。
	困ったら俺たちがサポートする。いつだってそうさ。
	俺たちは、晶の魔法使いなんだからな。
`},
{id:10315,title:"スポットゆかりの話（２）",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	栄光の街は、古くから剣士が活躍した街だ。俺も、剣術はこの街で覚えたよ。
晶	そうなんですね。学校とか、習う場所があるんですか？
カイン	この辺りを治めてる領主様が剣術見習いから雇ってくれるんだ。
	みんなそこに集まって腕を磨いてる。
	そのあと、中央の城や他の街へ人材が派遣される。警備や、護衛の仕事に着いたりな。
晶	（警備会社みたいなシステムを街がやってる感じかな……？）
	なんとなくイメージが掴めました！
カイン	よかった。あんたのいた世界と、ここは、ずいぶん違うみたいだもんな。
	俺がいた騎士団にも、栄光の街出身のやつが結構いるんだ。
	今度、街で会ったら紹介するよ。
晶	ありがとうございます。カインの知り合いなら、安心して会える気がします。
カイン	あはは。確かに、ミスラやオーエンと仲のいいやつに会うのは怖いかもな。
`},
{id:10316,title:"中央の国について",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	この街は、剣術と流通が盛んなんだ。
	西の国との境も近くて、中央の国の貿易の主要都市になってる。旅人や観光客も多い。
	グランヴェル城下と並んで、
	死ぬまでに一度は訪れたい街だって言われたりするらしいな。
晶	色々な国の人が出入りしてるんだ。グローバルな街なんですね。
カイン	そう。だからみんな、街を守るために腕を磨くし、
	余計な争いをしないよう陽気なのさ。
晶	なるほど……。カインが気さくなのは土地柄なんですね。なんだか、納得できました。
カイン	あはは、そうか？あとは……。
	栄光の街出身だと、モテるらしい。
	おかげで、中央の都に出てからも女性に声をかけられることが多かったな。
晶	（それは、カイン自身のイケメンオーラのせいなのでは……）
`},
{id:10317,title:"〈大いなる厄災〉について",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	この川沿いは拓けているから、〈大いなる厄災〉が近づくのがよく見えるんだ。
	まさか俺が賢者の魔法使いに選ばれて討伐に加わるなんて、
	昔は考えたこともなかったよ。
晶	選ばれた時に、体に紋章が現れるんですよね。カインはその時、どうでしたか？
カイン	さすがに驚いたな。朝起きたら、腕のところにアザが出来ててさ。
	模様にも見えたが、まあ偶然だろうと思って。
晶	結構複雑な形ですよ……？
カイン	知ってりゃすぐわかったろうが、俺は魔法使いだってことを隠してたからな。
	紋章のことはそれまで耳に入らなくて。
	放っておいたがしばらく消えないから、呪いや病かもと思って医者に掛かったんだよ。
晶	医者……！？
カイン	そこでわかったんだ。月に選ばれた紋章なんだってな。
晶	……なんというか……。カインらしい、おおらかなエピソードですね。
カイン	あはは、気を遣わなくていいよ。俺も少し間の抜けた話だと思ってるさ。
`},
{id:10318,title:"スポットの人々",type:"personal",characters:["アーサー"],memo:"カイン",
text:`晶	初めて見る顔にも、みなさん親戚や友達みたいに話しかけてくれる街ですね。
アーサー	ええ。たとえ私が王子だと名乗っても
	態度が変わらないようなところが信頼できる人々です。
	色々、勧めてくれたり、教えてくれたりするので、学びの多い場所ですね。
晶	そういえばさっき、通りの女性と話し込んでましたよね。何か教わってたんですか？
アーサー	ああ。店先でカードゲームをしていたので覗いていたらルールを教えてくれて。
	彼女に勝つと、今夜一緒に眠ってくれるそうですよ。
晶	（……一緒に眠るって……もしかして……）
アーサー	ゲームは勝ちましたが、
	もうそんな歳ではないので断っていたら恋人だという男がやってきて誤解を……。
晶	あ、あわわわ。
アーサー	そこでちょうど、カインが私を見つけてくれて、誤解を解いてくれました。
	偶然でしたが、この街の恋人同士に祝福ができて、いい夜です。
晶	無事でなによりです、アーサー……。
`},
{id:10319,title:"スポットにいた魔法使い",type:"personal",characters:["③"],memo:"カイン",
text:`晶	栄光の街には、カインの他にも、魔法使いがいるんですか？
カイン	けっこういるよ。馴染みきってるわけじゃないが、迫害されるほどでもない。
	この運河を作る時も、魔法使いが協力したんだ。
	占いが得意な魔女が天気を予測したりさ。
	その名残か、街で働く魔法使いは多いな。人がやるには危ない仕事とか。
晶	占いで天気予報するんですね……。面白いな。当たりますか？
カイン	まあまあ。
	ほら、今も鐘が聞こえただろう。一度なら晴れ、二度なら曇り、三度で雨。
	あれはその魔女が知らせてる。
晶	へえ、すごいですね！……ん？その魔女……？
	運河を作った時の魔法使いが、ずっとこの街の天気予報をしてるんですか？
カイン	ああ。魔法使いは寿命が長いだろ。
	見た目は若いが、３００歳くらいかな？
`},
{id:10320,title:"魔法の泉",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	この泉は魔法の泉なんだ。
晶	魔法の泉……？こんな街の中でですか？
カイン	ああ。昔、この辺りで干ばつがあった時、魔法使いが魔法で水を湧かせたらしい。
	この泉に願い事をすれば、ささやかなものならたいてい叶う。
	……だが、代わりに呪いも受ける。
晶	呪いですか……？
カイン	ああ。街の人間の間では、本当かどうかわからないって言われてるが、間違いない。
	あんたならどうする？
~~~~~~~~~	~~~~~~~~~
選択	願い事をしてみる。
カイン	はは、豪胆だな。そういうところが嫌いじゃないぜ。
	でも、やめておけ。この泉で叶う程度の願いなら、俺が叶えてやる。
	願い事をどうぞ、賢者様。
~~~~~~~~~	~~~~~~~~~
選択	何もしないでおく。
カイン	それがいいな。
	ちなみに、泉の水を飲むとシュガーと同じくらい回復や守護の効果がある。
	休憩がてら飲んでいくといい。それだけならなんの呪いもないからな。
`},
{id:10321,title:"危険な場所",type:"personal",characters:["中央"],memo:"カイン",
text:`カイン	賢者様、出かけるのか？ついていくよ。
晶	食後に散歩したくて。一人で大丈夫ですよ。
カイン	ここは流通が盛んな街だから、色々なところから人が来る。
	治安が悪いってほどじゃないが、慣れないやつが夜に一人で出歩くのは、
	やめておいたほうがいい。
晶	そうなんですか……。知らずにすみません。夜も明るい街だから、つい……。
カイン	構わないよ。あんたの世界は、夜でも平和なんだな。とてもいいことだと思うぜ。
晶	（でも、カインを付き合わせるのは悪いかも……）
	あの、カイン、やっぱり今夜は……。
リケ	賢者様。お散歩にお出かけになるのですか？僕もご一緒してもいいですか？
アーサー	よければ私も。少し歩きたいと思っていたんです。
晶	リケ。アーサーも……。
カイン	もちろん。いいよな、賢者様。川沿いにデザートの店がある。
	みんなで食べて戻ろうぜ。
オズ	…………。
晶	（オズまで……。みんな優しいな……）
	ありがとうございます。デザート、楽しみですね。
`},
{id:10322,title:"カインの評判",type:"personal",characters:["リケ"],memo:"カイン",
text:`リケ	さっき、剣の鍛錬場を見つけて、
	のぞいていたら、カインの知り合いに話しかけられたんです。
	興味があるのなら混ざってみるかと言われて……。お断りしましたが。
晶	鍛錬場ですか！さすがですね。
	栄光の街は、剣士の街とも言われてるって聞きましたよ。
リケ	カインは、この街にいた時から、
	１００人にひとりと言われるほど、剣が立つので有名だったんですって。
晶	そうなんですか！？凄いなとは思ってたけど、そんなに強いんだ……。
リケ	……鍛錬場で剣の訓練を見せていただいたら、ちょっとだけ、かっこいいなって、
	思ってしまったんです……。
~~~~~~~~~	~~~~~~~~~
選択	かっこいいと思うのはダメですか？
リケ	だって……。
	司祭が、争いや戦いは、よくないことだとおっしゃっていました。
~~~~~~~~~	~~~~~~~~~
選択	俺もかっこいいと思います。
リケ	賢者様も……？
	ですが、野蛮な姿を見て、
	かっこいいと思うなんて、いけないことではないでしょうか？
~~~~~~~~~	~~~~~~~~~
選択	一度チャレンジしてみては？
リケ	ぼ、僕が……？
	……い、いけません。神の使徒たるもの、誰かを傷つける武器を手に取るなんて。

晶	なるほど……。でも俺は、戦うこと自体が悪いとは思わないですよ。
	剣士のカインは戦いますが、
	頼もしくて優しい人ですし、この街の方々も親切でしょう。
リケ	……確かにそうですね……。……。
	ありがとうございます、賢者様。もう少し、考えてみることにします。
`},
{id:10323,title:"スポットでの名物",type:"personal",characters:["オズ"],memo:"カイン",
text:`晶	あれ、オズ。何か買って来たんですか？
オズ	ああ……。
	栄光の街の水は上質で、美酒が造れる。店で呼び止められて味見をしたが……。
	美味かった。
晶	オズが舌鼓を打つなんて、相当だったんですね。
オズ	ああ。
	魔法舎に戻ったら、フィガロやシャイロックにも飲ませてやろう。
晶	いいですね、二人とも喜ぶと思いますよ。
オズ	……そうだろう。
晶	（なんだか微妙に機嫌がいいような……。
	　顔には出てないけど、たくさん味見して酔ってるのかも……？）
	そっちの包みは？
オズ	……これは……。
	船を模した玩具もこの街の名物だ。小舟の模型を見つけて、ついな……。
晶	アーサーへのお土産ですね。
オズ	……いや……。
晶	きっと喜ぶと思いますよ。いいお土産が見つかってよかったですね。
オズ	…………。そうだな。
`},
{id:10324,title:"スポットでの発見",type:"personal",characters:["アーサー"],memo:"カイン",
text:`晶	あれ？あそこにいるのはアーサー……？川に向かって何か投げてるみたいだ。
	アーサー！何してるんですか？
アーサー	…………!ああ、賢者様！すごいな、本当にお会いできるなんて。
晶	……？どうしました？
アーサー	ああ、すみません。先ほど街のものから、この川に伝わるまじないを教わったのです。
	小石を投げて、三回跳ねたら、願い事が叶うと。
晶	願い事……。アーサーはどんな願い事をしたんですか？
アーサー	賢者様に、このまじないを教えて差し上げたいと。
晶	…………。
アーサー	こんなに早く願いが叶うとは。少々照れくさいですね。
晶	そ、そうですね……。ちょっとドキってなりました……。
アーサー	小石をどうぞ。投げ方のコツをお教えいたします。
晶	ありがとうございます。願い事、何にしようかな……。
アーサー	先ほど、賢者様の小石も三度跳ねますようにと、一緒に願っておきました。
	効果は期待できるようですよ。
`},
{id:10325,title:"楽しい場所",type:"personal",characters:["シノ"],memo:"カイン",
text:`シノ	賢者様！ここにいたのか。
晶	シノ。川を見ていたんです。何かありましたか？
シノ	ああ。来いよ、いいものを見せてやる。
	大きな船が来た。あそこの橋だ。見てろよ。
晶	……わあ……、橋桁が上がっていく……。跳ね橋になってるんですね。
シノ	ああ。あの背の高い船が通り過ぎると、また元に戻るんだ。
晶	すごいですね！動いているところ、初めて見ました。
シノ	だろ？
	オレが見つけた。
晶	（我が物顔でかわいいな……）
	教えてくれてありがとう、シノ。
シノ	ふふん。まあね。
`},
{id:10326,title:"マナエリア",type:"personal",characters:["③"],memo:"カイン",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、
	賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
カイン	パワースポット……。ああ、マナエリアのことじゃないか？
	マナエリアっていうのは、自然と心が落ち着いて、集中できる場所だ。
	人それぞれ、自分のマナエリアを持ってる。
晶	たぶん、それです！カインのマナエリアはどこにありますか？
カイン	俺は生まれた家のそばの小川だな。
	子供の頃からそこで水を汲んだり、遊んだり、こっそり魔法の練習をしてた。
	天気のいい日に水面が光るの見てると、
	気分が高揚して、勇気が湧いてくるように感じるんだ。
	光の下を流れていく澄んだ水を思い浮かべると、それだけで気持ちが集中していく。
	眩しい光が集まって、それが全部俺の力になる。……そんな感覚になる。
晶	なるほど……。すごく力が湧いてくる感じになるんですね。
カイン	俺の場合はな。マナエリアで得る感覚は、人それぞれ違うらしい。
	さっき、パワースポットって言ってたろ。俺にはその言葉の方がしっくりくるよ。
`},
{id:10327,title:"アミュレット",type:"personal",characters:["③"],memo:"カイン",
text:`晶	マナエリアから長く離れる魔法使いは、
	マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	カインもアミュレットを持ってますか？
カイン	ああ。これだよ。
カインは、棚に置いていたラベルのない瓶を手にとって、俺に見せてくれた。
中では透き通った綺麗な水が揺れている。
晶	水……。お酒ですか？
カイン	魔法舎のそばにある川の水だ。俺のマナエリアは故郷の小川なんだ。
	故郷に帰った時は汲んで持ってくるが、普段はその辺の川の水を使ってるよ。
晶	なるほど……。マナエリアの水じゃなくても大丈夫なんですね。
カイン	ちゃんと効果があるような気はするな。
	ただ、川辺にもよく行くから、どっちが効いてるのかはよく分からないが。
晶	（相変わらずカインはおおらかだ……）
`},
{id:10328,title:"力くらべ頂上決戦",type:"personal",characters:["カイン","レノックス"],memo:"カイン",
text:`晶	カインとレノックス。二人で向かい合わせに座ってどうしたんですか？
レノックス	賢者様。今からカインと力くらべをするところなんです。
カイン	レノは力が強そうだから、一度勝負してみたくてさ。
	そうだ、賢者様。どっちが勝つか予想してみてくれよ。
晶	（カインとレノックスの腕相撲勝負か。そうだな……）
~~~~~~~~~	~~~~~~~~~
選択	カインだと思います。
カイン	ありがとな！あんたにそう言われちゃ負ける気がしないぜ。
~~~~~~~~~	~~~~~~~~~
選択	レノックスだと思います。
カイン	レノックスは体格がいいからな。だからといって俺も負けないぞ。
~~~~~~~~~	~~~~~~~~~
カイン	よし、行くぞレノックス！
レノックス	ああ。
晶	（す、すごい気迫。二人とも一歩も譲らない、いい勝負だ……！）
	えっ！？机の足が歪んだ……！？
レノックス	……すみません、力を入れすぎました。
カイン	俺もかなり力を込めちまったからな。あとで魔法で直しておくよ。
晶	（机の方が耐えられなくなるなんて、元騎士と元軍人の腕相撲はレベルが違った……）
`},
{id:10329,title:"家族",type:"personal",characters:["③"],memo:"カイン",
text:`晶	カイン。手紙を読んでるんですか？
カイン	ああ、故郷の両親がたまに送ってくるんだ。
	体の調子はどうだとか、ちゃんと飯を食ってるのかとか。
	今回も代わり映えしない内容だな。
	あとは、近所の花が咲いたとか、変な魚が捕れたとか。
	どこに遊びに行ったとか、呑気なもんだよ。
晶	いいご両親じゃないですか。返事を書いたら、きっと喜ばれますよ。
カイン	なかなか筆不精だからなあ……。まあ、近いうちに顔を見せに行くよ。
晶	カインはひとり息子なんでしたっけ？兄弟がいそうな感じですけど……。
カイン	いや、ひとりだよ。でも、兄弟みたいな連中がずっと周りにいたからな。
	街の友達や、騎士団の仲間が。
晶	だから兄貴分ぽくて頼もしいんですね。
カイン	話してると懐かしくなってくるな。
	今夜は、中央の都の馴染みの店にでも、飲みに行ってみるか。
晶	手紙は書かないのに、フットワークは軽いですよね……。
カイン	はは。元々、書類仕事は苦手だったからな。
	晶に用があるときも、手紙を書かずに会いに行くさ。
`},
{id:10330,title:"再会の魔法使い",type:"personal",characters:["カイン","オーエン"],memo:"カイン",
text:`晶	オーエンとは、賢者の魔法使いに選ばれた時に再会したんですか？
カイン	ああ。あいつが世界を守る魔法使いだったなんて、最初は信じられなかったけどな。
	初めて厄災と戦った時に会ったんだ。
帰ろうとするところを引き止めて、左目を取り返そうと挑んだんだが……。
オーエン	僕に負けて命乞いしたんだよ。死にたくない。
	残った片目もやるから、どうか、殺さないでくれって。
晶	わっ……！オーエン……。
カイン	嘘つきめ。おまえに命乞いなんかするもんか。
	あの時だって、おまえが途中で消えたんだろ。
オーエン	あれから一度も取り返しに来ないね。
	いらないならきみの目の前で野良犬にでも食べさせようかな。
カイン	戦っても俺に勝ち目がないのはわかってる。
だが、今はオズから魔法を学んでるんだ。いずれ腕を磨いて取り返すさ。
オーエン	ふふ。急いだ方がいいんじゃない。その時にまだ目玉があるとは限らないよ。
カイン	言ってろ。おまえは二度も俺にとどめを刺さなかった。
	遊んで欲しいのはそっちの方だろ。
オーエン	…………。
	馬鹿みたい。
晶	だ、大丈夫ですか？カイン……。オーエンが癇癪を起こしたら……。
カイン	いや。たまに絡まれはするが、しばらくは大丈夫だろう。なんとなくだけどな。
`},
{id:10331,title:"困ったときは",type:"personal",characters:["カイン","ヒースクリフ"],memo:"カイン",
text:`晶	あ、ヒースクリフだ。依頼任務から戻って来たみたいですね。
カイン	ああ、中央の都に行ってたんだったか。
	……あれ？
晶	どうかしましたか？
ヒースクリフ	賢者様、カインも。ただいま戻りました。
カイン	お疲れ様。何の任務だったんだ？
ヒースクリフ	探し物だよ。すぐに見つかると思ったんだけど、思ったより長引いちゃって……。
カイン	ああ、なら、聞き込みでもして、人あたりしたんじゃないか。調子悪そうだぞ。
晶	……言われてみれば、ちょっと顔色が悪いかもしれませんね……｡
カイン	《グラディアス・プロセーラ》
	ほら、シュガーだ。食べて、今日は無理せず部屋で休めよ。
	夕食も持って行ってやるからさ。
ヒースクリフ	……ありがとう、カイン。少し気疲れしたのかもしれないな……。
	賢者様も、心配させてしまってすみません。
晶	気にしないでください。後で様子を見に行きますね。
カイン	そうそう、遠慮するな。困った時はお互い様だって、前の賢者様も言ってたしな。
`},
{id:10332,title:"剣術の先生",type:"personal",characters:["アーサー","カイン"],memo:"カイン",
text:`晶	あれは……、アーサーとカイン？
アーサー	っ……、は……っ！
カイン	そうそう、今のは上手いぞ。だが、脇が甘いな……！
アーサー	あ……っ！
カイン	腕を上げましたね、アーサー殿下。思わず本気になってしまいました。
アーサー	お世辞はいい。……っ……、あはは、手が痺れた……。
カイン	大丈夫か？見せてみろ。
晶	お疲れ様です。カイン、アーサー。今日は魔法の練習じゃないんですか？
アーサー	賢者様……。ご覧になってたんですね。お恥ずかしいところをお見せしました。
	少し稽古をつけてもらってたんです。
	剣は城でも習うのですが、カインに教わる方が気兼ねがなくて。
カイン	そう言われちゃ断れなくてさ。
	俺も勘を鈍らせたくないし、たまに練習に付き合ってもらってるんだ。
晶	二人とも、格好良かったです！俺もやってみようかな……。
カイン	本当か？賢者様が興味を持ってくれるのは嬉しいな。
	いつでも教えてやるから、言ってくれよ。
`},
{id:10333,title:"魔法使いの思い出",type:"personal",characters:["③"],memo:"カイン",
text:`晶	カインは魔法舎の魔法使い以外にも会ったことがありますか？
カイン	見かけたってくらいなら、子供の頃から何度かあったよ。
	俺は魔法使いだってことを隠してたが、力の強い魔法使いにはバレちまうらしくて。
向こうから話しかけられたりさ。
	だけど、知り合いだとか、仲間だと思える魔法使いに会えたのは、
	賢者の魔法使いに選ばれたおかげだな。
晶	そうなんですね……。
	魔法舎で最初に出会ったのはやっぱり、同じ中央の魔法使いのオズですか？
カイン	いや。オズはほとんど姿を見かけなかった。
	中央の魔法使いは他に、年上の姉妹の魔女がいたんだ。
	ちょっと賑やかで、親切でさ。
	それまで知らなかった魔法使いの話や、魔法のルールを色々聞かせてくれたよ。
	魔法使いとしては俺の方が未熟だったが、
元騎士として、おまえたちを守ってやるなんて言ってたんだが、
力になれなかったな……。
晶	そうだったんですか……。
	なら、その人たちが、カインの魔法のお師匠様なんですね。
カイン	いや、師匠ってほどじゃないな。
	魔法の師匠っていうなら、今教えて貰ってるオズの方がそれらしい感じだ。
	……大魔法使いオズの弟子で、中央の国の王子アーサー殿下と兄弟弟子か。
	あはは。悪くないかもしれないな。
`},
{id:10334,title:"突然の刺客",type:"personal",characters:["③"],memo:"カイン",
text:`晶	魔法舎の近くに、こんな森があったんですね。綺麗な花もいっぱい咲いてる。
カイン	自然豊かで、いいところだろ？俺はここが好きなんだ。
	ここを真っ直ぐ行くと……うわっ！？
晶	どうしたんですか？わっ、蛇がこっちに向かって……！
カイン	この……！
晶	（えっ、カインが蛇を手で掴んで……。思いっきり投げた！）
カイン	…………。
晶	助けてくれてありがとうございます。けど、カインは蛇が苦手なんだと思ってました。
カイン	苦手だよ、びっくりしすぎて触っちまった。……鳥肌がすごい。
晶	本当だ……！
`},
{id:10335,title:"少しだけおとなしく",type:"personal",characters:["③"],memo:"カイン",
text:`晶	わっ！？
	いたた。石につまずいちゃった……。
カイン	晶……！どこか怪我してないか！？
晶	はい。心配してくださってありがとうございます。
カイン	念のためフィガロに診てもらった方がいいな。
晶	え！？カイン！？
カインは軽々と俺を持ち上げてそのまま走り出した。
晶	カイン！本当にどこも怪我してないので大丈夫ですよ？
カイン	大丈夫だと思うけど、念のためな。悪いが、少しだけ大人しくしていてくれ。
晶	（さすが騎士……！行動がスマートで格好いい）
`},
{id:10336,title:"得意な魔法",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	賢者様、いるか？いたらハイタッチしてくれ。
晶	カイン……。なんか光りっぱなしですけど……。どうしたんですか？それ。
カイン	ああ。魔法の練習中なんだ。
	今日の座学の授業で、
	オズに、魔法の力加減を安定させる練習をしろとアドバイスしてもらったんだよ。
	具体的に言うと、感情と魔力の発露が紐付きすぎてるって。
晶	感情と魔力の発露、ですか……？
カイン	戦ってるうちに気持ちが乗ってくるというか、テンションと一緒に魔力が上がるのを、
コントロールしろということらしい。
	確かに、自分では真剣にやってるつもりでも、練習だと思ってると、
	一発目からフルパワーが出せないんだよな。
実戦と同じように、誰かを守らなきゃ、とか、ここは俺が抑える、とか。
目的があったほうが集中できる気がするし。
晶	なるほど……。でも、最初から強い力を出すのって難しそうですね。
カイン	そうなんだよ。だからこうして、普通の状態で、魔法を使い続けてみてるんだが……。
	なかなか疲れるんだよな。
`},
{id:10337,title:"魔法の先生",type:"personal",characters:["③"],memo:"カイン",
text:`晶	オズの魔法の訓練って、一体どんな感じなんですか？
	あんまり想像がつかなくて……。
カイン	いろいろ指示をしてくれるが、基本的には『見て覚えろ』って感じだな。
晶	見て覚える……というと、実演してくれるってことですか？
カイン	例えば、どうすれば魔法で岩を砕けるのかを聞くとするだろ。
	すると、オズが呪文を唱えて、近くにあったでかい岩を砕く。
	そのあとに『こうすればいい』と言われるんだ。
晶	あはは、なんだかオズらしいですね。ちょっとスパルタな感じが。
カイン	他の国の先生の授業を参考に訓練をしてくれたこともあったな。
	国が違うと訓練の方法もかなり違うらしい。
~~~~~~~~~	~~~~~~~~~
選択	北の国っぽい授業はどうでしたか？
カイン	いきなりオズが『私を倒してみろ』とか言うから驚いたぜ。
北の魔法使いは、殺し合い同然の訓練もしているらしい。
	最強の魔法使いと戦える機会なんて滅多にないからさ。
胸を借りるつもりで挑んだら容赦なく叩きのめされたけどな。
~~~~~~~~~	~~~~~~~~~
選択	東の国っぽい授業はどうでしたか？
カイン	東の魔法使いは座学での授業も多いらしい。教本を渡されて読むように言われたよ。
	けど、リケはまだ文字を読むのが苦手だろ？
	それで、座学はちょっと難しいって話になってさ。
~~~~~~~~~	~~~~~~~~~
晶	いろんな国の授業も試してみたんですね。どの国の授業が一番合っていました？
カイン	なんだかんだ言って、
	オズの『見て覚えろ』の訓練方法が中央の魔法使いには一番合っていたな。
	実際にここに来てから、俺たちの魔力も強くなってる。オズはいい先生だよ。
`},
{id:10338,title:"紋章",type:"personal",characters:["③"],memo:"カイン",
text:`晶	カインの賢者の紋章は、右腕に出たんですよね。
カイン	ああ、ここだよ。
カインは服の袖を軽く捲って、右腕にある紋章の端っこを見せてくれた。
カイン	初めて紋章が現れた時は驚いたな。
	最初はアザか何かだと思ったが、ずっと消えないからさ。
	友達なんかにもえらく心配されたよ。呪いを受けたんじゃないかとか。
晶	たしかに、事情を知らないと怖いですよね。カインは紋章のことは知ってたんですか？
カイン	噂話はあったが、詳しく聞いたりしなかったんだ。
	魔法使いだってことを隠してたからな。
	中央の国の騎士団に所属してると、
	魔法舎や、賢者の魔法使いの話は度々耳に入ってきた。
	一般人よりは、賢者の魔法使いがどんなことをしてるのか、把握してたと思うが……。
	あはは。まさか、自分が選ばれるなんて、これっぽっちも思ってなかったな！
晶	（けっこう、大変なことな気がするけど、根アカな人だなあ……）
`},
{id:10339,title:"俺と一緒に",type:"personal",characters:["③"],memo:"カイン",
text:`晶	カイン。おはようございます。
カイン	おはよう、晶。悪いが、手に触れてもらっていいか？
晶	はい。こんなところで何をしてたんですか？
カイン	これから魔法舎の周りを走るところだ。
	騎士団にいた頃よりも体力が落ちている気がしてさ。
	最近、朝の日課にしてるんだ。晶も一緒にどうだ？
晶	そうですね……。ぜひ一緒にと言いたいところなんですが……。
	多分、俺はカインに比べて走るのが遅いので、迷惑をかけてしまうかもしれません。
カイン	気にすることないさ。晶が隣にいてくれた方がきっと楽しいからな。
晶	（そんな風に言われたら断ることなんてできないな）
	それじゃあ、お願いします！
カイン	ああ、行こうか！
`},
{id:10340,title:"カインの暮らし",type:"personal",characters:["③"],memo:"カイン",
text:`晶	カイン、みんなでお茶にしようって言ってるんです。
	よかったら、カインも一緒にどうですか？
カイン	ああ、晶か。ありがとう。ちょうど何か飲み物を買いに行こうと思っていたんだ。
そう言いながら、カインは磨いていた剣を机の上に置いて立ち上がった。
晶	用事の途中なら、お茶は部屋に持ってきましょうか？
カイン	大丈夫。これはただの日課だ。また後で続きをやるよ。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
カイン	昼寝か、トレーニングか、今やってたような、剣や靴の手入れだな。
	部屋に篭ってるのは苦手だから、大抵は近くの森や街の方に出かけたり、
魔法舎の中でも、談話室や食堂で過ごしてる。
	~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
カイン	ヒースは以前から、よく話をしに来るよ。
	去年、あいつが賢者の魔法使いになったとき、一番歳が近いのが俺でさ、
	仲良くなったんだ。
	あとはまあ、今年入って来た若い魔法使いは、みんな遊びに来てくれるな。
	俺も部屋に他人を入れるのを厭わないたちだし。
	今まで、厄災が近づく時期以外は、みんな元の住処に帰ってた。
	今年は賑やかでいい。あんたもいるしな。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
カイン	早めに起きて、魔法舎の周りをひとっ走りしてる。
	そのあと、食堂でみんなとハイタッチだ。
	オズの授業と、剣の鍛錬を済ませたら、残りは自由時間。
	夜はたまにシャイロックのバーに行くかな。
~~~~~~~~~	~~~~~~~~~
カイン	騎士団にいた時と違って、ここでの暮らしは少しのんびりしてるんだよな。
	あんたが来てから、討伐だ、任務だ、鍛錬だと、
	毎日やることができて、張りが出たよ。
晶	そう言ってもらえるとホッとします。
	でも、今日はみんなでゆっくりしましょうね。ネロがパイを焼いてくれたそうですよ。
カイン	美味そうだ。ネロが来てから、食事も断然楽しみになったな！ 
`},
{id:10341,title:"主君の変化",type:"personal",characters:["アーサー","カイン"],memo:"カイン",
text:`晶	アーサー、カイン。二人で何をしているんですか？
カイン	アーサー様とカードで絵合わせゲームをやっていたんだ。
	アーサー様はすぐに顔にでるからな。
	取られたくないカードの近くに手を持っていくと表情が変わるんだ。
アーサー	そうだったのか……。よし、次のゲームでは気をつけよう。
カイン	晶も一緒にやらないか？
晶	いいんですか？ぜひ！
カイン	ははっ、アーサー様また顔に出てましたよ。
アーサー	気をつけていたつもりだったが、なかなか難しいな……。
晶	（俺にはアーサーは十分、ポーカーフェイスに見えたけど……）
アーサー	よし、もう一回やりましょう！次こそは負けないぞ、カイン！
晶	（カインは元騎士団長だから、主君の変化に気付きやすいのかもしれないな）
`},
{id:10342,title:"カインとお酒",type:"personal",characters:["カイン","シャイロック"],memo:"カイン",
text:`シャイロック	この酒は温めるとさらに風味を増して美味しいんです。
カイン	そうなのか。それは楽しみだ！
シャイロック	まだ熱いので、気をつけてくださいね。
	賢者様はお酒はお召しにならないんでしたよね？
晶	そうなんです。アルコールはちょっと……。
シャイロック	わかりました。
	いつか、賢者様が甘い美酒に酔いしれる姿を見られる日を楽しみにしておきますね。
カイン	熱……っ！
晶	カイン、大丈夫ですか！？
シャイロック	おやおや、まだダメだと言ったのに。
カイン	あまりにも美味そうだったから
つい、な。
シャイロック	ふふ、まったく。せっかちな方ですねえ。
`},
{id:10343,title:"秘密の計画",type:"personal",characters:["中央"],memo:"カイン",
text:`晶	みなさん、部屋の隅に集まって何をしているんですか？
カイン	いつも世話になってるオズに礼をしたくてプレゼントを考えてるんだ。
	けどなかなか決まらなくてさ。
アーサー	私たちでオズ様が好きなポトフを作ってお贈りしたら、喜んで貰えるんじゃないか。
リケ	うーん。僕はオズの似顔絵を描いてプレゼントするのがいいと思います！
カイン	俺は旗にオズへの感謝を書いて飾るのが一番気持ちが伝わると思うんだが……。
	晶はどれがいいと思う？
~~~~~~~~~	~~~~~~~~~
選択	ポトフがいいと思います。
カイン	やっぱり昔一緒に暮らしていたアーサーが言うんだし間違いないか。
リケ	オズが好きなポトフ……。僕も少し食べてみたいです。
アーサー	なら、鍋いっぱいにたくさん作ろう。皆で一緒に食べてもきっと楽しいはずだ。
~~~~~~~~~	~~~~~~~~~
選択	全部がいいと思います。
カイン	確かにそれはいい考えだ！
リケ	さすが賢者様です！きっとオズも嬉しさのあまり涙するに違いありません。
アーサー	賢者様のおかげで素敵なお贈りできそうです！ありがとうございます。
~~~~~~~~~	~~~~~~~~~
カイン	それじゃあ、さっそく手分けして準備をしよう。もちろん、オズには内密で……。
オズ	私がなんだ。
アーサー	オズ様！？
リケ	えっと……！決してオズのために日頃の感謝の気持ちを込めた
	サプライズプレゼントを考えていたわけでは……！
晶	リケ、落ち着いて……！全部しゃべっちゃってますから！
オズ	……？
`},

    if (selectedNames.length > 0) {

      );

    }

  });

  // ログインは日付ソート
  if (activeSort && activeType === "login") {
    results.sort((a, b) => {
      const da = new Date(a.date || "1900-01-01");
      const db = new Date(b.date || "1900-01-01");
      return activeSort === "new" ? db - da : da - db;
    });
  }

  if (results.length === 0) {

 results.forEach(story => {

      <span class="story-type ${story.type}">${story.type === "login" ? "ログイン" : "個人"}</span>

});

// ======================
// イベント委譲で★ボタン制御
// ======================
document.getElementById("result").addEventListener("click", e => {
  if (!e.target.classList.contains("favorite-btn")) return;

  const storyDiv = e.target.closest(".story");
  const storyId = Number(storyDiv.dataset.id); // divに data-id をセットしておく

  if (favorites.has(storyId)) {
    favorites.delete(storyId);
    e.target.style.color = "#ccc";
  } else {
    favorites.add(storyId);
    e.target.style.color = "gold";
  }

  localStorage.setItem("favorites", JSON.stringify([...favorites]));
});
document.getElementById("result").addEventListener("click", e => {

    if (e.target.classList.contains("favorite-btn")) return;

    const card = e.target.closest(".story");
    if (!card) return;

    const id = Number(card.dataset.id);
    const story = stories.find(s => s.id === id);

    document.getElementById("modalTitle").textContent = story.title;
    document.getElementById("modalBody").innerHTML =
    story.text ? formatStory(story.text) : "本文がありません";
    document.getElementById("storyModal").style.display = "block";
});

};

document.getElementById("storyModal").onclick = (e) => {
    if (e.target.id === "storyModal") {
        document.getElementById("storyModal").style.display = "none";
    }
};
