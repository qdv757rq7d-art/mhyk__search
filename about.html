晶	人や物、ですか。
シャイロック	ええ。流通の激しいところには、出会いと別れも多い。
	ですが、この街は、感傷的になりすぎない。
	そんなところが好きなんです。
	だから、束の間の出会いを楽しみにたまに訪れることがあるんですよ。
晶	シャイロックにも、パーッとしたい気持ちになることがあるんですね……。
	なんだかちょっとホッとします。
シャイロック	ふふ。素直な人。
`},
{id:10304,title:"ブレイクタイム（１）",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	ほら、賢者様。コーヒーだ。そこのベンチで休もうぜ。
晶	ありがとうございます！テイクアウトコーヒーがこっちの世界で飲めるなんて……。
カイン	この辺りの店はだいたいなんでも持たせてくれる。
	みんな、川を眺めながらゆっくりするのが好きだからな。
晶	本当だ。いろんな人が、川に向かったベンチに座っておしゃべりしてますね。
カイン	ここは、ひとりで過ごすのもいい。コーヒーを飲みながら本を読んだりな。
晶	（カインが、川辺のベンチで、コーヒー片手に読書を……）
	想像しただけで絵になるな……。
カイン	え？
晶	……普段は体育会系なのに、なんか悔しいです。
カイン	なんだよ、体育会系って？
`},
{id:10305,title:"ブレイクタイム（２）",type:"personal",characters:["リケ"],memo:"カイン",
text:`晶	本当に綺麗な景色だな……。海外旅行に来たみたいだ。
	あ……、ゴンドラみたいなボートが、こっちに流れて来た……、あれ？
	乗ってるのは、リケ……？
リケ	け、賢者様……！
晶	リケ！い、一緒にボートに乗ってるのはどなたですか……？
リケ	カインの友達の船頭さんです……！
	あ、あの、さっき、カインといた時にお会いして……！
	せっかくだから乗せてもらえよって、カインに言われて……！
	迷ってるうちに乗せられてしまって……！
晶	だ、大丈夫ですか……！？
リケ	は、はい、たぶん……！楽しいは楽しいです……！
	すみませんが、ちょっと行ってきますね……！ご飯までには戻ります……！
晶	わ、わかりました！気をつけて……！
リケ	はい……！
晶	…………。
	いざとなったら、リケも箒で飛べるし、大丈夫かな……。
`},
{id:10306,title:"スポットの思い出（１）",type:"personal",characters:["③"],memo:"カイン",
text:`晶	思い出深いお祭りってありますか？
カイン	ここは祭りが多いからな。
	どれも大好きだが、特に印象深いのは水門に祈念する祭りかな。
晶	水門のお祭り。どんなものですか？
カイン	まず男たちが、街の中央の通りを歌ったり踊ったりしながら歩いて行く。
	大人たちは、この時点でもう酔っ払ってる。
晶	あはは。
カイン	集まった人たちは、そこへ月桂樹の花や、葉で編んだ冠を投げるんだ。
	窓からも飛んできて、冠は当たると結構痛い。
	それを拾い集めながら皆で水門へ向かって、水門や、川縁を飾る。
	その夜は、みんなで夜通し飲んで騒ぐ。夜が明けたら飾りは川に流す。
	これは、この街の人間や、旅人を、無事に送り出す意味合いもある。
晶	楽しそうです！川辺の街っぽい風習ですね。
カイン	伝説の蛇もちゃんといたからな……。
	俺が無事に中央の城に着いたのも、祭りのおかげだったかもしれない。
	そう考えると思い出深い。次の祭りには、あんたやみんなとも参加してみたいな。
`},
{id:10307,title:"スポットの思い出（２）",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	この街の川は懐かしいな。いろんな思い出がある。
晶	どんなものですか？聞きたいです。
カイン	…………。子供の頃、友達が川で溺れかけた。
	周りにいたのも子供ばかりで、どうにもできなくて。俺は魔法を使ったんだ。
晶	……カインは昔、自分が魔法使いだってことを内緒にしてたって……。
カイン	そうだ。親にも、人前では魔法を使うなと固く言われていた。
	魔法使いに寛容な国だなんて言っても、田舎町だ。偏見はまだ十分ある。
	友達は助かったが……。その場が、シーン、てなっちまって。
	まあ、バレた。たぶんな。
晶	たぶんって？
カイン	みんな、誰にも話さなかったんだ。俺が魔法使いだってことを。
	翌日から、何事もなかったように、今日まで付き合いが続いてる。
晶	よかった……。いい友達ですね！
カイン	ああ。
`},
{id:10308,title:"スポットの思い出（３）",type:"personal",characters:["オーエン"],memo:"カイン",
text:`オーエン	思い出したけど、この街、昔来たことがある。
晶	えっ、そうなんですか。昔と今と、比べてどうですか？
オーエン	あまり変わらない。どいつもこいつも、前向きでやりにくい。
晶	やりにくい……。
オーエン	前に来た時も、この街の人間を暗い気持ちにしてやろうとして接触したけど。
	他の場所より時間が掛かって面倒だった。
	話しかけてもさ。
	「そんな……。でも……、なんとかなるかな……」って、なかなか落ち込まない。
晶	（わかるかも……）
オーエン	カインもここ出身だって聞いて納得したよ。
晶	ポジティブさって大事ですね……。
オーエン	退屈だから早く帰りたいな。
`},
{id:10309,title:"カインへの印象（１）",type:"personal",characters:["オズ"],memo:"カイン",
text:`晶	オズから見て、カインはどんな魔法使いですか？
オズ	………。
	時代のせいかもしれないが。
	最近の若い魔法使いは私に対して馴れ馴れしくて驚く。
晶	……それは……、
	やっぱり、オズにも、目下からは敬われたい的な気持ちがあるんでしょうか？
オズ	そうではない。だが、カインは特に無作法だろう。
晶	……もしかして、何かありました？
オズ	………。
	先日、カードゲームの人数合わせに誘われた。
晶	う、うわ……。
オズ	「よう、オズ。暇そうだな。あんたも混ざれよ」と、言われた……。
晶	（軽ゥ……！）
オズ	長い時間を生きてきたが、こんなことは初めてだ。
`},
{id:10310,title:"カインへの印象（２）",type:"personal",characters:["アーサー"],memo:"カイン",
text:`晶	栄光の街にいるカインと、中央のお城で会うカインは、やっぱり違いますか？
アーサー	どうでしょう。
	心なしか羽を伸ばしてるような気もしますが、カインはいつも変わりません。
	格好良くて、頼もしくて、気さくで、仲間思いで……。
	彼ほど欠点のない人はいないでしょう。
	騎士団長として出会った時から、私にとって、兄のような存在です。
晶	そうか、カインは元騎士団長だから、
	魔法舎で一緒になる前から二人は知り合いだったんですね。
アーサー	はい。当時、カインは魔法使いということを隠して騎士団に所属していましたが……。
	魔法を使わずとも彼は優秀で、
	諸外国の客人からの評判も、部下からの信頼も厚い、誠実な騎士でした。
	のちに彼が魔法使いだということが発覚して、
	騎士団を解任された時も、本当は傍に置いておきたかったのですが……。
	魔法使い同士だから、贔屓しているのだと言われ、断念したのです。
晶	きっと気にしてないですよ。今の、カインが聞いたらすごく喜ぶと思います。
アーサー	そうですか？少し気恥ずかしいけれど、賢者様がそうおっしゃってくださるなら。
	あとで伝えてみようと思います。
`},
{id:10311,title:"カインへの印象（３）",type:"personal",characters:["リケ"],memo:"カイン",
text:`晶	リケはカインと馴染めましたか？
リケ	そうですね……。馴れ馴れしいところに困ったりもしますが、
	面倒見のいいところに助けられたりもします。
晶	困ったことって？
リケ	すぐに頭を撫でたり、肩や背中を叩いたりするのです。
	私は神の使徒だから、安易に触れては罰が当たると何度も言っているのに聞かなくて。
晶	ああ、なるほど……。でも、カインのことだから、悪気はないんだと思いますよ。
リケ	それはわかります。私自身、なんでもないときは、もう！と返せるんですけど……。
	物事が上手くいかないときに、大きくて暖かい手で撫でられると……。
	嬉しいのと、弱ってしまうのとで、胸が熱くなって、
	……何も言えなくなる時があるんです。
晶	リケ……｡
~~~~~~~~~	~~~~~~~~~
選択	思わず頭を撫でた。
リケ	……っ、賢者様……！賢者様まで頭を撫でないでください……！
晶	あっ、すみません！つい……。
	（カインの気持ちもわかる気がするな……）
~~~~~~~~~	~~~~~~~~~
選択	思わず背中を撫でた。
リケ	……賢者様……。
	大丈夫です、泣いたりなんてしていません。
	私は神の使徒ですから、いつでも心を強くしていなければ……。
晶	（リケは気丈だけど、確かに無理をしていないか心配になる時があるなあ……）
~~~~~~~~~	~~~~~~~~~
選択	思わずほっぺを撫でた。
リケ	……っ、賢者様……！？
	いきなり触ったりしてはだめだと話しているところでしたのに……！
晶	あっ、すみません！リケのほっぺがふくふくで、つい……。
リケ	もう！カインのような大雑把なごまかし方をして！もう……！
`},
{id:10312,title:"カインへの印象（４）",type:"personal",characters:["オーエン"],memo:"カイン",
text:`オーエン	へえ、この街、騎士様の出身地なのか。
	あいつに言うこと聞かせたかったら、この街を人質にすればいいんだね。
晶	オ、オーエン……。
オーエン	騎士様って、今まであまり会ったことないタイプだけど、この街自体もそうなのかな。
晶	会ったことない感じ……？カインがですか？
オーエン	そうでもない？……なら、別にそうでもないかも。
晶	…………。初めて会った時のカインの印象ってどんなでした？
オーエン	会ったことない感じだよ。
	騎士なのに、隠し事をしてた。魔法使いなのに、魔法使いじゃないふりして。
晶	隠し事……。
	たしか、カインが騎士団にいた時は、魔法使いだってことを黙ってたんでしたね。
オーエン	そうだよ。だから暴いてやろうと思ったんだ。嘘つきだってことをね。
	でも、戦ったら騎士っぽかった。仲間を庇ったりしてさ。
	だから殺すのはやめたけど、無傷で生かしておくのも変だろ。
	それで、目玉だけ獲ってやったんだ。
晶	……俺にとってカインは、親切で頼れるなって感じですけど……。
	オーエンにとっては、新鮮で特別な印象を与える人だったんですね。
オーエン	…………。別にそんなこと言ってない。
`},
{id:10313,title:"カインへの印象（５）",type:"personal",characters:["ヒースクリフ"],memo:"カイン",
text:`晶	最初にカインと会った時、どんな印象でしたか？
ヒースクリフ	カインですか？そうだな……。
	俺は、あまり社交的な方じゃないから、賢者の魔法使いになってどうしようって、
	結構、困ってたんですけど……。
	カインはすぐ話しかけてくれました。
	正直、最初は、俺には少し、圧が強めだなって思って……。
晶	あはは。……あ、すみません。その場面が想像できてしまって……。
ヒースクリフ	いいんです。俺も、カインが優しい人だってすぐに気づいたから。
	それから、賢者様が魔法舎に来るまでは、
	カインと一緒にいることが一番多かったかな。
晶	そうだったんですね。
	俺も一番最初に、カインとヒースに親切にしてもらったから、わかります。
ヒースクリフ	カインも、本当の初対面は俺に敬語だったんですよ。
	東のブランシェット家のヒースクリフ様ですか。お見知り置きを。……とか言って。
晶	あはは、騎士らしくてかっこいいですね。
ヒースクリフ	でも、翌日には「よう、ヒース」って話しかけられましたけどね……。
	なんだこの人、って思ったけど、まあ、似たようなやつが身近にいたんで……。
	すぐに慣れました。
`},
{id:10314,title:"スポットゆかりの話（１）",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	この川は、大陸を横断する大河へ繋がってる。
	中央の国の都市部へ、人や物を運ぶために開削して通した人工運河だ。
	水害が少ない川を使ったって話だが、
	封印されたサーペントが、川を守ってたのかもしれないな。
晶	なるほど……。
	（学校の授業みたいな話にファンタジーが混ざってきて、不思議な感じだな……）
カイン	栄光の街の船は速いので有名なんだ。帰りは船で帰ってもいいかもな。
	あんた、船酔いはするのか？
~~~~~~~~~	~~~~~~~~~
選択	します。
晶	船だと、酔うかもしれません……。
カイン	なら、魔法で甲板からちょっと浮かせておいてやるよ。揺れなきゃ酔わないんだ。
晶	……魔法、便利ですね……。
~~~~~~~~~	~~~~~~~~~
選択	しないです。
晶	しません。大丈夫です！
カイン	よかった。時間はかかるが、船旅も気持ちがいいんだぜ。
	あんたもきっと気に入るよ。
~~~~~~~~~	~~~~~~~~~
選択	わかりません。
晶	どうかな……、わからないです。
カイン	船に乗ったことがないのか？そりゃもったいない。なら、試してみよう。
	困ったら俺たちがサポートする。いつだってそうさ。
	俺たちは、晶の魔法使いなんだからな。
`},
{id:10315,title:"スポットゆかりの話（２）",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	栄光の街は、古くから剣士が活躍した街だ。俺も、剣術はこの街で覚えたよ。
晶	そうなんですね。学校とか、習う場所があるんですか？
カイン	この辺りを治めてる領主様が剣術見習いから雇ってくれるんだ。
	みんなそこに集まって腕を磨いてる。
	そのあと、中央の城や他の街へ人材が派遣される。警備や、護衛の仕事に着いたりな。
晶	（警備会社みたいなシステムを街がやってる感じかな……？）
	なんとなくイメージが掴めました！
カイン	よかった。あんたのいた世界と、ここは、ずいぶん違うみたいだもんな。
	俺がいた騎士団にも、栄光の街出身のやつが結構いるんだ。
	今度、街で会ったら紹介するよ。
晶	ありがとうございます。カインの知り合いなら、安心して会える気がします。
カイン	あはは。確かに、ミスラやオーエンと仲のいいやつに会うのは怖いかもな。
`},
{id:10316,title:"中央の国について",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	この街は、剣術と流通が盛んなんだ。
	西の国との境も近くて、中央の国の貿易の主要都市になってる。旅人や観光客も多い。
	グランヴェル城下と並んで、
	死ぬまでに一度は訪れたい街だって言われたりするらしいな。
晶	色々な国の人が出入りしてるんだ。グローバルな街なんですね。
カイン	そう。だからみんな、街を守るために腕を磨くし、
	余計な争いをしないよう陽気なのさ。
晶	なるほど……。カインが気さくなのは土地柄なんですね。なんだか、納得できました。
カイン	あはは、そうか？あとは……。
	栄光の街出身だと、モテるらしい。
	おかげで、中央の都に出てからも女性に声をかけられることが多かったな。
晶	（それは、カイン自身のイケメンオーラのせいなのでは……）
`},
{id:10317,title:"〈大いなる厄災〉について",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	この川沿いは拓けているから、〈大いなる厄災〉が近づくのがよく見えるんだ。
	まさか俺が賢者の魔法使いに選ばれて討伐に加わるなんて、
	昔は考えたこともなかったよ。
晶	選ばれた時に、体に紋章が現れるんですよね。カインはその時、どうでしたか？
カイン	さすがに驚いたな。朝起きたら、腕のところにアザが出来ててさ。
	模様にも見えたが、まあ偶然だろうと思って。
晶	結構複雑な形ですよ……？
カイン	知ってりゃすぐわかったろうが、俺は魔法使いだってことを隠してたからな。
	紋章のことはそれまで耳に入らなくて。
	放っておいたがしばらく消えないから、呪いや病かもと思って医者に掛かったんだよ。
晶	医者……！？
カイン	そこでわかったんだ。月に選ばれた紋章なんだってな。
晶	……なんというか……。カインらしい、おおらかなエピソードですね。
カイン	あはは、気を遣わなくていいよ。俺も少し間の抜けた話だと思ってるさ。
`},
{id:10318,title:"スポットの人々",type:"personal",characters:["アーサー"],memo:"カイン",
text:`晶	初めて見る顔にも、みなさん親戚や友達みたいに話しかけてくれる街ですね。
アーサー	ええ。たとえ私が王子だと名乗っても
	態度が変わらないようなところが信頼できる人々です。
	色々、勧めてくれたり、教えてくれたりするので、学びの多い場所ですね。
晶	そういえばさっき、通りの女性と話し込んでましたよね。何か教わってたんですか？
アーサー	ああ。店先でカードゲームをしていたので覗いていたらルールを教えてくれて。
	彼女に勝つと、今夜一緒に眠ってくれるそうですよ。
晶	（……一緒に眠るって……もしかして……）
アーサー	ゲームは勝ちましたが、
	もうそんな歳ではないので断っていたら恋人だという男がやってきて誤解を……。
晶	あ、あわわわ。
アーサー	そこでちょうど、カインが私を見つけてくれて、誤解を解いてくれました。
	偶然でしたが、この街の恋人同士に祝福ができて、いい夜です。
晶	無事でなによりです、アーサー……。
`},
{id:10319,title:"スポットにいた魔法使い",type:"personal",characters:["③"],memo:"カイン",
text:`晶	栄光の街には、カインの他にも、魔法使いがいるんですか？
カイン	けっこういるよ。馴染みきってるわけじゃないが、迫害されるほどでもない。
	この運河を作る時も、魔法使いが協力したんだ。
	占いが得意な魔女が天気を予測したりさ。
	その名残か、街で働く魔法使いは多いな。人がやるには危ない仕事とか。
晶	占いで天気予報するんですね……。面白いな。当たりますか？
カイン	まあまあ。
	ほら、今も鐘が聞こえただろう。一度なら晴れ、二度なら曇り、三度で雨。
	あれはその魔女が知らせてる。
晶	へえ、すごいですね！……ん？その魔女……？
	運河を作った時の魔法使いが、ずっとこの街の天気予報をしてるんですか？
カイン	ああ。魔法使いは寿命が長いだろ。
	見た目は若いが、３００歳くらいかな？
`},
{id:10320,title:"魔法の泉",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	この泉は魔法の泉なんだ。
晶	魔法の泉……？こんな街の中でですか？
カイン	ああ。昔、この辺りで干ばつがあった時、魔法使いが魔法で水を湧かせたらしい。
	この泉に願い事をすれば、ささやかなものならたいてい叶う。
	……だが、代わりに呪いも受ける。
晶	呪いですか……？
カイン	ああ。街の人間の間では、本当かどうかわからないって言われてるが、間違いない。
	あんたならどうする？
~~~~~~~~~	~~~~~~~~~
選択	願い事をしてみる。
カイン	はは、豪胆だな。そういうところが嫌いじゃないぜ。
	でも、やめておけ。この泉で叶う程度の願いなら、俺が叶えてやる。
	願い事をどうぞ、賢者様。
~~~~~~~~~	~~~~~~~~~
選択	何もしないでおく。
カイン	それがいいな。
	ちなみに、泉の水を飲むとシュガーと同じくらい回復や守護の効果がある。
	休憩がてら飲んでいくといい。それだけならなんの呪いもないからな。
`},
{id:10321,title:"危険な場所",type:"personal",characters:["中央"],memo:"カイン",
text:`カイン	賢者様、出かけるのか？ついていくよ。
晶	食後に散歩したくて。一人で大丈夫ですよ。
カイン	ここは流通が盛んな街だから、色々なところから人が来る。
	治安が悪いってほどじゃないが、慣れないやつが夜に一人で出歩くのは、
	やめておいたほうがいい。
晶	そうなんですか……。知らずにすみません。夜も明るい街だから、つい……。
カイン	構わないよ。あんたの世界は、夜でも平和なんだな。とてもいいことだと思うぜ。
晶	（でも、カインを付き合わせるのは悪いかも……）
	あの、カイン、やっぱり今夜は……。
リケ	賢者様。お散歩にお出かけになるのですか？僕もご一緒してもいいですか？
アーサー	よければ私も。少し歩きたいと思っていたんです。
晶	リケ。アーサーも……。
カイン	もちろん。いいよな、賢者様。川沿いにデザートの店がある。
	みんなで食べて戻ろうぜ。
オズ	…………。
晶	（オズまで……。みんな優しいな……）
	ありがとうございます。デザート、楽しみですね。
`},
{id:10322,title:"カインの評判",type:"personal",characters:["リケ"],memo:"カイン",
text:`リケ	さっき、剣の鍛錬場を見つけて、
	のぞいていたら、カインの知り合いに話しかけられたんです。
	興味があるのなら混ざってみるかと言われて……。お断りしましたが。
晶	鍛錬場ですか！さすがですね。
	栄光の街は、剣士の街とも言われてるって聞きましたよ。
リケ	カインは、この街にいた時から、
	１００人にひとりと言われるほど、剣が立つので有名だったんですって。
晶	そうなんですか！？凄いなとは思ってたけど、そんなに強いんだ……。
リケ	……鍛錬場で剣の訓練を見せていただいたら、ちょっとだけ、かっこいいなって、
	思ってしまったんです……。
~~~~~~~~~	~~~~~~~~~
選択	かっこいいと思うのはダメですか？
リケ	だって……。
	司祭が、争いや戦いは、よくないことだとおっしゃっていました。
~~~~~~~~~	~~~~~~~~~
選択	俺もかっこいいと思います。
リケ	賢者様も……？
	ですが、野蛮な姿を見て、
	かっこいいと思うなんて、いけないことではないでしょうか？
~~~~~~~~~	~~~~~~~~~
選択	一度チャレンジしてみては？
リケ	ぼ、僕が……？
	……い、いけません。神の使徒たるもの、誰かを傷つける武器を手に取るなんて。
~~~~~~~~~	~~~~~~~~~
晶	なるほど……。でも俺は、戦うこと自体が悪いとは思わないですよ。
	剣士のカインは戦いますが、
	頼もしくて優しい人ですし、この街の方々も親切でしょう。
リケ	……確かにそうですね……。……。
	ありがとうございます、賢者様。もう少し、考えてみることにします。
`},
{id:10323,title:"スポットでの名物",type:"personal",characters:["オズ"],memo:"カイン",
text:`晶	あれ、オズ。何か買って来たんですか？
オズ	ああ……。
	栄光の街の水は上質で、美酒が造れる。店で呼び止められて味見をしたが……。
	美味かった。
晶	オズが舌鼓を打つなんて、相当だったんですね。
オズ	ああ。
	魔法舎に戻ったら、フィガロやシャイロックにも飲ませてやろう。
晶	いいですね、二人とも喜ぶと思いますよ。
オズ	……そうだろう。
晶	（なんだか微妙に機嫌がいいような……。
	　顔には出てないけど、たくさん味見して酔ってるのかも……？）
	そっちの包みは？
オズ	……これは……。
	船を模した玩具もこの街の名物だ。小舟の模型を見つけて、ついな……。
晶	アーサーへのお土産ですね。
オズ	……いや……。
晶	きっと喜ぶと思いますよ。いいお土産が見つかってよかったですね。
オズ	…………。そうだな。
`},
{id:10324,title:"スポットでの発見",type:"personal",characters:["アーサー"],memo:"カイン",
text:`晶	あれ？あそこにいるのはアーサー……？川に向かって何か投げてるみたいだ。
	アーサー！何してるんですか？
アーサー	…………!ああ、賢者様！すごいな、本当にお会いできるなんて。
晶	……？どうしました？
アーサー	ああ、すみません。先ほど街のものから、この川に伝わるまじないを教わったのです。
	小石を投げて、三回跳ねたら、願い事が叶うと。
晶	願い事……。アーサーはどんな願い事をしたんですか？
アーサー	賢者様に、このまじないを教えて差し上げたいと。
晶	…………。
アーサー	こんなに早く願いが叶うとは。少々照れくさいですね。
晶	そ、そうですね……。ちょっとドキってなりました……。
アーサー	小石をどうぞ。投げ方のコツをお教えいたします。
晶	ありがとうございます。願い事、何にしようかな……。
アーサー	先ほど、賢者様の小石も三度跳ねますようにと、一緒に願っておきました。
	効果は期待できるようですよ。
`},
{id:10325,title:"楽しい場所",type:"personal",characters:["シノ"],memo:"カイン",
text:`シノ	賢者様！ここにいたのか。
晶	シノ。川を見ていたんです。何かありましたか？
シノ	ああ。来いよ、いいものを見せてやる。
	大きな船が来た。あそこの橋だ。見てろよ。
晶	……わあ……、橋桁が上がっていく……。跳ね橋になってるんですね。
シノ	ああ。あの背の高い船が通り過ぎると、また元に戻るんだ。
晶	すごいですね！動いているところ、初めて見ました。
シノ	だろ？
	オレが見つけた。
晶	（我が物顔でかわいいな……）
	教えてくれてありがとう、シノ。
シノ	ふふん。まあね。
`},
{id:10326,title:"マナエリア",type:"personal",characters:["③"],memo:"カイン",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、
	賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
カイン	パワースポット……。ああ、マナエリアのことじゃないか？
	マナエリアっていうのは、自然と心が落ち着いて、集中できる場所だ。
	人それぞれ、自分のマナエリアを持ってる。
晶	たぶん、それです！カインのマナエリアはどこにありますか？
カイン	俺は生まれた家のそばの小川だな。
	子供の頃からそこで水を汲んだり、遊んだり、こっそり魔法の練習をしてた。
	天気のいい日に水面が光るの見てると、
	気分が高揚して、勇気が湧いてくるように感じるんだ。
	光の下を流れていく澄んだ水を思い浮かべると、それだけで気持ちが集中していく。
	眩しい光が集まって、それが全部俺の力になる。……そんな感覚になる。
晶	なるほど……。すごく力が湧いてくる感じになるんですね。
カイン	俺の場合はな。マナエリアで得る感覚は、人それぞれ違うらしい。
	さっき、パワースポットって言ってたろ。俺にはその言葉の方がしっくりくるよ。
`},
{id:10327,title:"アミュレット",type:"personal",characters:["③"],memo:"カイン",
text:`晶	マナエリアから長く離れる魔法使いは、
	マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	カインもアミュレットを持ってますか？
カイン	ああ。これだよ。
カインは、棚に置いていたラベルのない瓶を手にとって、俺に見せてくれた。
中では透き通った綺麗な水が揺れている。
晶	水……。お酒ですか？
カイン	魔法舎のそばにある川の水だ。俺のマナエリアは故郷の小川なんだ。
	故郷に帰った時は汲んで持ってくるが、普段はその辺の川の水を使ってるよ。
晶	なるほど……。マナエリアの水じゃなくても大丈夫なんですね。
カイン	ちゃんと効果があるような気はするな。
	ただ、川辺にもよく行くから、どっちが効いてるのかはよく分からないが。
晶	（相変わらずカインはおおらかだ……）
`},
{id:10328,title:"力くらべ頂上決戦",type:"personal",characters:["カイン","レノックス"],memo:"カイン",
text:`晶	カインとレノックス。二人で向かい合わせに座ってどうしたんですか？
レノックス	賢者様。今からカインと力くらべをするところなんです。
カイン	レノは力が強そうだから、一度勝負してみたくてさ。
	そうだ、賢者様。どっちが勝つか予想してみてくれよ。
晶	（カインとレノックスの腕相撲勝負か。そうだな……）
~~~~~~~~~	~~~~~~~~~
選択	カインだと思います。
カイン	ありがとな！あんたにそう言われちゃ負ける気がしないぜ。
~~~~~~~~~	~~~~~~~~~
選択	レノックスだと思います。
カイン	レノックスは体格がいいからな。だからといって俺も負けないぞ。
~~~~~~~~~	~~~~~~~~~
カイン	よし、行くぞレノックス！
レノックス	ああ。
晶	（す、すごい気迫。二人とも一歩も譲らない、いい勝負だ……！）
	えっ！？机の足が歪んだ……！？
レノックス	……すみません、力を入れすぎました。
カイン	俺もかなり力を込めちまったからな。あとで魔法で直しておくよ。
晶	（机の方が耐えられなくなるなんて、元騎士と元軍人の腕相撲はレベルが違った……）
`},
{id:10329,title:"家族",type:"personal",characters:["③"],memo:"カイン",
text:`晶	カイン。手紙を読んでるんですか？
カイン	ああ、故郷の両親がたまに送ってくるんだ。
	体の調子はどうだとか、ちゃんと飯を食ってるのかとか。
	今回も代わり映えしない内容だな。
	あとは、近所の花が咲いたとか、変な魚が捕れたとか。
	どこに遊びに行ったとか、呑気なもんだよ。
晶	いいご両親じゃないですか。返事を書いたら、きっと喜ばれますよ。
カイン	なかなか筆不精だからなあ……。まあ、近いうちに顔を見せに行くよ。
晶	カインはひとり息子なんでしたっけ？兄弟がいそうな感じですけど……。
カイン	いや、ひとりだよ。でも、兄弟みたいな連中がずっと周りにいたからな。
	街の友達や、騎士団の仲間が。
晶	だから兄貴分ぽくて頼もしいんですね。
カイン	話してると懐かしくなってくるな。
	今夜は、中央の都の馴染みの店にでも、飲みに行ってみるか。
晶	手紙は書かないのに、フットワークは軽いですよね……。
カイン	はは。元々、書類仕事は苦手だったからな。
	晶に用があるときも、手紙を書かずに会いに行くさ。
`},
{id:10330,title:"再会の魔法使い",type:"personal",characters:["カイン","オーエン"],memo:"カイン",
text:`晶	オーエンとは、賢者の魔法使いに選ばれた時に再会したんですか？
カイン	ああ。あいつが世界を守る魔法使いだったなんて、最初は信じられなかったけどな。
	初めて厄災と戦った時に会ったんだ。
	帰ろうとするところを引き止めて、左目を取り返そうと挑んだんだが……。
オーエン	僕に負けて命乞いしたんだよ。死にたくない。
	残った片目もやるから、どうか、殺さないでくれって。
晶	わっ……！オーエン……。
カイン	嘘つきめ。おまえに命乞いなんかするもんか。
	あの時だって、おまえが途中で消えたんだろ。
オーエン	あれから一度も取り返しに来ないね。
	いらないならきみの目の前で野良犬にでも食べさせようかな。
カイン	戦っても俺に勝ち目がないのはわかってる。
	だが、今はオズから魔法を学んでるんだ。いずれ腕を磨いて取り返すさ。
オーエン	ふふ。急いだ方がいいんじゃない。その時にまだ目玉があるとは限らないよ。
カイン	言ってろ。おまえは二度も俺にとどめを刺さなかった。
	遊んで欲しいのはそっちの方だろ。
オーエン	…………。
	馬鹿みたい。
晶	だ、大丈夫ですか？カイン……。オーエンが癇癪を起こしたら……。
カイン	いや。たまに絡まれはするが、しばらくは大丈夫だろう。なんとなくだけどな。
`},
{id:10331,title:"困ったときは",type:"personal",characters:["カイン","ヒースクリフ"],memo:"カイン",
text:`晶	あ、ヒースクリフだ。依頼任務から戻って来たみたいですね。
カイン	ああ、中央の都に行ってたんだったか。
	……あれ？
晶	どうかしましたか？
ヒースクリフ	賢者様、カインも。ただいま戻りました。
カイン	お疲れ様。何の任務だったんだ？
ヒースクリフ	探し物だよ。すぐに見つかると思ったんだけど、思ったより長引いちゃって……。
カイン	ああ、なら、聞き込みでもして、人あたりしたんじゃないか。調子悪そうだぞ。
晶	……言われてみれば、ちょっと顔色が悪いかもしれませんね……｡
カイン	《グラディアス・プロセーラ》
	ほら、シュガーだ。食べて、今日は無理せず部屋で休めよ。
	夕食も持って行ってやるからさ。
ヒースクリフ	……ありがとう、カイン。少し気疲れしたのかもしれないな……。
	賢者様も、心配させてしまってすみません。
晶	気にしないでください。後で様子を見に行きますね。
カイン	そうそう、遠慮するな。困った時はお互い様だって、前の賢者様も言ってたしな。
`},
{id:10332,title:"剣術の先生",type:"personal",characters:["アーサー","カイン"],memo:"カイン",
text:`晶	あれは……、アーサーとカイン？
アーサー	っ……、は……っ！
カイン	そうそう、今のは上手いぞ。だが、脇が甘いな……！
アーサー	あ……っ！
カイン	腕を上げましたね、アーサー殿下。思わず本気になってしまいました。
アーサー	お世辞はいい。……っ……、あはは、手が痺れた……。
カイン	大丈夫か？見せてみろ。
晶	お疲れ様です。カイン、アーサー。今日は魔法の練習じゃないんですか？
アーサー	賢者様……。ご覧になってたんですね。お恥ずかしいところをお見せしました。
	少し稽古をつけてもらってたんです。
	剣は城でも習うのですが、カインに教わる方が気兼ねがなくて。
カイン	そう言われちゃ断れなくてさ。
	俺も勘を鈍らせたくないし、たまに練習に付き合ってもらってるんだ。
晶	二人とも、格好良かったです！俺もやってみようかな……。
カイン	本当か？賢者様が興味を持ってくれるのは嬉しいな。
	いつでも教えてやるから、言ってくれよ。
`},
{id:10333,title:"魔法使いの思い出",type:"personal",characters:["③"],memo:"カイン",
text:`晶	カインは魔法舎の魔法使い以外にも会ったことがありますか？
カイン	見かけたってくらいなら、子供の頃から何度かあったよ。
	俺は魔法使いだってことを隠してたが、力の強い魔法使いにはバレちまうらしくて。
	向こうから話しかけられたりさ。
	だけど、知り合いだとか、仲間だと思える魔法使いに会えたのは、
	賢者の魔法使いに選ばれたおかげだな。
晶	そうなんですね……。
	魔法舎で最初に出会ったのはやっぱり、同じ中央の魔法使いのオズですか？
カイン	いや。オズはほとんど姿を見かけなかった。
	中央の魔法使いは他に、年上の姉妹の魔女がいたんだ。
	ちょっと賑やかで、親切でさ。
	それまで知らなかった魔法使いの話や、魔法のルールを色々聞かせてくれたよ。
	魔法使いとしては俺の方が未熟だったが、元騎士として、おまえたちを守ってやるなんて言ってたんだが、力になれなかったな……。
晶	そうだったんですか……。
	なら、その人たちが、カインの魔法のお師匠様なんですね。
カイン	いや、師匠ってほどじゃないな。
	魔法の師匠っていうなら、今教えて貰ってるオズの方がそれらしい感じだ。
	……大魔法使いオズの弟子で、中央の国の王子アーサー殿下と兄弟弟子か。
	あはは。悪くないかもしれないな。
`},
{id:10334,title:"突然の刺客",type:"personal",characters:["③"],memo:"カイン",
text:`晶	魔法舎の近くに、こんな森があったんですね。綺麗な花もいっぱい咲いてる。
カイン	自然豊かで、いいところだろ？俺はここが好きなんだ。
	ここを真っ直ぐ行くと……うわっ！？
晶	どうしたんですか？わっ、蛇がこっちに向かって……！
カイン	この……！
晶	（えっ、カインが蛇を手で掴んで……。思いっきり投げた！）
カイン	…………。
晶	助けてくれてありがとうございます。けど、カインは蛇が苦手なんだと思ってました。
カイン	苦手だよ、びっくりしすぎて触っちまった。……鳥肌がすごい。
晶	本当だ……！
`},
{id:10335,title:"少しだけおとなしく",type:"personal",characters:["③"],memo:"カイン",
text:`晶	わっ！？
	いたた。石につまずいちゃった……。
カイン	晶……！どこか怪我してないか！？
晶	はい。心配してくださってありがとうございます。
カイン	念のためフィガロに診てもらった方がいいな。
晶	え！？カイン！？
カインは軽々と俺を持ち上げてそのまま走り出した。
晶	カイン！本当にどこも怪我してないので大丈夫ですよ？
カイン	大丈夫だと思うけど、念のためな。悪いが、少しだけ大人しくしていてくれ。
晶	（さすが騎士……！行動がスマートで格好いい）
`},
{id:10336,title:"得意な魔法",type:"personal",characters:["③"],memo:"カイン",
text:`カイン	賢者様、いるか？いたらハイタッチしてくれ。
晶	カイン……。なんか光りっぱなしですけど……。どうしたんですか？それ。
カイン	ああ。魔法の練習中なんだ。
	今日の座学の授業で、
	オズに、魔法の力加減を安定させる練習をしろとアドバイスしてもらったんだよ。
	具体的に言うと、感情と魔力の発露が紐付きすぎてるって。
晶	感情と魔力の発露、ですか……？
カイン	戦ってるうちに気持ちが乗ってくるというか、テンションと一緒に魔力が上がるのを、コントロールしろということらしい。
	確かに、自分では真剣にやってるつもりでも、練習だと思ってると、
	一発目からフルパワーが出せないんだよな。
	実戦と同じように、誰かを守らなきゃ、とか、ここは俺が抑える、とか。
	目的があったほうが集中できる気がするし。
晶	なるほど……。でも、最初から強い力を出すのって難しそうですね。
カイン	そうなんだよ。だからこうして、普通の状態で、魔法を使い続けてみてるんだが……。
	なかなか疲れるんだよな。
`},
{id:10337,title:"魔法の先生",type:"personal",characters:["③"],memo:"カイン",
text:`晶	オズの魔法の訓練って、一体どんな感じなんですか？
	あんまり想像がつかなくて……。
カイン	いろいろ指示をしてくれるが、基本的には『見て覚えろ』って感じだな。
晶	見て覚える……というと、実演してくれるってことですか？
カイン	例えば、どうすれば魔法で岩を砕けるのかを聞くとするだろ。
	すると、オズが呪文を唱えて、近くにあったでかい岩を砕く。
	そのあとに『こうすればいい』と言われるんだ。
晶	あはは、なんだかオズらしいですね。ちょっとスパルタな感じが。
カイン	他の国の先生の授業を参考に訓練をしてくれたこともあったな。
	国が違うと訓練の方法もかなり違うらしい。
~~~~~~~~~	~~~~~~~~~
選択	北の国っぽい授業はどうでしたか？
カイン	いきなりオズが『私を倒してみろ』とか言うから驚いたぜ。
	北の魔法使いは、殺し合い同然の訓練もしているらしい。
	最強の魔法使いと戦える機会なんて滅多にないからさ。
	胸を借りるつもりで挑んだら容赦なく叩きのめされたけどな。
~~~~~~~~~	~~~~~~~~~
選択	東の国っぽい授業はどうでしたか？
カイン	東の魔法使いは座学での授業も多いらしい。教本を渡されて読むように言われたよ。
	けど、リケはまだ文字を読むのが苦手だろ？
	それで、座学はちょっと難しいって話になってさ。
~~~~~~~~~	~~~~~~~~~
晶	いろんな国の授業も試してみたんですね。どの国の授業が一番合っていました？
カイン	なんだかんだ言って、
	オズの『見て覚えろ』の訓練方法が中央の魔法使いには一番合っていたな。
	実際にここに来てから、俺たちの魔力も強くなってる。オズはいい先生だよ。
`},
{id:10338,title:"紋章",type:"personal",characters:["③"],memo:"カイン",
text:`晶	カインの賢者の紋章は、右腕に出たんですよね。
カイン	ああ、ここだよ。
カインは服の袖を軽く捲って、右腕にある紋章の端っこを見せてくれた。
カイン	初めて紋章が現れた時は驚いたな。
	最初はアザか何かだと思ったが、ずっと消えないからさ。
	友達なんかにもえらく心配されたよ。呪いを受けたんじゃないかとか。
晶	たしかに、事情を知らないと怖いですよね。カインは紋章のことは知ってたんですか？
カイン	噂話はあったが、詳しく聞いたりしなかったんだ。
	魔法使いだってことを隠してたからな。
	中央の国の騎士団に所属してると、
	魔法舎や、賢者の魔法使いの話は度々耳に入ってきた。
	一般人よりは、賢者の魔法使いがどんなことをしてるのか、把握してたと思うが……。
	あはは。まさか、自分が選ばれるなんて、これっぽっちも思ってなかったな！
晶	（けっこう、大変なことな気がするけど、根アカな人だなあ……）
`},
{id:10339,title:"俺と一緒に",type:"personal",characters:["③"],memo:"カイン",
text:`晶	カイン。おはようございます。
カイン	おはよう、晶。悪いが、手に触れてもらっていいか？
晶	はい。こんなところで何をしてたんですか？
カイン	これから魔法舎の周りを走るところだ。
	騎士団にいた頃よりも体力が落ちている気がしてさ。
	最近、朝の日課にしてるんだ。晶も一緒にどうだ？
晶	そうですね……。ぜひ一緒にと言いたいところなんですが……。
	多分、俺はカインに比べて走るのが遅いので、迷惑をかけてしまうかもしれません。
カイン	気にすることないさ。晶が隣にいてくれた方がきっと楽しいからな。
晶	（そんな風に言われたら断ることなんてできないな）
	それじゃあ、お願いします！
カイン	ああ、行こうか！
`},
{id:10340,title:"カインの暮らし",type:"personal",characters:["③"],memo:"カイン",
text:`晶	カイン、みんなでお茶にしようって言ってるんです。
	よかったら、カインも一緒にどうですか？
カイン	ああ、晶か。ありがとう。ちょうど何か飲み物を買いに行こうと思っていたんだ。
そう言いながら、カインは磨いていた剣を机の上に置いて立ち上がった。
晶	用事の途中なら、お茶は部屋に持ってきましょうか？
カイン	大丈夫。これはただの日課だ。また後で続きをやるよ。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
カイン	昼寝か、トレーニングか、今やってたような、剣や靴の手入れだな。
	部屋に篭ってるのは苦手だから、大抵は近くの森や街の方に出かけたり、魔法舎の中でも、談話室や食堂で過ごしてる。
	~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
カイン	ヒースは以前から、よく話をしに来るよ。
	去年、あいつが賢者の魔法使いになったとき、一番歳が近いのが俺でさ、
	仲良くなったんだ。
	あとはまあ、今年入って来た若い魔法使いは、みんな遊びに来てくれるな。
	俺も部屋に他人を入れるのを厭わないたちだし。
	今まで、厄災が近づく時期以外は、みんな元の住処に帰ってた。
	今年は賑やかでいい。あんたもいるしな。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
カイン	早めに起きて、魔法舎の周りをひとっ走りしてる。
	そのあと、食堂でみんなとハイタッチだ。
	オズの授業と、剣の鍛錬を済ませたら、残りは自由時間。
	夜はたまにシャイロックのバーに行くかな。
~~~~~~~~~	~~~~~~~~~
カイン	騎士団にいた時と違って、ここでの暮らしは少しのんびりしてるんだよな。
	あんたが来てから、討伐だ、任務だ、鍛錬だと、
	毎日やることができて、張りが出たよ。
晶	そう言ってもらえるとホッとします。
	でも、今日はみんなでゆっくりしましょうね。ネロがパイを焼いてくれたそうですよ。
カイン	美味そうだ。ネロが来てから、食事も断然楽しみになったな！ 
`},
{id:10341,title:"主君の変化",type:"personal",characters:["アーサー","カイン"],memo:"カイン",
text:`晶	アーサー、カイン。二人で何をしているんですか？
カイン	アーサー様とカードで絵合わせゲームをやっていたんだ。
	アーサー様はすぐに顔にでるからな。
	取られたくないカードの近くに手を持っていくと表情が変わるんだ。
アーサー	そうだったのか……。よし、次のゲームでは気をつけよう。
カイン	晶も一緒にやらないか？
晶	いいんですか？ぜひ！
カイン	ははっ、アーサー様また顔に出てましたよ。
アーサー	気をつけていたつもりだったが、なかなか難しいな……。
晶	（俺にはアーサーは十分、ポーカーフェイスに見えたけど……）
アーサー	よし、もう一回やりましょう！次こそは負けないぞ、カイン！
晶	（カインは元騎士団長だから、主君の変化に気付きやすいのかもしれないな）
`},
{id:10342,title:"カインとお酒",type:"personal",characters:["カイン","シャイロック"],memo:"カイン",
text:`シャイロック	この酒は温めるとさらに風味を増して美味しいんです。
カイン	そうなのか。それは楽しみだ！
シャイロック	まだ熱いので、気をつけてくださいね。
	賢者様はお酒はお召しにならないんでしたよね？
晶	そうなんです。アルコールはちょっと……。
シャイロック	わかりました。
	いつか、賢者様が甘い美酒に酔いしれる姿を見られる日を楽しみにしておきますね。
カイン	熱……っ！
晶	カイン、大丈夫ですか！？
シャイロック	おやおや、まだダメだと言ったのに。
カイン	あまりにも美味そうだったから
	つい、な。
シャイロック	ふふ、まったく。せっかちな方ですねえ。
`},
{id:10343,title:"秘密の計画",type:"personal",characters:["中央"],memo:"カイン",
text:`晶	みなさん、部屋の隅に集まって何をしているんですか？
カイン	いつも世話になってるオズに礼をしたくてプレゼントを考えてるんだ。
	けどなかなか決まらなくてさ。
アーサー	私たちでオズ様が好きなポトフを作ってお贈りしたら、喜んで貰えるんじゃないか。
リケ	うーん。僕はオズの似顔絵を描いてプレゼントするのがいいと思います！
カイン	俺は旗にオズへの感謝を書いて飾るのが一番気持ちが伝わると思うんだが……。
	晶はどれがいいと思う？
~~~~~~~~~	~~~~~~~~~
選択	ポトフがいいと思います。
カイン	やっぱり昔一緒に暮らしていたアーサーが言うんだし間違いないか。
リケ	オズが好きなポトフ……。僕も少し食べてみたいです。
アーサー	なら、鍋いっぱいにたくさん作ろう。皆で一緒に食べてもきっと楽しいはずだ。
~~~~~~~~~	~~~~~~~~~
選択	全部がいいと思います。
カイン	確かにそれはいい考えだ！
リケ	さすが賢者様です！きっとオズも嬉しさのあまり涙するに違いありません。
アーサー	賢者様のおかげで素敵なお贈りできそうです！ありがとうございます。
~~~~~~~~~	~~~~~~~~~
カイン	それじゃあ、さっそく手分けして準備をしよう。もちろん、オズには内密で……。
オズ	私がなんだ。
アーサー	オズ様！？
リケ	えっと……！決してオズのために日頃の感謝の気持ちを込めた
	サプライズプレゼントを考えていたわけでは……！
晶	リケ、落ち着いて……！全部しゃべっちゃってますから！
オズ	……？
`},
//リケ
{id:10401,title:"スポットの印象（１）",type:"personal",characters:["④"],memo:"リケ",
text:`晶	リケは既知の遺跡でもずっと平気そうですけど、崩壊星の石の影響はない感じですか？
	いい影響も、悪い影響も、両方？
リケ	改めて自分の体を感じてみると、不安や悲しみが払われるような、心が晴れるような気がするかもしれません。
晶	じゃあ、既知の遺跡は、リケにとってリフレッシュできる場所なのかもしれませんね。
	答えにくかったら無理しなくていいんですが、普段、リケが不安や悲しみを抱くのはどんな時なんですか？
リケ	……考えが違う人たちに出会って、自分が間違っているのかなと思うときは、少しだけ不安な気持ちになります。
	その人たちが、どうして正しい行いができないんだろうと思うときは、悲しくなります。
	あと……。
	おやつをふたつ食べたかったのに、どちらかひとつだけと言われて、ひとつ食べられなかったときに、悲しいです……。
晶	リ、リケ……。
	今度、俺の分のおやつをあげますね。
リケ	賢者様……。でも、ネロに、おやつを食べ過ぎたら虫歯になるぞって言われたんです。
	賢者様は虫歯をご存知ですか？
	僕はまだなったことがないのですが、とても痛いものなんだそうです。
	あんまり痛いから、歯を引っ張って、引っこ抜かなきゃいけなくなるんですって。
晶	この世界の虫歯治療法って、そんな過酷なんですね…！？
リケ	そうみたいです。怖くないですか？
晶	怖いです……！！虫歯、絶対気をつけます……！
`},
{id:10402,title:"スポットの印象（２）",type:"personal",characters:["ネロ"],memo:"リケ",
text:`晶	既知の遺跡のこと、ネロはどう思いますか？
ネロ	いやあ……。俺はちょっと、苦手だなあ。
晶	もしかして、体調悪くなりましたか？気分が悪いとか、頭が痛くなったとか……。
ネロ	うーん……。
晶	（あ……、あれ……。急に手を繋がれた……？）
ネロ	自分が自分じゃなくなるなんて場所は、あんまり居心地いいもんじゃないよな。
	それを誰かに見られるのなんか、特にさ。まあ、俺は今の所、そんなに変化ねえけど。
	ちょっとぼーっとするかな、ってくらいかも？
晶	…………、そうですか……。
ネロ	ん、どうした？あんたには効き目ないんだよな。もし調子が悪いなら……。
晶	いえ、ネロ、あの……、さっきから俺の手を握ってるんですけど、もしかして気づいてないですか？
ネロ	え……？どわ……つ！？わ、悪い……！！
晶	いえ！全然大丈夫ですよ！
	嫌とかじゃないですし、崩壊星の石のせいだってわかってますし……！
ネロ	……いやー……。ショックだなこれ……。
	これだけ生きてきて、酒飲み過ぎてハメ外したなんてことも、数えるくらいしかなかったのになあ……。
晶	（わ……。また手を繋がれた……）
ネロ	賢者さん……。ここ、まだ用事あんの？
晶	（やっぱり気づいてないのかな……）
`},
{id:10403,title:"スポットの印象（３）",type:"personal",characters:["フィガロ","ミチル"],memo:"リケ",
text:`ミチル	…………。
晶	ミチル……。大丈夫ですか？ミチル。気分が悪くなっちゃいましたか？
ミチル	いえ、大丈夫です。でも……、なんだか……。なんだか暴れたい気分です。
	物を壊したいような……！
晶	げ、元気が出てきた感じですかね？
ミチル	元気なのかな……？
	カーッとする気もしますけど、強い魔法をバーンってしたくて、胸のあたりがウーっとしてしまって……。
	うう……、ウー……。……っ、ガブ……ッ！
晶	わー！？どうしたんですか！？突然、自分の腕を噛んだりして……！
	ダメですよ、ミチル！ミチル……！
ミチル	はっ。……わあっ！？す、すみません……。
	ボク……、ボク……。急に何かに噛み付きたくなっちゃって……。
	でも、賢者様は噛んじゃダメだって思って……、それで……、それで……。
晶	（けっこうキてるな……。早くここから離れた方が良さそう……）
フィガロ	ああ、ほらほら、ミチル。
	若い魔法使いは近付いちゃダメだって、先生言ったじゃないか。
ミチル	わああん……！ フィガロ先生……！ガブ！ガブガブ！
フィガロ	痛たたたたた。
	《ポッシデオ》
晶	フィ、フィガロ……。
フィガロ	眠らせただけだよ。やっぱり、弱い魔法使いには少し危険な場所だなあ。
	遺跡ごと埋めたほうがいいのかもしれないね。
`},
{id:10404,title:"ブレイクタイム（１）",type:"personal",characters:["④"],memo:"リケ",
text:`リケ	ドラゴンにもう一度会いたくて、ドラゴンにまつわる伝説を魔法舎で調べたんです。
晶	最近、魔法舎の図書室で熱心に勉強していたのはそれだったんですね。
リケ	はい。どうしたらドラゴンを呼び寄せられるのか、他の魔法使いにも尋ねました。
	ネロや、オズや、スノウやホワイトや、ムルや、ミスラや、ファウストや、アーサー様や、フィガロや、ルチルにも。
晶	（聞いて回った順番なのかな……？）
リケ	そうしたら、悪口を言うとやってくるとか、供え物や捧げ物をするとやってくるとか、
	音楽を奏でるとやってくるとか……。
	色々な説があるようですが、僕にできそうなのは音楽を奏でることなので、ここでやってみようと思ったんです。
晶	……そのせいで……。ミチルがあそこで太鼓を抱えて酔っ払ってるんですね……。
ミチル	えへへ。あははは。
リケ	一緒に演奏しようって言ったのに、ミチルは崩壊星の石のせいで、酔っ払ってしまったんです。
	でも、酔っ払ってるミチルは、ちょっと可愛いですよね。
晶	ん？
リケ	怒ったり泣いたり笑ったりしていて、色々なミチルが見れるから、僕はらしいです。
晶	（無邪気だ……）
`},
{id:10405,title:"ブレイクタイム（２）",type:"personal",characters:["カイン"],memo:"リケ",
text:`カイン	晶！ここにいたんだな、さあ行こう。
晶	え？行くって、どこへですか？
カイン	どこでもさ！
言うなり、カインは俺の手を取って、箒と一緒に空へ舞い上がった。
晶	うっ、うわあ……！
カイン	どこに行きたい？どこへでも行ける。
	あんたの見てみたい場所なら、どこでも連れていってやりたい気分なんだ！
箒の前に俺を乗せて、体を抱えるようにしながら、カインは遠慮なく青空を飛び回りする。
晶	ぎゃーっ！
カイン	シノの住んでた森に行ってみるか？それとも２人で海を見てみようか。
	西の国にリゾートの島があるって聞いたんだ。
	ひとまず俺の生まれ故郷を目指して飛ぼう。
	ここからの方角はわからないけど、飛んでりゃどこかには着くもんな！
	…………。あれ？
晶	だ、大丈夫ですか……？
カイン	悪い、晶。
	ちょっと浮かれてたみたいだ。
	浮かれてたよな？今。
晶	そ、そうですね、いつもとは少し様子が違ったというか……。
カイン	あはは！俺、浮かれると、あんたをデートに誘っちまうんだな！
	知らなかったよ。
`},
{id:10406,title:"スポットの思い出（１）",type:"personal",characters:["④"],memo:"リケ",
text:`リケ	この間は、大きなドラゴンが見られて嬉しかったです。また会えるでしょうか？
晶	どうでしょう……。厄災の影響で蘇ったみたいでしたし。
	でもまだ、どこかにはいるんですもんね。
リケ	あれから僕、ドラゴンの背に乗って空を飛んでみたいって、ずっと思っていて、
	夢に見るくらいなんです。
晶	それは……。
	俺もちょっと乗ってみたいかもしれないです……！
リケ	そうですよね！
	ドラゴンとはどんな生き物ですかとオズに尋ねましたが、何度か戦ったことがあるだけで詳しくないと言われました。
	オズがドラゴンと友好的な関係を築くためにもっと努力していればよかったのに
	と思いますが彼はおしゃべりも下手ですし、仕方ないですね。
	ですが、強いドラゴンは、オズと同じように天候を操れるそうですよ。
晶	怖ッ……！？
	ドラゴンってオズレベルなんですね……。
	魔法生物が自然災害を起こせるっていうのは、かなり危険なんじゃないですか？
リケ	ドラゴンは賢いんだそうです。言葉もわかるし、話せるものもいるとか。
	ですから、きっと大丈夫です。
	僕、いつかドラゴンと話してみたいです！
晶	（リケは無邪気だな。怖いもの知らずなところはヒヤヒヤするけど、
	　子供らしいところを見るのは癒されるなあ……）
`},
{id:10407,title:"スポットの思い出（２）",type:"personal",characters:["④"],memo:"リケ",
text:`晶	リケの暮らしていた教団は、どんなところでしたか？既知の遺跡に似ていますか？
リケ	この遺跡のような場所とは少し違います。
	ちゃんと屋根がありましたし、その中に中庭もありました。
晶	屋内に庭があったってことですか？
リケ	はい。小さいですが麗な場所でした。
	神の使徒である私は、教団の建物の外に出ることは、滅多にありませんでした。
	司祭様に言われたんです。
	外の世界には、間違った教えを信じている人々がたくさん居て、その者たちから迫害を受けるおそれがあると。
晶	迫害……。
リケ	正しい信仰を持つ徒の方々や、神の使徒が姿を見せると、都合の悪い人たちがいるのだと教えられました。
晶	それじゃあ……、教団から出て、魔法舎にくるときは、怖かったんじゃないですか？
リケ	いいえ。僕の学んだ教えがあれば、信徒のみなさんと同じように、外の世界の人々も正しく導く自信がありました。
	それに……、紋章が現れたせいで、教団にいられない雰囲気になってしまって……。
	一刻も早く消さなくてはと思っていました。
	あの時は、賢者様が責任者だと思っていたから、賢者様に文句を言うところでした。
	ちゃんと話を聞いて、良かったです。
晶	（もう少しで、リケのクレーム対応をするところだったのか……）
リケ	教団にいた時は、みなのやるべきことは、全て決まっていました。
	今は、誰かの答えを待つことや、自分で考えて決めることが多くて……。
	少し、そわそわしてしまいます。
	自分で考えて決める、ということは、楽しみもありますが、難しいものなのですね。
`},
{id:10408,title:"リケへの印象（１）",type:"personal",characters:["オズ"],memo:"リケ",
text:`晶	オズはリケのこと、どう思っているんですか？
オズ	まだ子供だ。六歳頃のアーサーに似ている。
	若い魔法使いの年はよくわからないが、実際の年齢よりも幼いように感じる。
	だが、去年のアーサーが、今のリケと同じ年だというなら、ひとりでも十分やれていたのだろうとも思う。
晶	たしかに、リケは利発ですけど、子供っぽい可愛いげもあって、不思議な子ですよね。
オズ	子供と話す機会は少なかった。
	幼い頃のアーサーとも違っていて、なんと表現すれば適切なのかわからないが……。
	これから大きくなろうとしている新芽のように見える時も、新芽であるのに成長しきっているように見える時もある。
晶	それは……、いいことなんですか？それとも悪いこと？
オズ	そう尋ねられると困るが……。
	リケは、理由がなくては何かをねだれない。
晶	おねだりの理由ですか？
オズ	そうだ。世界の平和や人間のためにと言って、私の力を求めてくる。
	そうでなければならないと思っている。
	リケ自身のために、私が力を貸すことはやぶさかではないが……。
	己の望みとして、欲望を訴えられないのだ。アーサーよりも甘えるのが下手だな。
`},
{id:10409,title:"リケへの印象（２）",type:"personal",characters:["アーサー"],memo:"リケ",
text:`晶	リケ、今回は頼もしかったですね。
	アーサーは普段のリケのこと、どう思っていますか？
アーサー	リケは、普段からしっかりしています。率先して人のために働こうとしていて、
	優しく、強くと、育てられたのだと思いますね。
晶	そういうところは、アーサーも似てる気がします。
	いつも、魔法使いと人のためにって。
アーサー	はい。リケとは意見の合うことが多いです。もちろん、違うところもありますが。
晶	２人の意見が分かれるのは、どんなことですか？
アーサー	私も、魔法使いと人間が手を取り合えたらと願っていますが、
	人間のために魔法使いがいるのだとは、考えたことがありません。
	力のあるものが、弱いものへ、無条件で奉仕すればいいとは思わない。
	北の国育ちの考え方なのかもしれませんね。
	ですが、リケはリケのために魔法を使う楽しさを覚えていいはずだと思うのです。
晶	自分のために魔法を使う楽しさ……。
アーサー	ええ。もっと自分本位に、と言うと、聞こえは悪いかもしれませんが……。
	リケが努力して得た力を自由に使うことは、決して悪い事ではないと思うのです。
	リケは食べることが好きだから、ネロに魔法を教わるといいだろうと
	思ったのですがネロは料理に魔法を使わないのですよね……。
晶	リケも、いろいろな好きなことを模索している最中だって言ってました。
	探すのを手伝って、何か見つかったら、アーサーが教えてあげてもいいんじゃないでしょうか？
アーサー	なるほど、そうでしたか。
	２人でリケの好きなことを探して、色々な冒険をするのは、とても楽しそうです！
`},
{id:10410,title:"リケへの印象（３）",type:"personal",characters:["カイン"],memo:"リケ",
text:`晶	カイン、体調は大丈夫ですか？
カイン	ああ、なんとか。しかし、リケだけなんともないなんて驚いたよ。
	リケはいつもしゃんとしてるよな。俺は大雑把な性格だから、よく怒らせちまうけど。
晶	カインはリケのこと、どういう風に見ていますか？
カイン	そうだな……。
	アーサー様の忠臣になりたいと思ってるようだけど、騎士として、そこは譲れない。
	そういう意味では、ライバルでもあるかもな。
	職業を聞かれて、騎士だって答えたら、戦争のための職業なんて野蛮だと言われたことがあるんだが……。
	アーサーや国を守るための職業なんだって説明したら、納得してくれたみたいだ。
	話せばわかるし、柔軟なところもあるんだよな。
	芯が強いし、たくましさもある。
	だから一人前に扱ってほしいんだろうけど、まだまだ子供っぽいところもあるしさ。
晶	そうですね。
	生活のことはとてもしっかりしてるけど、知らないことや思い込みも多いかもしれません。
カイン	そうそう、年より幼く感じる時があるんだ。
	身近に小さくてかわいいやつがいると和むから、そういうところも好きだよ。
	喜ぶ顔が見たくて、市場なんかに行った時は、つい土産を買っちまうんだ。
	食べ物ならなんでも嬉しそうに食ってくれるけど、
	格好良さそうだと思って買ったブーツとかナイフとかは反応悪いんだよな。
	趣味はけっこう違うけど、大事な仲間だ。
	オズやアーサーと一緒に、俺が面倒見てやらなくちゃなって思ってるよ。
`},
{id:10411,title:"リケへの印象（４）",type:"personal",characters:["ネロ"],memo:"リケ",
text:`ネロ	んー……。
晶	……大丈夫ですか？ネロ。ぼんやりしてるみたいですけど……。
ネロ	……ん、ああ……、悪い、平気だよ。話の途中だったよな。
	なんだっけ……？、リケの話だっけ？
晶	はい。リケのこと、どう思っているのかなって。
ネロ	そうだな……。リケは、客だとしたら完璧だよ。
	何食べても美味いっつって感激してくれるし、残さず食べるし、行儀もいいし、
	まして、味付けのアドバイスなんて絶対してこないしな。
	だけど、子供として見た時には、ちょっとだけ、危なっかしいなって思うんだ。
	純粋な分、いつか傷つきそうでさ。
晶	……わかります。リケの無垢さには救われることが多いですけど……。
	こうして外の世界に触れていたら、ずっとあのままではいられないんじゃないかって……。
ネロ	そうそう。まあ、心配にはなるけど、
	今は、あいつの周りにゃ良い魔法使いがたくさんいるしな。
	わざわざ俺がしゃしゃっていく必要もないかって思って、
	つい、見守っちまうんだけどさ。
晶	リケはネロのこと、頼りにしていると思いますよ。
ネロ	……それもなんとなくわかるけど……。
	俺は若い魔法使いの人生に口出せるほど、まともでも、出来てもねえし……。
	まあ、温かくて美味いもの食わせとけば、元いた場所に帰りたいとは言わないだろうからな。
	それが、今俺に出来る精一杯かなと思ってるよ。
`},
{id:10412,title:"リケへの印象（５）",type:"personal",characters:["ミチル"],memo:"リケ",
text:`晶	魔法舎に来てから、ミチルとリケはすごく仲良くなりましたよね。
ミチル	はい！
	リケみたいな子と友達になるのは初めてで、一緒にいると少し不思議で、すごく面白いです。
	ひとりでも色々出来るし、どんな時もあまり怖がらないし、
	しっかりしててお兄さんみたいだなって思う時があります。
	でも、小さな子が学校に行かなくても知ってることを知らなかったり、
	ちょっと我儘な弟みたいな時もあります。
	そんな時は、ボクが守ってあげなくっちゃって思うんです。そういうところも含めて、
	好きだなって思います。
晶	そうですね……。リケの少し幼いところは心配になることもありますけど……。
	ミチルが一緒にいてくれるから、安心している部分もあるんです。
	いつもありがとうございます、ミチル。
ミチル	本当ですか？賢者様にそう言ってもらえて、すごく嬉しいです！
	……ここだけの話なんですけど……。
晶	なんですか？
ミチル	リケは、自分では気づいてないかもしれないですけど、
	けっこう、ヤキモチやきだと思うんです。
	ヤキモチを妬かれると、困ったなあって思うこともあるんですけど……。
	夜、ベッドに入ってから、リケのヤキモチで困ったときのことを思い出すと
	ボク、なぜか、にやにやしちゃうんです。
	これってリケの言う堕落なんでしょうか？
	怒られるかもしれないから、リケには内緒にしてくださいね。
`},
{id:10413,title:"スポットゆかりの話（１）",type:"personal",characters:["④"],memo:"リケ",
text:`晶	リケの冒険の書、既知の遺跡の話は書けましたか？
リケ	ええと、まだ途中です。
	文字を書くこと自体も難しいですが、
	出会った出来事を、出会った通りに伝わるよう書くというのも、
	とても難しいことなのですね。
	崩壊星の石についても、詳しく書いておきたかったので、
	ムルに相談したら、色々教えてくれました。
晶	ムルは学者ですもんね。俺にも聞かせてくれませんか？
リケ	もちろんです！
	ムルも昔、既知の遺跡に来たことがあったそうなんです。
	崩壊星の石は世界のあちこちにあるようですが、
	既知の遺跡ほどに集めて敷き詰めている場所は他にはないそうです。
	かつてここにあった王朝は、
	魔法使いに攻め入られるのを恐れていたのかもしれないと言っていました。
晶	（……たしかに、魔法使いの魔法を封じる手段のひとつになるのかもしれないな……）
	ムルは、既知の遺跡に来て、体調に影響はなかったんでしょうか？
リケ	とても興奮して、頭が冴えた感じになって、
	石を調べているうちに何日も時間が経っていて、最後はぐったりしたそうです。
晶	効きまくってますね。ちょっと体に悪そうです……。
リケ	でも、石についてとても詳しかったです。
	彼は物知りなのに、行儀の悪い振る舞いをしてびっくりすることもありますが……。
	魂が砕けたと聞いて可哀想に思っています。
	いつか彼の魂が取り戻せますように、教えてくれたお礼に祈りを捧げようと思います。
`},
{id:10414,title:"スポットゆかりの話（２）",type:"personal",characters:["オズ","アーサー","スノウ","ホワイト","ミスラ","オーエン","ブラッドリー"],memo:"リケ",
text:`晶	うわっ……！北の魔法使いたちが雑魚寝してる……！？
スノウ	いい気分じゃ……。
ホワイト	夢心地じゃの……。
アーサー	賢者様！どうぞどうぞ、こちらです。
晶	ア……アーサー！？
	こんなところに混ざってたら、オズが卒倒しちゃいますよ……！！
アーサー	大丈夫ですよ。オズ様もご一緒ですから。
オズ	…………。
晶	何やってるんですか、オズ……！？
アーサー	崩壊星の石の話をしたら、みなも来てみたいと言うので案内したのです。
	それに、オズ様が付き添ってくださって。
ブラッドリー	天気もいいしよぉ……。なーんか気の抜けちまう場所だなぁ……。
オーエン	興奮できるっていうから期待して来たのに、なんなのこれ……。
	ぽかぽかして、意味わかんない……。
ミスラ	あー……。体のだるさが溶け出していくみたいですよ……。
	もしかしたらこのまま眠れるかもしれません……。
晶	あっ！あっちには、フィガロとネロまで……。
	（北にゆかりのある魔法使いたちが揃って日向ぼっこしながらうたた寝してる……。
	　リラックスできてるって事なのかな……？）
`},
{id:10415,title:"スポットゆかりの話（３）",type:"personal",characters:["ルチル"],memo:"リケ",
text:`晶	ルチルは、既知の遺跡に来て、体調に影響はありませんでしたか？
ルチル	けっこうありました！
晶	（けっこうあったんだ……）
ルチル	よく覚えていないので、レノさんに聞いた話なんですが、いつも以上に箒をぶっ飛ばして飛んでたみたいです。
晶	意識を失っちゃうくらいだったんですか……！？
ルチル	あ……！違いますよ！
	空を飛ぶのに夢中になって、気づいたらぐったりしちゃってたんです。
	おかげで夜はぐっすり眠れて、次の日はシャキッと起きられました！
晶	スポーツでストレス発散するみたいですね。
	なら、ルチルにはいい効果が出たんですね。
ルチル	はい！でも、やりすぎたら大変なのかもしれないです。
	箒でぶっ飛ばして飛んで、遺跡を通過して、しばらくすると我に返って、
	戻らなくっちゃと飛んでるうちに、またスピードを出して……。
	行って、戻ってを、お昼前から夕暮れまで、ずっと繰り返してたみたいです。
晶	それは大変ですね……。たしか、フィガロやレノックスも一緒でしたよね。
	２人は無事だったんですか？
ルチル	フィガロ先生はいつもよりだらしなくて、
	レノさんはいつもより、ちょっとキリッとしてて、かっこよかった気がします！
晶	レノックス、そんな感じになるんですね……！？
ルチル	私の箒を止めてくれたのもレノさんなんです。
	剛速の箒に体当たりで飛びかかって来て！さすが歴戦の戦士！って思いました！
`},
{id:10416,title:"中央の国について",type:"personal",characters:["④"],memo:"リケ",
text:`晶	リケは、教団の中から外に出ずに暮らしてたと聞きましたが、
	自分の住む国が中央の国だってことは知っていたんですか？
リケ	はい。僕がいるのは聖なる魔法使いファウスト様が作った国で、
	世界には他にもいくつかの国に分かれていると教えていただきました。
	でも、それは間違いです。
晶	えっ。
リケ	国境などの区別なく、人々が互いに協力し合うのが大切で、世界のあるべき姿なのです。
晶	なるほど……。それはたしかに、そのほうがいいのかも……？
リケ	いいに決まっています。
	そのために、私たちが正しい教えを与えて、みなを導くのだと聞いていました。
	大陸に五つの国があることは、魔法舎に来て、ルチルに教わりました。
	ルチルに聞いたことなら、お話し出来ますよ。
晶	ルチルの授業を受けたんですね。中央の国のことは、どんな風に言っていましたか？
リケ	人々や土地にはそれぞれの特性があって、
	中央の国の特性とは、勇敢で、人々に尽くす、英雄の気質だと。
	中央の魔法使いに選ばれたと言われても、あまりピンと来ていませんでしたが、
	その話は僕に当てはまるような気がしました。
	僕は、アーサー様の次に、中央の魔法使いらしいと思います。
	賢者様もそう思いませんか？
`},
{id:10417,title:"〈大いなる厄災〉について",type:"personal",characters:["④"],memo:"リケ",
text:`晶	リケは〈大いなる厄災〉について、どんな風に聞いていたんですか？
リケ	教団では、世界の人々の信仰心が薄れてしまったために、
	〈大いなる厄災〉が災いをもたらすのだと教わりました。
	良い行いをしていれば、月が僕たちを脅かすことはないと。
	だから、僕は教えられた通り、人々が正しい教えを信じることができれば、
	厄災は近づいてこなくなるのだと思っています。
	ですが、月が人々を罰する神のような存在だとすれば、迎撃しようと挑むのは、
	不敬な行為にあたるのではないですか？
	それとも、月が変異して、悪いものになってしまったから、
	僕たちを襲うようになったのですか？
	〈大いなる厄災〉とは、どんなものなのでしょうか？
晶	……難しい質問ですね……。
~~~~~~~~~	~~~~~~~~~
選択	良いものだと思う。
晶	リケの言う通り、本当は良いものかもしれない可能性があるんでしょうか？
	たしかに、悪意は感じられないですが……。
リケ	でも……、例えば、カインが話してくれる、
	前任の賢者の魔法使いだった中央の姉妹魔女が悪い魔法使いだったとは思えません。
	月が神様のような良い存在なら、次の戦いで僕が石になってしまったら、
	僕は悪い魔法使いだったということになるのでしょうか？
~~~~~~~~~	~~~~~~~~~
選択	悪いものだと思う。
晶	世界を滅ぼしてしまうくらいだし、
	少なくとも俺たちにとっては災いなんじゃないでしょうか？
リケ	でも……、それなら、
	僕たちの信仰心が世界を救っているという司祭様のお話が
	間違っていたのでしょうか？
	今まで、教団の教えを疑うなんて、考えたこともありませんでした。
	神の使徒にあるまじき考えです。
	ですが、魔法舎に来てから、
	僕の知っていることは、どこまで本当のことなんだろうと考えてしまって……。
晶	リケ……。
~~~~~~~~~	~~~~~~~~~
晶	調べてはいるんですが、
	〈大いなる厄災〉がどんなものなのかはまだよくわからないんです……。
リケ	賢者様もご存知ないのですね……。
	では……、僕は誰を信じて戦えばいいのでしょう……。
	賢者様は、何を信じて戦うことにしたのですか？
`},
{id:10418,title:"スポットの人々",type:"personal",characters:["オズ"],memo:"リケ",
text:`晶	崩壊星の石が魔法使いにとって危険なら、
	既知の遺跡の扱いも慎重にしなくちゃいけないですよね……。
オズ	おまえが望むなら日を改めて結界を張っておく。
	だが、魔法使いも人間も、滅多に訪れる者のない辺境の地だ。慌てる必要はない。
晶	オズがそう言うなら……。
	俺は体感がないせいか、どう判断すればいいのか上手く掴めなくて。
オズ	……崩壊星の石の効果はそれぞれだ。
	よほど強く作用したとしても、完全に正気を失うほどではない。
	本来は、小さく砕いた石を部屋に置いたり、身につけたりして、魔力の安定のために使う。
	毒のようなものではない。
晶	そうなんですね……。
	ありがとうございます、安心しました。
オズ	効果のない者もいる。私も、もうほとんど慣れた。
	魔力の強い魔法使いたちは心配ないだろう。
	体質に合わない者や、強い力に耐性のない若い魔法使いの気が高ぶり、
	魔力や体力を使いすぎる事はあるかもしれない。
晶	魔力や体力を使いすぎると、どうなってしまうんですか？
オズ	…………。
	分かりやすく言うならば……。
	ぐったりする。
晶	あ、すごく分かりやすいです。
	若い魔法使いと来るときは、気をつけるようにしますね。
オズ	ああ。
`},
{id:10419,title:"スポットにいた魔法使い",type:"personal",characters:["アーサー","リケ"],memo:"リケ",
text:`晶	リケ、アーサー。二人で本を読んでいるんですか？
リケ	はい。『古代英雄譚』にある、既知の遺跡についての項目を調べ直しているんです。
	ですよね。アーサー様。
アーサー	うん。
晶	なるほど……。何か分かりましたか？
リケ	昔、この場所に魔法使いがいたようなんです。
	王位争いに負けた王様の弟君が、飛び去って逃げて行ったという記述があって。
	普通なら、馬を駆って逃げる、と書く所なのに、わざわざ飛び去るという
	言葉を使っているから、魔法使いだった弟君が王朝を追われたのではと。
	そして、弟君が戻って来て、魔法で攻め入られることのないように、
	崩壊星の石を敷き詰めたのではないかと。
	ですよね。アーサー様。
アーサー	うん。
	たぶん、王位争いによる対策だったんだよ。
	魔法使いが忌み嫌われていたわけじゃなくて、ほっとしたな。
晶	（あ……アーサーの様子が少し心配だったけど、意識ははっきりしてるみたいだ……）
リケ	アーサー様。この魔法使いはなぜ、王位を争ったりなどしたのでしょうか？
	魔法使いは人間を助けるべきものです。
	聖なる魔法使いファウスト様のように、奇跡の力で兄王を助ければよかったのに。
アーサー	きっと、なにか、あれな事情があったんだ。誰にでもあれっぽい事情がある。
	だけど私も、争うよりは助けるほうが好きだな。
リケ	私もです！でも、魔法舎の中で、誰かに助けられるなら、僕がいいなと思いませんか？
	ね、アーサー様。
アーサー	うん。
晶	（やっぱりちょっとふわふわしてるな……）
`},
{id:10420,title:"不思議で賑やかな場所",type:"personal",characters:["クロエ"],memo:"リケ",
text:`クロエ	はあ……、驚いた。既知の遺跡って、不思議なところだね……
晶	クロエ、大丈夫ですか？疲れちゃってませんか？
クロエ	ううん、大丈夫だよ！むしろすっごく元気になったみたい。
	デザインのアイデアもたくさん浮かんだんだ！
	ただでさえ賑やかだって言われるのに、４人でお祭りしてるような気分になっちゃった！
晶	ムルの花火、上がりっ放しでしたね。離れたところにいても見えましたよ。
クロエ	綺麗だったよねえ！俺、ムルの花火が好きだなあ！ビーズの刺繍で再現してみようかな！
	ムルは花火を上げながら、歌ったり踊ったりしてたよ。
	くたびれても、シャイロックのシュガーを食べてまた踊ってた！
	シャイロックも見た目はわかりにくかったけど、一緒に楽しんでた気がするな。
	「ちょっと興奮してきました」って言ってたし！
	ラスティカも全然平気そうな顔しながら、俺とムルとシャイロックを５分ごとに花嫁と間違えちゃうんだ。
	何度も小鳥にされちゃった！
	俺はね、賢者様、ずっと喋ってた！
	話すのも、話を聞くのも、尋ねるのも、相槌も、笑うのも、怒るのも、楽しくて楽しくて！
	ずっと喋ってると声が枯れてきちゃったからラスティカが心配してシュガーをくれるんだ。
	それでまたずっと喋れるようになるんだよ。
	あんまり喋り続けるから、花嫁じゃないけどまた鳥籠にしまわれちゃった。
	でも俺、鳥になってもずっと喋っててさ！おかしいよね？
	それでみんなもずっと笑ってて、とうとうシャイロックが……
	あれ……？もしかして俺、また喋りすぎてた？
晶	いいえ、大丈夫ですよ、クロエ。でも、少し休憩しましょうか。
	退屈だったら、にらめっこを教えますね。
クロエ	にらめっこ？なにそれ、面白い名前！賢者様の教えてくれる遊びっていつも斬新だよ。
	俺もいつか賢者様の世界に行ってみたいな……！
`},
{id:10421,title:"危険な場所",type:"personal",characters:["カイン"],memo:"リケ",
text:`晶	カイン。こんなところにひとりで、どうしたんですか？
カイン	晶か。
	東の魔法使いたちを連れて来たんだけど、少し席を外してくれないかって言われてさ。
晶	東の魔法使いがそんなことを……？崩壊星の石の影響なんでしょうか？
カイン	たぶんな。
	ヒースとシノはけっこうやられてたが、ファウストもネロもいるから大丈夫だろう。
晶	そうですね、２人がいるなら……でも、少し心配です。
	調子を悪くしたりしてませんでしたか？
カイン	調子は良くなってたんじゃないか？ファウストなんか、ずっと笑ってるんだ。
	あいつ、あんな顔して笑うんだな。
晶	えっ、ファウストが？
カイン	ああ。なんか、なんでもツボに入っちまうらしくて。
晶	あ……、ちょっと思った感じと違いますね……他の３人はどうでしたか？
カイン	ネロはゴロゴロしてたよ。東の魔法使いが人前でくつろぐのは珍しいよな。
	シノはずっとヒースを煽ってるんだ。
	おまえはもっと出来るはずだ、かかってこいよ、どうしたどうした、みたいな。
	ファウストにも食ってかかってたな。
	筆記の授業は退屈だから、おまえを倒して、オレが先生になってヒースを訓練する、って。
晶	シノが先生だと、昔の漫画の鬼コーチみたいになりそうですね……。
	ヒースはどうでしたか？
カイン	喋りすぎたシノに、「黙れ」って言ってた。
	で、すぐに我に返って慌てて恐縮して謝ってた。
	それを見て、シノはかなり盛り上がってた。そんな感じの繰り返しだ。
	東の魔法使い同士、気を許しあってる感じだったよ。心配ないと思うぜ。
`},
{id:10422,title:"紹介キャンペーン？",type:"personal",characters:["リケ","ネロ"],memo:"リケ",
text:`リケ	賢者様。こちら、ネロです。
ネロ・晶	ど、どうも……
晶	どうしたんですか？２人とも。
リケ	既知の遺跡に来るとみんなぼんやりするので、僕の相手をしてくれやすいって気づいたんです。
	それで、ネロに僕の友達を紹介して回っているんです。
晶	リケには崩壊星の石の影響が出ないですもんね……
	ネロもたしかに、少しぼんやりしてるかも……
リケ	では、ネロ、アーサー様とカインと賢者様を紹介したので、次はオズを紹介しますね。
ネロ	ああ……あ……？
	オズ！？
	オズのところにも行く気なのか？
リケ	僕の先生なんです。
ネロ	いや、知ってるよ。
	っていうか、俺の飯食ってるよ。
晶	どうして今更、みんなを紹介しているんですか？
リケ	この間、中央の市場に行ったら、
	友達を紹介するとお菓子をおまけしてくれるお店を見つけたんです。
	ネロもおやつを作るでしょう？
	だから……。
ネロ	……そういうことだったのか。
	長い前振りだな、おい……。
リケ	とにかく、オズのところに行きましょう。
	ネロ！こっちですよ！
ネロ	一気に正気に返ったぜ……
	素面で魔王に会いたくねえ……。
	崩壊星の石の効果、今出ろー、出ろ、出ろ……
`},
{id:10423,title:"スポットでの名物",type:"personal",characters:["④"],memo:"リケ",
text:`晶	リケ。床にしゃがみこんで何をしてるんですか？
リケ	賢者様。
	祝福の玉の原石を持って帰りたいのですが、ご許可いただけないでしょうか？
晶	崩壊星の石をですか？
リケ	僕には悪い効果はありませんでした。
	むしろ、気分がすっきりして頭が冴えるように思います。
	教団でも、祝福の玉を寝室や儀式の場に置いていたので、馴染み深いのです。
晶	うーん……。リケは大丈夫でも、他の人に影響があるかもしれないし、オズはなんて言いますかね……。
リケ	賢者様が魔法舎で一番偉いのでしょう？オズだって賢者様に従います。
	賢者様が決めてください。
晶	ど、どうしようかな……。
~~~~~~~~~	~~~~~~~~~
選択	許可する。
晶	じゃあ、普段は部屋から出さずに、
	誰かを部屋に呼ぶ時は、石を近付けないように気をつけてくださいね。
リケ	わかりました！ありがとうございます、賢者様！
	安心してください。
	ちゃんと面倒を見ますし、大事にして、お世話もかさないようにしますから。
晶	（ペットみたいな思い入れだ……。故郷を感じられるものを何も持ってこれずに、
	　本当は寂しかったのかもしれないな……）
~~~~~~~~~	~~~~~~~~~
選択	許可しない。
晶	やっぱり、魔法舎に持ち込むのはちょっと危ない気がします。
	たまに見に来るのじゃダメですか？
リケ	そうですか。残念ですが、賢者様がおっしゃるなら仕方がありません……。
	では、この石以外で気分転換できそうなものを教えていただけませんか？
晶	うーん……。
	ヒトカラですかね？ひとりで思い切り好きな歌を歌うことなんですけど……。
リケ	なるほど、ヒトカラ！賢者様はヒトカラで、気分がスッキリできるのですね！
	僕はあまり歌を知らないんです。
	魔法舎に戻ったら、ヒトカラのための歌をミチルとルチルに教わろうと思います。
`},
{id:10424,title:"スポットでの発見",type:"personal",characters:["オズ"],memo:"リケ",
text:`オズ	晶？
晶	オズ？どうかしましたか？
オズ	弱いものだが、近くにマナの気配がある。この辺り一帯に散らばっているようだ。
	力の弱い魔法使いや魔法生物が墜落して、そのままになったのだろう。
晶	そうか、魔法使いが墜ちる場所ですものね……。
	マナ石を求めて来た魔法使いが、既知の遺跡へうっかり近づいたりしないでしょうか？
オズ	ここにあるマナ石に大した魔力はない。質の悪い石を大量に食べても無意味だ。
~~~~~~~~~	~~~~~~~~~
選択	マナ石を食べるって本当ですか？
オズ	ああ。だが……。
	昔、世界を征服しようとした時、名のある魔法使いの石のほとんどを、私が手に入れ、口にした。
	質の良い石が世界にどれほど残っているかは、不明だ。
~~~~~~~~~	~~~~~~~~~
選択	絶対に食べたいマナ石はありますか？
オズ	仮に、ミスラが石になるようなことがあれば、他の者の手に渡る前に私が食べるだろうが……。
	石を食らうことはここ数年でやめた。考えないようにしている。
~~~~~~~~~	~~~~~~~~~
選択	俺もマナ石を食べられますか？
オズ	おまえには、マナを自分の力に変える能力はない。
	かわりに魔法科学装置を使えば良い。そのためのものなのだろう。
~~~~~~~~~	~~~~~~~~~

オズ	魔法使いだからと、どんなマナも食らうわけではない。
	南の国などは、その慣習も消えつつあるらしい。
	力の弱い魔法使いが、強いマナを食らえば、石の持ち主の魔力を制圧できずに、石に取り込まれることもある。
晶	わかりました……。覚えておきます。
オズ	そうだな。
`},
{id:10425,title:"楽しい場所",type:"personal",characters:["アーサー"],memo:"リケ",
text:`アーサー	賢者様一！見ていてくださいね！
《パルノクタン・ニクスジオ》！
晶	うわ……っ！
短い地響きの直後、目の前で、大木のような水柱が勢いよく湧き上がった。
のけぞるように水流の行く先を追いかけると、上空で爆発するように水が弾ける。
そのまま、土砂降りのように、湧き出した水があたり一面に降り注いだ。
晶	わーっ！！
アーサー	わあ、ほら、見てください！虹がかかりましたよ、賢者様！
	ご覧になりましたか？いかがでしたか？
晶	す、すごいですね……！
	（あれ？どうしたんだろう。何か待つような顔をして……。はっ、もしかして……！）
~~~~~~~~~	~~~~~~~~~
選択	頭を撫でる。
晶	こんな強そうな魔法も使えるなんて驚きました。さすが、オズの弟子ですね！
	なでなで……。
アーサー	えへへ……。ありがとうございます、賢者様！
	この場所は気分が良くて、色々な魔法を使ってみたくなります！
晶	アーサーは、テンションが上がると魔法を使いたくなっちゃうんですね……。
アーサー	そのようですね！
	それで、たくさん頭を撫でて、褒めていただきたい気持ちになります。
晶	（テンション高いアーサー、いつも以上に素直に懐いてきて可愛いな……。
	　子供の頃も、こんな感じだったのかな？）
~~~~~~~~~	~~~~~~~~~
選択	もっと褒める。
晶	こんな強そうな魔法も使えるなんて驚きました。
	さすが、オズの弟子ですね！かっこいいです！魔法の才能がある！頼れる！天才！
アーサー	えへへ……。ありがとうございます、賢者様。
	今ならオズ様のように、嵐を呼び寄せることもできる気がします！
晶	あ、嵐はやめたほうが……。
アーサー	そうですか？では、ミスラに頼んで、魔法の力比べをするのはいかがでしょうか？
	オズ様は、私はミスラには敵わないとおっしゃっていましたが、
	今ならきっと、いい線まで行けると思うのです！
晶	（テンション高いアーサー、はしゃぎ方が完全に北育ちって感じだな……）
`},
{id:10426,title:"マナエリア",type:"personal",characters:["④"],memo:"リケ",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
	「マナエリア」と呼ぶとも聞きました。リケにもマナエリアがありますか？
リケ	ありますよ。
	おそらくは、魔法舎にくる前に、教団で祈りを捧げていた小さな小屋のことです。
晶	おそらくというのは……？
リケ	マナエリアのことは、魔法舎に来て、オズに初めて教わったんです。
	マナエリアとは、精神を安定させ、心を研ぎ澄ます場所のこと。
	僕は教団にいた時、小さな小屋で毎日お祈りをしていました。
	祈りの気持ちは、魔法を使う時と似ています。
	そのことをオズに話したら、おそらくその場所が、僕のマナエリアなのだろうと。
晶	なるほど……。
	心を集中して安定させることに慣れていたから、魔法の上達が早いのかもしれませんね。
リケ	えへへ。オズにもそう言われました。賢者様のマナエリアも見てみたいです。
	見つかったら教えてくださいね。
`},
{id:10427,title:"アミュレット",type:"personal",characters:["④"],memo:"リケ",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	リケもアミュレットを持ってますか？
リケ	はい。
	アーサー様とカインからその話を聞いて、ランタンをアミュレットにしたんです。
リケは、机の上に置いてあるランタンを振り返った。
小さな暖かい灯りが揺れている。
晶	あれは、リケの魔道具のランタンとは、また別のものですね。
リケ	市場で見つけたんです。買い物には、カインがついてきてくれました。
	教団にいた時、倉徒の方々のランタンに魔法で火を灯すのが僕の仕事だったんです。
	それと形が似ているものがいいって、一緒に探してくれました。
晶	そうだったんですね。効果はありそうですか？
リケ	はい。教団で祈りを捧げていた小部屋と、同じ灯りです。
	教団にいた時と同じように、背筋を正してお祈りする時間が取れてホッとしています。
`},
{id:10428,title:"祈りましょう",type:"personal",characters:["リケ","ミチル"],memo:"リケ",
text:`晶	リケ。それにミチルも。こんな朝早くからこんなところで何をしているんですか？
リケ	賢者様、おはようございます。
	ミチルに神の使徒として一日の始まりの朝のお祈りを教えてあげていたんです。
~~~~~~~~~	~~~~~~~~~
選択	二人とも早起きなんですね
リケ	神の使徒として、当たり前のことです。
~~~~~~~~~	~~~~~~~~~
選択	二人は仲良しですね
リケ	はい！だからミチルにも神の使徒としての役目について
	もっと知って欲しかったんです。
~~~~~~~~~	~~~~~~~~~
晶	一日の始まりにどんなことをするか俺も聞いていいですか？
リケ	ええ、もちろんです。
	……まず最初に目を閉じ、深く静かに神への感謝の思いをめぐらせます。
	すると、自然に背筋が伸びていきます。
	お祈りは丁寧な呼吸を心掛けることも大事です。
	ゆっくりと息を吸いこみ、ゆっくりと息を吐く。
	祈りを捧げる前にそうして心を落ち着けて……。
ミチル	け、賢者様、今日のリケはいつもとちょっと雰囲気が違う気がしませんか？
	違う人と話しているみたいで緊張します。
晶	確かに。
	なんだかいつもよりも大人っぽいというか、神々しいというか……。
リケ	さあ、ミチル！もう一度私と共に祈りと感謝を捧げる練習をしましょう。
ミチル	は、はい！ちゃんとお祈りができるように頑張ります！
`},
{id:10429,title:"家族",type:"personal",characters:["④"],memo:"リケ",
text:`晶	リケの部屋は私物が少ないですよね……。
	前にいたところでも、こんな感じだったんですか？
リケ	ええ。
	何かを欲しがることは悪いことだと、司祭様から教わりました。
	だから、前にいた部屋も何もなくて、もっと狭かったです。
	ここは広くて、持て余してしまいますね。
晶	ここより狭いということは、ご両親は一緒じゃなかったんですか？
リケ	僕に両親はいません。
	司祭と、教団の人々と、神様が、僕の親であり、家族です。
晶	…………。
あまりにも真っ直ぐに告げられて、俺はそれ以上、何も言えなくなってしまった。
晶	（魔法使いは親がいないまま生まれたりすることがあるんだろうか？
	　リケの育った教団がどんなところなのか、
	　いつか調べてみた方がいいかもしれないな……）
`},
{id:10430,title:"仲良しだから",type:"personal",characters:["リケ","ミチル"],memo:"リケ",
text:`リケ	賢者様！探していたんです。
晶	リケ、ミチル。何か用事ですか？
リケ	ミチルが中央の国の魔法使いになる方法はありませんか？
	オズも、本当は北の魔法使いなのですよね？
晶	急な質問ですね……！？何か困ることがありましたか？
リケ	困っているわけではありません。
	僕たちは仲良しだから、同じ国の賢者の魔法使いになりたいんです。
	ね。そうですよね、ミチル。
ミチル	ボ、ボクは、兄様やフィガロ先生やレノックスさんとも一緒にいたいし……。
	今のままでも別に……。
リケ	…………！？ひどいです、ミチル！
	魔法の訓練を一緒にしたいねって言ってたじゃないですか！
晶	け、喧嘩しないで……。
	すみませんが、俺の意思では、所属の国を変えたりできないそうなんです。
	一緒に訓練したいのなら、オズとフィガロに頼んで、合同授業をしてもらうのはどうですか？
リケ	なるほど……。そうですね、オズに話してみます。
	さっそく行きましょう、ミチル！
ミチル	オ、オズ様のところにですか？ボク、ちょっと怖いなぁ……。
	いつも怒っているみたいな顔だし……。
リケ	大丈夫、僕がついてますから。
	オズは隣に座って同じことを繰り返していると、けっこう言うことを聞いてくれますよ！
`},
{id:10431,title:"リケの悩み事",type:"personal",characters:["リケ","ルチル"],memo:"リケ",
text:`リケ	最近、ミチルと一緒にいる時に、少し困ることがあるんです。
ルチル	ミチルと？ケンカでもしちゃったの？
リケ	ケンカなんてとんでもない。
	僕はミチルが大好きなんです。ルチルや賢者様のことも大好きですよ。
晶	ありがとうございます。困るって、どんなことですか？
リケ	二人で遊んでいる時に、ミチルがあんまりにも、兄様が、兄様がと言っていると……。
	今一緒にいるのは僕なのに……。
	と、もやもやした気持ちが湧いてくるのです。
晶	（……。それって……）
ルチル	リケ。それはヤキモチです。
晶	……す、ストレートですね、ルチル。
リケ	ヤキモチ？
ルチル	そう！ミチルが好きだから、ミチルを独占したいんだね。
リケ	独占……？この気持ちが……？
	……僕はこのまま、堕落してしまうのでしょうか……？
ルチル	ずっとヤキモチしていたらそうかもだけど、リケは私のことも好きでしょう？
	なら、大丈夫！
リケ	良かった……！ほっとしました！
晶	（少し驚いたけど、リケの情緒が育ってきてるみたいだ。
	　ヤキモチ妬くのも、場合によっては良いことなのかもしれないな……）
`},
{id:10432,title:"アーサー流の遊び方",type:"personal",characters:["④"],memo:"リケ",
text:`リケ	賢者様！お水を貰いにきたんです。
晶	お水ですね、どうぞ。中央のみなさんと遊んでいたんですか？
リケ	はい！アーサー様と、カインと三人で、風乗りをしているんですよ。
晶	風乗り？
リケ	アーサー様がお考えになった遊びです。
	魔法で強い風を起こして、箒でその風に乗るんです！
	遠くまで吹き飛ばされたり、森の木に突っ込んでしまったりして、すごく楽しいんですよ！
晶	ちょっと過激ですね……。
	わんぱくなのは良いですけど、怪我には気をつけてくださいね。
リケ	大丈夫ですよ！危ないときは魔法で止まれますから。
	アーサー様の考える遊びはワクワクします！
	アーサー様は王族なのに、私にも気さくに接してくださって、とても良いかたですよね。
	カインも、自分でやってみろ、って、なんでも一度は私にやらせてくれるので、一緒にいると楽しいです。
	僕が大きな風を起こせるようになったら、賢者様を乗せて差し上げますね！
晶	（年相応にはしゃいでいて可愛い……。
	　俺には少し怖そうな遊びだけど、中央のみんなは相性がいいみたいだ）
`},
{id:10433,title:"迷子にならないように",type:"personal",characters:["④"],memo:"リケ",
text:`晶	（あそこにいるのは、リケ？なんだか困っているみたい……）
	リケ、どうしたんですか？
リケ	あ、賢者様！
	実は魔法舎にはいろんな部屋があるので探検をしていたんです！
	だけど、探検しているうちに広くて……。
	その……。
晶	（もしかして、迷っちゃったのかな。
	　俺も最初は部屋の場所を覚えるのに苦労したしな……）
	探検だなんてカッコいいですね、リケ。
リケ	……でも……。
晶	それじゃあ今度は俺も一緒に探検してもいいですか？
不安そうだったリケの表情が一転して蕾が花開くかのように笑顔になる。
リケ	はい！あ、賢者様。迷子にならないように、僕が手を繋いであげますね。
`},
{id:10434,title:"得意な魔法",type:"personal",characters:["④"],memo:"リケ",
text:`晶	リケ。ここにいたんですね。魔法の練習、うまく行ってますか？
リケ	賢者様……。
	……練習は順調なのですが……。
晶	何か心配なことがありましたか？
リケ	……今日の座学の授業で、
	強い力に魅入られすぎないようにと、オズから言われたんです。
	今まで抑圧されていたぶん、力の解放に陶酔しやすいんじゃないかって……。
晶	オズが……？
リケ	司祭様の元にいた時は、強い魔法を使うことを禁じられていました。
	ですから、魔法舎で学びながら、私の魔法にこんな力があったんだと、
	とても嬉しくなることはあったんですけど……。
晶	（たしかにリケは、
	　子供が無邪気にハサミを振り回すような危うさがたまにあるかもな……）
	オズの言うことは一理あるかもしれません。
	でも、成長の喜びを感じること自体が悪いとは思わないですよ。
リケ	そうですか……？
晶	はい。誰だってそうだと思います。
	オズに言われたことに気をつけながら、これからも頑張ってくださいね。
リケ	ありがとうございます、
	賢者様。もう少し、自分でも考えて、間違ったりしないように頑張りますね！
`},
{id:10435,title:"魔法のおかげ？",type:"personal",characters:["④"],memo:"リケ",
text:`リケ	賢者様！
	今、新しい魔法の練習をしているんです！よかったら見てくださいませんか？
晶	ぜひお願いします！ところで、新しい魔法って――――。
~~~~~~~~~	~~~~~~~~~
選択	もしかして攻撃魔法ですか？
リケ	ハズレです！
	でも、新しい攻撃魔法は次の授業で教えてくれるとオズが言っていました。
	今からとっても楽しみなんです！
~~~~~~~~~	~~~~~~~~~
選択	もしかして治癒魔法ですか？
リケ	すごい！どうしてわかったんですか？
	この魔法を使ったら、きっと賢者様も驚くと思います。
~~~~~~~~~	~~~~~~~~~

リケ	では、いきますね。
	《サンレティア・エディフ》
	どうですか、賢者様。この魔法を使えば小さな怪我ならすぐに治るんですよ！
晶	（うーん、怪我をしていないからか、魔法を使ってもらった実感がない……。
	　なんて感想を伝えれば……）
リケ	どうしたんですか？……もしかして、僕、失敗してしまいましたか？
晶	し、失敗なんてとんでもない！
	リケの魔法のおかげで、なんだかとっても元気になった気がします！
リケ	わあ、本当ですか！ミチルに使った時は怪我をしてないから、
	よくわからないですって言われてしまって……。
晶	えっ……。
リケ	でも、賢者様も怪我をしていないのに、効果を感じてくださったということは、
	あの時は失敗していただけだったんですね。
	僕、ミチルにもう一度魔法をかけてきます。
	ちゃんと成功しているところを見せてあげないと！
晶	リケ、ちょっと待ってください……！俺に弁解のチャンスを……！
`},
{id:10436,title:"紋章",type:"personal",characters:["④"],memo:"リケ",
text:`晶	リケの賢者の紋章は、額に出たんですね。
リケ	そうです……。
	すぐにでも消して帰りたかったのですが、
	役目が終わるまでは、オズの魔法でも、この紋章は無くならないと言われて。
	最近は慣れてきましたが、
	朝、顔を洗う時に鏡を見ると、自分でもびっくりしてしまいます。
晶	たしかに、目立つ場所にあると、ちょっと気になるかもしれませんね……。
リケ	そうなんです。でも、ミチルは、僕の紋章のこと、いいなって言うんですよ。
	ミチルは賢者の魔法使いに選ばれて、嬉しいみたいです。
	ミチルに羨ましがられたり、役目に張り切ってるのを見ると、
	少しだけ、紋章が現れてよかったなって思えるんです。
`},
{id:10437,title:"シャボン玉飛んだ",type:"personal",characters:["④"],memo:"リケ",
text:`リケ	賢者様、その手に持っている液体はなんですか？
晶	見ててくださいね、リケ。
	……ふー！
リケ	わっ、賢者様すごい！それは魔法ですか！？
晶	これはシャボン玉と言って俺の世界にあった遊びなんです。
	（シャボン液なんて久しぶりに作ったけど、上手くできたみたいでよかった……）
リケ	賢者様！もう一回見せてください！
晶	はい！いきますよ。
	……ふー！
リケ	わー！とても綺麗です！まるで虹を閉じ込めたみたい！
	あ、でもすぐに消えちゃいました……。
晶	触ったり、時間が経つと消えちゃうんです。
	よかったらリケもやってみてください。
リケ	いいんですか？ありがとうございます、賢者様！
`},
{id:10438,title:"自由の中で",type:"personal",characters:["④"],memo:"リケ",
text:`晶	リケ。そろそろお祈りは終わりましたか？
	みんなでおやつにしようって言ってるんですが……。
リケ	おやつですか？
	……わかりました。すぐに参ります。
晶	（うやうやしくしてるけど、切り上げた気配だ……）
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
リケ	時間が空いたら、今のように神に祈りを捧げています。
	それから、文字の練習をしたり……。
	それが終わると、することがなくなってしまうから、
	誰かに会いに、談話室や食堂へ行きます。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
リケ	ミチルやルチルとは、よく部屋を行き来して遊びますよ。
	カインやクロエやヒースクリフも。
	ネロは忙しそうだから、会いたい時はキッチンに行くんです。
	彼も、呼んだら来てくれるでしょうか？
~~~~~~~~~	~~~~~~~~~
選択	一日のタイムスケジュールは？
リケ	起きたらまず部屋のお掃除をして、お祈りをします。
	それが済んだら、食堂で朝食の手伝いをして食事をします。
	お昼は日によって色々で、夜はまたお掃除して、お祈りをしてから寝ています。
~~~~~~~~~	~~~~~~~~~
リケ	魔法舎での暮らしは、一日の予定がきちんと決まっていなくて、
	少し困ることがあります。
晶	リケは早寝早起きで、きちんとしてると思いますけど……。
	教団にいた頃は、今よりもっと規則正しい生活だったんですか？
リケ	お祈りも、食事も、毎日の仕事も、全部決まっていました。
	自由にしていいよ、と言われても、自分のしたいことばかりしていたら、
	いつか堕落してしまわないか心配です。
	己を律しながら生活するのは、とても難しいことなのですね……
`},
{id:10439,title:"ネロのご褒美",type:"personal",characters:["リケ","ネロ"],memo:"リケ",
text:`リケ	賢者様！聞いてください！
	僕、今日の訓練で今までできなかった魔法が使えるようになったんです！
晶	すごいですね、リケ。
	リケは頑張り屋さんなのできっと、たくさん練習したんですね。
リケ	はい！
	今、ご褒美にネロにお菓子を作ってもらってるんです！
ネロ	魔法が使えるようになったらスイートポテトを作って欲しいってお願いされてたんだ。
リケ	明日からの訓練ではオズが新しい魔法を教えてくれるって！
	それが上手く出来るようになったら次はオムレツを作って欲しいです！
ネロ	はいよ。
	ほら、火を使うから危ないぞ。少し下がってな。
リケ	わーい！ありがとうございます、ネロ！
	その次に新しい魔法が使えるようになった時は……うーん。何にしようかな。
ネロ	ははっ、気が早いな。
	リケエストはいつでも聞いてやるからこれからも訓練頑張れよ。
リケ	はい！
晶	（ネロのご褒美も、リケの魔法の上達に一役買っているみたいだ）
`},
{id:10440,title:"フィガロの優しさ",type:"personal",characters:["リケ","フィガロ"],memo:"リケ",
text:`フィガロ	ふわぁあ……。おや、おはよう。賢者様、リケ。
晶	おはようございます、フィガロ。
リケ	まさか……今起きて来たのですか？もうすぐお昼ですよ。
フィガロ	いいじゃない。今日はお休みだよ。
リケ	いけません。生活の規律が乱れれば、いずれ心も穢れていきます。
	フィガロは少し怠惰なところがありますね。
	欲望や楽に身を任せていては、魔法使いとして人々を導くことができませんよ。
	人々の見本になるように生活しなくては。それでは賢者様。
	僕はお祈りがあるので失礼します。
晶	は、はい……。昼食になったら呼びにいきますね。
フィガロ	なんだか、リケは危なっかしいねえ。
晶	……フィガロもそう思いますか？
フィガロ	人間に尽くして、導こうとして、最後まで貫くことができた魔法使いを見たことがないんだよね。
	リケの信じ込む正しさを、俺たちが破壊するのは簡単だけど、彼にとっては大切なことだろうしさ。
晶	そうですね……。
	俺もなんて声をかけたらいいのか、いつもわからなくて……。
フィガロ	今は、いざという時に傷付きすぎないよう、見守ってあげるのが一番かもね。
	俺も気をつけて様子を見るようにしてみるよ。
`},
{id:10441,title:"心清らかに",type:"personal",characters:["④"],memo:"リケ",
text:`晶	（あ、窓から葉っぱが入り込んでる。外に戻しておいたほうがいいな）
リケ	賢者様！
晶	どうしたんですか、リケ。
リケ	魔法使いの誰かに頼むのではなく
	ご自身で魔法舎のお掃除をするなんてさすが賢者様です！
晶	……え？
リケ	僕もお掃除をしていると自分の心が清らかになった感じがします。
	綺麗にするのはとても大切なことですよね。
	ぜひ僕にもお手伝いさせてください。一緒に魔法舎を綺麗にしましょう。
	賢者様、次はどこをお掃除しますか？
晶	そ、そうですね！どこにしようかな……。
	（たまたま見つけたから拾っただけだなんて言えない……）
`},
{id:10442,title:"お気に入りの絵本",type:"personal",characters:["④"],memo:"リケ",
text:`晶	この世界にも絵本があるんですね。有名な童話とかもあったりするんでしょうか？
リケ	子供の魔法使いが病気の母親のために
	北の国でしか手に入らない薬草を求めに旅に出る話とか……。
	あと、人間に優しくされた魔法使いが恩返しに行く物語なんかも有名だって、ミチルが言っていました。
晶	（なんだか、俺の世界の童話と少し似てるんだな……）
リケ	賢者様、これ僕のお気に入りの絵本なんです。よかったら、読んでみてください。
晶	ありがとうございます、リケ。
	ただ俺はまだこの世界の文字が読めなくて……。
リケ	そうなんですか？なら、僕が賢者様に絵本を読んであげます！
	ルチルに教えてもらって前より読めるようになったんですよ。
晶	すごいですね、リケ。それじゃあ、お願いしてもいいですか？
リケ	はい！
	むかし、むかし……えっと……。ちいさな、こどもの……。
`},
{id:10443,title:"お祭りへ行こう",type:"personal",characters:["中央"],memo:"リケ",
text:`リケ	賢者様、こんにちは！
	今度、中央の都でお祭りというものがあるみたいなんです。ご存知でしたか？
晶	いえ、今知りました！それは楽しそうですね。
~~~~~~~~~	~~~~~~~~~
選択	どんなお祭りなんですか？
カイン	人々の勤労を讃える祭りだ。
	屋台ではアーサー様をモチーフにしたクッキーも売ってるんだぜ。
晶	あ、アーサーを……。
~~~~~~~~~	~~~~~~~~~
選択	リケはお祭りが好きですか？
リケ	僕はお祭りに行ったことがないので、よくわかりません。
	みんなの話を聞く限り、誘惑が多そうな場所だと思いますが……。
~~~~~~~~~	~~~~~~~~~
リケ	お祭り……。
カイン	あはは、祭りが気になって仕方ないって顔だな。
アーサー	機会があれば、皆で行こう。オズ様も良いですよね？
オズ	……ああ。ただし、人ごみに飲まれないように注意しろ。
リケ	わあ、ありがとうございます！その時は賢者様も一緒に行きましょう！
晶	俺もいいんですか？
アーサー	もちろんです。
	よろしければ、リケが迷子にならないよう、手を繋いであげて下さい。
晶	（みんながリケのことを可愛がっているのが伝わってくるな）
`},
//北
//スノウ
{id:10501,title:"スポットの印象（１）",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	ミスラも氷の森は気に入ってるんですか？前にも来たって言ってましたよね。
ミスラ	何度か訪れた程度ですよ。ここは昔から、双子の土地ですから。
	まあ、嫌いじゃないです。静かで。
晶	賑やかな場所は苦手ですか？
ミスラ	ずっと水辺で過ごしてました。そこは、がやがやしてなかったんですよね。
	人が多い所はうるさいなと思います。
	テーブルの上に物がたくさん置いてあると、ガーッと、腕で払い除けたくなるでしょう。
	ああいう気持ちになりませんか。
晶	ミスラとは静かなところで過ごしたいです……。
	なら、この森には住むのに良さそうですね。
ミスラ	住むには退屈だから、どうかな……。
	でも、嫌いじゃないですよ。景色も、森の気配も。
	気に入った場所なら、疲れるまで歩き回ってもいいかなって気になりますね。
`},
{id:10502,title:"スポットの印象（２）",type:"personal",characters:["ムル"],memo:"スノウ",
text:`晶	あれ、こんな雪の中に穴が空いてる。深くて真っ暗だ……。落ちたら危なそうだな。
ムル	……賢者様ー……。
晶	……え？穴からムルの声が……！？だ、大丈夫ですか、ムル！
ムル	……助けて……賢者様……。
晶	た、助けてって……、落っこちたんですか！？ムル……、ムル！！
	魔法で上がってこれないなんて、まさか怪我したんじゃ……！
	俺じゃどうにもできないし……。
~~~~~~~~~	~~~~~~~~~
選択	シャイロックを呼んで来ますね！
晶	シャイロックを呼んで来ますね！
ムル	なんでシャイロックを？
晶	え！？よく一緒にいて、仲が良さそうだから……。
ムル	なるほど、賢者様にはそう見えるんだね。
	シャイロックが聞いたらどんな顔すると思う？
	穴に落ちた間抜けを素直に助けてくれると思う？
質問を重ねながら、ムルがふわりと穴から姿を現した。
~~~~~~~~~	~~~~~~~~~
選択	スノウを呼んで来ますね！
晶	スノウを呼んで来ますね！
ムル	なんでスノウ？埋められちゃうかも！
晶	え！？スノウは優しいから大丈夫ですよ！
ムル	賢者様は双子の本性を知らないから。
笑いながら、ムルがふわりと穴から姿を現した。
~~~~~~~~~	~~~~~~~~~
選択	オーエンを呼んで来ますね！
晶	オーエンを呼んで来ますね！
ムル	なんで？
晶	うわっ！自分で出られるんじゃないですか！？
ムル	なんでオーエンの名前が出て来たのか、そっちが気になって出て来ちゃった！
~~~~~~~~~	~~~~~~~~~
ムル	この土地は鉱脈があって面白いんだ。
	前に来たのは何百年か前だから、地質が変化してるかもって思って調べてた！
	でも、賢者様をからかったら、賢者様の方が面白そうだった！
晶	冗談だったんですね……。びっくりした……。
`},
{id:10503,title:"スポットの印象（３）",type:"personal",characters:["アーサー"],memo:"スノウ",
text:`アーサー	賢者様、寒くありませんか？
晶	ありがとうございます、アーサー。魔法の力のおかげで、大丈夫です。
アーサー	よかった。
晶	アーサーも、この森に来たことがあるんですか？
アーサー	ええ。スノウ様とホワイト様が招待してくださって、何度かオズ様と一緒に訪れたことがあります。
	この森はオズ様の城の周りの風景にも似ていて、初めて来た時から大好きで、少しだけ怖い場所でもありました。
晶	怖い場所？
アーサー	はい。うっすらとした記憶しかありませんが、幼い頃、捨てられて死にかけた景色に、どことなく似ている気がするのです。
	この森のように、辺り一面の銀世界で、木の枝に雪の葉が茂っていて、垣間見える空が美しくて。
晶	…………。
アーサー	オズ様は、私を拾ったのはここではないと言っていましたから、ただの記憶違いなのでしょう。
	それに……、恐ろしいですが、同時にオズ様と初めて出会えた景色です。
	あの記憶に似ているこの森は、やはり、大好きで、少しだけ怖い場所ですね。
`},
{id:10504,title:"ブレイクタイム（１）",type:"personal",characters:["スノウ","ホワイト"],memo:"スノウ",
text:`スノウ	どれ、仕事も終わったし、少しこの辺りを案内をしてしんぜよう。
晶	わっ……。
大人スノウ	エスコートにはこの袋が良いじゃろう。さあ、賢者。手を。
晶	あ、ありがとうございます。
	（何度見てもイケメンだ……。子供のスノウとホワイトも、人形みたいだものな……）
大人スノウ	ほほほ。毎度新鮮に驚いて、おぬしは本当に可愛らしいのう。
ホワイト	これ。スノウよ。
	抜け駆けとは卑怯じゃな。
大人スノウ	おや、ホワイト。
ホワイト	賢者よ、我もエスコートじゃ。反対側の手は我が取ろう。
晶	は、はい。
	（大きいスノウと小さいホワイトに挟まれて、レアだ……）
大人スノウ	喜んでおる。
ホワイト	喜んでおるな。
大人スノウ	我らと、我らの森を、ゆっくり堪能して帰るがよい。
`},
{id:10505,title:"ブレイクタイム（２）",type:"personal",characters:["オーエン"],memo:"スノウ",
text:`オーエン	…………。
晶	あれ、オーエン！？どうしたんですか、こんなところで倒れて……。
	……え？　息してない……。し、死んでる……！？
	ちょ……、オーエン、オーエン！！しっかりしてください！
	……オーエン！う……ううっ……。
オーエン	…………。
晶	オーエン！！よ、よかった、死んだのかと思いました……。
オーエン	死んでた。
晶	ど、どうしてこんなところで……。誰がこんなことしたんですか？
オーエン	言ったらそいつのこと殺してくれるの？
晶	できないですけど……。
オーエン	じゃあ言いたくない。
晶	…………。
	北の魔法使いって、なんだかんだ、勝ち負け気にするところ可愛いですよね……。
オーエン	負けてもいいやなんて、思いながら生きてる意味なくない？
晶	そういう考え方なんだ……。
オーエン	肩貸して。じっとしてて。しばらくしたら治るから。
晶	は、はい。どうぞ……。
オーエン	はぁ……。痛い……。はあ……。むかつく……。
`},
{id:10506,title:"スポットの思い出(１)",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	この森には、ホワイトと共に、よう遊びにきておった。懐かしいのう。
晶	二人はどんな遊びをするんですか？
スノウ	我ら暇じゃったからの。だいたいの遊びはやり尽くしたのう。
	いつぞやの賢者に波乗りというのを教わって、小さな雪崩を起こして乗ってみたりじゃとか。
晶	結構ハードな感じなんですね。
	スノウ	ハートフルなのもあるぞ。迷い人などを助けたりじゃとか。
	旅人なんぞにちょっと幻術を見せてやると、すぐ山道から外れるからのう。
	我ら可愛らしい見た目をしておるから、死にかけた者の前にふたりで出て行くと、迎えが来たのじゃと思って泣き出す者が多い。
	そういう者を愛でてみたりの。
晶	限界状態の人にひどい悪戯をしないであげてください……！
スノウ	大丈夫じゃ。ちゃんと家に帰してやっておる。
晶	（見た目に騙されやすいけど、この二人も、
	　度を越した悪戯好きなところがあるから、気をつけないと…………）
スノウ	ほほほ。
`},
{id:10507,title:"スポットの思い出（２）",type:"personal",characters:["ホワイト"],memo:"スノウ",
text:`晶	この森にはよく来ていたんですよね。何か、思い出とかありますか？
ホワイト	思い出も何も……。
	ここは、我が死んだ森じゃ。言うなれば、思い出が終わった場所じゃな。
晶	…………。
そういうと、ホワイトは雪の上に無造作に寝転がった。
ホワイト	ここにこういう感じで倒れて、息を引き取ったのじゃ。
	スノウはちょうど、おぬしが立っておる辺りに居たかのう。
晶	……本当の話ですか？それともいつもの冗談ですか？
ホワイト	全然マジ。マジのやつ。
	ふむ……。賢者よ、ちょっとスノウを呼んできてくれんかの。
	あやつの反応が見たいんじゃ。
晶	俺だって反応に困るんですけど……。
ホワイト	おぬしが悪く思うことなど何もない。
	スノウはきっと、気まずい顔をするんじゃろうがの。
	しろしろ。いい気味じゃ。
晶	ホ、ホワイト……。
`},
{id:10508,title:"スポットの思い出（３）",type:"personal",characters:["フィガロ"],memo:"スノウ",
text:`フィガロ	綺麗だね。あー、北の国に帰ってきたなあ！って感じの景色だな。
晶	やっぱり、北の国が懐かしいんですね。
	フィガロやオズも、氷の森にはよく来たんですか？
フィガロ	よく来たっていうか、双子に魔法を教わっていた頃は、
	こっちの方で暮らしてたんだよ。
	氷の森には修行しに来てたから、懐かしいっちゃ懐かしいけど……。
	千年以上も前だから景色は変わってるし、まあ、雰囲気が、って感じだね。
晶	（気が遠くなりそうな話だな……）
フィガロ	実は、この辺一帯は一度、オズが魔法の修行中に、ほとんど燃やしちゃったことがあるんだよね。
晶	え！？事故でですか？
フィガロ	そうそう。昔からオズの魔力は尋常じゃなかったけど、
	当時は加減がうまくいかないことがあってさ。
	この話をオズに振ると、気まずいのか何なのか、モジモジして面白いんだ。
	今度、賢者様も聞いてごらん。
晶	失敗談の規模がでかいです……。
	今までの俺のやらかしが、何でもないように思えて来ました。
フィガロ	あはは。失敗なんて、何でもないものだよ。
	この森だって、今じゃ元どおりなんだから。
	オズの魔力も凄いけど、自然の力も凄いだろう。
	だいたいのことは、長い時間が解決するものだ。心配いらないよ、賢者様。
`},
{id:10509,title:"スノウへの印象（１）",type:"personal",characters:["ホワイト"],memo:"スノウ",
text:`ホワイト	スノウの印象か？おぬしはなかなか難しいことを聞くのう。
晶	難しいですか？
ホワイト	スノウを褒めると、自分を褒めるようになってしまって、何を話せばいいのかわからぬ。
	我らはほとんど、互いの分身のようなものじゃからの。
晶	そういう感じなんですね……。
ホワイト	そうじゃな。
~~~~~~~~~	~~~~~~~~~
選択	どんなときのスノウが一番好きですか？
晶	どんなときのスノウが一番好きですか？
スノウ	そうじゃな。スノウも同じじゃろうが、眠っておる時のスノウが一番好きじゃ。
	我ら、眠る時も目覚める時も、同じようなタイミングじゃからの。
	眠っているスノウを見るのは、貴重じゃ。あやつもそれを分かっておる。
	たとえ目覚めても、短い間、寝たふりをする。お互いさまの話じゃよ。
~~~~~~~~~	~~~~~~~~~
選択	苦手なところはありますか？
晶	苦手なところはありますか？
ホワイト	そうじゃのう……。…………。
	スノウが居らぬと、我がここに居られぬことじゃ。
	今は、あやつが我の魂をつなぎとめておる。
	あやつと離れたい訳ではないが、選んで共に居るのとは、また違うものじゃのう。
	昔は、そうではなかったからのう。
~~~~~~~~~	~~~~~~~~~
選択	一緒にいて楽しいことはなんですか？
晶	一緒にいて楽しいことはなんですか？
ホワイト	新しく、面白い遊びを思いついたときかのう。
	じゃが、ずっと二人だけでいると、我らにしか理解できない遊びや、冗談が増えてしまうんじゃ。
	したがって、本当に面白いのかは分からぬ。
晶	（究極の内輪ウケみたいな感じだな……）
`},
{id:10510,title:"スノウへの印象（２）",type:"personal",characters:["ミスラ"],memo:"スノウ",
text:`ミスラ	スノウの印象、ですか？
晶	はい。不思議な距離感なので、ミスラはスノウをどう思っているのかなって。
ミスラ	……難しいですね。印象がないわけじゃないんですけど。
	あの双子は敵でも味方でもない気がして。そういう人をなんて言えばいいですか。
晶	ミスラはまず、敵か味方で判断するんですね……。
ミスラ	ええ。
	双子は別に嫌いでもないですけど、俺に何かしてくれるわけでもないですし。
	あなたが双子を分けて尋ねるのは不思議です。あれは、二人でひとつのもの。
	ひとりの魔法使いと同じだ。
	まあ、どちらがどちらというのは、たまに間違えますかね。
晶	それは普通だと思います……！
ミスラ	今はまだ覚えやすいです。……ああ、思い付きましたよ。スノウの印象。
晶	なんですか？
ミスラ	生きてる方だな、と思っています。
`},
{id:10511,title:"スノウへの印象（３）",type:"personal",characters:["オーエン"],memo:"スノウ",
text:`晶	オーエンから見た、スノウの印象ってどうですか？
オーエン	あんまり会いたくないやつ。
	双子が僕のところに来るのは、叱りに来る時だけだから。
晶	そうなんですね……。
オーエン	他に用事ないでしょう。
	面倒臭いし、あーやだやだ、って感じ。
	何か楽しんでたのにケチがついて、急に退屈になる。
晶	なんだか、学校サボってるのが見つかったヤンキーみたいですね……。
オーエン	何？　ヤンキーって。強いの？
晶	よく知らないですけど、強い人もいると思います。
オーエン	ふうん。じゃあいいかな、ヤンキーで。
晶	（いいんだ……）
オーエン	今はホワイトが死んでるから、戦えば勝てるかもしれないって思うけど。
	双子はオズが大事にしてるでしょ。
	結局あの男が出てくると思うと、ケンカを売るのは馬鹿らしいね。
`},
{id:10512,title:"スノウへの印象（４）",type:"personal",characters:["ブラッドリー"],memo:"スノウ",
text:`晶	ブラッドリーから見た、スノウの印象ってどうですか？
ブラッドリー	あの双子は目の上のたんこぶみたいなもんだ。
	捕まって、牢に入れられる前から、何かにつけあいつらが出てきやがったからな。
	俺以外の奴らも、悪さがすぎると、スッと出てきてぶちのめされてた。
	思い出しても腹が立つぜ。
晶	そうだったんですか……。
	（北の国は強い魔法使いが多いらしいけど、度が過ぎないように、
	　スノウとホワイトがやんわり取り締まってくれてるのかな……）
ブラッドリー	まあ、ホワイトが死んだ時は、流石にちょっと驚いたな。
	落ち込んでるのかと思って、様子見に行ったら、死んだはずの双子が揃ってるからよ。
	正直、引いた。
晶	それは……。そうでしょうね……。
ブラッドリー	年甲斐もなく痴話喧嘩して、殺し合ったって知ってると……。
	どの面下げて仲良くしてんだと思って、ゾッとするよな。
	俺が昔、相棒と別れた時は、サラッとしたもんだったぜ。
`},
{id:10513,title:"スノウへの印象（５）",type:"personal",characters:["オズ"],memo:"スノウ",
text:`晶	オズは、スノウとは長い付き合いだって聞きました。
	昔からずっと変わらない感じですか？
オズ	ああ。スノウも、ホワイトも、出会ったときから賑やかで世話焼きだ。
	長い時を生きながら、時代に合わせ、時代に溶け込むのが上手い。
晶	時代に合わせる……。なるほど、それはわかる気がします。
	俺も、初めからとても親しみやすかったし。
	オズは少し……、苦手そうに見えるかもしれません。
オズ	私にとって、時代は季節のようなものだ。私は変わらず、時代が変わっていく。
	性に合う時代、合わない時代が移ろい、過ごしやすい時代と、そうでない時代がある。
	それが淡々と巡ってくる。
	双子や、フィガロなどは柔軟だ。
晶	スノウとホワイトは、オズとフィガロの魔法のお師匠様なんですよね。
	二人のこと、区別してるんですか？
オズ	分けて考えてはいなかったが、考える事件が起きた。
晶	あ……。す、すみません……。デリケートなところを……。
オズ	構わない。もともと、何を考えてるのかわからない双子だったが。
	あの件で、一層わからなくなった。
`},
{id:10514,title:"スポットゆかりの話（１）",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	氷の森で一番大きいのがこの樹じゃ。
晶	すごいですね……。こんなに寒い場所なのに……。
スノウ	うむ。我らが子供の頃からある樹じゃからの。
	我らと同じくらいか、それ以上の長寿じゃ。
晶	そんなに？俺の世界にあったら天然記念物です。
スノウ	この辺りは一度、大規模な火災にあってのう。
	ホワイトと共に、この樹を守ったことがあるのじゃ。
	この樹は、我らにその恩を感じておる。
	我らの紹介ならば、おぬしにも好意を向けるじゃろうて。
晶	植物が恩や好意を感じたりするんですか？
スノウ	長く生きておれば、どんな生き物も、向けられる心や、簡単な言葉くらいは、
	理解できるようになるものじゃよ。
	賢者よ、何か話しかけてみるがよい。
~~~~~~~~~	~~~~~~~~~
選択	初めまして！　晶です！
晶	初めまして！　晶です！
スノウ	おお。そうじゃったそうじゃった。おぬしの名、我らも忘れるところであった。
晶	そんな……。
スノウ	定期的にアピールするがよいぞ。
~~~~~~~~~	~~~~~~~~~
選択	よろしくお願いします！
晶	よろしくお願いします！
スノウ	ほほ。謙虚で可愛らしい挨拶じゃのう。行儀が良くて、連れて来た我らも鼻が高い。
	北の魔法使いでそんなことを申す者は、まず居らんからの。
~~~~~~~~~	~~~~~~~~~
選択	新しく召喚された賢者です！
晶	新しく召喚された賢者です！
スノウ	うむ。おぬしの役目がわかりやすくて、よい挨拶じゃな。
晶	樹は、賢者とか、厄災だとかも、理解できるんでしょうか……？
スノウ	自然の方が厄災の影響を受けやすく、力や気配も感じやすい。
	わからぬのは人間くらいじゃよ。
~~~~~~~~~	~~~~~~~~~
晶	え……。枝が揺れた……？
スノウ	喜んでおる。退屈しておったようじゃな。
	我らの兄弟のような様じゃからの。仲良うしてやっておくれ。
`},
{id:10515,title:"スポットゆかりの話(２)",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	ここじゃここじゃ。あそこに水晶の岩があるじゃろう。
晶	うわ、大きい……。岩の周りがキラキラしててすごく綺麗です。
スノウ	そうじゃろう、そうじゃろう。
	あれはラウゴックと言って、我らが水晶に変えた魔法使いじゃ。
晶	……え……？元は魔法使いだったんですか？
スノウ	そうじゃ。
	むやみに人間を殺めて回っておって、少しばかり目に余っての。
	我らがお仕置きしてやったんじゃよ。
晶	スノウとホワイトが……。
スノウ	水晶になってもなお、我らに恨みを抱いておるようでの。
	ほれ、こうして近づくと……。
晶	わっ……、岩から結晶が噴き出して来た……！？
スノウ	怒りで水晶の体が砕け散って、雪になって降り積もるんじゃよ。
	魔力が強いと思念が残ってしまうからのう。
	怒りや憎しみも、美しく昇華するようにしてやったんじゃ。
	ほっほっほ。こやつがマナ石になるまで、まだ数百年はかかるかのう。
晶	（スノウとホワイトのお仕置き、半端ないな……）
`},
{id:10516,title:"北の国について",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	北の国は、見ての通り自然が厳しく、その分、神秘の力も強いために、魔力の強い魔法使いが多い。
	魔法使いには過ごしやすいが、人間たちはあまりおらん。そこは、寂しくもあるのう。
晶	スノウやホワイトも、人間が居ないと寂しいと思うんですか？
スノウ	うむ。
	生まれたばかりの者たちは、物知らずで、健気で、愛おしく、面白い。
	本当はもっと構いたいぞ。
晶	そういう感じで、俺にも接してくれてたんですね……。
スノウ	寂しさを感じて、人間と親しくしようとすると、大抵の者は怖がって怯えたり、へりくだるような態度になる。
	そうなると、ちょびっとだけ面倒くさいのじゃ。
	結局、我らも都合がいいんじゃろうな。
`},
{id:10517,title:"〈大いなる厄災〉について",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	この氷の森も心なしか落ち着かん気配じゃのう。厄災が近付きすぎた影響か。
晶	厄災が近づく時って、魔法使いたちはどんなふうに感じるんですか？
スノウ	うーむ。よく聞かれるが、なんとも言葉にし難いのじゃ。あえて言うならば……。
	来てる来てるう！
	……って感じかの。
晶	力が漲るような感じ……、でしょうか。
スノウ	うむ。それが一番似ておるな。実際、皆の魔力も強くなる。
	乗じて悪さをするものもおったのう。
	今年の〈大いなる厄災〉は若干手強そうだとか、今年の〈大いなる厄災〉は大したことがないだとか、
	月が近づく頃になると、徐々に感じる者もおる。
晶	ある程度は予測ができるって事ですか？なら、対策が練れそうで、少し安心……。
スノウ	油断は禁物じゃ、賢者よ。
	気配を感じる時期はまちまちな上に、前回はあの有様じゃからの……。
	悠長な事は言っておれぬ。地道に鍛錬を重ね、備えるしかないのじゃ。
`},
{id:10518,title:"スポットの人々",type:"personal",characters:["ホワイト"],memo:"スノウ",
text:`晶	北の国は、人間が暮らすには、なかなか厳しい場所ですね……。
ホワイト	そうじゃのう。気候もあるが、北の魔法使いは、いわくつきの者が多いからの。
	この国の数少ない人間は、土地の魔法使いの縄張りに住み着いて、庇護を求めて暮らしておる。
晶	庇護？
ホワイト	我らの住む村には、他の魔法使いも手を出さんということを、人間はよく知っておってのう。
	そうして、我らの土地で暮らすその代わりにと、食料や生活に使うものを持ってくるのじゃ。
晶	お供え物とか、みかじめ料みたいな感じですね……。
ホワイト	昔は、魔法使いを神のように扱う人間が多かったんじゃよ。
	北では、その風習が色濃く残っておる。
晶	スノウとホワイトは、村や人間を守ってあげるんですか？
ホワイト	もちろんじゃ。長く側で暮らせば、それなりに愛着もわくしの。
	ミスラのような行儀の悪い者が、土地ごと横取りするのを防いだり、悪天候や天災を避けてやることもある。
	我らの住む氷の街から、この森を越えて、このずっと先の山脈まで我ら双子の縄張りじゃ。
	賢者も北の国に住む時は、我らの土地に暮らすが良い。特別待遇でもてなしてやろう。
晶	ありがとうございます。でも……、寒いのに慣れたら、ですかね……。
`},
{id:10519,title:"スポットにいた魔法使い",type:"personal",characters:["ブラッドリー"],memo:"スノウ",
text:`晶	この辺りには、どんな魔法使いが暮らしてるんでしょう？
ブラッドリー	氷の森は双子の縄張りだからな。
	ここに住んでるような魔法使いはまあ、北で生きていくには弱い奴らだ。
	成り上がりみたいなやつもいるが、まず双子にやられるな。
	まあ、あいつらはそのあとの面倒見もいい。
	昔、死期が近い、じじいの魔法使いがいた。
	耄碌していて、双子のことを孫だと思い込んでた。
晶	孫……。そのおじいさんの方が年上だったんですか？
ブラッドリー	まさか！あいつらが何千年生きてると思ってんだ。
	あの双子がこの世界でいちばんの年寄りだぜ。
	双子はじじいに付き合って、おじいちゃま、おじいちゃま、って、懐いて喜ばせてたんだ。
	俺は本性を知ってるじゃねえか？見てて怖かったぜ。
晶	な、なるほど……。
	ブラッドリーもその人に会った時は、話を合わせてあげてたんですか？
ブラッドリー	ああ。そうしねえと、双子がやかましいからな……。
晶	なんて言うんです……？
ブラッドリー	「いいお孫さんですね」つって……。
	あ？コラてめえ、笑ったか、今。ぶっ殺されてえのか？
`},
{id:10520,title:"穴の中の調達者",type:"personal",characters:["シャイロック"],memo:"スノウ",
text:`晶	あれ、こんな雪の中に穴が空いてる。深くて真っ暗だ……。落ちたら危なそうだな。
穴を覗き込むと、突然シャイロックが穴から顔を出した。
シャイロック	賢者様。
晶	わっ！？びっくりした……！ど、ど、どうしたんですか、シャイロック。
	かくれんぼですか……？
シャイロック	私が？　かくれんぼを？面白いことをおっしゃいますね。
晶	穴から出てくるシャイロックの方が、相当面白いですけど……。
シャイロック	雪の底にある氷を取っていたんです。
晶	氷ですか？わざわざ穴を掘って……？
シャイロック	奇人を見るような目でこちらを見るのはおよしになってください。
	その眼差しを送るべき人物は他に居りますよ。
	酒に使う氷です。北の国や、東の国の水は、とても上質なんです。
晶	な、なるほど。やっと納得できました。
いつも常識的だから、ちょっとギャップがあって混乱しました。
シャイロック	ふふ。お恥ずかしいところをお見せしました。
	ですがもう少し調達しておきたいので、これで。
そういうと、シャイロックは再び穴の中へ姿を消した。
晶	やっぱりギャップある……。
	（もしかして、いい氷が手に入りそうだから、少しだけウキウキしてるのかな……？）
`},
{id:10521,title:"危険な場所",type:"personal",characters:["オーエン"],memo:"スノウ",
text:`オーエン	賢者様、賢者様。
晶	オーエン……？そんな離れたところで、どうしました？
オーエン	ねえ、ちょっと、こっちまで来て。賢者様。
晶	（猫なで声だ……。危険な予感がする）
	あの……、どうして、少しだけ地面から浮いてるのか、聞いてもいいですか？
オーエン	だめ。
	いいから来て。そのまま歩いてこっちまで。
晶	…………。
突っ立ってても埒があかないので、俺はオーエンのいる方へ歩き出した。
その時……。
晶	……っ！！……地面が裂けてる！？！？！？
オーエン	おや、残念。落ちなかった。
晶	危な……！？なんですか、これ。オーエンが魔法で地面を割ったんですか？
オーエン	僕じゃない。クレバスだよ。
	きみの悲鳴を聞いた後、底に落ちたきみと話がしてみたくて。
晶	酷い……。
オーエン	ここはこういうのが多いんだ。危ないから気をつけた方がいいよ。
晶	親切……？
`},
{id:10522,title:"スノウの評判",type:"personal",characters:["ブラッドリー"],memo:"スノウ",
text:`晶	あれ、ブラッドリー。どうしたんですか、その果物……。
ブラッドリー	スノウとホワイトに世話になってた、若い魔法使いが持ってきてた。
	気配で双子がここに来たのがわかったんだろ。
晶	横取りしちゃダメじゃないですか……。
ブラッドリー	うるせえ。告げ口したらぶっ殺すぞ。
	魔法舎でもそうだが、双子は若い連中によく好かれる。
	あの姿形に騙される馬鹿が多いんだ。
晶	でも、俺には、出会ったときからずっと、親切で親身な感じですよ。
ブラッドリー	猫かぶってんだよ。面倒見のいいふりして、
	いざとなると本気で怖えことを最近は隠してる。オズやフィガロもだ。
	そのせいか、若い連中が古くて強え魔法使いを、ちょっと舐めたような構い方すんの見ると、ヒヤヒヤするぜ。
晶	（なんだかんだ、後輩を心配したりして、ブラッドリーも面倒見がいい気がするけど……）
ブラッドリー	と言っても、悪い奴らがやりたい放題やってた時代に比べりゃみんなだいぶ丸くなりやがった。
	日和ったのか、年のせいか……。いずれにしろ、そろそろ俺様の時代が来るのかもな。
晶	そんなこと言ってると、またスノウとホワイトに叱られますよ。
ブラッドリー	うるせえ。告げ口したらぶっ殺すぞ。
`},
{id:10523,title:"スポットでの名物",type:"personal",characters:["ミスラ"],memo:"スノウ",
text:`ミスラ	おや。
晶	え？
一緒に歩いていたミスラが、突然、近くにあった木の枝を手折って、俺に差し出した。
ミスラ	どうぞ。
晶	ど、どうも……。なんですか？これ。
ミスラ	氷の木の新芽は、枝から取ってもしばらく凍っているんです。
晶	なるほど……？
ミスラ	は？
晶	え？
ミスラ	……おかしいな。前の賢者はもっと喜んだんですけど。
晶	前の賢者様が？
ミスラ	いつも俺の事を怖がっているのに、空間の扉を開けてくれと頼まれました。
	絶対売れるから南の国に持って行くって。
	大航海時代みたいに、貴重品を物々交換して、一山当てようとかなんとか……。
晶	賢者様ったら……。ミスラは協力したんですか？
ミスラ	しないですよ。面倒くさい。
	その後、弁当に入れていると報告されました。
	食べると舌も胃も凍ると言ったんですけどね。
晶	（保冷剤にしてたのかな……。便利そうだから俺も貰っておこう）
`},
{id:10524,title:"スポットでの発見",type:"personal",characters:["オズ"],memo:"スノウ",
text:`晶	オズ！ここにいたんですね。何か見てたんですか？
オズ	いや……。
晶	（あれ、あそこの木の陰に何かいるみたいだ。あれは……、うさぎ？）
~~~~~~~~~	~~~~~~~~~
選択	うさぎが好きなんですか？
晶	うさぎが好きなんですか？
オズ	私ではない。子供の頃、アーサーが好きだった。
~~~~~~~~~	~~~~~~~~~
選択	うさぎが食べたいんですか？
晶	うさぎが食べたいんですか？
オズ	ミスラのような真似はしない。子供の頃、アーサーが好きだった。
~~~~~~~~~	~~~~~~~~~
オズ	よくうさぎを追いかけて、危険な目にあっていたからな。
	うさぎを見ると思い出すようになった。
	捕まえるのに夢中になって、崖から落ちそうになったり、熊や狼の巣に近づいたり……。
晶	それは怖いですね……。子供って目を離せないって言いますもんね。
オズ	ああ、何度注意しても聞かない。
	本人も悪気があるわけではなく、周りが見えなくなってしまうらしかった。
	困り果て……、うさぎ自体が危険な動物だと認識させれば安易に近付かなくなるのではと考えた。
晶	うさぎ自体を……？いい考えかもしれませんが、どうやったんですか？
オズ	魔法で、城の周りのうさぎを恐ろしい姿に変えた。一匹残らずな。
晶	ど、どんな感じの……。
	《ヴォクスノク》
オズは、さっき見ていたうさぎに魔法をかけて恐ろしくおぞましいモンスターの姿に変えた！
晶	ギャーーーーーー！！！！バケモノ！！！！エイリアン！！！！
オズ	やはりか……。
	今のおまえのように、アーサーもあまりにも泣いて怯えたので、すぐに元に戻した。
	結局、物心着くまでうさぎの件は解決しなかったな。
`},
{id:10525,title:"楽しい場所",type:"personal",characters:["フィガロ"],memo:"スノウ",
text:`フィガロ	今夜はオーロラが出そうだな。
晶	え！？オーロラ見れるんですか！？
フィガロ	賢者様、オーロラ見たことないの？
晶	ないです！　見てみたいです！
フィガロ	そんなに？いいよ、じゃあ、今夜は森に泊まろうか。
	《ポッシデオ》
フィガロが呪文を唱えると、透明なガラスドームのようなものが、俺達の頭上を覆った。
それから、ベッド、ソファ、暖炉といった家具が次々に現れて、ドームの中はホテルの一室のようになった。
晶	すごい！！旅行雑誌で見たやつだ……！！
フィガロ	あはは、そんなに喜んでもらえると、魔法の腕をふるう甲斐があるよ。
	酷寒の夜に、暖かい飲み物を飲みながらオーロラ鑑賞するのもいいかもね。
晶	俺の元いた世界でもそういうのありました！
	こたつでアイスとか、プールでおでんとか。
フィガロ	へえ、何言ってるのかよくわからないけど、楽しいものってことかな？
	ここじゃオーロラなんて珍しくもないけど、賢者様と一緒なら、特別になるのかもね。期待してるよ。
`},
{id:10526,title:"マナエリア",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
スノウ	それはきっとマナエリアのことじゃの。前の賢者に教えたことを覚えておる。
	マナエリアとは、自身の精神を安定させ、魔力を研磨し高めるための、原風景のような場所のことじゃ。
	誰しも心休まる場所が必要じゃ。
	マナエリアを見出せないままでいたり、長く離れておると心が弱ってしまう。
晶	魔法使いにとって大切な場所なんですね……。
	スノウにもマナエリアがあるんですか？
スノウ	我ら双子のマナエリアは、穏やかな大河と雪の山脈の風景じゃ。
	美しく雄大な景色の真ん中に立っておると、世界を慈しむ心に包まれる。
	全て、我らのもの！という気分になって魔力がみなぎるのじゃ。
`},
{id:10527,title:"アミュレット",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	スノウもアミュレットを持ってますか？
スノウ	もちろんじゃ。我らのアミュレットはこれじゃの。
スノウは、ふわりと宙に浮くと、棚に置いていたガラスケースを手に取って俺に見せてくれた。
淡く発光するケースの中には、穏やかな大河と雪の山脈の景色が映っている。
手の中で小さな窓を覗き込んでいるようだ。
晶	木々が風で揺れてるし、雲や水面が動いてる……。
	すごく綺麗ですけど、本物なんですか？
スノウ	これは我らの作った幻影じゃな。
	特別な魔法で、北の国にある風景をケースの中に閉じ込めておるのじゃ。
	ホワイトの魂をこの世につなげておくには、強い魔力が必要じゃ。
	マナエリアから離れ、魔法舎で暮らすことになった我らには、魔力を保つためのアミュレットは必須じゃの。
晶	そんなに大事なものなんですね……。見せていただいて、ありがとうございます。
スノウ	そんなにかしこまらずとも良い。
	そなたに我らの大切な景色を見てもらった上、褒めてもらえて。嬉しいのう。
晶	すごく壮大で素敵な景色でした！寒そうですけど、いつか実際に見てみたいです。
スノウ	そうかそうか。ではいずれ、ホワイトとともに、
	そなたをこの場所へ連れていってやろうかの。
`},
{id:10528,title:"きらきらの正体は？",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	これがステンドグラス作りに使う材料箱じゃ。どれも上質な鉱石ばかりじゃぞ。
晶	なるほど。これでステンドグラスを作るんですね。それにしても――。
~~~~~~~~~	~~~~~~~~~
選択	この緑色の石、すごく綺麗ですね！
スノウ	それは氷樹に生る宝石じゃ。どれ、一つ賢者にやろう。
晶	いいんですか？そんな貴重そうなものを。
スノウ	気にするでない。この石も賢者に気に入られて喜んでおる。
晶	ありがとうございます。大切にしますね！
~~~~~~~~~	~~~~~~~~~
選択	この青色の石、すごく綺麗ですね！
スノウ	それは……。オズの城の外壁のかけらじゃな。
晶	えっ、どうしてそんなものが？
スノウ	幼いアーサーが我らにくれたのじゃ。綺麗だったから剥き取ったと言っておった。
	ほほほ、懐かしいのう。
晶	アーサー、やっぱりやんちゃだったんですね……。
~~~~~~~~~	~~~~~~~~~
スノウ	ちなみに、そちらの赤い珠は北の森に住む魔物の目玉じゃな。
晶	め、目玉！？冗談ですよね……？
スノウ	冗談ではない。市場では宝石よりも高く売れる一級品じゃぞ。
晶	……じゃあ、この薄くてキラキラした白い石は。
スノウ	おお、それは大昔に手懐けたドラゴンの餅じゃ！賢者はお目が高いのう！
晶	材料箱というよりびっくり箱にしか見えなくなってきました……。
`},
{id:10529,title:"家族",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	スノウ。これ、クロエから。
	二人の人形にお揃いのブローチを作ったから渡してくれって頼まれて。
スノウ	おお！クロエにおねだりしておったのじゃ！礼を言うぞ、賢者よ。
	これはこれは、とても愛らしいのう……。母様もきっと気に入るじゃろう。
	さっそく着けてみようかの！
スノウは魔道具の人形を取り出すと、胸元にクロエが作ったブローチを飾った。
晶	その人形、いつも母様、父様って呼んでますよね。二人の両親がモデルなんですか？
スノウ	さあ、どうかのう。家族のことは、とうの昔に忘れてしもうた。
	この人形は、物心ついた時からホワイトと揃いで持っていたものじゃ。
	長い間ずっと、母様の役をしてくれておる。
	両親の代わりに持っていたものかもしれぬし、両親が我らに授けてくれたものかもしれぬな。
晶	なら、ホワイトとの大事な思い出が詰まった人形なんですね。
スノウ	そうなのじゃ！
	家族の思い出はなくとも、我ら、お互いの思い出は数え切れぬほどある。
	お互い、それで満ち足りてしまうのじゃ。
`},
{id:10530,title:"双子の真剣勝負",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	わっ、スノウ。珍しいですね、大人の姿で……。
大人スノウ	うむ。ホワイトと、大事な作戦で意見が分かれてしまってのう。
	ここ一番の勝負をしておる。
晶	勝負？
大人スノウ	カナリアが食事の準備の手伝いに、若い娘を連れて来ておるのじゃ。その者に……。
	我とホワイト、どちらが先に取り入っておやつを貰えるか、勝負をしておるのじゃ！
晶	なるほど。それでスノウは大人、ホワイトは子供で、アタックする作戦なんですね。
~~~~~~~~~	~~~~~~~~~
選択	大人の姿のスノウが勝ちそう。
大人スノウ	さよう、我も同じ意見じゃ。
	若い娘はすべからく、若い男に心奪われるものじゃからの。
~~~~~~~~~	~~~~~~~~~
選択	子供の姿のホワイトが勝ちそう。
大人スノウ	なんと。そなた、ホワイトに賛成なのじゃな？
	若い娘は愛らしい子供に心奪われるものかのう。
~~~~~~~~~	~~~~~~~~~
大人スノウ	そなたの意見、参考になったぞ。
	まあ、どちらが勝っても、勝った方へ姿を変えれば、ともにおやつが貰えるじゃろう。
晶	確かに。頑張ってくださいね、スノウ。
大人スノウ	うむ。いざ、勝負じゃ！
`},
{id:10531,title:"オズへの親心",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	スノウはずっと昔から、オズを知っているんですよね。
	オズの子供の頃のことも知っているんですか？
スノウ	もちろんじゃ。子供の頃のオズはかわいかったの～。
晶	へえ、そうなんですね。
	なにかほっこりする、かわいいエピソードがあったりするんですか？
スノウ	あるわけなかろう。相手はオズじゃぞ。かわいいのは見た目の話じゃ。
	無口で無愛想でも幼気ならかわいいものじゃからの。
晶	ああ、なるほど……。
スノウ	当時から魔力が強くての。
	オズをかわいがる反面、決して気を緩めずに、慎重に用心もしておった。
	恐ろしい力の持ち主が、世界を凍りつかせる凄まじい吹雪になって、我らを凍りつかせたりせんようにな。
晶	慎重に用心……。どんなことをしていたんですか？
スノウ	プレゼント作戦をしたりして、恩と情であれと絆を結ぼうとしたのじゃ。
	恩情を感じたかは知らんが、我らの顔は覚えた。
	愛やらその類を教えようとしたが……。オズに理解出来たのか、今でもわからん。
	自分の前で気を緩めぬ相手に、愛やら何やら言われても、信じることは難しいじゃろうからな。
	そう考えると、無邪気な幼いアーサーに、オズが心を開いたのは、当然の道理かもしれん。我らは親代わりとして、嬉しく、寂しく思うがの。
`},
{id:10532,title:"オズとしりとり",type:"personal",characters:["オズ","スノウ","ホワイト"],memo:"スノウ",
text:`晶	スノウとホワイト。それにオズも、何をしているんですか？
ホワイト	しりとりじゃ！前の賢者に教えてもらってのう。
スノウ	じゃがオズは喋るのが遅くて、テンポが悪いのじゃ。
オズ	……『うるさい』。
スノウ	『い』じゃな？ほら、賢者の番じゃぞ。
晶	え！？い、『糸』！
スノウ	『と』じゃな！『とってもキュートな我とホワイト』！
ホワイト	むむっ！また『と』じゃと？……『とってもラブリーな我とスノウ』！
オズ	…………。
ホワイト	もー！　そういうとこだよオズちゃん！
スノウ	そうそう！もっとテンションあげてこ！
オズ	『うるさい』。
スノウ・ホワイト	ダメダメダメー！
ホワイト	同じのは二回言ったらダメなんじゃぞ！もう一回考えるのじゃ！
晶	（オズにこんな風に言えるのなんてスノウとホワイトぐらいだろうなあ）
`},
{id:10533,title:"お酒に酔いしれて",type:"personal",characters:["スノウ","クロエ"],memo:"スノウ",
text:`シャイロック	賢者様、こちらへ。
晶	あれ、どうしましたかシャイロック。
スノウ	むにゃむにゃ。
晶	出来上がっている……。珍しいですね、スノウが酔ってるなんて。
シャイロック	今は随分と気分が良いらしいですよ。
	あまり見られないお姿ですので、賢者様にもおすそ分けをしようかと。
晶	普段はすぐ眠くなってしまうからと言って、あまり飲まないですもんね。
スノウ	ん……賢者？賢者がおるのか？
シャイロック	おや。おはようございます、スノウ様。賢者様がお迎えに来てくれましたよ。
スノウ	なんと！賢者はなんていい子なんじゃ。
	ほれ、こっちに寄るがいい。我が抱っこしてやろう！
晶	わっ、スノウ……！あはは、くすぐったい！
スノウ	そなたは本当に可愛い、いい子じゃのう！我の自慢の賢者じゃー……。
晶	あ、寝ちゃった……。
`},
{id:10534,title:"おまじない",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	……痛っ。
スノウ	賢者よ。どうかしたか？
晶	あ、いえ。紙で指を切ってしまって。これ地味に痛いんですよね。
スノウ	なんと、そなたのか弱い指先が……。この本は罪深いことをしたのう。
晶	あはは、大げさですよ。これくらい放って置けば治るので大丈夫です。
スノウ	むむ、軽く見てはいかんぞ。指を出すのじゃ。
	《ノスコムニア》
晶	（すごい、一瞬で傷口がふさがった……！）
	スノウ、ありがとうございます！本当に魔法って便利ですね。
スノウ	ほほほ、このくらいなんてことないわい。仕上げにまじないをかけてやろう。
	前の賢者が教えてくれたものじゃ。
	痛いの痛いの、飛んでいけー！
`},
{id:10535,title:"得意な魔法",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	スノウ。何をしているんですか？
スノウ	賢者か。ちょうど良いところへ来た。
	予知の魔法の鍛錬をしておったのじゃ。そこへ座るが良い。
晶	予知の魔法の鍛錬……。
	予言は降ってくるものだって聞きましたけど、やっぱり練習は必要なんですね。
スノウ	ほほほ。どのような技術も常に鍛え、更新せねば、古く鈍ってしまうものじゃ。
	さあ、何を使って占おうかの。
~~~~~~~~~	~~~~~~~~~
選択	カード
スノウ	よかろう。このカードの中から一枚選ぶと良い。
晶	えーっと……、じゃあ、これで！
スノウ	ほう、マナ石のカードじゃな。命と力、その継承や終わりを意味する。
	ざっくり言えば、おぬしの力を必要とする者へ手を貸してやるのが吉、ということかの。
~~~~~~~~~	~~~~~~~~~
選択	水晶
スノウ	よかろう。この水晶を覗き込んでみるのじゃ。何が見えるかの？
晶	えーっと……、なにかもやもやしているような……。
	でも、その奥が光ってるみたいです！
スノウ	ほう、霧か雲か……。
	おぬしか、またはそばにおる者が、なにか悩みを抱えているようじゃ。
	しかし、光が見えたのなら、おぬしの手腕次第で問題を晴らすことは難しくないじゃろう。
~~~~~~~~~	~~~~~~~~~
選択	星廻り
スノウ	よかろう。
	賢者の運勢は、〈大いなる厄災〉と他の星々との位置を観ることになっておる。
	雪の星の動きは未だ騒がしい。
	トラブルの起きやすい配置から、厄災はそれを見守る距離におる。
晶	つまり……。
スノウ	身近で揉め事が起こりやすいが、おぬしが解決へ導くという暗示かの。
~~~~~~~~~	~~~~~~~~~
スノウ	とても良い結果じゃ。
	賢者よ。今からおぬしはこの菓子の缶を持って、ホワイトの部屋を訪れるが良い。
	そして、我の代わりにホワイトを午後のお茶に誘い、３人でおやつにするのじゃ！
晶	……もしかして、スノウ、ホワイトと喧嘩しちゃったんですか？
スノウ	喧嘩ではない。喧嘩ではないが、おぬしの説得が必要な事態なのじゃ。
`},
{id:10536,title:"ラブレターの宛先",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	昔、気まぐれに数年ほど大人の姿で過ごしていたことがあったのじゃ。
	麗しい我らにみな夢中じゃったが、その中でも特に熱烈なラブレターをくれた町娘がおってのう。
晶	ラブレター！大きいスノウって格好いいですからね。
スノウ	我も悪い気はせんかったが、
	その町娘、我ら双子を見分けることが出来んかったようでの。
	ホワイト宛の手紙を我に渡してきたのじゃ。
晶	そ、それは……反応に困りますね。
スノウ	きちんとお断りはした。しかし、気持ちを無下にするのも可哀想じゃったからの。
	お詫びのプレゼントも渡しておいたぞ。
晶	えっ、スノウが……？
	その子にホワイトと間違えてることを教えてあげなかったんですか。
スノウ	我らは二人でひとりじゃからな。どっちが返しても同じようなものじゃろう。
晶	（なんて罪作りな魔法使い……！）
`},
{id:10537,title:"紋章",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	スノウの賢者の紋章は、首筋にあるんですね。
スノウ	うむ。我は右側、ホワイトは左側じゃ。
	元はひとつずつ紋章がついておったが、ホワイトが死んだ時に、模様が半分ずつになってしもうた。
	きっと、我の力や命も、半分になったということじゃの。
晶	…………。
スノウ	いちいち悲しい顔をして。そなたは優しい良い子じゃのう。
	我は悲しんでいるわけではない。お揃いも好きじゃが、半分こも大好きじゃからの。
晶	スノウ……。
スノウ	ほれほれ、暗い気分はおしまいじゃ。
	我の頭を撫でるか、我がそなたを撫でるか、どちらが良いか申してみよ。
晶	両方で……。
スノウ	ほほ、欲張りで可愛いのう。この半分になった紋章も、我の欲張りの結果じゃ。
	我とそなたもお揃いじゃな。
`},
{id:10538,title:"食べ過ぎ注意",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	スノウ。夕食ができたみたいですよ。
スノウ	なんと、もうそんな時間か？
晶	はい。今夜はシチューらしいですよ。キッチンからとてもいい匂いがしていました！
スノウ	むむ、シチューか。美味そうじゃのう……。
晶	あれ、難しい顔ですね。もしかしてまだお腹空いてませんか？
スノウ	うむ。実は、アフタヌーンティーでおやつを食べ過ぎてしまってのう。
	ホワイトと分けっこしているはずなのじゃが、弾む話の手元に美味しい菓子があると、ほら。ついつい手が伸びてしまうじゃろう。
晶	あはは、ちょっとわかります。俺もこっちに来てからおやつの時間が楽しいです。
	つい食べすぎてしまいますよね。
スノウ	そうじゃ。賢者と我とホワイト、3人で分けっこすればちょうどいいかもしれん。
晶	それは素敵ですね、ぜひご一緒させてください。
	スノウが食べ過ぎないよう俺も気を付けます！
スノウ	ほほほ、そうかそうか。では明日からよろしく頼むぞ。
`},
{id:10539,title:"スノウの日常",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	スノウ、ホワイト！部屋から大きな音がしましたが、大丈夫ですか？
スノウ	おお、賢者よ。心配させてしもうたのじゃな。すまなかったのう。
	ホワイトと遊んでいたのじゃ。
	どれほど大きな姿になれるか試しておったら、ついつい大きくなりすぎてしもうた。
	今はもう、元の大きさじゃろう？
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
スノウ	本を読んだり、手慰みにカードの占いをしたりするかのう。
	されどひとりは退屈じゃ。特別な日以外は、すぐにホワイトを探しに行くじゃろうな。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
スノウ	魔法舎で暮らすようになってから、
	若い魔法使いたちが部屋に遊びに来てくれるようになったのは嬉しいのう。
	たまに北の魔法使いを呼びつけてお説教やお仕置きをしておる時もあるのじゃ。
	賢者よ、次からノックを忘れぬようにな。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
スノウ	ホワイトと共に起き、互いの身支度をして、二人で体操をするのが日課じゃ。
	あとは詳しく決めておらぬ。
	魔法舎に来てからは、毎日違う誰かと、違う遊びができて退屈せんのう。
~~~~~~~~~	~~~~~~~~~
晶	そういえば、ホワイトはどうしました？一緒じゃなかったんですか？
スノウ	いやいや、しかと、ここにおる。我が大きくなり、ホワイトは小さくなったのじゃ。
ホワイト	賢者よ、ここじゃここじゃ！
晶	ど、どこに……。あれ！？もしかしてこの、スノウの指先の棘みたいなのが……！？
スノウ	ほほほ。驚いたかの？我らの魔力、まだまだ衰えておらんのう。
`},
{id:10540,title:"男前勝負",type:"personal",characters:["スノウ","フィガロ"],memo:"スノウ",
text:`晶	わ、スノウが大きくなってる。
フィガロ	賢者様。いいところに。
大人スノウ	おお、賢者よ。よく来たの。
晶	こんにちは。スノウが大人姿でいるの珍しいですね。
大人スノウ	うむ、我は今日も実に麗しいじゃろう。
フィガロ	ねえ賢者様。きみは俺とスノウ様、どっちの方が男前だと思う？
晶	と、唐突な質問ですね。何かあったんですか？
大人スノウ	先ほどフィガロがカナリアに結婚をしないのかと聞かれていたんじゃ。
フィガロ	じゃあ、俺とスノウ様、どっちと結婚したい？って聞き返したら
	『保留でお願いします』って言われちゃってさ。
大人スノウ	賢者は我に決まっておるよな？
フィガロ	えー。優しくてかっこいい
	どこに行ってもモテモテなフィガロ先生の方がいいよね、賢者様？
晶	保留でお願いします……。
`},
{id:10541,title:"可愛いは正義",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	賢者よ、ただいま戻ったぞ。
晶	お帰りなさい、スノウ。……うわ、すごい荷物ですね！？
スノウ	我が買いに出たのは紅茶だけなんじゃがのう。中央の街の人間は実に親切じゃ。
晶	もしかしてそれ全部お土産ですか？おもちゃにお菓子に服……大量ですね。
スノウ	そうじゃ。我は街を歩いておるだけじゃが、小さな子供がお遣いをしていると勘違いされていろいろとおまけしてくれる。
	おかげでおやつには困らん。良きことじゃ。
晶	あ、そのお菓子めちゃくちゃ美味しそうですね！
	うわ、この服も……すごい高級感がある。
スノウ	まあ、我は可愛いからの。
	いろいろとあげたくなっちゃう気持ちはわかるというものじゃ。
晶	（自分の魅力をわかっている発言だ……）
スノウ	ほほほ。やはり子供の姿は得なことが多い。便利じゃのう。
`},
{id:10542,title:"特別サービス",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	賢者よ。朝じゃぞ。
晶	あ、スノウ。おはようございます。
スノウ	おや、もう起きておったのか。珍しいのう。
晶	はい。早く目が覚めたんですけど、この芸術的な寝癖をどうしようかと悩んでいて。
スノウ	ほほほ、確かに鳥の巣のようじゃ！どれ、我が綺麗に直してやろう。
晶	えっ、そんな悪いですよ。もうすぐ朝食の時間なのに。
スノウ	遠慮するでない。我は器用なんじゃぞ。このくらい朝飯前じゃ！
晶	すごい……！俺じゃないみたいだ。ありがとうございます、スノウ！
スノウ	さすがは我じゃな。
	いつになく完璧な身支度を整えたそなたに、今日は特別サービスじゃ！
`},
{id:10543,title:"北の魔法使いたちのお風呂事情",type:"personal",characters:["北"],memo:"スノウ",
text:`スノウ	まったく、おぬしらは。あれだけ毎日言って聞かせておるのに！
ホワイト	どれだけ勝手をすれば気が済むのじゃ。ちょっとは我らの言うことを聞かぬか！
晶	（スノウとホワイト、いつになく真剣に怒ってるみたい……。どうしたんだろう）
ブラッドリー	こいつが勝手に水なんか足すからだろ。俺はぬるい風呂は嫌いなんだよ。
ミスラ	俺は湯を適温にしたいだけです。茹で上がりたいならひとりでやってくださいよ。
オーエン	ほんとうるさくて最悪、入浴のときくらい静かにできないの？
	別の時間にすればよかった。
ホワイト	オーエンよ、ひとりだけ被害者面をするでない。
	おぬしが湯船に入れた妙な液体も大概じゃぞ。
スノウ	まったくとんでもない困ったちゃんばかりじゃ！
	お湯が紫色になってしまったしのう。なんかどろどろしてるし、泡立ってるし！
晶	（お風呂場で鉢合わせしちゃったみたいだな……）
`},
//ホワイト
{id:10601,title:"スポットの印象（１）",type:"personal",characters:["オーエン"],memo:"ホワイト",
text:`オーエン	何だか気の抜けた街だね。
晶	そ、そうでしょうか……？寒さが厳しくて暮らすのが大変そうですけど。
オーエン	そんなの人間だけだし。北の国ならどこも同じだよ。
	この街は双子の庇護に慣れきって安心してる。
	双子に逆らわず暮らしていれば、生きていけるって思ってるんだ。
	生活に余裕があるわけじゃないけど、悪意が育たなそうで、退屈だよ。
	そろそろ双子が、街を変えようと相談してるって噂を流してこようかな。
晶	そ、そんな……。やめてあげてください……。
	やっと見つけた安全な街かもしれないのに。
オーエン	北の国に安心して暮らせる場所なんてないよ。双子だって昔みたいには強くない。
	人間たちに目隠しして騙してるだけさ。
	もしかして、この街の住人たちはホワイトが死んだことも知らないんじゃないかな？
	勘づいていても、尋ねにくいのかもしれない。
	うかつに質問なんかして、双子の機嫌を損ねたら、生きてはいけないんだもの。
晶	オーエン……。
オーエン	双子には自分たちを守ってくれる力がないって知ったら、
	この街はどうなっちゃうんだろう。
	双子が殺しあったって聞いたら、この街のやつらは動揺するかな？
	……ふふふ、楽しそう。
	本当のこと、教えてあげなきゃ。止めないでよね、賢者様。
	きみはいつも本当のことを知りたがるでしょ。
	僕は正直者。僕は良い子だよ。あとでたっぷり褒めてよね。
晶	あっ、オーエン……！……消えちゃった……。
`},
{id:10602,title:"スポットの印象（２）",type:"personal",characters:["ムル"],memo:"ホワイト",
text:`晶	ムルはキラキラしてるものが好きでしたね。雪も光ってるから好きですか？
ムル	ううん。
晶	えっ！？そうなんですね！？
ムル	ちょっとキラキラしすぎ。眩しいし、寒すぎる！
晶	そうなんだ……。ムルにとって、この街はどういう印象ですか？
ムル	文化や科学が発展しない街だよね。
	北の国はそういう場所が多いけど、スノウとホワイトが庇護する街は特にそう。
晶	特にって、どうしてですか？
ムル	だって、あの双子がいれば、それで済むんだもん。
	食べるものがなくなったらスノウ様！
	凍え死にそうになったらホワイト様！
	どうか、か弱い私たちを助けてください！
	そう言っていれば、助けてくれる。
	だからスノウとホワイトが暮らす街はいつも、人間たちが努力をしない街になる。
	努力をしたとしても、双子の機嫌をとることや、双子から愛されることに一極化していく。
晶	……優しくしているだけじゃ、街の人のためにはならないってことでしょうか……。
ムル	それはそうだろうけど、スノウとホワイトには関係ないことだよ！
	俺にとっても面白みがない。でも、双子にとってはどんどん暮らしやすいようになってくから、暮らしやすい街じゃない？
`},
{id:10603,title:"スポットの印象（３）",type:"personal",characters:["オズ"],memo:"ホワイト",
text:`晶	オズも氷の街に来たことがあるんですか？
オズ	アーサーがこの街を気に入っていた。
	もとより、双子も住処に人を招いたり、招かれたりするのが好きだった。
	頼まれて、何度か訪れた。
晶	オズ自身はどう思っていますか？
オズ	人間との距離が近い。双子は人が好きなのだろうと感じる街だ。
晶	近い、ですか。街の人たちは神様みたいにスノウとホワイトを敬っていて、
	二人も気まぐれに構う感じですけど……。
	それでも距離が近いなって思いますか？
オズ	ああ。
晶	そうなんですね……。
	もしかして、オズって、本来なら人間には全然構ったりしたくないタイプなんですか？
オズ	できるならば。
晶	……そ、そうだったんだ……。
	すみませんなんか、いつも俺に付き合わせてしまって……。
オズ	…………。いや……。
	おまえのことではない。
晶	でも………。
オズ	…………。
	……双子はいつも、住処の近くにマーシアの木を植える。
	双子と出会った時、初めて連れて来られた家でも見た記憶がある。
晶	（世間話を振って構ってくれてる……）
`},
{id:10604,title:"ブレイクタイム（１）",type:"personal",characters:["オズ","ホワイト"],memo:"ホワイト",
text:`ホワイト	賢者ちゃん！賢者ちゃん……！！ちょっと、ちょっとこっち来て！！
晶	ホワイト！？ど、どうしました？そんなに慌てて……。
ホワイト	オズが……。
ホワイトが震える指で示した方向には、オズが立っていた。
その先には、何人かの街の子供がいて、各々が一生懸命、オズに何か話しかけている。
晶	子供達から一度に話しかけられて、ちょっと困ってるみたいですね……？
ホワイト	ほほほ。この光景を見てそのように申すとは。そなたの意見はいつも新鮮じゃな。
	オズが自主的に街の子供に構ったのじゃ。
	絡まれたとも取れるが、怒ることもせずに、戯れるのを見守っておる。
	あやつも変わったのう……。
	我など、一瞬殺してしまわぬものかと、ヒヤヒヤしてしもうた。
晶	オズはそんなに怖かったんですか？
	魔力が強いのはわかる気がしますが、俺はまだ、ちょっと信じられないです。
ホワイト	オズに会ってなお、そのような言葉が聞ける事こそ、我らには信じられぬことじゃ。
	昔のオズほどやんちゃな者は、後にも先にもおらぬ。
	長く生きればこのような日も来るものじゃな……。
	アッ！我ったら、もう死んでるじゃん！たまにうっかり忘れちゃうんだよね～。
	ほほほ、ほほほ……。
晶	…………。
ホワイト	あれ？面白くなかった？
晶	あっ。冗談だったんですね、今の……。
`},
{id:10605,title:"ブレイクタイム（２）",type:"personal",characters:["ミスラ"],memo:"ホワイト",
text:`ミスラ	あれ、賢者様。
晶	わっ、ミスラ。今、そこの民家から出てきましたよね。
	氷の街に知り合いがいたんですか？
ミスラ	いえ、他人ですけど。
晶	えっ……。何してたんですか？
ミスラ	別に。腹が減ったんで、何か食べさせてくださいって頼んだんです。
晶	レストランには見えなかったけど……。食べさせてもらえました？
ミスラ	もらえましたよ。ギリギリのラインを攻めました。
晶	ギ、ギリギリのラインって……？
ミスラ	スノウやホワイトが怒って出てこない程度に圧をかけたんです。
	この街、良いですね。
	双子が人間たちをよく躾けているから、名乗ったらすぐに俺だと分かったみたいです。
	殺されるくらいなら、大人しくいうことを聞いた方がいいと教えられているんでしょうね。
晶	だ、だめですよ、そんなの……。カツアゲというか、強盗というか……。
ミスラ	あはは。なんですか？それ。
	あなたにもご馳走しますから、双子には言わないでくださいよ。
	何か食べたいものありますか？賢者様。
`},
{id:10606,title:"スポットの思い出（１）",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	この街に引っ越してきたときの忘れられない思い出とかってありますか？
ホワイト	そうじゃのう。色々あったが……。
	いつも住処を変えるときには、人間の居らぬ場所に、ひっそりと屋敷を構えるのじゃ。
	しばらくすれば、どこからともなく人間たちがやってきて、我らの家の近くで暮らし始める。
	それが村となり、街となる。
	氷の街は、他の場所よりも、街の形を成すのが早かったが……。
	それまでの間は、スノウと二人きりの時間を楽しむのが、いわば恒例での。
晶	いいですね。気心の知れた家族とのんびりできるって。
ホワイト	うむ。
	しかしな、我はすでに亡霊となった後じゃ。
	昔のような甘美な時間を、長くは過ごせぬようになっておった。
	「二人と言うて、所詮はそなたひとりじゃしの」
	……といった感じの嫌味が、ついつい口を衝いて出てしもうてのう。
晶	あ……、あああああ……。
ホワイト	そのような空気に耐えかねたスノウは、
	オズやフィガロをしきりに屋敷へ招待したがったものじゃ。
	「こうしておると、昔を思い出すのう」などと、スノウがのたまった食卓の、オズとフィガロの興醒めしきった顔……。
	ほほほ。忘れえぬ思い出じゃな。
`},
{id:10607,title:"スポットの思い出（２）",type:"personal",characters:["スノウ"],memo:"ホワイト",
text:`スノウ	たしか、この家の先祖にあたる者が、氷の街の住人第一号だったのじゃ。
晶	他の家より少し大きな家ですね。
	やっぱり、そういう人が、土地の権力者になるものなんですね……。
スノウ	もともと、少しでも良い暮らしを求めて危険な旅に出るような、
	根性のある者だったとも言えるしのう。
	仲間を率いて厳しい土地を進み、定住した後もみなをまとめておったようじゃ。
	その子孫だと思えば、だいたいそうなるかの。
晶	なるほど……。
スノウ	何代前かは定かではないが、この家の赤ん坊が生まれるときに、
	守護と祝福を込めたナイフを授けた事がある。
	人間にとっては、ずいぶん昔の話じゃろうに、まだ大事にして持っておるようでな。
	いじらしいことじゃ。
晶	この家の家宝になっていそうですね……。
	たとえば、赤ちゃんが、スノウの見た目を越えるほど育って、大人になって、年を取って……。
	その子供がまた育って、老いていくのを、繰り返し見ているのって、どんな気持ちなんですか？
スノウ	ふむ。どんなとな？そうじゃのう……。
	花が散り、種が芽吹き、蕾をつけ、また花が咲いて散る。
	そなたがそれを見守るときと、似たような感じじゃろうな。
`},
{id:10608,title:"スポットの思い出（３）",type:"personal",characters:["アーサー"],memo:"ホワイト",
text:`アーサー	懐かしいですね。氷の街へは、何度も訪れたことがあるのです。
	街の人々が親しげで、子供用の遊び場があって、スノウ様とホワイト様のお屋敷にも面白いものがたくさんあって……。
	幼い私には新鮮で楽しい街でしたね。
晶	たしかに、北の国にしては、子供たちがのびのび暮らしている気がします。
アーサー	スノウ様とホワイト様も、子供は遊ぶことが仕事なのだと、
	よくおっしゃっていました。
	ある時、お二人のお屋敷を見たいとせがんで、スノウ様とホワイト様に、街へ連れてきていただいたことがあるのです。
	夢中になって遊んでいたのですが、私も、お二人も、うっかり、オズ様に断りを入れるのを忘れてしまって……。
晶	わあ……。オズは慌てたんじゃないですか？
アーサー	そうなのです。
	急に天候が荒れて不思議に思っていたら、怖い顔をしたオズ様が現れたので驚きました。
晶	（少し過保護に思うけど、物騒な北の国で子供が居なくなってしまう状況は、
	　俺が思うよりシビアな話かもしれないな……。）
	街の人たちも驚いたでしょうね……。スノウやホワイトはなんて？
アーサー	お二人は、オズ様がまるで熊のようだと。
晶	熊？
アーサー	熊は、自分の獲物を盗られることに、とても執着するのだと教えてくださいました。
	北の魔法使いには、そのようなところがあると。
晶	そう言われると、
	ミスラやオーエンやブラッドリーも、そんな感じがするかもしれませんね……。
	北育ちのアーサーはどうですか？
アーサー	私ですか？改めて考えたことはありませんでしたが……。
	……そうですね。
	自分の獲物を奪われた時のことを思うなら、多少は、あるかもしれません。
`},
{id:10609,title:"ホワイトへの印象（１）",type:"personal",characters:["スノウ"],memo:"ホワイト",
text:`スノウ	ホワイトの印象か？おぬしはなかなか難しいことを聞くのう。
晶	難しいですか？
スノウ	ホワイトを見ると、自分を見るようになってしまって、何を話せばいいのかわからぬ。
	我らはほとんど、互いの分身のようなものじゃからの。
晶	そういう感じなんですね……。
~~~~~~~~~	~~~~~~~~~
選択	どんなときのホワイトが一番好きですか？
スノウ	そうじゃな……。ホワイトから、我の考えとは異なった答えが返ったときかのう。
	以前は全てお揃いが嬉しかったが、今は、考えることがあまりにも同じ過ぎると、
	ホワイトを疑ってしまうのじゃ。
晶	疑う？
スノウ	うむ。ホワイトが話しているのは、全て我の幻覚なのではないかとな。
	ホワイトもきっと、本当に我が実在しているのかと悩んでおるじゃろう。
	それまで、なにもかも一緒だったがゆえ、どこからどこまでが己であるのか、もはや、双方が曖昧としてわからぬ。
	あやつの魂を繋ぎ止めたつもりで、この魂を分けただけなのではないかとな。
	疑ってしまうのじゃ。
~~~~~~~~~	~~~~~~~~~
選択	苦手なところはありますか？
スノウ	そうじゃのう……。以前は少しだけ、束縛的なところが苦手であったかのう。
	自由を許してはくれない雰囲気があった。互いの相違を嫌忌しておった。
	じゃが、今は我がホワイトを縛っておかねば、どこかに行ってしまいそうで不安じゃ。
	我が、居なくなっていいと思えば、ホワイトは二度とは戻らぬ。
晶	……。
スノウ	我ながら、笑えぬほどに勝手な話じゃな。
~~~~~~~~~	~~~~~~~~~
選択	一緒にいて楽しいことはなんですか？
スノウ	新しく、面白い遊びを思いついたときかのう。
	じゃが、ずっと二人だけでいると、我らにしか理解できない遊びや、冗談が増えてしまうんじゃ。
	したがって、本当に面白いのかは分からぬ。
	……と、思っておったが……。
	興味や価値観が同じ過ぎても不安での。
	たまにみなに披露して、滑るくらいがちょうど良いのじゃろうな。
`},
{id:10610,title:"ホワイトへの印象（２）",type:"personal",characters:["ミスラ"],memo:"ホワイト",
text:`晶	ミスラは双子との付き合いが長いんですよね。
	ホワイトが死んでしまってから、変わったなって思うところはありますか？
ミスラ	魔力は明らかに落ちてますね。
	ホワイトの魂を繋ぎ止めているせいか、半分よりもっと弱くなったんじゃないですか。
晶	なるほど……。ミスラは誰かの魂を、繋ぎ止めたいと思ったことはないですか？
ミスラ	思ったとして、誰にでもできることじゃないでしょ。
晶	そうなんですか？ミスラほど、魔力が強くても？
ミスラ	あれは、あの二人が双子で、二千年以上ずっと一緒に生きてたからできたんですよ。
	魂から互いの半身だったからこその魔法です。
	俺が今から誰かと一緒に二千年生きても、あの二人ほどに魂を繋げることが出来るとは思えない。
	孤独に生きてる俺の魂を誰も繋ぎ止められないのと同じように、俺も、誰の魂も繋ぎ止められません。
	でも、それが普通でしょう。
	賢者様は誰かと魂を繋げて、繋ぎ止めたことがあるんですか？
晶	な、ないです……。
ミスラ	それが普通ですよ。
	俺もあなたも、どこまで行ったって別々の生き物です。
	俺の死があなたの死ではないように……。
	あの双子の死も、別々だったはずなんです。
	普通でないことをしてのけているから、薄気味悪いんですよね。
`},
{id:10611,title:"ホワイトへの印象（３）",type:"personal",characters:["オーエン"],memo:"ホワイト",
text:`オーエン	双子には何度かやられたことがある。
	昔から、悪いことをやり過ぎるとどこからか聞きつけてお仕置きしにくるんだ。
	僕に言わせれば、ただの気まぐれの憂さ晴らしさ。
	きみは思い通り騙されてるみたいだけど。
晶	スノウとホワイトは、俺を騙したりなんて……。
オーエン	ほらね。ふふ、笑っちゃう。
	ホワイトが死んでいい気味だけど、迷惑も被った。
	あいつが石になったのと入れ替わりに、僕が賢者の魔法使いに選ばれたんだ。
晶	死んだホワイトの代わりに、オーエンが召喚されたってことですか？
オーエン	そうさ。双子の片割れがついに死んだっていうから喜んだのに、
	普通に居残ってるからムカついた。
	他の国は四人なのに、北だけ五人も居るなんて変だろ。
	北の魔法使いが弱そうに見えるじゃない。
晶	そういうの、案外気にするんですね？
オーエン	誤解されたら嫌じゃない？
	他の国は四人で出来ることを、北の魔法使いは五人も必要なのかなんて思われたらさ。
	考えるだけでも腹が立つ。
	わざわざ僕が出向いてるんだから、せめて、ホワイトはちゃんと死んでろよって思うよ。
`},
{id:10612,title:"ホワイトへの印象（４）",type:"personal",characters:["ブラッドリー"],memo:"ホワイト",
text:`ブラッドリー	盗賊団をやってたからな。強い魔法使いの情報収集は常にしてたんだ。
	北の双子って言えば有名で、噂もよく耳に入ったぜ。
晶	二人は長生きですし、目立つのもなんだかわかる気がします。
	どんな噂があったんですか？
ブラッドリー	人間の味方もするが、所詮は北の魔法使いで気まぐれだってよ。
	悪さも度が過ぎればあいつらが出てくるってんで、北のやつらはみんな厄介に感じてたさ。
	いつでも双子が、双子が、って言われてて、区別して考えたことなんてなかったが、実際会ってみりゃ、案外違うもんだよな。
晶	ブラッドリーは二人の区別がつくんですね。初めて会った時からですか？
ブラッドリー	まあ、死んでからの方が顕著だけどよ。
	スノウの方が窮屈そうだよな。ホワイトの方が好きなこと言うだろ。
	ホワイトは好き勝手やって、スノウは気ぃ使ってなだめたりしてるのをよく見るぜ。
	手に掛けたくねえ相手に手を掛けちまうと、こういう目に遭うもんかと思うよな。
晶	なるほど……。魂を繋ぎ止めていることについては、どう思っていますか？
ブラッドリー	俺がホワイトならまっぴらごめんだ。
	だが、俺がスノウなら、同じことをするかもしれねえな。
`},
{id:10613,title:"ホワイトへの印象（５）",type:"personal",characters:["オズ"],memo:"ホワイト",
text:`晶	スノウとホワイトは、オズの魔法のお師匠様なんですよね。
	ホワイトのこと、どう思っているんですか？
オズ	…………。
