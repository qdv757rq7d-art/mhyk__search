	ホワイトが死ぬまでは、どちらがどうだということはなかった。
	だが、片方が死んでからは、わずかに差異が出てきたように思う。
晶	二人の差ですか？どんなところが違うんですか？
オズ	……どこが、とは、言葉にしにくいが……。
	おまえたちのしでかしたことは本当に愚かで馬鹿らしいと、二人に告げたとき……。
	スノウは不機嫌になり、ホワイトは苦笑いをした。
	生まれて初めて、双子が反応を違えたのを見て、ぞっとしたことを覚えている。
晶	ぞっと……？
オズ	あの双子でさえ、殺し合えば、互いの何かは変質し、
	二度と戻らないのだということに。
ぞっとしたというには、その横顔に恐怖は浮かんでいなかった。オズは続けて独り言のように呟いた。
オズ	私が何をしたとしても……。
	思い通りにならない出来事や、煩わしいもの、不愉快なものは、未来永劫、この世から無くならない。
晶	オズ……。
オズ	あの時スノウがひとりで何処かに行きたいと言った気持ちを、私は理解できた。
	ひとりで何処かに行くというのなら、この手で石にしてしまおうという気持ちも、
	今は……。
`},
{id:10614,title:"ホワイトへの印象（６）",type:"personal",characters:["フィガロ"],memo:"ホワイト",
text:`晶	スノウとホワイトは、フィガロの魔法のお師匠様なんですよね。
	ホワイトのこと、どう思っているんですか？
フィガロ	賢者様だから正直に話すけど、愚かなひとだなと思ってるよ。
	だってね、自由になりたがったスノウ様を、おまえを殺して自分も死ぬだなんて言って引き止めようとしたんだよ？
~~~~~~~~~	~~~~~~~~~
選択	それは……。
フィガロ	俺は誰かに一生縛り付けられるなんて嫌だし、一緒に居て欲しいって言ったのに離れようとする誰かを、引き止めようとは思わない。
	誰かの心が自分にないことはどうしたって仕方のないことだよ。
	それを魔法でねじ伏せるなんてさ。
晶	確かに……、そうかもしれません。
~~~~~~~~~	~~~~~~~~~
選択	でも……。
フィガロ	俺だってやったことないんだからね。
	友達に付き合ってやってた世界征服も、本人がやめたいっていうなら無理に続けさせようとは思わなかったし。
	可愛い弟子が、すぐに自分の元から飛び立とうとする子だったとしても、行ってらっしゃいって言ったさ。
~~~~~~~~~	~~~~~~~~~
フィガロ	そこは魔法を使っちゃいけないところだろう。
	親密な相手なら尚更。魔法を使った瞬間、何もかも偽物になっちゃうじゃない。
晶	偽物に……。
フィガロ	俺は誰かに何かを求めるときに、そんな風にはやってこなかった。
	それだけは、俺の矜持としてある。
	だからホワイト様は愚かだけど、手加減できずに殺すまでやっちゃったスノウ様も、愚かだ。
	俺はああはなりたくないね。力でも、魔法でもなく、心で誰かとつながり合いたい。
晶	南の魔法使いらしく？
フィガロ	その通りさ。
	誰かの望みが俺の望みになって、俺の望みが誰かの望みになることを、手に入れたいと思ってるんだよ。
	石になるまでにね。
`},
{id:10615,title:"スポットゆかりの話（１）",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	氷の街には、スノウとホワイトの家があるんですよね。
	この街に移り住んだのには、何かきっかけがあったんですか？
ホワイト	ほほほ。我らが街に移り住んだのではない。
	我らが移り住む場所が街になったのじゃ。
	きっかけというなら、前に暮らしていた場所が不自由になったからじゃな。
	同じ場所に百年や二百年も住み続けると、寄ってくるものが増えすぎての。
	増えすぎれば、不自由になる。
	ここに住処を決めたのは、氷の森の近くであったこと。
	見晴らしの良い景色が気に入ったことかのう。
晶	そうなんですね……。
~~~~~~~~~	~~~~~~~~~
選択	この街にはいつまで住んでいるんですか？
ホワイト	ここも、我らが不自由になるまでじゃ。
	世界のどこに行っても、人の数が多くなってきたからのう。
	この街ももうすぐ、定員オーバーというやつじゃろう。
	世界の文化や技術は向上し、魔法使いに頼らず暮らす土地もある。
	ならば、北の国に住むものも、我らの手を借りず勝手に生きれば良い。
	そうなれば、我らも不自由になることなく、
	ひとところに留まって暮らせるじゃろうな。
~~~~~~~~~	~~~~~~~~~
選択	他に気に入った土地はありましたか？
ホワイト	我ではなく、スノウが気に入っておった土地があったのう。
	西の国との境の山脈のそばじゃ。
	あやつめ、一度くらいは山脈を飛び越えて、西の国に住まってみたかったんじゃな。
	西の国の文化は昔から新鮮で、苛烈で、刺激的じゃった。
	我はスノウがそれに触れて変わってしまうのが怖かった。
	そうとは告げぬままに、北の国の奥の奥、氷の森の近くで
	暮らしたいと、ねだったことがあったのう。
`},
{id:10616,title:"スポットゆかりの話（２）",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`ホワイト	この通りは、この街の市場になっておるのじゃ。
晶	本当だ。みなさん、店舗を構えてるわけじゃなくて、
	屋台みたいにお店を出してるんですね。
ホワイト	ほほほ。この街に比べれば、そなたの暮らす魔法舎辺りは、
	ずいぶんと都会じゃからのう。
	珍しいものも多いじゃろう。
	野菜や魚が凍ったまま売られているのを見るのも初めてかの。
晶	わっ……！
	全部カチカチに凍って積まれてる！魔法で凍らせているんですか？
ホワイト	外に置いておくと勝手に凍るのじゃ。
	魚など、湖で釣り上げて、傍に置けば数分で氷と変わらぬようになる。
	食料が手に入りさえすれば、冬の間も長く保存しておける。
	北の国はそこが便利じゃな。
晶	肉用の鳥や動物も、獲ったままを凍らせて売っているんですね……。
	お店の人達はずっと外に出ていて、寒くないんでしょうか？
ホワイト	みな動物の毛皮を着ておるからの。
	動物の毛や皮は外でも凍らず暖かいのじゃ。羊の毛も重宝しておるぞ。
晶	なるほど……。
	ブーツも毛皮で覆われてますもんね。俺の世界にあっても値が張りそう……。
	（俺はいつも魔法で寒さから守ってもらってるけど、人間が暮らすのは本当に大変そうな土地だなあ……）
`},
{id:10617,title:"北の国について",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`ホワイト	こうして戻ってみると、やはり、北の国が一番暮らしやすいと感じるのう。
	人間たちにとっても、この国の暮らしこそ、自然で良い形にあるように思えるのじゃ。
晶	北の国の暮らしが、人間にとっても自然、ですか……？
ホワイト	うむ。北スタイルとでも言うのかの。大昔は世界中が北スタイルで暮らしておった。
	人間には生きにくい場所で暮らすため、魔法使いに庇護してほしいと言うのなら、引き受けぬこともない。
	しかし、タダでというわけにもいかぬ。
	我らの守護の対価として、我らの生活を豊かにする労力を払って買う。
晶	持ちつ持たれつで、という感じでしょうか。
ホワイト	そういうことじゃ。
	我らの方が多く持つ分、多少の我が儘は通すかも知れぬが、なにも、親に子を殺せと無理を言うわけでもない。
	そのような者に当たったならば、逃げ出して、また別の者に庇護を求めれば良い。
	我らのような、善良な魔法使いの。
晶	北の国以外の暮らし方は、どうして、変わっていってしまったんでしょうか？
ホワイト	世界中にいた強い魔法使いたちの多くはオズに石にされた。
	その後オズ自身は北の国の奥深くで、長い間引きこもっていたからのう。
	人間たちにとって、魔法使いの力が脅威で無くなってしまうのは、仕方のないことなのかもしれん。
	反して、この数百年の間、人間の数は増えすぎておる。
	このままでは、いつか、魔法使いは滅びてしまうじゃろうな。
`},
{id:10618,title:"〈大いなる厄災〉について",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`ホワイト	厄災とも、長い付き合いになったのう。
	いつかの昔、我ら双子だけで〈大いなる厄災〉を追い返した話、そなたにしたことがあったかのう？
晶	え！？
	スノウとホワイトだけで、厄災と戦って勝ったってことですか？
ホワイト	さよう。ほほほ、反応が良くてらしいのう。
晶	それって、今までの厄災には、大した力がなかったというか……、追い返すのって結構簡単だったんですか？
ホワイト	そうではない！
	我らがめちゃ強かっただけで、厄災も毎年そこそこ頑張っておったぞ！
	あれは我らが、バリバリの現役真っ只中だった青春時代……。
	育てていた弟子が調子に乗り始めたゆえ、師の威厳を示すためにイキったのじゃ。
晶	弟子って、オズとフィガロのことですよね。二人も驚いていましたか？
ホワイト	もちろんじゃ。我らの強さにちょっと引いておったほどじゃ。
	〈大いなる厄災〉を追い返す仕事も、いつしか当たり前になってしもうたが、この度の厄災は本物の脅威であった。
	今までは均衡が保てておったように思うが、バランスが崩壊すれば、全て物事は悪くなるものじゃ。
	我とスノウも然り、賢者と賢者の魔法使いも然り。
晶	俺とみなさんのバランスですか？
ホワイト	うむ。ほほほ。心配するでない。そなたは良い子じゃ。
	次の戦いでの活躍を期待しておるぞ。
`},
{id:10619,title:"スポットの人々",type:"personal",characters:["ブラッドリー"],memo:"ホワイト",
text:`晶	ブラッドリー。街の人と話をしていたんですか？
ブラッドリー	はっ。人間と話すことなんかねえよ。
	ここでは特にな。どいつもこいつも飼い慣らされて、腑抜けてやがる。そうだろ！？
氷の街の住人	ひいっ……！
晶	ブ、ブラッドリー！脅かしちゃだめですって……！
ブラッドリー	相手が魔法使いだろうが双子だろうが、
	てめえら人間にしかできねえことがあるだろうが。
	対等な相手だと思って取引きして、少しでも自分に利があるように駆引きをしろよ。
	俺が面倒みてやってた人間たちはみんなそういうやつらだったぜ。
氷の街の住人	そんな、滅相もありません……。
	スノウ様やホワイト様に逆らっては、私たちは生きてはいけません……。
ブラッドリー	もちろんてめえらなんかすぐに殺せるさ。
	だが、魔法使いにだって、不得手なもんがあるんだ。
	例えば、流通だの統治だのなんてのは、面倒臭くてやってられねえ。
	双子だって同じで、てめえらに任せきりだろ。
	てめえらを殺せば煩わしくなるんなら、取引きするには十分じゃねえか。
晶・氷の街の住人	…………。
ブラッドリー	大家族の子供みてえに、いい大人が、スノウ様、ホワイト様って。
	双子はてめえらの親じゃねえんだぞ。
	あいつらにそんな情なんざねえんだ。騙されて、いいように使われてんじゃねえよ。
氷の街の住人	あのお二人が私たちを騙すなど……。
	お二人は、本当にお優しくて、長きの間、街のものたちを見守ってくださっております。
ブラッドリー	かあ〜っ！これだからよ！
	双子だってなにがしかの恩恵があるから、この街で暮らしてんだろうが。
	ひとつでいい。
	あいつらがなくなって困るもんを知っておけ。てめえらは、もう持ってるはずだぜ。
`},
{id:10620,title:"スポットにいた魔法使い",type:"personal",characters:["クロエ"],memo:"ホワイト",
text:`クロエ	賢者様！さっきそこで、氷の街に住んでる魔法使いに会ったんだよ！
晶	魔法使いに？
	スノウとホワイト以外にも、この街に住んでいる魔法使いが居るんですね。
クロエ	双子に街の管理を任されてるんだって。
	俺、勝手に入ってきた部外者だと思われちゃったらしくって……。
	怖い顔で凄まれたんだけど、スノウとホワイトが知らない間に、気配を残してくれたみたいなんだ。
	出かける前にハグしてくれた時かなあ？
	とにかく、俺から双子の気配がするからって納得してくれたよ。
晶	そんなことがあったんですね。マーキングみたいな感じでしょうか。
	俺にも付けてくれてるのかな……。
クロエ	たぶんあると思う！この街には、他にも何人か魔法使いが住んでるみたいだね。
	スノウとホワイトの留守を預かって、見回りしたり、人間たちのトラブルを管理してるんだって教えてくれたよ。
晶	なるほど……。
	双子の手が届かない部分は、その人たちに任せてるってことでしょうか。
クロエ	そうなのかな。スノウとホワイトの手を煩わせないためだって言ってたけど……。
	もしかすると双子は、人間たちだけじゃなく、北の国ではひとりで生きていけない魔法使いの面倒も見てあげてるのかもしれないね。
	俺の生まれた街の、元締めの手下たちと、ちょっとだけ似てる雰囲気だったかな。
`},
{id:10621,title:"危険な場所",type:"personal",characters:["ミスラ"],memo:"ホワイト",
text:`ミスラ	今からこの街で一番危険な場所に行くんですけど、あなたも一緒に来ませんか？
晶	は……。え！？危険な場所って、どこですか？
ミスラ	双子の屋敷です。
	あなたが一緒なら、見つかって酷い目に遭うのも、手加減してくれそうですし。
晶	双子の屋敷って、スノウとホワイトの家ってことですよね。行ってみたいんですか？
ミスラ	はい。欲しいものがいっぱいあるんで。
	昔、一度だけ住処に招かれたことがあります。一見、普通の家なんですけどね。
	なんだか、色々歪んでるのを感じました。
晶	歪んでるって？
ミスラ	どこかに繋がっていそうな扉だとか。禍々しい魔力を纏った箱だとか。
	何か飼っているような気配だとか。
	双子は長生きですからね。
	世界の力の均衡に影響を与えるものを、たくさん隠し持っているって話ですよ。
	魔法使いや人間の手に渡ると危ないと思ったものは、
	自分たちで管理しているみたいですし。
晶	たしかに、そんな怖そうなものを、
	スノウとホワイトが持っていてくれると安心できるかも……。
ミスラ	安心？オズを簡単に封じられるような魔道具を持っている可能性もあるんですよ。
	誰の手にあっても脅威でしかないです。一刻も早く奪わないと。
晶	可能性の話ですよね？泥棒に入るのはちょっと……。
ミスラ	絶対にありますよ。
	オズやフィガロが大人しくあの二人のいうことを聞いていたんですから。
	さ、行きましょう、賢者様。俺と二人で、世界の均衡を覆してみましょうよ。
`},
{id:10622,title:"ホワイトの評判",type:"personal",characters:["ラスティカ"],memo:"ホワイト",
text:`氷の街の住人	スノウ様とホワイト様は、本当にお優しく、慈悲深くいらっしゃって、
	街のものはみな、心から感謝しております。
	子供の頃は遊び相手として、大人になってからは相談相手として、年を取ってからは孫のように接してくださって。
	畏敬の念を抱くけれど、可愛らしい守り神のようでもあると、長い歴史の言い伝えに違わぬお方です。
ラスティカ	素敵な関係だ。
	スノウ様とホワイト様が街のみなを愛し、また、街のみなに愛されているんですね。
晶	そうですね。スノウとホワイトは元々人懐っこいですが、
	この街のことも、とても気に入ってるように思います。
ラスティカ	人々に困難があるたびに、手を差し伸べていたのでしょう。
	誰かの喜ぶ顔を見られるというのは、不思議と、自分自身の喜びになりますから。
氷の街の住人	おっしゃる通りです。
	道が岩に閉ざされていれば取り除いてくださり、寒さが酷い年は絶えない炎を灯してくださる。
	お二人が居なくては、このような場所で、良い暮らしをすることはできません。
	心から感謝しております。
	最近、お二人がこの街を去ってしまうという噂を耳にしました。
	見捨てられることを案じて、街には定期的に、不敬な噂が立つのです。
ラスティカ	かわいそうに。それはさぞかしご不安でしょうね。
	たしかに、魔法がなくては不便な土地だ。
氷の街の住人	……私は噂など信じてはおりません。
	お留守からいつ戻られてもいいように、屋敷の周りはみなで掃除をしております。
	お会いできたときには、必ず礼儀正しくと、子供達にもよくよく言って聞かせております。
晶	そういえば、みんな挨拶してくれましたね。
	スノウとホワイトの知り合いだってわかると、みなさんすごく親切にしてくれますし。
氷の街の住人	魔法使いに庇護されていると言ってはいても、
	実際にはその魔法使いの姿を見たことがない村や街もあるのだと、聞いたことがあります。
	氷の街は、そうではありません。長い時間、スノウ様とホワイト様と共にあり、本物の信頼関係を築いている街なのです。
ラスティカ	本物の信頼関係とは、素晴らしい。
	僕と賢者様のようですね。親近感を感じて、この街がもっと好きになりそうです。
`},
{id:10623,title:"スポットでの名物",type:"personal",characters:["オーエン"],memo:"ホワイト",
text:`晶	あれっ、あそこにいるのは、オーエンと……、街の人！？
オーエン	なんだよ、賢者様。血相変えて。
晶	いえ、特に何だとかはないですが、街の人に話しかけてるみたいだったので、何を話してるのかなと思って！
オーエン	話してなんかいないよ。
	だけど、こいつが突然、変なものを一生懸命振ってくるからさ。
氷の街の住人	ひ、ひいい……！
晶	あれは……、ステンドグラスで出来たオーナメントみたいな……？
オーエン	スノウとホワイトが作ったやつじゃない。
	あの双子、生きすぎて暇すぎて、手慰みにステンドグラスを作っては、人間たちに押し付けてるんだ。
氷の街の住人	スノウ様、ホワイト様、どうかお助けください。
	悪い魔法使いが立ち去るように、どうか、どうか、お二人の御加護を……。
晶	（なんだか、熊除けの鈴みたいに使ってる……？
	　もしかしたら、悪い魔法使い除けのつもりなのかもしれないな……
	　たしかに、スノウとホワイトの作ったものを持っている人間に手を出したら、あとが怖そうだし……）
オーエン	ちょっと、やめろよ。なんかむかつくんだけど。こんなもの、払い落としてやる。
氷の街の住人	ひ、ひいいい……！
晶	あっ……！？怖がりすぎて気絶しちゃった……！
オーエン	僕は何もしてないよ。
	賢者様だって見てただろ。スノウとホワイトに余計な告げ口するなよな。
晶	い、行っちゃった……。
	魔法使い除け、効いてる……。
`},
{id:10624,title:"スポットでの発見",type:"personal",characters:["ブラッドリー"],memo:"ホワイト",
text:`ブラッドリー	あ。見ろよ、賢者。スノウとホワイトのステンドグラスだ。
晶	ステンドグラス？あそこの家の窓にはまってるやつですか？
ブラッドリー	そうそう。双子が職人だなんて名乗って、趣味で作ってるだろ。
	それを人間が買ってきては、ありがたがって窓につけるのさ。
	そうすりゃ、双子の縄張りだってすぐにわかるんだよ。
	ここのは本物ってことになるだろうが、双子が大昔に見捨てた土地でも、受け継がれて残ってたりするみてえだぜ。
晶	なるほど……。
	ブラッドリーもやっぱり、ステンドグラスの窓を見つけたら、襲うのはやめておこうって思うものですか？
ブラッドリー	あー。まあ、そうかもな。
	ここで悪さすりゃ、あの双子が出てくんのかって考えれば、多少やる気が萎えるわな。
晶	凄い。ちゃんと効果あるんですね……。
ブラッドリー	おい。別にビビってるわけじゃねえぞ。
	ただ、あいつらと戦うのは、クソ面倒くせえんだよ。
	相手の弱いところを的確に、しつこくしつこく執拗に突いて来やがる。
	フィガロも同じだ。ねちっこくて鬱陶しい。
	元から双子とやりあいたけりゃ、直接本人のところに行くしな。
	大抵のやつは、あの窓の街にゃ近付かねえよ。
`},
{id:10625,title:"楽しい場所",type:"personal",characters:["スノウ","ホワイト"],memo:"ホワイト",
text:`スノウ・ホワイト	賢者よ！こっちじゃ、こっちじゃ！
晶	ここは、公園ですか？すごいですね、こんな雪深い街に公園があるなんて。
ホワイト	子供達と遊ぶために、我らが作ったのじゃ。
	魔法をかけておるゆえ、凍りつくことはない。
スノウ	前の賢者が話しておった、雪のすべり台というものもこしらえたぞ。
	我らと一緒に滑るのじゃ！
ホワイト	あちらには街のものにあつらえさせた雪の彫刻が並んでおる。
	我らと一緒に眺めようぞ！
~~~~~~~~~	~~~~~~~~~
選択	すべり台で遊ぶ。
晶	うわ！すごく高いしめちゃくちゃ長いですね！？
	すべり台っていうより、ウォータースライダーみたいな……。
スノウ	そりに乗って滑り降りるようになっておる。
	ルチルの箒に負けぬほどのスピードが出るのじゃ！
晶	あ、あの、あそこ、途中でスロープが途切れてるんですけど……。
ホワイト	うむ！滑るそりの勢いで屋根を飛び越えて、反対側に着地する仕組みじゃ。
晶	怖すぎる！？
スノウ	スリルを味わいたいときには、魔法を使わず滑るのじゃ！さあ、ゆくぞ、賢者よ！
~~~~~~~~~	~~~~~~~~~
選択	雪の彫刻を見る。
晶	大きい……！彫刻っていうから、もっと繊細なものなのかと……。
ホワイト	年に一度、街のものたちが、
	こうして巨大な雪の像を作って並べて、祭りのようなものを開いておる。
スノウ	あれは我らの彫刻じゃな。今年は耽美な感じでと、リクエストしたのじゃ。
晶	たしかに耽美な感じです……。あっ、あれは、ドラゴン？あっちはお城かな。
	よくできていますね……。
スノウ	魔法も使わずによう作るものじゃと、いつもながら感心するのう。
ホワイト	人間たちだけでこれほどできるならば、我ら、いつでも手を離せるというものじゃな。
スノウ	祭りの終わりには、我らの魔法で盛大に破壊するのが恒例じゃ。
	その時にまた、そなたを招待するとしょうかの。
`},
{id:10626,title:"マナエリア",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
ホワイト	それはきっとマナエリアのことじゃの。
	前の賢者に教えたことを覚えておる。オズや、フィガロにもな。
	マナエリアとは、精神を落ち着かせ、気力を養う場所。
	誰しもが持つ、原風景のような場所じゃ。
	魔力を司るイメージとも深く関わっておる。
	心で魔法を操る魔法使いにとっては、大切なもののひとつじゃの。
晶	魔法を使う時の感覚って、それぞれで違うものなんですね。
	ホワイトにとって……、マナエリアとはどういうものなんですか？
	魂だけだとしても、必要なんでしょうか。
ホワイト	良い質問じゃの、賢者よ。
	我ら双子のマナエリアは、穏やかな大河と雪の山脈の風景じゃ。
	マナエリアから力を得る感覚はもちろんある。
	しかし、実際に魔力をこの身に宿しておるのかはもはや我にはわからんことじゃのう……。
`},
{id:10627,title:"アミュレット",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって
	賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	ホワイトもアミュレットを持ってますか？
ホワイト	もちろんじゃ。
	我らのアミュレットはこれじゃの。スノウと一緒に使っておるものじゃ。
ホワイトは、ふわりと宙に浮くと、棚に置いていた四角いガラスケースを手に取って俺に見せてくれた。
淡く発光するケースの中には、穏やかな大河と雪の山脈の景色が映っている。
手の中で小さな窓を覗き込んでいるようだ。
晶	木々が風で揺れてるし、雲や水面が動いてる……。
	すごく綺麗ですけど、本物なんですか？
ホワイト	これは我らの作った幻影じゃな。
	特別な魔法で、北の国にある風景をケースの中に閉じ込めておるのじゃ。
	そなたが言ったように、本来は、マナエリアを思い返せるものであれば、
	どのようなものをアミュレットにしても良い。
	じゃが、強い魔力を必要としながらマナエリアを離れる時や、長くマナエリアに戻ってこれぬような時は……。
	景色そのものを手元に置くのが最適じゃろうな。
	フィガロもよくよく風来坊じゃったからの、同じ魔法を教えてやったことがある。
晶	そうなんですね。
	スノウとホワイトが強い魔力を必要としてるのはやっぱり……。
ホワイト	もちろん。我の魂をつなぎとめる魔法のことじゃ。
	ほほほ。
	アミュレットでも魔力が足りなくなったら、有給で里帰り休暇をもらおうかの。
`},
{id:10628,title:"金縛りの正体",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	うう、昨日夜更かししたせいか、異常に眠い……。少しだけベッドで横になろう。
	……すう、すう。
	……ん……？あれ……。あ、そうか、あのまま寝ちゃったんだ。
	起きないと――ってあれ！？体が、動かない……！これって金縛り！？
？？？	……よ。……じゃよ……
晶	ふ、布団の中に誰かいる……！？もしかして――。
~~~~~~~~~	~~~~~~~~~
選択	ムル！？
ホワイト	残念、不正解！正解は可愛い北の魔法使い、ホワイトじゃ。
~~~~~~~~~	~~~~~~~~~
選択	幽霊！？
ホワイト	正解じゃ！だが幽霊は幽霊でも、可愛い幽霊じゃぞ！
~~~~~~~~~	~~~~~~~~~
晶	ホワイト……！そんなところで何してるんですか！？
	あ、体が動くようになってる。
ホワイト	賢者の姿が見当たらないと思っての。
	部屋に様子を見に来たら、可愛い寝顔を浮かべているそなたを発見したのじゃ。
	ほほほ、ついでにしかけた寝起きどっきりも大成功みたいじゃな！
	目が覚めたみたいで良かったのう。
晶	どっきりというか、なんというか、普通に金縛りかと思いました。
	もうやめてくださいね……。
`},
{id:10629,title:"家族",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	ホワイトは、家族のことを覚えていますか？
ホワイト	昔々のことじゃからのう。
	会えなくなる者たちのことは、どうしても忘れていってしまうのう。
	オズやフィガロのように、ちょくちょく顔を見ておれば、昔のことも覚えておるんじゃが。
晶	二人はスノウとホワイトのお弟子さんなんでしたよね。
	一緒に暮らしていたんですか？
ホワイト	魔法の基礎を教えてやる中１３２でいることを好んでおった。
	我らがオズの住処へ遊びに行く方が多かったの。
	フィガロはあれで律義者じゃ。さみしがり屋でもある。
	たまに、我らの屋敷に顔を出してはぐうたらしておった。
晶	そうやって長く続く関係もすごくいいなって思います。
	家族って感じじゃないかもしれないですけど。
ホワイト	我ら、親の器ではない。あやつらも、子の器ではなかったんじゃろう。
	逆なら上手くいったのかもしれぬな。
	それに、我の家族はスノウがいれば十分じゃからの。
`},
{id:10630,title:"鶴の一声？",type:"personal",characters:["ホワイト","ミスラ","オーエン"],memo:"ホワイト",
text:`晶	わっ、ホワイト。珍しいですね、大人の姿で……。
ホワイト	うむ。最近、北の魔法使いたちが、調子こいて言うことを聞かなくてのう。
	この辺りでひとつ、お灸を据えてやらねばと思ったのじや。
晶	確かに、叱ったりするなら、大人の姿の方が迫力あるかもしれませんね。
ホワイト	まあ、本当は魔法を使っておるから、大人の姿の時の方が弱いまであるがの。
	単純じゃから、ハッタリに弱いのじゃ。
	これ、ミスラよ。
ミスラ	うわ……。なんですか、その格好。何か用ですか。忙しいんですが。
ホワイト	忙しいわけなかろう。話があるから、我らの部屋に来るように。
ミスラ	はあ……、嫌ですけどね……。
晶	（おとなしく部屋の方に行った……）
ホワイト	これ、オーエンや。
オーエン	うわっ。……何？
ホワイト	目を逸らすでない。話があるから、我らの部屋に来るように。
	……そうじゃそうじゃ、あちらへ。
晶	（効いてる……）
`},
{id:10631,title:"複雑な親心",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	ホワイトは昔から、フィガロを知っているんですよね。
	フィガロの子供の頃も知ってるんですか？
ホワイト	もちろんじゃ。フィガロは子供の頃から、大人のような子供じゃったがの。
晶	大人のような子供ですか。
ホワイト	太古の昔、魔法使いはまるで、神のように人に頼られておったからの。
	子供のうちから大人を庇護しておったんじゃろ。
	妙に達観した、物分りのいい子じゃった。
	我らは双子で孤独を知らんが、フィガロは孤独だけ知っとる子供じゃった。
晶	今では想像もつかないですね……。フィガロはすごく明るい人だから。
ホワイト	フィガロの明るさなぞ、水面に映った松明の火と同じじゃ。
	燃えているように見えても温度はない。
	愛やらその類を教えようとしたが……。フィガロに理解出来たのか、今でもわからん。
	孤独を知らん我らが語る愛は、
	フィガロには別の世界の食べ物の話のように、聞こえていたのかもしれん。
晶	そうなんでしょうか……。フィガロは人助けを好む、南の国の魔法使いになったのに。
ホワイト	恐ろしくて強い魔法使いではあるが、フィガロは昔から人助けは好きじゃった。
	我らには暇つぶしにしか見えんかったがの。
	しかし、今はまるで、子供返りしたように、南の魔法使いたち相手に甘えておる。
	何か思うところがあったのかもしれんの。
	その相手が我らではなかったことに、親代わりとして、嬉しく、寂しく思うがの。
`},
{id:10632,title:"究極の選択",type:"personal",characters:["スノウ","ホワイト"],memo:"ホワイト",
text:`晶	前の賢者様の人柄は賢者の書を読んでると伝わってきますが、
	スノウとホワイトから見てどんな人でしたか？
ホワイト	そうじゃのう。ちょっと空気読めなくて感じ悪いやつじゃったの。
晶・スノウ	えっ。
ホワイト	「スノウとホワイトどっちが好き？」と尋ねたら、「スノウ」と答えたのじゃ。
	それゆえ、詳しく理由を尋ねたら、「幽霊が怖いから」と言いおった。
晶	確かに……、ホワイト視点だと、空気読めなくて感じ悪いかもしれませんね。
スノウ	あったのう、そのようなことが。
	我視点でも、空気読めんやつじゃと内心思うておったぞ。
ホワイト	それで、賢者よ。
	そなた、スノウとホワイト、どちらが好きかのう……？
晶	…………。
	ホワイトですかね。
ホワイト	正解！
スノウ	だよねー！我もホワイトちゃん大好き！！ 
`},
{id:10633,title:"甘え上手",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`ホワイト	きゃー！ 熱いのじゃー！！
晶	ホワイト！？どうしたんですか！？
ホワイト	紅茶が熱すぎて舌を火傷してしまったかもしれん。冷ましたと思ったんじゃが。
	痛いのじゃ。とっても痛いのじゃ。賢者よ、治してくれんかのう。
晶	でも、俺は魔法が使えませんし……。そうだ、フィガロに診てもらいましょう！
ホワイト	嫌じゃ嫌じゃ！フィガロのところへ行くのは嫌じゃ！
	賢者のおまじないで治して欲しいのじゃ！
晶	（おまじない？もしかして……アレのことかな？）
	痛いの痛いの、飛んでいけ〜！……これのことで合ってますか？
ホワイト	まだヒリヒリするのう……。
	我の頭を撫でながらやってくれたらすぐに治ると思うんじゃが……。
晶	……わかりました。痛いの痛いの飛んでいけ〜！
ホワイト	おお！あともう一押し！次は我を抱っこしながらやるのはどうじゃ？
晶	（これはもう治っているのでは……？）
`},
{id:10634,title:"ホワイトの占い",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`ホワイト	賢者よ、ため息なんぞついてどうしたのじゃ？
晶	今日、中央の国へ出かけた時に占いをやってもらったんです。
	それが、あまりいい結果じゃなくて……。
ホワイト	ほほほ、それで落ち込んでおったのか。どれ、我がそなたを占ってやろう。
	むむむっ！……ほう、これは……。
晶	ど、どうしたんですか？やっぱり良くないことが……！
ホワイト	ほほほ。安心するのじゃ。そなたの運は、絶好調じゃ！
晶	絶好調！？でも、さっきの占いでは――……。
ホワイト	賢者よ、外を見てみるのじゃ。
晶	あ、虹だ……！雨が降っていたわけでもないのにどうして……？
ホワイト	言ったじゃろ？そなたの運は絶好調じゃと。
	人間の占い師なぞ、我から見ればみな赤子のようなもの。我の占いは絶対じゃ！
`},
{id:10635,title:"得意な魔法",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`ホワイト	賢者よ。良いところで会った。
晶	ホワイト。何かご用ですか？
ホワイト	予言が降りてきたのじゃ。
	しかし、大したものではない。耳に入れるかどうか、おぬしが決めてよい。
晶	予言って……。たしか、スノウとホワイトの予言は絶対当たるんですよね。
ホワイト	うむ。我ら、予知や占いが一番得意な魔法じゃからの。
晶	ちょっと怖いけど……、めちゃくちゃ気になるのでお伺いしたいです。
ホワイト	よかろう。
	おぬしが心密かに気になっている者が、もうすぐここを訪れる。
晶	……え！？そんなこと言われたら、
	別に気になってなくても気になっちゃうじゃないですか！？
ホワイト	誰かな、誰かな？
	おや、予言通り誰か来たようじゃ。せーの、で振り向くがよい。
晶	なんか恥ずかしいんですけど……！？
ホワイト	３……、２……、１……。
	せーの！
`},
{id:10636,title:"ホワイトを探せ！",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	ホワイト、そんな隅で何をしてるんですか？
ホワイト？	………•。
晶	ホワイト？……わっ、こっちにも！？ホワイトが二人いる……！？
ホワイト	ほほほ、それは偽物じゃよ。
	今ミチルとリケとスノウの3人でかくれんぼをしておってのう。
	スノウが鬼なのじゃが、すぐに見つからないよう、魔法で花壇の花を我の姿に変えて混乱させる作戦じゃ。
~~~~~~~~~	~~~~~~~~~
選択	すごい魔法ですね！
ホワイト	そなたはどんな魔法を見せても喜んでくれるから嬉しいのう。
	そら、ご褒美になでなでしてやろう。
晶	わっ、ホワイト……！
~~~~~~~~~	~~~~~~~~~
選択	便利な魔法ですね！
ホワイト	そうじゃろう？賢者の部屋にあるぬいぐるみを我の姿に変えれば、ひとり寂しい夜に抱きしめて眠ることもできるぞ！
晶	……その魔法の使い方、合ってます？
~~~~~~~~~	~~~~~~~~~
ホワイト	もっとたくさんの花を我の姿に変えることもできるんじゃぞ。
	《ノスコムニア》
晶	わっ！？ホワイトがいっぱい……！あれ、本物のホワイトは……？
スノウ	ホワイト見ーっけ！
どこからか聞こえたスノウの声。
気がつけばたくさんいるホワイトの中のひとりにスノウが飛びついていた。
ホワイト	やはりスノウにはわかってしまうか。
晶	すごい、どうして分かったんですか！？
スノウ	我らは二人でひとつ。本物のホワイトを見つけるのなんて朝飯前じゃ！
`},
{id:10637,title:"紋章",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	ホワイトの賢者の紋章は、首筋にあるんですね。
ホワイト	うむ。我は左側、スノウは右側じゃ。
	元はひとつずつ紋章がついておったが、我が死んだ時に、模様が半分ずつになってしもうた。
	今や我とスノウは二人でひとり。
	たまに首をくっつけて、模様を合体させる遊びが流行っておる。
晶	なかなか難しそうですね……？
	でも、北の国の魔法使いだけ五人いる理由がわかりました。
ホワイト	元は２０人の賢者の魔法使いじゃったが、
	我が死んでからは、我を入れて２１人となったのじゃ。
	〈大いなる厄災〉と賢者の魔法使いの仕組みは、あのムルが長い時をかけて調べても、未だ解明できてはおらぬ。
	いつかそなたが解き明かしてくれれば、この世での気がかりが、ひとつ減るんじゃがのう……。
晶	無理ですって言いにくい言い方して……。自信はないですが、頑張ってみます。
	でも、ホワイトがいなくなったら、すごく寂しいですよ。
ホワイト	ほほほ。可愛らしいことを言うのう。
	大丈夫じゃ。我も寂しくはあるが、そなたが異界に帰れるよう、頑張ってみるからの。
`},
{id:10638,title:"ことわざ教室",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	あ、猫が銀貨を転がして遊んでる。これはまさに猫に小判だ……！
ホワイト	猫に……？なんじゃそれは？
晶	俺の世界にあったことわざという言葉なんです。
	貴重なものでも、その価値を知らない人にとっては何の役にもたたないって意味です。
	猫は魚には飛びつきますが、銀貨の価値はわからないですよね。
	だから、そう言われているんですよ。
ホワイト	ふむ……。つまり『ミスラに超美味しい豪華なフルコース』ということじゃな！
晶	フルコース……？
ホワイト	ミスラは腹に入れば何でも同じだと思っているからのう。
	超美味しかろうが、豪華だろうが、フルコースだろうが、全く意味がないんじゃ。
晶	（なるほど……）
ホワイト	『ことわざ』とやらは面白いのう。もっといっぱい教えてもらえんかのう！ 
`},
{id:10639,title:"いつでも一緒",type:"personal",characters:["スノウ","ホワイト"],memo:"ホワイト",
text:`晶	スノウ、ホワイト！部屋から大きな音がしましたが、大丈夫ですか？
ホワイト	おお、賢者よ。心配させてしもうたのじゃな。すまなかったのう。
	本棚の高いところのものを取ろうとして、二人して転んでしもうたのじゃ。
	大したことはない。
	先ほど図書室で、レノックスがひょいと本を取る仕草が頼もしゅうての。
	ついつい、真似したくなったのじゃ。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
ホワイト	リケやクロエ、ルチルやミチル、シノなども、おやつとお茶を用意して招くと、遊びに来てくれて嬉しいのう。
	北の魔法使いたちは、我らを怖がって近付こうとせんな。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
ホワイト	本を読んだり、手慰みに水晶占いをしたりするかのう。
	されどひとりは寂しいからの。
	特別な日以外は、すぐにスノウを探しに行くじゃろうな。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
ホワイト	スノウと共に起き、互いの身支度をして、二人で体操をするのが日課じゃ。
	北の国の魔法使いは、他の国のような魔法の授業はほとんどしておらんのう。
~~~~~~~~~	~~~~~~~~~
晶	そういえば、スノウはどうしました？一緒じゃなかったんですか？
ホワイト	スノウは……、おや、転んだ拍子に頭をぶつけて伸びておるのう。
晶	そ、そんな呑気な……！スノウ、スノウ、大丈夫ですか？
ホワイト	止せ止せ。おぬしに介抱されたくて甘えておるだけじゃ。
スノウ	……ホワイトよ。せっかく賢者が優しくしてくれておるのに、種明かしが早すぎるぞ。
晶	わ……！無事だったんですね！？びっくりした……。
ホワイト	ほほほ。安心するがよい。
	我ら、殺されるようなことがない限り、滅多なことで死んだりせぬ。
`},
{id:10640,title:"空中散歩",type:"personal",characters:["スノウ","ホワイト","ムル"],memo:"ホワイト",
text:`晶	二人とも、絵の中の居心地はどうですか？
絵の中のホワイト	賢者が抱きかかえてくれているからとても心地が良いぞ。
	やはり月夜の散歩は格別じゃな。
ムル	賢者様と双子先生見ーつけた！さあ、行くよー！
晶	わっ！？ムル！？
絵の中のスノウ	これ、ムル！どこに行く気じゃ！
有無を言わせない勢いで手を引っ張られ箒に乗せられる。
そのまま物凄いスピードで空高く飛んでいくムル。
気がつけば、すぐ近くで満月が俺たちを見下ろしていた。
ムル	さあ、俺と一緒に月とダンスしよう！
	そーっれ！！高い高いー！！
絵の中のホワイト	きゃー！ 何をするのじゃ！我らを投げるでない！落ちたら危ないじゃろ！
晶	む、ムル！飛び回りながらそんなことしたら危ないですよ！
ムル	大丈夫！だって双子先生も魔法使いだから！ほら、絵になってるのに楽しそう！
絵の中のスノウ・ホワイト	きゃー！賢者ちゃんー！
晶	（確かに、なんだかんだ楽しそうだな……）
`},
{id:10641,title:"ホワイト会社",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`ホワイト	前の賢者がそなたの世界で
	我の名前と同じギルドを探しておったがどんなものなのじゃ？
晶	（ホワイト会社のことかな？えーっと、なんて説明しよう）
	そうですね……。ホワイト会社は、人に優しくて、安心できて――……
	毎日健康的に楽しく過ごせる、俺の世界の大人たちが大好きなものでしょうか？
ホワイト	なんじゃ、我のことか！
	我は優しくて、一緒にいれば安心もできるし楽しく過ごすこともできるからのう。
	つまりそなたの世界に行ったらみんな我のことが大好きになるということじゃな？
晶	……え？えっと……？
ホワイト	ほほほ。ホワイト会社か。我にピッタリな褒め言葉じゃな！
`},
{id:10642,title:"賢者の務め",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	賢者の務めとは、具体的に一体何をすればいいんですか？
ホワイト	そうじゃのう。簡単に言うと我らにとっての、道しるべになってほしいのじゃ。
晶	道しるべ？
ホワイト	月も星も出ておらぬ。真っ暗な夜道で迷うと怖いじゃろ？
	我ら魔法使いとて、どこかもわからない場所にひとりで取り残されれば怖いものじゃ。
	ゆえに、我らが道に迷ってしまったらみながバラバラにならぬよう、手を引いて欲しいのじゃ。
	されど、手を引かれるのを嫌がるものもいる。
	そんな時は夜空に輝く月となり道を照らし、進むべき方向を示してやってほしいのじゃ。
晶	……わかりました！少し不安ですが、頑張ってみます！
ホワイト	ほほほ。そなたにならできる。
	しかし、そなたとて道に迷う時もあればひとりが寂しい時もあるじゃろう。
	そんな時は我が隣で手を繋いでやろう。
	それゆえに、安心するのじゃ！いつでも我らは共にある。
`},
{id:10643,title:"モーニングコール",type:"personal",characters:["スノウ","ホワイト","オーエン","ブラッドリー"],memo:"ホワイト",
text:`ホワイト	ブラッドリーよ、起きるのじゃ！
スノウ	オーエンよ、起きるのじゃ！
晶	毎日こうやって北の魔法使いたちのことを起こしてあげてるんですか？
ホワイト	そういうわけでも無いのじゃが、
	今日は天気がいいから、あやつらに訓練でもしてやろうと思ってのう。
晶	そうだったんですね。それにしてもなかなか起きてこないですね。もしかして――。
~~~~~~~~~	~~~~~~~~~
選択	体調が悪いのかな？
ホワイト	なんと！それは大変じゃ。我らがつきっきりで看病してやらねば。
	よしスノウ、同時に扉を開けるのじゃ！
~~~~~~~~~	~~~~~~~~~
選択	寝坊しているのかな？
ホワイト	なんと！それは許せん！可愛い我らが起こしにきてやったというのに。
	よしスノウ、同時に扉を開けるのじゃ！
~~~~~~~~~	~~~~~~~~~
スノウ・ホワイト	せーのっ！
	《ノスコムニア》
ブラッドリー	っ！？なんだ！？おい、じじい！殺す気か！！
オーエン	……最悪。おまえを殺したら片割れの幽霊はどうなるのかな？試してみる、スノウ。
晶	（す、すごい音……！いったい中で何が起きてるの！？）
	あ……ブラッドリー、オーエンおはようございます……。
ブラッドリー・オーエン	…………。
ホワイト	よし、次はミスラの部屋に行くのじゃー！
`},
//ミスラ
{id:10701,title:"スポットの印象（１）",type:"personal",characters:["ホワイト"],memo:"ミスラ",
text:`晶	この辺りは綺麗ですけど自然が厳しい場所ですね。
	北の国では一般的な風景なんですか？
ホワイト	そうじゃのう。
	ここ百年ほどはだんだんと人間の数も増え、北の国にも人間が街を築くようになったが。
	大昔はどこもこんなものじゃった。
	ある意味懐かしい風景ではあるが、北の国にはこのような土地もまだまだ多い。
	この湖の周りは特に、人間が切り開くには難しい土地じゃからの。
	古代の生き物や植物がいまだ多く残っておる。
晶	ミスラみたいに、こういう何もない場所に住んでる魔法使いって多いんでしょうか。
ホワイト	ほほほ。あやつは物好きじゃよ。
晶	あ、やっぱりそうなんですね……。
ホワイト	されど、ミスラらしい土地と言えるかもしれんのう。
	世界が変わっていくことに、あやつは興味がないんじゃろう。
	強い力があれば世界や他人に己を合わせずとも、どこまでもいつまでも、ひとりで生きてゆける。
	魔法使いも、古代の動植物も、強いものは変容する必要がないからの。
	人間はそれができぬゆえ群れを作り生きておる。
	群れの中で摩擦が起きて争わぬよう、譲り合い、思いやり、助け合うのじゃろう。
晶	（たしかに、誰かの手を借りずに生きられない俺たちと、
	　誰の手も借りず生きてしまえる魔法使いとでは
	　他人と一緒にいることや、変化していくことの意味が、
	　全然違うのかもしれないんだ……。
	　魔法舎でみんなと一緒に過ごす時間を、改めて大切にしていきたいな）
`},
{id:10702,title:"スポットの印象（２）",type:"personal",characters:["オズ"],memo:"ミスラ",
text:`晶	オズから見た死の湖はどんな印象ですか？
オズ	…………。
	汚れている。
晶	汚れている……？
	湖の水は澄んでいますし、湖畔の空気や土もきれいですけど……。
オズ	ミスラが長年居座って、この土地で不安定な呪術を繰り返した。
	様々なものが交ざり合っている。
晶	交ざり合っている、ですか……。
オズ	人にとって、血や涙や汗や体液が交ざり合うのは異常だろう。同じことだ。
	この土地ほどではなくとも、ミスラ自身からもその気配がする。私はあまり好まない。
晶	それは……。初めて会った時からですか？
オズ	ミスラと初めて会った時のことを私は覚えていない。ミスラは覚えているそうだが。
晶	なんて言っていました？
オズ	…………。私が残忍で、屈辱的な思いをしたと
晶	（ミスラが屈辱的だなんて、よっぽどのことがあったんだろうなあ……）
`},
{id:10703,title:"スポットの印象（３）",type:"personal",characters:["ミスラ","ミチル"],memo:"ミスラ",
text:`ミチル	ここがミスラさんの生まれ育った場所……。
	なんだか少し寂しいところなんですね……。
晶	そうですね、何もないですし…。
ミチル	ボク、ミスラさんに大事な人なんていないって言われた時に、
	かわいそうな人ですねなんて言い返してしまったけど……。
	こういう場所でずっとひとりで暮らしていたら、
	誰かといると暖かいってことをいつ知るんだろうって思っちゃいますね……。
晶	…………。
ミチル	ボク、ミスラさんに酷いことを言っちゃったのかもしれないです。
	ミスラさんともっとおしゃべりしてみようかな……。
ミスラ	ちょっと。何を弱いもの同士でふらふらしてるんですか。
	危ないから勝手に離れないでください。
ミチル	ミスラさん……。
ミスラ	は？　別に。ほら、行きますよ。
晶	ま、待ってくださいミスラ。
	ミチルはミスラと、色々話をしてみたいんだそうですよ。
ミスラ	はあ。どんな話を？
ミチル	その……、ミスラさんはひとりで寂しくないですか？
ミスラ	寂しくないです。あなたたちがひとりが寂しいと感じるのはよくわかりました。
	だから兄弟なんですね。
ミチル	だからってどういう意味ですか？
ミスラ	ひとりじゃ寂しいから、二人で生まれてきちゃったというか。
ミチル・晶	？
ミスラ	さ、もう行きましょう。
`},
{id:10704,title:"ブレイクタイム（１）",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`ミスラ	賢者様。朽ちた小舟を見つけたんで乗せてあげましょうか。
晶	わ、本当だ。けっこう古いですね……。
	これ、沈みませんか？
ミスラ	沈んだら泳げばいいですよ。この辺りの木の枝が櫂になりそうだ。
晶	ミスラは渡し守の仕事も長かったんですよね。舟を漕ぐのが好きなんですか？
ミスラ	いえ、別に。
晶	そ、そうなんですね？なら、魔法で舟を進めたりしないんですか？
ミスラ	もちろん、出来はしますけど。
	俺たちは空を飛べるのに、それじゃあ舟に乗る意味ないじゃないですか。
晶	でも、楽しい感じなんですか？懐かしい気持ちになるですとか……。
ミスラ	まあ、そうなのかもしれません。
	……。なんなんですか、さっきから。乗りたくないんですか？
晶	そうじゃないんですが、漕ぐのが好きじゃなくても、
	舟に乗せてみたいなって気にはなるんだなと思って……。
ミスラ	だってあなた、俺のこと色々聞くでしょう。
	だから知りたいのかと思って。
晶	親切だったんですね……。
ミスラ	そうですよ。せっかく楽しませてあげようと思ったのに。
晶	お、怒らないでください！ぜひ乗せてほしいです、ミスラ。
ミスラ	でしょうね。
	じゃあ、行きますよ。
`},
{id:10705,title:"ブレイクタイム（２）",type:"personal",characters:["スノウ","ホワイト"],memo:"ミスラ",
text:`ホワイト	賢者よ、よく見ておれ。
双子は揃って輝く氷上へ歩を進めると、軽やかに湖の上を滑り出した。
大きく弧を描くように湖を滑走し、同じタイミングでふわりと舞い上がってくるくるとスピンを決めて着地する。
風を切るスピードで駆け抜けながら湖上を舞い踊り、ひらひらとはためくコートの裾は空を飛ぶ鳥の翼みたいだ。
スノウ・ホワイト	せーの！
スノウがホワイトの体を持ち上げる。
二人は氷上で美しくポーズを取ったままくるくると回り俺の目の前でぴたりと停止した。
スノウ・ホワイト	どうじゃ！
晶	すごいですね！
	俺の世界でも氷の上で滑りながら飛んだり回転したりする競技がありました。
スノウ・ホワイト	え？　人間が？
晶	は、はい……。
ホワイト	でもでも、人間は我らのように体を持ち上げて回ったりせんじゃろ？
晶	持ち上げて回ったりしてました。
スノウ	でもでも、人間は我らのように片方を放り投げて回転させたり、
	それを受け止めたりはせんじゃろ？
晶	片方を放り投げて回転させたり、それを受け止めたりもしてました。
ホワイト	じゃあじゃあ、縦３０回転なら？
晶	縦３０回転はさすがにないですね！
スノウ・ホワイト	だよね～～～！！！
ホワイト	じゃ、スノウちゃん、賢者ちゃんにやってみせてあげよっか。
スノウ	えっ、我が？
`},
{id:10706,title:"ブレイクタイム（３）",type:"personal",characters:["リケ","ミスラ"],memo:"ミスラ",
text:`晶	リケ、何をしているんですか？
リケ	ミスラに教わった占いです。
	獣の骨を焼いて、割れ目の形から、未来を読むんだそうです。
	スノウ様やホワイト様の占いほどは当たらないけれど、読み解く力がつくと言われました。
晶	読み解く力……。
	文字を読む勉強もしているのに、占いを読む力まで勉強してるなんて。
	リケは勉強熱心で偉いですね。
リケ	えへへ。賢者様、何を占ってほしいですか？
~~~~~~~~~	~~~~~~~~~
選択	金運
晶	そうですね。ええと……。
	金運を占ってほしいです。
リケ	わかりました。では、獣の骨を炭の上で焼いて……。
	出ました！思わぬ臨時収入があるそうです！
晶	わー！やった！
ミスラ	臨時収入があると出たんですか？じゃあ、これあげますよ。
	小さなマナ石の欠片です。
~~~~~~~~~	~~~~~~~~~
選択	恋愛運
晶	恋愛運を占ってほしいです。
リケ	わかりました。では、獣の骨を焼いた石の上で炙って……。
	出ました！意外な相手が誘いに来るそうです！
晶	わー！やった！
ミスラ	意外な相手が誘いに来ると出たんですか？じゃあ、俺と遊びに行きましょうよ。
~~~~~~~~~	~~~~~~~~~
選択	仕事運
晶	仕事運を占ってほしいです。
リケ	わかりました。では、獣の骨を灰の中で蒸し焼きにして……。
	出ました！仕事で大成功を収めるそうです！
晶	わー！やった！
ミスラ	仕事で大成功と出たんですか？じゃあ、今日の任務は完璧に終わらせてやりますよ。
~~~~~~~~~	~~~~~~~~~
晶	ミスラ……。嬉しいですけど、
	占いの結果に合わせて行動するのは純粋な占いじゃないんじゃ……。
ミスラ	俺が教えてやった占いが外れていいわけがありませんからね。
	ね、リケ。俺の占い、よく当たるでしょう。
リケ	はい。よく当たりました。
ミスラ	ふふん。この調子で双子の占いの的中率を超えてやりますよ。
`},
{id:10707,title:"スポットの思い出（１）",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	ルチルとミチルのお母さんは、ミスラの魔法のお師匠様だったんですよね。
	この湖で出会ったんですか？
ミスラ	そうですね。渡し守の仕事をしてたら箒に乗ってやってきたんです。
	よく喋る女で驚きました。
	それまで目にした美しいものは、景色みたいにじっと動かないか……。
	雪や鳥や獣のような素早く動くものだけだったんで。
	あの魔女はそのどちらでもなかった。
	あの頃、言葉もよくわからなかったんですよね。
	たぶん、魔法使いなのにどうして人間に従っているんだとか、そんなことを言っていたのかな。
	俺は別に、従ってるつもりはなかったんですけど。
晶	ミスラも子供だったなら、無理やり仕事をさせられているんだと思ったのかもしれないですね。
ミスラ	他にすることがなかっただけです。
	それで、彼女にどこか別の場所に連れて行かれました。
	そのまま魔法を教わったり、出掛けたり、一緒にぶらぶらして。
	それも別に、嫌ではなかったな。
	しばらくして、仕事のことを思い出したんで、帰ると伝えたら元の場所に戻してくれましたし。
	でも、彼女は驚いていたみたいですね。
晶	なんとなく想像できます。何か言われましたか？
ミスラ	変な子。って。
晶	あはは。
ミスラ	村の人間がいなくなった頃にまた再会して、また二人で出掛けて、
	湖のそばに村ができたら戻ってきて。ずっとそんな感じでした。
	俺も、湖も、この辺りの村も、あの魔女も。
`},
{id:10708,title:"スポットの思い出（２）",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	ミスラはこの湖で渡し守の仕事をしていたんですよね。
	ここでの暮らしはどんな生活だったんですか？
ミスラ	別に普通でしたけどね。今と同じで好きにしてました。
	魚や木の実があるんで食べ物には困りませんし、
	湖の中央にある島には骨がたくさんあったから色々できましたよ。
晶	色々って？
	ミスラ	家も建てられるし、道具も作れるし、呪術を覚えてからはその練習に使ったり。
	色々です。
晶	北の国は魔法使いの守護を受けている集落が多いって聞きましたけど、
	この辺りはミスラが守護してたことになるんですか？
ミスラ	守護をした覚えはありません。
	この湖のそばで暮らすことは多かったですが、俺も人間たちも、勝手に暮らしていました。
	ただ、たまに他の魔法使いがやってきて、生活の邪魔をしてくることがあるんですよね。
	その時は石にしてましたけど。移住先に魔法使いがいた時もそうしてました。
	お互いに強い魔法使いは目障りなんですよ。
	やられたらやり返してはいましたね。
晶	それだと、この辺りはもう、ミスラの縄張りってことだったんじゃないですか？
ミスラ	へえ。意識したことはなかったですけど……。
	これが縄張りなんですかね。たしかになんとなく愛着はあるかもしれません。
	村がなくなるのは別に構いませんけど、湖がなくなるのは嫌だなと思うかも。
	この景色が変わったり、二度と見れないって言われたら、嫌かもしれないですね。
	なんとなく。
`},
{id:10709,title:"スポットの思い出（３）",type:"personal",characters:["オーエン"],memo:"ミスラ",
text:`晶	オーエンは前も死の湖に来たことがあるって言ってましたよね。
オーエン	ミスラに連れてこられてね。ここは本当に退屈……。
晶	ミスラはオーエンを連れてきて何をしたんですか？
オーエン	僕が知るわけないだろ。
晶	あ、いえ……。見せたかったものがあったとか？
オーエン	見せたかったもの……。ミスラの家なら行ったよ。湖の中にある骨だらけの島。
	石を積んだ窯が外にあってさ。
	数百年使い込んでるような鉄の鍋がぶら下がってた。
晶	ワイルドな感じなんですね。
オーエン	寒くて、最悪だった。湖面は凍ってるし、椅子も冷たいし。
	それで……。
	夕陽を見た。あれは良かった。
晶	夕陽ですか？
オーエン	そう。凍った湖面に金色が跳ね返って、ここ一面が麦畑みたいになる。
	湖が凍っていて、吹雪がなくて、晴れた夕方にしか見えないんだって。
晶	へえ……。
	今の灰色の景色からは想像がつきませんが、きれいそうですね。
オーエン	眩しくて、目が痛いだけだよ。
	でも……。
	ミスラも大人しくて、僕も大人しくして、なんか……。
	殺し合ったりもしない変な時間だった。
晶	いいですね、友達っぽくて。そんな時、どんなことを話すんですか？
オーエン	何も話さないよ。
	互いの顔や瞳を見てるだけ。あと、空とか、湖とか、星とかを。
	何の意味もない時間だから、黙ってやり過ごすんだ。
	いつも、風の音を聞いて。
`},
{id:10710,title:"ミスラへの印象（１）",type:"personal",characters:["スノウ"],memo:"ミスラ",
text:`晶	スノウやホワイトも、ミスラとは古い付き合いなんですよね。
スノウ	うむ。ミスラがまだ子供だった頃から知っておる。
	あやつは賢者の魔法使いとしても長いしの。
	幼いミスラがここで渡し守をしているところを、あやつの魔法の師である魔女のチレッタが見つけたのじゃ。
	チレッタはミスラを連れて我らに報告に来た。
	共に過ごし、育ててみようと思うので、どこかで遭遇しても安易に殺さぬようにとな。
晶	その頃のミスラも、暴れん坊だったんですか？
スノウ	いいや、最初は大人しかったのじゃ。
	ミスラは己の魔力が強いことを知らずに生きておった。
	その分、強い魔法を身につけたら調子に乗るかもしれぬが、調子に乗っても殺さずいてくれと。
	先立った命乞いじゃな。
晶	それを了承してあげたんですね。子供のミスラってどんな感じでしたか？
スノウ	出会ったばかりの頃のオズに似ておった。
	いずれ脅威になると予感できる魔力を秘め、
	それでいて酷く物知らずで無垢で、何をしでかすかわからぬ危うさがあった。
	なるほど、チレッタが気に入って我らに殺さぬよう願い出るのも納得がいく。
	ひと目見てそう思ったのを覚えておる。
晶	そんなにだったんですか……。
スノウ	正直なところ、
	飽き性でいい加減な気性のチレッタには手に余るじゃろうと思うたが……。
	我らがフィガロやオズを拾い育てたように、チレッタにもミスラを可愛がり育てる権利があるのでの。
	予想通り調子に乗りに乗りまくり、やりたい放題で利かん坊のやんちゃ坊主に育ったが、
	我らも先手を打っておいたのじゃ。
晶	先手って、どんな？
スノウ	勝てるうちに何度かこてんぱんにのして、
	我らには勝てぬとトラウマを植え付け躾けておいた。
	北の国の魔法使いたちはピュアじゃからの。
	そうしておくとゆくゆく勝てるようになっても、なんとなく歯向かわぬようになるのじゃ。
`},
{id:10711,title:"ミスラへの印象（２）",type:"personal",characters:["オーエン"],memo:"ミスラ",
text:`晶	オーエンは以前からミスラのことを知っていたんですよね。
	どんな印象だったんですか？
オーエン	やだ。
	会いたくない。
	でも嫌なやつかっていうと、嫌なやつではない気がする。
	ミスラって別に嫌なやつじゃないけど、会いたくはないよね。
晶	どうしてですか？
オーエン	勝てないことが多いし、負けると殺されたりいうこと聞かせられる。
	でも最近はやたら気軽にお茶とかに誘ってくるときもある。
	あいつ僕のこと友達だと思ってるのかな。
~~~~~~~~~	~~~~~~~~~
選択	友達みたいに見えますよ。
オーエン	友達ってなにするの？友達って、殺しあったりしなくない？
晶	たしかにしないかも……。
オーエン	なら友達なんかじゃないんだよ。あと関係ないけどさ。最近、顔暗くない？
晶	ミスラがですか？眠れてないせいでしょうか。
オーエン	なんかどろっとしてる気がする。前の方がスッキリしてて好きだった。
~~~~~~~~~	~~~~~~~~~
選択	ミスラに勝ったことはありますか？
オーエン	判定勝ちなら。
晶	判定って……誰が判定するんです？
オーエン	僕だけど？
	ミスラを殺したいやつら何人かで一度に狙ったことがある。
	かなりボロボロにしてやったし、こっちは何人か生きてたし。
晶	オーエンでも誰かと結託する事あるんですね。オーエンは死ななかったんですか？
オーエン	死んだけど？何か文句あるの。
~~~~~~~~~	~~~~~~~~~
選択	一緒に暮らしてどうですか？
晶	一緒に暮らしてどうですか？
オーエン	慣れては来たけど、最初は落ち着かなかった。ミスラに限った話じゃないけどさ。
	賢者様の世界で、賢者様のこと殺しそうで怖い存在ってなに？
晶	え？そうですね……。熊とか？
オーエン	熊と一緒に住んでる感じだよ。
	熊がたまにお茶に誘ってきて、
	一緒にお茶を飲んでると、気まぐれを起こして殺そうとしてくる感じ。
`},
{id:10712,title:"ミスラへの印象（３）",type:"personal",characters:["ブラッドリー"],memo:"ミスラ",
text:`ブラッドリー	あの野郎も北の土地に戻ればもう少しシャキッとするかと思ったのにな。
晶	ミスラの事ですか？
ブラッドリー	おうよ。このところ腑抜けてやがるが前はもっと恐ろしかったんだ。
	北のミスラって言やあ知らねえヤツはいねえ。
	いつ遭遇するかもわからない世界最強で凶悪の魔物！って感じだったからな。
晶	有名人だったんですね。
ブラッドリー	初めて出会った時なんさ、ひと目惚れかってくらいに全身の血が沸き立ってよ。
	興奮したぜ。
	これがあのミスラ！強え！恐ろしい！極上の獣！！
	俺様が絶対ぶちのめす！！！つってな。
	手元に紙とペンがあったらやつの脅威を讃えたポエムを書いてたね。
晶	ポエムを……？
ブラッドリー	あいつも最近丸いよな。
	俺様的にはミスラを仕留めて最終的にオズの城を乗っ取るって算段だったんだ。
	それにあいつは変なお宝や呪術道具を収集してやがるからな。
	何度か襲ったりはしてたぜ。
晶	ミスラに勝ったことはあるんですか？
ブラッドリー	まあ。判定勝ちでな。
晶	判定って……誰が判定するんです？
ブラッドリー	俺様だよ。俺は負けたが盗賊団は勝った、みてえな。そういう事にしたがったよ。
	話してると懐かしくなってきやがるな。久々に一発仕掛けてやろうかな！
`},
{id:10713,title:"ミスラへの印象（４）",type:"personal",characters:["ルチル"],memo:"ミスラ",
text:`晶	ルチルは幼い頃にミスラと会ったことがあるんですよね。
ルチル	はい、何度か。
	ミスラさんは今と変わらず背が高くて、私はいつも下から見上げてたから、
	顔とかはあんまり覚えてなかったんですけど。
	ずっと憧れてました。空気感や、独特な雰囲気に。
	それから、私たちを守ると言ってくれたことも、大人になった今考えると、
	改めて格好いいなって思いますね。
晶	約束したことが格好いいなってことですか？
ルチル	はい。だって、覚悟が必要だったと思うんです。
	自分の人生を変えてしまうことなのに。
	ミスラさんは人生を掛けて約束を守り通すと決心したんですよね。
	そんな覚悟ができるなんて凄いなって。誠実で素敵な人なんだろうなって思いました。
晶	たしかにそうですよね。
	ミスラほど長生きで強い魔法使いが、魔力と引き換えに約束したんですから……。
ルチル	約束の相手が母様じゃなくても、約束の内容が違っていたとしても、
	たとえ、約束したことを後悔していたとしても……。
	一度でもそういう覚悟をしたってこと自体が、格好いいなって思うんですよね。
晶	なるほど……。例えば、ルチルからミスラにしてみたい約束ってありますか？
ルチル	えっ！？
	幼い頃から魔法使いは約束してはいけないと言われていたので、
	考えたことがなかったんですけど……。
	でも今、賢者様に言われてちょっと真剣に想像してみたいと思いました。
	いつか私も、そんな覚悟をしてみたいなって。
`},
{id:10714,title:"ミスラへの印象（５）",type:"personal",characters:["ミチル"],memo:"ミスラ",
text:`晶	ミチルはミスラのことどう思っていますか？
ミチル	兄様から話を聞いたことは何度かありました。
	兄様が凄くかっこいいって褒めていたから、凄い人なのかなとは思ってましたけど、会った事がなかったので実感はなくて。
晶	出会ってみてどうでしたか？
ミチル	正直……。
	北の魔法使いだなんて言うし、凄く態度が悪いし怖いし下品だし、嫌な感じの人だなって……。
	けど、ボクたちを守ろうとしてくれるところや、
	母様の約束を守ろうとしてくれてるところは、優しいのかもって思って。
晶	そうですね。
	行動が予測できないところはありますけど、言うほど怖い人だとは俺も思えないです。
ミチル	そうなんですよね……。
	この間、市場に出かける時に遭遇したら、危ないかも知れないからって言って、
	ミスラさんがついて来たんです。
	途中からボクの箒が遅いって、無理やりミスラさんの後ろに乗せられたから、暴れたんですけど……。
晶	（危なっかしい嫌がり方だ……）
ミチル	全然、箒がブレないんです。
	兄様も速くて上手いですけど、飛び方はちょっと荒いのに。
	ほとんど揺れなくて、凄く乗り心地が良くて、
	本当に魔力が強い人なんだなって思ったら、ちょっとだけ、かっこいいなって……。
晶	もしかすると、ミチルを乗せてたから特別安全運転だったのかもしれないですよ。
	荒っぽい乗り方もしていた気がします。
ミチル	……ボクに合わせてくれたとしたら、
	北の魔法使いなのに優しいところのある人なのかもしれないです。
	あっ……！かっこいいとか優しいなんて言ったこと、みんなには……、
	特にミスラさんには内緒にしてくださいね！
`},
{id:10715,title:"スポットゆかりの話（１）",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	あ……。朽ちたた小屋がありますね。この辺りも以前は村だったのかな……。
ミスラ	死の湖の周りは、ずっとそんな感じですよ。
	村ができて、滅んで、また人が集まってきて、また誰もいなくなって。
	渡し守をしていると、ある時ふと、誰も来なくなるんです。
	それで、村の人間を全員。
	死者の国へ渡し終えてしまって、俺の仕事がなくなったって気付くんですよね。
晶	そのあと、どこか別の場所へ移ったんですか？
ミスラ	そうですね。湖畔の他の村に行ったり、湖から離れて暮らしたりしていました。
	でも、しばらく経つとここの景色を思い出すんです。
	それで戻ってみると、また人間が集まって集落を作っていて。
	人間が暮らし始めると、いずれは死にますから。
	俺も渡し守の仕事をしに、この辺りに戻って来て暮らしていました。
	ずっとそんな感じです。
晶	新しく出来た村の人たちも渡し守を探してたんですか？
ミスラ	いえ、その風習を知らなかったんで、俺が教えてやりましたよ。
	意外と嫌がりましたけどね。遺体を引き渡すの。
	でもそういう決まりなんで、って言って、無理やり舟に乗せて運びました。
晶	…………。
ミスラ	今は村がないみたいですけど、そろそろまたできるんじゃないかな。
晶	村ができたら、また渡し守の仕事をしに来るんですか？
ミスラ	そうですね。気が向けば。
`},
{id:10716,title:"スポットゆかりの話（２）",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`ミスラ	魔道具を水晶の髑髏にする前は、この辺で拾った骨を使ってましたよ。
晶	そうか。ミスラは魔道具を取り替えたことがあるんでしたね。
	前の魔道具も骨だったんですか？
ミスラ	ええ。雄牛のような動物の頭の骨でした。
	大きな角が気に入って取ってあったやつです。
	この辺りは見たことない動物の骨やマナ石とはまた違った化石がよく落ちてるんですよ。
	だから、俺が生まれる前に、大きくて強い珍しい動物がたくさんいたんじゃないかと思ってるんですよね。
	そういうのを拾って、呪術に使ったりしてました。
晶	水辺だから動物が多いんでしょうか。ミスラもけっこう動物が好きなんですか？
ミスラ	いえ、別に。
	でも、そういう人が南にいますよね。鞄に入れて持ち歩いていたり……。
	あなたも見たことあるでしょう。
晶	南の人って……もしかして、レノックスのことですか？
	ミスラもレノックスが羊を連れているのを見て、いいなって思ったり、やってみたいなって思ったりするんですか……？
ミスラ	いえ。美味しそうだなって思います。
晶	（言うと思った……！）
ミスラ	オーエンも鞄から犬を出すじゃないですか。
	あれは、噛みつかれると鬱陶しいですけど、ちょっといいなと思いますよね。
晶	犬が？
ミスラ	例えば俺が鞄を持っていて、中から大きくて強いドラゴンが出て来たら、格好良くていいだろうなって思います。
`},
{id:10717,title:"北の国について",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	ミスラは生まれも育ちも北の国なんですよね。他の国にも行ったことがありますか？
ミスラ	厄災討伐で中央のあたりには毎年出向いてましたよ。
	箒で出かけるのが面倒で、空間魔法を覚えたくらいです。
	他の国なら、チレッタに連れられてたまに出かけました。観光ってことになるのかな。
晶	旅行楽しそうですね！
	それでもここで暮らしていたっていうことは、やっぱり北の国が一番好きなんですか？
ミスラ	好きですね。この国が一番活気がありますし。
晶	活気？
ミスラ	はい。
晶	活気ですか……？人も少ないのに？
ミスラ	ああ、そうか。賢者様にはわからないんでしたね。
	土地の活気です。精霊や肌触りに活気を感じるんです。相性がいいんでしょうね。
~~~~~~~~~	~~~~~~~~~
選択	西や東はどうですか？
晶	西や東はどうですか？
ミスラ	東はサラサラしてますよね。ずっと朝みたいな感じがしませんか。
	あと、人も精霊もノリが悪いですね。
晶	西はどうですか？ノリならすごくいい気がしますけど。
ミスラ	良すぎて余計なものがついてきたり、呼んでもついてこなかったりしますよ。
	西はとにかくガチャガチャで疲れます。
	まあ、どこにいても従わせますけど。
~~~~~~~~~	~~~~~~~~~
選択	南や中央はどうですか？
ミスラ	南は苦手ですよ。パサパサしてて。かと思うと蒸し暑いし。
	中央は案外居心地いいです。のんびりできます。
晶	北の国出身からすると、中央みたいな風景がのんびりって感じなんですね。
ミスラ	まあ、俺はですけど。
`},
{id:10718,title:"〈大いなる厄災〉について",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	ミスラは賢者の魔法使いになってから結構経つんでしたよね。
	どのくらい前からなんですか？
ミスラ	はあ……。千は行ってないと思いますけど、五百はすぎた気がしますね。
	生きているうちの半分くらいを賢者の魔法使いとして生きているから、
	そうじゃなかった自分はよく覚えてないですよ。
~~~~~~~~~	~~~~~~~~~
選択	ベテランですね。
ミスラ	もちろん面倒でしたけど、
	役目に逆らうと、双子や南の兄弟の母親魔女がうるさくって。
	最初はよくわからないままやっていました。
	世界を守っているって気づいたのは、百年くらい経ってからでしたね。
	双子を倒せるくらい強くなった頃に役目をサボろうとしたら、
	ようやく世界の仕組みを教えられたんです。
	襲来する〈大いなる厄災〉を迎撃して空に還せなければ、世界が滅ぶと。
~~~~~~~~~	~~~~~~~~~
選択	気が遠くなりそうです。
ミスラ	北の魔法使いは魔力が強くて一度選ばれると入れ替わることが少ないんです。
	俺より後に役目についた魔法使いも、片手で数えるくらいじゃないですかね。
	ひとりは俺が石にしてしまったんですよね。
晶	えっ。
ミスラ	何かで揉めた時につい。
	……あれ、その顔、説教する顔ですか？だったらもう帰りますけど。
晶	い、いえ……！
~~~~~~~~~	~~~~~~~~~
晶	ミスラにしては、長い間投げ出さずによくやってくれていますよね。
ミスラ	そりゃまあ、投げ出して何かあったら世界どころか俺も終わってしまうんで。
晶	〈大いなる厄災〉についてはどう思っていますか？
ミスラ	強い弱いで測れないし、よくわからないな。何なんですかね、あれは。
	強い魔法使いなら殺せば自分の力になりますけど、そういうのもありませんし…。
	物体というよりは、年に一度の行事って印象が強いかな。
`},
{id:10719,title:"死者の国へ運ぶのは",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`ミスラ	大丈夫ですか賢者様。危うく魚の餌になる所でしたね。
晶	……ッ、ゲホゲホッ……！た、助けてくれてありがとうございます……。
	い、生き物か何かが、湖から出て来て、突然、引き摺り込まれたような気がしたんですけど……。
	この湖……、綺麗だけど、やっぱり、そこそこ危ない場所なんですね……。
ミスラ	集落の規模の割に、渡し守の仕事も頻繁にありましたから。
	人間にとっては危険なのかもしれません。
	近くの村で誰か死ぬと、夜、湖畔で火を焚かれるんです。それが仕事の合図でした。
	俺はだいたい、湖の中央の島で暮らしていたんですけど、遠くに火が見えて、湖面に灯が映って揺れていて、綺麗でしたよ。
	湖が凍っている季節は、ソリに縄を繋いで引いて運ぶんですよね。
	けっこうそれが面倒で、嫌でしたね。
晶	…………。
ミスラ	氷がないときは泳げるんですけど。
	水が深くて、年中冷たくて、水底も透明で、気持ちがいいんです。
	賢者様は泳ぐの得意ですか。
	……あれ。賢者様。賢者様、聞いてます？
	《アルシム》
晶	……ッ、はあっ！！はあっ……、は……。
ミスラ	凍えてたなら言ってくださいよ。そういえば溺れてたんでしたね。
	泳げないんだ。
晶	……た、たびたびありがとうございますミスラ……。
ミスラ	いいえ。
	あなたがここで死んだら、死者の国まで俺が運ぶことになるなって考えていました。
	それはそれで、悪くなさそうですよね。
`},
{id:10720,title:"スポットにいた魔法使い",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`ミスラ	死者を船に乗せて埋葬地へ運んでいる途中で、遺体が石になったことがありますよ。
晶	石に？マナ石のことですか？
ミスラ	はい。岸で預かって、船に乗せていたら、なんだか気配が変わったことに気づいて。
	体を包んでいた布を解いたら中身が石になっていたんです。
晶	石になるってことは、その人は魔法使いだったってことですよね……。
ミスラ	そうですね。
	魔法使いの石を見たのはそれが初めてでした。
	あの石、その後どうしたんだっけな……。
	食べたのか、食べられると知っていた時の話だったか。もう覚えてないですけど。
晶	……魔法使いが石になる時って、死んでからだんだん変化していくものなんですか？
ミスラ	いいえ。命が終わった瞬間に石化して砕けます。
晶	……じゃあ、その人って、もしかして、船に乗せられた時はまだ……。
ミスラ	そうですね。
`},
{id:10721,title:"危険な場所",type:"personal",characters:["ブラッドリー"],memo:"ミスラ",
text:`晶	なんだか……、湖の中の島の方から視線を感じるような…。
ブラッドリー	ああ、あの島か。ミスラのやつはあれが死者の国だって言ってたな。
	相当たくさんの人骨が埋葬されてるんだろうよ。
	あそこに埋められた骨の持ち主たちがぼんやりこっちを見てやがる。
	あいつらにとってはあそこがあの世なのかもな。
晶	…………。
	やっぱり、死者の気配とかって本当にあるんですか…？
ブラッドリー	ある時もあるし、ない時もある。ありすぎてもなさすぎてもバランスは悪いだろうな。
晶	あの島にいるのは弔われている人たちだと思いますけど、
	何か危ないことってあるんでしょうか。
ブラッドリー	そりゃそれぞれだろ。弔われてるからこそ偉そうな気分になってるやつもいれば……。
	弔われても釈然としないまま彷徨ってるやつもいるさ。
晶	いるにはいるんだ……。
ブラッドリー	だが、あそこはミスラがだいぶ遊んでやがるからな。
	ここからでも、いろんな呪術が掛けられてるのがわかる。
	あそこにいるやつらは、自分が一体何がなんなのかよくわからねえまま、色々おかしくなってんのが多いと思うぜ。
	それでも場が汚染されずに済んでるのは、ミスラの力なのかもしれねえけどな。
晶	怖そうな場所ですね……。
ブラッドリー	ミスラに誘われてたみてえだけど、本当に行くのか？あの島。
`},
{id:10722,title:"ミスラの評判",type:"personal",characters:["スノウ"],memo:"ミスラ",
text:`晶	湖畔にあった村は今、すべて滅んでしまったんですよね。
スノウ	さようじゃ。
晶	村があった頃は村人たちとミスラはどんな風に付き合っていたんでしょうか？
スノウ	我も詳しく知るわけではないが、死者が出るたびに現れる男は、
	さぞや死神のようじゃったろうの。
	我らのように土地を守護もせず、気がむけば村に訪れ、
	時に奪い、時に人懐っこく、奔放に交さりあう。
	人間たちには理解できぬ、死者の国の住人のように思えていたのかもしれんのう。
晶	死者の国の住人ですか……。
スノウ	ほほほ。ミスラは骨や亡骸を操る魔法もお得意じゃからの。
	ある時、ミスラに恋をした娘が、ミスラとともに死者の国で暮らそうと、凍てついた死の湖に身を投げたそうじゃ。
	哀れな娘は凍えて死んでしもうた。
晶	そんな……。ミスラはどうしたんですか……？
スノウ	亡骸を船に乗せて、小島へと運んだ。いつもの渡し守りの仕事じゃ。
	我はこの娘の話が好きじゃ。
	一途で、激しく、憐れで、滑稽で、まるで、魔法使いのようじゃからの。
`},
{id:10723,title:"スポットでの名物",type:"personal",characters:["ミスラ","ルチル"],memo:"ミスラ",
text:`晶	ルチル。薬を作っているんですか？
ルチル	賢者様。ミスラさんがよくやっていたっていう呪術を教わってるんですよ。
	色々な材料を混ぜて、こうやって、ストーンミルで粉になるまで挽くそうです。
	このミルはミスラさんが昔から使っていたそうで、私もやってみたいって言ったらくれたんです。
	ちょっと嬉しくて。
晶	へえ！珍しいですね、ミスラが。粉には何が入っているんですか？
ルチル	トカゲとカエルと、ヘビの牙とフグの肝臓、ねむの木、桃の木、赤い豆、
	死の湖の土と水、鏡の破片、それからえーと…。
ミスラ	これです。教えたんだから、覚えてくださいよ。
晶	この白いのは…。
ミスラ	肋骨です。
	本当は生きてるのから取るのがいいんですけど、この辺りに人がいなかったんで。
ルチル・晶	ん？
ミスラ	すり潰したら目当ての家の前に粉を撒いて、家主が死んだら一度埋葬します。
	そうすると３日で動き出すので掘り返して……。
ルチル・晶	ん？
ルチル	この間見せてくれた、骨を操る呪術じゃないんですか？
ミスラ	は？あれはやり方が全然別で、水のあるところでやるんです。
	先に言ってくださいよ。こっちに来て。
ルチル	言ってましたよ！ミスラさん、材料はあまり怖くないものがいいんですけど……。
ミスラ	怖くはないでしょ。あっちに行きましょう。
	そうだ、この粉には別の使い方もあって……。
晶	（ミスラにしては珍しく親切な感じだ。ちょっとだけ楽しそうにも見えるし…。
	　ずっとひとりで試して覚えた術を、誰かに教えるのがうれしいのかもしれないな）
`},
{id:10724,title:"スポットでの発見",type:"personal",characters:["ブラッドリー"],memo:"ミスラ",
text:`晶	わ……。何してるんですか、ブラッドリー。水に入って冷たくないですか？
ブラッドリー	冷てえよ。賢者、これ見てみろ。
晶	貝殻？大きな牡蠣みたいだ。食べるんですか？
ブラッドリー	食いたいなら後で炙ってやる。その前に貝の蓋を開けて……。
	……よっと！
晶	わあ、身がぷりぷりして美味しそう！
ブラッドリー	おまえ、食うことばっかりだな……。だんだん、ミスラに似てきたぞ。
晶	えっ……。そ、そうですか……？貝は食べる文化だったから……。
ブラッドリー	こいつは星海貝と言ってな。貝殻の中で宝石を生むんだ。
	ほら、ここ。きれいな青い石があるだろ。
晶	本当だ……！真珠に似てるけど、半透明できれいな青い石……。
ブラッドリー	星海珠だ。真珠の百倍は値がある。
晶	すごい！
ブラッドリー	これでムルにカードの負けが精算できる。いくつか拾ったから、てめえにもやるよ。
晶	え！？いいんですか！？真珠の百倍の価値があるのに？
ブラッドリー	おう。てめえに似合いそうだからな。西の仕立て屋に耳飾りでも作ってもらえ。
晶	……ボス……。
ブラッドリー	ふふん。これからもしっかり働けよ。
`},
{id:10725,title:"楽しい場所",type:"personal",characters:["オーエン"],memo:"ミスラ",
text:`オーエン	賢者様、賢者様。早くこっちにおいでよ。
晶	なんだか、嬉しそうですね、オーエン。嫌な予感がしますが……。
オーエン	ふふ。ここの氷の板に空いた穴に、この糸を垂らしてごらん。
晶	あっ、穴釣りってやつですか？魚がとれるんですか？
オーエン	いいから、この糸を持ってなよ。
晶	見本を見せてもらえませんか？
オーエン	あ、僕を警戒するんだ。せっかく賢者様に素敵な経験をさせてあげようと思ったのに。
晶	いや、そういうわけじゃ……。
オーエン	これが王子様や騎士様の誘いなら断ったりしなかったでしょ？
	ひどいな。ああ、傷ついた。
晶	…………。
	わかりました。糸を持ちます。
オーエン	ふふ。糸を持ったら口笛を吹いて。吹けなかったら、鼻歌でもいい。
	呼ばないと来ないから。
晶	えっと……。何を呼んでるんでしょう？
オーエン	いいから早くしろよ。
晶	……絶対何かある……。
	ピー、ピー。
オーエン	…………。
晶	何も起きませんけど……。
オーエン	そんなはずないよ。ちょっと糸貸して。
晶	本当は何が起きるはずだったんですか？
オーエン	音に反応するアーチャーフィッシュがものすごい勢いで飛び出してくるんだ。
	たまに首に刺さって死ぬ。
晶	めちゃくちゃデンジャラスじゃないですか……。
オーエン	あれ……。何度、口笛吹いても来ないな。知らない間に絶滅したのかな。
晶	危ないですよ、オーエン。
オーエン	大丈夫だって。
	…………！？
	っつ…。
晶	ぎゃー！オーエン！！
`},
{id:10726,title:"マナエリア",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
	「マナエリア」と呼ぶとも聞きました。ミスラも知っていますか？
ミスラ	まあ……。魔法のことはだいたい、南の兄弟の母親魔女から教わりましたよ。
	俺のマナエリアは夜の湖です。生まれた場所のそばの。
	……そういえば、しばらく行ってないな……。
晶	そうなんですね。ミスラはどんな時にマナエリアに行くんですか？
ミスラ	どんな時もないですけど。たまに気が向いたら。
	……でも、そうですね。ちょっと今から見に行ってきます。
晶	え！？今からですか？
ミスラ	魔力の衰えを感じた時や、回復したい時に行くといいとか、
	あの人に聞いたような気がするんですよ。
	俺には必要ないと思っていましたが、もしかしたら、眠れるようになるかもしれません。
晶	なるほど……！気をつけて……、
	あ！もしもの時用に、枕を持ってくといいかもしれません！
ミスラ	はあ、どうも。
	《アルシム》
`},
{id:10727,title:"アミュレット",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	マナエリアから長く離れる魔法使いは、
	マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	ミスラもアミュレットを持ってますか？
ミスラ	まあ……。そりゃ、ありますけど。
晶	やっぱり、魔法使いには当たり前のものなんですね。
	見せてもらってもいいでしょうか？
ミスラ	はあ……。
面倒そうな素振りを隠さずに、ミスラは棚を探って脚付きの銀の盃を掴むと、
俺に差し出して見せてくれた。
水の入った盃は精巧な模様が施してある。絵画の中の神様が、酒を飲む時に使っていそうな感じだ。
ミスラ	その銀のゴブレットが俺のアミュレットです。
	湖の水を汲んで、呪術に使っていたんですよ。この水も、湖のものです。
	湖は俺のマナエリアです。長く暮らしていた場所で、長く使っていたものだから、これがいいって。
晶	誰かに教えてもらったんですか？
ミスラ	ええ。南の兄弟の母親魔女です。
晶	そうか……。
	ルチルとミチルのお母さんが、ミスラの魔法のお師匠様だったんですよね。
ミスラ	師匠というほど何かを習ったわけではないですけどね。
	本当に、たまにだけ、役に立つことも教わりました。
	かと言って、このアミュレットは、置いておいても眠れるわけじゃないし。
	効いてるのかわかりませんけど。
`},
{id:10728,title:"トカゲの声",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	ミスラ、いますか？
？？？	オズオズオズオズオズオズオズオズ
晶	！？
ミスラ	賢者様。何か用ですか？
晶	ルチルがミスラを呼んでいたので……。
	さっきから喋っているのは……そのトカゲですか？
ミスラ	はい。これに強い魔力や脅威が近づくと普告する術をかけたので、
	オズの名前を覚えさせてみました。
晶	めっちゃ喋ってますね……。
ミスラ	南の兄弟に渡そうと思ったんですが、
	ずっとあの男の名前が聞こえるのはやはり気分が良くないな。
晶	ちなみに、なんでこれにオズの名前を覚えさせてみたんですか？
ミスラ	戦闘中、オズに投げつけてみてもいいかなって。
	突然よくわからないものに名前を連呼されたら驚いて隙ができそうじゃないですか。
晶	（……ちょっとその反応を見たいと思ってしまった）
`},
{id:10729,title:"家族",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	ミスラは家族のことを覚えていますか？
ミスラ	全く覚えてないですね……。必要なかったので。
晶	何かそういうコミュニティというか……、集団に属したことって、今まで一度もなかったんですか？
ミスラ	生まれた土地には人がいましたよ。その中に、親もいたのかもしれません。
	俺は離れて暮らしてましたけど。
晶	一緒に住んでなかったってことですか？
ミスラ	ええ。
晶	…………。
ミスラ	ああ、それとも、俺を産んで死んでしまったのかもしれないですね。
	南の兄弟の母親魔女もそうでしたし。
	ある時思い立って、近くの村にいた女に、
	あなたが俺の親じゃないですかと、話しかけたことがあるんですよ。
	そうしたら、俺が生まれたのは、三代も前の昔だと言われて……。
	人間が早く死んでしまう生き物だと、そのとき初めて知りました。
晶	（三代前って、五十年くらいありそうなのに……）
ミスラ	とにかく、今が初めてですよ。朝から晩までバタバタと人の気配がする生活は……。
	退屈しないですけどね。
`},
{id:10730,title:"気分屋の日常",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	（ん？ ミスラ……。こうやって佇んでるのを見ると普通の美青年だな。
	　けだものとかＭＡＸ要注意とかには思えない……）
ミスラ	なんですか？
晶	あ……。気づいていたんですか。
	ええと、ミスラは北の国にいた頃、どんな風だったのかなって？
ミスラ	どんな風って？
晶	例えば、こう……。けだものみたいだったりしましたか？
ミスラ	直球ですごいこと聞きますね。まあ、オズにはよく言われていましたけど。
	戦い方が野蛮だとか、なんとか。
晶	野蛮……。どうしてですか？
ミスラ	泥まみれになったり、血まみれになったり、よく服を汚すからじゃないですか？
	所構わず雷を落とす男の方が、野蛮だと思いますけど。
晶	オズとはよくケンカしていたんですか？
ミスラ	そうでもないですよ。
	朝起きて、むらっと『あ、俺が世界最強になろう』と思った時に襲っていました。
晶	（すごい本能的だな……）
ミスラ	オーエンやブラッドリーも同じ感じです。
	一緒に食事したりする日もありましたが、急にむらっと『あ、仕留めよう』と。
~~~~~~~~~	~~~~~~~~~
選択	いきなり襲っちゃうんですか？
ミスラ	いきなり襲っちゃいますね。たいがい、俺が勝ちます。
晶	（めっちゃ気分屋だ……。
	　オーエンやブラッドリーがミスラを警戒するのもわかる気がする……）
~~~~~~~~~	~~~~~~~~~
選択	食事だけで終わる時もあるんですか？
ミスラ	まあ、揉めなければ。
	菓子系だとオーエンとは揉めて、肉系の食事だとブラッドリーと揉めます。
晶	（結構、北の魔法使いって、食欲に対して忠実なタイプが多いな……）
~~~~~~~~~	~~~~~~~~~
ミスラ	彼らには勝てるんですが、オズには負けっぱなしなんですよ。
	オズは規格外だからずるいですよね。
	……話してるうちにだんだん、むらっとしてきたな。
	ちょっと行ってきます。
晶	や、止めてください！ごめんなさい！！
`},
{id:10731,title:"のんびり屋さん",type:"personal",characters:["スノウ","ルチル"],memo:"ミスラ",
text:`晶	ルチルとミスラで花壇のお手入れをしているんですか？
ルチル	そうなんです。ミスラさんったら昨日、この花壇で寝ていたんですよ？
	そのせいでお花たちが潰れちゃったので、一緒に直しているところなんです。
ミスラ	こんなことしても死んだ花が生き返るわけでもないのになんの意味があるんです？
ルチル	まだ死んでいませんから！お花の生命力はミスラさんが思っているより
	ずっと強いんです。綺麗にしてあげたら、元気になるはずですよ。
ミスラ	はあ。そうなんですか。
ルチル	もっとやる気を出してくださいよ！それにしても、
	お花に囲まれて寝たいだなんてミスラさんも可愛いところがあるんですね。
ミスラ	だって、花の匂いを嗅ぐとリラックスするって、あなたが言っていたんじゃないですか。
晶	それで花壇の中で眠れるか試したんですか？
ミスラ	何か問題でも？
ルチル	もーミスラさんはのんびり屋さんなんだから。
	次、花壇の中で寝たら立ち入り禁止の看板をつけちゃいますからね！
`},
{id:10732,title:"暇つぶし",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`ミスラ	それ、前の賢者様の賢者の書ですか？俺のことも、何か書いてあるんですか。
晶	ミスラが興味持ってくれるなんて珍しいですね！
	ミスラのことはもちろん、他の魔法使いのこともたくさんあるんですよ。
	例えば、ええと……。
	『俺が考えた魔法舎最強の打線。1番ミスラ。4番オズ』
	（何これ……）
ミスラ	打線ってなんですか。
晶	えーと、野球の……、あっ、俺の世界に野球っていう競技があるんですけど、
	それの、出番の順というか……。
ミスラ	出番⋯⋯。へえ、オズより俺が先なんですね。気分いいですよ。
晶	これはあの……。1番だからいいというものでもなくて……。
ミスラ	前の賢者様、案外話がわかるじゃないですか。もう居ませんけど。他には？
晶	他は、えーっと……。
	『俺が考えた最速の鬼退治。桃太郎、オズ。おじいさんとおばあさん、双子』
	（速そう……）
ミスラ	桃太郎って？なんだか間の抜けた語感でいいですね。
	まるで桃から生まれたみたいですよ。
晶	ええっと……。
	（前の賢者様、暇な時間も相当多かったんだな……）
`},
{id:10733,title:"特別な味覚",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	ちょっと目離した隙に焦がしちゃった……。
	こっちの食材で作る料理もなかなか慣れないな。
	（残念だけどこれはもう食べられないか。勿体無いけど捨てよう……）
ミスラ	いい匂いがしますね。
晶	あ、ミスラ。いい匂い……。
	これでしょうか。角煮っぽいものを作ったんですけど、失敗してしまって。
ミスラ	問題ありません。捨てるなら俺が食べますよ。
晶	ちょっと、ミスラ……！
ミスラ	いただきます。
晶	（そのまま手づかみで食べた！）
	あ、あんまり美味しくないと思うので、無理はしないでくださいね。
ミスラ	美味いですよ。賢者様は食べないんですか？
晶	はい……。けどミスラに喜んでもらえたならよかったです。
ミスラ	そうですか。それでは遠慮なく。
晶	（お腹壊さないといいけど……）
`},
{id:10734,title:"兄弟話",type:"personal",characters:["ミスラ","ルチル","ミチル"],memo:"ミスラ",
text:`晶	わあ、虹色のカエルだ……！すごく綺麗ですね！
ミチル	はい、森を散歩してたら見つけたんです！この子、魔法舎で飼えないでしょうか。
	誰か生き物に詳しい人は……。
ミスラ	《アルシム》
ミチル	あっ……。
晶	カエルが消えた……。
ミチル	ミスラさん……！カエルさんを返してください！
ミスラ	あなたが拾ってきたんですか！？ああもう、勝手に死なれたら困るんですよ……。
晶	死ぬ……？それってどういう……。
ミスラ	こいつです。これは牛一頭殺せるぐらいの猛毒を吐きます。迂闊に触ると死にますよ。
ミチル	ええ！そ、それは知らなかったです……。
晶	危ないところでしたね……。ありがとうございます、ミスラ。
ルチル	賢者様、ミチル！見てください、虹色のカエルを見つけました！
	この子、魔法舎で飼えないでしょうか？
ミスラ	……触るなって言ったばかりでしょう！
	よく似た兄弟なのもいい加減にしてくださいよ！
	ルチル	？ 
`},
{id:10735,title:"得意な魔法",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	ミスラは空間移動の魔法が得意でしたよね。
	魔法を発揮しやすい環境とか、力の入れ方とかはあるんですか？
ミスラ	ああ……。あまり気にしてこなかったんですが、最近、思い当たったことがあるんですよね。
	たぶんですけど、めんどくさいと思う度合いが強いほど、魔力が強くなる気がします。
晶	面倒臭さですか……！？
ミスラ	オズに勝てないのもそのせいかもしれません。さすがにやる気を出してるので。
	もっと鬱陶しくなるくらい向こうから絡んで来てほしいですよ。
	そうしたら、勝てるんじゃないかな。
晶	なるほど……。じゃあ、ウザ絡みの方向性でお願いすれば、ミスラに強い魔法を使ってもらえるんですね。
ミスラ	なんですか？ ウザ絡みって。
晶	ね～、ミスラさ〜ん。
	お得意の空間移動魔法で、一番遠いところまで連れてってくださいよ〜。
	ウェイウェイ！
ミスラ	…………。
	《アルシム》
晶	あっ！　空間の扉が！
	ここは……、海！？
ミスラ	大陸を越えて海の真ん中に出たみたいですね。強い魔力が使えたようです。
	やっぱり、予想が当たったな。
	じゃあ、放り投げていいですか？
晶	俺をですか！？待ってください！ちょっと試してみただけなんです！
	すみません……！ 
`},
{id:10736,title:"便利な魔法",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	ミスラの空間移動ってめちゃくちゃ便利そうですよね。
ミスラ	なんですか急に。
晶	それってどこにでも繋げられるんですか？
	遅刻しそうなときとか羨ましいなと思って……。
	箒いらずですよね。
ミスラ	箒に乗るよりこちらの方が早いですから。多少魔力は使いますけど。
晶	確かに、ミスラが箒に乗ってるイメージってあんまりないですね。
ミスラ	まあ、俺は遅刻なんてしませんけど。
晶	えっ……。もしかして、ミスラは意外と時間に律儀なタイプだったりするんですか？
ミスラ	誰かに時間を決められたところで、関係ありません。俺は好きに行動するだけです。
	それで怒る奴なんて黙らせてやればいいだけでしょう。
晶	…………。
ミスラ	なに変な顔してるんですか？
`},
{id:10737,title:"紋章",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	賢者の魔法使いには、目印になる賢者の紋章が身体に現れるって聞きました。
	ミスラの紋章はどこにあるんですか？
ミスラ	左足の付け根の上というか、下っ腹というか、この辺りに……。
晶	うわっ！けっこう際どい所にあるんですね……。
	あの、脱がなくて大丈夫です！
ミスラ	はあ、そうですか。
晶	急にそんな所に紋章が出て来たら、驚きませんでしたか？
ミスラ	驚きましたし、嫌でしたね。魔法で消そうとしても消えなかったので諦めましたけど。
	呪いでもないし、意味がわからなくて無視してたら、しばらくしてあの双子が来たんです。
	それで賢者の魔法使いになったと説明されて、
	〈大いなる厄災〉の討伐に協力するようにと言われて、断りました。
晶	断ったんですか？スノウとホワイトはなんて？
ミスラ	なんても何も。有無を言わさずボコボコにされましたよ。
	あの時は二人とも生きてて、魔力も最盛期で、全く歯が立ちませんでした。
	死にかけましたよ。
	思い出したら腹が立って来たな……。夜になったら嫌がらせに行ってきます。
晶	やめてあげてください……。
`},
{id:10738,title:"安眠を求めて",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	（あれ？ドアが重い……）
ミスラ	ちょっと、痛いんですが。人の体を無理やり押しのけないでください。
晶	ミスラ……！？どうしてそんなところで寝てるんですか？
	（ちょうど扉の前に横になってる……。これじゃあドアも開かないはずだ）
ミスラ	寝心地のいい場所を探していたんです。
	はあ、せっかく新しい寝床を試していたのに……。
晶	す、すみません。でも、床はあまりおすすめできないと思います。
ミスラ	何故です？やってみないとわからないじゃないですか。
	俺は寝られればなんだって良いんですよ。
晶	（切実だな……）
	ミスラ、とりあえず起きましょう。寝るんだったら屋根の上はどうですか？
	昨日寝転がってましたよね。
ミスラ	あれはオズにやられたので違います。気を失って、気づいたらあそこにいました。
晶	そ、そうだったんですか。てっきりお昼寝してるのかと……。
ミスラ	安眠とは程遠いものでしたよ。
	せめて気持ちよく眠れたら良かったのに、まったくあの役立たず……。
晶	（やさぐれてしまった……）
`},
{id:10739,title:"過激な虫退治",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	ミスラ！部屋から大きな音がしましたが、大丈夫ですか？
ミスラ	はあ……。なんか、虫が出たんで。
晶	虫退治でそんな音します……？魔法舎のこと、壊さないでくださいね。
ミスラ	俺の知ったことじゃないですよ。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
ミスラ	ここ最近は、なんとか眠れないか色々試していますよ。
	お茶を飲んだり、羊を数えたり。他は、特に何もしません。魔法舎は退屈です。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
ミスラ	別に呼んだりしてませんけど、たまにスノウとホワイトがやって来て面倒臭いです。
	あと、ルチルもそうかな。
	北の国では、俺の住処に勝手に入って来る魔法使いなんていなかったんですけどね。
	一度、痛い目を見て、身の程をわきまえさせた方がいいのかもしれません。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
ミスラ	決めてませんね……何をしたところで眠れないですし。
	適当です。腹が減ったら食堂に行きます。それくらいかな……。
~~~~~~~~~	~~~~~~~~~
ミスラ	せっかくうとうとしていたのに、羽音が気になって起きてしまいましたよ。
	苛々するな……。
晶	それで癇癪を起こしてたんですね……。
	虫除けが作れないか、誰かに頼んでみましょうか。
ミスラ	はあ……、できるならとっとと……。
	……あ、ちょっと、そこを動かないでくださいね。
	あなたを殺すとみながうるさいので。
晶	え？なんですか？
	……もしかして虫ですか！？ま、待って！こっちに向かって魔法を撃ったりしな……。
ミスラ	《アルシム》
`},
{id:10740,title:"団結の理由",type:"personal",characters:["ミスラ","オーエン"],memo:"ミスラ",
text:`ミスラ	そこに人形を置きます。場所は確保してください。
オーエン	あんまり大きく描くとバレるだろ。このくらいでいいんじゃない。
晶	ミスラ、オーエン。二人で何をしているんですか？
オーエン	賢者様、やあ。
ミスラ	もうすぐオズの魔法が使えなくなる時間なので、魔法陣を張って罠を作ろうかと。
晶	罠ですか……。それはこんな廊下のど真ん中に作っても大丈夫なものなんですよね？
オーエン	知らない。間抜けなやつは引っかかるんじゃない？
ミスラ	あんまり近寄らない方がいいですよ。
	オズが引っかかる前に効果がなくなったら意味がないですから。
晶	えぇ……。
ミスラ	……あ、ちょっと。そこ曲がってますよ。ちゃんと描いてください。
オーエン	うるさいな。それならおまえがやれよ。
ミスラ	嫌ですよ。その姿勢腰にくるじゃないですか。
晶	（この二人、なんだかんだ仲良いんだよなあ）
`},
{id:10741,title:"骨の在り処",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`ミスラ	…………。
晶	ミスラ、こんにちは。何か探しものですか？
ミスラ	そんなところです。以前この辺りに呪術用の骨を埋めたので掘り返していました。
	部屋に置き場がなかったので。
	ただ、なかなか見つからないんですよね。賢者様、暇なら手伝ってくださいよ。
晶	そんな犬みたいなことを……。何か目印とかはないんですか？
ミスラ	そうですね…………、あ。
	《アルシム》
晶	え？なんで魔法……。
	（足元の土が盛り上がって……何か出てきた！？）
	ミスラ、なんですかこれ……！めっちゃ暴れてますけど！
ミスラ	見つかりました。ただ、賢者様が頭の上に乗ったことを怒っているようです。
晶	うわ、なんで俺を追いかけて……。た、助けてくださいミスラ！
ミスラ	あはは。
`},
{id:10742,title:"羊を数えて",type:"personal",characters:["⑦"],memo:"ミスラ",
text:`晶	わあ、レノックスの羊がたくさん。
ミスラ	放牧の時間らしいですよ。好き勝手歩き回って呑気なものですね。
晶	なるほど、癒されますね……。ミスラは見学ですか？
ミスラ	……羊を数えたら眠れるらしいと聞いたので。
晶	ああ……。
ミスラ	この間、南の国の牧場まで行って数えてみたのですが、逆に目が冴えてしまいました。
晶	本気でやるものじゃないですよ。リラックスしながらゆっくり数えるんです。
ミスラ	はあ……。まあ、やってみます。
晶	はい、ぜひ。俺も少しゆっくりしたいので、ご一緒してもいいですか？
ミスラ	どうぞ。好きにしてください。
晶	じゃあ、お隣失礼しますね。よいしょ。
ミスラ	………………。腹が減りましたね……。
晶	食べちゃダメですよ……。
`},
{id:10743,title:"機嫌を直して",type:"personal",characters:["北"],memo:"ミスラ",
text:`晶	みなさん、おやつができましたけど食べますか……って、あれ？
ミスラ	…………。
スノウ	よかったのう、ミスラちゃん！賢者が来てくれたようじゃ。
ホワイト	よかったのう、ミスラちゃん！賢者よ、遠慮せずこちらに来るがよい。
晶	み、ミスラはどうしたんですか？ソファにうずくまったりして。
~~~~~~~~~	~~~~~~~~~
選択	具合でも悪いんですか？
ミスラ	見ればわかるでしょう。毎日眠れなくて、尋常じゃなく辛いんです。
~~~~~~~~~	~~~~~~~~~
選択	お腹が空いてるんですか？
ミスラ	馬鹿にしてるんですか？あなたを潰してやってもいいんですよ。
~~~~~~~~~	~~~~~~~~~
ブラッドリー	こいつ、ずっと眠れてねえからって、ぐずってんだよ。
	俺より年上のくせにガキみてえだよな。
晶	えーっと。つまり、機嫌が悪いミスラをみなさんであやしてたってことですか？
スノウ・ホワイト	うむ、大正解じゃ！
オーエン	賢者様を四角に固めて枕にしてみたら。きっとよく眠れるんじゃない？
	間抜けな寝顔を見ててあげるよ。
ミスラ	うるさいな。今ここであなたを刻んで枕にしてあげましょうか。
晶	もう、喧嘩しないで！おやつでも食べて、みなさん機嫌を直してください！
`},
//オーエン
{id:10801,title:"スポットの印象（１）",type:"personal",characters:["ブラッドリー"],memo:"オーエン",
text:`晶	綺麗だけど、怖いところですね。夢を見る毒の森なんて……。
ブラッドリー	確かに、酔っ払って眺めるぶんにはいい景色かもしれねえが。
	ここは死人が多すぎて、踊り出す気にもなんねえな。
	半分墓場みてえなもんじゃねえか。
晶	確かに、ミステリースポット的な感じかもしれませんね……。
ブラッドリー	なんだよ、ミステリースポットって？
晶	ええと、幽霊が出るとか、怖い噂があるところのことです。
	出かけて行って、肝試したりとか。
ブラッドリー	ははあ、肝試しね。俺も、オズの城に何度も忍び込んだぜ。
	見つかる度に殺されかけたけどな！
晶	そんなピンポンダッシュみたいなことしてたんですか……？
ブラッドリー	なんだ？ピンポンダッシュって。
晶	ええと……、家の呼び鈴を鳴らして、住んでる人が出てくる前に逃げる悪戯です。
ブラッドリー	なんでわざわざ呼び出して逃げるんだ。戦わねえのか？
晶	ええと……。
`},
{id:10802,title:"スポットの印象（２）",type:"personal",characters:["カイン"],memo:"オーエン",
text:`カイン	ここはゆめかわいくて、綺麗なところだな、賢者様。
晶	ゆめかわいいって言葉、知ってるんですね！？
カイン	ああ。前の賢者様に教わった。
晶	……でも、本当ですね。
	この世界では色々なことが起こりますけど、ここは特に、幻想的な場所です。
カイン	俺たち魔法使いにとっても同じさ。
	さっき、そこの浮いてる石を見てたら、急に光が強くなって来て、あたり一面真っ白になっちまった。
	そうしたら、なんだか楽しくなって来て、石を抱いたり、撫でたりしてたら、突然、オーエンに殴られた。
	ここの森、毒が出てるらしいな。
晶	知らなかったんです……！？だ、だ、大丈夫なんですか！？
カイン	ああ、もうなんともない。
	俺だって魔法使いだしな。少しなら、楽しくなるだけみたいだ。
	オーエンが正気に返してくれたらしい。
	テンション高くなってて、その後のことはよく覚えてないんだが。
晶	そういえば、さっきから姿をみないような……。
カイン	なんかしたかな？俺。
晶	（もしかして、カインが石だと思ってハグしてたのは、
	　本当はオーエンだったんじゃないのかな……）
`},
{id:10803,title:"スポットの印象（３）",type:"personal",characters:["ヒースクリフ"],memo:"オーエン",
text:`晶	ヒースクリフは、北の国には来たことがあるんですか？
ヒースクリフ	まさか……。こうして賢者様の魔法使いになるまで、北の国に行こうなんて考えたこともありません。
	北は恐ろしい魔法使いが多くて治安も悪いし、地形的にも入りにくくなっていて、たいていの人は近づいたりしないんですよ。
晶	そうなんですね……。
ヒースクリフ	……だけど……、北の国にこんな幻想的な場所があるなんて、思ってもみなかったです。
	東の国でも、中央の国のようでもなくて。
	でも、綺麗すぎて怖いところは、北の国らしい風景といえば、そうなのかも。
晶	スノウやホワイトも、ここは特に幻想的だって言ってました。
ヒースクリフ	美しい森ですけど、禍々しい気配も感じます。
	一人だったらきっと、立ち入ったりはしなかったな……。
	オーエンが、この景色を気に入ってるって聞いたのは、やっぱり意外でしたけどね。
`},
{id:10804,title:"ブレイクタイム（１）",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	こんなに幻想的で綺麗な森なのに、木々が夢見る毒を出してるなんて信じられないな……。
オーエン	興味あるの？
晶	え？
オーエン	毒で見る夢に興味あるなら、守護を解いてあげる。自分で試してみればいいよ。
	《クーレ・メミニ》
晶	えっ……！？そんなつもりじゃ……！オーエン、待っ……、む……むぐぐ……！
オーエン	あはは！息を止めてるの？面白いなあ。そんなの無駄だよ。
晶	…………！
オーエン	《クアーレ・モリト》
晶	は……っ、はあ……っ！
	ど……、どうしよう……、ちょっと吸っちゃった……。
	俺……死んじゃうんですか……？
オーエン	さあ。少しくらい大丈夫じゃない？
晶	ひどい……。
	……、うわ……。視界がモフモフしてきた……。
	あ……、でも……、ちょっと気持ちいいのかも……？
	あは……、ははは……。
オーエン	あはは。賢者様、掴まって。こっちこっち。
晶	わぁ……。あはは……。徳川埋蔵金だ～……。
`},
{id:10805,title:"ブレイクタイム（２）",type:"personal",characters:["スノウ"],memo:"オーエン",
text:`スノウ	いつ見ても、幻想的な光じゃ。
	美しいものほど危険が潜んでおるというがそれを体現するような森じゃのう。
晶	本当ですね……。
スノウ	これは……。お絵描きタイムじゃな。
晶	お絵かき？
スノウ	うむ！ステンドグラスのイメージが湧きそうじゃ。景色をスケッチするのじゃ。
晶	そうか、スノウとホワイトはステンドグラス職人なんですよね。
スノウ	《ノスコムニア》
晶	あっ、紙と絵筆が出てきて勝手に動き出した……。
スノウ	何かリクエストはあるかの？
~~~~~~~~~	~~~~~~~~~
選択	虹色に光る石。
スノウ	うむ。雪はこの国のどこにでもあるが、
	不思議な石の光が反射して、特別美しく彩られておるな。
~~~~~~~~~	~~~~~~~~~
選択	森の毒。
スノウ	ほう。目に見えないものを描くこともまた、創作の醍醐味じゃな！
~~~~~~~~~	~~~~~~~~~
選択	似顔絵。
スノウ	この流れで似顔絵を要求するとは……。
	おぬしのそういうところ、好きじゃよ。
~~~~~~~~~	~~~~~~~~~
[さらさらさら……]
晶	わ、スノウ、上手ですね！？
スノウ	我ら、めっちゃ暇じゃからの。練習する時間はいくらでもあるのじゃ。
`},
{id:10806,title:"スポットの思い出（１）",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	オーエンはここで死にかけたことがあるんですよね。
オーエン	は？死にかけたんじゃないよ。死んじゃったんだよ。
晶	（そこ大事なんだ……？）
	その時の、夢の森の毒で見る夢って、どんなものでしたか？
オーエン	……さっきからなに？余計なところをいちいち突っついてさ。
晶	す、すみません……気になって……。
オーエン	夢なんて、見てる時は楽しい気がしても、醒めると虚しい。
	だからいちいち覚えていないけど。
	……馬に乗って、剣を振るっていたような気がする。魔法の方が便利なのに。
	本当、夢なんて馬鹿みたいだな。
`},
{id:10807,title:"スポットの思い出（２）",type:"personal",characters:["⑧"],memo:"オーエン",
text:`オーエン	この辺りでフィガロに会ったことがある。
晶	え？ここって……、夢の森でですか？
オーエン	そう。死にかけた子供を連れてたよ。よくある森の使い方だ。
	魔法でも助からない病気だって。
	子供は森の毒で、幸せそうな笑い声をあげてた。
	それで、だんだん疲れて、死んだ
晶	…………。
オーエン	可哀想だっていうなら、早く殺してやればいいのにね。
	賢者様ならどうしたい？
晶	え？
オーエン	きみが死にそうになった時。すぐ殺して欲しい？ここに連れてきて欲しい？
	仲間が死にかけた時は？すぐ殺したい？ここに連れてきたいの？
晶	俺は……。
オーエン	決めておいてよ。きっと希望と逆のことをしてあげる。
`},
{id:10808,title:"スポットの思い出（３）",type:"personal",characters:["ブラッドリー"],memo:"オーエン",
text:`ブラッドリー	昔、致命傷を負った部下で、夢の森に連れてってくれって言ったやつがいたっけな。
	馬鹿言ってんじゃねえ！って殴って止めたが……。
	結局死んじまったから、連れて来てやりゃよかったかもな。
晶	…………。
ブラッドリー	でも、生かしたかったんだよなあ。
	おまえならどうしてた？
晶	雑談にしては重い話題ですね……。
~~~~~~~~~	~~~~~~~~~
選択	わからない。
晶	わかりません……。その時にならないと……。
ブラッドリー	はっきりしねえな。ちゃんと考えて決めておけよ。
	魔法舎にはてめえに従おうとするやつらがいるんだからな。
	俺はそんな死に方、絶対に御免だぜ。覚えておけよ、賢者様。
~~~~~~~~~	~~~~~~~~~
選択	連れて行かなかった。
晶	俺も、連れて行かなかったと思います。
ブラッドリー	だよな。俺も最後の一瞬まで、生かしてやれる手立てを考えたいんだよ。
	おまえとは気が合うぜ。
~~~~~~~~~	~~~~~~~~~
選択	連れて行った。
晶	本人の希望なら、連れて行ったと思います。
ブラッドリー	マジかよ。ガキならそれでいいかもしれねえが、俺は御免だな。
	俺がそんなこと言い出した時は血迷ってるだけだから止めてくれよ。
	万が一、生きれるかもしれねえんだし。
	頼むぜ、賢者様。
`},
{id:10809,title:"オーエンへの印象（１）",type:"personal",characters:["スノウ"],memo:"オーエン",
text:`晶	毒の森とはいえ、自然の多い場所はやっぱり元気になる感じしますか？
スノウ	自然の力は得られるが、毒から身を守る必要もあるからの。
	そちらに魔力を使って、どっこいどっこいじゃ。プラマイゼロで、普通じゃな。
晶	そうですか……。
	オーエンは夢の森を気に入ってると言っていたから、みなさんはどうなのかなと思って。
スノウ	ふむ……。
	我ら魔法使いは心で魔法を使う。
	ゆえに自然を好み、心穏やかになる場所が好きなものじゃ。
	じゃが、オーエンは悪意や恐怖から力を得る。
晶	オーエンだけがそうなんですか？
スノウ	そうじゃ。特異体質や、突然変異の類じゃろう。
	普通はそんなものばかり浴びておったら気が狂ってしまうはずじゃが……。
	あるいはもう、とうの昔におかしくなっているのかもしれんのう。
`},
{id:10810,title:"オーエンへの印象（２）",type:"personal",characters:["ホワイト"],memo:"オーエン",
text:`ホワイト	賢者よ。オーエンとはぐれたのか？
晶	はい……。見失ってしまって。
ホワイト	そのうち戻って来るじゃろう。あやつは気まぐれで、しがらみがないから怖ろしい。
晶	ホワイトも、オーエンが怖いんですか？
ホワイト	そうじゃ。オーエンは玩具で遊ぶように人や他の魔法使いと付き合うておる。
	誰ともしがらみがないから怖ろしいのじゃ。
晶	しがらみ、ですか。
ホワイト	オズやミスラでも多少のしがらみはある。
	しがらみがあればそこを突いて少しくらいは従わせることができよう。
	オーエンにはそれがない。力でしか抑えることができぬ。
	そこがあやつの怖ろしいところじゃ。
晶	力が逆転したら、誰も逆らえなくなってしまうってことですね。
ホワイト	その通り。目を奪ったカインのことは少しばかり気にしておるようじゃがの。
	おぬしがオーエンのしがらみとなるよう、我ら、期待しておるからの。
晶	……荷が重すぎる気がします……。
`},
{id:10811,title:"オーエンへの印象（３）",type:"personal",characters:["ミスラ"],memo:"オーエン",
text:`晶	ミスラはオーエンについてどう思っているんですか？
ミスラ	どうって……。別にどうとも。
晶	な、何かありませんか？
	親睦を深める意味合いもあって、みなさんで討伐に来ています。
	…………。
ミスラ	はあ……。オーエンねえ。明るいですよね、彼。
晶	明るいですか……！？性格の話ですよね！？
ミスラ	よく笑ってるじゃないですか。
晶	それはそうですけど……。
ミスラ	オズは陰気ですよね。
晶	陰気っていうのかな……。
ミスラ	オーエンはいつもニコニコしてて、話しかけやすいなって思ってますよ。
	少なくとも、オズよりは社交性がありますね。
`},
{id:10812,title:"オーエンへの印象（４）",type:"personal",characters:["ブラッドリー"],memo:"オーエン",
text:`晶	ブラッドリーは、オーエンのこと、どう思ってます？
ブラッドリー	気持ち悪い。怖い。
晶	身も蓋もないですね……。
ブラッドリー	何を考えてるか全然わからねえ。
	ミスラとなら、まだガッツで当たれるが、オーエンは一番やり合いたくねえ。
	最悪だぜ。
晶	でも、戦ったことあるんですよね？
ブラッドリー	ああ。ちょっと因縁つけて、怒ってんのかな……とは思ったが、仕掛けて引くわけにいかねえだろ。
晶	勝ったんですか？負けたんですか？
ブラッドリー	逃げた。
晶	意外と、逃げ出して悔しいとかはないんですね……。
ブラッドリー	はあ？当たり前だろ。死んだら勝てねえんだから。
	鹿だろうと馬だろうと、自分は卑怯だって思いながら逃げるわけねえだろうが。
	そんな馬鹿なこと考えるのは人間だけだぜ。
晶	確かに……。
`},
{id:10813,title:"オーエンへの印象（５）",type:"personal",characters:["カイン"],memo:"オーエン",
text:`晶	カインはオーエンと因縁がありますけど、オーエンのこと、どう思ってるんですか？
カイン	オーエンは厄介で、悪いやつだ。目玉も取られたし、恨みもある。
	だが、なんかイマイチ掴みどころがなくてな……。
晶	それは、確かに……。
カイン	だろ？俺が怒っても叱っても、面白がるだけで、なかなか話も進まない。
	悔しいが、今はまだ、あいつの方が強いしな。
~~~~~~~~~	~~~~~~~~~
選択	いっそ仲良くなってみては？
カイン	目玉を盗られたまま仲良くなんてのは、媚じゃないか？
	負け犬っぽく思えちまって、どうにもな……。
晶	やっぱり難しいでしょうか……。
カイン	あんたが心配してくれる気持ちは受け取っておくよ。
	だが、あいつが盗ったものをきっちり返してからだな。友達になれるのはさ。
~~~~~~~~~	~~~~~~~~~
選択	いつかやり返したいと思いますか？
カイン	以前までは、そう思っていたんだが……。
	今はあいつも、晶の魔法使いだ。あんたの役に立ってることは感謝してる。
晶	カイン……。
カイン	まあ、目玉だけはいずれ取り返すさ。他のことは、その後だな。
`},
{id:10814,title:"スポットゆかりの話（１）",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	どうして、この森の木々だけ毒を出すんでしょうか……。
オーエン	この前、力の強い魔法使いがこの辺り一帯を滅ぼしたって話をしたよね。
	その時使った魔力が強すぎて、全部がぐちゃぐちゃに混ざっちゃったんだって。
晶	それは……やばそうですね……。
オーエン	僕は見ていたかったな。どんな気分だと思う
	きみの半分くらいぐちゃぐちゃにして試してみてもいい？
晶	か、勘弁してください……。
オーエン	ふふ……。
	とにかく、僕が初めて来た頃は、まだ若くて小さな毒の森だったんだ。
	その時から、ちょっと懐かしい感じもするんだよ。
`},
{id:10815,title:"スポットゆかりの話（２）",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	あれ……。あの木の上の方、何か引っかかってませんか。
オーエン	ただの水筒だろ。旅人か商人の忘れ物じゃない。
晶	水筒！？どうしてあんな場所に……。
オーエン	雪の深い夜は、あのあたりまで雪が積もる。
	そこで冷え込むと、雪が堅くなって、朝のうちだけ雪の上を渡れるんだ。
	その時は木々の毒も薄い。
	魔法が使えないけど森を越えたいやつが夜明けから慌てて走っていくのさ。
	僕はそいつらの足留めをするのが好きだよ。
晶	通せんぼするんですか……？
オーエン	まあ、話しかけたり、魔法で道をわからなくさせたりね。
	日が昇って暖かくなってくると雪が溶けて歩けなくなる。
	毒も元通り溢れ出してくるし。
	相手がそれに気づいて、焦るところを見るのが好きなんだ。
晶	（オーエンが敵じゃなくてよかった……）
`},
{id:10816,title:"北の国について",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	北の国の魔法使いは、やっぱり、北の国が好きだから、ここにいるんですか？
オーエン	変な質問。
晶	すみません……。雪深くて険しいし、住みにくそうだなとも思うので……。
オーエン	それは人間だからだろ。寒いのは慣れたし、魔法があるから関係ないよ。
	でもまあ、よその国に行ったあとは、戻って来てよかったなとは思う。
	よその国は、朝、暗い感じがする。
晶	暗いですか……？
	雪が降って積もってると、陽を反射するから、そんなふうに思うのかもしれませんね。
オーエン	北の国は埋まってるマナ石も多いし、神秘の力が濃いから、強い魔法使いが集まってくる。
	他のやつらも、そんな理由じゃない。別にいいところでもないけどね。
晶	（そういうけど、なんとなく、魔法使いは住んでる土地に愛着を感じてる気がするな……）
`},
{id:10817,title:"〈大いなる厄災〉について",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	オーエンにとって、〈大いなる厄災〉はどんな存在なんですか？
オーエン	どうでもよかった。賢者の魔法使いになんて選ばれて、面倒臭すぎる。最悪だよ。
晶	最悪ですか……。
オーエン	今はオズがいるんだから、
	あいつが〈大いなる厄災〉をやっつけて壊してくれればいいのに。
	出来ないなんて役立たずだ。
晶	ま、まあまあ……。次の戦いも、みなさんで力を合わせて頑張りましょう。
オーエン	言われなくても、世界が滅びたら困るからやるけどさ。
	〈大いなる厄災〉もずっとひとりでいるから、こっちに寄って来ちゃうんじゃないの。
晶	ひとりで？どういう意味ですか？
オーエン	僕もそうだけど、人がたくさんいるところには、ふらっと足が向くだろ。
晶	賑やかそうだったり、楽しそうなところへ？
	〈大いなる厄災〉が寂しがってるってことでしょうか。
オーエン	寂しいとかじゃない。気になるわけでもないけど。
	そういうこと、ない？
晶	あるような、ないような……。
オーエン	…………。
	ふーん。あっそう。
`},
{id:10818,title:"オーエンのお願い",type:"personal",characters:["⑧"],memo:"オーエン",
text:`オーエン	賢者様、僕のお願い聞いてくれる？
~~~~~~~~~	~~~~~~~~~
選択	はい。
オーエン	最高。その言葉絶対に撤回しないでね。
~~~~~~~~~	~~~~~~~~~
選択	いいえ。
オーエン	泣いて「わかりました」って言っても、許さない状況にするけど、いいの？
~~~~~~~~~	~~~~~~~~~
選択	お願いによる
オーエン	内容によっては聞かないってこと？とても狡くて卑怯で様子見返事だね。
	結局、僕の人格を信用してくれないんだ。とても悲しくて、傷ついたよ……。
	今度からは僕も君を信用しないことにするね。
晶	ボロクソに言われてますけど……。
	ぶっちゃけ、ニヤニヤしながら、お願い聞いてくれない？
	って言うオーエンのことは、全然信用してないです。
~~~~~~~~~	~~~~~~~~~
オーエン	アーサーをこの森に呼んで来て、毒でおかしくなってるところを見てみたいんだけど……。
	オズはどのくらい怒ると思う？怒った時に、僕の盾になってくれない？
晶	……けっこう怒ると思いますし、おかしくなったアーサー見たくないですし、
	盾になるのはお断りします。
オーエン	どうして。森の毒でおかしくなるやつ、すごく面白いのに。
晶	（趣味悪いな……）
オーエン	オズは泣いちゃったりすると思う？
	怒ったオズの顔を見るのも楽しみだ。想像するだけでぞくぞくする。
	でも、取り乱すところは見たいけど、そのあと痛いのは嫌だよね。
	オズは僕が死なないと思っていつも容赦がない。
	やっぱり盾になってくれない？
	オズが間違えて君を殺しちゃったら、どんな顔するかな。
晶	謹んでお断りします……
`},
{id:10819,title:"スポットの人々",type:"personal",characters:["シノ"],memo:"オーエン",
text:`シノ	賢者、これ見てくれ。
シノは、少しいびつな形の、薄い円盤のようなものを差し出した。
シャボン玉のように表面が虹色に反射している。
晶	よく見ると模様が入っていますね……。木目というか、年輪みたいな……？
シノ	正解。夢の森の木こりに会ったんだ。
	切ると、中がこうなってる樹があるんだって。
	しばらくすると普通の木目に変わるらしい。
	この森にはそういう変な樹がたくさんあると言っていた。
晶	地元の人に会ったんですね。どんな方でしたか？
シノ	いかつかった。猟もするらしい。
	人間なのに強そうで、東の国の木こりより、見所がありそうなやつだった。
	夢の森の毒のせいで、植物も動物も、変なものが多いから気をつけろってさ。
晶	そうですか……。
	北の国で生きていくには、人間もたくましくないと難しそうですね……。
シノ	かもな。でも、俺の方が強いぜ。
晶	あはは。わかってます。頼りにしてますね、シノ。
`},
{id:10820,title:"スポットにいた魔法使い",type:"personal",characters:["ミスラ"],memo:"オーエン",
text:`晶	昔ここにいた強い魔法使いのこと、ミスラは知ってますか？
	この辺り一帯を滅ぼして、夢の森が生まれたっていう……。
ミスラ	誰が言ってました？
晶	オーエンです。
ミスラ	へぇ。それ、オーエンのことだと思いますけどね。
晶	え？
ミスラ	この場所には村があって、人間が住んでたんですよ。まっすぐ通れて、楽でしたから。
	それをオーエンが破壊して、毒を出す木々の森になったって。
	俺も聞いた話で良く知りませんが。
晶	そんな……。なら、この話、知られたくなかったんでしょうか。
ミスラ	さあ、ずいぶん昔のことですから。忘れてるだけじゃないですか。
晶	…………。
ミスラ	あの人、昔のことをあまり覚えていないみたいですよ。
	俺より若いはずなんですけどね。
`},
{id:10821,title:"危険な場所",type:"personal",characters:["⑧"],memo:"オーエン",
text:`オーエン	賢者様、賢者様。こっちに来てごらん。
晶	……なんですか？
オーエン	あはは、警戒しないでよ。もとこっち、この樹だよ。
晶	うわ、大きいですね……！下はトンネルになってるんですか……？
オーエン	地面近くに空いた樹洞を広げて、道を通してあるんだ。通り抜けられる。おいで。
晶	ま、待ってください……。暗そうで……。
	（な……、なんだか視線を感じるような……）
オーエン	実はね。この樹には、悪さをした魔法使いが封印されてるんだ。
	僕らは今、彼のお腹の中を通ってるってわけ。目が合うと、取り込まれるよ。
樹洞の木	ギョロギョロッ！
晶	ひえぇ……！！
オーエン	あはは。残念、もう出口だ。無事みたいだね。
	樹になった賢者様のお腹の中、歩けたら面白いと思ったのにな。
`},
{id:10822,title:"オーエンの評判",type:"personal",characters:["カイン"],memo:"オーエン",
text:`魔法使いの狩人	オーエンか。確かにわしも、この辺でよく見かけるのう。
	……一度、自害しようと森に入ろうとする男に、オーエンが話しかけとった。
	からかっとるのかと思うたが、オーエンの恐ろしい妄想を吹き込まれて、男は怖気付いて引き返して行きおった。
晶・カイン	…………。
カイン	……善意とは思えないが……。
晶	ど、どうでしょうか……。
	まだ見たことないいいところも、あるかもしれませんし……。
カイン	そうか？悔しがってそうだ。
	じいさん。あんたはそのあと、オーエンに話しかけたりしたのか？
魔法使いの狩人	まさか。目をつけられたら最後じゃ。姿を消して、じっとしておる。
カイン	だよな。役に立つこともある。くらいで捉えておこうぜ。
晶	そ、そうですね……。
カイン	その時のあいつの顔、見たかったな。
`},
{id:10823,title:"スポットでの名物",type:"personal",characters:["ホワイト"],memo:"オーエン",
text:`ホワイト	夢の森の名産品は「夢幻の木の枝」じゃ。
	ほれ。
晶	枝……？この木の枝が名産品なんですか？
ホワイト	そうじゃ。夢幻の木の枝を燃やすと幸せな幻影が見られる。
	ほんの束の間、手にした者の一番の願望を映し出すのじゃ。
晶	願望……。
ホワイト	手折って持ち帰ると人間たちに高く売れるらしくての。
	マッチに加工して小銭を稼ぐものがおる。
	それゆえ、ここ最近では「夢幻の木の枝のマッチ」が夢の森の特産品になったのじゃ。
晶	……。それってマッチ売りの……。
ホワイト	ほうほう。賢者の耳にも入るほど有名になっておったのか。
	魔法舎の子供達に買って帰ってやろうかの。
`},
{id:10824,title:"スポットでの発見",type:"personal",characters:["ムル"],memo:"オーエン",
text:`ムル	わー！ぴっかぴかだ！
晶	ムルは、夢の森に来るのは初めてですか？
ムル	何度も来てるよ！ここはナイトメアストーンが採れるんだ。
晶	ナイトメアストーン？
ムル	夢の森の木の中にだけできる石！毒と悪夢を取り込んだ宝石だよ！
	めちゃめちゃ探して、めちゃめちゃ人に聞いて、めちゃめちゃお金をバラまいた！
	やっといっこだけ見つけたんだけど、
	叩いて炙って冷やして捏ねて削って混ぜて固めて砕いて。
	何度も何度も何度も何度も何度も何度も何度も何度も調べてるうちに、
	カケラもなくなっちゃったんだ！
晶	本当に、研究になるとすごい執着心と集中力ですね……。
ムル	忘れてたけど今思い出したよ！実質覚えてたってこと！賢者様も探して！
	見つかるまで帰らない！
晶	（まずい質問をしちゃった気がする……）
`},
{id:10825,title:"楽しい場所",type:"personal",characters:["ミスラ"],memo:"オーエン",
text:`ミスラ	この辺りは、花が群生してるようですね。
晶	本当だ。綺麗だけど、この花も毒を出すのかな……。
ミスラ	さあ。持って帰ってみたらどうですか。ルチルなんかは喜ぶんじゃないですか。
晶	うーん……。危なそうなのでやめておきます……。
ミスラ	それにしても、ここは退屈ですね。
	……虫捕りでもしましょうか。
晶	今！？
ミスラ	暇なんで。
	《アルシム》
	どうぞ。
晶	こ、この世界にも、虫捕り網があるんですね……。
ミスラ	セミとかいないかな。
晶	いないと思いますよ！？もっと安全な場所でやりましょうよ……！
ミスラ	セミ、ご存じですか？食べたことあります？
晶	食べません……！食べないで……！？
`},
{id:10826,title:"マナエリア",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
	「マナエリア」と呼ぶとも聞きました。オーエンにもマナエリアがありますか？
オーエン	あるけど、言いたくはないよね。壊されたりしたら嫌だし。
晶	そ、そんなことしませんよ……。
	無理に聞き出したいわけじゃないので、言いたくなければ大丈夫です。
	でも、教えてもらっていれば、誰かに壊されそうになった時、庇えるかもしれないですけど。
オーエン	……。なるほど。
	僕のマナエリアは、市場だよ。どこの、とまでは教えないけど。
晶	市場ですか……。賑やかそうな印象ですけど、
	そういう場所でも集中できるんですか？
オーエン	余計な質問には答えない。
晶	はい……。
オーエン	もし戦争が起こって、僕のマナエリアが滅ぼされそうになった時は、身を呈して庇ってね、賢者様。
`},
{id:10827,title:"アミュレット",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	オーエンもアミュレットを持ってますか？
オーエン	あるよ。賢者様のアミュレットは何？目の前で壊したらどんな顔をするか知りたいな。
晶	俺のアミュレットはまだわからなくて……。
オーエン	なんだ。つまらない。
	…………。
少しだけ考えてから、オーエンは机の引き出しを引く。
そこには、たくさんのチェスの駒が入っていた。よく見ると、形が揃っていないように思える。
駒の数も、こんなに多かっただろうか？別々のセットを混ぜたような感じだ。
オーエン	チェスのピースが僕のアミュレットみたいだよ。
	これを山にして置いておくと元気が出る。
晶	駒だけ？盤面はないんですか？
オーエン	遊んだことなんてないよ。ずっとひとりだし。
晶	馬が好きなんですか？
	なんだか、馬の形の駒が多い気がしますけど……。
オーエン	……うるさいな。もうおしまいだよ。
晶	うわっ！
駒に手を伸ばしかけると、バタンと音を立てて引き出しが閉まった。
間一髪で、俺は指を挟まずに済んだ。
`},
{id:10828,title:"ケルベロスとお散歩",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	オーエン、オーエン！
オーエン	おや、賢者様。何しに来たの？
晶	何しに来たのじゃないです！なんで森にケルベロスがいるんですか。
	殺されるかと思った……。
オーエン	散歩させてるだけだよ。
	いつもトランクに閉じ込めてるからたまに外に出してあげるんだ。
晶	散歩って、そんなペットみたいなノリで……。
オーエン	僕と一緒にいてもいいの？
	あの子、僕を見るとすぐ殺そうとしてくるから、ここは危ないんじゃない。
	はは、すごく怒ってる。かわいい。
晶	そんな……。
	もう少し仲良くできないんですか？
~~~~~~~~~	~~~~~~~~~
選択	おやつとか使って！
オーエン	そんなものがどこにあるの？
	もしかして、自分のことを言ってるのかな。賢者様は健気だね。
晶	いえ、そういうわけでは……！あっ、差し出そうとしないで。
~~~~~~~~~	~~~~~~~~~
選択	おもちゃとか使って！
オーエン	は？馬鹿にしてるの。そこらへんの犬や猫と一緒にするなよな。
晶	すみません、つい……。
オーエン	仲良くなる必要なんてないよ。トランクを閉めればいいだけだから。
	また嫌われちゃうかもしれないけど。
`},
{id:10829,title:"家族",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	オーエンは家族のことを覚えていますか？
オーエン	ミスラは？
晶	え？
オーエン	ミスラにも聞いた？あいつ、なんて言った？
晶	ええと……、あまり覚えてないって言ってたような……。
オーエン	ふうん。なら僕もあまり覚えてない。
晶	……なら、って何ですか？言いたくないなら、そう言ってもらえれば……。
オーエン	覚えてないんだってば。
	ミスラも覚えてないなら、別におかしいことじゃないだろ。
晶	……わかりました。
オーエン	ふん。
晶	（変な言い方だったな。
	　家族のことを知られたくないなら、もっと別の言い方をしそうだけど……
	　オーエンから昔の話を聞くときは、慎重にした方が良さそうだ……）
`},
{id:10830,title:"オーエンから見たカイン",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	オーエンはカインの片目を奪ったり、よくカインに絡んだりしていますけど、カインが気になるんですか？
オーエン	気にならないよ。
晶	そうなんですか？
オーエン	もちろんさ。どうだっていいよ。暇つぶしにからかってるだけだよ。
晶	でも……。
	自分の顔に片目をはめてるくらいだから、カインの目は気に入ってるんですよね。
オーエン	まさか。嫌いだよ。
	蜂蜜と朝焼けの光を溶かして混ぜたみたいな、夏の花みたいな、こんな色は嫌い。
晶	（そのわりに、機嫌のいい顔だ）
オーエン	カナリアの羽の色みたいで、日を浴びた柑橘類の皮の色みたいで嫌い。
晶	（オーエンは天の邪鬼だなあ。それは好きっていうんだと思うけどな。
	　あ……。いいことを思いついた）
	じゃあ、カインのどんなところが嫌いですか？
オーエン	たくさんあるよ。魔法使いのくせに、人を守る騎士だったこと。
	くだらない剣を大事にしてるところ。
	笑っているところ。大きな声。赤い髪。
	僕に片目を奪われたくせに、僕に普通に話しかけてくるところ。
	それから……。なんだよ。何を笑ってるの？
晶	いえ、なんでもないです。
オーエン	まだ他にも聞きたい？
晶	はい。聞かせてください。
`},
{id:10831,title:"オーエンとミスラ",type:"personal",characters:["ミスラ","オーエン"],memo:"オーエン",
text:`晶	オーエンは北の国にいた頃、ミスラとはどんな関係だったんですか？
オーエン	どうもこうもないよ。ミスラは危ないから、あまり関わらないようにしてた。
晶	危ないというのは……。
オーエン	ミスラの動きは予想がつかないんだよ。
	何を言っても通じないから、言葉で追い詰めて操るのも難しいしさ。
晶	そうなんですね。
オーエン	そう。たまに成功するけどね。
~~~~~~~~~	~~~~~~~~~
選択	どうやって成功したんですか？
オーエン	ミスラの場合は、追い詰めるよりも、おだてた方が動かしやすいんだよ。
	おねだりしたり、頼み込んだりさ。
	そうやって利用して使ったこともあるけど、ミスラに媚びるのは癪だし、いきなり気が変わるから止めたんだ。
~~~~~~~~~	~~~~~~~~~
選択	他にもそういう相手はいますか？
オーエン	……カインかな。僕の思い通りに弱ったりしない。
	何を言っても通じないわけじゃないけど。
	自分が悪いなら、罰を引き受けよう。それでも、最善の未来を諦めない。
	みたいなところが、暑苦しいし、面倒くさい。
~~~~~~~~~	~~~~~~~~~
晶	そうなんですね……。
	でも、今はミスラとも大分、仲良くなってきたんじゃないですか？
オーエン	そんなわけないでしょ。
ミスラ	オーエンじゃないですか。一緒にお茶でも飲みましょうよ。
	眠れなくて、気を紛らわせたいんです。
晶	ほら、誘われてますよ。
オーエン	不眠で気を紛らわせたいミスラになんか、近づくわけ無いだろ……。
	いつ攻撃してくるかわからないし……。
ミスラ	オーエン。
オーエン	急な用事を思い出した！じゃあね。
`},
{id:10832,title:"お気に入り",type:"personal",characters:["オーエン","ブラッドリー"],memo:"オーエン",
text:`晶	オーエンは北の国にいた頃、ブラッドリーとはどんな関係だったんですか？
オーエン	仲良しだったよ。ブラッドリーは僕が嫌いだったけどね。
晶	そうなんですか？
オーエン	ブラッドリーは手下がたくさんいたからね。
	彼本人がそれなりに強くても、手下がそうだとは限らない。
	時には、ひとりぼっちより、組織っていうのは弱いものなのさ。
	僕の話を聞いて、彼の手下は、彼を疑ったし、彼を怖がったし、彼を裏切って、自分が首領になりたくなったりしたよ。
	だから、ブラッドリーは僕が嫌いなんだ。
	ふふ。僕はもっと仲良くしたっていいのにね。
晶	（機嫌がいいな……）
	今はブラッドリーに手下はいないでしょう？
	ひとりぼっちになったブラッドリーは、どんな風に見えるんですか？
~~~~~~~~~	~~~~~~~~~
選択	強そうですか？
オーエン	どうだろう。魔力では元から僕にかなわないけどね。
	あいつは妙に頭が回るから、誰かを庇ったり、誰かを指揮したりしなくていい分、
	何か仕掛けてきそうで嫌だなあ。
~~~~~~~~~	~~~~~~~~~
選択	弱そうですか？
オーエン	弱いよ。ひとりぼっちだから弱いんじゃない。
	ひとりぼっちのくせに誰かに構うからだよ。
	ブラッドリーは人間ぽいところがあって、気に入った相手には心を裂くんだよ。
	身内を見捨てられないのさ。
~~~~~~~~~	~~~~~~~~~
晶	そうなんですね……。
	オーエンが意地悪なことを言わなければ、ブラッドリーと仲良くできそうですけど……。
オーエン	意地悪なんか言わないよ。ブラッドリーに嫌な顔されるのが好きなだけ。
	あ、噂をすればブラッドリーだ。
ブラッドリー	うわ、オーエンじゃねえか……。向こう行こ。
オーエン	待ってよ、ブラッドリー。一緒にお喋りしない？ねえったら。
晶	（楽しそうに追いかけていった……。これはブラッドリーも苦労するな……）
`},
{id:10833,title:"オーエンと和菓子",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	そういえば、オーエンは和菓子って知ってますか？
オーエン	は？餓死？
晶	いえ、そんな物騒な話ではなく……。俺がいた世界にあったお菓子です。
	こう、クリームとか小麦粉は使わないタイプの。
	お団子とか、羊羹とか。甘くてもちもちしたものが多かったかもしれません。
オーエン	もちもち。
晶	確かキッチンに「そう思ってしまえばきな粉」と「多分これは小豆」があったはず。
	おはぎぐらいなら作れるかも……！
オーエン	…………。
晶	あ、すみません。ひとりで盛り上がってしまって。
オーエン	別に。もちもち、僕も食べたい。
晶	えっ、おはぎですか？
オーエン	そう、追い剥ぎ。
晶	追い剥ぎじゃないですが……わかりました！頑張って作りますね！
オーエン	さっさと行って。早くしないとおまえのこと追い剥ぎするよ。
`},
{id:10834,title:"猫の通訳",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	あ、猫……！迷い込んで来ちゃったのかな？
ねこ	にゃあ～。
晶	そっかそっか。お腹が空いてるんだね。
オーエン	違うよ、シーツだって。
晶	あっ、オーエン。
オーエン	干してたシーツが落ちてるってさ。別にお腹は空いてないらしいけど。
晶	そうだったんですね……！教えてくれてありがとうございます。
	オーエンの能力は本当にすごいですね。
	きみもえらかったね～。よしよし、お礼にたくさん撫でてあげよう。
ねこ	にゃあ、にゃ！
晶	あ、今どういたしましてって言った！
	私も猫の気持ちが少しずつわかってきたのかも……！
オーエン	……。
	僕に勝とうなんて１００年早いよ。
`},
{id:10835,title:"特技",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	（あそこにいるのはオーエン……？周りに小鳥が集まってるみたいだけど……）
オーエン	……賢者様か。
晶	オーエン。鳥に餌をあげてたんですか？
オーエン	僕が？食べることはあっても、食べさせたりなんかしないさ。
	おしゃべりを聞いてたんだ。鳥は噂話が好きだよ。
	新しい賢者様は魔法舎の魔法使いに嫌われてるって話してる。詳しく聞きたい？
晶	……だめですよ。そんな風に言ったって騙されません。
	みなさんのことを信じてますから。
オーエン	つまんないの。
晶	オーエンは、鳥や動物と会話できるんでしたよね。
	魔法使いはみんなそうなんですか？
オーエン	さあ。他のやつには無理じゃない。
晶	そうなんだ……。動物と話せるなんてちょっと羨ましいです。
オーエン	動物なんて単純で退屈だよ。誰の悪口も言わないしさ。
小鳥	ピピピ……。
晶	（でも、オーエン自身は動物に懐かれやすい気がするな……。
	　話ができると仲間だと思われたりするのかな？）
`},
{id:10836,title:"意地悪オーエン",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	（ん？なんだか体が暑いような……）
	部屋が燃えてる！？
オーエン	やあ、賢者様。
晶	オーエン！助けてください、突然火が……。
オーエン	いいね、その顔。もっと怖がってよ。このままだと全部燃えちゃうし、死んじゃうよ。
晶	助けてください！丸焦げになりたくないです！
オーエン	……もっと上手におねだりしてよ。
	怯えるおまえを助けてあげる僕に、何を返してくれる？
晶	この間、中央の都に行った時に発見した、超美味しいお菓子の店を教えます！
	いや、ご馳走します！
オーエン	……まあ、いいか。
	《クアーレ・モリト》
	はい、おしまい。僕の作った幻は楽しかった？
	賢者様、最高に面白い顔してたよ。
晶	…………。
オーエン	はは、いい暇つぶしになった。お返しのこと、忘れるなよ。
`},
{id:10837,title:"紋章",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	賢者の魔法使いには、目印になる賢者の紋章が身体に現れるって聞きました。
	オーエンの紋章はどこにあるんですか？
オーエン	きみのこと、頭からバリバリ食べさせてくれたらわかるかもね。
晶	また怖がらせるようなこと……。
	あれ？……待ってください。もしかして、オーエンの口の中……。
オーエン	あたり。
オーエンはにやにやしながら、口を開けて舌を出して見せた。
黒く描かれた紋章がはっきり刻まれている。
晶	そんな場所にも、紋章が現れることがあるんですね……。驚きませんでしたか？
オーエン	驚いたっていうか、ムカついたよ。
	自分で選んだわけでもない模様が、突然張り付いてさ。
	取りたくて仕方なくて、色々試して舌を抜いたら一度死んだ。
晶	過激な嫌がり方ですね……。
	じゃあ、紋章や賢者の魔法使いのことは、知らなかったんですね。
オーエン	ずっとひとりだったし、厄災にも興味なかったしね。
	紋章のこと、有名な双子なら何か知ってるかと思って会いに行ったけど、歓迎会を開かれてすごく苛々した。
	それからずっと厄災と戦ってるけど、そろそろうんざりだな。
	いい加減、解放してほしいよ。
`},
{id:10838,title:"歌声",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	何か聞こえる……。これは歌？
オーエン	〜♪
晶	えっ！オーエンが歌ってる……。
	（周りに小鳥が集まって、まるで映画のワンシーンみたい）
オーエン	……それで隠れてるつもり？丸見えだよ、賢者様。
晶	すみません、盗み聞きするつもりはなかったんです。
	オーエンはとても歌がお上手なんですね。歌うのが好きなんですか？
オーエン	好きか嫌いかなんて考えたことないけど、動物たちは寄ってくる。
	こいつらはみんな音楽が好きなんだ。
	こんな風に、ほら。
	〜〜♪
晶	わ、もっと集まってきた……。
オーエン	はは。僕の歌につられてやってくるなんて、賢者様もけものみたいだけどね。
`},
{id:10839,title:"怖がらせたい",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	オーエン！部屋から変な音がしましたが、大丈夫ですか？
オーエン	賢者様か。そろそろ、隣の部屋のオズが眠る頃だと思ってさ。
	嫌がらせに窓を引っ掻いてたんだよ。
晶	し、静かに寝かせてあげてください……。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
オーエン	好きなことをしてるよ。ここでの生活をとても楽しんでる。
	きみはひとりのとき、楽しい？ひとりでいるのは本当にきみの意思？
	みんなから嫌われて誘われないだけじゃない？
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
オーエン	呼ばないよ。誰かを部屋に入れるのが嫌だ。
晶	す、すみません、突然……でも、心配だったので……。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
オーエン	そんなものないよ。僕は僕の好きな時間に、好きなことをする。
	なのに、魔法舎の食堂はおやつの時間を勝手に決めてるから腹が立つ。
	奪おうとするとフィガロが出て来るし……。
	耳がいいんだね、賢者様。
~~~~~~~~~	~~~~~~~~~
晶	もう真夜中なのに、目が覚めて廊下に出たら変な音がしたから驚きましたよ。
オーエン	寝物語を聞かせてあげるよ。
	首なしの騎士の話がいい？鏡で呼び出す悪魔の話がいい？
晶	結構です。みんなも眠っているから、騒いじゃダメですよ。
	じゃあ、おやすみなさい。
オーエン	北の国の死の湖の話をしようか。
	そこには墓場しかない小さな島があって、死体を運ぶ子供の船が……。
晶	怖い話を囁きながらついてこないでくださいよ……！
`},
{id:10840,title:"期待はずれ",type:"personal",characters:["カイン","オーエン"],memo:"オーエン",
text:`晶	オーエン、ぴくりとも動きませんね……。目は開いたままなのに。
カイン	寝てる……わけじゃなさそうだしな。誰かに殺されたのかもしれない。
晶	ええ！一体誰がそんなことを……。
カイン	腹の立つやつだったが、あまり気分のいいものじゃないな。
	待ってろ、オーエン。必ず、俺が犯人を見つけてやるから……。
オーエン	くっ……あは、あっはは！
カイン	うお、オーエン……！
オーエン	ああ、可笑しかった。間抜けな顔で覗き込んでくる賢者様と騎士様、最高だったよ。
晶	心臓が飛び出るかと思いましたよ……。
	今の死んだふりだったんですか！？
オーエン	さあ、どうだろうね。
カイン	……顔色が悪く見える。やっぱり死んでたんじゃないか？
	本当に大丈夫か、オーエン。
オーエン	……うるさいな。
	あーあ、つまんないの。
`},
{id:10841,title:"怒ったり笑ったり",type:"personal",characters:["オーエン","ネロ"],memo:"オーエン",
text:`晶	オーエン、おはようございます。
オーエン	…………。
晶	（めちゃくちゃ機嫌悪そう……）
	き、気持ちがいい朝ですね！お向かい失礼してもいいですか？
オーエン	好きに座れば。僕の長い脚が当たっても知らないけど。
晶	今日は特に当たりが強いですね。何かあったんですか……？
オーエン	別に。スノウとホワイトに無理やり起こされただけ。
	北の国にいたときは朝は小鳥が起こしてくれたのに。
	ここではうるさくて目が覚めるし、最悪。
晶	もし良かったら、明日からじゃ俺が起こしましょうか。
	……あ、痛っ、蹴らないで。
ネロ	おはようさん。今日の朝食はパンケーキだ。シロップはお好みでかけろよ。
オーエン	パンケーキだ。やった。
晶	（お手本みたいな気分屋さんだ……）
`},
{id:10842,title:"オーエンのイタズラ",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	ふう。今日も無事に終わって良かったな。お水飲んだら寝よう。
	（！？きゅ、急に灯りが消えた……）
？？？	みーつけた。
晶	ひっ……！
オーエン	やあ、賢者様。いい夜だね。
晶	オーエン……！
	もう、脅かさないでくださいよ。心臓が止まるかと思いました……。
オーエン	ひどいね賢者様。
	この場に僕しか見えないからって、僕が悪戯したって決めつけるんだ？
晶	え、今のオーエンじゃないんですか。
オーエン	言わなきゃわからない？
晶	タイミング的にてっきり……。疑ってすみません。
オーエン	気にしなくていいよ。嘘だから。
晶	えっ。
オーエン	あはは。賢者様は本当、騙されやすくて面白いなあ。
`},
{id:10843,title:"怒らせ上手",type:"personal",characters:["北"],memo:"オーエン",
text:`ブラッドリー	オラァ！オーエン！どこにいやがる、出てきやがれ！
ミスラ	賢者様、オーエンを見掛けませんでしたか。
晶	今日はまだ見ていませんが、どうしたんですか？
	二人ともそんなに怖い顔で……。
ブラッドリー	ちっ！俺はこっちを探す。ミスラ、おまえは向こうだ。
ミスラ	指図しないでください。潰しますよ。
晶	行ってしまった……。一体何があったんだろう。
オーエン	賢者様。
晶	うわ、オーエン！いきなり現れないで下さい。みんなが探していましたよ。
オーエン	知ってるよ。
	ブラッドリーのお菓子を横取りしたり、オズに負けたミスラを優しく慰めてあげただけなのにさ。
晶	むしろ、煽っちゃったんじゃ……。
	オーエン、一緒に二人を探しましょう。ちゃんと謝ったほうがいいですよ。
オーエン	嫌だよ。死んじゃったらどうするの。
スノウ・ホワイト	オーエン、見つけたぞ！　今度という今度は許さんからの！
晶	スノウとホワイトまで、怒らせてたんですか……！
`},
//ブラッドリー
{id:10901,title:"スポットの印象",type:"personal",characters:["スノウ"],memo:"ブラッドリー",
text:`スノウ	北の国のこの辺りは、人間も魔法使いもほとんど訪れぬ場所……。
	我らも把握できておらんような氷漬けになった古代の魔法生物が見つかったり、おかしな現象が多い地域じゃ。
晶	二千年以上生きているスノウにも、わからないことがあるんですか？
スノウ	ほほほ。我ら、冒険発見などには興味がなかったからのう。
	目を向けぬものは、存在しないも同じじゃ。
	弱肉強食、優勝劣敗の北の地では、世界がどのように作られたかを知るより、殺されずに生きていく方が大切じゃからのう。
晶	確かに……。ムルみたいな西の魔法使いなら、喜んだかもしれませんね。
スノウ	そうは言っても、魔力が強くなければ、この辺りで調査を続けることは難しい。
	吹雪が強くて地形も変わり続けておる。
	かといって、そこそこの魔力のものがうろついていれば、北の魔法使いが石にしようとやってくる。
	縄張りの概念が強くある地域もあるが、この辺りは希薄じゃな。
	それゆえ、ブラッドリーも隠れ家にしておったんじゃろう。
	時の洞産の噂自体は古くから聞いておった。
	この場所を探すものにも会ったことがある。
	見つけたものはおらんかったがの。
晶	違う時代に繋がってるって噂ですよね。
	スノウも、過去に戻りたいと思うことがありますか？
スノウ	賢者よ……。我にそれを聞くのかの？？？
晶	あっ……。すみません……。
スノウ	ほほほ、良い良い。
	オズの不思議の力を持ってしても、過ぎた日を巻き戻すことはできぬ。
	時を越えるというのは、いにしえからの万人の夢なのかもしれんな。
`},
{id:10902,title:"ブレイクタイム",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`ブラッドリー	…………。
晶	ブラッドリー、ここにいたんですね。
	……すみません。お邪魔でしたか？
ブラッドリー	いいぜ。気付いてたし。
晶	考え事ですか？
ブラッドリー	そうだな……。考えてたような、ねえような……。
晶	……珍しく歯切れが悪い言い方ですね。
ブラッドリー	はは！言うようになったじゃねえか。ここは俺のマナエリアに似てるんだよ。
	だからちょっと瞑想してたんだが……。
晶	瞑想？ブラッドリーが？
ブラッドリー	変かよ？魔法使いは大抵やるもんだぜ。
	だけどまあ、ここは思い出すことが多すぎるな。集中できねえや。
	なんか喋っててくれよ。そのくらいが、ちょうど良さそうだ。
	あんたの世界の話だとかさ。
晶	……。わかりました。すべらない話がひとつだけあるんですよ。
ブラッドリー	いいな。笑えなかったら氷漬けにしてやるぜ。
`},
{id:10903,title:"スポットの思い出（１）",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`ブラッドリー	時の洞産自体をアジトにするって話もあったんだよな。
	吹雪は凌ぎやすいし、そこそこ広いし、誰も来ねえし、テコ入れすりゃ手下全員分の部屋も作れそうだったんだが……。
	ひとつだけ問題があって、やめた。
晶	問題？なんですか？
ブラッドリー	厨房を作ったんだけどさ、煙が出ていかなかったんだよ。
晶	ああ……！なるほど。
ブラッドリー	穴穿つんでも、あんまりやりすぎると地盤がまずそうでな。
	料理作ってたやつは、入口の側や外に小屋建てるんでもいいって言ってたけど、寒くってよ。
	かわいそうだろ。
晶	そうですね……。毎日長い時間いることになるでしょうし。
	やっぱり、仲間思いなんですね。
ブラッドリー	あいつに作るの任せて、ちゃんとしたもん食うようになったら、飯は薬と同じだって分かったんだよ。
	美味えもん食ってると士気も全然違うしな。
	組織を動かすのに食事の優先度は高え。てめえも覚えとけよ。
`},
{id:10904,title:"スポットの思い出（２）",type:"personal",characters:["ミスラ","ブラッドリー"],memo:"ブラッドリー",
text:`ミスラ	昔、この辺りで暇つぶしに人間を脅して遊んでたらブラッドリーが出てきて……。
晶	物騒すぎる遊びは、やめていただきたいですが……。
ミスラ	暇すぎて。もしくは苛々してたのかな。
	覚えてないですけど、彼が出てきて庇うから、殺し合いになったんですよ。
晶	人間をですか？ブラッドリーの仲間だったんですか？
ミスラ	そういう感じじゃなかったと思いますけどね。なんだったんですか？あれ。
ブラッドリー	知らねえ。ただのじじいだよ。
	ミスラがいたぶって遊んでるだけなのはわかってたが……。
	なんとか生き延びようとするツラしてたからよ。いい顔してんなって思ったんだよ。
ミスラ	そんな理由で人間なんかを庇って死にかける意味がわかりませんね。
	あなた、老人が好みだったんです？
ブラッドリー	うるせえ。ボロクソにやられて帰ったら仲間にもボロクソに怒られたぜ。
	ミスラに手ェ出すのはご法度だったしな。
ミスラ	ルールは守ってくださいよ。
ブラッドリー	てめえがいうな。……思い出したら腹立ってきたわ。表出ろやコラ。
ミスラ	いいですよ。退屈してたんで、遊んであげます。
晶	（ちょっと雪合戦しようぜ！みたいなノリでケンカ始めるのやめてほしいな……！）
`},
{id:10905,title:"ブラッドリーへの印象（１）",type:"personal",characters:["ホワイト"],memo:"ブラッドリー",
text:`晶	ホワイトから見た、ブラッドリーの印象ってどうですか？
ホワイト	性格自体は嫌いではないがの。
	短気なところはあるが、北の魔法使いにしては珍しく話が通じるタイプじゃ。
晶	確かに、困った時には相談できそうな、頼れる感じがありますね。
ホワイト	北の魔法使いの多くは、他者と関わりを持たずに過ごしておる。
	強い魔力があれば群れる必要がないからの。
	しかし、長い時間を生きれも、それでは人間たちの言う社会性や情緒や価値観というものは育たぬ。
晶	ミスラやオーエンが、ときどき幼く感じるのは、そのせいなんでしょうか……？
ホワイト	ほほほ。まさに。
	年相応に振る舞う必要など、ひとりで生きてゆける北の魔法使いにはないんじゃよ。
	その点ブラッドリーは、我らが人間たちや若い魔法使いの面倒を見るように、部下の面倒を見ていたのかも知れぬな。
	付き合いの長いオズやフィガロでさえ、未だ子供の面倒を見てやる気持ちでおるが……。
	ブラッドリーだけは、たまに価値観が対等であるように感じるかも知れんのう。
晶	スノウやホワイトとですか？
ホワイト	うむ。それゆえ、首に縄をつけて、我らの方が上だということをわからせてやっておるのじゃ。
	基本的にはやんちゃで馬鹿な、若くて可愛い魔法使いじゃと思うておるよ。
`},
{id:10906,title:"ブラッドリーへの印象（２）",type:"personal",characters:["ミスラ"],memo:"ブラッドリー",
text:`晶	ミスラはブラッドリーとも付き合いが長いんですよね。
ミスラ	はあ……。そんなに長いってわけじゃないですけどね。数100年程度です。
晶	（じゅうぶん長いと思うけど……）
	ブラッドリーのこと、どう思っているんですか？
ミスラ	ブラッドリーですか？
	そうだな……。
	彼って、早口ですよね。最初の2、3単語しか、頭に入ってこないことがありますよ。
晶	ついていけてないことがあるんですね……。聞き返したりしないんですか？
ミスラ	はあ……。面倒で。
	だいたい笑ってるから、いい話なのかなと思って聞いてます。
	かと思うと急に怒り出すし、忙しないですよ。
	いつも、聞いてもないことをたくさん喋るから、
	よくわからないまま、はあ、はあ、はあ、って返事をしていると……。
	突然、「よし、決まったな」って言われるんです。
	それで、いつの間にか彼のしたいことを手伝っていることが多くて。
	あれ？
	とは思いますね。
晶	（目に浮かぶな……）
ミスラ	まあ、騒がしいから、疲れてる時には会いたくないです。
`},
{id:10907,title:"ブラッドリーへの印象（３）",type:"personal",characters:["オーエン"],memo:"ブラッドリー",
text:`晶	オーエンはブラッドリーのこと、どう思っているんですか？
オーエン	…………。
	ブラッドリーってさ。難しくて。
晶	難しい？
オーエン	簡単にやれそうじゃない？
	簡単に傷つけられそうだし、簡単に不安にさせられそうでしょ。そんな印象。
	だけどいざやりあってみると、なんだか、根っこに届いてない感じがする。
	何言っても青ざめないし錯乱しない。下手すると反論されて嫌な思いするし。
	やりにくくて、難しい。
晶	そうですね……。根っこがどっしりしている感じはするかもしれないです。
オーエン	お互いなんとなく嫌いなのはわかるよ。
	でも、オズやミスラよりマシって、お互いそう思ってるのもわかる。
	北の国はけだものばかりだけど、ブラッドリーはまだ、話せば通じる感じがするかな。
`},
{id:10908,title:"ブラッドリーへの印象（４）",type:"personal",characters:["ネロ"],memo:"ブラッドリー",
text:`晶	ブラッドリーって口が悪いけど、情に厚くて仲間思いなところがありますよね。
	ネロはどう思いますか？
ネロ	いや……。なんで俺に聞いた
	あいつとはここにきて会ったばっかりで、お互いよく知らねえし……。
~~~~~~~~~	~~~~~~~~~
選択	そういうことになってるんですか？
ネロ	待てよ賢者さん。まさかブラッドに何か言われたのか？違うぜ？
	その情報、間違ってっから。
晶	でも、ブラッドリーのこと。ブラッドって呼んだりしますし……。
ネロ	…………。
	ブラッド……リー……くんのこと、そんな風に言ってたかな……。
	でもほら、ブラッドなんて、よくある愛称だろ？
	俺も馴れ馴れしい客にネリーって呼ばれたりしてたしさ。
~~~~~~~~~	~~~~~~~~~
選択	気が合いそうに見えました。
晶	気が合いそうに見えました。
ネロ	いやいや。北の魔法使いと東の魔法使いじゃ、気が合うわけなんてねえだろ。
	なんでそう思ったんだ？
晶	でも、ブラッドリーは、ネロのご飯が好きですし……。
ネロ	ああ……、あー……、そっちか。なるほどな。そうだよな。
	まあ、あいつ、飯はよく食うよな。
	食べ物を大事にしてるところは好印象だよ。それだけ。
~~~~~~~~~	~~~~~~~~~
選択	初対面の感想でもいいので教えてください。
晶	初対面の感想でもいいので教えてください。
ネロ	はあ、初対面の……？あー、ちょっと待ってくれよ。そうだな、ええと……。
	……、見た目は怖そうだけど……、意外とどんな奴の話でもちゃんと聞いてくれるやつだなって思ったかな。
	俺も若かったせいもあるけど……。
晶	え？
ネロ	え？……あ、いや。なんでもない。
~~~~~~~~~	~~~~~~~~~
晶	じゃあ、ひと言で言うと、ブラッドリーはどんな人に見えますか？
ネロ	まあ……、他人に誤解されやすそうなやつだよな。
	おしゃべりなバカみてえに見えるが、思ったより色々考えて、色々なことを見てる。
	かと言って、思ったより他人を理解してない。
晶	……なんとなくわかります。ブラッドリーの話すこと、そうだなって思う時と、それ、俺には無理かなって思う時があるので……。
ネロ	だよなあ。オズみたいに、生まれながらに強かったわけじゃないって聞いたけどさ。
	たぶん、ボロ負けしながら強くなったんだろう。
	だから、他人もてめえと同じだけ我慢すれば、同じだけ強くなれると思ってる。
	けど、心も身体も、あんだけ踏ん張れるやつなんてそうそういねえんだよ。
	それがわからねえ。
	……邪推だけどさ。
`},
{id:10909,title:"スポットゆかりの話（１）",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	この辺りは人間が全然居ないって言ってましたよね。
	やっぱり、人と暮らすのは嫌いなんですか？
ブラッドリー	人間の好き嫌いで住処を選んだりしねえよ。北はまず魔法使いの縄張りがあって、
	そいつに尽くして庇護を受けてる人間が住んでる。
	強い魔法使いがいて、そこから村や町ができて、それがたくさんあってずっと小競り合いしてんだ。
	親玉が負けりゃ、皆殺しになることだってある。
晶	想像以上に殺伐としてる感じですね……。
ブラッドリー	てめえは相当平和ボケした世界から来たんだったな。
	北に限らず、同じ感覚で外歩いてるとすぐに死んじまうぜ。
晶	北の国で人間が生きていくには、魔法使いに守ってもらう必要があるんですね。
ブラッドリーに尽くす人間もいたんですか？
ブラッドリー	俺様は必要なもんは自分で奪うんだよ。
	上等なマナ石や魔道具やお宝を持ってる奴の所に突っ込んで行って蹴散らすのさ。
	それでも、なんとなく目にかけてる村や街が所々にあったな。
	たまに出かけりゃタダで飲み食いできるような。
	で、最近困ってることがあるんですーみてえな相談が持ちかけられて、面倒そうなら俺らが出て片付ける、って感じか。
晶	面倒そうなら引き受けてくれるんですか？
ブラッドリー	俺様が雑用なんてやるもんか。持ちつ持たれつ、って感じよ。
	もちろん、立場は俺様の方が上だけどな！
晶	（昔の映画で観た、マフィアの親分みたいな感じだなあ……）
`},
{id:10910,title:"スポットゆかりの話（２）",type:"personal",characters:["ブラッドリー","スノウ","ホワイト"],memo:"ブラッドリー",
text:`ブラッドリーと時の洞窟を歩いていると、イェストゥルムの羽音と、水滴の音に混ざって、

冷厳な子供に似た声	本当じゃ……。我によく似た可愛い子がおるのじゃ。まるで鏡を見ているようじゃ。
冷厳な２人の子供の声	カレシ～。暇なら我とお茶しない？

~~~~~~~~~	~~~~~~~~~
ちらちらと、コウモリの目が光っている。

ブラッドリー	イエストゥルムが世界中にいればな。
化石みてえな魔法使いも知らなかったような動物だから、どうだかな。
晶	そうか、聞いた音を記憶してるんでしたね。
	じゃあ、北の国の人の少ない場所にしかいないのかもな……。
ブラッドリー	ははあ。もう少し習性がわかってりゃ、魔法で操っていい仕事できたかもしれねえな。
`},
{id:10911,title:"時を超える声（１）",type:"personal",characters:["ブラッドリー"],memo:"ブラッドリー",
text:`イェストゥルムの羽音と、水滴の音に混ざって、時を超えた会話が聞こえてきた。
~~~~~~~~~	~~~~~~~~~
気怠げな男の声	ブラッド……！返事しろ、寝るな！　ブラッド！！
貫禄のある男の声	……っせえな、痛えんだよ……。
	大丈夫だ……、……俺様が、このくらいで、……ッ……。
気怠げな男の声	何が大丈夫だ、てめえ。何回石になりかけりゃ気がすむんだ！？
	……人の話聞かねえで、無茶ばっかり……。
	俺はもう、これ以上は付き合いきれねえぞ……。
	北の国でこんなこと言ってるなんて俺の方がおかしいのかもしんねえけど……。
	……強い敵に挑むのも、高価なお宝手に入れんのも、石になったら終わりだろうが……！
貫禄のある男の声	強い敵も、お宝も狙わねえで、生きてる意味なんてねえだろうが。
	石になるのと、どう違うんだよ。
気怠げな男の声	…………。
貫禄のある男の声	ッぅ……はは……、そんな顔すんなよ……。てめえがいりゃあ大丈夫だって。
	頼りにしてるぜ、相棒。

~~~~~~~~~	~~~~~~~~~
ちらちらと、コウモリの目が光っている。隣に立つブラッドリーを盗み見ると、彼と目が合った。
ブラッドリー	あんたはどう思う。
晶	え？
ブラッドリー	何にも挑まねえまま暮らして石になるのなんんて。
	欲しいものに命を懸けずに生きるなんて。そんなのは俺じゃねえ。だとしても……。
	俺が変われば良かったのか？
`},
{id:10912,title:"時を超える声（２）",type:"personal",characters:["スノウ"],memo:"ブラッドリー",
text:`イェストゥルムの羽音と、水滴の音に混ざって、時を超えた会話が聞こえてきた。
~~~~~~~~~	~~~~~~~~~
しゃがれた男の声	ずいぶんやつれて帰って来たな、おまえ。盗賊団の首領の引き渡しに行ったんだって？
	中央の国の水がそんなに合わなかったのか？
疲れた男の声	北に戻ってだいぶ経つのに、捕まった魔法使いの叫び声が耳から離れないんだよ……。
	魔法使いってやつは、不死なのかな？
	俺なら５分で死んじまうような拷問にかけられて……。
	捕まったのは悪党の盗賊だって聞いてたけど、捕らえた方も酷いもんだ。
	双子の子供と、あの男……。
しゃがれた男の声	魔法使いなんて、どいつもこいつも恐ろしいものさ。仕事とはいえ、大変だったな。
疲れた男の声	……なあ、魔法使いのする約束ってのは、どんな意味があるんだ？
	あの盗賊、約束をするように迫られていたんだ……。
~~~~~~~~~	~~~~~~~~~
ちらちらと、コウモリの目が光っている。足音がして、俺は振り返った。
スノウ	賢者よ。ひとりで奥へ行くと、道に迷ってしまうぞ。
晶	スノウ……。ブラッドリーは囚人だって聞いてますけど、魔法使いの囚人ってたくさんいるんですか？
スノウ	さほど多くはない。
	そもそも、ブラッドリーを捕らえたのもフィガロのパフォーマンスの一環じゃからの。
晶	パフォーマンス……？
スノウ	うむ。善良な魔法使いが、悪事を働く魔法使いを捕らえて懲らしめる様を人々に知らしめるためじゃ。魔法使いが盗賊団を捕まえたとあれば、聞こえがいいじゃろう。
	ブラッドリーは、見せしめにちょうど良かったんじゃ。
	善良な魔法使いとならば、人間は安心して共存していくことができるじゃろうからな。
	……ほほほ。安心するがよい。
	善良な賢者の魔法使いはみな、いつでもそなたの味方じゃよ。
`},
{id:10913,title:"時を超える声（３）",type:"personal",characters:["ホワイト"],memo:"ブラッドリー",
text:`ホワイトと時の洞窟を歩いていると、イェストゥルムの羽音と、水滴の音に混ざって、

~~~~~~~~~	~~~~~~~~~

	ひとりの時間が欲しいんじゃ。
冷厳な子供に似た声	嫌じゃ……！今まで我ら２人だったから楽しめたのじゃ！
	分かち合うものなくして、心踊るはずもない！
冷厳な子供の声	それは互いに、己の身をもって孤独を知るまで分からぬことじゃ。

~~~~~~~~~	~~~~~~~~~

晶	……今のは、もしかして……。

`},
{id:10914,title:"時を超える声（４）",type:"personal",characters:["ミスラ"],memo:"ブラッドリー",

`},
{id:10915,title:"時を超える声（５）",type:"personal",characters:["オーエン"],memo:"ブラッドリー",
text:`オーエンと時の洞窟を歩いていると、イェストゥルムの羽音と、水滴の音に混ざって、

{id:10916,title:"時を超える声（６）",type:"personal",characters:["ネロ"],memo:"ブラッドリー",
text:`ネロと時の洞窟を歩いていると、イェストゥルムの羽音と、水滴の音に混ざって、

~~~~~~~~~	~~~~~~~~~
貫禄のある男の声	あ？おい、新入り。なんだそれ、てめえの呪文か？なんか、シケてんな。

気怠げな男の声	……呪文がどうとか、あるんすか？
貫禄のある男の声	あるよ。魔法は心で使うんだからよ。好きな言葉を唱えるだけで全然違うぜ。
	てめえの好きなものはなんだよ。なんでもいい。お宝でも、食い物でも。

気怠げな男の声	好きなもの……。……………………。
貫禄のある男の声	……遅えよ！サッと言え。
気怠げな男の声	っ……、すんませんなんか、パッと思いつかなくて……。
貫禄のある男の声	はあ？ボサッとしたやつだな。てめえ、ほんとに北の生まれかよ？

~~~~~~~~~	~~~~~~~~~
ちらちらと、コウモリの目が光っている。隣で黙っているネロを横目で見ながら、俺は話題を探す。
晶	……ネロの呪文には、どんな意味があるんですか？
ネロ	呪文の意味？あー、そうだな……。
	「ひとつは全てを学ぶため」みたいな？
	ざっくり言うと、だけど。
	そんな気持ちで、一人前になりたがってた時期があったんだよ。
	……酸いも甘いも学ばせて貰ったけどな。
`},
{id:10917,title:"時を超える声（７）",type:"personal",characters:["ネロ"],memo:"ブラッドリー",
text:`ネロと時の洞窟を歩いていると、イェストゥルムの羽音と、水滴の音に混ざって、

~~~~~~~~~	~~~~~~~~~
気怠げな男の声	それから、ボス、次の仕込みの話さ……。

気怠げな男の声	そ……。そんなわけいくかよ。あんたはボスだ。俺はただの子分で……。
貫禄のある男の声	水臭いじゃねえか、ネロ。てめえがいるから、ここまでやってこれたんだ。

気怠げな男の声	…………。

貫禄のある男の声	おう。……あはは！照れてやがる！
気怠げな男の声	うるせえ……。
	……嬉しいよ、ボス……。いや……。ブラッド。

~~~~~~~~~	~~~~~~~~~

`},
{id:10918,title:"時を超える声（８）",type:"personal",characters:["ミチル"],memo:"ブラッドリー",
text:`ミチルと時の洞産を歩いていると、イェストゥルムの羽音と、水滴の音に混ざって、
時を超えた会話が聞こえてきた。
~~~~~~~~~	~~~~~~~~~
威厳のある男の声	しばらく見ていて分かったことだが……。
	おまえは愚かだ。
聡明な幼い子供の声	…………？私は愚かではありません。
威厳のある男の声	腹が減るのも、眠くなるのも、予測できない。
	暑いのか寒いのかさえ自分で把握できず、発熱していても気づけない。
	おまえは愚かだ。自分のことさえ何もわかっていない。
	空を飛ぶ魔法は、未だ使えまい。
聡明な幼い子供の声	いいえ。飛べます！

威厳のある男の声	…………。では、試してみろ。

	見ていてくださいね、オズ様！よいしょ……。……えいっ！！
聡明な幼い子供の声	あーっ。
威厳のある男の声	ア……、アーサー！アーサー！！
~~~~~~~~~	~~~~~~~~~
ちらちらと、コウモリの目が光っている。隣に立っていたミチルが、心配そうな顔をしている。
