//オーエン
{id:10801,title:"スポットの印象（１）",type:"personal",characters:["ブラッドリー"],memo:"オーエン",
text:`晶	綺麗だけど、怖いところですね。夢を見る毒の森なんて……。
ブラッドリー	確かに、酔っ払って眺めるぶんにはいい景色かもしれねえが。
	ここは死人が多すぎて、踊り出す気にもなんねえな。
	半分墓場みてえなもんじゃねえか。
晶	確かに、ミステリースポット的な感じかもしれませんね……。
ブラッドリー	なんだよ、ミステリースポットって？
晶	ええと、幽霊が出るとか、怖い噂があるところのことです。
	出かけて行って、肝試したりとか。
ブラッドリー	ははあ、肝試しね。俺も、オズの城に何度も忍び込んだぜ。
	見つかる度に殺されかけたけどな！
晶	そんなピンポンダッシュみたいなことしてたんですか……？
ブラッドリー	なんだ？ピンポンダッシュって。
晶	ええと……、家の呼び鈴を鳴らして、住んでる人が出てくる前に逃げる悪戯です。
ブラッドリー	なんでわざわざ呼び出して逃げるんだ。戦わねえのか？
晶	ええと……。
`},
{id:10802,title:"スポットの印象（２）",type:"personal",characters:["カイン"],memo:"オーエン",
text:`カイン	ここはゆめかわいくて、綺麗なところだな、賢者様。
晶	ゆめかわいいって言葉、知ってるんですね！？
カイン	ああ。前の賢者様に教わった。
晶	……でも、本当ですね。
	この世界では色々なことが起こりますけど、ここは特に、幻想的な場所です。
カイン	俺たち魔法使いにとっても同じさ。
	さっき、そこの浮いてる石を見てたら、急に光が強くなって来て、あたり一面真っ白になっちまった。
	そうしたら、なんだか楽しくなって来て、石を抱いたり、撫でたりしてたら、突然、オーエンに殴られた。
	ここの森、毒が出てるらしいな。
晶	知らなかったんです……！？だ、だ、大丈夫なんですか！？
カイン	ああ、もうなんともない。
	俺だって魔法使いだしな。少しなら、楽しくなるだけみたいだ。
	オーエンが正気に返してくれたらしい。
	テンション高くなってて、その後のことはよく覚えてないんだが。
晶	そういえば、さっきから姿をみないような……。
カイン	なんかしたかな？俺。
晶	（もしかして、カインが石だと思ってハグしてたのは、
	　本当はオーエンだったんじゃないのかな……）
`},
{id:10803,title:"スポットの印象（３）",type:"personal",characters:["ヒースクリフ"],memo:"オーエン",
text:`晶	ヒースクリフは、北の国には来たことがあるんですか？
ヒースクリフ	まさか……。こうして賢者様の魔法使いになるまで、北の国に行こうなんて考えたこともありません。
	北は恐ろしい魔法使いが多くて治安も悪いし、地形的にも入りにくくなっていて、たいていの人は近づいたりしないんですよ。
晶	そうなんですね……。
ヒースクリフ	……だけど……、北の国にこんな幻想的な場所があるなんて、思ってもみなかったです。
	東の国でも、中央の国のようでもなくて。
	でも、綺麗すぎて怖いところは、北の国らしい風景といえば、そうなのかも。
晶	スノウやホワイトも、ここは特に幻想的だって言ってました。
ヒースクリフ	美しい森ですけど、禍々しい気配も感じます。
	一人だったらきっと、立ち入ったりはしなかったな……。
	オーエンが、この景色を気に入ってるって聞いたのは、やっぱり意外でしたけどね。
`},
{id:10804,title:"ブレイクタイム（１）",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	こんなに幻想的で綺麗な森なのに、木々が夢見る毒を出してるなんて信じられないな……。
オーエン	興味あるの？
晶	え？
オーエン	毒で見る夢に興味あるなら、守護を解いてあげる。自分で試してみればいいよ。
	《クーレ・メミニ》
晶	えっ……！？そんなつもりじゃ……！オーエン、待っ……、む……むぐぐ……！
オーエン	あはは！息を止めてるの？面白いなあ。そんなの無駄だよ。
晶	…………！
オーエン	《クアーレ・モリト》
晶	は……っ、はあ……っ！
	ど……、どうしよう……、ちょっと吸っちゃった……。
	俺……死んじゃうんですか……？
オーエン	さあ。少しくらい大丈夫じゃない？
晶	ひどい……。
	……、うわ……。視界がモフモフしてきた……。
	あ……、でも……、ちょっと気持ちいいのかも……？
	あは……、ははは……。
オーエン	あはは。賢者様、掴まって。こっちこっち。
晶	わぁ……。あはは……。徳川埋蔵金だ～……。
`},
{id:10805,title:"ブレイクタイム（２）",type:"personal",characters:["スノウ"],memo:"オーエン",
text:`スノウ	いつ見ても、幻想的な光じゃ。
	美しいものほど危険が潜んでおるというがそれを体現するような森じゃのう。
晶	本当ですね……。
スノウ	これは……。お絵描きタイムじゃな。
晶	お絵かき？
スノウ	うむ！ステンドグラスのイメージが湧きそうじゃ。景色をスケッチするのじゃ。
晶	そうか、スノウとホワイトはステンドグラス職人なんですよね。
スノウ	《ノスコムニア》
晶	あっ、紙と絵筆が出てきて勝手に動き出した……。
スノウ	何かリクエストはあるかの？
~~~~~~~~~	~~~~~~~~~
選択	虹色に光る石。
スノウ	うむ。雪はこの国のどこにでもあるが、
	不思議な石の光が反射して、特別美しく彩られておるな。
~~~~~~~~~	~~~~~~~~~
選択	森の毒。
スノウ	ほう。目に見えないものを描くこともまた、創作の醍醐味じゃな！
~~~~~~~~~	~~~~~~~~~
選択	似顔絵。
スノウ	この流れで似顔絵を要求するとは……。
	おぬしのそういうところ、好きじゃよ。
~~~~~~~~~	~~~~~~~~~
[さらさらさら……]
晶	わ、スノウ、上手ですね！？
スノウ	我ら、めっちゃ暇じゃからの。練習する時間はいくらでもあるのじゃ。
`},
{id:10806,title:"スポットの思い出（１）",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	オーエンはここで死にかけたことがあるんですよね。
オーエン	は？死にかけたんじゃないよ。死んじゃったんだよ。
晶	（そこ大事なんだ……？）
	その時の、夢の森の毒で見る夢って、どんなものでしたか？
オーエン	……さっきからなに？余計なところをいちいち突っついてさ。
晶	す、すみません……気になって……。
オーエン	夢なんて、見てる時は楽しい気がしても、醒めると虚しい。
	だからいちいち覚えていないけど。
	……馬に乗って、剣を振るっていたような気がする。魔法の方が便利なのに。
	本当、夢なんて馬鹿みたいだな。
`},
{id:10807,title:"スポットの思い出（２）",type:"personal",characters:["⑧"],memo:"オーエン",
text:`オーエン	この辺りでフィガロに会ったことがある。
晶	え？ここって……、夢の森でですか？
オーエン	そう。死にかけた子供を連れてたよ。よくある森の使い方だ。
	魔法でも助からない病気だって。
	子供は森の毒で、幸せそうな笑い声をあげてた。
	それで、だんだん疲れて、死んだ
晶	…………。
オーエン	可哀想だっていうなら、早く殺してやればいいのにね。
	賢者様ならどうしたい？
晶	え？
オーエン	きみが死にそうになった時。すぐ殺して欲しい？ここに連れてきて欲しい？
	仲間が死にかけた時は？すぐ殺したい？ここに連れてきたいの？
晶	俺は……。
オーエン	決めておいてよ。きっと希望と逆のことをしてあげる。
`},
{id:10808,title:"スポットの思い出（３）",type:"personal",characters:["ブラッドリー"],memo:"オーエン",
text:`ブラッドリー	昔、致命傷を負った部下で、夢の森に連れてってくれって言ったやつがいたっけな。
	馬鹿言ってんじゃねえ！って殴って止めたが……。
	結局死んじまったから、連れて来てやりゃよかったかもな。
晶	…………。
ブラッドリー	でも、生かしたかったんだよなあ。
	おまえならどうしてた？
晶	雑談にしては重い話題ですね……。
~~~~~~~~~	~~~~~~~~~
選択	わからない。
晶	わかりません……。その時にならないと……。
ブラッドリー	はっきりしねえな。ちゃんと考えて決めておけよ。
	魔法舎にはてめえに従おうとするやつらがいるんだからな。
	俺はそんな死に方、絶対に御免だぜ。覚えておけよ、賢者様。
~~~~~~~~~	~~~~~~~~~
選択	連れて行かなかった。
晶	俺も、連れて行かなかったと思います。
ブラッドリー	だよな。俺も最後の一瞬まで、生かしてやれる手立てを考えたいんだよ。
	おまえとは気が合うぜ。
~~~~~~~~~	~~~~~~~~~
選択	連れて行った。
晶	本人の希望なら、連れて行ったと思います。
ブラッドリー	マジかよ。ガキならそれでいいかもしれねえが、俺は御免だな。
	俺がそんなこと言い出した時は血迷ってるだけだから止めてくれよ。
	万が一、生きれるかもしれねえんだし。
	頼むぜ、賢者様。
`},
{id:10809,title:"オーエンへの印象（１）",type:"personal",characters:["スノウ"],memo:"オーエン",
text:`晶	毒の森とはいえ、自然の多い場所はやっぱり元気になる感じしますか？
スノウ	自然の力は得られるが、毒から身を守る必要もあるからの。
	そちらに魔力を使って、どっこいどっこいじゃ。プラマイゼロで、普通じゃな。
晶	そうですか……。
	オーエンは夢の森を気に入ってると言っていたから、みなさんはどうなのかなと思って。
スノウ	ふむ……。
	我ら魔法使いは心で魔法を使う。
	ゆえに自然を好み、心穏やかになる場所が好きなものじゃ。
	じゃが、オーエンは悪意や恐怖から力を得る。
晶	オーエンだけがそうなんですか？
スノウ	そうじゃ。特異体質や、突然変異の類じゃろう。
	普通はそんなものばかり浴びておったら気が狂ってしまうはずじゃが……。
	あるいはもう、とうの昔におかしくなっているのかもしれんのう。
`},
{id:10810,title:"オーエンへの印象（２）",type:"personal",characters:["ホワイト"],memo:"オーエン",
text:`ホワイト	賢者よ。オーエンとはぐれたのか？
晶	はい……。見失ってしまって。
ホワイト	そのうち戻って来るじゃろう。あやつは気まぐれで、しがらみがないから怖ろしい。
晶	ホワイトも、オーエンが怖いんですか？
ホワイト	そうじゃ。オーエンは玩具で遊ぶように人や他の魔法使いと付き合うておる。
	誰ともしがらみがないから怖ろしいのじゃ。
晶	しがらみ、ですか。
ホワイト	オズやミスラでも多少のしがらみはある。
	しがらみがあればそこを突いて少しくらいは従わせることができよう。
	オーエンにはそれがない。力でしか抑えることができぬ。
	そこがあやつの怖ろしいところじゃ。
晶	力が逆転したら、誰も逆らえなくなってしまうってことですね。
ホワイト	その通り。目を奪ったカインのことは少しばかり気にしておるようじゃがの。
	おぬしがオーエンのしがらみとなるよう、我ら、期待しておるからの。
晶	……荷が重すぎる気がします……。
`},
{id:10811,title:"オーエンへの印象（３）",type:"personal",characters:["ミスラ"],memo:"オーエン",
text:`晶	ミスラはオーエンについてどう思っているんですか？
ミスラ	どうって……。別にどうとも。
晶	な、何かありませんか？
	親睦を深める意味合いもあって、みなさんで討伐に来ています。
	…………。
ミスラ	はあ……。オーエンねえ。明るいですよね、彼。
晶	明るいですか……！？性格の話ですよね！？
ミスラ	よく笑ってるじゃないですか。
晶	それはそうですけど……。
ミスラ	オズは陰気ですよね。
晶	陰気っていうのかな……。
ミスラ	オーエンはいつもニコニコしてて、話しかけやすいなって思ってますよ。
	少なくとも、オズよりは社交性がありますね。
`},
{id:10812,title:"オーエンへの印象（４）",type:"personal",characters:["ブラッドリー"],memo:"オーエン",
text:`晶	ブラッドリーは、オーエンのこと、どう思ってます？
ブラッドリー	気持ち悪い。怖い。
晶	身も蓋もないですね……。
ブラッドリー	何を考えてるか全然わからねえ。
	ミスラとなら、まだガッツで当たれるが、オーエンは一番やり合いたくねえ。
	最悪だぜ。
晶	でも、戦ったことあるんですよね？
ブラッドリー	ああ。ちょっと因縁つけて、怒ってんのかな……とは思ったが、仕掛けて引くわけにいかねえだろ。
晶	勝ったんですか？負けたんですか？
ブラッドリー	逃げた。
晶	意外と、逃げ出して悔しいとかはないんですね……。
ブラッドリー	はあ？当たり前だろ。死んだら勝てねえんだから。
	鹿だろうと馬だろうと、自分は卑怯だって思いながら逃げるわけねえだろうが。
	そんな馬鹿なこと考えるのは人間だけだぜ。
晶	確かに……。
`},
{id:10813,title:"オーエンへの印象（５）",type:"personal",characters:["カイン"],memo:"オーエン",
text:`晶	カインはオーエンと因縁がありますけど、オーエンのこと、どう思ってるんですか？
カイン	オーエンは厄介で、悪いやつだ。目玉も取られたし、恨みもある。
	だが、なんかイマイチ掴みどころがなくてな……。
晶	それは、確かに……。
カイン	だろ？俺が怒っても叱っても、面白がるだけで、なかなか話も進まない。
	悔しいが、今はまだ、あいつの方が強いしな。
~~~~~~~~~	~~~~~~~~~
選択	いっそ仲良くなってみては？
カイン	目玉を盗られたまま仲良くなんてのは、媚じゃないか？
	負け犬っぽく思えちまって、どうにもな……。
晶	やっぱり難しいでしょうか……。
カイン	あんたが心配してくれる気持ちは受け取っておくよ。
	だが、あいつが盗ったものをきっちり返してからだな。友達になれるのはさ。
~~~~~~~~~	~~~~~~~~~
選択	いつかやり返したいと思いますか？
カイン	以前までは、そう思っていたんだが……。
	今はあいつも、晶の魔法使いだ。あんたの役に立ってることは感謝してる。
晶	カイン……。
カイン	まあ、目玉だけはいずれ取り返すさ。他のことは、その後だな。
`},
{id:10814,title:"スポットゆかりの話（１）",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	どうして、この森の木々だけ毒を出すんでしょうか……。
オーエン	この前、力の強い魔法使いがこの辺り一帯を滅ぼしたって話をしたよね。
	その時使った魔力が強すぎて、全部がぐちゃぐちゃに混ざっちゃったんだって。
晶	それは……やばそうですね……。
オーエン	僕は見ていたかったな。どんな気分だと思う
	きみの半分くらいぐちゃぐちゃにして試してみてもいい？
晶	か、勘弁してください……。
オーエン	ふふ……。
	とにかく、僕が初めて来た頃は、まだ若くて小さな毒の森だったんだ。
	その時から、ちょっと懐かしい感じもするんだよ。
`},
{id:10815,title:"スポットゆかりの話（２）",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	あれ……。あの木の上の方、何か引っかかってませんか。
オーエン	ただの水筒だろ。旅人か商人の忘れ物じゃない。
晶	水筒！？どうしてあんな場所に……。
オーエン	雪の深い夜は、あのあたりまで雪が積もる。
	そこで冷え込むと、雪が堅くなって、朝のうちだけ雪の上を渡れるんだ。
	その時は木々の毒も薄い。
	魔法が使えないけど森を越えたいやつが夜明けから慌てて走っていくのさ。
	僕はそいつらの足留めをするのが好きだよ。
晶	通せんぼするんですか……？
オーエン	まあ、話しかけたり、魔法で道をわからなくさせたりね。
	日が昇って暖かくなってくると雪が溶けて歩けなくなる。
	毒も元通り溢れ出してくるし。
	相手がそれに気づいて、焦るところを見るのが好きなんだ。
晶	（オーエンが敵じゃなくてよかった……）
`},
{id:10816,title:"北の国について",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	北の国の魔法使いは、やっぱり、北の国が好きだから、ここにいるんですか？
オーエン	変な質問。
晶	すみません……。雪深くて険しいし、住みにくそうだなとも思うので……。
オーエン	それは人間だからだろ。寒いのは慣れたし、魔法があるから関係ないよ。
	でもまあ、よその国に行ったあとは、戻って来てよかったなとは思う。
	よその国は、朝、暗い感じがする。
晶	暗いですか……？
	雪が降って積もってると、陽を反射するから、そんなふうに思うのかもしれませんね。
オーエン	北の国は埋まってるマナ石も多いし、神秘の力が濃いから、強い魔法使いが集まってくる。
	他のやつらも、そんな理由じゃない。別にいいところでもないけどね。
晶	（そういうけど、なんとなく、魔法使いは住んでる土地に愛着を感じてる気がするな……）
`},
{id:10817,title:"〈大いなる厄災〉について",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	オーエンにとって、〈大いなる厄災〉はどんな存在なんですか？
オーエン	どうでもよかった。賢者の魔法使いになんて選ばれて、面倒臭すぎる。最悪だよ。
晶	最悪ですか……。
オーエン	今はオズがいるんだから、
	あいつが〈大いなる厄災〉をやっつけて壊してくれればいいのに。
	出来ないなんて役立たずだ。
晶	ま、まあまあ……。次の戦いも、みなさんで力を合わせて頑張りましょう。
オーエン	言われなくても、世界が滅びたら困るからやるけどさ。
	〈大いなる厄災〉もずっとひとりでいるから、こっちに寄って来ちゃうんじゃないの。
晶	ひとりで？どういう意味ですか？
オーエン	僕もそうだけど、人がたくさんいるところには、ふらっと足が向くだろ。
晶	賑やかそうだったり、楽しそうなところへ？
	〈大いなる厄災〉が寂しがってるってことでしょうか。
オーエン	寂しいとかじゃない。気になるわけでもないけど。
	そういうこと、ない？
晶	あるような、ないような……。
オーエン	…………。
	ふーん。あっそう。
`},
{id:10818,title:"オーエンのお願い",type:"personal",characters:["⑧"],memo:"オーエン",
text:`オーエン	賢者様、僕のお願い聞いてくれる？
~~~~~~~~~	~~~~~~~~~
選択	はい。
オーエン	最高。その言葉絶対に撤回しないでね。
~~~~~~~~~	~~~~~~~~~
選択	いいえ。
オーエン	泣いて「わかりました」って言っても、許さない状況にするけど、いいの？
~~~~~~~~~	~~~~~~~~~
選択	お願いによる
オーエン	内容によっては聞かないってこと？とても狡くて卑怯で様子見返事だね。
	結局、僕の人格を信用してくれないんだ。とても悲しくて、傷ついたよ……。
	今度からは僕も君を信用しないことにするね。
晶	ボロクソに言われてますけど……。
	ぶっちゃけ、ニヤニヤしながら、お願い聞いてくれない？
	って言うオーエンのことは、全然信用してないです。
~~~~~~~~~	~~~~~~~~~
オーエン	アーサーをこの森に呼んで来て、毒でおかしくなってるところを見てみたいんだけど……。
	オズはどのくらい怒ると思う？怒った時に、僕の盾になってくれない？
晶	……けっこう怒ると思いますし、おかしくなったアーサー見たくないですし、
	盾になるのはお断りします。
オーエン	どうして。森の毒でおかしくなるやつ、すごく面白いのに。
晶	（趣味悪いな……）
オーエン	オズは泣いちゃったりすると思う？
	怒ったオズの顔を見るのも楽しみだ。想像するだけでぞくぞくする。
	でも、取り乱すところは見たいけど、そのあと痛いのは嫌だよね。
	オズは僕が死なないと思っていつも容赦がない。
	やっぱり盾になってくれない？
	オズが間違えて君を殺しちゃったら、どんな顔するかな。
晶	謹んでお断りします……
`},
{id:10819,title:"スポットの人々",type:"personal",characters:["シノ"],memo:"オーエン",
text:`シノ	賢者、これ見てくれ。
シノは、少しいびつな形の、薄い円盤のようなものを差し出した。
シャボン玉のように表面が虹色に反射している。
晶	よく見ると模様が入っていますね……。木目というか、年輪みたいな……？
シノ	正解。夢の森の木こりに会ったんだ。
	切ると、中がこうなってる樹があるんだって。
	しばらくすると普通の木目に変わるらしい。
	この森にはそういう変な樹がたくさんあると言っていた。
晶	地元の人に会ったんですね。どんな方でしたか？
シノ	いかつかった。猟もするらしい。
	人間なのに強そうで、東の国の木こりより、見所がありそうなやつだった。
	夢の森の毒のせいで、植物も動物も、変なものが多いから気をつけろってさ。
晶	そうですか……。
	北の国で生きていくには、人間もたくましくないと難しそうですね……。
シノ	かもな。でも、俺の方が強いぜ。
晶	あはは。わかってます。頼りにしてますね、シノ。
`},
{id:10820,title:"スポットにいた魔法使い",type:"personal",characters:["ミスラ"],memo:"オーエン",
text:`晶	昔ここにいた強い魔法使いのこと、ミスラは知ってますか？
	この辺り一帯を滅ぼして、夢の森が生まれたっていう……。
ミスラ	誰が言ってました？
晶	オーエンです。
ミスラ	へぇ。それ、オーエンのことだと思いますけどね。
晶	え？
ミスラ	この場所には村があって、人間が住んでたんですよ。まっすぐ通れて、楽でしたから。
	それをオーエンが破壊して、毒を出す木々の森になったって。
	俺も聞いた話で良く知りませんが。
晶	そんな……。なら、この話、知られたくなかったんでしょうか。
ミスラ	さあ、ずいぶん昔のことですから。忘れてるだけじゃないですか。
晶	…………。
ミスラ	あの人、昔のことをあまり覚えていないみたいですよ。
	俺より若いはずなんですけどね。
`},
{id:10821,title:"危険な場所",type:"personal",characters:["⑧"],memo:"オーエン",
text:`オーエン	賢者様、賢者様。こっちに来てごらん。
晶	……なんですか？
オーエン	あはは、警戒しないでよ。もとこっち、この樹だよ。
晶	うわ、大きいですね……！下はトンネルになってるんですか……？
オーエン	地面近くに空いた樹洞を広げて、道を通してあるんだ。通り抜けられる。おいで。
晶	ま、待ってください……。暗そうで……。
	（な……、なんだか視線を感じるような……）
オーエン	実はね。この樹には、悪さをした魔法使いが封印されてるんだ。
	僕らは今、彼のお腹の中を通ってるってわけ。目が合うと、取り込まれるよ。
樹洞の木	ギョロギョロッ！
晶	ひえぇ……！！
オーエン	あはは。残念、もう出口だ。無事みたいだね。
	樹になった賢者様のお腹の中、歩けたら面白いと思ったのにな。
`},
{id:10822,title:"オーエンの評判",type:"personal",characters:["カイン"],memo:"オーエン",
text:`魔法使いの狩人	オーエンか。確かにわしも、この辺でよく見かけるのう。
	……一度、自害しようと森に入ろうとする男に、オーエンが話しかけとった。
	からかっとるのかと思うたが、オーエンの恐ろしい妄想を吹き込まれて、男は怖気付いて引き返して行きおった。
晶・カイン	…………。
カイン	……善意とは思えないが……。
晶	ど、どうでしょうか……。
	まだ見たことないいいところも、あるかもしれませんし……。
カイン	そうか？悔しがってそうだ。
	じいさん。あんたはそのあと、オーエンに話しかけたりしたのか？
魔法使いの狩人	まさか。目をつけられたら最後じゃ。姿を消して、じっとしておる。
カイン	だよな。役に立つこともある。くらいで捉えておこうぜ。
晶	そ、そうですね……。
カイン	その時のあいつの顔、見たかったな。
`},
{id:10823,title:"スポットでの名物",type:"personal",characters:["ホワイト"],memo:"オーエン",
text:`ホワイト	夢の森の名産品は「夢幻の木の枝」じゃ。
	ほれ。
晶	枝……？この木の枝が名産品なんですか？
ホワイト	そうじゃ。夢幻の木の枝を燃やすと幸せな幻影が見られる。
	ほんの束の間、手にした者の一番の願望を映し出すのじゃ。
晶	願望……。
ホワイト	手折って持ち帰ると人間たちに高く売れるらしくての。
	マッチに加工して小銭を稼ぐものがおる。
	それゆえ、ここ最近では「夢幻の木の枝のマッチ」が夢の森の特産品になったのじゃ。
晶	……。それってマッチ売りの……。
ホワイト	ほうほう。賢者の耳にも入るほど有名になっておったのか。
	魔法舎の子供達に買って帰ってやろうかの。
`},
{id:10824,title:"スポットでの発見",type:"personal",characters:["ムル"],memo:"オーエン",
text:`ムル	わー！ぴっかぴかだ！
晶	ムルは、夢の森に来るのは初めてですか？
ムル	何度も来てるよ！ここはナイトメアストーンが採れるんだ。
晶	ナイトメアストーン？
ムル	夢の森の木の中にだけできる石！毒と悪夢を取り込んだ宝石だよ！
	めちゃめちゃ探して、めちゃめちゃ人に聞いて、めちゃめちゃお金をバラまいた！
	やっといっこだけ見つけたんだけど、
	叩いて炙って冷やして捏ねて削って混ぜて固めて砕いて。
	何度も何度も何度も何度も何度も何度も何度も何度も調べてるうちに、
	カケラもなくなっちゃったんだ！
晶	本当に、研究になるとすごい執着心と集中力ですね……。
ムル	忘れてたけど今思い出したよ！実質覚えてたってこと！賢者様も探して！
	見つかるまで帰らない！
晶	（まずい質問をしちゃった気がする……）
`},
{id:10825,title:"楽しい場所",type:"personal",characters:["ミスラ"],memo:"オーエン",
text:`ミスラ	この辺りは、花が群生してるようですね。
晶	本当だ。綺麗だけど、この花も毒を出すのかな……。
ミスラ	さあ。持って帰ってみたらどうですか。ルチルなんかは喜ぶんじゃないですか。
晶	うーん……。危なそうなのでやめておきます……。
ミスラ	それにしても、ここは退屈ですね。
	……虫捕りでもしましょうか。
晶	今！？
ミスラ	暇なんで。
	《アルシム》
	どうぞ。
晶	こ、この世界にも、虫捕り網があるんですね……。
ミスラ	セミとかいないかな。
晶	いないと思いますよ！？もっと安全な場所でやりましょうよ……！
ミスラ	セミ、ご存じですか？食べたことあります？
晶	食べません……！食べないで……！？
`},
{id:10826,title:"マナエリア",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
	「マナエリア」と呼ぶとも聞きました。オーエンにもマナエリアがありますか？
オーエン	あるけど、言いたくはないよね。壊されたりしたら嫌だし。
晶	そ、そんなことしませんよ……。
	無理に聞き出したいわけじゃないので、言いたくなければ大丈夫です。
	でも、教えてもらっていれば、誰かに壊されそうになった時、庇えるかもしれないですけど。
オーエン	……。なるほど。
	僕のマナエリアは、市場だよ。どこの、とまでは教えないけど。
晶	市場ですか……。賑やかそうな印象ですけど、
	そういう場所でも集中できるんですか？
オーエン	余計な質問には答えない。
晶	はい……。
オーエン	もし戦争が起こって、僕のマナエリアが滅ぼされそうになった時は、身を呈して庇ってね、賢者様。
`},
{id:10827,title:"アミュレット",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	オーエンもアミュレットを持ってますか？
オーエン	あるよ。賢者様のアミュレットは何？目の前で壊したらどんな顔をするか知りたいな。
晶	俺のアミュレットはまだわからなくて……。
オーエン	なんだ。つまらない。
	…………。
少しだけ考えてから、オーエンは机の引き出しを引く。
そこには、たくさんのチェスの駒が入っていた。よく見ると、形が揃っていないように思える。
駒の数も、こんなに多かっただろうか？別々のセットを混ぜたような感じだ。
オーエン	チェスのピースが僕のアミュレットみたいだよ。
	これを山にして置いておくと元気が出る。
晶	駒だけ？盤面はないんですか？
オーエン	遊んだことなんてないよ。ずっとひとりだし。
晶	馬が好きなんですか？
	なんだか、馬の形の駒が多い気がしますけど……。
オーエン	……うるさいな。もうおしまいだよ。
晶	うわっ！
駒に手を伸ばしかけると、バタンと音を立てて引き出しが閉まった。
間一髪で、俺は指を挟まずに済んだ。
`},
{id:10828,title:"ケルベロスとお散歩",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	オーエン、オーエン！
オーエン	おや、賢者様。何しに来たの？
晶	何しに来たのじゃないです！なんで森にケルベロスがいるんですか。
	殺されるかと思った……。
オーエン	散歩させてるだけだよ。
	いつもトランクに閉じ込めてるからたまに外に出してあげるんだ。
晶	散歩って、そんなペットみたいなノリで……。
オーエン	僕と一緒にいてもいいの？
	あの子、僕を見るとすぐ殺そうとしてくるから、ここは危ないんじゃない。
	はは、すごく怒ってる。かわいい。
晶	そんな……。
	もう少し仲良くできないんですか？
~~~~~~~~~	~~~~~~~~~
選択	おやつとか使って！
オーエン	そんなものがどこにあるの？
	もしかして、自分のことを言ってるのかな。賢者様は健気だね。
晶	いえ、そういうわけでは……！あっ、差し出そうとしないで。
~~~~~~~~~	~~~~~~~~~
選択	おもちゃとか使って！
オーエン	は？馬鹿にしてるの。そこらへんの犬や猫と一緒にするなよな。
晶	すみません、つい……。
オーエン	仲良くなる必要なんてないよ。トランクを閉めればいいだけだから。
	また嫌われちゃうかもしれないけど。
`},
{id:10829,title:"家族",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	オーエンは家族のことを覚えていますか？
オーエン	ミスラは？
晶	え？
オーエン	ミスラにも聞いた？あいつ、なんて言った？
晶	ええと……、あまり覚えてないって言ってたような……。
オーエン	ふうん。なら僕もあまり覚えてない。
晶	……なら、って何ですか？言いたくないなら、そう言ってもらえれば……。
オーエン	覚えてないんだってば。
	ミスラも覚えてないなら、別におかしいことじゃないだろ。
晶	……わかりました。
オーエン	ふん。
晶	（変な言い方だったな。
	　家族のことを知られたくないなら、もっと別の言い方をしそうだけど……
	　オーエンから昔の話を聞くときは、慎重にした方が良さそうだ……）
`},
{id:10830,title:"オーエンから見たカイン",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	オーエンはカインの片目を奪ったり、よくカインに絡んだりしていますけど、カインが気になるんですか？
オーエン	気にならないよ。
晶	そうなんですか？
オーエン	もちろんさ。どうだっていいよ。暇つぶしにからかってるだけだよ。
晶	でも……。
	自分の顔に片目をはめてるくらいだから、カインの目は気に入ってるんですよね。
オーエン	まさか。嫌いだよ。
	蜂蜜と朝焼けの光を溶かして混ぜたみたいな、夏の花みたいな、こんな色は嫌い。
晶	（そのわりに、機嫌のいい顔だ）
オーエン	カナリアの羽の色みたいで、日を浴びた柑橘類の皮の色みたいで嫌い。
晶	（オーエンは天の邪鬼だなあ。それは好きっていうんだと思うけどな。
	　あ……。いいことを思いついた）
	じゃあ、カインのどんなところが嫌いですか？
オーエン	たくさんあるよ。魔法使いのくせに、人を守る騎士だったこと。
	くだらない剣を大事にしてるところ。
	笑っているところ。大きな声。赤い髪。
	僕に片目を奪われたくせに、僕に普通に話しかけてくるところ。
	それから……。なんだよ。何を笑ってるの？
晶	いえ、なんでもないです。
オーエン	まだ他にも聞きたい？
晶	はい。聞かせてください。
`},
{id:10831,title:"オーエンとミスラ",type:"personal",characters:["ミスラ","オーエン"],memo:"オーエン",
text:`晶	オーエンは北の国にいた頃、ミスラとはどんな関係だったんですか？
オーエン	どうもこうもないよ。ミスラは危ないから、あまり関わらないようにしてた。
晶	危ないというのは……。
オーエン	ミスラの動きは予想がつかないんだよ。
	何を言っても通じないから、言葉で追い詰めて操るのも難しいしさ。
晶	そうなんですね。
オーエン	そう。たまに成功するけどね。
~~~~~~~~~	~~~~~~~~~
選択	どうやって成功したんですか？
オーエン	ミスラの場合は、追い詰めるよりも、おだてた方が動かしやすいんだよ。
	おねだりしたり、頼み込んだりさ。
	そうやって利用して使ったこともあるけど、ミスラに媚びるのは癪だし、いきなり気が変わるから止めたんだ。
~~~~~~~~~	~~~~~~~~~
選択	他にもそういう相手はいますか？
オーエン	……カインかな。僕の思い通りに弱ったりしない。
	何を言っても通じないわけじゃないけど。
	自分が悪いなら、罰を引き受けよう。それでも、最善の未来を諦めない。
	みたいなところが、暑苦しいし、面倒くさい。
~~~~~~~~~	~~~~~~~~~
晶	そうなんですね……。
	でも、今はミスラとも大分、仲良くなってきたんじゃないですか？
オーエン	そんなわけないでしょ。
ミスラ	オーエンじゃないですか。一緒にお茶でも飲みましょうよ。
	眠れなくて、気を紛らわせたいんです。
晶	ほら、誘われてますよ。
オーエン	不眠で気を紛らわせたいミスラになんか、近づくわけ無いだろ……。
	いつ攻撃してくるかわからないし……。
ミスラ	オーエン。
オーエン	急な用事を思い出した！じゃあね。
`},
{id:10832,title:"お気に入り",type:"personal",characters:["オーエン","ブラッドリー"],memo:"オーエン",
text:`晶	オーエンは北の国にいた頃、ブラッドリーとはどんな関係だったんですか？
オーエン	仲良しだったよ。ブラッドリーは僕が嫌いだったけどね。
晶	そうなんですか？
オーエン	ブラッドリーは手下がたくさんいたからね。
	彼本人がそれなりに強くても、手下がそうだとは限らない。
	時には、ひとりぼっちより、組織っていうのは弱いものなのさ。
	僕の話を聞いて、彼の手下は、彼を疑ったし、彼を怖がったし、彼を裏切って、自分が首領になりたくなったりしたよ。
	だから、ブラッドリーは僕が嫌いなんだ。
	ふふ。僕はもっと仲良くしたっていいのにね。
晶	（機嫌がいいな……）
	今はブラッドリーに手下はいないでしょう？
	ひとりぼっちになったブラッドリーは、どんな風に見えるんですか？
~~~~~~~~~	~~~~~~~~~
選択	強そうですか？
オーエン	どうだろう。魔力では元から僕にかなわないけどね。
	あいつは妙に頭が回るから、誰かを庇ったり、誰かを指揮したりしなくていい分、
	何か仕掛けてきそうで嫌だなあ。
~~~~~~~~~	~~~~~~~~~
選択	弱そうですか？
オーエン	弱いよ。ひとりぼっちだから弱いんじゃない。
	ひとりぼっちのくせに誰かに構うからだよ。
	ブラッドリーは人間ぽいところがあって、気に入った相手には心を裂くんだよ。
	身内を見捨てられないのさ。
~~~~~~~~~	~~~~~~~~~
晶	そうなんですね……。
	オーエンが意地悪なことを言わなければ、ブラッドリーと仲良くできそうですけど……。
オーエン	意地悪なんか言わないよ。ブラッドリーに嫌な顔されるのが好きなだけ。
	あ、噂をすればブラッドリーだ。
ブラッドリー	うわ、オーエンじゃねえか……。向こう行こ。
オーエン	待ってよ、ブラッドリー。一緒にお喋りしない？ねえったら。
晶	（楽しそうに追いかけていった……。これはブラッドリーも苦労するな……）
`},
{id:10833,title:"オーエンと和菓子",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	そういえば、オーエンは和菓子って知ってますか？
オーエン	は？餓死？
晶	いえ、そんな物騒な話ではなく……。俺がいた世界にあったお菓子です。
	こう、クリームとか小麦粉は使わないタイプの。
	お団子とか、羊羹とか。甘くてもちもちしたものが多かったかもしれません。
オーエン	もちもち。
晶	確かキッチンに「そう思ってしまえばきな粉」と「多分これは小豆」があったはず。
	おはぎぐらいなら作れるかも……！
オーエン	…………。
晶	あ、すみません。ひとりで盛り上がってしまって。
オーエン	別に。もちもち、僕も食べたい。
晶	えっ、おはぎですか？
オーエン	そう、追い剥ぎ。
晶	追い剥ぎじゃないですが……わかりました！頑張って作りますね！
オーエン	さっさと行って。早くしないとおまえのこと追い剥ぎするよ。
`},
{id:10834,title:"猫の通訳",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	あ、猫……！迷い込んで来ちゃったのかな？
ねこ	にゃあ～。
晶	そっかそっか。お腹が空いてるんだね。
オーエン	違うよ、シーツだって。
晶	あっ、オーエン。
オーエン	干してたシーツが落ちてるってさ。別にお腹は空いてないらしいけど。
晶	そうだったんですね……！教えてくれてありがとうございます。
	オーエンの能力は本当にすごいですね。
	きみもえらかったね～。よしよし、お礼にたくさん撫でてあげよう。
ねこ	にゃあ、にゃ！
晶	あ、今どういたしましてって言った！
	私も猫の気持ちが少しずつわかってきたのかも……！
オーエン	……。
	僕に勝とうなんて１００年早いよ。
`},
{id:10835,title:"特技",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	（あそこにいるのはオーエン……？周りに小鳥が集まってるみたいだけど……）
オーエン	……賢者様か。
晶	オーエン。鳥に餌をあげてたんですか？
オーエン	僕が？食べることはあっても、食べさせたりなんかしないさ。
	おしゃべりを聞いてたんだ。鳥は噂話が好きだよ。
	新しい賢者様は魔法舎の魔法使いに嫌われてるって話してる。詳しく聞きたい？
晶	……だめですよ。そんな風に言ったって騙されません。
	みなさんのことを信じてますから。
オーエン	つまんないの。
晶	オーエンは、鳥や動物と会話できるんでしたよね。
	魔法使いはみんなそうなんですか？
オーエン	さあ。他のやつには無理じゃない。
晶	そうなんだ……。動物と話せるなんてちょっと羨ましいです。
オーエン	動物なんて単純で退屈だよ。誰の悪口も言わないしさ。
小鳥	ピピピ……。
晶	（でも、オーエン自身は動物に懐かれやすい気がするな……。
	　話ができると仲間だと思われたりするのかな？）
`},
{id:10836,title:"意地悪オーエン",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	（ん？なんだか体が暑いような……）
	部屋が燃えてる！？
オーエン	やあ、賢者様。
晶	オーエン！助けてください、突然火が……。
オーエン	いいね、その顔。もっと怖がってよ。このままだと全部燃えちゃうし、死んじゃうよ。
晶	助けてください！丸焦げになりたくないです！
オーエン	……もっと上手におねだりしてよ。
	怯えるおまえを助けてあげる僕に、何を返してくれる？
晶	この間、中央の都に行った時に発見した、超美味しいお菓子の店を教えます！
	いや、ご馳走します！
オーエン	……まあ、いいか。
	《クアーレ・モリト》
	はい、おしまい。僕の作った幻は楽しかった？
	賢者様、最高に面白い顔してたよ。
晶	…………。
オーエン	はは、いい暇つぶしになった。お返しのこと、忘れるなよ。
`},
{id:10837,title:"紋章",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	賢者の魔法使いには、目印になる賢者の紋章が身体に現れるって聞きました。
	オーエンの紋章はどこにあるんですか？
オーエン	きみのこと、頭からバリバリ食べさせてくれたらわかるかもね。
晶	また怖がらせるようなこと……。
	あれ？……待ってください。もしかして、オーエンの口の中……。
オーエン	あたり。
オーエンはにやにやしながら、口を開けて舌を出して見せた。
黒く描かれた紋章がはっきり刻まれている。
晶	そんな場所にも、紋章が現れることがあるんですね……。驚きませんでしたか？
オーエン	驚いたっていうか、ムカついたよ。
	自分で選んだわけでもない模様が、突然張り付いてさ。
	取りたくて仕方なくて、色々試して舌を抜いたら一度死んだ。
晶	過激な嫌がり方ですね……。
	じゃあ、紋章や賢者の魔法使いのことは、知らなかったんですね。
オーエン	ずっとひとりだったし、厄災にも興味なかったしね。
	紋章のこと、有名な双子なら何か知ってるかと思って会いに行ったけど、歓迎会を開かれてすごく苛々した。
	それからずっと厄災と戦ってるけど、そろそろうんざりだな。
	いい加減、解放してほしいよ。
`},
{id:10838,title:"歌声",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	何か聞こえる……。これは歌？
オーエン	〜♪
晶	えっ！オーエンが歌ってる……。
	（周りに小鳥が集まって、まるで映画のワンシーンみたい）
オーエン	……それで隠れてるつもり？丸見えだよ、賢者様。
晶	すみません、盗み聞きするつもりはなかったんです。
	オーエンはとても歌がお上手なんですね。歌うのが好きなんですか？
オーエン	好きか嫌いかなんて考えたことないけど、動物たちは寄ってくる。
	こいつらはみんな音楽が好きなんだ。
	こんな風に、ほら。
	〜〜♪
晶	わ、もっと集まってきた……。
オーエン	はは。僕の歌につられてやってくるなんて、賢者様もけものみたいだけどね。
`},
{id:10839,title:"怖がらせたい",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	オーエン！部屋から変な音がしましたが、大丈夫ですか？
オーエン	賢者様か。そろそろ、隣の部屋のオズが眠る頃だと思ってさ。
	嫌がらせに窓を引っ掻いてたんだよ。
晶	し、静かに寝かせてあげてください……。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
オーエン	好きなことをしてるよ。ここでの生活をとても楽しんでる。
	きみはひとりのとき、楽しい？ひとりでいるのは本当にきみの意思？
	みんなから嫌われて誘われないだけじゃない？
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
オーエン	呼ばないよ。誰かを部屋に入れるのが嫌だ。
晶	す、すみません、突然……でも、心配だったので……。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
オーエン	そんなものないよ。僕は僕の好きな時間に、好きなことをする。
	なのに、魔法舎の食堂はおやつの時間を勝手に決めてるから腹が立つ。
	奪おうとするとフィガロが出て来るし……。
	耳がいいんだね、賢者様。
~~~~~~~~~	~~~~~~~~~
晶	もう真夜中なのに、目が覚めて廊下に出たら変な音がしたから驚きましたよ。
オーエン	寝物語を聞かせてあげるよ。
	首なしの騎士の話がいい？鏡で呼び出す悪魔の話がいい？
晶	結構です。みんなも眠っているから、騒いじゃダメですよ。
	じゃあ、おやすみなさい。
オーエン	北の国の死の湖の話をしようか。
	そこには墓場しかない小さな島があって、死体を運ぶ子供の船が……。
晶	怖い話を囁きながらついてこないでくださいよ……！
`},
{id:10840,title:"期待はずれ",type:"personal",characters:["カイン","オーエン"],memo:"オーエン",
text:`晶	オーエン、ぴくりとも動きませんね……。目は開いたままなのに。
カイン	寝てる……わけじゃなさそうだしな。誰かに殺されたのかもしれない。
晶	ええ！一体誰がそんなことを……。
カイン	腹の立つやつだったが、あまり気分のいいものじゃないな。
	待ってろ、オーエン。必ず、俺が犯人を見つけてやるから……。
オーエン	くっ……あは、あっはは！
カイン	うお、オーエン……！
オーエン	ああ、可笑しかった。間抜けな顔で覗き込んでくる賢者様と騎士様、最高だったよ。
晶	心臓が飛び出るかと思いましたよ……。
	今の死んだふりだったんですか！？
オーエン	さあ、どうだろうね。
カイン	……顔色が悪く見える。やっぱり死んでたんじゃないか？
	本当に大丈夫か、オーエン。
オーエン	……うるさいな。
	あーあ、つまんないの。
`},
{id:10841,title:"怒ったり笑ったり",type:"personal",characters:["オーエン","ネロ"],memo:"オーエン",
text:`晶	オーエン、おはようございます。
オーエン	…………。
晶	（めちゃくちゃ機嫌悪そう……）
	き、気持ちがいい朝ですね！お向かい失礼してもいいですか？
オーエン	好きに座れば。僕の長い脚が当たっても知らないけど。
晶	今日は特に当たりが強いですね。何かあったんですか……？
オーエン	別に。スノウとホワイトに無理やり起こされただけ。
	北の国にいたときは朝は小鳥が起こしてくれたのに。
	ここではうるさくて目が覚めるし、最悪。
晶	もし良かったら、明日からじゃ俺が起こしましょうか。
	……あ、痛っ、蹴らないで。
ネロ	おはようさん。今日の朝食はパンケーキだ。シロップはお好みでかけろよ。
オーエン	パンケーキだ。やった。
晶	（お手本みたいな気分屋さんだ……）
`},
{id:10842,title:"オーエンのイタズラ",type:"personal",characters:["⑧"],memo:"オーエン",
text:`晶	ふう。今日も無事に終わって良かったな。お水飲んだら寝よう。
	（！？きゅ、急に灯りが消えた……）
？？？	みーつけた。
晶	ひっ……！
オーエン	やあ、賢者様。いい夜だね。
晶	オーエン……！
	もう、脅かさないでくださいよ。心臓が止まるかと思いました……。
オーエン	ひどいね賢者様。
	この場に僕しか見えないからって、僕が悪戯したって決めつけるんだ？
晶	え、今のオーエンじゃないんですか。
オーエン	言わなきゃわからない？
晶	タイミング的にてっきり……。疑ってすみません。
オーエン	気にしなくていいよ。嘘だから。
晶	えっ。
オーエン	あはは。賢者様は本当、騙されやすくて面白いなあ。
`},
{id:10843,title:"怒らせ上手",type:"personal",characters:["北"],memo:"オーエン",
text:`ブラッドリー	オラァ！オーエン！どこにいやがる、出てきやがれ！
ミスラ	賢者様、オーエンを見掛けませんでしたか。
晶	今日はまだ見ていませんが、どうしたんですか？
	二人ともそんなに怖い顔で……。
ブラッドリー	ちっ！俺はこっちを探す。ミスラ、おまえは向こうだ。
ミスラ	指図しないでください。潰しますよ。
晶	行ってしまった……。一体何があったんだろう。
オーエン	賢者様。
晶	うわ、オーエン！いきなり現れないで下さい。みんなが探していましたよ。
オーエン	知ってるよ。
	ブラッドリーのお菓子を横取りしたり、オズに負けたミスラを優しく慰めてあげただけなのにさ。
晶	むしろ、煽っちゃったんじゃ……。
	オーエン、一緒に二人を探しましょう。ちゃんと謝ったほうがいいですよ。
オーエン	嫌だよ。死んじゃったらどうするの。
スノウ・ホワイト	オーエン、見つけたぞ！　今度という今度は許さんからの！
晶	スノウとホワイトまで、怒らせてたんですか……！
`},
//ブラッドリー
{id:10901,title:"スポットの印象",type:"personal",characters:["スノウ"],memo:"ブラッドリー",
text:`スノウ	北の国のこの辺りは、人間も魔法使いもほとんど訪れぬ場所……。
	我らも把握できておらんような氷漬けになった古代の魔法生物が見つかったり、おかしな現象が多い地域じゃ。
晶	二千年以上生きているスノウにも、わからないことがあるんですか？
スノウ	ほほほ。我ら、冒険発見などには興味がなかったからのう。
	目を向けぬものは、存在しないも同じじゃ。
	弱肉強食、優勝劣敗の北の地では、世界がどのように作られたかを知るより、殺されずに生きていく方が大切じゃからのう。
晶	確かに……。ムルみたいな西の魔法使いなら、喜んだかもしれませんね。
スノウ	そうは言っても、魔力が強くなければ、この辺りで調査を続けることは難しい。
	吹雪が強くて地形も変わり続けておる。
	かといって、そこそこの魔力のものがうろついていれば、北の魔法使いが石にしようとやってくる。
	縄張りの概念が強くある地域もあるが、この辺りは希薄じゃな。
	それゆえ、ブラッドリーも隠れ家にしておったんじゃろう。
	時の洞産の噂自体は古くから聞いておった。
	この場所を探すものにも会ったことがある。
	見つけたものはおらんかったがの。
晶	違う時代に繋がってるって噂ですよね。
	スノウも、過去に戻りたいと思うことがありますか？
スノウ	賢者よ……。我にそれを聞くのかの？？？
晶	あっ……。すみません……。
スノウ	ほほほ、良い良い。
	オズの不思議の力を持ってしても、過ぎた日を巻き戻すことはできぬ。
	時を越えるというのは、いにしえからの万人の夢なのかもしれんな。
`},
{id:10902,title:"ブレイクタイム",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`ブラッドリー	…………。
晶	ブラッドリー、ここにいたんですね。
	……すみません。お邪魔でしたか？
ブラッドリー	いいぜ。気付いてたし。
晶	考え事ですか？
ブラッドリー	そうだな……。考えてたような、ねえような……。
晶	……珍しく歯切れが悪い言い方ですね。
ブラッドリー	はは！言うようになったじゃねえか。ここは俺のマナエリアに似てるんだよ。
	だからちょっと瞑想してたんだが……。
晶	瞑想？ブラッドリーが？
ブラッドリー	変かよ？魔法使いは大抵やるもんだぜ。
	だけどまあ、ここは思い出すことが多すぎるな。集中できねえや。
	なんか喋っててくれよ。そのくらいが、ちょうど良さそうだ。
	あんたの世界の話だとかさ。
晶	……。わかりました。すべらない話がひとつだけあるんですよ。
ブラッドリー	いいな。笑えなかったら氷漬けにしてやるぜ。
`},
{id:10903,title:"スポットの思い出（１）",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`ブラッドリー	時の洞産自体をアジトにするって話もあったんだよな。
	吹雪は凌ぎやすいし、そこそこ広いし、誰も来ねえし、テコ入れすりゃ手下全員分の部屋も作れそうだったんだが……。
	ひとつだけ問題があって、やめた。
晶	問題？なんですか？
ブラッドリー	厨房を作ったんだけどさ、煙が出ていかなかったんだよ。
晶	ああ……！なるほど。
ブラッドリー	穴穿つんでも、あんまりやりすぎると地盤がまずそうでな。
	料理作ってたやつは、入口の側や外に小屋建てるんでもいいって言ってたけど、寒くってよ。
	かわいそうだろ。
晶	そうですね……。毎日長い時間いることになるでしょうし。
	やっぱり、仲間思いなんですね。
ブラッドリー	あいつに作るの任せて、ちゃんとしたもん食うようになったら、飯は薬と同じだって分かったんだよ。
	美味えもん食ってると士気も全然違うしな。
	組織を動かすのに食事の優先度は高え。てめえも覚えとけよ。
`},
{id:10904,title:"スポットの思い出（２）",type:"personal",characters:["ミスラ","ブラッドリー"],memo:"ブラッドリー",
text:`ミスラ	昔、この辺りで暇つぶしに人間を脅して遊んでたらブラッドリーが出てきて……。
晶	物騒すぎる遊びは、やめていただきたいですが……。
ミスラ	暇すぎて。もしくは苛々してたのかな。
	覚えてないですけど、彼が出てきて庇うから、殺し合いになったんですよ。
晶	人間をですか？ブラッドリーの仲間だったんですか？
ミスラ	そういう感じじゃなかったと思いますけどね。なんだったんですか？あれ。
ブラッドリー	知らねえ。ただのじじいだよ。
	ミスラがいたぶって遊んでるだけなのはわかってたが……。
	なんとか生き延びようとするツラしてたからよ。いい顔してんなって思ったんだよ。
ミスラ	そんな理由で人間なんかを庇って死にかける意味がわかりませんね。
	あなた、老人が好みだったんです？
ブラッドリー	うるせえ。ボロクソにやられて帰ったら仲間にもボロクソに怒られたぜ。
	ミスラに手ェ出すのはご法度だったしな。
ミスラ	ルールは守ってくださいよ。
ブラッドリー	てめえがいうな。……思い出したら腹立ってきたわ。表出ろやコラ。
ミスラ	いいですよ。退屈してたんで、遊んであげます。
晶	（ちょっと雪合戦しようぜ！みたいなノリでケンカ始めるのやめてほしいな……！）
`},
{id:10905,title:"ブラッドリーへの印象（１）",type:"personal",characters:["ホワイト"],memo:"ブラッドリー",
text:`晶	ホワイトから見た、ブラッドリーの印象ってどうですか？
ホワイト	性格自体は嫌いではないがの。
	短気なところはあるが、北の魔法使いにしては珍しく話が通じるタイプじゃ。
晶	確かに、困った時には相談できそうな、頼れる感じがありますね。
ホワイト	北の魔法使いの多くは、他者と関わりを持たずに過ごしておる。
	強い魔力があれば群れる必要がないからの。
	しかし、長い時間を生きれも、それでは人間たちの言う社会性や情緒や価値観というものは育たぬ。
晶	ミスラやオーエンが、ときどき幼く感じるのは、そのせいなんでしょうか……？
ホワイト	ほほほ。まさに。
	年相応に振る舞う必要など、ひとりで生きてゆける北の魔法使いにはないんじゃよ。
	その点ブラッドリーは、我らが人間たちや若い魔法使いの面倒を見るように、部下の面倒を見ていたのかも知れぬな。
	付き合いの長いオズやフィガロでさえ、未だ子供の面倒を見てやる気持ちでおるが……。
	ブラッドリーだけは、たまに価値観が対等であるように感じるかも知れんのう。
晶	スノウやホワイトとですか？
ホワイト	うむ。それゆえ、首に縄をつけて、我らの方が上だということをわからせてやっておるのじゃ。
	基本的にはやんちゃで馬鹿な、若くて可愛い魔法使いじゃと思うておるよ。
`},
{id:10906,title:"ブラッドリーへの印象（２）",type:"personal",characters:["ミスラ"],memo:"ブラッドリー",
text:`晶	ミスラはブラッドリーとも付き合いが長いんですよね。
ミスラ	はあ……。そんなに長いってわけじゃないですけどね。数100年程度です。
晶	（じゅうぶん長いと思うけど……）
	ブラッドリーのこと、どう思っているんですか？
ミスラ	ブラッドリーですか？
	そうだな……。
	彼って、早口ですよね。最初の2、3単語しか、頭に入ってこないことがありますよ。
晶	ついていけてないことがあるんですね……。聞き返したりしないんですか？
ミスラ	はあ……。面倒で。
	だいたい笑ってるから、いい話なのかなと思って聞いてます。
	かと思うと急に怒り出すし、忙しないですよ。
	いつも、聞いてもないことをたくさん喋るから、
	よくわからないまま、はあ、はあ、はあ、って返事をしていると……。
	突然、「よし、決まったな」って言われるんです。
	それで、いつの間にか彼のしたいことを手伝っていることが多くて。
	あれ？
	とは思いますね。
晶	（目に浮かぶな……）
ミスラ	まあ、騒がしいから、疲れてる時には会いたくないです。
`},
{id:10907,title:"ブラッドリーへの印象（３）",type:"personal",characters:["オーエン"],memo:"ブラッドリー",
text:`晶	オーエンはブラッドリーのこと、どう思っているんですか？
オーエン	…………。
	ブラッドリーってさ。難しくて。
晶	難しい？
オーエン	簡単にやれそうじゃない？
	簡単に傷つけられそうだし、簡単に不安にさせられそうでしょ。そんな印象。
	だけどいざやりあってみると、なんだか、根っこに届いてない感じがする。
	何言っても青ざめないし錯乱しない。下手すると反論されて嫌な思いするし。
	やりにくくて、難しい。
晶	そうですね……。根っこがどっしりしている感じはするかもしれないです。
オーエン	お互いなんとなく嫌いなのはわかるよ。
	でも、オズやミスラよりマシって、お互いそう思ってるのもわかる。
	北の国はけだものばかりだけど、ブラッドリーはまだ、話せば通じる感じがするかな。
`},
{id:10908,title:"ブラッドリーへの印象（４）",type:"personal",characters:["ネロ"],memo:"ブラッドリー",
text:`晶	ブラッドリーって口が悪いけど、情に厚くて仲間思いなところがありますよね。
	ネロはどう思いますか？
ネロ	いや……。なんで俺に聞いた
	あいつとはここにきて会ったばっかりで、お互いよく知らねえし……。
~~~~~~~~~	~~~~~~~~~
選択	そういうことになってるんですか？
ネロ	待てよ賢者さん。まさかブラッドに何か言われたのか？違うぜ？
	その情報、間違ってっから。
晶	でも、ブラッドリーのこと。ブラッドって呼んだりしますし……。
ネロ	…………。
	ブラッド……リー……くんのこと、そんな風に言ってたかな……。
	でもほら、ブラッドなんて、よくある愛称だろ？
	俺も馴れ馴れしい客にネリーって呼ばれたりしてたしさ。
~~~~~~~~~	~~~~~~~~~
選択	気が合いそうに見えました。
晶	気が合いそうに見えました。
ネロ	いやいや。北の魔法使いと東の魔法使いじゃ、気が合うわけなんてねえだろ。
	なんでそう思ったんだ？
晶	でも、ブラッドリーは、ネロのご飯が好きですし……。
ネロ	ああ……、あー……、そっちか。なるほどな。そうだよな。
	まあ、あいつ、飯はよく食うよな。
	食べ物を大事にしてるところは好印象だよ。それだけ。
~~~~~~~~~	~~~~~~~~~
選択	初対面の感想でもいいので教えてください。
晶	初対面の感想でもいいので教えてください。
ネロ	はあ、初対面の……？あー、ちょっと待ってくれよ。そうだな、ええと……。
	……、見た目は怖そうだけど……、意外とどんな奴の話でもちゃんと聞いてくれるやつだなって思ったかな。
	俺も若かったせいもあるけど……。
晶	え？
ネロ	え？……あ、いや。なんでもない。
~~~~~~~~~	~~~~~~~~~
晶	じゃあ、ひと言で言うと、ブラッドリーはどんな人に見えますか？
ネロ	まあ……、他人に誤解されやすそうなやつだよな。
	おしゃべりなバカみてえに見えるが、思ったより色々考えて、色々なことを見てる。
	かと言って、思ったより他人を理解してない。
晶	……なんとなくわかります。ブラッドリーの話すこと、そうだなって思う時と、それ、俺には無理かなって思う時があるので……。
ネロ	だよなあ。オズみたいに、生まれながらに強かったわけじゃないって聞いたけどさ。
	たぶん、ボロ負けしながら強くなったんだろう。
	だから、他人もてめえと同じだけ我慢すれば、同じだけ強くなれると思ってる。
	けど、心も身体も、あんだけ踏ん張れるやつなんてそうそういねえんだよ。
	それがわからねえ。
	……邪推だけどさ。
`},
{id:10909,title:"スポットゆかりの話（１）",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	この辺りは人間が全然居ないって言ってましたよね。
	やっぱり、人と暮らすのは嫌いなんですか？
ブラッドリー	人間の好き嫌いで住処を選んだりしねえよ。北はまず魔法使いの縄張りがあって、
	そいつに尽くして庇護を受けてる人間が住んでる。
	強い魔法使いがいて、そこから村や町ができて、それがたくさんあってずっと小競り合いしてんだ。
	親玉が負けりゃ、皆殺しになることだってある。
晶	想像以上に殺伐としてる感じですね……。
ブラッドリー	てめえは相当平和ボケした世界から来たんだったな。
	北に限らず、同じ感覚で外歩いてるとすぐに死んじまうぜ。
晶	北の国で人間が生きていくには、魔法使いに守ってもらう必要があるんですね。
ブラッドリーに尽くす人間もいたんですか？
ブラッドリー	俺様は必要なもんは自分で奪うんだよ。
	上等なマナ石や魔道具やお宝を持ってる奴の所に突っ込んで行って蹴散らすのさ。
	それでも、なんとなく目にかけてる村や街が所々にあったな。
	たまに出かけりゃタダで飲み食いできるような。
	で、最近困ってることがあるんですーみてえな相談が持ちかけられて、面倒そうなら俺らが出て片付ける、って感じか。
晶	面倒そうなら引き受けてくれるんですか？
ブラッドリー	俺様が雑用なんてやるもんか。持ちつ持たれつ、って感じよ。
	もちろん、立場は俺様の方が上だけどな！
晶	（昔の映画で観た、マフィアの親分みたいな感じだなあ……）
`},
{id:10910,title:"スポットゆかりの話（２）",type:"personal",characters:["ブラッドリー","スノウ","ホワイト"],memo:"ブラッドリー",
text:`ブラッドリーと時の洞窟を歩いていると、イェストゥルムの羽音と、水滴の音に混ざって、
時を超えた会話が聞こえてきた。
~~~~~~~~~	~~~~~~~~~


冷厳な子供の声	おや……？我によく似た可愛い子がおるようじゃ。
	まるで一緒に生まれて来たようじゃ。
冷厳な子供に似た声	本当じゃ……。我によく似た可愛い子がおるのじゃ。まるで鏡を見ているようじゃ。
冷厳な２人の子供の声	カレシ～。暇なら我とお茶しない？
冷厳な２人の子供の声	初対面ごっこ、楽しいのう！きゃっきゃっ！
~~~~~~~~~	~~~~~~~~~
ちらちらと、コウモリの目が光っている。
隣に立っていたブラッドリーが、荒っぽい手つきでコウモリたちを追い払う。
ブラッドリー	じじいども……。いつの時代も気色悪い遊びしてやがんな。
晶	でも、昔の声が聞こえるなんてすごいですね。
	選んで聞くのは難しそうですけど、時の洞窟にいれば、世界中の情報が手に入るんじゃないですか？
ブラッドリー	イエストゥルムが世界中にいればな。
化石みてえな魔法使いも知らなかったような動物だから、どうだかな。
晶	そうか、聞いた音を記憶してるんでしたね。
	じゃあ、北の国の人の少ない場所にしかいないのかもな……。
ブラッドリー	ははあ。もう少し習性がわかってりゃ、魔法で操っていい仕事できたかもしれねえな。
`},
{id:10911,title:"時を超える声（１）",type:"personal",characters:["ブラッドリー"],memo:"ブラッドリー",
text:`イェストゥルムの羽音と、水滴の音に混ざって、時を超えた会話が聞こえてきた。
~~~~~~~~~	~~~~~~~~~
気怠げな男の声	ブラッド……！返事しろ、寝るな！　ブラッド！！
貫禄のある男の声	……っせえな、痛えんだよ……。
	大丈夫だ……、……俺様が、このくらいで、……ッ……。
気怠げな男の声	何が大丈夫だ、てめえ。何回石になりかけりゃ気がすむんだ！？
	……人の話聞かねえで、無茶ばっかり……。
	俺はもう、これ以上は付き合いきれねえぞ……。
	北の国でこんなこと言ってるなんて俺の方がおかしいのかもしんねえけど……。
	……強い敵に挑むのも、高価なお宝手に入れんのも、石になったら終わりだろうが……！
貫禄のある男の声	強い敵も、お宝も狙わねえで、生きてる意味なんてねえだろうが。
	石になるのと、どう違うんだよ。
気怠げな男の声	…………。
貫禄のある男の声	ッぅ……はは……、そんな顔すんなよ……。てめえがいりゃあ大丈夫だって。
	頼りにしてるぜ、相棒。

~~~~~~~~~	~~~~~~~~~
ちらちらと、コウモリの目が光っている。隣に立つブラッドリーを盗み見ると、彼と目が合った。
ブラッドリー	あんたはどう思う。
晶	え？
ブラッドリー	何にも挑まねえまま暮らして石になるのなんんて。
	欲しいものに命を懸けずに生きるなんて。そんなのは俺じゃねえ。だとしても……。
	俺が変われば良かったのか？
`},
{id:10912,title:"時を超える声（２）",type:"personal",characters:["スノウ"],memo:"ブラッドリー",
text:`イェストゥルムの羽音と、水滴の音に混ざって、時を超えた会話が聞こえてきた。
~~~~~~~~~	~~~~~~~~~
しゃがれた男の声	ずいぶんやつれて帰って来たな、おまえ。盗賊団の首領の引き渡しに行ったんだって？
	中央の国の水がそんなに合わなかったのか？
疲れた男の声	北に戻ってだいぶ経つのに、捕まった魔法使いの叫び声が耳から離れないんだよ……。
	魔法使いってやつは、不死なのかな？
	俺なら５分で死んじまうような拷問にかけられて……。
	捕まったのは悪党の盗賊だって聞いてたけど、捕らえた方も酷いもんだ。
	双子の子供と、あの男……。
しゃがれた男の声	魔法使いなんて、どいつもこいつも恐ろしいものさ。仕事とはいえ、大変だったな。
疲れた男の声	……なあ、魔法使いのする約束ってのは、どんな意味があるんだ？
	あの盗賊、約束をするように迫られていたんだ……。
~~~~~~~~~	~~~~~~~~~
ちらちらと、コウモリの目が光っている。足音がして、俺は振り返った。
スノウ	賢者よ。ひとりで奥へ行くと、道に迷ってしまうぞ。
晶	スノウ……。ブラッドリーは囚人だって聞いてますけど、魔法使いの囚人ってたくさんいるんですか？
スノウ	さほど多くはない。
	そもそも、ブラッドリーを捕らえたのもフィガロのパフォーマンスの一環じゃからの。
晶	パフォーマンス……？
スノウ	うむ。善良な魔法使いが、悪事を働く魔法使いを捕らえて懲らしめる様を人々に知らしめるためじゃ。魔法使いが盗賊団を捕まえたとあれば、聞こえがいいじゃろう。
	ブラッドリーは、見せしめにちょうど良かったんじゃ。
	善良な魔法使いとならば、人間は安心して共存していくことができるじゃろうからな。
	……ほほほ。安心するがよい。
	善良な賢者の魔法使いはみな、いつでもそなたの味方じゃよ。
`},
{id:10913,title:"時を超える声（３）",type:"personal",characters:["ホワイト"],memo:"ブラッドリー",
text:`ホワイトと時の洞窟を歩いていると、イェストゥルムの羽音と、水滴の音に混ざって、
時を超えた会話が聞こえてきた。
~~~~~~~~~	~~~~~~~~~
冷厳な子供の声	しばらくどこかを旅するだけじゃ。心配せずとも、必ず戻ってくる。
	ひとりの時間が欲しいんじゃ。
冷厳な子供に似た声	嫌じゃ……！今まで我ら２人だったから楽しめたのじゃ！
	分かち合うものなくして、心踊るはずもない！
冷厳な子供の声	それは互いに、己の身をもって孤独を知るまで分からぬことじゃ。
冷厳な子供に似た声	…………。
	どうしても行くと言うのなら、この場でそなたを殺して、我も死ぬ。
冷厳な子供の声	落ち着くがよい。すぐに帰ると言っておるではないか。
冷厳な子供に似た声	そなたが孤独を知り、万が一、我と共にある時間より心地好いと感じたならば、
	そなたは2度と帰らぬ。
	……それを、我は誰より分かっておるのじゃ。
~~~~~~~~~	~~~~~~~~~
ちらちらと、コウモリの目が光っている。隣に立つホワイトを盗み見ると、彼と目が合った。
晶	……今のは、もしかして……。
ホワイト	ほほほ。２度と帰れんようになったのは、我の方じゃったのう……。
`},
{id:10914,title:"時を超える声（４）",type:"personal",characters:["ミスラ"],memo:"ブラッドリー",
text:`ミスラと時の洞窟を歩いていると、イェストゥルムの羽音と、水滴の音に混ざって、
時を超えた会話が聞こえてきた。
~~~~~~~~~	~~~~~~~~~
明るく奔放な女の声	ミスラ、ボロボロじゃん。
	またオズにケンカ売りに行ったの？オズは無理だよ。
色気の滲む男の声	……っあなたが……、俺は強いって、言ったんじゃないですか……。
	……ッ、ゴホゴホ……ッ。
明るく奔放な女の声	だからってオズは無理だってば。血が出過ぎてるから喋んないほうがいいよ。
色気の滲む男の声	……ムカつくな……。２回も……言わないでくださいよ……。
	……はあ……、は……。
明るく奔放な女の声	オズは強いもんねえ。
	オズがもう少しおしゃべりで優しくてロマンチックならオズの子供を産むのになあ。
	アタックしてもいつも振られちゃうんだよね。
色気の滲む男の声	……あなた、子供なんか欲しかったんですか……？
明るく奔放な女の声	いつかはね。でも、どうせ産むなら、強い魔法使いとの子を産みたいじゃん？
	魔法使いが生まれたら、その子もきっと強くなるよ。
~~~~~~~~~	~~~~~~~~~
ちらちらと、コウモリの目が光っている。隣に立つミスラを盗み見ると、彼と目が合った。
晶	……今のって、もしかしてルチルとミチルの……。
ミスラ	………。
	虫けらみたいに弱い男と結婚して子供を産んでましたけどね。
	……何を考えてるのかわかりませんよ。女って。
`},
{id:10915,title:"時を超える声（５）",type:"personal",characters:["オーエン"],memo:"ブラッドリー",
text:`オーエンと時の洞窟を歩いていると、イェストゥルムの羽音と、水滴の音に混ざって、
時を超えた会話が聞こえてきた。
~~~~~~~~~	~~~~~~~~~
若く低い男の声	おい、もっと慎重にやれよ。鍵がかからなくなったらどうするんだ。
若く明るい男の声	大丈夫だって。
	地下室に魔法使いを閉じ込めてるなんて、村の連中を怖がらせるための嘘だよ。
若く明るい男の声	死んだ爺さんの話が本当なら、飲まず食わずで１００年くらいここにいることになるじゃないか。
若く明るい男の声	いくら魔法使いだって不死身じゃないんだ。
	本当にいたとしても、とっくに石になってるさ。
	……っと、ほら、開いたぞ！
若く低い男の声	……暗くて何も見えないな……。本当に何もいなかっ……
死人のような男の声	だれ。
若く明るい男の声	……っ！？
死人のような男の声	僕、外に出ていいの。……ようやく、ここから出してくれるの？
若く低い男の声	……い、生きてる……！と、扉を閉めろ！早く……！！
若く明るい男の声	うわああ……！化け物……っ！！
~~~~~~~~~	~~~~~~~~~
ちらちらと、コウモリの目が光っている。隣に立つオーエンが、洞窟の奥を見つめている。
晶	今の声……、聞いてましたか？
オーエン	……さあ。よく聞こえなかったな。
`},
{id:10916,title:"時を超える声（６）",type:"personal",characters:["ネロ"],memo:"ブラッドリー",
text:`ネロと時の洞窟を歩いていると、イェストゥルムの羽音と、水滴の音に混ざって、
時を超えた会話が聞こえてきた。
~~~~~~~~~	~~~~~~~~~
貫禄のある男の声	あ？おい、新入り。なんだそれ、てめえの呪文か？なんか、シケてんな。
	そこそこ魔力があんのに力が出てねえの、呪文のせいじゃねえか？
気怠げな男の声	……呪文がどうとか、あるんすか？
貫禄のある男の声	あるよ。魔法は心で使うんだからよ。好きな言葉を唱えるだけで全然違うぜ。
	てめえの好きなものはなんだよ。なんでもいい。お宝でも、食い物でも。
	でもまあ、女の名前はやめとけ。
気怠げな男の声	好きなもの……。……………………。
貫禄のある男の声	……遅えよ！サッと言え。
気怠げな男の声	っ……、すんませんなんか、パッと思いつかなくて……。
貫禄のある男の声	はあ？ボサッとしたやつだな。てめえ、ほんとに北の生まれかよ？
	明日までに変えとけよ。そしたら俺様が、また見てやるよ。
~~~~~~~~~	~~~~~~~~~
ちらちらと、コウモリの目が光っている。隣で黙っているネロを横目で見ながら、俺は話題を探す。
晶	……ネロの呪文には、どんな意味があるんですか？
ネロ	呪文の意味？あー、そうだな……。
	「ひとつは全てを学ぶため」みたいな？
	ざっくり言うと、だけど。
	そんな気持ちで、一人前になりたがってた時期があったんだよ。
	……酸いも甘いも学ばせて貰ったけどな。
`},
{id:10917,title:"時を超える声（７）",type:"personal",characters:["ネロ"],memo:"ブラッドリー",
text:`ネロと時の洞窟を歩いていると、イェストゥルムの羽音と、水滴の音に混ざって、
時を超えた会話が聞こえてきた。
~~~~~~~~~	~~~~~~~~~
気怠げな男の声	それから、ボス、次の仕込みの話さ……。
貫禄のある男の声	ブラッドって呼べよ。もうそんな関係じゃねえだろ。てめえは相棒みてえなもんだ。
気怠げな男の声	そ……。そんなわけいくかよ。あんたはボスだ。俺はただの子分で……。
貫禄のある男の声	水臭いじゃねえか、ネロ。てめえがいるから、ここまでやってこれたんだ。
	てめえの忠告のおかげで、何度、命拾いしたと思ってんだ。
	おまえがいなきゃとっくに石になってたさ。
	敵も味方も、おまえがナンバー２だとわかってる。ブラッドでいい。
	ほら、呼んでみな。
気怠げな男の声	…………。
	ブ……。ブラッド……。　
貫禄のある男の声	おう。……あはは！照れてやがる！
気怠げな男の声	うるせえ……。
	……嬉しいよ、ボス……。いや……。ブラッド。
	ここまで俺を認めてくれたあんたの、相棒を名乗って、恥ずかしくねえ男でいるよ。
	絶対に。
~~~~~~~~~	~~~~~~~~~
ネロ	……………………。
晶	今の声、やっぱりネロの……。
ネロ	…………死にてえ……。いや、あの時の俺を殺しちまいてえ……。
	…………っ。
	……とにかく、あのイェストゥルムだけは、生かしちゃおけねえ……。
	ちょっと、仕留めてくるわ……。
`},
{id:10918,title:"時を超える声（８）",type:"personal",characters:["ミチル"],memo:"ブラッドリー",
text:`ミチルと時の洞産を歩いていると、イェストゥルムの羽音と、水滴の音に混ざって、
時を超えた会話が聞こえてきた。
~~~~~~~~~	~~~~~~~~~
威厳のある男の声	しばらく見ていて分かったことだが……。
	おまえは愚かだ。
聡明な幼い子供の声	…………？私は愚かではありません。
威厳のある男の声	腹が減るのも、眠くなるのも、予測できない。
	暑いのか寒いのかさえ自分で把握できず、発熱していても気づけない。
	おまえは愚かだ。自分のことさえ何もわかっていない。
	空を飛ぶ魔法は、未だ使えまい。
聡明な幼い子供の声	いいえ。飛べます！
威厳のある男の声	バルコニーから落ちれば怪我をする。痛いと言って泣くのはおまえだ。
聡明な幼い子供の声	泣きません！
威厳のある男の声	…………。では、試してみろ。
聡明な幼い子供の声	……！はいっ！
	見ていてくださいね、オズ様！よいしょ……。……えいっ！！
聡明な幼い子供の声	あーっ。
威厳のある男の声	ア……、アーサー！アーサー！！
~~~~~~~~~	~~~~~~~~~
ちらちらと、コウモリの目が光っている。隣に立っていたミチルが、心配そうな顔をしている。
ミチル	フィガロ先生は、箒に乗る練習は原っぱでするようにって、教えてくれましたけど……。
晶	そうですね……。なんだか、教える方にも手探り感がありましたね……。
`},
{id:10919,title:"時を超える声（９）",type:"personal",characters:["スノウ","ホワイト"],memo:"ブラッドリー",
text:`スノウとホワイトと時の洞窟を歩いていると、イェストゥルムの羽音と、水滴の音に混ざって、
時を超えた会話が聞こえてきた。
~~~~~~~~~	~~~~~~~~~
冷厳な子供の声	おぬしと北の国で会うとはいつ以来かのう。世界征服とやらはもうやめたのか？
寂寥な男の声	ホワイト様が居なくなって、オズがやる気をなくしたんですよ。
	まさか、あなたたちが殺し合うなんて。
	ただでさえ、この世が虚しくて始めた世界征服だったのに。
	余計、虚しくなっちゃったんじゃないですか。
	俺も、また新しく何かやることを探さなきゃ。充実した日々だったのに。
	いい迷惑です。
冷厳な子供の声	ホワイトは居なくなってなどおらぬ。ずっと我のそばにおる。
寂寥な男の声	……とうとうイカれたんですか？
冷厳な子供の声	我の魔力で魂をつなぎとめ、今まで通り２人仲良く暮らしておるのじゃ。
冷厳な子供に似た声	ほほほ。久しぶりじゃな。驚いたかの？
寂寥な男の声	……そんな……。それじゃあ……。
	オズも北に戻ってきたし、元通り、なんですかね……？
冷厳な２人の子供の声	さよう。ハッピーエンドじゃの。
~~~~~~~~~	~~~~~~~~~
ちらちらと、コウモリの目が光っている。
スノウ･ホワイト	……ほほほ。
~~~~~~~~~	~~~~~~~~~
選択	ハッピーエンドである。
晶	（……本人たちが幸せなら、それがハッピーエンドでいいのかな……）
~~~~~~~~~	~~~~~~~~~
選択	ハッピーエンドではない。
晶	（いや……、ハッピーエンドで片付けるにはちょっと問題が多すぎるのでは……）
`},
{id:10920,title:"北の国について",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリー、調子が良さそうですね。
	やっぱり、故郷に帰ってくるのは嬉しいですか？
ブラッドリー	土地が体に合うからか？嬉しいとか感慨とかは、別にねえけどな。
晶	でも、魔法使いならどこにでも行けるのに、ずっと北の国にいたんですよね。
	好きだったからじゃないんですか？
ブラッドリー	だって、魔法使いも土地の魔力も、北が一番強えじゃねえか。
	他の国に行ったってしょうもねえだろ。強いやつもいねえし、高価なマナ石もねえ。
	何よりダセェじゃん。
晶	ダサい……？他の国のこと、ダサいって思うんだ……。
	西や中央は華やかですけど、ダサいですか？
ブラッドリー	は！そんなもん、数ばっか増えた人間が作ったような文化じゃねえか。
	北の国は魔法使いが好き勝手やってて、人間は隙間で生きてんだよ。
	弱くて何もできねえんだから当たり前だろ。
	なのに他の国は、人間どもが幅きかせてチャラッチャラしててよ。
	それに合わせて隠れて生きてる魔法使いまでいるんだぜ？
	くだらねえし、バカみてえだし、死ぬほどダセェだろうが。
	俺はそんなのまっぴらごめんだね。
晶	力の強い魔法使いだと、そういう風に感じるんですね……。
ブラッドリー	おい、賢者。間違うなよ。弱くても、もがくバカは好きさ。
	弱いのを理由に、他人の顔色伺いながら、
	何もしようとしねえのが賢いと思ってるのがダセェって言ってんだよ。
`},
{id:10921,title:"〈大いなる厄災〉について",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリーは投獄中に賢者の魔法使いに選ばれたんですよね。
	〈大いなる厄災〉がやってくる夜だけ、牢獄から出してもらえたんですか？
ブラッドリー	ああ。ついてるよな。
	年に一度、厄災相手に暴れられたし、前後の数日間は魔法舎の中なら自由だしで、羽伸ばせるしよ。
	こないだのなんか始めから手強くて、こりゃ何日かかるのか？って一瞬喜んだくらいだぜ。
晶	今までとはやっぱり全然違う感じだったんですね……。
ブラッドリー	いつもは一晩だけの祭りみてえなもんだ。
	集まって、盃打って、飲んで食って、やるかーって戦って、お開き。
	でもこないだのは、どんどんどんどん近づいてきて、やってもやっても引き上げる気配がねえ。
	力負けするやつが出てきたくらいで、ミスラが、「あ、これ、まずいですね」つって、
	居なくなった。
晶	えっ……！？逃げちゃったんですか？
ブラッドリー	そりゃ逃げるさ！
	気付いたらオーエンも居ねえし、当然、俺もずらかるつもりだったが……。
	南の弱いやつらは遠くに行けねえなと思って振り返ったら、もう石になってやがった。
晶	…………。
ブラッドリー	それでいよいよヤバいから俺も離脱した。
	オズと双子がいなけりゃ、世界はあのまま終わってただろうな。
`},
{id:10922,title:"スポットにいた魔法使い",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	この辺りに住んでいた時のブラッドリーの盗賊団には、どんな人たちがいたんですか？
ブラッドリー	ここにいた時か……。
	コウモリ野郎の話はしたよな。あとはまあ、コックの相棒と……。
	１番の古株もまだいた頃だな。酒飲みで、筋肉隆々で、刺青が好きで、中身は、頭使わねえ俺って感じのやつだよ。
	南の羊飼いに似たやつもいたぜ。ずっと黙ってて、従順で忠実で、仕事が早え。
	だが、たまにキレて手がつけられなくなる。
	あと、長い間、偵察隊を任してたやつ。
	器用な魔法が得意で、ネロの最初の上司だった。
	話し上手で、調子が良くて、……あ、いや。
晶	なんですか？
ブラッドリー	あいつはここに来る前に石になっちまったんだったかもしれねえな。
	……この話、面白えか？
晶	お、面白いです。
	あ……、変な意味じゃなくて、ブラッドリーがどんな人たちと過ごしてたのか、興味あります。
ブラッドリー	ふうん。ま、みんな居なくなっちまったけどよ。
~~~~~~~~~	~~~~~~~~~
選択	１番弱い魔法使いは？
晶	１番弱い魔法使いは？
ブラッドリー	当たり前だが弱えやつはすぐ入れ替わっちまう。
	もともと、北じゃひとりで生きられねえ奴らが寄り集まってんだしな。
晶	そうなんですか？
ブラッドリー	弱くてやっていけなくても、北以外じゃ生きられねえ奴がいんのさ。
	連むのが嫌いでも、石になるよりはマシだろ。
~~~~~~~~~	~~~~~~~~~
選択	１番かっこいい魔法使いは？
晶	１番かっこいい魔法使いは？
ブラッドリー	俺だぜ？容姿の話なら魔法で変えられるんだからな。
	目に見えるもの信じすぎてると痛い目に合うぞ。
	だが、1度、大物を狙う時に手を組んだ、色男がいたっけな。呪術に詳しくて。
	西から来たって言ってたぜ。西のパイプ飲みをシャキッとさせた感じだよ。
	腕が良かったが、あいつとはあれっきりだ。
	魔力も強かったし、まだ生きてるだろうな。
~~~~~~~~~	~~~~~~~~~
選択	魔女はいなかったんですか？
晶	魔女はいなかったんですか？
ブラッドリー	魔女は男をからかうのが趣味なんだよ。
	うちの団は純朴なやつばっかりですぐ揉めやがるし。男所帯だったぜ。
	それでも、野垂れ死にたくねえって、男に化けて混ざってたのもいたけどな。
	案の定、他の部下とくっついて出て行った。
晶	それは……ハッピーエンドですね。
ブラッドリー	ああ。ハッピーエンドだぜ。
`},
{id:10923,title:"危険な場所",type:"personal",characters:["オーエン"],memo:"ブラッドリー",
text:`晶	あれ、洞窟の奥の方に明かりが……。
	わ……、あそこ、緑色に光ってる？石か、苔なのかな？幻想的で綺麗だな。
	もう少し近くで見て……。
オーエン	賢者様。
晶	わっ……！？オーエン……、居たんですね。びっくりした……。
オーエン	それ、虫だよ。
晶	え？
オーエン	光ってるやつ。小さい虫だよ。たくさん、岩に張り付いてるんだ。
	よく見て、動いてる。
晶	……………………。本当だ……。
	オーエンは、虫とも話せるんですか？こっちに来ないように、頼んでもらえませんか？
オーエン	虫は喋らないさ。でも、賢者様の目が光ってたら、きみのこと好きになると思うよ。
	そいつら、太陽じゃない光に寄ってくる習性がある。魔法できらきらさせてあげるね。
晶	え、目を？ちょっ……、ちょっと待ってください……！！
オーエン	ふふ。
	《クアーレ・モリト》
晶	っぎゃーー！！
`},
{id:10924,title:"スポットの名物",type:"personal",characters:["ネロ"],memo:"ブラッドリー",
text:`ネロ	あっ……。
晶	え？
ネロ	今、外光ったか？
晶	ど、どうでしょう？雷とかですか？
ネロ	いや、この辺り、光る雪が降るんだよ。それに砂糖が混じってるんだ。
	見間違いかな……。
晶	光る雪に砂糖が……？
ネロ	ああ。星屑糖っていう珍しい砂糖なんだ。
	光ってて、口の中でパチパチはじけて、味もそこそこ良いんだぜ。
晶	この辺りの特産品なんですね。外、少し見に行ってみましょうか？
ネロ	悪いな。持って帰って何か作ってやったら、お子様たちが喜ぶかなと思って。
晶	きっと喜びます。ネロは前にも星屑糖を集めたことがあるんですか？
ネロ	あはは、あるある。
	滅多に降ってこねえから、見つけたら、仲間全員ザル持って外に立たせてさ。
	寒ィ寒ィって言いながら、みんなで降ってくる雪集めて、
	それでやっと、こんくらいの瓶ひとつ分とれるんだ。
晶	貴重なんですね……！ネロのお菓子で食べられるのが楽しみです！
`},
{id:10925,title:"楽しい場所",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`ブラッドリー	おう、賢者。ここ、見てみろよ。
晶	何か彫ってある……。絵ですか？よく見ると、壁いっぱいにありますね。
	ブラッドリーが描いたんですか？
ブラッドリー	俺じゃねえよ。この洞窟を見つけた時にはもうあったんだ。
	大昔に誰かが描いたんじゃねえかな。
	ほらここ。俺はドラゴンを追っかけてる狩人に見えるんだけどよ。
	仲間連中じゃ、喧嘩してる男と女だとか、でけえ風呂に入ってるだとか
	意見が割れてさ。
	あんたは何に見える？
~~~~~~~~~	~~~~~~~~~
選択	手を繋いでる双子。
晶	手を繋いでる双子に見えます。
	２人が周りの動物みたいなのをやっつけたって感じでしょうか。
ブラッドリー	ははあ、スノウとホワイトか。人間のためになんか狩ってたのかもしれねえし、
	倒れてんのは人間って可能性もありそうだな。
晶	スノウとホワイトが、そんなことしますかね？
ブラッドリー	は？中央の王子みてえな寝ぼけたこと言ってんなよ。
~~~~~~~~~	~~~~~~~~~
選択	ドクロを持ったミスラ。
晶	これがドクロで、こっちがミスラみたいに見えます。周りにあるのはご馳走かな……？
ブラッドリー	ミスラの魔道具はもともとチレッタのもんだ。
	真ん中にいるのはチレッタかもしんねえな。大食いだったって聞くし。
晶	こんなに食べますかね？
ブラッドリー	食うよ食う。俺様だって食うぜ。
~~~~~~~~~	~~~~~~~~~
選択	杖を掲げるオズ。
晶	杖を掲げてるオズに見えます。たくさんの敵を倒したところかな？
ブラッドリー	ああ、あり得るぜ。昔は好き放題暴れてたからな。
	相当昔から絵心あるやつにもトラウマ残してんだな。
~~~~~~~~~	~~~~~~~~~
晶	この壁画、貴重なものなんじゃ……。
ブラッドリー	さあな。興味ねえけど、面白えだろ？
`},
{id:10926,title:"マナエリア",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
	「マナエリア」と呼ぶとも聞きました。ブラッドリーにもマナエリアがありますか？
ブラッドリー	ああ。俺のマナエリアは、北の洞産にある地底湖だな。
	光る石がそこらじゅうに生えてて明るい、青くて広くて冷たくて静かなところだ。
	じっと立ってると、頭が冴え冴えとしてくる。
	喧嘩は頭を使うのも大事だからな。でけえ仕事の前にはよく出かけてた。
晶	なるほど……。気力を充電するっていうよりは、精神の集中や安定に使うんですね。
ブラッドリー	他のやつはどうだか知らねえけどな。
	マナエリアの使い方なんて、魔法と一緒でそれぞれ違うもんだろう。
	俺の場合はどんなに熱くなってても、頭ん中はあの地底湖みてえに冷えてなきゃ、強い魔法は操れねえ。
	気に入って根城にしてた間は、魔法の調子もすこぶる良かったぜ。
	オズにもよくケンカ売りに行ってたわ。
`},
{id:10927,title:"アミュレット",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	ブラッドリーもアミュレットを持ってますか？
ブラッドリー	ああ、アミュレットな。あるぜ。
ブラッドリーは、ガラス棚に置いてある石を掴んで、俺に手渡した。
割れた石の断面は青く輝いて、年輪のような美しい模様が浮かんでいる。
ブラッドリー	俺のマナエリアの洞窟にあった石だ。
	普段は洞窟の中で光ってるが、明かりは割ると消えちまう。
	洞窟の地底湖は、それと似たような青色をしてんだよな。模様が入ってて綺麗だろ。
晶	はい……。宝石みたいですね。
ブラッドリー	あっはは！目が利くじゃねえか。豪邸が立つほどのお宝の原石だよ。
晶	高価なものなんですか？
ブラッドリー	俺様の部屋に、高価じゃねえものなんてあるかよ。欲しけりゃ奪ってみるんだな。
`},
{id:10928,title:"珍しい寝顔",type:"personal",characters:["ブラッドリー","ネロ"],memo:"ブラッドリー",
text:`ネロ	賢者さん？
晶	ネロ、こんばんは。もう夜も遅いので明かりを消そうかと……あ。
ブラッドリー	ぐー…………。
ネロ	悪い、もうそんな時間か。俺も部屋に戻るよ。
晶	いえ、読書中にすみません。ブラッドリー、よく寝てますね。
ネロ	ああ。まったく呑気なもんだよな。おいブラッド。いつまで寝てんだ、起きろ。
ブラッドリー	んん……。
~~~~~~~~~	~~~~~~~~~
選択	ちょっと顔を覗いてみてもいいですか。
ネロ	こいつの顔なんか覗いても楽しくねえだろ。落書きでもすんのか？
晶	そういうわけではないんですが……。うわ、鼻高い。
	やっぱり魔法使いってみんな顔がいいんだな。
~~~~~~~~~	~~~~~~~~~
選択	ちょっと髪を触ってみてもいいですか。
ネロ	そんなもん触って楽しいのか……？
晶	なんかこう、ブラッドリーって犬っぽい毛質してそうだなと思って、気になって……。
~~~~~~~~~	~~~~~~~~~
ブラッドリー	……人の寝顔を無断で覗くとは、いい趣味してんじゃねえか。賢者様よ。
晶	ぎゃっ、ブラッドリー！起きてたんですか……！？
ブラッドリー	目の前でべらべら喋られて寝てられるかよ。俺様は繊細だからな。
ネロ	よく言うぜまったく。脅かしてやんなよ。
晶	す、すみませんでした。とりあえずその銃を下ろしてくれると嬉しいです……。
`},
{id:10929,title:"家族",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリーは北の国の魔法使いですけど、生まれも北の国なんですか？
ブラッドリー	なんだそりゃ。当たり前だろうが。
晶	す、すみません。オズやフィガロは北の国生まれなのに、別の国の魔法使いとして召喚されていたから……。
ブラッドリー	ははあ、確かにあの二人、気に食わねえよなあ。
	オズなんて特に、北の魔法使いの代名詞みてえなやつなのによ。
	俺は生粋の北の魔法使いだぜ。生まれも育ちも、ってやつだ。
晶	そうなんですね……。北の国は住んでいる人間が少ないって聞きましたが、
	どんな家族だったんですか？
ブラッドリー	俺は親父も魔法使いだった。そこそこの悪党で見習う所も多い男だったが、縄張り争いに負けて石になっちまった。
	魔法使いの息子が欲しかったらしくて、たくさん子供を作っててよ。俺がアタリだ。
	大勢いた兄弟たちが最初の子分だな。
	俺たちも、親父を石にしたやつに殺されかけたがなんとか逃げた。
	しばらく後で、仇は取ったけどな。
晶	軽く話してもらった割に壮絶ですけど……。
	お父さん思いだったんですね、ブラッドリー。
ブラッドリー	馬鹿、情で仇討ちしたわけじゃねえよ。
	落とし前はきっちりつけなきゃ、示しがつかねえだろうが。
	組織の頭は、誰かに舐められたまま生きてくことなんてできねえ。
	手下に寝首かかれて終わりだ。
	覚えとけよ、賢者。
`},
{id:10930,title:"相棒の真意",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリー。数日見かけないから心配してました。戻ってきてたんですね。
ブラッドリー	ああ。奇妙な傷のせいで、西の国のど真ん中まで飛ばされちまったぜ。
	腹ペコで堪んねえよ。
	どうせ、ネロのやつがなんか作り置きしてやがるだろうと思って……
	ほら、あったあった。
~~~~~~~~~	~~~~~~~~~
選択	勝手に食べたら怒られませんか？
ブラッドリー	大丈夫、大丈夫。見ろよ、ちゃんと俺の好物だろ。俺様用だぜ。
晶	（ポジティブだな……）
~~~~~~~~~	~~~~~~~~~
選択	よかったら温めましょうか？
ブラッドリー	ああ、いいっていいって。こいつは冷めても美味いように作ってあんだ。
	気が利いてるだろ？
晶	（我が物顔だ……）
~~~~~~~~~	~~~~~~~~~
ブラッドリー	夜食なんて食ってると思い出すな。……昔は俺にも、相棒みたいなやつがいたんだよ。
	俺がいねえとやってけねえやつだと思って、俺なりに、よく面倒見てやってるつもりだった。
	だが、突然姿を消しちまってさ。居ないとなると、不便でしょうがねえんだ。
	そのおかげで、スノウやホワイトに捕まったようなもんだぜ。
	ひとりになって、やってけなくなったのは、まさか、俺の方じゃねえよなって。
	未だに考えることもあるんだよな。
晶	いなくなった人を探し出して、理由を聞いたりはしないんですか？
ブラッドリー	いやあ、気にはなってるが、どうだかな……。
	あんなに信用してたやつに、嫌いだったなんて言われたら落ち込むじゃねえか。
	思い返せば、多少、雑に扱ってた自覚あるしな。
晶	ブラッドリーは北の魔法使いなのに、人情味がありますよね。
	再会したら、大事にできるといいですね。
ブラッドリー	はは、うるせえよ。
`},
{id:10931,title:"魚の仕分けもお手の物",type:"personal",characters:["ブラッドリー","レノックス"],memo:"ブラッドリー",
text:`晶	レノックス。
	……と、ブラッドリー？珍しいですね、二人揃って。
レノックス	賢者様。魚釣りに行ってきたんですが、検分すると引き留められて……。
ブラッドリー	よう、賢者。おまえ、ひょろっこいから、骨の多い魚を食えよ。こいつだな。
ブラッドリーが指先を振るうと、桶の中で泳ぐ魚の一匹に、刺青のような印がついた。
晶	ありがとうございます……。みんなの魚を振り分けてくれてるんですか？
ブラッドリー	そうとも。獲物を最初に見つけたのは俺様だ。上前をはねるのは当然だろ。
レノックス	釣ってきたのは俺だろう。
ブラッドリー	ああ？俺の方が強いんだ。文句があるならてめえを殺して奪ったっていいんだぜ。
レノックス	川魚のために殺されるのは嫌だな……。
ブラッドリー	わかったら楯突くんじゃねえよ。
	……ほら、この一番デカくて、身がしまってそうなやつは俺のだ。
レノックス	大きい魚は子供達に。
ブラッドリー	いちいちうるせえなあ。ならこっちの、これとこれでいいだろ。
	こいつらは卵が入ってそうだ。
晶	あはは。今夜の夕食が楽しみですね。
`},
{id:10932,title:"カード越しの眼差し",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリー。トランプと睨めっこなんて珍しいですね。
ブラッドリー	……ん？ちょっとな。戦略を練ってた。
晶	戦略ですか？
ブラッドリー	こないだ西のおかっぱの兄ちゃんとポーカーやったんだけどよ。
	あいつまじでめちゃくちゃ強えのな。
	俺も昔はそこそこやり込んでたはずなのにまったく歯が立たなかった。
晶	ムル、強いですよね。以前俺も勝負したんですけど、ぼろ負けでした。
	遊びだと分かってても悔しかったです……。
ブラッドリー	だよな。俺も負けっぱなしは癪だから、どうにか勝てねえかと思ってよ。
	……そうだ。おまえ、ルールはわかるんだよな？
晶	はい。一応一通りは。
ブラッドリー	そこ座れ。ちょっと相手してくれよ。
晶	でも、俺は全然強くないですよ。もっと上手い人の方が……。
ブラッドリー	つれねえこと言うなよ。夜はまだまだこれからだろ？
晶	あはは、なんだか悪い遊びみたいですね。
ブラッドリー	ならせっかくだ、賭けようぜ。身ぐるみ全部剥がれて泣くなよ、賢者様？
`},
{id:10933,title:"大乱闘はすぐそこに",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	え、何だ！？
ブラッドリー	危ねえとこだった……！
晶	ブラッドリー。あの、この爆発音は一体……。
ブラッドリー	賢者、こんなところで何してる！死にてえのか……！
晶	えぇっ！
ブラッドリー	逃げるぞ！
晶	あ、うわ。そんな急に脇に抱えなくても、ぐえっ。
	ブラッドリー、お忙しいところすみません。何があったかだけ聞いてもいいですか？
ブラッドリー	ああ？見て分かんだろ、オズとミスラだよ！
	あんなにブチ切れたミスラは久々に見た。こりゃ荒れるぜ。
晶	なるほど、やっぱり北の魔法使いって激しいんですね。
ブラッドリー	おまえもなかなか図太え野郎だと思うけどな……。
`},
{id:10934,title:"得意な魔法",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリーは、得意な魔法ってありますか？ブラッドリーにしか使えない魔法とか。
ブラッドリー	魔力強化だな。敵とやりあう前に、自分自身や、仲間の魔力を上げることができる。
	この魔法のおかげで、ミスラやオーエンに、でかい顔されなくて済んでるぜ。
晶	なるほど……。
	ブラッドリーがライバルの味方になると、困ってしまうってことですね。
ブラッドリー	そういや、前の賢者とも同じ話をした気がするな。おまえの世界の言葉でたしか……。
	ばぶ。
晶	ばぶ……？
ブラッドリー	……ん？違うな。「バフ」だったか？
晶	ゲーム用語ですね……！その魔法はやっぱり、俺には効果ないんでしょうか。
ブラッドリー	てめえにや魔力がねえからなあ。だが、土気を上げることは出来るぜ。
	《アドノポテンスム》！
晶	なんか、すごくやる気が出てきました！！今なら誰にも負けない気がします！
ブラッドリー	あっはは！その意気だ。
	ついでだから、このブラッドリー様が、正しい喧嘩の売り方を教えてやるよ。
	オズの部屋に乗り込むぜ。
晶	はい！！
`},
{id:10935,title:"手入れもぬかりなく",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	お邪魔します。ブラッドリー、いますか？
ブラッドリー	ああ。なんだ、賢者か。
晶	お届け物を持ってきました。シャイロックから預かったブランデーです。
	すみません、銃のお手入れ中に。
ブラッドリー	おう。そこ置いといてくれ。
晶	（集中してる……。あの長銃、ブラッドリーの魔道具だ。
	　男っぽい雰囲気によく似合うなあ）
ブラッドリー	なにじろじろ見てやがんだ？
~~~~~~~~~	~~~~~~~~~
選択	優しい表情だなって
ブラッドリー	そりゃ、至福の時間だからな。こいつは俺が持ってる銃の中でも特に自慢の品だ。
	おまえが持ってきた酒を片手に煽れば、そりゃもう贅沢空間よ。
~~~~~~~~~	~~~~~~~~~
選択	手つきが丁寧だなと思って。
ブラッドリー	そりゃあそうだろ。物持ちの良さは手入れで変わるからな。
	特に銃なんて男の浪漫だろ。
~~~~~~~~~	~~~~~~~~~
晶	でもブラッドリー、この間その銃を振り回してミスラと喧嘩してましたよね……。
ブラッドリー	ああ、長銃はリーチが長えし鈍器にもなるんだよ。
	魔法舎の中で実弾をぶっ放すと双子がうるせえからな。
	（その辺は若干配慮してくれてるんだ……）
`},
{id:10936,title:"紋章",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	賢者の魔法使いには、目印になる賢者の紋章が身体に現れるって聞きました。
	ブラッドリーの紋章はどこにあるんですか？
ブラッドリー	右の脇腹だよ。ホラ。
ブラッドリーは雑な手つきでスラックスからシャツの裾を引き抜くと、服を捲って見せてくれた。
黒いあざのような紋章が、脇腹の肌を大きく覆っている。
ブラッドリー	牢にブチ込まれてだいぶ経ったクソ暇な時に出てきてよ。
	さすが、俺はついてる男だと思ったぜ。
晶	ついてる、ですか？嬉しかったってことですか？
ブラッドリー	当たり前だろうが！捕まって数十年間、一度も外に出られなかったのに……。
	賢者の魔法使いになったとありゃあ、
	〈大いなる厄災〉と戦う時は、絶対に牢から出されるじゃねえか。
	即、檻の中でわめき散らしてやったぜ。賢者の魔法使いさんよお！
	こんな所に閉じ込めてよお！てめえらの世界が大事じゃねえのかよ！つってな。
晶	あはは……。
	笑っちゃいけないかもしれないですけど、閉じ込めていた人たちは困ったでしょうね。
ブラッドリー	俺だって高笑いさ！今は双子じじいの監視付きとはいえ、毎日自由に歩き回れて最高だぜ。
	厄災様々って感じだよ。
	次の厄災も大いに暴れてくれりゃあここでの暮らしだ続いてありがてえんだがな。
`},
{id:10937,title:"肉こそ正義",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`ブラッドリー	いつも飯作りに来る人間の女いるだろ。
	あいつはよく料理のリクエスト聞いてくるんだけどよ。
晶	カナリアさんですか？よくキッチンでお二人がお話ししてるの見かけてましたが、
	あれはメニューの相談だったんですね。
ブラッドリー	おう。食いてえもんあったら遠慮なく言ってくれっていうから、
	俺は毎回メニュー作りに協力してるわけだ。
	……けど、だいたいネロに捻じ曲げられる。
晶	ネロにですか？
ブラッドリー	ああ、あいつキッチンの主気取りだからな。食いてえもんがいつも通るとは限らねえ。
	だから最近は毎日賭けみたいな気分でいる。
	肉が出た日は俺が勝ったと思ってくれ。野菜が出た日は負けだ。
晶	なるほど。そういう仕組みだったんですね。
ブラッドリー	ケチくせえよなあ。肉ぐらい毎日出してくれたっていいじゃねえか。なあ。
晶	……ちなみにブラッドリーって、毎日どんなものリクエストしてるんですか？
ブラッドリー	あ？そんなもん、昨日は肉で、一昨日も肉……。
晶	ネロ、毎日栄養バランス考えてくれてるんですね……。
ブラッドリー	あ？なんか言ったか？
`},
{id:10938,title:"刺激を求めて",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリー！部屋から大きな音がしましたが、大丈夫ですか？
ブラッドリー	あっはっは。悪ィ悪ィ。こないだ手に入れた銃をちょっとばかり弄ってたんだよ。
晶	大丈夫ですか……！？暴発しちゃったとか？
ブラッドリー	そんなヘマするか。興が乗ってきて、ついな。久々に短銃が撃ちたくなっちまって。
晶	部屋の中ではやめてください！？
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
ブラッドリー	寝たり、酒飲んだり、銃の手入れをしたりか？
	牢獄に比べりゃずいぶんマシとはいえ、魔法舎じゃろくに暴れられねえしよ。暇だぜ。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
ブラッドリー	ひとりが退屈なときはネロに……、
	いや、調理場のやつにつまみ作らせて一緒に飲むけど、あんまり来たがらねえな。
	ブラッドリースノウとホワイトは、呼んでねえのに勝手に入って来やがる。
	鬱陶しいぜ。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
ブラッドリー	飯の時間が決まってやがるからな。それだけは合わせてやってるが、あとは自由だ。
	牢獄にいた時も時間は自由だったが、何にもできなくてよ。
	双子の監視は窮屈だが、ずいぶんマシだぜ。
~~~~~~~~~	~~~~~~~~~
晶	ストレスが溜まってるんですかね……。運動をしてみたらどうですか？
カインやレノックスみたいに筋トレをするとか。
ブラッドリー	馬鹿が。そんなもんで数百年分の鬱憤が晴れるわけねえだろうが。
	あーあ！パーっと悪逆の限りを尽くしたいぜ！
	いつかのオズみてえにやれりゃあ、さぞ爽快だろうけどなあ！
`},
{id:10939,title:"つまみ食い犯を捕まえろ",type:"personal",characters:["リケ","ブラッドリー","ミチル"],memo:"ブラッドリー",
text:`ブラッドリー	おい、おまえ！
晶	ブラッドリー。そんなに急いでどうし……。
	（後ろから羽交い締めに……！？）
ブラッドリー	確保だ賢者！いいところに来たな！
ミチル	見つけましたよブラッドリーさん……って、わあ！
リケ	賢者様が人質に……！
ブラッドリー	おうおまえら、それ以上近づいてみろ。こいつがどうなってもいいのか！
晶	あの、これは一体……？
ミチル	ボクたち、ネロさんからブラッドリーさんを捕まえてくれってお願いされたんです！
リケ	つまみ食いは愚かな行為ですし、捕まえてきたらおやつをくれるんですって。
	逃がしませんよ！
ブラッドリー	あはは、やれるもんならやってみやがれ！
晶	（みんなめちゃくちゃ楽しそうじゃん……！）
`},
{id:10940,title:"一枚上手の心理戦",type:"personal",characters:["カイン","ブラッドリー"],memo:"ブラッドリー",
text:`カイン	うーん……。
ブラッドリー	迷いすぎだぜ、中央の騎士様。勝負の時は直感も大事だ。
カイン	なら、こっちだ。
ブラッドリー	お？本当にいいのか、それで。
カイン	……、じゃあ……。
ブラッドリー	あーあー、そうだろうなあ。てめえはそう来ると思ったんだよなあ。
晶	珍しいですね、カインとブラッドリーが一緒にいるなんて……。カードゲームですか？
カイン	ああ、賢者様。二人でたまにやってるんだ。
	ブラッドリーは揺さぶりが上手くて面白い。
ブラッドリー	てめえはフェイントに引っかかりすぎだ。
	剣で戦ってても牽制や目眩しくらい使うだろ。どうしてカードで出来ねえんだよ。
カイン	不思議だよな。体が勝手に動くまで落とし込めてないせいか？
晶	素直なのはカインのいいところですもんね。頑張ってください！
ブラッドリー	さあさあ、これで決まるぜ。どうするどうする。
カイン	むむむ……。
`},
{id:10941,title:"物々交換の達人",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリー、お帰りなさい!急にいなくなるから心配してたんです。
ブラッドリー	好きでいなくなったんじゃねえよ。まったく、どうにかならねえのかこの厄介な傷。
晶	くしゃみで飛んじゃうの大変ですよね。
	ところでその、肩に担いでるブロック肉は……。
ブラッドリー	おう、これか？さっきそこで交換してやった。今日はこれで豪勢にやろうぜ。
晶	交換ですか？
ブラッドリー	ああ。
	最初に飛ばされたとき、引っ掴んでたブランケットもそのまま持って行っちまってよ。
	そしたら目の前に震えてるばばあがいて……。仕方ねえからくれてやったんだ。
	礼に林檎をくれた。
晶	（こ、この流れはもしかして）
ブラッドリー	歩いてたら今度はジュース屋のじじいが林檎が足りねえっていうからよ。
晶	あげちゃったんですね。それでジュース屋さんからお礼をもらって、
	それもさらに誰かと交換して今に至る、と。
ブラッドリー	なんだおまえ、話が早いじゃねえか。
	いろいろ面倒だったが、でけえ肉持って帰れたことだし、まあ結果オーライだな！
晶	（ブランケットが最終的に大きなお肉に……。わらしべ長者かな？）
`},
{id:10942,title:"男の勲章",type:"personal",characters:["⑨"],memo:"ブラッドリー",
text:`晶	ブラッドリー。ずっと気になってたことがあるんです。
ブラッドリー	あ？なんだよ改まって。
晶	その顔の傷についてなんですけど……。
ブラッドリー	ああ、そんなことか。
	真面目な顔して聞いてくるから、何事かと思ったぜ。
晶	あれ、結構カラッとしてるんですね。
ブラッドリー	まあ、昔は暴れまわってたからな。いろいろあったんだが、男の勲章だよ。
	結構気に入ってんだぜ。
晶	ワイルドでかっこいいですよね！ブラッドリーらしくて素敵です。
ブラッドリー	はは、そうだろ。ただ、それだけで満足されちゃあ困るな。
晶	え、どういうことですか？
ブラッドリー	体だよ。顔にある傷だけが勲章だなんて小せえもんだ。脱いだらすげえぜ……見るか？
晶	え……そんなに傷跡が残るなんて、ちゃんと治療したんですか！？
	痛いのは我慢したらダメですよ
ブラッドリー	…………おまえ、変な奴だな。
`},
{id:10943,title:"北の国の常識人？",type:"personal",characters:["北"],memo:"ブラッドリー",
text:`晶	ブラッドリーもバーに来るんですね。いつも部屋で飲んでるイメージでした。
ブラッドリー	ここの雰囲気は悪くねえからな。
	しかしじじいども、よくそんな甘いもんばっか飲めるな。
スノウ	やかましいわい。可愛い我らにぴったりじゃろうが。
ホワイト	我らは野蛮なおぬしとは違うからのう。
ブラッドリー	はっ、酒に弱えだけだろ。
スノウ	むむう！ブラッドリーちゃん、いつからそんな反抗期になったんじゃ！
ホワイト	我らは寂しいぞ！
ブラッドリー	うるせえ、ギャーギャー騒ぐな。ミスラも氷を手づかみで食うなよ。
ミスラ	何故です。別にあなたに迷惑かけてないでしょう。
オーエン	これ、蜂蜜みたいな色なのに全然甘くない。シロップを入れて美味しくしてあげるよ。
ブラッドリー	馬鹿野郎、勝手に人のグラスに触んな。おまえら、ちょっとは大人しくできねえのか！
晶	（北の魔法使いの中でブラッドリーが実は一番の常識人なのでは……？）
`},
//東
{id:11001,title:"スポットの印象（１）",type:"personal",characters:["シノ"],memo:"ファウスト",
text:`シノ	シャーウッドの森はずっと平地だったけど、ここは山あり谷ありで面白い。
	山自体あまり来たことがなかったが、視界も悪いし、人や動物も隠れやすそうで、管理するのが大変そうだ。
晶	シノの故郷の森とは、結構違う感じですか？
シノ	全然違う。見たことのない生き物がたくさんいる。植物も虫も種類が多くて、楽しい。
	精霊も多いから気配がうるさいな。落ち着きがなくて、やたらと構ってくる。
	泊まっても、きっとゆっくりできない。
	オレ的には、ひとりになりたくて引きこもる場所って感じじゃないな。
晶	気配がうるさいって思うんですね……。
	たしかに、魔力のない俺でもざわざわした印象を受けました。
シノ	土地に慣れれば構わなくなるのかもな。
	魔力がみなぎってる感じで、精霊たちと親しくなれば強い魔法が使えそうだ。
	逃げ込んだ悪党を捕まえたりとか、何かを探したりとか、そういうことがしたい。
晶	（……たしかに、狙った獲物に飛びかかる寸前の猫みたいな感じになってるかも……）
シノ	ん？　今、何か聞こえたか？
	ちょっと見てくる。
晶	あっ！　シノ！あんまり遠くに行かないでくださいね！
	シノ……！
`},
{id:11002,title:"スポットの印象（２）",type:"personal",characters:["ネロ"],memo:"ファウスト",
text:`ネロ	はー……、なんだか、いかにも魔法使いっぽいところだな。
晶	そうなんですか？
ネロ	そうでもねえ？俺はもうちょっと、人がいる方が好きなんだよな……。どうしてもさ。
	こういう場所の方が、本当は楽なんだろうけどな。
	やっぱり、飯を作ったら誰かに食ってほしいって思っちまうからなあ……。
晶	たしかに、ネロの作った料理をネロしか食べられないのは、もったいない感じがします。
ネロ	優しいねえ、賢者さんは。まあ、若い時に集団生活してたせいかもしれねえな。
晶	それはファウストも同じじゃないですか？
	革命軍にいた頃は、たくさんの人と一緒に生活してたって聞きましたよ。
ネロ	あいつは自分があるからさ。
	人の中にいても、孤独な谷の隠者生活でも、それは変わらない。
	朝起きて、今日は何しようって決めて、自分の生活をして、満足して眠れるんだろう。
	……俺はそれだと、ちょっと寂しいんだよ。
	自分の面倒を見るよりも、人の面倒を見る方が好きなんだろうな。
`},
{id:11003,title:"スポットの印象（３）",type:"personal",characters:["フィガロ"],memo:"ファウスト",
text:`フィガロ	ここがファウストに優しい土地で良かったな。
	精霊が多いけど、あの子が気に入られてるのがわかるよ。
晶	土地に優しくされるんですか？
フィガロ	そう。土地の精霊に気に入られて、優しくされるから土地の魔法使いになるんだよ。
	俺も南の精霊に気に入られてるのさ。
	あの子は元から真面目で優しかったし、コツコツと努力ができるタイプだったから、東の精霊からも受け入れられたんだろうね。
晶	じゃあ、フィガロも歓迎されていますか？
	南の魔法使いも優しい気質だと思いますけど……。
フィガロ	うーん……。
	ここの精霊は、俺が最後には人間の味方しちゃうってわかってると思うんだよね。
	たぶん、ファウストは精霊達の肩を持ってこの土地を保とう
	って気持ちがあるだろうけど、俺はほら、今の所は思い入れもないし。
	人間がどうしても開拓したいって言うなら、じゃあいいよって言っちゃうのがなんとなくバレてる気がするな。
晶	そうなんですね……。
	土地の精霊と気が合わないと、力を発揮できなかったりするんですか？
フィガロ	発揮できないってほどじゃないけど、やりにくさはあるかな？
	膝まで水に浸かっているくらい。
	でもいいなって思うよ。この谷と、この谷で暮らしてるファウストのことをさ。
晶	いいなって、羨ましいってことですか？
フィガロ	そうだね。俺は絶対にさみしいもん。こんなところ、ひとりで堪えられないよ。
	なのに、あの子はこの谷の孤独に堪えて、むしろ癒されてたんだ。
	ここまでひとりでいるファウストって、そこまで不幸じゃない感じがするだろ？
	そういう感じがいいなあって。自分に合った療養所みたいなところだよね。
`},
{id:11004,title:"スポットの印象（４）",type:"personal",characters:["レノックス"],memo:"ファウスト",
text:`レノックス	この薬草は痛み止めに使うものです。南の国では見られない種類で……。懐かしいな。
	誰かが怪我をすると、昔はよく、ファウスト様が煎じてくださっていました。
~~~~~~~~~	~~~~~~~~~
選択	昔の革命軍の仲間にですか？
晶	昔の革命軍の仲間にですか？
レノックス	ええ。アレク様なんかは、特に怪我の多い方でしたから、手当てをしながらよく怒っていましたよ。
晶	アレクさんって、ファウストの幼馴染だった人ですよね。どんな人だったんですか？
レノックス	そうだな……。
	アーサー様のような勇猛果敢さと無垢さがあり、シノのような野心と決断の早さがあり……。
	フィガロ様やブラッドリーのように、智謀と策略に富んだ頭の冴える方でしたね。
	心理戦にも強かったです。
晶	……めっちゃハイスペックじゃないですか……？
レノックス	一国を築いた方ですしね……。
	けれど、根っこに幼さや、少し夢見がちな危うさもありました。
	革命が終わったらファウスト様と村に帰ってのんびり暮らせると、戦の半ばまで信じていらしたようでした。
晶	そうだったんですか……。
~~~~~~~~~	~~~~~~~~~
選択	レノックスも治療を受けたんですか？
晶	レノックスも治療を受けたんですか？
レノックス	もちろんです。戦をしていた頃は、怪我が多かったので、ファウスト様の薬はよく効きましたよ。
	母君や祖母君から教わったのだとおっしゃっていまいした。
晶	今みたいに魔法で治していたんじゃなかったんですね。
レノックス	フィガロ様がいらっしゃるまではそうですね。
	皆の知恵を集めて、弱い治癒魔法と薬を使って凌いでいました。
	フィガロ様が革命軍に加わって、魔法で治癒してくださるようになってから、たくさんの仲間の命が救われたんですよ。
晶	そうだったんですか……。
~~~~~~~~~	~~~~~~~~~
レノックス	……ここは、少し寂しいところですね。
	俺は、いつでも人に囲まれ慕われているファウスト様しか知りませんでした。
	だから……。
	町の中で人のふりをしているでもなく、森の中で本当にひとりでいらしたんだと……。
	そこは、どうしても、寂しくなってしまいます。
`},
{id:11005,title:"ブレイクタイム（１）",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`ファウスト	エルダーの木に花が咲いているな。時期でもないのに……。
晶	季節外れの花なんですね。これも精霊たちの影響でしょうか。
	俺たちが近づいてしまったから？
ファウスト	悪い発露ではないよ。精霊たちが気に入って魔除けに使う木だ。
	花はお茶やシロップに、実はワインになる。
晶	わあ、美味しそうですね！
ファウスト	……たしかに、このまま花を落として帰るのはもったいないな……。
ファウストの手元がふわりと光って、木で編んだ籠が、ふたつ現れた。
魔法に共鳴するように辺りの木々がざわめく。
強く風が吹いて俺とファウストの髪を揺らすと、
身を寄せ合うように枝先に咲いていた小さな花たちが、ほろほろと散り始める。
ファウスト	拾ってくれ。
籠を手渡されて、俺は花の群れている枝へ手を伸ばし、猫の喉を撫でる仕草でくすぐった。
ほろほろとこぼれ落ちてくる可憐な花を籠で受け止める。
雨粒のような小花がファウストと俺の髪や肩をかすめて行く。
晶	わー！　たくさん降ってきた！こんなに簡単に落ちてくるんですね！
	あはは、爽やかでいい匂い……。
隣で笑う吐息が聞こえて、子供っぽかったかと、少しだけ恥ずかしい気分になる。何も言わずに、ファウストは作業を続けた。
谷で暮らす間、何度も繰り返していただろう、慣れた手つきだった。
ファウスト	戻ったらシロップを作ろうか。果物と合わせて漬けても美味しくなる。
	きみも手伝ってくれるだろ？
`},
{id:11006,title:"ブレイクタイム（２）",type:"personal",characters:["ファウスト","ヒースクリフ"],memo:"ファウスト",
text:`ヒースクリフ	本当に、綺麗で不思議なところですね……。
	どんな森でもわりと好きになるんですけど、ここは特に居心地がいいというか……。
晶	精霊が多いと、魔法使いには騒がしく感じるって聞きましたけど、ヒースクリフに合ってたなら良かったです。
	でも、そろそろ戻った方が良くないですか？
	なんだか、この道の奥の方だんだん暗くなっていく気がしますし。
ヒースクリフ	あ……。……でも……、もう少し奥の方に行ってみたくて……。
晶	……なんだか珍しいですね。ヒースクリフがそんなことを言うなんて。
ヒースクリフ	…………。
	そう……、ですよね……。
ファウスト	そこから先は危険だ。戻れ。
ヒースクリフ	あ……。ファウスト先生。
ファウスト	悪い精霊に気に入られたな。ヒースは感応しやすくて見目好い。
	この谷に引き止めておきたがったんだろう。
	それ以上奥へ向かうと、森に囚われてしまう。あれを見てみろ。
ファウストに示された森の奥。重く暗い気配のする大樹の影を観察して俺は息を吞んだ。
大きな角を持った鹿のようなものが、様々な植物や、小さな花や、苔に覆われて、生死もわからぬ状態で囚われている。
獣とも植物とも言えないそれは、神秘的で恐ろしく、生々しくて美しい、森の不思議が生んだ芸術品のようだ。
ファウスト	大きくて立派な美しい角の牡鹿だろう。
	精霊たちに気に入られて、引き寄せられて、嵐の谷に取り込まれたんだ。
ヒースクリフ	……人間や魔法使いでも、あんな風になってしまうんですか？
ファウスト	なる。
晶・ヒースクリフ	…………。
`},
{id:11007,title:"スポットの思い出（１）",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	こんなところに家を作るのは大変そうですね。魔法で建てたんですか？
ファウスト	ああ……。少しずつな。
	ここに来たばかりの時、僕は怪我をしていて、最初は木の洞で雨を凌いでいた。
	食べるものもなくて、じきに死ぬだろうと思っていたが……。
	嵐の谷は、精霊たちの生命力がみなぎる強い土地だった。
	その影響なのか、なかなか死ねなくて……。だんだんと、怪我が治って来た。
晶	…………。
ファウスト	少しだけ動けるようになって、小さな小屋のようなものを建てたんだ。
	そこから年月をかけて家の形にしていった。
晶	……なんだか、壮絶な話ですね。
	動けないような怪我をして、じっとひとりで耐えてたなんて……。
ファウスト	あの時はひとりの方が楽だったさ。
	自暴自棄になっていて、不安定で、あの頃の、十数年の記憶はあまりないんだ。
	だけど……、不思議と幸運が続いて、生き延びたように思う。
晶	幸運……？ファウストの魔法ですか？それとも、土地の精霊？
ファウスト	たしかに、無意識に魔法を使っていたのかもしれない。土地の力もあるはずだが……。
	それだけではなかった気がする。
	どこかで祝福の魔法をかけられていたのかもしれないな。
`},
{id:11008,title:"スポットの思い出（２）",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	ここで呪い屋の仕事をしていたんですよね。
	呪いを職業にしたきっかけは、なにかあったんですか？
ファウスト	……嵐の谷にたどり着いた頃、僕は全てを憎んでいた。
	特に、僕や仲間を裏切った人間は、ひとり残らず呪ってやると思って、呪術について調べたんだ。
	様々な手段を試そうとして、必要なものを集めて、呪具も揃った頃に、谷に迷い込んだ魔法使いに出会った。
	そいつが、僕の家を見て、おまえは呪い屋なのかと尋ねてきた。
	違うとも、そうだとも、僕は答えなかったが……。
	呪い殺したい人間がいるから、手伝ってくれないかと言われた。
	僕に断る理由がなかった。
晶	そのひとが、お客さん第一号なんですか？
ファウスト	そうなるのかもな。
	礼は必要ないと言ったのに、向こうが勝手に支払って行って……。
	しばらくして、話を聞いたというやつがまたやってきた。
	……それ以降は報酬を受け取るようにした。
晶	じゃあ、頼み事を聞いてるうちに、口伝てで依頼がくるようになったんですね。
	でも、お客さんが魔法使いなのは意外でした。
	相手が人間でも魔法が効かなかったり、呪いを扱えない魔法使いがいるってことでしょうか？
ファウスト	魔法使いにも得手不得手があるし、呪いの魔法を使った影響が悪く出る者もいる。
	相手が人間だったとしても……。
	誰かの祝福の魔法を先に受けていたり、守護の効果のあるものを持っていたり、土地の幸運を独占しているとかかりにくい。
	客のほとんどは魔法使いだった。基本的には手を貸す形で依頼を受けていたよ。
`},
{id:11009,title:"ファウストへの印象（１）",type:"personal",characters:["シノ"],memo:"ファウスト",
text:`シノ	ファウストに出会って最初の頃は、あれも駄目これも駄目って、怒ってばかりのやつかと思ってた。
	でも、魔法の訓練が始まったら、なんでも手本を見せてくれるし、教え方も分かりやすくて上手い。
	魔力も強いし、実力を感じるところが好きだ。
	口やかましいだけじゃなくて、こいつがいうならって自然に思える。
晶	シノは、魔法舎に来てから、初めてちゃんと魔法を教わったんでしたよね。
シノ	ああ。オレとヒースの前の師匠は魔法がまるで駄目だったからな。
	今まで勘や感覚でやってたことに、理屈や仕組みがあったんだ。
	力の掛け方、心の在り方、不思議の力の理……。
晶	魔法にも、コツがあるってことですか？
シノ	ああ。運動だってそうだろ。目的によって鍛える場所や方法は違う。
	お行儀よくなんでも順番にやりたがるから、ちょっと焦れったいけどな。
	一度出来たことを何度も復習したり。
晶	あはは。ファウストの授業は基礎をしっかりやるスタイルなんですね。
シノ	初めは先生なんて必要ないって思ってたけど、今はオレの先生が一番だって思ってるぜ。
	オズや双子やフィガロやシャイロックに負けないでほしいし、いざ勝負をつける時が来たら命がけで援護する。
晶	勝負なんて……。仲間同士で争ったりしないでしょう？
シノ	そうかもな。でも、オレはちょっと試してみたい。
晶	（シノはたまに、身近なひとのことを、強いカブトムシみたい思ってるところがあるな……）
`},
{id:11010,title:"ファウストへの印象（２）",type:"personal",characters:["ヒースクリフ"],memo:"ファウスト",
text:`晶	ヒースクリフは、みんなが魔法舎で暮らし始める前から、ファウストと知り合いだったんですよね。
	ファウストのこと、どう思っていますか？
ヒースクリフ	ファウスト先生は命の恩人です。
	〈大いなる厄災〉との戦いで庇ってくれたことはもちろんそうですけど……。
	これからの長い人生の中で、先生から教わる魔法の知識に助けられることは、
	本当に多くなるだろうなって思うんです。心から感謝しています。
晶	ヒースクリフと会ったばかりの頃も、やっぱり親切だったんですか？
ヒースクリフ	そうですね。最初はやっぱり、少しだけ怖い人かなって思ってたんですけど……
	優しかったです。前の師匠の横柄な態度を見かねて声をかけてくれました。
	その時、呪文や魔道具についても教えてくれて。
	その日から、師匠のいいなりにならずにすんだんです。
	ちゃんとした呪文を使ったら、俺の方が強かったんですよね。
晶	なら、その時からファウストに助けられてるんですね。
ヒースクリフ	はい……。本当にその通りです。
	俺は貴族の生まれだったから、子供の頃から家庭教師がたくさんいて、先生たちに色々なことを教わって来たけど……。
	ファウスト先生が、一番の先生です。
`},
{id:11011,title:"ファウストへの印象（３）",type:"personal",characters:["ネロ"],memo:"ファウスト",
text:`晶	ネロから見て、ファウストってどんな印象ですか？
ネロ	ファウストか……。
	お互いに人嫌いなんだろうなって雰囲気があったから、煩わせないようにしてやろうと思ってたけど……。
	案外、テキパキしてるっていうか、思ったよりしっかりしてる感じだよ。
晶	たしかにファウストって、自分では引きこもりだなんて言いますけど、頼りになるし、なんでも自分でしますよね。
ネロ	そうそう。態度も大人だしな。居心地よくて付き合いやすいよ。
	たまに一緒に飲んだりもするんだ。
晶	二人で飲む時は、どんな話をしてるんですか？
ネロ	はは、お互いあんまりしゃべらねえんだけど……。
	最近どうだとか、今日はこうだったとか。他愛もない感じさ。
	でも、なんだかほっとするんだよな。
晶	よかった……。二人がいい関係を築けてて俺も嬉しいです。
ネロ	なんていうか、これだけ生きてて、もう、新しい友達なんてできねえだろうと思ってたんだけどさ。
	できるもんなんだなあって。
晶	…………。
ネロ	あー……。今のはちょっと、恥ずかしかったか……。
	ファウストには内緒な。
`},
{id:11012,title:"ファウストへの印象（４）",type:"personal",characters:["レノックス"],memo:"ファウスト",
text:`晶	レノックスはファウストと付き合いが長いんですよね。
	昔のファウストって、どんな感じでしたか？
レノックス	ファウスト様は、何もお変わりありません。
	最初に、名前だけ知りました。人間と手を組んだ、魔法使いの革命家がいるんだと。
	失礼ながら直接お会いするまでは、若さゆえの血潮で、気炎を掲げる勢いのままで大軍を率いている
	危うい人物かと想像していて……。
晶	予想は外れましたか？
レノックス	はい。凛として、生真面目で、けれど、どんな人の話にも耳を貸す柔軟さのある方でした。
	ただ、俺が出会った時期は、四六時中張り詰めていたせいか、あまり笑わない印象で……。
	真剣に考え事をしたり悩んだり、会議に出たり、まだ若かったから、大人のやり口に素直に傷つかれたりして。
	見守るような気持ちでお側にいたんですが、ある日、ふと余裕ができたときに、誰かの冗談でファウスト様が笑ったんです。
	それが、驚くほど屈託のない笑顔で。
	俺は思わず、「ファウスト様も笑うんですね」と……。
晶	レノックスが聞いたんですか？ファウストは、なんて？
レノックス	目を丸くして、それから、少しむっとして、「おまえに言われるとは思わなかった」と。
晶	あはは！
レノックス	俺たちも大笑いしました。それが、初めて二人で笑いあった思い出です。
	あの顔を、今でも覚えているんです。
`},
{id:11013,title:"ファウストへの印象（５）",type:"personal",characters:["フィガロ"],memo:"ファウスト",
text:`晶	フィガロとファウストは、昔から面識があったんですよね。
	ファウストのこと、どう思っていますか？
フィガロ	うーん、この話長くなるけど全部聞いてくれる？
	ひと晩くらいかかるから飲みながら話そうよ。
晶	……今日のところはさわりだけで……。
~~~~~~~~~	~~~~~~~~~
選択	初めて会った時のこと。
フィガロ	ファウストの名前は噂で聞いてたんだよね。
	革命家なんて、どんな粋がったやつが教えを請いに来たんだと思ったら……。
	素直だし、真面目だし、若くて見た目もいいし、そこそこ強いし、時代をときめく有名人だし。
	あっいいな、って思って。
晶	それでファウストを弟子にしたんですね……。
	それまでは、他の魔法を教わりに来た人はいなかったんですか？
フィガロ	頼まれはしたけどさ。
	せっかく俺が教えるのに、とも思うし、なんのために教わりたいとかもあるじゃない。
	強くなりたいって言われてもねえ。
	オズ以上は無理なのになーって思いながら自分の弟子を育てるのは何だか虚しいだろ？
	世界を良くするために魔法を教えてください、なんて言われたのは初めてだったからね。
	嬉しくて、浮かれてオズに報告しに行っちゃった。
~~~~~~~~~	~~~~~~~~~
選択	会えてない間のこと。
フィガロ	革命軍を離れてからしばらくの間は、ファウストのことも、中央の国のことも、
	わざと耳に入れないようにしてたところはある。
晶	フィガロ……。
フィガロ	俺がいないままのファウストや革命軍の栄光の問題なんて知りたくなかったんだよ。
	それでも、呪い屋になったって噂を聞いて心配したよ。
	きっとうらびれた汚いところで暮らしてるんだと思った。
	汚い髪で、汚い服を纏って、ケケケケケ……って笑ってる所を想像して、すごく絶望して悲しんでたのに。
	再会してみたら、あれだろ？隠れ家に来てみれば、これだろ？
	全然、元のままじゃないか！って思った。
	すごく嬉しかったよ。
~~~~~~~~~	~~~~~~~~~
選択	再会した時のこと。
フィガロ	もうその話するの？
	まあ、いいよ。昔のファウストの方が、退屈しないなってところはあるかもね。
	退屈しないなってところがありつつ、昔のファウストも気に入ってたから戻ってほしい気持ちがあるけど……。
	単純に戻って欲しいっていうよりは、らしくないことやめたら？って感じかな。
	きみから見てもわかるだろ？
晶	そう……ですね。どうしても悪い人には思えないというか……。
フィガロ	そうなんだよね。人を呪って喜ぶタイプじゃないんだもん。
	無理してるなって思っちゃうよ。
晶	フィガロなりに、大事にしていたお弟子さんだったんですね……。
フィガロ	そりゃそうさ。弟子にしたのも、二つ返事でってわけじゃない。
	「俺の修行に耐えられるかな」って感じでね。
	レノを二人で俺の家に訪ねて来たから、あの子だけ一年近く預かって、結構厳しくやったんだよ。
	それでも、ちゃんとついて来たからさ。意外と根性があるところも気に入ったし、志も高くて綺麗で可愛げもあって……。
	これが天命だったのかなって思いながら本腰入れてしばらく修行を続けて、いざ軍に合流したら、俺はお客さんだった。
	ありがとうございます。またいらしてくださいね。
	って、言われる前に家に帰ったんだよ。
`},
{id:11014,title:"スポットゆかりの話（１）",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	嵐の谷って名前に理由はあるんですか？　やっぱり嵐の日が多いとか？
ファウスト	嵐が生まれる土地だとか、嵐が必ず通る谷だと言われているな。
	精霊由来の天候変化が多いから、そう呼ばれるようになったんだろう。
	何もなければ、普段は落ち着いている。
晶	精霊由来って……、精霊が嵐を起こしたりするんですか？
ファウスト	そうだ。
	ここは精霊の数が多く力が強いために、ちょっとしたきっかけで場が脈動する。
	些細な刺激でも波紋が大きく広がって、岩場にぶつかった波が飛沫を上げるように、弾けたエネルギーが事故を起こす。
	その事故のひとつが嵐だ。精霊が騒いで場が狂乱すると天候が崩れることもよくある。
	植物が急成長したり、おかしな動物を呼び寄せたり、生物や気象や自然現象に影響が出るんだ。
晶	なるほど……。精霊を刺激するっていうのはどんなことなんですか？
	気をつけた方がいいんですよね。
ファウスト	元々は土地にない物が現れたりすることかな。馴染みのないものに敏感になる。
晶	えっ……。それじゃあ、俺たちが嵐の谷に来ること自体、刺激になってるんじゃ……。
ファウスト	そうだよ。きみたちが来てからずっと騒がしくしている。
晶	…………。
ファウスト	怖がることはない。普通にしていれば、危害を加えてくるわけじゃない。
	ただ、血を嫌がるから、怪我をしないようにな。
	誰かがやって来るとこうして精霊が騒ぐからすぐ気づけるんだ。
	僕にとってはとても暮らしやすい場所だよ。
`},
{id:11015,title:"スポットゆかりの話（２）",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	この辺り、いろんな花や草が植えてありますね。
ファウスト	ああ、あまり近寄らない方がいい。
	精霊を呼び集めたり、呪いや呪い返しに使うハーブだ。
~~~~~~~~~	~~~~~~~~~
選択	本当に人を呪ってたんですか？
ファウスト	は？呪い屋をしていたと言ったろう。信じていなかったのか？
晶	そういうわけじゃないんですけど、
	ファウストにそういうイメージがあまり湧かなくて……。
ファウスト	そんなことはない。　僕は呪い屋然としている。
~~~~~~~~~	~~~~~~~~~
選択	精霊を呼べるんですか？
ファウスト	精霊たちは香りに敏感だから、香を撒いたりすると集まって来るんだ。
晶	ファウストには精霊が見えるんですか？俺にも見られるでしょうか。
ファウスト	精霊には原則実体がない。自然や不思議の力そのもののことだ。
	人や動物の姿をしていれば見られるよ。
	彼らの好むものを食べ続けたり、鎖や刃物にまじないをかけて姿を映したり。
晶	そうなんですよね……。誰かを呪う時は、どんなものを使うんですか？
ファウスト	ここにあるハーブや、ハーブのオイル、針やキャンドルを使う術も多い。
	強い呪術には呪いたい相手の髪や爪や血液……。体の一部があるといいんだ。
	きみも誰かに髪や爪を寄越せと言われても
	絶対に預けたり取られたりしないよう気をつけておきなさい。
晶	わ、わかりました。
	でも、魔法舎でみんな一緒に暮らしてたら髪の毛なんかは落ちてそうですけど……。
ファウスト	だから初めはみんな嫌がっていただろう。
	互いに気を許しているように見えても、そういう部分の気は抜いていない。
	若い連中ならともかく、強い魔法使いの髪や爪は、隅々まで掃除しても手に入らないさ。
`},
{id:11016,title:"東の国について",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	長く暮らそうと思う土地を東の国にしたのには理由があったんですか？
ファウスト	…………。
	元いた場所には居られなかった。
	僕自身、一刻も早く、少しでも遠くへ離れたくて、行けるところまで飛んだんだ。
	誰も居ない場所ならどこでもよかった。
	誰にも会いたくなかったから、無意識に、森の多い東の国に向かったのかもな。
	暮らしてみたら理想的だったよ。
	穏やかすぎず、明るすぎず、他人とも必要最低限の関わりだけで過ごせた。
晶	じゃあ……、賢者の魔法使いになった時、
	東の国の魔法使いとして呼ばれたことに不思議はなかったですか？
ファウスト	…………。
	四百年も人と関わらずにいると、こうなるのかとは思った。
晶	…………。
ファウスト	ただ、今まで巡り合った誰よりも、
	この谷の精霊たちとの付き合いの方が長くなっていたからな。
	初めて来た時はえらく騒がれたものだったが、
	ずいぶん僕を買ってるじゃないかと、多少、気味のいい出来事でもあったよ。
`},
{id:11017,title:"〈大いなる厄災〉について",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`ファウスト	〈大いなる厄災〉が近づく夜は、世界に不思議の力がみなぎる。
	この辺りは特に精霊が多くて、場が狂乱したようになるんだ。
	ひと晩中、凶々しい気配と生命力に満ち溢れている。
	呪い屋としての仕事も特に捗る日だ。
	本気を出す時や手の掛かる呪術は、厄災が来る時期を狙って行っていた。
晶	（呪い屋の本気のお仕事か……。なんだか怖くて詳しく聞けないな……）
	厄災が近づくと、魔法使いも影響を受けて、体調を崩したりするって聞きました。
	ファウストは大丈夫だったんですか？
ファウスト	いつもそれなりに備えていたからな。だいぶ安定して暮らせていた。
	騒がしくて、眠るのに多少苦労するくらいだ。
	だが、そうだな……。たまにだけ、調子の悪い時に重なってしまうことがあって……。
	そういう夜は決まって、いつか感じた怒りや憎しみが、生々しく蘇るんだ。
晶	……それは……、かなりつらそうですね……。
ファウスト	ただ、数十年前に賢者の魔法使いに選ばれてからは、厄災のやって来る夜も気が紛れていた。
	堪えて苦しむことも、どうにか発散しようとしてくたびれることもなくなった。
	面倒な役目だけど、そこだけは良かったと思っている。
`},
{id:11018,title:"嵐の谷での暮らし",type:"personal",characters:["東"],memo:"ファウスト",
text:`晶	こういう場所だと、一日どんな感じで過ごすんですか？
ファウスト	魔法舎にいるときも引きこもってほとんどひとりなんだ。あまり変わらないよ。
シノ	そんなことないだろ。森での暮らしと魔法舎の生活は全然違う。
ファウスト	自分のことを自分でする時間が主になるだけだ。
	夜明けに起きて水を汲んで……。
	顔を洗って、食事の確保をして、掃除や繕い物や大工仕事をして、少し休んでいるうちに日が暮れる。
	そうしたら、夕食を作って食べて眠る。呪い屋の仕事があればやっていた。
~~~~~~~~~	~~~~~~~~~
選択	衣類について聞く。
晶	衣類はどこで買っていたんですか？
ファウスト	着るものにこだわりはない。
	山の麓まで行くと小さな村があって、布だけ手に入れて、魔法で作ることが多かった。
ヒースクリフ	いつも着ている服、先生の手作りだったんですね……。
	服装のせいか、最初は少し近寄り難かったんです。
ファウスト	呪い屋らしいだろ。
ヒースクリフ	そう……ですね……。
	でも、先生の授業を受けるようになってからは、少し印象と違うなって、感じるかもしれません。
	明るい服を着た先生も、いつか見てみたいです。
~~~~~~~~~	~~~~~~~~~
選択	食事について聞く。
晶	食べ物はどうしていたんですか？
ネロ	家の裏に小さい畑があったよな。
	この辺り、ハーブもキノコも木の実も多いし、食うには困らなかったんじゃねえの？
ファウスト	よく見ているな……。
ネロ	魚や肉はちゃんと食ってたのか？
ファウスト	川に魚がいる。山鳩や雉も。
ネロ	あはは、ご馳走じゃん。あんた、なんだかんだ生きる力が強いよな。
	そういうところ好きだよ。
~~~~~~~~~	~~~~~~~~~
選択	住まいについて聞く。
晶	家の中も質素で綺麗でしたよね……。
	俺が見た限りだと、あまり呪い屋って感じがしませんでしたけど……。
シノ	呪具は多かったな。棚にしまってあった。
	なあ、ベッドをもっとでっかくするか、二つ置いておけよ。
ファウスト	は？　何のために？
シノ	たまにみんなで泊まりに来よう。西のやつらはよくシャイロックの店に行くだろ。
	隠れ家みたいな場所がオレたちにも欲しかった。
ファウスト	ひとの家を勝手に溜まり場にするな。
シノ	いいじゃないか。この谷も、ファウストの家も、オレは気に入ったぜ。
`},
{id:11019,title:"スポットの人々",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	この辺りに人間は住んでいないんですか？
ファウスト	山の麓まで行けば小さな村がある。あの山を越えていったところには街もある。
晶	ずいぶん遠いな……。じゃあ、本当に人間が滅多に来ない場所なんですね。
ファウスト	ああ。東の国の人間なんて、魔法使いと聞けば忌み嫌い、避けるやつばかりだ。
	悪い噂を撒いてくれるからこちらも助かってたよ。
	たまに迷い込む者がいるくらいだな。
	狼の声で脅かして、山を下りる道に誘導したりはしていた。
晶	親切ですね……。その人がもし怪我をしていたら、どうしてましたか？
ファウスト	……まあ、魔法で手当くらいは。
晶	……ファウストって、やっぱり優しいですよね。人が憎いなんて言っているのに……。
ファウスト	憎いさ。
	けど、きみだって、例えば蛇が苦手でも、怪我をしている蛇なら助けるだろう。
晶	……そう、ですね……。いや、どうかな……？
	ファウストは蛇でも助けるんですか？
ファウスト	まあ……、暇だったら。
晶	でも、だいたい暇なんですよね。
ファウスト	何が言いたい。
晶	いえ……。助けてもらった人たちは、感謝してただろうなって思ったんです。
ファウスト	感謝なんて必要ない。僕は早く谷から出て行って欲しかっただけだ。
	魔法使いに恩を返したいなんていう奴は、変に生真面目で、二度と来るなと言い聞かせるのが大変なんだよ。
`},
{id:11020,title:"スポットにいた魔法使い",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	わ……！　この花、急に光り始めましたよ。……綺麗だけど、何か危険なものですか？
ファウスト	いや。あの山の奥に住んでいる魔法使いが戻ってきたみたいだ。
	あちらも珍しく出掛けていたんだな。
晶	魔法使いが近づくと、花が光るんですか……？
ファウスト	谷に住む精霊たちが魔法使いの気配を察知して共鳴し、反応しあっている。
	その影響で森に不思議な現象が起こるんだ。
	どこでもあることだが、この谷は特に精霊の力が強くて、遠くまで反応する。
晶	なるほど、これも精霊の影響だったんだ……。
	あの山の魔法使いって、つまりはファウストのご近所さんってことですよね。
ファウスト	まあ、そうなるな。
	顔を合わせたことはないが、僕よりも昔からこの谷に暮らしていた。
	僕の他にも数人の魔法使いが、嵐の谷に住み着いている。
	精霊の力も手伝って、みな、互いの気配は感じ合っているはずだよ。
晶	数百年も暮らしているのに、一度もお隣さんに会ったことがないんですか？
ファウスト	わざとさ。
	こんな所に住んでいるのは誰にも会いたくない人種だと分かっているから、互いに干渉しないだ。
	お互いのテリトリー意識も強い。
	僕もあの高い木よりも向こうに立ち入ったことはないよ。
晶	気配って、どんなものですか？
	さっきみたいに花が光ったりすれば、俺にもわかるんですけど……。
ファウスト	言葉にはしにくいな。
	雰囲気に近いが、寄り付く精霊の気質も似ているから、人物像はうっすら感じ取れる。
晶	今も嵐の谷に魔法使いがいるんですよね。
	みんな、いい人たちなんですか？
ファウスト	僕は関わり合いがないからな。良いか悪いかはきみの基準だろう。
	だけど、よそ者だった僕がここに住み着いても追い出したりしなかった。
	元々は誰かの縄張りだったはずだが、譲ってくれたんだ。
	そのことにはずっと感謝している。
`},
{id:11021,title:"危険な場所",type:"personal",characters:["アーサー","ファウスト"],memo:"ファウスト",
text:`突然、前触れもなく風が起こって、辺りの枯葉が舞い上がった。
晶	わ、わあ……っ！　な、なんでしょう、これ……！？
アーサー	なんだか……、この土地の精霊に拒絶されている気配がします。
晶	えっ、アーサーがですか！？
アーサー	おそらく……。　少し、説得してみます。
強い風が枯葉を宙にかき集める。その塊は、恐ろしい形相をした人の顔のように見え始めた。
ざわざわと森がうごめく。じっとその様子を見つめていたアーサーが、凶々しい気配へ手を伸ばした。
アーサー	どうか気を鎮めてくれ。おまえたちを脅かす者ではない。　私は……。
ファウスト	……ッ、馬鹿か！
晶	枯葉が元に戻った……！　怖い気配も消えた……？
ファウスト	危険なものだと見てわかるだろう！　どうしておまえはいつも……！
	……あっ……。……すまない、咄嗟につい……。
アーサー	…………。
	今のはファウストが？　私を？　はたいたのか？
ファウスト	おい……。生まれて初めて叩かれたような顔をするな。罪悪感が増すだろ。
アーサー	生まれて初めて叩かれた。
	オズ様も、城の者にも、そのように叱る者はいなかったから……。
ファウスト	な……。嘘だろ？
	……いや、慌てたとはいえ、僕が悪かった。オズには黙っていてくれ。
アーサー	いや、なんだか新鮮だった！　助かった、ファウスト。
晶	（ファウスト、昔の友達に似てるからって思わずツッコんじゃった動きだったな……）
`},
{id:11022,title:"ファウストの評判",type:"personal",characters:["ネロ"],memo:"ファウスト",
text:`ネロ	ふーん。先生、この辺りの精霊にだいぶ好かれているみたいだな。
晶	精霊に好かれているかどうかって、どうやって判断するものなんですか？
ネロ	魔法使いなら、魔法が使いやすくなる。息がしやすいとか、身体が軽い感覚に近いか。
	ここでは、ファウストの知り合いってことで、俺たちも歓迎されてるんだろうな。
	最初は警戒されてたけど、だんだん馴染んで来た感じがするよ。
晶	なるほど……。
ネロ	あとは、そうだなあ、普段はあまり近づかない種類の精霊が顔を出してたり、家のそばにいたりする。
	呪いとかの気配が苦手なやつらも。
	そういうのは、呪いの魔法なんて使ってたら、普通は戻ってこなくなっちまうもんだが……。
	ファウストが呪術を使うたびにいなくなって、それでもまた寄って来てるんなら、相当好かれてるってことだろうな。
晶	そうなんですね。精霊に好かれるのに、何かコツとかはあるんですか？
ネロ	この谷の精霊は特に東の国っぽい性質だから、干渉しすぎず、寄り添うように魔法を使う、ファウストみたいなやつが好きなんだよ。
	北や、中央の魔法使いなら、もっと使役する感じで魔法を使うんだけどさ。
晶	それは、どういう……？
ネロ	あー、わかりにくよな。
	例えば中央の精霊は、魔法使いをリーダーにして力を合わせたり、主従の関係性で動くのが好きだよ。
	北の精霊は、北の魔法使いを気質が同じさ。
	自分より強いやつだけ従って、隙を見せればすぐに牙を剥いてくる感じ。
	ファウストは、この谷の性質に極力合わせて魔法を使ってたんだろう。
	そういう優しいとこが評判いいんじゃねえかな。
`},
{id:11023,title:"スポットの名物",type:"personal",characters:["ヒースクリフ"],memo:"ファウスト",
text:`ヒースクリフ	あっ、嵐塩……！
不意にヒースクリフが小さな声を上げた。彼が指差した木々の間に、何かがキラキラと光っている。
晶	あれは……、小さな竜巻？光る竜巻ですか？
ヒースクリフ	あれは嵐塩です。砂嵐みたいに移動する塩なんです。
	……あっ、見失っちゃう。賢者様、追いかけてもいいですか？ 
	ネロが欲しがっていたんですけど、呼んでいる時間もなさそうで……。
晶	は、はい！
ヒースクリフ	嵐塩は北に向かって移動するので、
	瓶に入れて方角を調べたり、魔除けや危険察知にも使えるんです。
	シノも森番の仕事用に持っていました。塩だから、もちろん料理にも使うんですけど。
晶	山で塩が採れるなんてすごいですね！？　もしかして、珍しい種類なんですか？
ヒースクリフ	そうなんです。
	今追いかけてるのは南向きに移動していて、滅多にないもので……。
	追いつけそうだ……。
	《レプセヴァイヴルプ・スノス》！
ヒースクリフが呪文を唱えると、蓋つきの瓶が現れた。
晶	どうやって捕まえるんですか？
ヒースクリフ	あの中に飛び込んで瓶をかざしていると勝手にいっぱいになるんです。
	俺、ちょっと採ってきますね！
晶	気をつけてくださいね……！
ヒースクリフ	大丈夫です、危なくはな……。
	ッ……、いた、痛たたた滲みる……！　あっ、あっ、しょっぱ……！
晶	ヒース……！
	（天然の塩揉みだ……！でも、ヒースが擦り傷作ったらシノが心配しないかな……！？）
`},
{id:11024,title:"スポットでの発見",type:"personal",characters:["シノ"],memo:"ファウスト",
text:`シノ	賢者、これを見てくれ。
晶	うわ……。　毒々しいくらい真っ赤で、大きな花ですね……。
シノ	強そうで、綺麗だ。
	ヒースに見せてやりたい。だけど、摘んだらすごくまずい気配がする。
晶	まずい気配？
シノ	精霊が、こいつは取るなって言ってる。
	しゃべってるのが聞こえるわけじゃないが、そういう気配だ。
	だが……。精霊より、オレの方が上だしな。
晶	…………？
	なんだか急に、森の温度が下がったような……。
シノ	賢者。この花を手折ったら、何かやばいことが起きると思ってるだろ？
晶	はい。
シノ	オレもそう思う。
	迷うな……。
	この花に何か災いがついてたら、奥様に見せた時に迷惑がかかるかもしれない。
晶	迷うならやめましょううよ！？
	それか、せめて、ファウストに相談してからにしませんか？
シノ	たしかに。
	ファウストのところに持って行って、やばかったら浄化してもらえばいいのか。
	さすがだぜ、賢者。――よし。
晶	そ、そうじゃなくって……！
シノ	《マッツァー・スディーパス》！
`},
{id:11025,title:"楽しい場所",type:"personal",characters:["ラスティカ"],memo:"ファウスト",
text:`ラスティカ	おや、これは……。
晶	……わ、すごい！　絵本に出てきそうな赤いキノコですね。
ラスティカ	形は可愛らしいのですが、これには毒があるんですよ。
晶	めっちゃそんな感じがします。
ラスティカ	けれど、妖精達のダンスパーティーの目印でもあります。
	ほら、円を描くように生えているでしょう。
	この円の外側を踊りながら周っていると、妖精たちのダンスに混ざることができるんですよ。
ラスティカは右手をひらめかせると、木で作ったフルートのような笛が現れた。
魔法に反応したように、ざわざわと、あたりの木々が騒ぎ始める。
晶	混ざるって……。もしかして、俺も妖精を見られるってことですか？
ラスティカ	ええ。以前、ご覧になりたいとおっしゃっていたでしょう。
	僕が演奏しますから、賢者様はダンスを。
晶	お、踊りですか！？　俺、盆踊りくらいしか踊れないんですが……。
ラスティカ	素晴らしい！　異世界のダンスなのですね。
	妖精たちは好奇心旺盛ですから、みな、きっと歓迎してくれますよ。
	まずは、時計周りに三周。
晶	（むっ……無茶振りだけど……、妖精は見てみたい……！！）
	えーい！
	みーぎ、ひだり、パパンがパン。まーえ、まーえ、パパンがパン。
`},
{id:11026,title:"マナエリア",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
ファウスト	……それは、マナエリアのことじゃないのか？
	マナエリアは、精神を落ち着かせ、集中させて、魔力を高めるために訪れる、それぞれの原風景のような場所のことだ。
晶	きっと、それです！　ファウストにもマナエリアがありますか？
ファウスト	僕のマナエリアは、深い森や、山の奥深くの、火のそばだな。
晶	火のそば……。焚き火とかでしょうか？
ファウスト	ああ。
	自然の静けさを感じながら、炎の揺らめきを見つめているうちに、同じ熱が胸に宿る。
	静寂の中の小さな光が、僕の魔力を呼び覚ましてくれる。
晶	クールな印象だったのに、
	魔法を使うファウストの心の中で火が燃えているなんて、少し意外です。
ファウスト	……怨みの炎だ。決まってるだろ。
`},
{id:11027,title:"アミュレット",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	ファウストもアミュレットを持っていますか？
ファウスト	ああ。僕のアミュレットはそこにあるキャンドルだ。
ファウストが机の上で火を灯しているキャンドルを視線で示す。赤い炎がゆらゆら揺れていた。
ファウスト	魔力を保つには、普段暮らす場所でも、マナエリアを身近に感じられる方が好ましい。
	そのためにアミュレットを置いておく。
	僕のマナエリアは深い森の火のそばだ。
	陽の光よりも、炎の明かりに使う方が落ち着く。
晶	なるほど……。
	ファウストの部屋、独特な雰囲気だなって思ってましたけど、魔力に必要な感じだったんですね……。
ファウスト	は？　趣味だけど。
晶	（趣味なんだ……）
	あと、カーテンが燃えないように、気をつけてくださいね。
ファウスト	…………。
晶	（あ……。位置を直してる……）
`},
{id:11028,title:"鏡の話",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	すみません、ファウスト。明日の討伐に関して、相談があるんですが――。
	あっ……。床に鏡が落ちていますよ！
ファウスト	壁にかけていたのが落ちたんだな。あとで直しておくよ。
晶	……ファウストの部屋には鏡がたくさん飾ってありますよね。
	夜、怖くなったりしませんか？
ファウスト	なにを怖がる必要があるんだ。
晶	俺のいた世界には鏡にまつわる不思議な話が多かったんです。
	例えば――。
~~~~~~~~~	~~~~~~~~~
選択	ムラサキカガミの話をする
晶	ムラサキカガミという言葉を、２０歳まで覚えていると、鏡の破片に全身を刺されて死ぬみたいな話があって。
ファウスト	きみの世界の呪いの言葉ということか？
	だが、僕はそんな呪い聞いたことがないし、その言葉に特別な力も感じない。
~~~~~~~~~	~~~~~~~~~
選択	合わせ鏡の話をする
晶	鏡を二枚合わせると別の世界への入り口ができて、無理やり異世界へ連れていかれてしまうと言われているんです。
ファウスト	きみはその合わせ鏡とやらをしてこの世界にやってきたのか？
	違うなら迷信の可能性が高いと思うが。
	全てを否定するわけではないが、不必要に怖がることもないんじゃないか。
~~~~~~~~~	~~~~~~~~~
晶	そうですよね……。なんだかちょっと安心しました。
	ありがとうございます、ファウスト。
ファウスト	……まあ、僕の部屋に来る度にきみに怯えられるのも癪だからな。
`},
{id:11029,title:"家族",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	差し支えなければ、ファウストの家族のことを教えてもらえませか？
ファウスト	家族……？　唐突だな。
晶	ファウストの優しくて真面目な部分は、ご家族の影響なのかと思って。
	呪い屋になる前にどんな暮らしをしていたのか、聞いてみたかったんです。
	話すのが嫌なら、言わなくても構いませんが……。
ファウスト	……別に、普通だよ。子供の頃に父親がいなくなった。
	そのあとは母親と妹と、祖父母の家で暮らしていた。
	その時代は今より魔法使いが忌み嫌われていて、僕も魔法のことは隠していたが……。
晶	見つかってしまったんですか？
ファウスト	……ああ。同じ年頃の子供だった。猫の怪我を治しているところを見られて……。
	だが、言いふらしたりせずにいてくれた。
晶	よかった……。優しい人達がいる場所に住んでいたんですね。
	その子とは友達になれましたか？
ファウスト	…………。
	どうだったんだろうな……。
	間も無く、住んでいた村も戦乱に巻き込まれ、成長したそいつに戦地に赴こうと誘われた。
	僕はついて行ったが……。
	それが良いことだったかどうか、長い時間考えているが、答えは出ないままだ。
`},
{id:11030,title:"若い魔法使いたちへ",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`ファウスト	賢者か。何を食べている。
晶	……わっ！　びっくりした……。チョコレートです。ファウストも食べますか？
ファウスト	貰おう。疲れて、甘いものが欲しかった。
晶	大丈夫ですか……？今日は確か、魔法の実践の授業で森に出かけていたんですよね。
ファウスト	シノもヒースも熱心なのは結構だが、相手をするのには体力を使うな。
	何度も、今日はここまでと言ったのに聞かなくて、こんな時間だよ。
~~~~~~~~~	~~~~~~~~~
選択	シノの様子はどうでしたか？
ファウスト	シノは特にやる気がある上に、負けず嫌いなところがあるからな。
	注文通りに付き合ってるとくたくただ。
	ヒースも、シノ相手には意外と張り合う節がある。
	お互いに刺激しあっていて、いい環境だな。
~~~~~~~~~	~~~~~~~~~
選択	ヒースの様子はどうでしたか？
ファウスト	普段は大人しいが、一度集中すると、同じことをずっと繰り返していても苦にならないタイプだ。
	新しいことを教えると、ヒースが先に覚える。そうなると、シノも黙っていないだろ。
	お互い刺激しあっていて、良い環境だな。……二人を見ていると、若い頃を思い出す。
	僕はもう、手放してしまったけど、熱意や切実さや、そんなようなもの……。
	だから、柄にもなく、応えたくなるのかもな。
~~~~~~~~~	~~~~~~~~~

晶	……魔法の訓練、上手く行ってるみたいで良かったです。
ファウスト	…………。少し、話しすぎたな。
晶	俺は話が聞けて嬉しかったですよ。
	今日はゆっくり休んで、明日からもまた、頑張ってくださいね。
`},
{id:11031,title:"師匠と従者",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	レノックスは、ファウストがかつて英雄だった時の従者だったんですよね。
ファウスト	人違いだ。英雄だった覚えはない。
晶	でも、レノックスが言うには……。
ファウスト	…………。
	……くそ。彼を嘘つきにするわけにはいかないじゃないか。ああ、その通りだよ。
晶	（珍しい……。
	　レノックスは誠実な人だから、そんなところにファウストも弱いんだろうな。）
	レノックスが従者で、フィガロが師匠だったんですよね。
ファウスト	は？　違うけど。あいつはそんなことを吹聴しているのか？
	そればかりは本当の本当に違う。
晶	（今度はどっちが本当だ……？）
~~~~~~~~~	~~~~~~~~~
選択	そうなんですね。
ファウスト	……多少、師事してもらったことはある。だが、あいつは勝手にいなくなった。
	そんな無責任な師がいるものか。
~~~~~~~~~	~~~~~~~~~
選択	そうなんですか？
ファウスト	あいつの言うことに騙されるな。今だって無名の魔法使いの振りをしているだろ。
	人を騙して、馬鹿にするのが好きなんだよ。
晶	（そんなこともないと思うけど……。レノックスとは逆で、信用がないんだな）
	昔はレノックスをフィガロと３人で、遊んだりしたことがあったんですか？
ファウスト	遊ぶ余裕がある時代ではなかった。
	……だが、まあ、慕っていた偉大な魔法使いと、信頼する部下といる時は心安らかだったよ。
	もう二度と戻りはしないがな。
`},
{id:11032,title:"放っておけない",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	（廊下の隅で誰かうずくまってる……？　あれってもしかして……！）
	ファウスト！　何処か具合が悪いんですか！？
ファウスト	……大丈夫だ。心配かけたな。
晶	顔、真っ青じゃないですか。フィガロに診てもらいましょう。
ファウスト	少し目眩がしただけだ。僕のことは放っておいてくれ。
晶	今日の討伐で怪我をしたと聞きました。無理をしているんじゃないですか？
ファウスト	きみは心配性だな。大丈夫だと言っている。
晶	じゃあ、せめて部屋まで送らせてください。俺の肩貸しますから。
ファウスト	きみの肩を借りることになるとはな。……ありがとう。
`},
{id:11033,title:"危険な落し物",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	あのキラキラしたのは……イヤリング？
	誰かの落とし物かもしれないし、届けてあげないと。
ファウスト	待ちなさい。
晶	こんにちは、ファウスト。もしかして、これはファウストのイヤリングですか？
ファウスト	違うが、それに触れないほうがいい。呪われるぞ。
晶	の、呪い！？　なんでこんなところにそんな危険なアイテムが……。
ファウスト	さあな。ミスラかオーエンあたりが、うっかり落としたんじゃないのか。
晶	（うっかりがすぎる……！）
ファウスト	《サティルクナート・ムルクリード》
	呪いを解いておいたから、もう触れても大丈夫だ。
	まったく、もっと気をつけて行動しろ。
晶	ありがとうございます。
	ちなみに呪われたまま拾っていたら俺はどうなってたんですか？
ファウスト	……聞きたいのか。
晶	……すみません、やっぱりやめておきます。
`},
{id:11034,title:"ファウストの得意な魔法",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	ファウストは、得意な魔法ってありますか？ファウストにしか使えない魔法とか。
ファウスト	呪いをかけることだ。
晶	職業にするくらいですもんね……。　少し、物騒ですね。
ファウスト	ふん。
	僕の呪いは相手の幸運を操作する魔法だ。
	呪いを受けた本人に不幸を呼ぶ気質がなければ成立しない。
	呪ってくれなんて頼まれるようなやつは、普段から恨みを買う振る舞いをしてるんだ。
	自業自得なのさ。
晶	そんな……。誰からも恨まれないように生きるなんて、不可能じゃないですか……？
ファウスト	かもな。
	僕は、呪いたいほど恨む気持ちがあるが、同じ強さで呪われる覚悟も持っている。
	きみはどうなんだ？
`},
{id:11035,title:"ファウストのこと",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	このページに書かれていることって……。
ファウスト	賢者、真剣な顔をしてどうした。
晶	ファウスト！？え、えーっと……。賢者の書を読んでいたんですけど……。
[カップの倒れる音]
晶	すみません、紅茶が……！　濡れてないですか？
ファウスト	僕は大丈夫だ。それよりも、賢者の書の心配をした方がいいんじゃないか？
晶	わっ、びしょびしょだ……！　どうしよう、大切なものなのに……。
ファウスト	…………。
	《サティルクナート・ムルクリード》
晶	すごい。ページが元どおりになった……。ファウスト、ありがとうございます！
ファウスト	大切なものなら大切に扱え。次も僕がそばにいるとは限らないからな。
晶	はい、気をつけます……。
ファウスト	それに何が書いてあったのかは知らないが、もう夜も遅い。
	熱心になりすぎて、あまり夜更かししないように。
	『ファウストのこと最初はめっちゃ怖いし根暗いし近寄り難いと思ってた。
	　けど、なんだかんだ気に掛けてくれるし意外と優しい奴なのかも』
晶	（前の賢者様……俺も同感です）
`},
{id:11036,title:"ファウストの紋章",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	賢者の魔法使いには、目印になる賢者の紋章が身体に現れるって聞きました。
	ファウストの紋章はどこにあるんですか？
ファウスト	左肩の後ろだ。僕の紋章は他の魔法使いよりも大きめに出ているみたいだな。
晶	そうなんですね。少し見せてもらってもいいですか？
ファウスト	嫌だ。服をほとんど脱ぐことになる。
晶	そうか、ファウストの服、脱ぎ着するの大変そうですもんね……。すみません。
ファウスト	そういう問題か……？
晶	その位置だと、自分では見えませんよね。紋章が出たことには気付けたんですか？
ファウスト	紋章が浮かぶ時は熱を持って光る。
	始めは誰かから呪いを受けたのかと思ったが、それよりも忌まわしいものだったな。
	自分の背負った運命も、鏡越しでしか確かめられない。
	皮肉だが、僕にはふさわしいのかもしれないな。
`},
{id:11037,title:"ファウストと朝食",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	ファウスト。朝食の時間もいなかったですけど今起きたんですか？
	それとも体調が……。
ファウスト	体調は問題ない。
	今日は天気がいいから、日差しが落ち着くまで部屋に引きこもっていただけだ。
晶	天気がいいから、部屋にいただなんて少し珍しいですね。
	普通は逆のタイプが多い気がしますが……。
ファウスト	普通なんて知らないよ。僕は引きこもりだから、日差しなんて似合わない。
	それより、きみはここで何をしているんだ。
晶	ファウストの様子を見にきたんです。
	今日のネロの朝食がとても美味しかったんですよ。
	だから、ファウストも食べないと勿体ないと思って、呼びに来たんです！
ファウスト	もう朝食の時間とはいえないが……まあ、せっかくの料理を余らせるのも悪いしな。
	行くとしようか、賢者。
`},
{id:11038,title:"お土産をファウストに",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	こんばんは、ファウスト。
	今日は中央の都に出かけたので、お土産を買って来たんです。
ファウスト	……わざわざ僕に？必要ないのに……。何だ？
晶	似合いそうな毛糸の帽子なんです。
	いつも帽子を被ってるから、好きなのかと思って。
ファウスト	……似合いそうか？　これ……。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
ファウスト	読書。　他にすることがないときは、何もしていない。
	最近は、魔法の授業の資料を事前に作ることがあるくらいか。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
ファウスト	呼ばないよ。自分の部屋に誰か来るのは嫌いだ。引きこもりだからな。
	双子やフィガロが勝手に入って来て迷惑することがある。
	最近はシノもだ。きみからもやめるよう伝えてくれ。
~~~~~~~~~	~~~~~~~~~
~~~~~~~~~	~~~~~~~~~
選択	一日のタイムスケジュールは？
ファウスト	起きて、世界中を呪って、食事をして、授業をする日はする。
	夜は夢を見ないように祈って眠る。その繰り返しだ。
~~~~~~~~~	~~~~~~~~~
晶	外出するのもいいと思いますよ。
	少しファッションを変えてみたら、気持ちが明るくなるかも……。
ファウスト	余計なお世話だ。……まあ、土産はありがとう。次からは気を遣わなくていいからな。
晶	気に入りませんでしたか？　ちょっと被ってもらえませんか？
ファウスト	今は遠慮しておく。あとで、ひとりの時に試してみるよ。
`},
{id:11039,title:"先生のお仕事",type:"personal",characters:["ファウスト","フィガロ"],memo:"ファウスト",
text:`フィガロ	やっぱり、こういう引っかけ問題も入れておかないと。
ファウスト	相変わらず底意地が悪いな。
晶	二人とも、何をしているんですか？
フィガロ	やあ、賢者様。次の訓練で筆記試験を出すから、その問題を作ってたんだ。
晶	魔法の訓練なのに、筆記試験もあるんですね……！
ファウスト	魔法の訓練はただ体を動かせばいいというものでもないからな。
フィガロ	今回は中々難問揃いだよ。でも、ミチルはどんな問題を出しても、毎回満点だけどね。
	やっぱり優秀な先生に似るのかな？
ファウスト	へえ、おまえには勿体ない生徒だな。
フィガロ	何？羨ましいの？　うちは優しくて努力家な子たちが多いからな～。
ファウスト	僕だって十分生徒には恵まれている。優しく、勤勉な子達だ。
フィガロ	あはは。今の言葉、きみの愛弟子たちに聞かせてやりたいね。
ファウスト	……うるさいな。
晶	（この二人って案外、気が合うのかも……）
`},
{id:11040,title:"気の合う二人？",type:"personal",characters:["オズ","ファウスト"],memo:"ファウスト",
text:`晶	ファウストとオズが一緒にいるのって、珍しいですね。何をしてるんですか？
ファウスト	東の国の授業のための資料作りをオズに手伝ってもらっていた。
	世界を支配した北の魔法使いに、頼み事をするのは気が引けたが、他の先生連中より、まだ生徒思いで誠実だ。
晶	そうなんですね……。
	意外ですけど、他の先生はスノウとホワイトとフィガロとシャイロックで、自由そうですもんね。
ファウスト	ああ。僕も意外だったが、助かっている。　なあ、オズ。
オズ	……フィガロにはアーサーが幼い頃に、何かと世話になったからな。借りを返しているだけだ。
ファウスト	……？　何の話だ？
オズ	フィガロはおまえが初めての弟子だと。
ファウスト	は？　僕はフィガロの弟子じゃない。
	あいつへの借りを返すために僕に手を貸していたのか？
オズ	…………。
	フィガロはおまえが初めての弟子だと……。
ファウスト	違う。そういう理由ならオズの手助けを受けない。あいつと僕は無関係なんだ。
オズ	…………。
	……私が意外に生徒思いで誠実だから、おまえを手伝う。これならいいか？
ファウスト	…………。　なら、いいが……。
晶	（あ……。黙々と作業を再開した……。
	　魔王だとか、呪い屋だとか言われているのに、二人とも妙に真面目だよな……）
`},
{id:11041,title:"東の国の先生は",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	ファウスト、何を書いているんですか？
	ノートにびっしり文字が書いてあるみたいですが……。
ファウスト	きみはこの世界の文字が読めないんだったな。
	これはただの授業に使う用のメモだ。東の魔法使いたちの授業の傾向をまとめている。
晶	傾向？
ファウスト	筆記・実技・得意魔法・苦手魔法……。そういったことだ。
	別に面白いものでもないだろう。
晶	すごいですね……！
	けど、こんなにたくさん大変だったんじゃないですか。
ファウスト	別に。　事実を書いているだけだからな。
晶	（当然だと思ってるみたいだけど、
	　真剣にみんなのことを考えているからこそ出来るんだろうな。俺も見習わないと）
	こんなに熱心な先生を持てて、東の国の皆さんは幸せですね。
ファウスト	ふん……。どうだかな。
`},
{id:11042,title:"賢者と猫とファウストと",type:"personal",characters:["⑩"],memo:"ファウスト",
text:`晶	あ、よくここに遊びにくる子だ。よしよーし……。
ファウスト	そんなところにうずくまって、何をしてるんだ？
晶	あ、ファウスト！　見てください！
ファウスト	……猫か。
晶	最近遊びに来る頻度が増えた気がします。
	この子、餌を食べてる時の美味しそうな顔がすごく可愛いんですよ。
ファウスト	確かにな。それに随分ときみに気を許しているようだ。
晶	本当ですか？　それなら嬉しいですが……。
	初めて会った頃は威嚇ばかりされていましたから。
ファウスト	ふふ。間抜けな顔だな。きみに話しかけられて嬉しいんだろう。
	まったく、おまえは幸せそうでいいな。
晶	（えっ！　ファウストが頭を撫でたら３秒で寝た！？）
	俺だってこの子の寝顔はまだ見たことなかったのに……！
ファウスト	こら、静かに。この子が起きてしまうだろう。
晶	す、すみません。……俺の完敗です……。
`},
{id:11043,title:"東の国の反省会",type:"personal",characters:["東"],memo:"ファウスト",
text:`ファウスト	いいか、きみたち。
	今日の討伐は結果的に無事に終わったからよかったものの、まだまだ課題が多すぎる。
晶	（東の魔法使いたち……。
	　討伐から帰ってきたばかりなのに、反省会をしているみたいだ。真面目だ。）
ファウスト	まずはシノ。俊敏な攻撃は見事だった。だが、無鉄砲に突っ込みすぎだ。
	怪我でもしたら、他の皆にも迷惑がかかるんだぞ。
シノ	……次からは気をつける。
ファウスト	ヒース。きみはコントロールは上手いが、魔法を使うタイミングが遅い時がある。
	もう少し自信を持った方がいい。
ヒースクリフ	すみません、自分の反応が合ってるか不安になってしまって……。
	でも、いつまでもそれじゃいけないですよね。
ネロ	まあまあ。あんまりきつく言ってやんなって。
ファウスト	ネロ。お前も自分だけの力で強引に押し切ろうとするときがあるぞ。
	フォローするだけじゃなく、されることも覚えろ。
ネロ	はは……。わかったよ、ファウスト先生。俺ももっとこいつらを頼るようにするよ。
ファウスト	わかってくれたならいい。
	魔法の使い方について気になることがあれば、次の訓練で聞こう。
	今日は疲れただろう。皆、部屋に戻ってゆっくり休むんだ。
晶	（絶妙な飴と鞭のバランスというか……。ファウストは本当にいい先生だな）
`},
