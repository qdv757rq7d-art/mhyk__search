{id:10501,title:"スポットの印象（１）",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	ミスラも氷の森は気に入ってるんですか？前にも来たって言ってましたよね。
ミスラ	何度か訪れた程度ですよ。ここは昔から、双子の土地ですから。
	まあ、嫌いじゃないです。静かで。
晶	賑やかな場所は苦手ですか？
ミスラ	ずっと水辺で過ごしてました。そこは、がやがやしてなかったんですよね。
	人が多い所はうるさいなと思います。
	テーブルの上に物がたくさん置いてあると、ガーッと、腕で払い除けたくなるでしょう。
	ああいう気持ちになりませんか。
晶	ミスラとは静かなところで過ごしたいです……。
	なら、この森には住むのに良さそうですね。
ミスラ	住むには退屈だから、どうかな……。
	でも、嫌いじゃないですよ。景色も、森の気配も。
	気に入った場所なら、疲れるまで歩き回ってもいいかなって気になりますね。
`},
{id:10502,title:"スポットの印象（２）",type:"personal",characters:["ムル"],memo:"スノウ",
text:`晶	あれ、こんな雪の中に穴が空いてる。深くて真っ暗だ……。落ちたら危なそうだな。
ムル	……賢者様ー……。
晶	……え？穴からムルの声が……！？だ、大丈夫ですか、ムル！
ムル	……助けて……賢者様……。
晶	た、助けてって……、落っこちたんですか！？ムル……、ムル！！
	魔法で上がってこれないなんて、まさか怪我したんじゃ……！
	俺じゃどうにもできないし……。
~~~~~~~~~	~~~~~~~~~
選択	シャイロックを呼んで来ますね！
晶	シャイロックを呼んで来ますね！
ムル	なんでシャイロックを？
晶	え！？よく一緒にいて、仲が良さそうだから……。
ムル	なるほど、賢者様にはそう見えるんだね。
	シャイロックが聞いたらどんな顔すると思う？
	穴に落ちた間抜けを素直に助けてくれると思う？
質問を重ねながら、ムルがふわりと穴から姿を現した。
~~~~~~~~~	~~~~~~~~~
選択	スノウを呼んで来ますね！
晶	スノウを呼んで来ますね！
ムル	なんでスノウ？埋められちゃうかも！
晶	え！？スノウは優しいから大丈夫ですよ！
ムル	賢者様は双子の本性を知らないから。
笑いながら、ムルがふわりと穴から姿を現した。
~~~~~~~~~	~~~~~~~~~
選択	オーエンを呼んで来ますね！
晶	オーエンを呼んで来ますね！
ムル	なんで？
晶	うわっ！自分で出られるんじゃないですか！？
ムル	なんでオーエンの名前が出て来たのか、そっちが気になって出て来ちゃった！
~~~~~~~~~	~~~~~~~~~
ムル	この土地は鉱脈があって面白いんだ。
	前に来たのは何百年か前だから、地質が変化してるかもって思って調べてた！
	でも、賢者様をからかったら、賢者様の方が面白そうだった！
晶	冗談だったんですね……。びっくりした……。
`},
{id:10503,title:"スポットの印象（３）",type:"personal",characters:["アーサー"],memo:"スノウ",
text:`アーサー	賢者様、寒くありませんか？
晶	ありがとうございます、アーサー。魔法の力のおかげで、大丈夫です。
アーサー	よかった。
晶	アーサーも、この森に来たことがあるんですか？
アーサー	ええ。スノウ様とホワイト様が招待してくださって、何度かオズ様と一緒に訪れたことがあります。
	この森はオズ様の城の周りの風景にも似ていて、初めて来た時から大好きで、少しだけ怖い場所でもありました。
晶	怖い場所？
アーサー	はい。うっすらとした記憶しかありませんが、幼い頃、捨てられて死にかけた景色に、どことなく似ている気がするのです。
	この森のように、辺り一面の銀世界で、木の枝に雪の葉が茂っていて、垣間見える空が美しくて。
晶	…………。
アーサー	オズ様は、私を拾ったのはここではないと言っていましたから、ただの記憶違いなのでしょう。
	それに……、恐ろしいですが、同時にオズ様と初めて出会えた景色です。
	あの記憶に似ているこの森は、やはり、大好きで、少しだけ怖い場所ですね。
`},
{id:10504,title:"ブレイクタイム（１）",type:"personal",characters:["スノウ","ホワイト"],memo:"スノウ",
text:`スノウ	どれ、仕事も終わったし、少しこの辺りを案内をしてしんぜよう。
晶	わっ……。
大人スノウ	エスコートにはこの袋が良いじゃろう。さあ、賢者。手を。
晶	あ、ありがとうございます。
	（何度見てもイケメンだ……。子供のスノウとホワイトも、人形みたいだものな……）
大人スノウ	ほほほ。毎度新鮮に驚いて、おぬしは本当に可愛らしいのう。
ホワイト	これ。スノウよ。
	抜け駆けとは卑怯じゃな。
大人スノウ	おや、ホワイト。
ホワイト	賢者よ、我もエスコートじゃ。反対側の手は我が取ろう。
晶	は、はい。
	（大きいスノウと小さいホワイトに挟まれて、レアだ……）
大人スノウ	喜んでおる。
ホワイト	喜んでおるな。
大人スノウ	我らと、我らの森を、ゆっくり堪能して帰るがよい。
`},
{id:10505,title:"ブレイクタイム（２）",type:"personal",characters:["オーエン"],memo:"スノウ",
text:`オーエン	…………。
晶	あれ、オーエン！？どうしたんですか、こんなところで倒れて……。
	……え？　息してない……。し、死んでる……！？
	ちょ……、オーエン、オーエン！！しっかりしてください！
	……オーエン！う……ううっ……。
オーエン	…………。
晶	オーエン！！よ、よかった、死んだのかと思いました……。
オーエン	死んでた。
晶	ど、どうしてこんなところで……。誰がこんなことしたんですか？
オーエン	言ったらそいつのこと殺してくれるの？
晶	できないですけど……。
オーエン	じゃあ言いたくない。
晶	…………。
	北の魔法使いって、なんだかんだ、勝ち負け気にするところ可愛いですよね……。
オーエン	負けてもいいやなんて、思いながら生きてる意味なくない？
晶	そういう考え方なんだ……。
オーエン	肩貸して。じっとしてて。しばらくしたら治るから。
晶	は、はい。どうぞ……。
オーエン	はぁ……。痛い……。はあ……。むかつく……。
`},
{id:10506,title:"スポットの思い出(１)",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	この森には、ホワイトと共に、よう遊びにきておった。懐かしいのう。
晶	二人はどんな遊びをするんですか？
スノウ	我ら暇じゃったからの。だいたいの遊びはやり尽くしたのう。
	いつぞやの賢者に波乗りというのを教わって、小さな雪崩を起こして乗ってみたりじゃとか。
晶	結構ハードな感じなんですね。
	スノウ	ハートフルなのもあるぞ。迷い人などを助けたりじゃとか。
	旅人なんぞにちょっと幻術を見せてやると、すぐ山道から外れるからのう。
	我ら可愛らしい見た目をしておるから、死にかけた者の前にふたりで出て行くと、迎えが来たのじゃと思って泣き出す者が多い。
	そういう者を愛でてみたりの。
晶	限界状態の人にひどい悪戯をしないであげてください……！
スノウ	大丈夫じゃ。ちゃんと家に帰してやっておる。
晶	（見た目に騙されやすいけど、この二人も、
	　度を越した悪戯好きなところがあるから、気をつけないと…………）
スノウ	ほほほ。
`},
{id:10507,title:"スポットの思い出（２）",type:"personal",characters:["ホワイト"],memo:"スノウ",
text:`晶	この森にはよく来ていたんですよね。何か、思い出とかありますか？
ホワイト	思い出も何も……。
	ここは、我が死んだ森じゃ。言うなれば、思い出が終わった場所じゃな。
晶	…………。
そういうと、ホワイトは雪の上に無造作に寝転がった。
ホワイト	ここにこういう感じで倒れて、息を引き取ったのじゃ。
	スノウはちょうど、おぬしが立っておる辺りに居たかのう。
晶	……本当の話ですか？それともいつもの冗談ですか？
ホワイト	全然マジ。マジのやつ。
	ふむ……。賢者よ、ちょっとスノウを呼んできてくれんかの。
	あやつの反応が見たいんじゃ。
晶	俺だって反応に困るんですけど……。
ホワイト	おぬしが悪く思うことなど何もない。
	スノウはきっと、気まずい顔をするんじゃろうがの。
	しろしろ。いい気味じゃ。
晶	ホ、ホワイト……。
`},
{id:10508,title:"スポットの思い出（３）",type:"personal",characters:["フィガロ"],memo:"スノウ",
text:`フィガロ	綺麗だね。あー、北の国に帰ってきたなあ！って感じの景色だな。
晶	やっぱり、北の国が懐かしいんですね。
	フィガロやオズも、氷の森にはよく来たんですか？
フィガロ	よく来たっていうか、双子に魔法を教わっていた頃は、
	こっちの方で暮らしてたんだよ。
	氷の森には修行しに来てたから、懐かしいっちゃ懐かしいけど……。
	千年以上も前だから景色は変わってるし、まあ、雰囲気が、って感じだね。
晶	（気が遠くなりそうな話だな……）
フィガロ	実は、この辺一帯は一度、オズが魔法の修行中に、ほとんど燃やしちゃったことがあるんだよね。
晶	え！？事故でですか？
フィガロ	そうそう。昔からオズの魔力は尋常じゃなかったけど、
	当時は加減がうまくいかないことがあってさ。
	この話をオズに振ると、気まずいのか何なのか、モジモジして面白いんだ。
	今度、賢者様も聞いてごらん。
晶	失敗談の規模がでかいです……。
	今までの俺のやらかしが、何でもないように思えて来ました。
フィガロ	あはは。失敗なんて、何でもないものだよ。
	この森だって、今じゃ元どおりなんだから。
	オズの魔力も凄いけど、自然の力も凄いだろう。
	だいたいのことは、長い時間が解決するものだ。心配いらないよ、賢者様。
`},
{id:10509,title:"スノウへの印象（１）",type:"personal",characters:["ホワイト"],memo:"スノウ",
text:`ホワイト	スノウの印象か？おぬしはなかなか難しいことを聞くのう。
晶	難しいですか？
ホワイト	スノウを褒めると、自分を褒めるようになってしまって、何を話せばいいのかわからぬ。
	我らはほとんど、互いの分身のようなものじゃからの。
晶	そういう感じなんですね……。
ホワイト	そうじゃな。
~~~~~~~~~	~~~~~~~~~
選択	どんなときのスノウが一番好きですか？
晶	どんなときのスノウが一番好きですか？
スノウ	そうじゃな。スノウも同じじゃろうが、眠っておる時のスノウが一番好きじゃ。
	我ら、眠る時も目覚める時も、同じようなタイミングじゃからの。
	眠っているスノウを見るのは、貴重じゃ。あやつもそれを分かっておる。
	たとえ目覚めても、短い間、寝たふりをする。お互いさまの話じゃよ。
~~~~~~~~~	~~~~~~~~~
選択	苦手なところはありますか？
晶	苦手なところはありますか？
ホワイト	そうじゃのう……。…………。
	スノウが居らぬと、我がここに居られぬことじゃ。
	今は、あやつが我の魂をつなぎとめておる。
	あやつと離れたい訳ではないが、選んで共に居るのとは、また違うものじゃのう。
	昔は、そうではなかったからのう。
~~~~~~~~~	~~~~~~~~~
選択	一緒にいて楽しいことはなんですか？
晶	一緒にいて楽しいことはなんですか？
ホワイト	新しく、面白い遊びを思いついたときかのう。
	じゃが、ずっと二人だけでいると、我らにしか理解できない遊びや、冗談が増えてしまうんじゃ。
	したがって、本当に面白いのかは分からぬ。
晶	（究極の内輪ウケみたいな感じだな……）
`},
{id:10510,title:"スノウへの印象（２）",type:"personal",characters:["ミスラ"],memo:"スノウ",
text:`ミスラ	スノウの印象、ですか？
晶	はい。不思議な距離感なので、ミスラはスノウをどう思っているのかなって。
ミスラ	……難しいですね。印象がないわけじゃないんですけど。
	あの双子は敵でも味方でもない気がして。そういう人をなんて言えばいいですか。
晶	ミスラはまず、敵か味方で判断するんですね……。
ミスラ	ええ。
	双子は別に嫌いでもないですけど、俺に何かしてくれるわけでもないですし。
	あなたが双子を分けて尋ねるのは不思議です。あれは、二人でひとつのもの。
	ひとりの魔法使いと同じだ。
	まあ、どちらがどちらというのは、たまに間違えますかね。
晶	それは普通だと思います……！
ミスラ	今はまだ覚えやすいです。……ああ、思い付きましたよ。スノウの印象。
晶	なんですか？
ミスラ	生きてる方だな、と思っています。
`},
{id:10511,title:"スノウへの印象（３）",type:"personal",characters:["オーエン"],memo:"スノウ",
text:`晶	オーエンから見た、スノウの印象ってどうですか？
オーエン	あんまり会いたくないやつ。
	双子が僕のところに来るのは、叱りに来る時だけだから。
晶	そうなんですね……。
オーエン	他に用事ないでしょう。
	面倒臭いし、あーやだやだ、って感じ。
	何か楽しんでたのにケチがついて、急に退屈になる。
晶	なんだか、学校サボってるのが見つかったヤンキーみたいですね……。
オーエン	何？　ヤンキーって。強いの？
晶	よく知らないですけど、強い人もいると思います。
オーエン	ふうん。じゃあいいかな、ヤンキーで。
晶	（いいんだ……）
オーエン	今はホワイトが死んでるから、戦えば勝てるかもしれないって思うけど。
	双子はオズが大事にしてるでしょ。
	結局あの男が出てくると思うと、ケンカを売るのは馬鹿らしいね。
`},
{id:10512,title:"スノウへの印象（４）",type:"personal",characters:["ブラッドリー"],memo:"スノウ",
text:`晶	ブラッドリーから見た、スノウの印象ってどうですか？
ブラッドリー	あの双子は目の上のたんこぶみたいなもんだ。
	捕まって、牢に入れられる前から、何かにつけあいつらが出てきやがったからな。
	俺以外の奴らも、悪さがすぎると、スッと出てきてぶちのめされてた。
	思い出しても腹が立つぜ。
晶	そうだったんですか……。
	（北の国は強い魔法使いが多いらしいけど、度が過ぎないように、
	　スノウとホワイトがやんわり取り締まってくれてるのかな……）
ブラッドリー	まあ、ホワイトが死んだ時は、流石にちょっと驚いたな。
	落ち込んでるのかと思って、様子見に行ったら、死んだはずの双子が揃ってるからよ。
	正直、引いた。
晶	それは……。そうでしょうね……。
ブラッドリー	年甲斐もなく痴話喧嘩して、殺し合ったって知ってると……。
	どの面下げて仲良くしてんだと思って、ゾッとするよな。
	俺が昔、相棒と別れた時は、サラッとしたもんだったぜ。
`},
{id:10513,title:"スノウへの印象（５）",type:"personal",characters:["オズ"],memo:"スノウ",
text:`晶	オズは、スノウとは長い付き合いだって聞きました。
	昔からずっと変わらない感じですか？
オズ	ああ。スノウも、ホワイトも、出会ったときから賑やかで世話焼きだ。
	長い時を生きながら、時代に合わせ、時代に溶け込むのが上手い。
晶	時代に合わせる……。なるほど、それはわかる気がします。
	俺も、初めからとても親しみやすかったし。
	オズは少し……、苦手そうに見えるかもしれません。
オズ	私にとって、時代は季節のようなものだ。私は変わらず、時代が変わっていく。
	性に合う時代、合わない時代が移ろい、過ごしやすい時代と、そうでない時代がある。
	それが淡々と巡ってくる。
	双子や、フィガロなどは柔軟だ。
晶	スノウとホワイトは、オズとフィガロの魔法のお師匠様なんですよね。
	二人のこと、区別してるんですか？
オズ	分けて考えてはいなかったが、考える事件が起きた。
晶	あ……。す、すみません……。デリケートなところを……。
オズ	構わない。もともと、何を考えてるのかわからない双子だったが。
	あの件で、一層わからなくなった。
`},
{id:10514,title:"スポットゆかりの話（１）",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	氷の森で一番大きいのがこの樹じゃ。
晶	すごいですね……。こんなに寒い場所なのに……。
スノウ	うむ。我らが子供の頃からある樹じゃからの。
	我らと同じくらいか、それ以上の長寿じゃ。
晶	そんなに？俺の世界にあったら天然記念物です。
スノウ	この辺りは一度、大規模な火災にあってのう。
	ホワイトと共に、この樹を守ったことがあるのじゃ。
	この樹は、我らにその恩を感じておる。
	我らの紹介ならば、おぬしにも好意を向けるじゃろうて。
晶	植物が恩や好意を感じたりするんですか？
スノウ	長く生きておれば、どんな生き物も、向けられる心や、簡単な言葉くらいは、
	理解できるようになるものじゃよ。
	賢者よ、何か話しかけてみるがよい。
~~~~~~~~~	~~~~~~~~~
選択	初めまして！　晶です！
晶	初めまして！　晶です！
スノウ	おお。そうじゃったそうじゃった。おぬしの名、我らも忘れるところであった。
晶	そんな……。
スノウ	定期的にアピールするがよいぞ。
~~~~~~~~~	~~~~~~~~~
選択	よろしくお願いします！
晶	よろしくお願いします！
スノウ	ほほ。謙虚で可愛らしい挨拶じゃのう。行儀が良くて、連れて来た我らも鼻が高い。
	北の魔法使いでそんなことを申す者は、まず居らんからの。
~~~~~~~~~	~~~~~~~~~
選択	新しく召喚された賢者です！
晶	新しく召喚された賢者です！
スノウ	うむ。おぬしの役目がわかりやすくて、よい挨拶じゃな。
晶	樹は、賢者とか、厄災だとかも、理解できるんでしょうか……？
スノウ	自然の方が厄災の影響を受けやすく、力や気配も感じやすい。
	わからぬのは人間くらいじゃよ。
~~~~~~~~~	~~~~~~~~~
晶	え……。枝が揺れた……？
スノウ	喜んでおる。退屈しておったようじゃな。
	我らの兄弟のような様じゃからの。仲良うしてやっておくれ。
`},
{id:10515,title:"スポットゆかりの話(２)",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	ここじゃここじゃ。あそこに水晶の岩があるじゃろう。
晶	うわ、大きい……。岩の周りがキラキラしててすごく綺麗です。
スノウ	そうじゃろう、そうじゃろう。
	あれはラウゴックと言って、我らが水晶に変えた魔法使いじゃ。
晶	……え……？元は魔法使いだったんですか？
スノウ	そうじゃ。
	むやみに人間を殺めて回っておって、少しばかり目に余っての。
	我らがお仕置きしてやったんじゃよ。
晶	スノウとホワイトが……。
スノウ	水晶になってもなお、我らに恨みを抱いておるようでの。
	ほれ、こうして近づくと……。
晶	わっ……、岩から結晶が噴き出して来た……！？
スノウ	怒りで水晶の体が砕け散って、雪になって降り積もるんじゃよ。
	魔力が強いと思念が残ってしまうからのう。
	怒りや憎しみも、美しく昇華するようにしてやったんじゃ。
	ほっほっほ。こやつがマナ石になるまで、まだ数百年はかかるかのう。
晶	（スノウとホワイトのお仕置き、半端ないな……）
`},
{id:10516,title:"北の国について",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	北の国は、見ての通り自然が厳しく、その分、神秘の力も強いために、魔力の強い魔法使いが多い。
	魔法使いには過ごしやすいが、人間たちはあまりおらん。そこは、寂しくもあるのう。
晶	スノウやホワイトも、人間が居ないと寂しいと思うんですか？
スノウ	うむ。
	生まれたばかりの者たちは、物知らずで、健気で、愛おしく、面白い。
	本当はもっと構いたいぞ。
晶	そういう感じで、俺にも接してくれてたんですね……。
スノウ	寂しさを感じて、人間と親しくしようとすると、大抵の者は怖がって怯えたり、へりくだるような態度になる。
	そうなると、ちょびっとだけ面倒くさいのじゃ。
	結局、我らも都合がいいんじゃろうな。
`},
{id:10517,title:"〈大いなる厄災〉について",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	この氷の森も心なしか落ち着かん気配じゃのう。厄災が近付きすぎた影響か。
晶	厄災が近づく時って、魔法使いたちはどんなふうに感じるんですか？
スノウ	うーむ。よく聞かれるが、なんとも言葉にし難いのじゃ。あえて言うならば……。
	来てる来てるう！
	……って感じかの。
晶	力が漲るような感じ……、でしょうか。
スノウ	うむ。それが一番似ておるな。実際、皆の魔力も強くなる。
	乗じて悪さをするものもおったのう。
	今年の〈大いなる厄災〉は若干手強そうだとか、今年の〈大いなる厄災〉は大したことがないだとか、
	月が近づく頃になると、徐々に感じる者もおる。
晶	ある程度は予測ができるって事ですか？なら、対策が練れそうで、少し安心……。
スノウ	油断は禁物じゃ、賢者よ。
	気配を感じる時期はまちまちな上に、前回はあの有様じゃからの……。
	悠長な事は言っておれぬ。地道に鍛錬を重ね、備えるしかないのじゃ。
`},
{id:10518,title:"スポットの人々",type:"personal",characters:["ホワイト"],memo:"スノウ",
text:`晶	北の国は、人間が暮らすには、なかなか厳しい場所ですね……。
ホワイト	そうじゃのう。気候もあるが、北の魔法使いは、いわくつきの者が多いからの。
	この国の数少ない人間は、土地の魔法使いの縄張りに住み着いて、庇護を求めて暮らしておる。
晶	庇護？
ホワイト	我らの住む村には、他の魔法使いも手を出さんということを、人間はよく知っておってのう。
	そうして、我らの土地で暮らすその代わりにと、食料や生活に使うものを持ってくるのじゃ。
晶	お供え物とか、みかじめ料みたいな感じですね……。
ホワイト	昔は、魔法使いを神のように扱う人間が多かったんじゃよ。
	北では、その風習が色濃く残っておる。
晶	スノウとホワイトは、村や人間を守ってあげるんですか？
ホワイト	もちろんじゃ。長く側で暮らせば、それなりに愛着もわくしの。
	ミスラのような行儀の悪い者が、土地ごと横取りするのを防いだり、悪天候や天災を避けてやることもある。
	我らの住む氷の街から、この森を越えて、このずっと先の山脈まで我ら双子の縄張りじゃ。
	賢者も北の国に住む時は、我らの土地に暮らすが良い。特別待遇でもてなしてやろう。
晶	ありがとうございます。でも……、寒いのに慣れたら、ですかね……。
`},
{id:10519,title:"スポットにいた魔法使い",type:"personal",characters:["ブラッドリー"],memo:"スノウ",
text:`晶	この辺りには、どんな魔法使いが暮らしてるんでしょう？
ブラッドリー	氷の森は双子の縄張りだからな。
	ここに住んでるような魔法使いはまあ、北で生きていくには弱い奴らだ。
	成り上がりみたいなやつもいるが、まず双子にやられるな。
	まあ、あいつらはそのあとの面倒見もいい。
	昔、死期が近い、じじいの魔法使いがいた。
	耄碌していて、双子のことを孫だと思い込んでた。
晶	孫……。そのおじいさんの方が年上だったんですか？
ブラッドリー	まさか！あいつらが何千年生きてると思ってんだ。
	あの双子がこの世界でいちばんの年寄りだぜ。
	双子はじじいに付き合って、おじいちゃま、おじいちゃま、って、懐いて喜ばせてたんだ。
	俺は本性を知ってるじゃねえか？見てて怖かったぜ。
晶	な、なるほど……。
	ブラッドリーもその人に会った時は、話を合わせてあげてたんですか？
ブラッドリー	ああ。そうしねえと、双子がやかましいからな……。
晶	なんて言うんです……？
ブラッドリー	「いいお孫さんですね」つって……。
	あ？コラてめえ、笑ったか、今。ぶっ殺されてえのか？
`},
{id:10520,title:"穴の中の調達者",type:"personal",characters:["シャイロック"],memo:"スノウ",
text:`晶	あれ、こんな雪の中に穴が空いてる。深くて真っ暗だ……。落ちたら危なそうだな。
穴を覗き込むと、突然シャイロックが穴から顔を出した。
シャイロック	賢者様。
晶	わっ！？びっくりした……！ど、ど、どうしたんですか、シャイロック。
	かくれんぼですか……？
シャイロック	私が？　かくれんぼを？面白いことをおっしゃいますね。
晶	穴から出てくるシャイロックの方が、相当面白いですけど……。
シャイロック	雪の底にある氷を取っていたんです。
晶	氷ですか？わざわざ穴を掘って……？
シャイロック	奇人を見るような目でこちらを見るのはおよしになってください。
	その眼差しを送るべき人物は他に居りますよ。
	酒に使う氷です。北の国や、東の国の水は、とても上質なんです。
晶	な、なるほど。やっと納得できました。
いつも常識的だから、ちょっとギャップがあって混乱しました。
シャイロック	ふふ。お恥ずかしいところをお見せしました。
	ですがもう少し調達しておきたいので、これで。
そういうと、シャイロックは再び穴の中へ姿を消した。
晶	やっぱりギャップある……。
	（もしかして、いい氷が手に入りそうだから、少しだけウキウキしてるのかな……？）
`},
{id:10521,title:"危険な場所",type:"personal",characters:["オーエン"],memo:"スノウ",
text:`オーエン	賢者様、賢者様。
晶	オーエン……？そんな離れたところで、どうしました？
オーエン	ねえ、ちょっと、こっちまで来て。賢者様。
晶	（猫なで声だ……。危険な予感がする）
	あの……、どうして、少しだけ地面から浮いてるのか、聞いてもいいですか？
オーエン	だめ。
	いいから来て。そのまま歩いてこっちまで。
晶	…………。
突っ立ってても埒があかないので、俺はオーエンのいる方へ歩き出した。
その時……。
晶	……っ！！……地面が裂けてる！？！？！？
オーエン	おや、残念。落ちなかった。
晶	危な……！？なんですか、これ。オーエンが魔法で地面を割ったんですか？
オーエン	僕じゃない。クレバスだよ。
	きみの悲鳴を聞いた後、底に落ちたきみと話がしてみたくて。
晶	酷い……。
オーエン	ここはこういうのが多いんだ。危ないから気をつけた方がいいよ。
晶	親切……？
`},
{id:10522,title:"スノウの評判",type:"personal",characters:["ブラッドリー"],memo:"スノウ",
text:`晶	あれ、ブラッドリー。どうしたんですか、その果物……。
ブラッドリー	スノウとホワイトに世話になってた、若い魔法使いが持ってきてた。
	気配で双子がここに来たのがわかったんだろ。
晶	横取りしちゃダメじゃないですか……。
ブラッドリー	うるせえ。告げ口したらぶっ殺すぞ。
	魔法舎でもそうだが、双子は若い連中によく好かれる。
	あの姿形に騙される馬鹿が多いんだ。
晶	でも、俺には、出会ったときからずっと、親切で親身な感じですよ。
ブラッドリー	猫かぶってんだよ。面倒見のいいふりして、
	いざとなると本気で怖えことを最近は隠してる。オズやフィガロもだ。
	そのせいか、若い連中が古くて強え魔法使いを、ちょっと舐めたような構い方すんの見ると、ヒヤヒヤするぜ。
晶	（なんだかんだ、後輩を心配したりして、ブラッドリーも面倒見がいい気がするけど……）
ブラッドリー	と言っても、悪い奴らがやりたい放題やってた時代に比べりゃみんなだいぶ丸くなりやがった。
	日和ったのか、年のせいか……。いずれにしろ、そろそろ俺様の時代が来るのかもな。
晶	そんなこと言ってると、またスノウとホワイトに叱られますよ。
ブラッドリー	うるせえ。告げ口したらぶっ殺すぞ。
`},
{id:10523,title:"スポットでの名物",type:"personal",characters:["ミスラ"],memo:"スノウ",
text:`ミスラ	おや。
晶	え？
一緒に歩いていたミスラが、突然、近くにあった木の枝を手折って、俺に差し出した。
ミスラ	どうぞ。
晶	ど、どうも……。なんですか？これ。
ミスラ	氷の木の新芽は、枝から取ってもしばらく凍っているんです。
晶	なるほど……？
ミスラ	は？
晶	え？
ミスラ	……おかしいな。前の賢者はもっと喜んだんですけど。
晶	前の賢者様が？
ミスラ	いつも俺の事を怖がっているのに、空間の扉を開けてくれと頼まれました。
	絶対売れるから南の国に持って行くって。
	大航海時代みたいに、貴重品を物々交換して、一山当てようとかなんとか……。
晶	賢者様ったら……。ミスラは協力したんですか？
ミスラ	しないですよ。面倒くさい。
	その後、弁当に入れていると報告されました。
	食べると舌も胃も凍ると言ったんですけどね。
晶	（保冷剤にしてたのかな……。便利そうだから俺も貰っておこう）
`},
{id:10524,title:"スポットでの発見",type:"personal",characters:["オズ"],memo:"スノウ",
text:`晶	オズ！ここにいたんですね。何か見てたんですか？
オズ	いや……。
晶	（あれ、あそこの木の陰に何かいるみたいだ。あれは……、うさぎ？）
~~~~~~~~~	~~~~~~~~~
選択	うさぎが好きなんですか？
晶	うさぎが好きなんですか？
オズ	私ではない。子供の頃、アーサーが好きだった。
~~~~~~~~~	~~~~~~~~~
選択	うさぎが食べたいんですか？
晶	うさぎが食べたいんですか？
オズ	ミスラのような真似はしない。子供の頃、アーサーが好きだった。
~~~~~~~~~	~~~~~~~~~
オズ	よくうさぎを追いかけて、危険な目にあっていたからな。
	うさぎを見ると思い出すようになった。
	捕まえるのに夢中になって、崖から落ちそうになったり、熊や狼の巣に近づいたり……。
晶	それは怖いですね……。子供って目を離せないって言いますもんね。
オズ	ああ、何度注意しても聞かない。
	本人も悪気があるわけではなく、周りが見えなくなってしまうらしかった。
	困り果て……、うさぎ自体が危険な動物だと認識させれば安易に近付かなくなるのではと考えた。
晶	うさぎ自体を……？いい考えかもしれませんが、どうやったんですか？
オズ	魔法で、城の周りのうさぎを恐ろしい姿に変えた。一匹残らずな。
晶	ど、どんな感じの……。
	《ヴォクスノク》
オズは、さっき見ていたうさぎに魔法をかけて恐ろしくおぞましいモンスターの姿に変えた！
晶	ギャーーーーーー！！！！バケモノ！！！！エイリアン！！！！
オズ	やはりか……。
	今のおまえのように、アーサーもあまりにも泣いて怯えたので、すぐに元に戻した。
	結局、物心着くまでうさぎの件は解決しなかったな。
`},
{id:10525,title:"楽しい場所",type:"personal",characters:["フィガロ"],memo:"スノウ",
text:`フィガロ	今夜はオーロラが出そうだな。
晶	え！？オーロラ見れるんですか！？
フィガロ	賢者様、オーロラ見たことないの？
晶	ないです！　見てみたいです！
フィガロ	そんなに？いいよ、じゃあ、今夜は森に泊まろうか。
	《ポッシデオ》
フィガロが呪文を唱えると、透明なガラスドームのようなものが、俺達の頭上を覆った。
それから、ベッド、ソファ、暖炉といった家具が次々に現れて、ドームの中はホテルの一室のようになった。
晶	すごい！！旅行雑誌で見たやつだ……！！
フィガロ	あはは、そんなに喜んでもらえると、魔法の腕をふるう甲斐があるよ。
	酷寒の夜に、暖かい飲み物を飲みながらオーロラ鑑賞するのもいいかもね。
晶	俺の元いた世界でもそういうのありました！
	こたつでアイスとか、プールでおでんとか。
フィガロ	へえ、何言ってるのかよくわからないけど、楽しいものってことかな？
	ここじゃオーロラなんて珍しくもないけど、賢者様と一緒なら、特別になるのかもね。期待してるよ。
`},
{id:10526,title:"マナエリア",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
スノウ	それはきっとマナエリアのことじゃの。前の賢者に教えたことを覚えておる。
	マナエリアとは、自身の精神を安定させ、魔力を研磨し高めるための、原風景のような場所のことじゃ。
	誰しも心休まる場所が必要じゃ。
	マナエリアを見出せないままでいたり、長く離れておると心が弱ってしまう。
晶	魔法使いにとって大切な場所なんですね……。
	スノウにもマナエリアがあるんですか？
スノウ	我ら双子のマナエリアは、穏やかな大河と雪の山脈の風景じゃ。
	美しく雄大な景色の真ん中に立っておると、世界を慈しむ心に包まれる。
	全て、我らのもの！という気分になって魔力がみなぎるのじゃ。
`},
{id:10527,title:"アミュレット",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	スノウもアミュレットを持ってますか？
スノウ	もちろんじゃ。我らのアミュレットはこれじゃの。
スノウは、ふわりと宙に浮くと、棚に置いていたガラスケースを手に取って俺に見せてくれた。
淡く発光するケースの中には、穏やかな大河と雪の山脈の景色が映っている。
手の中で小さな窓を覗き込んでいるようだ。
晶	木々が風で揺れてるし、雲や水面が動いてる……。
	すごく綺麗ですけど、本物なんですか？
スノウ	これは我らの作った幻影じゃな。
	特別な魔法で、北の国にある風景をケースの中に閉じ込めておるのじゃ。
	ホワイトの魂をこの世につなげておくには、強い魔力が必要じゃ。
	マナエリアから離れ、魔法舎で暮らすことになった我らには、魔力を保つためのアミュレットは必須じゃの。
晶	そんなに大事なものなんですね……。見せていただいて、ありがとうございます。
スノウ	そんなにかしこまらずとも良い。
	そなたに我らの大切な景色を見てもらった上、褒めてもらえて。嬉しいのう。
晶	すごく壮大で素敵な景色でした！寒そうですけど、いつか実際に見てみたいです。
スノウ	そうかそうか。ではいずれ、ホワイトとともに、
	そなたをこの場所へ連れていってやろうかの。
`},
{id:10528,title:"きらきらの正体は？",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	これがステンドグラス作りに使う材料箱じゃ。どれも上質な鉱石ばかりじゃぞ。
晶	なるほど。これでステンドグラスを作るんですね。それにしても――。
~~~~~~~~~	~~~~~~~~~
選択	この緑色の石、すごく綺麗ですね！
スノウ	それは氷樹に生る宝石じゃ。どれ、一つ賢者にやろう。
晶	いいんですか？そんな貴重そうなものを。
スノウ	気にするでない。この石も賢者に気に入られて喜んでおる。
晶	ありがとうございます。大切にしますね！
~~~~~~~~~	~~~~~~~~~
選択	この青色の石、すごく綺麗ですね！
スノウ	それは……。オズの城の外壁のかけらじゃな。
晶	えっ、どうしてそんなものが？
スノウ	幼いアーサーが我らにくれたのじゃ。綺麗だったから剥き取ったと言っておった。
	ほほほ、懐かしいのう。
晶	アーサー、やっぱりやんちゃだったんですね……。
~~~~~~~~~	~~~~~~~~~
スノウ	ちなみに、そちらの赤い珠は北の森に住む魔物の目玉じゃな。
晶	め、目玉！？冗談ですよね……？
スノウ	冗談ではない。市場では宝石よりも高く売れる一級品じゃぞ。
晶	……じゃあ、この薄くてキラキラした白い石は。
スノウ	おお、それは大昔に手懐けたドラゴンの餅じゃ！賢者はお目が高いのう！
晶	材料箱というよりびっくり箱にしか見えなくなってきました……。
`},
{id:10529,title:"家族",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	スノウ。これ、クロエから。
	二人の人形にお揃いのブローチを作ったから渡してくれって頼まれて。
スノウ	おお！クロエにおねだりしておったのじゃ！礼を言うぞ、賢者よ。
	これはこれは、とても愛らしいのう……。母様もきっと気に入るじゃろう。
	さっそく着けてみようかの！
スノウは魔道具の人形を取り出すと、胸元にクロエが作ったブローチを飾った。
晶	その人形、いつも母様、父様って呼んでますよね。二人の両親がモデルなんですか？
スノウ	さあ、どうかのう。家族のことは、とうの昔に忘れてしもうた。
	この人形は、物心ついた時からホワイトと揃いで持っていたものじゃ。
	長い間ずっと、母様の役をしてくれておる。
	両親の代わりに持っていたものかもしれぬし、両親が我らに授けてくれたものかもしれぬな。
晶	なら、ホワイトとの大事な思い出が詰まった人形なんですね。
スノウ	そうなのじゃ！
	家族の思い出はなくとも、我ら、お互いの思い出は数え切れぬほどある。
	お互い、それで満ち足りてしまうのじゃ。
`},
{id:10530,title:"双子の真剣勝負",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	わっ、スノウ。珍しいですね、大人の姿で……。
大人スノウ	うむ。ホワイトと、大事な作戦で意見が分かれてしまってのう。
	ここ一番の勝負をしておる。
晶	勝負？
大人スノウ	カナリアが食事の準備の手伝いに、若い娘を連れて来ておるのじゃ。その者に……。
	我とホワイト、どちらが先に取り入っておやつを貰えるか、勝負をしておるのじゃ！
晶	なるほど。それでスノウは大人、ホワイトは子供で、アタックする作戦なんですね。
~~~~~~~~~	~~~~~~~~~
選択	大人の姿のスノウが勝ちそう。
大人スノウ	さよう、我も同じ意見じゃ。
	若い娘はすべからく、若い男に心奪われるものじゃからの。
~~~~~~~~~	~~~~~~~~~
選択	子供の姿のホワイトが勝ちそう。
大人スノウ	なんと。そなた、ホワイトに賛成なのじゃな？
	若い娘は愛らしい子供に心奪われるものかのう。
~~~~~~~~~	~~~~~~~~~
大人スノウ	そなたの意見、参考になったぞ。
	まあ、どちらが勝っても、勝った方へ姿を変えれば、ともにおやつが貰えるじゃろう。
晶	確かに。頑張ってくださいね、スノウ。
大人スノウ	うむ。いざ、勝負じゃ！
`},
{id:10531,title:"オズへの親心",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	スノウはずっと昔から、オズを知っているんですよね。
	オズの子供の頃のことも知っているんですか？
スノウ	もちろんじゃ。子供の頃のオズはかわいかったの～。
晶	へえ、そうなんですね。
	なにかほっこりする、かわいいエピソードがあったりするんですか？
スノウ	あるわけなかろう。相手はオズじゃぞ。かわいいのは見た目の話じゃ。
	無口で無愛想でも幼気ならかわいいものじゃからの。
晶	ああ、なるほど……。
スノウ	当時から魔力が強くての。
	オズをかわいがる反面、決して気を緩めずに、慎重に用心もしておった。
	恐ろしい力の持ち主が、世界を凍りつかせる凄まじい吹雪になって、我らを凍りつかせたりせんようにな。
晶	慎重に用心……。どんなことをしていたんですか？
スノウ	プレゼント作戦をしたりして、恩と情であれと絆を結ぼうとしたのじゃ。
	恩情を感じたかは知らんが、我らの顔は覚えた。
	愛やらその類を教えようとしたが……。オズに理解出来たのか、今でもわからん。
	自分の前で気を緩めぬ相手に、愛やら何やら言われても、信じることは難しいじゃろうからな。
	そう考えると、無邪気な幼いアーサーに、オズが心を開いたのは、当然の道理かもしれん。我らは親代わりとして、嬉しく、寂しく思うがの。
`},
{id:10532,title:"オズとしりとり",type:"personal",characters:["オズ","スノウ","ホワイト"],memo:"スノウ",
text:`晶	スノウとホワイト。それにオズも、何をしているんですか？
ホワイト	しりとりじゃ！前の賢者に教えてもらってのう。
スノウ	じゃがオズは喋るのが遅くて、テンポが悪いのじゃ。
オズ	……『うるさい』。
スノウ	『い』じゃな？ほら、賢者の番じゃぞ。
晶	え！？い、『糸』！
スノウ	『と』じゃな！『とってもキュートな我とホワイト』！
ホワイト	むむっ！また『と』じゃと？……『とってもラブリーな我とスノウ』！
オズ	…………。
ホワイト	もー！　そういうとこだよオズちゃん！
スノウ	そうそう！もっとテンションあげてこ！
オズ	『うるさい』。
スノウ・ホワイト	ダメダメダメー！
ホワイト	同じのは二回言ったらダメなんじゃぞ！もう一回考えるのじゃ！
晶	（オズにこんな風に言えるのなんてスノウとホワイトぐらいだろうなあ）
`},
{id:10533,title:"お酒に酔いしれて",type:"personal",characters:["スノウ","クロエ"],memo:"スノウ",
text:`シャイロック	賢者様、こちらへ。
晶	あれ、どうしましたかシャイロック。
スノウ	むにゃむにゃ。
晶	出来上がっている……。珍しいですね、スノウが酔ってるなんて。
シャイロック	今は随分と気分が良いらしいですよ。
	あまり見られないお姿ですので、賢者様にもおすそ分けをしようかと。
晶	普段はすぐ眠くなってしまうからと言って、あまり飲まないですもんね。
スノウ	ん……賢者？賢者がおるのか？
シャイロック	おや。おはようございます、スノウ様。賢者様がお迎えに来てくれましたよ。
スノウ	なんと！賢者はなんていい子なんじゃ。
	ほれ、こっちに寄るがいい。我が抱っこしてやろう！
晶	わっ、スノウ……！あはは、くすぐったい！
スノウ	そなたは本当に可愛い、いい子じゃのう！我の自慢の賢者じゃー……。
晶	あ、寝ちゃった……。
`},
{id:10534,title:"おまじない",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	……痛っ。
スノウ	賢者よ。どうかしたか？
晶	あ、いえ。紙で指を切ってしまって。これ地味に痛いんですよね。
スノウ	なんと、そなたのか弱い指先が……。この本は罪深いことをしたのう。
晶	あはは、大げさですよ。これくらい放って置けば治るので大丈夫です。
スノウ	むむ、軽く見てはいかんぞ。指を出すのじゃ。
	《ノスコムニア》
晶	（すごい、一瞬で傷口がふさがった……！）
	スノウ、ありがとうございます！本当に魔法って便利ですね。
スノウ	ほほほ、このくらいなんてことないわい。仕上げにまじないをかけてやろう。
	前の賢者が教えてくれたものじゃ。
	痛いの痛いの、飛んでいけー！
`},
{id:10535,title:"得意な魔法",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	スノウ。何をしているんですか？
スノウ	賢者か。ちょうど良いところへ来た。
	予知の魔法の鍛錬をしておったのじゃ。そこへ座るが良い。
晶	予知の魔法の鍛錬……。
	予言は降ってくるものだって聞きましたけど、やっぱり練習は必要なんですね。
スノウ	ほほほ。どのような技術も常に鍛え、更新せねば、古く鈍ってしまうものじゃ。
	さあ、何を使って占おうかの。
~~~~~~~~~	~~~~~~~~~
選択	カード
スノウ	よかろう。このカードの中から一枚選ぶと良い。
晶	えーっと……、じゃあ、これで！
スノウ	ほう、マナ石のカードじゃな。命と力、その継承や終わりを意味する。
	ざっくり言えば、おぬしの力を必要とする者へ手を貸してやるのが吉、ということかの。
~~~~~~~~~	~~~~~~~~~
選択	水晶
スノウ	よかろう。この水晶を覗き込んでみるのじゃ。何が見えるかの？
晶	えーっと……、なにかもやもやしているような……。
	でも、その奥が光ってるみたいです！
スノウ	ほう、霧か雲か……。
	おぬしか、またはそばにおる者が、なにか悩みを抱えているようじゃ。
	しかし、光が見えたのなら、おぬしの手腕次第で問題を晴らすことは難しくないじゃろう。
~~~~~~~~~	~~~~~~~~~
選択	星廻り
スノウ	よかろう。
	賢者の運勢は、〈大いなる厄災〉と他の星々との位置を観ることになっておる。
	雪の星の動きは未だ騒がしい。
	トラブルの起きやすい配置から、厄災はそれを見守る距離におる。
晶	つまり……。
スノウ	身近で揉め事が起こりやすいが、おぬしが解決へ導くという暗示かの。
~~~~~~~~~	~~~~~~~~~
スノウ	とても良い結果じゃ。
	賢者よ。今からおぬしはこの菓子の缶を持って、ホワイトの部屋を訪れるが良い。
	そして、我の代わりにホワイトを午後のお茶に誘い、３人でおやつにするのじゃ！
晶	……もしかして、スノウ、ホワイトと喧嘩しちゃったんですか？
スノウ	喧嘩ではない。喧嘩ではないが、おぬしの説得が必要な事態なのじゃ。
`},
{id:10536,title:"ラブレターの宛先",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	昔、気まぐれに数年ほど大人の姿で過ごしていたことがあったのじゃ。
	麗しい我らにみな夢中じゃったが、その中でも特に熱烈なラブレターをくれた町娘がおってのう。
晶	ラブレター！大きいスノウって格好いいですからね。
スノウ	我も悪い気はせんかったが、
	その町娘、我ら双子を見分けることが出来んかったようでの。
	ホワイト宛の手紙を我に渡してきたのじゃ。
晶	そ、それは……反応に困りますね。
スノウ	きちんとお断りはした。しかし、気持ちを無下にするのも可哀想じゃったからの。
	お詫びのプレゼントも渡しておいたぞ。
晶	えっ、スノウが……？
	その子にホワイトと間違えてることを教えてあげなかったんですか。
スノウ	我らは二人でひとりじゃからな。どっちが返しても同じようなものじゃろう。
晶	（なんて罪作りな魔法使い……！）
`},
{id:10537,title:"紋章",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	スノウの賢者の紋章は、首筋にあるんですね。
スノウ	うむ。我は右側、ホワイトは左側じゃ。
	元はひとつずつ紋章がついておったが、ホワイトが死んだ時に、模様が半分ずつになってしもうた。
	きっと、我の力や命も、半分になったということじゃの。
晶	…………。
スノウ	いちいち悲しい顔をして。そなたは優しい良い子じゃのう。
	我は悲しんでいるわけではない。お揃いも好きじゃが、半分こも大好きじゃからの。
晶	スノウ……。
スノウ	ほれほれ、暗い気分はおしまいじゃ。
	我の頭を撫でるか、我がそなたを撫でるか、どちらが良いか申してみよ。
晶	両方で……。
スノウ	ほほ、欲張りで可愛いのう。この半分になった紋章も、我の欲張りの結果じゃ。
	我とそなたもお揃いじゃな。
`},
{id:10538,title:"食べ過ぎ注意",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	スノウ。夕食ができたみたいですよ。
スノウ	なんと、もうそんな時間か？
晶	はい。今夜はシチューらしいですよ。キッチンからとてもいい匂いがしていました！
スノウ	むむ、シチューか。美味そうじゃのう……。
晶	あれ、難しい顔ですね。もしかしてまだお腹空いてませんか？
スノウ	うむ。実は、アフタヌーンティーでおやつを食べ過ぎてしまってのう。
	ホワイトと分けっこしているはずなのじゃが、弾む話の手元に美味しい菓子があると、ほら。ついつい手が伸びてしまうじゃろう。
晶	あはは、ちょっとわかります。俺もこっちに来てからおやつの時間が楽しいです。
	つい食べすぎてしまいますよね。
スノウ	そうじゃ。賢者と我とホワイト、3人で分けっこすればちょうどいいかもしれん。
晶	それは素敵ですね、ぜひご一緒させてください。
	スノウが食べ過ぎないよう俺も気を付けます！
スノウ	ほほほ、そうかそうか。では明日からよろしく頼むぞ。
`},
{id:10539,title:"スノウの日常",type:"personal",characters:["⑤"],memo:"スノウ",
text:`晶	スノウ、ホワイト！部屋から大きな音がしましたが、大丈夫ですか？
スノウ	おお、賢者よ。心配させてしもうたのじゃな。すまなかったのう。
	ホワイトと遊んでいたのじゃ。
	どれほど大きな姿になれるか試しておったら、ついつい大きくなりすぎてしもうた。
	今はもう、元の大きさじゃろう？
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
スノウ	本を読んだり、手慰みにカードの占いをしたりするかのう。
	されどひとりは退屈じゃ。特別な日以外は、すぐにホワイトを探しに行くじゃろうな。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
スノウ	魔法舎で暮らすようになってから、
	若い魔法使いたちが部屋に遊びに来てくれるようになったのは嬉しいのう。
	たまに北の魔法使いを呼びつけてお説教やお仕置きをしておる時もあるのじゃ。
	賢者よ、次からノックを忘れぬようにな。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
スノウ	ホワイトと共に起き、互いの身支度をして、二人で体操をするのが日課じゃ。
	あとは詳しく決めておらぬ。
	魔法舎に来てからは、毎日違う誰かと、違う遊びができて退屈せんのう。
~~~~~~~~~	~~~~~~~~~
晶	そういえば、ホワイトはどうしました？一緒じゃなかったんですか？
スノウ	いやいや、しかと、ここにおる。我が大きくなり、ホワイトは小さくなったのじゃ。
ホワイト	賢者よ、ここじゃここじゃ！
晶	ど、どこに……。あれ！？もしかしてこの、スノウの指先の棘みたいなのが……！？
スノウ	ほほほ。驚いたかの？我らの魔力、まだまだ衰えておらんのう。
`},
{id:10540,title:"男前勝負",type:"personal",characters:["スノウ","フィガロ"],memo:"スノウ",
text:`晶	わ、スノウが大きくなってる。
フィガロ	賢者様。いいところに。
大人スノウ	おお、賢者よ。よく来たの。
晶	こんにちは。スノウが大人姿でいるの珍しいですね。
大人スノウ	うむ、我は今日も実に麗しいじゃろう。
フィガロ	ねえ賢者様。きみは俺とスノウ様、どっちの方が男前だと思う？
晶	と、唐突な質問ですね。何かあったんですか？
大人スノウ	先ほどフィガロがカナリアに結婚をしないのかと聞かれていたんじゃ。
フィガロ	じゃあ、俺とスノウ様、どっちと結婚したい？って聞き返したら
	『保留でお願いします』って言われちゃってさ。
大人スノウ	賢者は我に決まっておるよな？
フィガロ	えー。優しくてかっこいい
	どこに行ってもモテモテなフィガロ先生の方がいいよね、賢者様？
晶	保留でお願いします……。
`},
{id:10541,title:"可愛いは正義",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	賢者よ、ただいま戻ったぞ。
晶	お帰りなさい、スノウ。……うわ、すごい荷物ですね！？
スノウ	我が買いに出たのは紅茶だけなんじゃがのう。中央の街の人間は実に親切じゃ。
晶	もしかしてそれ全部お土産ですか？おもちゃにお菓子に服……大量ですね。
スノウ	そうじゃ。我は街を歩いておるだけじゃが、小さな子供がお遣いをしていると勘違いされていろいろとおまけしてくれる。
	おかげでおやつには困らん。良きことじゃ。
晶	あ、そのお菓子めちゃくちゃ美味しそうですね！
	うわ、この服も……すごい高級感がある。
スノウ	まあ、我は可愛いからの。
	いろいろとあげたくなっちゃう気持ちはわかるというものじゃ。
晶	（自分の魅力をわかっている発言だ……）
スノウ	ほほほ。やはり子供の姿は得なことが多い。便利じゃのう。
`},
{id:10542,title:"特別サービス",type:"personal",characters:["⑤"],memo:"スノウ",
text:`スノウ	賢者よ。朝じゃぞ。
晶	あ、スノウ。おはようございます。
スノウ	おや、もう起きておったのか。珍しいのう。
晶	はい。早く目が覚めたんですけど、この芸術的な寝癖をどうしようかと悩んでいて。
スノウ	ほほほ、確かに鳥の巣のようじゃ！どれ、我が綺麗に直してやろう。
晶	えっ、そんな悪いですよ。もうすぐ朝食の時間なのに。
スノウ	遠慮するでない。我は器用なんじゃぞ。このくらい朝飯前じゃ！
晶	すごい……！俺じゃないみたいだ。ありがとうございます、スノウ！
スノウ	さすがは我じゃな。
	いつになく完璧な身支度を整えたそなたに、今日は特別サービスじゃ！
`},
{id:10543,title:"北の魔法使いたちのお風呂事情",type:"personal",characters:["北"],memo:"スノウ",
text:`スノウ	まったく、おぬしらは。あれだけ毎日言って聞かせておるのに！
ホワイト	どれだけ勝手をすれば気が済むのじゃ。ちょっとは我らの言うことを聞かぬか！
晶	（スノウとホワイト、いつになく真剣に怒ってるみたい……。どうしたんだろう）
ブラッドリー	こいつが勝手に水なんか足すからだろ。俺はぬるい風呂は嫌いなんだよ。
ミスラ	俺は湯を適温にしたいだけです。茹で上がりたいならひとりでやってくださいよ。
オーエン	ほんとうるさくて最悪、入浴のときくらい静かにできないの？
	別の時間にすればよかった。
ホワイト	オーエンよ、ひとりだけ被害者面をするでない。
	おぬしが湯船に入れた妙な液体も大概じゃぞ。
スノウ	まったくとんでもない困ったちゃんばかりじゃ！
	お湯が紫色になってしまったしのう。なんかどろどろしてるし、泡立ってるし！
晶	（お風呂場で鉢合わせしちゃったみたいだな……）
`},
//ホワイト
{id:10601,title:"スポットの印象（１）",type:"personal",characters:["オーエン"],memo:"ホワイト",
text:`オーエン	何だか気の抜けた街だね。
晶	そ、そうでしょうか……？寒さが厳しくて暮らすのが大変そうですけど。
オーエン	そんなの人間だけだし。北の国ならどこも同じだよ。
	この街は双子の庇護に慣れきって安心してる。
	双子に逆らわず暮らしていれば、生きていけるって思ってるんだ。
	生活に余裕があるわけじゃないけど、悪意が育たなそうで、退屈だよ。
	そろそろ双子が、街を変えようと相談してるって噂を流してこようかな。
晶	そ、そんな……。やめてあげてください……。
	やっと見つけた安全な街かもしれないのに。
オーエン	北の国に安心して暮らせる場所なんてないよ。双子だって昔みたいには強くない。
	人間たちに目隠しして騙してるだけさ。
	もしかして、この街の住人たちはホワイトが死んだことも知らないんじゃないかな？
	勘づいていても、尋ねにくいのかもしれない。
	うかつに質問なんかして、双子の機嫌を損ねたら、生きてはいけないんだもの。
晶	オーエン……。
オーエン	双子には自分たちを守ってくれる力がないって知ったら、
	この街はどうなっちゃうんだろう。
	双子が殺しあったって聞いたら、この街のやつらは動揺するかな？
	……ふふふ、楽しそう。
	本当のこと、教えてあげなきゃ。止めないでよね、賢者様。
	きみはいつも本当のことを知りたがるでしょ。
	僕は正直者。僕は良い子だよ。あとでたっぷり褒めてよね。
晶	あっ、オーエン……！……消えちゃった……。
`},
{id:10602,title:"スポットの印象（２）",type:"personal",characters:["ムル"],memo:"ホワイト",
text:`晶	ムルはキラキラしてるものが好きでしたね。雪も光ってるから好きですか？
ムル	ううん。
晶	えっ！？そうなんですね！？
ムル	ちょっとキラキラしすぎ。眩しいし、寒すぎる！
晶	そうなんだ……。ムルにとって、この街はどういう印象ですか？
ムル	文化や科学が発展しない街だよね。
	北の国はそういう場所が多いけど、スノウとホワイトが庇護する街は特にそう。
晶	特にって、どうしてですか？
ムル	だって、あの双子がいれば、それで済むんだもん。
	食べるものがなくなったらスノウ様！
	凍え死にそうになったらホワイト様！
	どうか、か弱い私たちを助けてください！
	そう言っていれば、助けてくれる。
	だからスノウとホワイトが暮らす街はいつも、人間たちが努力をしない街になる。
	努力をしたとしても、双子の機嫌をとることや、双子から愛されることに一極化していく。
晶	……優しくしているだけじゃ、街の人のためにはならないってことでしょうか……。
ムル	それはそうだろうけど、スノウとホワイトには関係ないことだよ！
	俺にとっても面白みがない。でも、双子にとってはどんどん暮らしやすいようになってくから、暮らしやすい街じゃない？
`},
{id:10603,title:"スポットの印象（３）",type:"personal",characters:["オズ"],memo:"ホワイト",
text:`晶	オズも氷の街に来たことがあるんですか？
オズ	アーサーがこの街を気に入っていた。
	もとより、双子も住処に人を招いたり、招かれたりするのが好きだった。
	頼まれて、何度か訪れた。
晶	オズ自身はどう思っていますか？
オズ	人間との距離が近い。双子は人が好きなのだろうと感じる街だ。
晶	近い、ですか。街の人たちは神様みたいにスノウとホワイトを敬っていて、
	二人も気まぐれに構う感じですけど……。
	それでも距離が近いなって思いますか？
オズ	ああ。
晶	そうなんですね……。
	もしかして、オズって、本来なら人間には全然構ったりしたくないタイプなんですか？
オズ	できるならば。
晶	……そ、そうだったんだ……。
	すみませんなんか、いつも俺に付き合わせてしまって……。
オズ	…………。いや……。
	おまえのことではない。
晶	でも………。
オズ	…………。
	……双子はいつも、住処の近くにマーシアの木を植える。
	双子と出会った時、初めて連れて来られた家でも見た記憶がある。
晶	（世間話を振って構ってくれてる……）
`},
{id:10604,title:"ブレイクタイム（１）",type:"personal",characters:["オズ","ホワイト"],memo:"ホワイト",
text:`ホワイト	賢者ちゃん！賢者ちゃん……！！ちょっと、ちょっとこっち来て！！
晶	ホワイト！？ど、どうしました？そんなに慌てて……。
ホワイト	オズが……。
ホワイトが震える指で示した方向には、オズが立っていた。
その先には、何人かの街の子供がいて、各々が一生懸命、オズに何か話しかけている。
晶	子供達から一度に話しかけられて、ちょっと困ってるみたいですね……？
ホワイト	ほほほ。この光景を見てそのように申すとは。そなたの意見はいつも新鮮じゃな。
	オズが自主的に街の子供に構ったのじゃ。
	絡まれたとも取れるが、怒ることもせずに、戯れるのを見守っておる。
	あやつも変わったのう……。
	我など、一瞬殺してしまわぬものかと、ヒヤヒヤしてしもうた。
晶	オズはそんなに怖かったんですか？
	魔力が強いのはわかる気がしますが、俺はまだ、ちょっと信じられないです。
ホワイト	オズに会ってなお、そのような言葉が聞ける事こそ、我らには信じられぬことじゃ。
	昔のオズほどやんちゃな者は、後にも先にもおらぬ。
	長く生きればこのような日も来るものじゃな……。
	アッ！我ったら、もう死んでるじゃん！たまにうっかり忘れちゃうんだよね～。
	ほほほ、ほほほ……。
晶	…………。
ホワイト	あれ？面白くなかった？
晶	あっ。冗談だったんですね、今の……。
`},
{id:10605,title:"ブレイクタイム（２）",type:"personal",characters:["ミスラ"],memo:"ホワイト",
text:`ミスラ	あれ、賢者様。
晶	わっ、ミスラ。今、そこの民家から出てきましたよね。
	氷の街に知り合いがいたんですか？
ミスラ	いえ、他人ですけど。
晶	えっ……。何してたんですか？
ミスラ	別に。腹が減ったんで、何か食べさせてくださいって頼んだんです。
晶	レストランには見えなかったけど……。食べさせてもらえました？
ミスラ	もらえましたよ。ギリギリのラインを攻めました。
晶	ギ、ギリギリのラインって……？
ミスラ	スノウやホワイトが怒って出てこない程度に圧をかけたんです。
	この街、良いですね。
	双子が人間たちをよく躾けているから、名乗ったらすぐに俺だと分かったみたいです。
	殺されるくらいなら、大人しくいうことを聞いた方がいいと教えられているんでしょうね。
晶	だ、だめですよ、そんなの……。カツアゲというか、強盗というか……。
ミスラ	あはは。なんですか？それ。
	あなたにもご馳走しますから、双子には言わないでくださいよ。
	何か食べたいものありますか？賢者様。
`},
{id:10606,title:"スポットの思い出（１）",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	この街に引っ越してきたときの忘れられない思い出とかってありますか？
ホワイト	そうじゃのう。色々あったが……。
	いつも住処を変えるときには、人間の居らぬ場所に、ひっそりと屋敷を構えるのじゃ。
	しばらくすれば、どこからともなく人間たちがやってきて、我らの家の近くで暮らし始める。
	それが村となり、街となる。
	氷の街は、他の場所よりも、街の形を成すのが早かったが……。
	それまでの間は、スノウと二人きりの時間を楽しむのが、いわば恒例での。
晶	いいですね。気心の知れた家族とのんびりできるって。
ホワイト	うむ。
	しかしな、我はすでに亡霊となった後じゃ。
	昔のような甘美な時間を、長くは過ごせぬようになっておった。
	「二人と言うて、所詮はそなたひとりじゃしの」
	……といった感じの嫌味が、ついつい口を衝いて出てしもうてのう。
晶	あ……、あああああ……。
ホワイト	そのような空気に耐えかねたスノウは、
	オズやフィガロをしきりに屋敷へ招待したがったものじゃ。
	「こうしておると、昔を思い出すのう」などと、スノウがのたまった食卓の、オズとフィガロの興醒めしきった顔……。
	ほほほ。忘れえぬ思い出じゃな。
`},
{id:10607,title:"スポットの思い出（２）",type:"personal",characters:["スノウ"],memo:"ホワイト",
text:`スノウ	たしか、この家の先祖にあたる者が、氷の街の住人第一号だったのじゃ。
晶	他の家より少し大きな家ですね。
	やっぱり、そういう人が、土地の権力者になるものなんですね……。
スノウ	もともと、少しでも良い暮らしを求めて危険な旅に出るような、
	根性のある者だったとも言えるしのう。
	仲間を率いて厳しい土地を進み、定住した後もみなをまとめておったようじゃ。
	その子孫だと思えば、だいたいそうなるかの。
晶	なるほど……。
スノウ	何代前かは定かではないが、この家の赤ん坊が生まれるときに、
	守護と祝福を込めたナイフを授けた事がある。
	人間にとっては、ずいぶん昔の話じゃろうに、まだ大事にして持っておるようでな。
	いじらしいことじゃ。
晶	この家の家宝になっていそうですね……。
	たとえば、赤ちゃんが、スノウの見た目を越えるほど育って、大人になって、年を取って……。
	その子供がまた育って、老いていくのを、繰り返し見ているのって、どんな気持ちなんですか？
スノウ	ふむ。どんなとな？そうじゃのう……。
	花が散り、種が芽吹き、蕾をつけ、また花が咲いて散る。
	そなたがそれを見守るときと、似たような感じじゃろうな。
`},
{id:10608,title:"スポットの思い出（３）",type:"personal",characters:["アーサー"],memo:"ホワイト",
text:`アーサー	懐かしいですね。氷の街へは、何度も訪れたことがあるのです。
	街の人々が親しげで、子供用の遊び場があって、スノウ様とホワイト様のお屋敷にも面白いものがたくさんあって……。
	幼い私には新鮮で楽しい街でしたね。
晶	たしかに、北の国にしては、子供たちがのびのび暮らしている気がします。
アーサー	スノウ様とホワイト様も、子供は遊ぶことが仕事なのだと、
	よくおっしゃっていました。
	ある時、お二人のお屋敷を見たいとせがんで、スノウ様とホワイト様に、街へ連れてきていただいたことがあるのです。
	夢中になって遊んでいたのですが、私も、お二人も、うっかり、オズ様に断りを入れるのを忘れてしまって……。
晶	わあ……。オズは慌てたんじゃないですか？
アーサー	そうなのです。
	急に天候が荒れて不思議に思っていたら、怖い顔をしたオズ様が現れたので驚きました。
晶	（少し過保護に思うけど、物騒な北の国で子供が居なくなってしまう状況は、
	　俺が思うよりシビアな話かもしれないな……。）
	街の人たちも驚いたでしょうね……。スノウやホワイトはなんて？
アーサー	お二人は、オズ様がまるで熊のようだと。
晶	熊？
アーサー	熊は、自分の獲物を盗られることに、とても執着するのだと教えてくださいました。
	北の魔法使いには、そのようなところがあると。
晶	そう言われると、
	ミスラやオーエンやブラッドリーも、そんな感じがするかもしれませんね……。
	北育ちのアーサーはどうですか？
アーサー	私ですか？改めて考えたことはありませんでしたが……。
	……そうですね。
	自分の獲物を奪われた時のことを思うなら、多少は、あるかもしれません。
`},
{id:10609,title:"ホワイトへの印象（１）",type:"personal",characters:["スノウ"],memo:"ホワイト",
text:`スノウ	ホワイトの印象か？おぬしはなかなか難しいことを聞くのう。
晶	難しいですか？
スノウ	ホワイトを見ると、自分を見るようになってしまって、何を話せばいいのかわからぬ。
	我らはほとんど、互いの分身のようなものじゃからの。
晶	そういう感じなんですね……。
~~~~~~~~~	~~~~~~~~~
選択	どんなときのホワイトが一番好きですか？
スノウ	そうじゃな……。ホワイトから、我の考えとは異なった答えが返ったときかのう。
	以前は全てお揃いが嬉しかったが、今は、考えることがあまりにも同じ過ぎると、
	ホワイトを疑ってしまうのじゃ。
晶	疑う？
スノウ	うむ。ホワイトが話しているのは、全て我の幻覚なのではないかとな。
	ホワイトもきっと、本当に我が実在しているのかと悩んでおるじゃろう。
	それまで、なにもかも一緒だったがゆえ、どこからどこまでが己であるのか、もはや、双方が曖昧としてわからぬ。
	あやつの魂を繋ぎ止めたつもりで、この魂を分けただけなのではないかとな。
	疑ってしまうのじゃ。
~~~~~~~~~	~~~~~~~~~
選択	苦手なところはありますか？
スノウ	そうじゃのう……。以前は少しだけ、束縛的なところが苦手であったかのう。
	自由を許してはくれない雰囲気があった。互いの相違を嫌忌しておった。
	じゃが、今は我がホワイトを縛っておかねば、どこかに行ってしまいそうで不安じゃ。
	我が、居なくなっていいと思えば、ホワイトは二度とは戻らぬ。
晶	……。
スノウ	我ながら、笑えぬほどに勝手な話じゃな。
~~~~~~~~~	~~~~~~~~~
選択	一緒にいて楽しいことはなんですか？
スノウ	新しく、面白い遊びを思いついたときかのう。
	じゃが、ずっと二人だけでいると、我らにしか理解できない遊びや、冗談が増えてしまうんじゃ。
	したがって、本当に面白いのかは分からぬ。
	……と、思っておったが……。
	興味や価値観が同じ過ぎても不安での。
	たまにみなに披露して、滑るくらいがちょうど良いのじゃろうな。
`},
{id:10610,title:"ホワイトへの印象（２）",type:"personal",characters:["ミスラ"],memo:"ホワイト",
text:`晶	ミスラは双子との付き合いが長いんですよね。
	ホワイトが死んでしまってから、変わったなって思うところはありますか？
ミスラ	魔力は明らかに落ちてますね。
	ホワイトの魂を繋ぎ止めているせいか、半分よりもっと弱くなったんじゃないですか。
晶	なるほど……。ミスラは誰かの魂を、繋ぎ止めたいと思ったことはないですか？
ミスラ	思ったとして、誰にでもできることじゃないでしょ。
晶	そうなんですか？ミスラほど、魔力が強くても？
ミスラ	あれは、あの二人が双子で、二千年以上ずっと一緒に生きてたからできたんですよ。
	魂から互いの半身だったからこその魔法です。
	俺が今から誰かと一緒に二千年生きても、あの二人ほどに魂を繋げることが出来るとは思えない。
	孤独に生きてる俺の魂を誰も繋ぎ止められないのと同じように、俺も、誰の魂も繋ぎ止められません。
	でも、それが普通でしょう。
	賢者様は誰かと魂を繋げて、繋ぎ止めたことがあるんですか？
晶	な、ないです……。
ミスラ	それが普通ですよ。
	俺もあなたも、どこまで行ったって別々の生き物です。
	俺の死があなたの死ではないように……。
	あの双子の死も、別々だったはずなんです。
	普通でないことをしてのけているから、薄気味悪いんですよね。
`},
{id:10611,title:"ホワイトへの印象（３）",type:"personal",characters:["オーエン"],memo:"ホワイト",
text:`オーエン	双子には何度かやられたことがある。
	昔から、悪いことをやり過ぎるとどこからか聞きつけてお仕置きしにくるんだ。
	僕に言わせれば、ただの気まぐれの憂さ晴らしさ。
	きみは思い通り騙されてるみたいだけど。
晶	スノウとホワイトは、俺を騙したりなんて……。
オーエン	ほらね。ふふ、笑っちゃう。
	ホワイトが死んでいい気味だけど、迷惑も被った。
	あいつが石になったのと入れ替わりに、僕が賢者の魔法使いに選ばれたんだ。
晶	死んだホワイトの代わりに、オーエンが召喚されたってことですか？
オーエン	そうさ。双子の片割れがついに死んだっていうから喜んだのに、
	普通に居残ってるからムカついた。
	他の国は四人なのに、北だけ五人も居るなんて変だろ。
	北の魔法使いが弱そうに見えるじゃない。
晶	そういうの、案外気にするんですね？
オーエン	誤解されたら嫌じゃない？
	他の国は四人で出来ることを、北の魔法使いは五人も必要なのかなんて思われたらさ。
	考えるだけでも腹が立つ。
	わざわざ僕が出向いてるんだから、せめて、ホワイトはちゃんと死んでろよって思うよ。
`},
{id:10612,title:"ホワイトへの印象（４）",type:"personal",characters:["ブラッドリー"],memo:"ホワイト",
text:`ブラッドリー	盗賊団をやってたからな。強い魔法使いの情報収集は常にしてたんだ。
	北の双子って言えば有名で、噂もよく耳に入ったぜ。
晶	二人は長生きですし、目立つのもなんだかわかる気がします。
	どんな噂があったんですか？
ブラッドリー	人間の味方もするが、所詮は北の魔法使いで気まぐれだってよ。
	悪さも度が過ぎればあいつらが出てくるってんで、北のやつらはみんな厄介に感じてたさ。
	いつでも双子が、双子が、って言われてて、区別して考えたことなんてなかったが、実際会ってみりゃ、案外違うもんだよな。
晶	ブラッドリーは二人の区別がつくんですね。初めて会った時からですか？
ブラッドリー	まあ、死んでからの方が顕著だけどよ。
	スノウの方が窮屈そうだよな。ホワイトの方が好きなこと言うだろ。
	ホワイトは好き勝手やって、スノウは気ぃ使ってなだめたりしてるのをよく見るぜ。
	手に掛けたくねえ相手に手を掛けちまうと、こういう目に遭うもんかと思うよな。
晶	なるほど……。魂を繋ぎ止めていることについては、どう思っていますか？
ブラッドリー	俺がホワイトならまっぴらごめんだ。
	だが、俺がスノウなら、同じことをするかもしれねえな。
`},
{id:10613,title:"ホワイトへの印象（５）",type:"personal",characters:["オズ"],memo:"ホワイト",
text:`晶	スノウとホワイトは、オズの魔法のお師匠様なんですよね。
	ホワイトのこと、どう思っているんですか？
オズ	…………。
	ホワイトが死ぬまでは、どちらがどうだということはなかった。
	だが、片方が死んでからは、わずかに差異が出てきたように思う。
晶	二人の差ですか？どんなところが違うんですか？
オズ	……どこが、とは、言葉にしにくいが……。
	おまえたちのしでかしたことは本当に愚かで馬鹿らしいと、二人に告げたとき……。
	スノウは不機嫌になり、ホワイトは苦笑いをした。
	生まれて初めて、双子が反応を違えたのを見て、ぞっとしたことを覚えている。
晶	ぞっと……？
オズ	あの双子でさえ、殺し合えば、互いの何かは変質し、
	二度と戻らないのだということに。
ぞっとしたというには、その横顔に恐怖は浮かんでいなかった。オズは続けて独り言のように呟いた。
オズ	私が何をしたとしても……。
	思い通りにならない出来事や、煩わしいもの、不愉快なものは、未来永劫、この世から無くならない。
晶	オズ……。
オズ	あの時スノウがひとりで何処かに行きたいと言った気持ちを、私は理解できた。
	ひとりで何処かに行くというのなら、この手で石にしてしまおうという気持ちも、
	今は……。
`},
{id:10614,title:"ホワイトへの印象（６）",type:"personal",characters:["フィガロ"],memo:"ホワイト",
text:`晶	スノウとホワイトは、フィガロの魔法のお師匠様なんですよね。
	ホワイトのこと、どう思っているんですか？
フィガロ	賢者様だから正直に話すけど、愚かなひとだなと思ってるよ。
	だってね、自由になりたがったスノウ様を、おまえを殺して自分も死ぬだなんて言って引き止めようとしたんだよ？
~~~~~~~~~	~~~~~~~~~
選択	それは……。
フィガロ	俺は誰かに一生縛り付けられるなんて嫌だし、一緒に居て欲しいって言ったのに離れようとする誰かを、引き止めようとは思わない。
	誰かの心が自分にないことはどうしたって仕方のないことだよ。
	それを魔法でねじ伏せるなんてさ。
晶	確かに……、そうかもしれません。
~~~~~~~~~	~~~~~~~~~
選択	でも……。
フィガロ	俺だってやったことないんだからね。
	友達に付き合ってやってた世界征服も、本人がやめたいっていうなら無理に続けさせようとは思わなかったし。
	可愛い弟子が、すぐに自分の元から飛び立とうとする子だったとしても、行ってらっしゃいって言ったさ。
~~~~~~~~~	~~~~~~~~~
フィガロ	そこは魔法を使っちゃいけないところだろう。
	親密な相手なら尚更。魔法を使った瞬間、何もかも偽物になっちゃうじゃない。
晶	偽物に……。
フィガロ	俺は誰かに何かを求めるときに、そんな風にはやってこなかった。
	それだけは、俺の矜持としてある。
	だからホワイト様は愚かだけど、手加減できずに殺すまでやっちゃったスノウ様も、愚かだ。
	俺はああはなりたくないね。力でも、魔法でもなく、心で誰かとつながり合いたい。
晶	南の魔法使いらしく？
フィガロ	その通りさ。
	誰かの望みが俺の望みになって、俺の望みが誰かの望みになることを、手に入れたいと思ってるんだよ。
	石になるまでにね。
`},
{id:10615,title:"スポットゆかりの話（１）",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	氷の街には、スノウとホワイトの家があるんですよね。
	この街に移り住んだのには、何かきっかけがあったんですか？
ホワイト	ほほほ。我らが街に移り住んだのではない。
	我らが移り住む場所が街になったのじゃ。
	きっかけというなら、前に暮らしていた場所が不自由になったからじゃな。
	同じ場所に百年や二百年も住み続けると、寄ってくるものが増えすぎての。
	増えすぎれば、不自由になる。
	ここに住処を決めたのは、氷の森の近くであったこと。
	見晴らしの良い景色が気に入ったことかのう。
晶	そうなんですね……。
~~~~~~~~~	~~~~~~~~~
選択	この街にはいつまで住んでいるんですか？
ホワイト	ここも、我らが不自由になるまでじゃ。
	世界のどこに行っても、人の数が多くなってきたからのう。
	この街ももうすぐ、定員オーバーというやつじゃろう。
	世界の文化や技術は向上し、魔法使いに頼らず暮らす土地もある。
	ならば、北の国に住むものも、我らの手を借りず勝手に生きれば良い。
	そうなれば、我らも不自由になることなく、
	ひとところに留まって暮らせるじゃろうな。
~~~~~~~~~	~~~~~~~~~
選択	他に気に入った土地はありましたか？
ホワイト	我ではなく、スノウが気に入っておった土地があったのう。
	西の国との境の山脈のそばじゃ。
	あやつめ、一度くらいは山脈を飛び越えて、西の国に住まってみたかったんじゃな。
	西の国の文化は昔から新鮮で、苛烈で、刺激的じゃった。
	我はスノウがそれに触れて変わってしまうのが怖かった。
	そうとは告げぬままに、北の国の奥の奥、氷の森の近くで
	暮らしたいと、ねだったことがあったのう。
`},
{id:10616,title:"スポットゆかりの話（２）",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`ホワイト	この通りは、この街の市場になっておるのじゃ。
晶	本当だ。みなさん、店舗を構えてるわけじゃなくて、
	屋台みたいにお店を出してるんですね。
ホワイト	ほほほ。この街に比べれば、そなたの暮らす魔法舎辺りは、
	ずいぶんと都会じゃからのう。
	珍しいものも多いじゃろう。
	野菜や魚が凍ったまま売られているのを見るのも初めてかの。
晶	わっ……！
	全部カチカチに凍って積まれてる！魔法で凍らせているんですか？
ホワイト	外に置いておくと勝手に凍るのじゃ。
	魚など、湖で釣り上げて、傍に置けば数分で氷と変わらぬようになる。
	食料が手に入りさえすれば、冬の間も長く保存しておける。
	北の国はそこが便利じゃな。
晶	肉用の鳥や動物も、獲ったままを凍らせて売っているんですね……。
	お店の人達はずっと外に出ていて、寒くないんでしょうか？
ホワイト	みな動物の毛皮を着ておるからの。
	動物の毛や皮は外でも凍らず暖かいのじゃ。羊の毛も重宝しておるぞ。
晶	なるほど……。
	ブーツも毛皮で覆われてますもんね。俺の世界にあっても値が張りそう……。
	（俺はいつも魔法で寒さから守ってもらってるけど、人間が暮らすのは本当に大変そうな土地だなあ……）
`},
{id:10617,title:"北の国について",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`ホワイト	こうして戻ってみると、やはり、北の国が一番暮らしやすいと感じるのう。
	人間たちにとっても、この国の暮らしこそ、自然で良い形にあるように思えるのじゃ。
晶	北の国の暮らしが、人間にとっても自然、ですか……？
ホワイト	うむ。北スタイルとでも言うのかの。大昔は世界中が北スタイルで暮らしておった。
	人間には生きにくい場所で暮らすため、魔法使いに庇護してほしいと言うのなら、引き受けぬこともない。
	しかし、タダでというわけにもいかぬ。
	我らの守護の対価として、我らの生活を豊かにする労力を払って買う。
晶	持ちつ持たれつで、という感じでしょうか。
ホワイト	そういうことじゃ。
	我らの方が多く持つ分、多少の我が儘は通すかも知れぬが、なにも、親に子を殺せと無理を言うわけでもない。
	そのような者に当たったならば、逃げ出して、また別の者に庇護を求めれば良い。
	我らのような、善良な魔法使いの。
晶	北の国以外の暮らし方は、どうして、変わっていってしまったんでしょうか？
ホワイト	世界中にいた強い魔法使いたちの多くはオズに石にされた。
	その後オズ自身は北の国の奥深くで、長い間引きこもっていたからのう。
	人間たちにとって、魔法使いの力が脅威で無くなってしまうのは、仕方のないことなのかもしれん。
	反して、この数百年の間、人間の数は増えすぎておる。
	このままでは、いつか、魔法使いは滅びてしまうじゃろうな。
`},
{id:10618,title:"〈大いなる厄災〉について",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`ホワイト	厄災とも、長い付き合いになったのう。
	いつかの昔、我ら双子だけで〈大いなる厄災〉を追い返した話、そなたにしたことがあったかのう？
晶	え！？
	スノウとホワイトだけで、厄災と戦って勝ったってことですか？
ホワイト	さよう。ほほほ、反応が良くてらしいのう。
晶	それって、今までの厄災には、大した力がなかったというか……、追い返すのって結構簡単だったんですか？
ホワイト	そうではない！
	我らがめちゃ強かっただけで、厄災も毎年そこそこ頑張っておったぞ！
	あれは我らが、バリバリの現役真っ只中だった青春時代……。
	育てていた弟子が調子に乗り始めたゆえ、師の威厳を示すためにイキったのじゃ。
晶	弟子って、オズとフィガロのことですよね。二人も驚いていましたか？
ホワイト	もちろんじゃ。我らの強さにちょっと引いておったほどじゃ。
	〈大いなる厄災〉を追い返す仕事も、いつしか当たり前になってしもうたが、この度の厄災は本物の脅威であった。
	今までは均衡が保てておったように思うが、バランスが崩壊すれば、全て物事は悪くなるものじゃ。
	我とスノウも然り、賢者と賢者の魔法使いも然り。
晶	俺とみなさんのバランスですか？
ホワイト	うむ。ほほほ。心配するでない。そなたは良い子じゃ。
	次の戦いでの活躍を期待しておるぞ。
`},
{id:10619,title:"スポットの人々",type:"personal",characters:["ブラッドリー"],memo:"ホワイト",
text:`晶	ブラッドリー。街の人と話をしていたんですか？
ブラッドリー	はっ。人間と話すことなんかねえよ。
	ここでは特にな。どいつもこいつも飼い慣らされて、腑抜けてやがる。そうだろ！？
氷の街の住人	ひいっ……！
晶	ブ、ブラッドリー！脅かしちゃだめですって……！
ブラッドリー	相手が魔法使いだろうが双子だろうが、
	てめえら人間にしかできねえことがあるだろうが。
	対等な相手だと思って取引きして、少しでも自分に利があるように駆引きをしろよ。
	俺が面倒みてやってた人間たちはみんなそういうやつらだったぜ。
氷の街の住人	そんな、滅相もありません……。
	スノウ様やホワイト様に逆らっては、私たちは生きてはいけません……。
ブラッドリー	もちろんてめえらなんかすぐに殺せるさ。
	だが、魔法使いにだって、不得手なもんがあるんだ。
	例えば、流通だの統治だのなんてのは、面倒臭くてやってられねえ。
	双子だって同じで、てめえらに任せきりだろ。
	てめえらを殺せば煩わしくなるんなら、取引きするには十分じゃねえか。
晶・氷の街の住人	…………。
ブラッドリー	大家族の子供みてえに、いい大人が、スノウ様、ホワイト様って。
	双子はてめえらの親じゃねえんだぞ。
	あいつらにそんな情なんざねえんだ。騙されて、いいように使われてんじゃねえよ。
氷の街の住人	あのお二人が私たちを騙すなど……。
	お二人は、本当にお優しくて、長きの間、街のものたちを見守ってくださっております。
ブラッドリー	かあ〜っ！これだからよ！
	双子だってなにがしかの恩恵があるから、この街で暮らしてんだろうが。
	ひとつでいい。
	あいつらがなくなって困るもんを知っておけ。てめえらは、もう持ってるはずだぜ。
`},
{id:10620,title:"スポットにいた魔法使い",type:"personal",characters:["クロエ"],memo:"ホワイト",
text:`クロエ	賢者様！さっきそこで、氷の街に住んでる魔法使いに会ったんだよ！
晶	魔法使いに？
	スノウとホワイト以外にも、この街に住んでいる魔法使いが居るんですね。
クロエ	双子に街の管理を任されてるんだって。
	俺、勝手に入ってきた部外者だと思われちゃったらしくって……。
	怖い顔で凄まれたんだけど、スノウとホワイトが知らない間に、気配を残してくれたみたいなんだ。
	出かける前にハグしてくれた時かなあ？
	とにかく、俺から双子の気配がするからって納得してくれたよ。
晶	そんなことがあったんですね。マーキングみたいな感じでしょうか。
	俺にも付けてくれてるのかな……。
クロエ	たぶんあると思う！この街には、他にも何人か魔法使いが住んでるみたいだね。
	スノウとホワイトの留守を預かって、見回りしたり、人間たちのトラブルを管理してるんだって教えてくれたよ。
晶	なるほど……。
	双子の手が届かない部分は、その人たちに任せてるってことでしょうか。
クロエ	そうなのかな。スノウとホワイトの手を煩わせないためだって言ってたけど……。
	もしかすると双子は、人間たちだけじゃなく、北の国ではひとりで生きていけない魔法使いの面倒も見てあげてるのかもしれないね。
	俺の生まれた街の、元締めの手下たちと、ちょっとだけ似てる雰囲気だったかな。
`},
{id:10621,title:"危険な場所",type:"personal",characters:["ミスラ"],memo:"ホワイト",
text:`ミスラ	今からこの街で一番危険な場所に行くんですけど、あなたも一緒に来ませんか？
晶	は……。え！？危険な場所って、どこですか？
ミスラ	双子の屋敷です。
	あなたが一緒なら、見つかって酷い目に遭うのも、手加減してくれそうですし。
晶	双子の屋敷って、スノウとホワイトの家ってことですよね。行ってみたいんですか？
ミスラ	はい。欲しいものがいっぱいあるんで。
	昔、一度だけ住処に招かれたことがあります。一見、普通の家なんですけどね。
	なんだか、色々歪んでるのを感じました。
晶	歪んでるって？
ミスラ	どこかに繋がっていそうな扉だとか。禍々しい魔力を纏った箱だとか。
	何か飼っているような気配だとか。
	双子は長生きですからね。
	世界の力の均衡に影響を与えるものを、たくさん隠し持っているって話ですよ。
	魔法使いや人間の手に渡ると危ないと思ったものは、
	自分たちで管理しているみたいですし。
晶	たしかに、そんな怖そうなものを、
	スノウとホワイトが持っていてくれると安心できるかも……。
ミスラ	安心？オズを簡単に封じられるような魔道具を持っている可能性もあるんですよ。
	誰の手にあっても脅威でしかないです。一刻も早く奪わないと。
晶	可能性の話ですよね？泥棒に入るのはちょっと……。
ミスラ	絶対にありますよ。
	オズやフィガロが大人しくあの二人のいうことを聞いていたんですから。
	さ、行きましょう、賢者様。俺と二人で、世界の均衡を覆してみましょうよ。
`},
{id:10622,title:"ホワイトの評判",type:"personal",characters:["ラスティカ"],memo:"ホワイト",
text:`氷の街の住人	スノウ様とホワイト様は、本当にお優しく、慈悲深くいらっしゃって、
	街のものはみな、心から感謝しております。
	子供の頃は遊び相手として、大人になってからは相談相手として、年を取ってからは孫のように接してくださって。
	畏敬の念を抱くけれど、可愛らしい守り神のようでもあると、長い歴史の言い伝えに違わぬお方です。
ラスティカ	素敵な関係だ。
	スノウ様とホワイト様が街のみなを愛し、また、街のみなに愛されているんですね。
晶	そうですね。スノウとホワイトは元々人懐っこいですが、
	この街のことも、とても気に入ってるように思います。
ラスティカ	人々に困難があるたびに、手を差し伸べていたのでしょう。
	誰かの喜ぶ顔を見られるというのは、不思議と、自分自身の喜びになりますから。
氷の街の住人	おっしゃる通りです。
	道が岩に閉ざされていれば取り除いてくださり、寒さが酷い年は絶えない炎を灯してくださる。
	お二人が居なくては、このような場所で、良い暮らしをすることはできません。
	心から感謝しております。
	最近、お二人がこの街を去ってしまうという噂を耳にしました。
	見捨てられることを案じて、街には定期的に、不敬な噂が立つのです。
ラスティカ	かわいそうに。それはさぞかしご不安でしょうね。
	たしかに、魔法がなくては不便な土地だ。
氷の街の住人	……私は噂など信じてはおりません。
	お留守からいつ戻られてもいいように、屋敷の周りはみなで掃除をしております。
	お会いできたときには、必ず礼儀正しくと、子供達にもよくよく言って聞かせております。
晶	そういえば、みんな挨拶してくれましたね。
	スノウとホワイトの知り合いだってわかると、みなさんすごく親切にしてくれますし。
氷の街の住人	魔法使いに庇護されていると言ってはいても、
	実際にはその魔法使いの姿を見たことがない村や街もあるのだと、聞いたことがあります。
	氷の街は、そうではありません。長い時間、スノウ様とホワイト様と共にあり、本物の信頼関係を築いている街なのです。
ラスティカ	本物の信頼関係とは、素晴らしい。
	僕と賢者様のようですね。親近感を感じて、この街がもっと好きになりそうです。
`},
{id:10623,title:"スポットでの名物",type:"personal",characters:["オーエン"],memo:"ホワイト",
text:`晶	あれっ、あそこにいるのは、オーエンと……、街の人！？
オーエン	なんだよ、賢者様。血相変えて。
晶	いえ、特に何だとかはないですが、街の人に話しかけてるみたいだったので、何を話してるのかなと思って！
オーエン	話してなんかいないよ。
	だけど、こいつが突然、変なものを一生懸命振ってくるからさ。
氷の街の住人	ひ、ひいい……！
晶	あれは……、ステンドグラスで出来たオーナメントみたいな……？
オーエン	スノウとホワイトが作ったやつじゃない。
	あの双子、生きすぎて暇すぎて、手慰みにステンドグラスを作っては、人間たちに押し付けてるんだ。
氷の街の住人	スノウ様、ホワイト様、どうかお助けください。
	悪い魔法使いが立ち去るように、どうか、どうか、お二人の御加護を……。
晶	（なんだか、熊除けの鈴みたいに使ってる……？
	　もしかしたら、悪い魔法使い除けのつもりなのかもしれないな……
	　たしかに、スノウとホワイトの作ったものを持っている人間に手を出したら、あとが怖そうだし……）
オーエン	ちょっと、やめろよ。なんかむかつくんだけど。こんなもの、払い落としてやる。
氷の街の住人	ひ、ひいいい……！
晶	あっ……！？怖がりすぎて気絶しちゃった……！
オーエン	僕は何もしてないよ。
	賢者様だって見てただろ。スノウとホワイトに余計な告げ口するなよな。
晶	い、行っちゃった……。
	魔法使い除け、効いてる……。
`},
{id:10624,title:"スポットでの発見",type:"personal",characters:["ブラッドリー"],memo:"ホワイト",
text:`ブラッドリー	あ。見ろよ、賢者。スノウとホワイトのステンドグラスだ。
晶	ステンドグラス？あそこの家の窓にはまってるやつですか？
ブラッドリー	そうそう。双子が職人だなんて名乗って、趣味で作ってるだろ。
	それを人間が買ってきては、ありがたがって窓につけるのさ。
	そうすりゃ、双子の縄張りだってすぐにわかるんだよ。
	ここのは本物ってことになるだろうが、双子が大昔に見捨てた土地でも、受け継がれて残ってたりするみてえだぜ。
晶	なるほど……。
	ブラッドリーもやっぱり、ステンドグラスの窓を見つけたら、襲うのはやめておこうって思うものですか？
ブラッドリー	あー。まあ、そうかもな。
	ここで悪さすりゃ、あの双子が出てくんのかって考えれば、多少やる気が萎えるわな。
晶	凄い。ちゃんと効果あるんですね……。
ブラッドリー	おい。別にビビってるわけじゃねえぞ。
	ただ、あいつらと戦うのは、クソ面倒くせえんだよ。
	相手の弱いところを的確に、しつこくしつこく執拗に突いて来やがる。
	フィガロも同じだ。ねちっこくて鬱陶しい。
	元から双子とやりあいたけりゃ、直接本人のところに行くしな。
	大抵のやつは、あの窓の街にゃ近付かねえよ。
`},
{id:10625,title:"楽しい場所",type:"personal",characters:["スノウ","ホワイト"],memo:"ホワイト",
text:`スノウ・ホワイト	賢者よ！こっちじゃ、こっちじゃ！
晶	ここは、公園ですか？すごいですね、こんな雪深い街に公園があるなんて。
ホワイト	子供達と遊ぶために、我らが作ったのじゃ。
	魔法をかけておるゆえ、凍りつくことはない。
スノウ	前の賢者が話しておった、雪のすべり台というものもこしらえたぞ。
	我らと一緒に滑るのじゃ！
ホワイト	あちらには街のものにあつらえさせた雪の彫刻が並んでおる。
	我らと一緒に眺めようぞ！
~~~~~~~~~	~~~~~~~~~
選択	すべり台で遊ぶ。
晶	うわ！すごく高いしめちゃくちゃ長いですね！？
	すべり台っていうより、ウォータースライダーみたいな……。
スノウ	そりに乗って滑り降りるようになっておる。
	ルチルの箒に負けぬほどのスピードが出るのじゃ！
晶	あ、あの、あそこ、途中でスロープが途切れてるんですけど……。
ホワイト	うむ！滑るそりの勢いで屋根を飛び越えて、反対側に着地する仕組みじゃ。
晶	怖すぎる！？
スノウ	スリルを味わいたいときには、魔法を使わず滑るのじゃ！さあ、ゆくぞ、賢者よ！
~~~~~~~~~	~~~~~~~~~
選択	雪の彫刻を見る。
晶	大きい……！彫刻っていうから、もっと繊細なものなのかと……。
ホワイト	年に一度、街のものたちが、
	こうして巨大な雪の像を作って並べて、祭りのようなものを開いておる。
スノウ	あれは我らの彫刻じゃな。今年は耽美な感じでと、リクエストしたのじゃ。
晶	たしかに耽美な感じです……。あっ、あれは、ドラゴン？あっちはお城かな。
	よくできていますね……。
スノウ	魔法も使わずによう作るものじゃと、いつもながら感心するのう。
ホワイト	人間たちだけでこれほどできるならば、我ら、いつでも手を離せるというものじゃな。
スノウ	祭りの終わりには、我らの魔法で盛大に破壊するのが恒例じゃ。
	その時にまた、そなたを招待するとしょうかの。
`},
{id:10626,title:"マナエリア",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
ホワイト	それはきっとマナエリアのことじゃの。
	前の賢者に教えたことを覚えておる。オズや、フィガロにもな。
	マナエリアとは、精神を落ち着かせ、気力を養う場所。
	誰しもが持つ、原風景のような場所じゃ。
	魔力を司るイメージとも深く関わっておる。
	心で魔法を操る魔法使いにとっては、大切なもののひとつじゃの。
晶	魔法を使う時の感覚って、それぞれで違うものなんですね。
	ホワイトにとって……、マナエリアとはどういうものなんですか？
	魂だけだとしても、必要なんでしょうか。
ホワイト	良い質問じゃの、賢者よ。
	我ら双子のマナエリアは、穏やかな大河と雪の山脈の風景じゃ。
	マナエリアから力を得る感覚はもちろんある。
	しかし、実際に魔力をこの身に宿しておるのかはもはや我にはわからんことじゃのう……。
`},
{id:10627,title:"アミュレット",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって
	賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	ホワイトもアミュレットを持ってますか？
ホワイト	もちろんじゃ。
	我らのアミュレットはこれじゃの。スノウと一緒に使っておるものじゃ。
ホワイトは、ふわりと宙に浮くと、棚に置いていた四角いガラスケースを手に取って俺に見せてくれた。
淡く発光するケースの中には、穏やかな大河と雪の山脈の景色が映っている。
手の中で小さな窓を覗き込んでいるようだ。
晶	木々が風で揺れてるし、雲や水面が動いてる……。
	すごく綺麗ですけど、本物なんですか？
ホワイト	これは我らの作った幻影じゃな。
	特別な魔法で、北の国にある風景をケースの中に閉じ込めておるのじゃ。
	そなたが言ったように、本来は、マナエリアを思い返せるものであれば、
	どのようなものをアミュレットにしても良い。
	じゃが、強い魔力を必要としながらマナエリアを離れる時や、長くマナエリアに戻ってこれぬような時は……。
	景色そのものを手元に置くのが最適じゃろうな。
	フィガロもよくよく風来坊じゃったからの、同じ魔法を教えてやったことがある。
晶	そうなんですね。
	スノウとホワイトが強い魔力を必要としてるのはやっぱり……。
ホワイト	もちろん。我の魂をつなぎとめる魔法のことじゃ。
	ほほほ。
	アミュレットでも魔力が足りなくなったら、有給で里帰り休暇をもらおうかの。
`},
{id:10628,title:"金縛りの正体",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	うう、昨日夜更かししたせいか、異常に眠い……。少しだけベッドで横になろう。
	……すう、すう。
	……ん……？あれ……。あ、そうか、あのまま寝ちゃったんだ。
	起きないと――ってあれ！？体が、動かない……！これって金縛り！？
？？？	……よ。……じゃよ……
晶	ふ、布団の中に誰かいる……！？もしかして――。
~~~~~~~~~	~~~~~~~~~
選択	ムル！？
ホワイト	残念、不正解！正解は可愛い北の魔法使い、ホワイトじゃ。
~~~~~~~~~	~~~~~~~~~
選択	幽霊！？
ホワイト	正解じゃ！だが幽霊は幽霊でも、可愛い幽霊じゃぞ！
~~~~~~~~~	~~~~~~~~~
晶	ホワイト……！そんなところで何してるんですか！？
	あ、体が動くようになってる。
ホワイト	賢者の姿が見当たらないと思っての。
	部屋に様子を見に来たら、可愛い寝顔を浮かべているそなたを発見したのじゃ。
	ほほほ、ついでにしかけた寝起きどっきりも大成功みたいじゃな！
	目が覚めたみたいで良かったのう。
晶	どっきりというか、なんというか、普通に金縛りかと思いました。
	もうやめてくださいね……。
`},
{id:10629,title:"家族",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	ホワイトは、家族のことを覚えていますか？
ホワイト	昔々のことじゃからのう。
	会えなくなる者たちのことは、どうしても忘れていってしまうのう。
	オズやフィガロのように、ちょくちょく顔を見ておれば、昔のことも覚えておるんじゃが。
晶	二人はスノウとホワイトのお弟子さんなんでしたよね。
	一緒に暮らしていたんですか？
ホワイト	魔法の基礎を教えてやる中１３２でいることを好んでおった。
	我らがオズの住処へ遊びに行く方が多かったの。
	フィガロはあれで律義者じゃ。さみしがり屋でもある。
	たまに、我らの屋敷に顔を出してはぐうたらしておった。
晶	そうやって長く続く関係もすごくいいなって思います。
	家族って感じじゃないかもしれないですけど。
ホワイト	我ら、親の器ではない。あやつらも、子の器ではなかったんじゃろう。
	逆なら上手くいったのかもしれぬな。
	それに、我の家族はスノウがいれば十分じゃからの。
`},
{id:10630,title:"鶴の一声？",type:"personal",characters:["ホワイト","ミスラ","オーエン"],memo:"ホワイト",
text:`晶	わっ、ホワイト。珍しいですね、大人の姿で……。
ホワイト	うむ。最近、北の魔法使いたちが、調子こいて言うことを聞かなくてのう。
	この辺りでひとつ、お灸を据えてやらねばと思ったのじや。
晶	確かに、叱ったりするなら、大人の姿の方が迫力あるかもしれませんね。
ホワイト	まあ、本当は魔法を使っておるから、大人の姿の時の方が弱いまであるがの。
	単純じゃから、ハッタリに弱いのじゃ。
	これ、ミスラよ。
ミスラ	うわ……。なんですか、その格好。何か用ですか。忙しいんですが。
ホワイト	忙しいわけなかろう。話があるから、我らの部屋に来るように。
ミスラ	はあ……、嫌ですけどね……。
晶	（おとなしく部屋の方に行った……）
ホワイト	これ、オーエンや。
オーエン	うわっ。……何？
ホワイト	目を逸らすでない。話があるから、我らの部屋に来るように。
	……そうじゃそうじゃ、あちらへ。
晶	（効いてる……）
`},
{id:10631,title:"複雑な親心",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	ホワイトは昔から、フィガロを知っているんですよね。
	フィガロの子供の頃も知ってるんですか？
ホワイト	もちろんじゃ。フィガロは子供の頃から、大人のような子供じゃったがの。
晶	大人のような子供ですか。
ホワイト	太古の昔、魔法使いはまるで、神のように人に頼られておったからの。
	子供のうちから大人を庇護しておったんじゃろ。
	妙に達観した、物分りのいい子じゃった。
	我らは双子で孤独を知らんが、フィガロは孤独だけ知っとる子供じゃった。
晶	今では想像もつかないですね……。フィガロはすごく明るい人だから。
ホワイト	フィガロの明るさなぞ、水面に映った松明の火と同じじゃ。
	燃えているように見えても温度はない。
	愛やらその類を教えようとしたが……。フィガロに理解出来たのか、今でもわからん。
	孤独を知らん我らが語る愛は、
	フィガロには別の世界の食べ物の話のように、聞こえていたのかもしれん。
晶	そうなんでしょうか……。フィガロは人助けを好む、南の国の魔法使いになったのに。
ホワイト	恐ろしくて強い魔法使いではあるが、フィガロは昔から人助けは好きじゃった。
	我らには暇つぶしにしか見えんかったがの。
	しかし、今はまるで、子供返りしたように、南の魔法使いたち相手に甘えておる。
	何か思うところがあったのかもしれんの。
	その相手が我らではなかったことに、親代わりとして、嬉しく、寂しく思うがの。
`},
{id:10632,title:"究極の選択",type:"personal",characters:["スノウ","ホワイト"],memo:"ホワイト",
text:`晶	前の賢者様の人柄は賢者の書を読んでると伝わってきますが、
	スノウとホワイトから見てどんな人でしたか？
ホワイト	そうじゃのう。ちょっと空気読めなくて感じ悪いやつじゃったの。
晶・スノウ	えっ。
ホワイト	「スノウとホワイトどっちが好き？」と尋ねたら、「スノウ」と答えたのじゃ。
	それゆえ、詳しく理由を尋ねたら、「幽霊が怖いから」と言いおった。
晶	確かに……、ホワイト視点だと、空気読めなくて感じ悪いかもしれませんね。
スノウ	あったのう、そのようなことが。
	我視点でも、空気読めんやつじゃと内心思うておったぞ。
ホワイト	それで、賢者よ。
	そなた、スノウとホワイト、どちらが好きかのう……？
晶	…………。
	ホワイトですかね。
ホワイト	正解！
スノウ	だよねー！我もホワイトちゃん大好き！！ 
`},
{id:10633,title:"甘え上手",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`ホワイト	きゃー！ 熱いのじゃー！！
晶	ホワイト！？どうしたんですか！？
ホワイト	紅茶が熱すぎて舌を火傷してしまったかもしれん。冷ましたと思ったんじゃが。
	痛いのじゃ。とっても痛いのじゃ。賢者よ、治してくれんかのう。
晶	でも、俺は魔法が使えませんし……。そうだ、フィガロに診てもらいましょう！
ホワイト	嫌じゃ嫌じゃ！フィガロのところへ行くのは嫌じゃ！
	賢者のおまじないで治して欲しいのじゃ！
晶	（おまじない？もしかして……アレのことかな？）
	痛いの痛いの、飛んでいけ〜！……これのことで合ってますか？
ホワイト	まだヒリヒリするのう……。
	我の頭を撫でながらやってくれたらすぐに治ると思うんじゃが……。
晶	……わかりました。痛いの痛いの飛んでいけ〜！
ホワイト	おお！あともう一押し！次は我を抱っこしながらやるのはどうじゃ？
晶	（これはもう治っているのでは……？）
`},
{id:10634,title:"ホワイトの占い",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`ホワイト	賢者よ、ため息なんぞついてどうしたのじゃ？
晶	今日、中央の国へ出かけた時に占いをやってもらったんです。
	それが、あまりいい結果じゃなくて……。
ホワイト	ほほほ、それで落ち込んでおったのか。どれ、我がそなたを占ってやろう。
	むむむっ！……ほう、これは……。
晶	ど、どうしたんですか？やっぱり良くないことが……！
ホワイト	ほほほ。安心するのじゃ。そなたの運は、絶好調じゃ！
晶	絶好調！？でも、さっきの占いでは――……。
ホワイト	賢者よ、外を見てみるのじゃ。
晶	あ、虹だ……！雨が降っていたわけでもないのにどうして……？
ホワイト	言ったじゃろ？そなたの運は絶好調じゃと。
	人間の占い師なぞ、我から見ればみな赤子のようなもの。我の占いは絶対じゃ！
`},
{id:10635,title:"得意な魔法",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`ホワイト	賢者よ。良いところで会った。
晶	ホワイト。何かご用ですか？
ホワイト	予言が降りてきたのじゃ。
	しかし、大したものではない。耳に入れるかどうか、おぬしが決めてよい。
晶	予言って……。たしか、スノウとホワイトの予言は絶対当たるんですよね。
ホワイト	うむ。我ら、予知や占いが一番得意な魔法じゃからの。
晶	ちょっと怖いけど……、めちゃくちゃ気になるのでお伺いしたいです。
ホワイト	よかろう。
	おぬしが心密かに気になっている者が、もうすぐここを訪れる。
晶	……え！？そんなこと言われたら、
	別に気になってなくても気になっちゃうじゃないですか！？
ホワイト	誰かな、誰かな？
	おや、予言通り誰か来たようじゃ。せーの、で振り向くがよい。
晶	なんか恥ずかしいんですけど……！？
ホワイト	３……、２……、１……。
	せーの！
`},
{id:10636,title:"ホワイトを探せ！",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	ホワイト、そんな隅で何をしてるんですか？
ホワイト？	………•。
晶	ホワイト？……わっ、こっちにも！？ホワイトが二人いる……！？
ホワイト	ほほほ、それは偽物じゃよ。
	今ミチルとリケとスノウの3人でかくれんぼをしておってのう。
	スノウが鬼なのじゃが、すぐに見つからないよう、魔法で花壇の花を我の姿に変えて混乱させる作戦じゃ。
~~~~~~~~~	~~~~~~~~~
選択	すごい魔法ですね！
ホワイト	そなたはどんな魔法を見せても喜んでくれるから嬉しいのう。
	そら、ご褒美になでなでしてやろう。
晶	わっ、ホワイト……！
~~~~~~~~~	~~~~~~~~~
選択	便利な魔法ですね！
ホワイト	そうじゃろう？賢者の部屋にあるぬいぐるみを我の姿に変えれば、ひとり寂しい夜に抱きしめて眠ることもできるぞ！
晶	……その魔法の使い方、合ってます？
~~~~~~~~~	~~~~~~~~~
ホワイト	もっとたくさんの花を我の姿に変えることもできるんじゃぞ。
	《ノスコムニア》
晶	わっ！？ホワイトがいっぱい……！あれ、本物のホワイトは……？
スノウ	ホワイト見ーっけ！
どこからか聞こえたスノウの声。
気がつけばたくさんいるホワイトの中のひとりにスノウが飛びついていた。
ホワイト	やはりスノウにはわかってしまうか。
晶	すごい、どうして分かったんですか！？
スノウ	我らは二人でひとつ。本物のホワイトを見つけるのなんて朝飯前じゃ！
`},
{id:10637,title:"紋章",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	ホワイトの賢者の紋章は、首筋にあるんですね。
ホワイト	うむ。我は左側、スノウは右側じゃ。
	元はひとつずつ紋章がついておったが、我が死んだ時に、模様が半分ずつになってしもうた。
	今や我とスノウは二人でひとり。
	たまに首をくっつけて、模様を合体させる遊びが流行っておる。
晶	なかなか難しそうですね……？
	でも、北の国の魔法使いだけ五人いる理由がわかりました。
ホワイト	元は20人の賢者の魔法使いじゃったが、
	我が死んでからは、我を入れて２１人となったのじゃ。
	〈大いなる厄災〉と賢者の魔法使いの仕組みは、あのムルが長い時をかけて調べても、未だ解明できてはおらぬ。
	いつかそなたが解き明かしてくれれば、この世での気がかりが、ひとつ減るんじゃがのう……。
晶	無理ですって言いにくい言い方して……。自信はないですが、頑張ってみます。
	でも、ホワイトがいなくなったら、すごく寂しいですよ。
ホワイト	ほほほ。可愛らしいことを言うのう。
	大丈夫じゃ。我も寂しくはあるが、そなたが異界に帰れるよう、頑張ってみるからの。
`},
{id:10638,title:"ことわざ教室",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	あ、猫が銀貨を転がして遊んでる。これはまさに猫に小判だ……！
ホワイト	猫に……？なんじゃそれは？
晶	俺の世界にあったことわざという言葉なんです。
	貴重なものでも、その価値を知らない人にとっては何の役にもたたないって意味です。
	猫は魚には飛びつきますが、銀貨の価値はわからないですよね。
	だから、そう言われているんですよ。
ホワイト	ふむ……。つまり『ミスラに超美味しい豪華なフルコース』ということじゃな！
晶	フルコース……？
ホワイト	ミスラは腹に入れば何でも同じだと思っているからのう。
	超美味しかろうが、豪華だろうが、フルコースだろうが、全く意味がないんじゃ。
晶	（なるほど……）
ホワイト	『ことわざ』とやらは面白いのう。もっといっぱい教えてもらえんかのう！ 
`},
{id:10639,title:"いつでも一緒",type:"personal",characters:["スノウ","ホワイト"],memo:"ホワイト",
text:`晶	スノウ、ホワイト！部屋から大きな音がしましたが、大丈夫ですか？
ホワイト	おお、賢者よ。心配させてしもうたのじゃな。すまなかったのう。
	本棚の高いところのものを取ろうとして、二人して転んでしもうたのじゃ。
	大したことはない。
	先ほど図書室で、レノックスがひょいと本を取る仕草が頼もしゅうての。
	ついつい、真似したくなったのじゃ。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
ホワイト	リケやクロエ、ルチルやミチル、シノなども、おやつとお茶を用意して招くと、遊びに来てくれて嬉しいのう。
	北の魔法使いたちは、我らを怖がって近付こうとせんな。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
ホワイト	本を読んだり、手慰みに水晶占いをしたりするかのう。
	されどひとりは寂しいからの。
	特別な日以外は、すぐにスノウを探しに行くじゃろうな。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
ホワイト	スノウと共に起き、互いの身支度をして、二人で体操をするのが日課じゃ。
	北の国の魔法使いは、他の国のような魔法の授業はほとんどしておらんのう。
~~~~~~~~~	~~~~~~~~~
晶	そういえば、スノウはどうしました？一緒じゃなかったんですか？
ホワイト	スノウは……、おや、転んだ拍子に頭をぶつけて伸びておるのう。
晶	そ、そんな呑気な……！スノウ、スノウ、大丈夫ですか？
ホワイト	止せ止せ。おぬしに介抱されたくて甘えておるだけじゃ。
スノウ	……ホワイトよ。せっかく賢者が優しくしてくれておるのに、種明かしが早すぎるぞ。
晶	わ……！無事だったんですね！？びっくりした……。
ホワイト	ほほほ。安心するがよい。
	我ら、殺されるようなことがない限り、滅多なことで死んだりせぬ。
`},
{id:10640,title:"空中散歩",type:"personal",characters:["スノウ","ホワイト","ムル"],memo:"ホワイト",
text:`晶	二人とも、絵の中の居心地はどうですか？
絵の中のホワイト	賢者が抱きかかえてくれているからとても心地が良いぞ。
	やはり月夜の散歩は格別じゃな。
ムル	賢者様と双子先生見ーつけた！さあ、行くよー！
晶	わっ！？ムル！？
絵の中のスノウ	これ、ムル！どこに行く気じゃ！
有無を言わせない勢いで手を引っ張られ箒に乗せられる。
そのまま物凄いスピードで空高く飛んでいくムル。
気がつけば、すぐ近くで満月が俺たちを見下ろしていた。
ムル	さあ、俺と一緒に月とダンスしよう！
	そーっれ！！高い高いー！！
絵の中のホワイト	きゃー！ 何をするのじゃ！我らを投げるでない！落ちたら危ないじゃろ！
晶	む、ムル！飛び回りながらそんなことしたら危ないですよ！
ムル	大丈夫！だって双子先生も魔法使いだから！ほら、絵になってるのに楽しそう！
絵の中のスノウ・ホワイト	きゃー！賢者ちゃんー！
晶	（確かに、なんだかんだ楽しそうだな……）
`},
{id:10641,title:"ホワイト会社",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`ホワイト	前の賢者がそなたの世界で
	我の名前と同じギルドを探しておったがどんなものなのじゃ？
晶	（ホワイト会社のことかな？えーっと、なんて説明しよう）
	そうですね……。ホワイト会社は、人に優しくて、安心できて――……
	毎日健康的に楽しく過ごせる、俺の世界の大人たちが大好きなものでしょうか？
ホワイト	なんじゃ、我のことか！
	我は優しくて、一緒にいれば安心もできるし楽しく過ごすこともできるからのう。
	つまりそなたの世界に行ったらみんな我のことが大好きになるということじゃな？
晶	……え？えっと……？
ホワイト	ほほほ。ホワイト会社か。我にピッタリな褒め言葉じゃな！
`},
{id:10642,title:"賢者の務め",type:"personal",characters:["⑥"],memo:"ホワイト",
text:`晶	賢者の務めとは、具体的に一体何をすればいいんですか？
ホワイト	そうじゃのう。簡単に言うと我らにとっての、道しるべになってほしいのじゃ。
晶	道しるべ？
ホワイト	月も星も出ておらぬ。真っ暗な夜道で迷うと怖いじゃろ？
	我ら魔法使いとて、どこかもわからない場所にひとりで取り残されれば怖いものじゃ。
	ゆえに、我らが道に迷ってしまったらみながバラバラにならぬよう、手を引いて欲しいのじゃ。
	されど、手を引かれるのを嫌がるものもいる。
	そんな時は夜空に輝く月となり道を照らし、進むべき方向を示してやってほしいのじゃ。
晶	……わかりました！少し不安ですが、頑張ってみます！
ホワイト	ほほほ。そなたにならできる。
	しかし、そなたとて道に迷う時もあればひとりが寂しい時もあるじゃろう。
	そんな時は我が隣で手を繋いでやろう。
	それゆえに、安心するのじゃ！いつでも我らは共にある。
`},
{id:10643,title:"モーニングコール",type:"personal",characters:["スノウ","ホワイト","オーエン","ブラッドリー"],memo:"ホワイト",
text:`ホワイト	ブラッドリーよ、起きるのじゃ！
スノウ	オーエンよ、起きるのじゃ！
晶	毎日こうやって北の魔法使いたちのことを起こしてあげてるんですか？
ホワイト	そういうわけでも無いのじゃが、
	今日は天気がいいから、あやつらに訓練でもしてやろうと思ってのう。
晶	そうだったんですね。それにしてもなかなか起きてこないですね。もしかして――。
~~~~~~~~~	~~~~~~~~~
選択	体調が悪いのかな？
ホワイト	なんと！それは大変じゃ。我らがつきっきりで看病してやらねば。
	よしスノウ、同時に扉を開けるのじゃ！
~~~~~~~~~	~~~~~~~~~
選択	寝坊しているのかな？
ホワイト	なんと！それは許せん！可愛い我らが起こしにきてやったというのに。
	よしスノウ、同時に扉を開けるのじゃ！
~~~~~~~~~	~~~~~~~~~
スノウ・ホワイト	せーのっ！
	《ノスコムニア》
ブラッドリー	っ！？なんだ！？おい、じじい！殺す気か！！
オーエン	……最悪。おまえを殺したら片割れの幽霊はどうなるのかな？試してみる、スノウ。
晶	（す、すごい音……！いったい中で何が起きてるの！？）
	あ……ブラッドリー、オーエンおはようございます……。
ブラッドリー・オーエン	…………。
ホワイト	よし、次はミスラの部屋に行くのじゃー！
`},
