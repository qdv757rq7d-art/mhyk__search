`},
{id:11539,title:"とびきりのアイテム",type:"personal",characters:["⑮"],memo:"ムル",
text:`晶	こんにちは、ムル。俺を探していたって聞いたんですが、何かご用でしたか？
ムル	賢者様！見せたいものがあるんだ！えーっと、えっと……。ちょっとそこで待ってて！
晶	は、はい……！
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
ムル	いつも考えてる。
	あとは、月を見たり、星を見たり、石を見たり、土を見たり、数字を見たり、誰かを見たりもしてるよ。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
ムル	うん！みんな！シノはハンモックで寝たがってた。
	クロエは脅かしたら来なくなっちゃった。
	カインはカードよりダーツの方が上手い。ラスティカは揺り椅子が気に入ってる。
	シャイロックは自分の部屋の方が好きだって！
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
ムル	朝が来て、昼が来て、日が沈んで夜が来る！
晶	……ムルのスケジュールを教えてもらえませんか？
ムル	俺は目が覚めて、お腹が減って、眠くなる！
~~~~~~~~~	~~~~~~~~~
ムル	あったあった！魔法の鍵だ！これがあれば、どこの部屋の扉も開ける！
	オーエンやファウストが部屋から出てこないって困ってたでしょ？ぜひ使って！
晶	す……、すごい道具ですけど、
	人の部屋のドアを、許可なく開けてしまうのは、ちょっと……。
ムル	そう？じゃあ俺が使おう。必要になったらいつでも言ってね！
	なくしちゃってるかもしれないけど！
`},
{id:11540,title:"見習いムル",type:"personal",characters:["シャイロック","ムル"],memo:"ムル",
text:`シャイロック	いらっしゃいませ、賢者様。
ムル	いらっしゃいませ、賢者様。今夜はいかがなさいましょう。
晶	わあ、ムル！今日はお二人が店主ですか？
シャイロック	いいえ、彼は見習いです。
	退屈そうにしていたので、仕事を手伝っていただいています。
ムル	うん！棚の整理した！それにグラス磨きした！
シャイロック	休憩時間もしっかり与えていますよ。
	一つ手伝えたらトランプゲーム。二つ手伝えたらビリヤードを一緒にするんです。
晶	（いい上司だ……）
シャイロック	賢者様、何かお飲みになられます？ノンアルコールなら、今夜は……。
ムル	賢者様、これどうぞ！
晶	わ、綺麗な青色のカクテル……。これムルが作ったんですか？
ムル	うん、いろいろ混ぜた！夜空に星が浮いてるみたいでしょう？
晶	はい。金箔みたいなのが星みたいで綺麗です！いただきますね。
シャイロック	妬けますね。私も賢者様にお作りしたいカクテルがあるのに。
	賢者様は私とムル、どちらのカクテルを召し上がるんです？
ムル	俺だよね！
シャイロック	私ですよね。
晶	う、少し、考えさせてください……。
`},
{id:11541,title:"探求熱心",type:"personal",characters:["⑮"],memo:"ムル",
text:`晶	……すう、すう。
ムル	……………………なるほど。
晶	……んん。………ってムル！？
目を覚ますと、ムルが俺の顔をじっと覗き込んでいた。
晶	びっくりした……。あの、俺に何か用ですか？
ムル	ちょっとね！理由はちゃんとあるよ！
晶	ええっと、寝てる人の顔を見るのが好きとか……？
ムル	睡眠現象の観察と測定をしてるんだ！
晶	観察……？測定……？
ムル	正確には制御された条件下での実験だね。
	今日は、賢者様の睡眠の質について調べてた！もうだいたい材料は取れたかな。
	毎晩つきっきりで賢者様の寝顔を眺めてたんだ！
晶	つきっきり！？いつからですか！？
ムル	さあ、俺のことは気にしないで！ほら、早く眠りについて！
晶	き、聞いてない……。
ムル	………じい〜。
晶	（眠りづらすぎる……）
`},
{id:11542,title:"ムルとおままごと",type:"personal",characters:["⑮"],memo:"ムル",
text:`ムル	あ！賢者様！賢者様を探してた！
晶	何か俺に用事ですか？
ムル	うん！新しい遊びを教えて欲しいんだ！今日は初めてのことで遊びたい！
晶	新しい遊び……。元の世界で何かあったかな……。
	あ、『おままごと』はどうでしょう？家族になりきって遊ぶんです。
ムル	いいね！じゃあ、配役を決めれば良い？父役は……。
晶	フィガロとかどうでしょう？たまにお父さんっぽいですし。
ムル	駄目だよ！すぐ家庭崩壊する！オズなら安心だね！
晶	なんかしっくり来ますね……。じゃあ母役はどうします？
ムル	ファウストだね。
晶	（即答だ……）
ムル	賢者様は二人の子供役がいいと思うよ！二人が喧嘩しても止められるでしょう？
晶	う、うーん……。頑張りますね！
	ムルは何役をするんですか？
ムル	俺は猫かな！にゃーん！
`},
{id:11543,title:"旅行プラン",type:"personal",characters:["西"],memo:"ムル",
text:`晶	西のみなさん、楽しそうですね。何の話をしてるんですか？
ムル	旅行の話をしてたんだ！この四人で、もし旅行に行くとしたらってさ。
	すごく盛り上がってるよ！
シャイロック	テーマは『癒し』です。魅力的なプランができましたよ。
	賢者様、聞いてくださいますか？
晶	いいですね！ぜひお願いします。
ラスティカ	まずは、川辺に行ってのんびりします。
	鳥や川の音を聴きながら、皆で歌を唄うんです。
晶	（のどかだ……。確かに、癒されそうだな）
クロエ	そのあとは街へ出て、買い物をするんだ！みんなで服を選びっことかしたいなー！
晶	（うん、うん。癒されそう……）
シャイロック	買い物の後は、カジノに行きます。
	騙したり、騙されたりしながら、刺激的な夜を楽しむんです。
晶	（あれ？雲行きが怪しくなってきた……？）
ムル	最後には空に花火を打ち上げよう！勝っても負けても、最後は俺たちが主役なんだ！
クロエ	それ最高！
ラスティカ・シャイロック	最高ですね。
晶	あはは、癒しとは少し違う感じもしますが、
	西の魔法使いらしくて、楽しそうな旅行プランですね！
`},
//南
//フィガロ
{id:11801,title:"スポットの印象（１）",type:"personal",characters:["ミチル"],memo:"フィガロ",
text:`ミチル	病の沼って、ちょっと暑いけど、楽しいところですね！　
晶	気に入りましたか？　ミチル。
ミチル	はい！　病原菌がいるかもって言われて、最初は少し怖かったですけど……。
	水が綺麗で泳ぐのも楽しいですし、
	色鮮やかな植物がたくさんで沼沿いを歩くのも楽しいです。
	見たことがない動物や虫もたくさんいますし、
	昨日はカヌーも漕がせてもらいました！　難しかったですけど、また乗りたいです。
晶	満喫してますね！　
	（確かに、子供が喜びそうな要素が多い場所だな……。
	　夏休みの大冒険にはピッタリな土地かも）
ミチル	賢者様は、カヌーに乗ったことありますか？　
~~~~~~~~~	~~~~~~~~~
選択	ありますよ。
ミチル	そうなんですね！　
	じゃあ、ボクと競争しませんか？　ボク、昨日でだいぶ上手くなったんです！　
晶	いいですね。負けませんよ。
ミチル	あはは！　ボクだって！　
	待っててくださいね、フィガロ先生に言って借りてきますから！　
~~~~~~~~~	~~~~~~~~~
選択	ないですね。
ミチル	なら、ボクがお乗せしますよ！　昨日でだいぶ上手くなったんです！　
晶	本当ですか？　ぜひ、乗ってみたいです。
ミチル	やった！　ボクがご案内します！
	慣れてきたら、漕ぎ方を教えてあげますね、賢者様！　
`},
{id:11802,title:"スポットの印象（２）",type:"personal",characters:["スノウ"],memo:"フィガロ",
text:`スノウ	暑いのう。暑いのう。
晶	スノウ……。そうか、スノウは北の国の魔法使いだから、暑い場所苦手ですよね。
	あっ、大きい葉っぱがありますよ。うちわにして扇げば涼しいかも。
	……ほら、どうですか？　
スノウ	ふう……、良い風じゃ。気が利くのう、賢者よ……。
晶	全然構いませんけど……。魔法で涼しくしたりは出来ないんですか？　
スノウ	もちろんできるぞ。
	しかし、この辺りの植物や生き物たちは、冷たい風が苦手なようでの。
	冷気を呼んで涼んでおったんじゃが、
	そばに来たトカゲの動きが鈍くなったのを見てしもうたのじゃ。
晶	そうでしたか……。優しいんですね、スノウ。
スノウ	この地では我らがゲストじゃからのう。
	ここを住処とする生き物たちを、我らの都合で脅かすわけにはいかぬ。
	……しかし、そろそろ限界じゃ。空なら近くに寄るものも少なかろう。
	ちと、上空に避難して魔法を使うとしよう。
晶	わかりました。……あっ、この葉っぱ、よかったら日傘の代わりにしてください。
スノウ	おお。ちょうど良さそうじゃ。では、行って参る。
`},
{id:11803,title:"スポットの印象（３）",type:"personal",characters:["ミスラ"],memo:"フィガロ",
text:`晶	あれ、水面に気泡が浮かんでくる。何か生き物がいるのかな……。
[水が大きく跳ねる音]
晶	うわーっ！？　
ミスラ	……なんだ。あなたでしたか。
晶	ミ、ミスラ……！？　何してたんですか……？　
ミスラ	何って、水の中に潜っていました。ここ、暑すぎて。
	暇だったんで、近くに来た魚や鳥を仕留めていたんですけど。
	今の影、あなただったんですね。
	うっかり殺すところでしたよ。
	オズやルチルにうるさく言われるんで、危ないことするのやめてもらえませんか。
晶	の、覗き込んだだけなのに……。
ミスラ	獲ったもの見ます？　見たことない生き物ですけど食べられるんですかね。
	よいしょ……。
晶	うわー！？　ミスラそれ……、ワニです！　！　
ミスラ	食べられます？　
晶	どうかなあ……。
`},
{id:11804,title:"ブレイクタイム（１）",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`フィガロ	あれ……。
晶	どうしました？　フィガロ。
フィガロ	スコールが来そうだよ、賢者様。みんなのところに戻るには間に合わなそうだ。
	少し雨宿りしていこう。
晶	スコールですか……？　
フィガロ	この葉っぱを切って……、よいしょっと。
	はいこれ、傘の代わりにして。表面が水を弾くからさ。
晶	大きい葉っぱですね！　
	これなら体が十分隠れます。なんだか、絵本に出てきそうだな。
フィガロ	賢者様の世界の絵本？　今度絵に描いて見せてよ。
	おっと……、降ってきたな。雨の勢いが強くなりそうだ。あの様の下に移動しよう。
晶	は、はい！　本当だ……。急に暗くなって、風も出てきましたね……。
フィガロ	怖いかい？　心配ないよ、すぐ通り過ぎるさ。俺もそばにいるしね。
	おしゃべりでもして、フィガロ先生と雨をやり過ごそう。
`},
{id:11805,title:"ブレイクタイム（２）",type:"personal",characters:["オズ"],memo:"フィガロ",
text:`晶	オズ、どうしたんですか？　こんな何もないところで……。
オズ	…………。
晶	あれ、オズの周り、なんだか涼しいですね……。魔法を使ってるんですか？　
オズ	ああ。この土地の湿気に堪え兼ねた。
晶	オズが音を上げることもあるんですね……。やっぱり、北の国出身だと辛いんですね。
オズ	…………。
	気温を下げると植物に影響があると、フィガロに止められた。
	代わりに、大気の水分を逃して乾いた風を呼んでいる。
晶	（エアコンの除湿モードだ……）
	湿気がなくなるだけで爽やかに感じます。俺も、しばらくここにいてもいいですか？　
オズ	なんだ。賢者は湿気に強い国の生まれと聞いていたが、おまえでも音を上げるのだな。
晶	気に障りました……？　
オズ	いいや。
	賢者よ。私の力が必要ならば、影ができるよう、雲を呼んでやろう。
晶	よ、よろしくお願いします！　
オズ	いいだろう。
	《ヴォクスノク》
`},
{id:11806,title:"スポットの思い出（１）",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`晶	フィガロはこの辺りの開拓に手を貸していたんですよね。
	ここに住もうとは思わなかったんですか？　
フィガロ	うーん。住人からも打診されたんだけどね。住み着くには少し不便だったかな。
	雨季にはこの辺り一帯が沈んじゃうんだ。
	今も、雨季だけ別の場所に移動してる人たちがいるんじゃないかな。
	そうすると暮らしが落ち着かないだろう？　ゆっくりしたくて南の国に来てたしね。
晶	なるほど……。やっぱりそういうのは、魔法ではどうにもならないものなんですね。
フィガロ	いや、なるよ。全然なる。俺なら、魔法でどうにでもできるさ。
	だからこそ、これ以上不便に思ったら、
	この土地を自分の都合のいいように、変えすぎちゃいそうでね。
	手を出すのはやめておいたんだ。
晶	なるほど……。
フィガロ	まあ、北の国の生まれだったから、湿気が多い場所もあまり慣れなくてさ。
	性に合わなかったんだよ。
	たまにこうして遊びに来るのが、ちょうどいいかな。
`},
{id:11807,title:"スポットの思い出（２）",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`晶	あそこの街、白い花が咲いてますね。綺麗だな。
フィガロ	あれはゴイアバの花だよ。木の実は食べられるんだ。
	懐かしいな。あの花と同じ名前の女の子が居たのを思い出すよ。
	昔、この辺りにたどり着いて住み着いた、旅の一団のリーダーの男に気に入られてさ。
	開拓を手伝ったことをすごく感謝されて、自分の娘を全員嫁にやるって言われたんだ。
	ここに住む気が無かったから断ったけど、
	みんな美人だったから、勿体無かったかなって。ちょっと思い出しちゃった。
晶	勿体無いって……。
フィガロ	え！？　だから、断ったって言ったじゃない。今の話、おかしなところ無かったよね？　
晶	まあ、いいですけど……。その娘さんに、ゴイアバって名前の子がいたんですか？　
フィガロ	それが、姉妹全員が同じ、「ゴイアバ」っていう名前だったんだ。
	そういう習慣だったみたいで。
	嫁のこともそうだけどさ、なんていうか、大雑把な人たちだったな。
`},
{id:11808,title:"スポットの思い出（３）",type:"personal",characters:["レノックス"],memo:"フィガロ",
text:`晶	レノックスは、病の沼に来たことあるんですか？　
レノックス	フィガロ先生の遣いで、果物を取りに来たことがあります。
	そういえば、あの時は一杯食わされました。
晶	フィガロにですか？　
レノックス	昔、病の沼に疫病があったことは、俺も知っていたんですが、
	まだたまに病気が出ることがあると。
	だから上半身と顔に厄除けの呪文を書いて、
	それが見える格好で訪れるようにと言われて。
晶	して行ったんですか……？　
レノックス	して行きました。
	着いてみたら、みな普通の服を着ていて、俺の出で立ちはかなり警戒されましたね。
	果物を買うときも、相手の不信感を解くところから始めなくちゃならなくて、
	手間取りました。
晶	そういういたずら好きなところ、スノウやホワイト譲りなんでしょうか……。
レノックス	さあ……。気質じゃないですか。
`},
{id:11809,title:"フィガロへの印象（１）",type:"personal",characters:["ルチル"],memo:"フィガロ",
text:`晶	ルチルとミチルは、生まれた時からフィガロのそばで暮らしてたんですよね。
ルチル	はい。
	元々、母様とフィガロ先生が昔馴染みで、
	先生が住んでいた村に、母様が後から住み着いたんだと聞いています。
	だから母様も、先生を頼りにしているところがあったんじゃないかな。
晶	そうだったんですね。ルチルはフィガロのこと、どんなふうに思ってるんですか？　
ルチル	私も頼りにしていますよ！　
	父様が亡くなってからは特に、ミチルと一緒によく面倒を見てもらいましたし。
	今まで、私やミチルが困った時、必ず助けてくれました。
	いざという時は頼りになる、素敵な方ですよ。
晶	確かに俺も、フィガロがいてくれて頼もしいと思う場面がよくあります。
ルチル	そうでしょう？　たまにいい加減なことを言いますけど、根は誠実な人なんですよ。
`},
{id:11810,title:"フィガロへの印象（２）",type:"personal",characters:["レノックス"],memo:"フィガロ",
text:`晶	レノックスとフィガロは、昔からの知り合いなんですよね。
レノックス	はい。初めて出会ったのは、ファウスト様の革命軍にいた頃でした。
晶	その時は、フィガロとはあまり話したりしなかったんですか？　
レノックス	そうですね。恐れ多いというか……。
晶	恐れ多い……。
レノックス	今はとても親しくしていただいていますし、冗談を言い合うことも
	あるくらいですから、賢者様には想像がつかないかもしれません。
	昔は偉大な魔法使いとして、助力を仰ぐ形で軍にお迎えした方でした。
	俺から話しかけるようなことは、ほとんどありませんでしたね。
晶	（ＶＩＰな取引先と平社員、みたいな関係だったのかな……？　）
レノックス	頼り甲斐があって立派な方ですが、
	その魔力の強さのせいか、昔から、どこか達観しているようなところがありました。
	人間の社会からすると薄情に見える部分が、さらっと出ることがあるでしょう。
晶	ああ……、なんとなく、わかります。
レノックス	でもそれは、
	彼ほどの魔力の持ち主であれば、仕方のないことなんじゃないかと思うんです。
	フィガロ様を恐ろしく感じることもありますが、本人は、
	感覚的に人や魔力の弱い者たちと交われないことに戸惑っているように見える。
	それを誤魔化そうとするのが、俺からしたら少し不思議で……。
	不器用に感じることもありますね。
`},
{id:11811,title:"フィガロへの印象（３）",type:"personal",characters:["ミチル"],memo:"フィガロ",
text:`晶	フィガロはミチルが生まれた時から、ミチルのことを知ってるんですよね。
	フィガロのこと、どう思っているんですか？　
ミチル	うーん。お医者様としては立派な方だと思いますけど、
	ちょっとだらしないところがありますよね。
	洗濯物を放ったらかしにしたりとか、
	お休みの日にお昼まで寝ていて、朝ごはんをサボってしまったりとか。
晶	ミチルのだらしないは、けっこう採点が厳しいんですね……。俺も注意します……。
ミチル	街の友達が父親から教わるようなことは、大抵、フィガロ先生と兄様に教わりました。
	だから親戚とか、家族みたいに思ったりすることもあります。
	フィガロ先生がどう思ってるかは、分からないですけど……。
晶	本人に聞いてみたりはしないんですか？　
ミチル	聞きませんよ！　なんだか恥ずかしくないですか……？　
晶	そうかな。喜ぶと思いますよ。
ミチル	ニヤニヤするに決まってます！　
	あとは、もっと健康に気をつけて欲しいです。
	母様も父様も、若くして亡くなってしまったから……。
	フィガロ先生にはずっと元気でいて欲しいです。
	……直接伝えたりはしませんけどね。
`},
{id:11812,title:"フィガロへの印象（４）",type:"personal",characters:["オズ"],memo:"フィガロ",
text:`晶	オズは、フィガロとの付き合いが長いですよね。
	フィガロのこと、どう思っていますか？　
オズ	…………。どう、とは？　
晶	ええと、例えば……。
~~~~~~~~~	~~~~~~~~~
選択	フィガロの好きなところは？　
オズ	……特に思い当たらない。
晶	そうなんですか……？　
	でも、ずっと一緒にいるんだから、嫌いなわけじゃないですよね。
オズ	ずっとでも、一緒にいるわけでもない。……だが、そうだな。
	付き合いが長いところは、好ましいかもしれない。
晶	付き合いが長いところ……。でも、それって、スノウやホワイトも同じですよね？　
オズ	ああ。
~~~~~~~~~	~~~~~~~~~
選択	フィガロの嫌いなところは？　
オズ	……気にくわないところはたくさんあるが……。
晶	（たくさんあるんだ……）
オズ	よく喋るくせに、肝心なことは言わないところか。
晶	肝心なこと……。あ、今、肝心なこと言わなかったなって、思うことがあるんですか？　
オズ	…………。
	私の城にやってきて、長々と、どうでもいい話をすることがある。
	何かあったのか、と尋ねると……。
	「何もない」と。

晶	そうですか……。
オズ	私がフィガロについてどう思っているかは、私よりもフィガロの方が詳しいだろう。
	そんな気がしている。
`},
{id:11813,title:"フィガロへの印象（５）",type:"personal",characters:["ファウスト"],memo:"フィガロ",
text:`晶	ファウストはフィガロのこと、どう思っていますか？　
ファウスト	別にどうとも。
晶	……無理に話したくないならいいんですけど……。
ファウスト	そういうわけじゃない。
	あいつは口先だけのいい加減な男だ。おまえも見せかけの振る舞いに騙されるな。
	僕のように馬鹿を見たくなければな。
晶	ファウストは呪い屋をやっていたんですよね。
	フィガロのことを呪ったり、呪ったりしたことはあるんですか？　
ファウスト	どうせ跳ね返される。
	悔しいが、あの男の魔力には敵わない。呪いは返されると威力が倍になるからな。
晶	……いい思い出は、ひとつもないですか？　
ファウスト	…………。
	治癒の魔法はフィガロに教わった。あの男が姿を消してからは、僕が仲間を癒した。
	……そのくらいだな。
`},
{id:11814,title:"スポットゆかりの話（１）",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`フィガロ	賢者様、賢者様。靴を脱いで浅瀬に入ってごらんよ。
晶	フィガロ。水遊びですか？　
	わ……、ひんやりしてて気持ちいいですね。
フィガロ	そうでしょう。この浅瀬、裸足で足を突っ込むと、小魚がついばみにくるんだよ。
晶	ああ！　俺のいた世界にも、そういう魚がいましたよ！　
	わ……！　たくさん寄って来た！　
	あはは、くすぐったいな。角質を食べてくれるんですよね。
フィガロ	角質？　違うよ。この魚は欲を食べるんだ。
	人間って動物に比べて欲深いからさ、ここの魚の好物なんだよ。
晶	欲……？　欲望とか、欲求とかの、欲ですか？　
フィガロ	他にないだろう。あはは、たくさん集まって来てるね。
	賢者様は欲求不満だったのかな。
晶	あの……。なんかすごく恥ずかしいんですけど……。
フィガロ	そう？　余計な欲が消えるとスッキリすると思うよ。
晶	フィガロの方には全然寄り付かない……！　
フィガロ	俺の欲望なんて、だいたい叶えちゃってるからねえ。
`},
{id:11815,title:"スポットゆかりの話（２）",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`晶	あっ、ひょうたんだ……！　なんかちょっと表面が透けてる……。
フィガロ	これは、酒を蓄えて育つガロン瓜の亜種だよ。本来なら
	この実に酒が入ってる植物だけど、この沼で育つ子たちは濾過された水を蓄えてる。
	昔、この辺りを開拓していた時代に、俺が東の国から持って来て植えたんだよ。
	よっと……。ほら、飲んでごらん。
晶	ひょうたんの中に水が入ってるんですね……。いただきます。
	……ごくん……。
	本当だ……、井戸の水みたいです。飲みやすいし、植物の香りもしない。
フィガロ	昔はここも毒沼だったし、綺麗な飲み水はとても貴重だったんだ。
	今も、乾季に重宝されてるみたいだね。
晶	フィガロが植えた植物は、他にもたくさんあるんですか？　
フィガロ	たくさんってほどではないかな。
	水さえ整えば、この辺りは南の国の中でも、自然が豊かな土地だったから。
	色々持ち込んではみたけど、ここには根付かない植物も多かったしさ。
	ガロン瓜も変異したし、土壌のせいなのかな？　
	魔法使いと同じで、土地との相性が大切なんだ。面白いよね。
`},
{id:11816,title:"南の国について",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`フィガロ	南の国は魔法使いと人間がうまく共存して、面白い国になったよね。
晶	面白い、ですか？　
フィガロ	大昔は人間たちも数が少なくて弱かったから、魔法に頼りきりなところがあったけど、
	今は自分たちだけで暮らせるようになっただろう。
	こんなに開拓が大変な土地でも、
	道具を発展させ、人口を増やして、人間の社会を築いていった。
	それでも不便なところは魔法の手を借りる。魔法使いも、人の手を借りて暮らしてる。
	だいぶフェアな関係になったと思ってさ。
晶	確かに、南の国はどこへいっても、魔法使いに気さくに接してくれますね。
	支え合って暮らしているからでしょうか。
フィガロ	……なんだか少し、俺の生まれ故郷と似ているのかもしれないな。
晶	だから居心地いいんですか？　
フィガロ	あはは。かもね。
	まだ、もうしばらくは、南の国で暮らしたいな。
`},
{id:11817,title:"〈大いなる厄災〉について",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`晶	賢者の魔法使いになる前は、〈大いなる厄災〉のことを、どう思っていたんですか？　
フィガロ	不思議な仕組みだと思っていたけど、あんまり関心なかったよね。
晶	そうなんですか？　世界の脅威なのに……。
フィガロ	だって、毎年必ず追い返せていたんだよ。
	吹雪や嵐と同じようなもの、厄介だけど必ずやり過ごせていたものだったから。
晶	自然現象のような感じだったんですね。
フィガロ	そうそう。まあ、今は自分が選ばれちゃったから、本腰入れて
	調べないとなあとは思っているけどね。
	だけど、あのムルが、
	あれだけ調べて正体不明なんだから、本当によく分からないものなのかもしれないな。
晶	賢者の魔法使いに選ばれたことについては、どう思っていますか？　
フィガロ	うーん、色々理由はあるけど……。
	「今？　」って感じ。
	あ、もちろん、きみに会えたことは嬉しいけどね。
`},
{id:11818,title:"立派なお医者ちゃん",type:"personal",characters:["スノウ","ホワイト","フィガロ"],memo:"フィガロ",
text:`晶	フィガロ。村の人から診察のお礼にって、フィガロに果物を預かってきました。
フィガロ	わあ、美味しそうだね。後でみんなで食べるとしよう。
晶	このあたりの人たちは、みんな、フィガロに感謝してるんですね。
フィガロ	まあね。俺はいい人だから。
晶	わっ、スノウ、ホワイト。二人も魚をもらったんですか？　
スノウ	そうじゃ。フィガロ先生と一緒に食べてくださいと言われてのう。
フィガロ	俺のおかげで美味しい魚が手に入って良かったじゃないですか。
	たまには褒めてくださいよ。
ホワイト	たしかに。
スノウ	フィガロちゃんは、口は軽いが、昔からなんだかんだ、親切な優しい子で……。
ホワイト	こんなに大勢の人に慕われる立派な魔法使いになって、我ら、とっても誇らしいです。
フィガロ	なんか恥ずかしいな……。
晶	（珍しい……。照れてる……）
スノウ	フィガロちゃん、大きくなったね。
ホワイト	我らの自慢の弟子だよ、フィガロちゃん。
フィガロ	もういい、もういいです。
`},
{id:11819,title:"スポットの人々",type:"personal",characters:["ホワイト"],memo:"フィガロ",
text:`大人ホワイト	ふう……。
晶	わっ、ホワイト。どうしたんですか？　そんな姿で……。
大人ホワイト	うむ。子供の姿をしておったら、村の者たちに捕まってのう。
	そんなに着込んでは暑かろう、子供は体温調節がうまく出来ぬと、
	服を脱がされそうになったのじゃ。
晶	心配されてしまったんですね……。
大人ホワイト	子供は大切な土地の担い手じゃからのう。
	この辺りの者たちはみな、人を大切にしておって親切じゃな。
	ありがたかったが、これはスノウとお揃いのお気に入りの服じゃ。
	着替える時はいつも一緒じゃ。
	この姿でおれば、余計な心配はかけまい。ちょうど、地面から離れて涼しくなるしの。
晶	そうか、地面が近いと暑かったかもですね。気づかなくてすみません。
大人ホワイト	構わぬ。今は地面より、そなたの顔の方が近いのう。
晶	うわっ……。……確かに、近いです、顔が……。
大人ホワイト	ドキドキしたかの？　
晶	ちょっとドキドキしました……。
大人ホワイト	ふふん。我を子供扱いするからじゃ。
`},
{id:11820,title:"スポットにいた魔法使い",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`フィガロ	ここから少し西に行った村に、馴染みの魔法使いが住んでいるんだ。
	帰りに挨拶に寄ろうかな。
晶	フィガロは顔が広いですよね。どんな方なんですか？　
フィガロ	精悍で真面目な感じがレノックスに似ているかな。
	最近は少し歳を取ったけど、日に焼けていて、渋くてかっこいい人だよ。
	俺は住み着かなかったけど、この辺りは人間だけだと暮らしにくそうだろ。
	土地の開拓に魔法使いがいると便利だろうって、
	引っ越し先を探している魔法使いに、移住を勧めていた時期があったんだよね。
晶	なるほど……。その方は、この辺りの土地に馴染めたんですね。
フィガロ	湿気が多くて気象も厳しいけど、雨季は綺麗なところだからね。
	野良仕事も性に合っていたんだって。
	いい住処ができたって喜んでくれてさ。
	たまにこの辺の果物をカゴいっぱいに持って来てくれたよ。
	最近また子供が生まれて、お母さんになったから忙しいみたいで、
	しばらく会えていなかったけど……。
晶	お母さん……？　魔女さんだったんですね。
	話を聞いていて、なんとなく男性かと思い込んでました。
フィガロ	最初に会った時は男だったよ。
	魔法でどちらにもなれるから、その時々、気に入った方でいるみたいだ。
	君も一緒に会いに行ってみる？　男と女、どっちの姿でいるか賭けようか。
`},
{id:11821,title:"危険な場所",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`晶	わあ、大きな花が咲いてる……！　俺の顔くらいありますね。綺麗だな……。
フィガロ	あ、賢者様。その花の茂みから奥は、少し危ないから気をつけて。
晶	そ、そうなんですか？　
フィガロ	そっちの方の土壌が凄くいいみたいで、
	植物や動物が、どんどん大きくなっちゃうんだよね。
晶	え！？　そんなことがあるんですね。ちょっと興味があるけど、怖いような……。
フィガロ	あはは。見てみたいならついて行ってあげるよ。
~~~~~~~~~	~~~~~~~~~
選択	行ってみる。
晶	行ってみたいです！　他にはどんなものがあるんですか？　
フィガロ	珍しいのは双子鳥かな。抱えるくらいの大きさになっているのを見たことがあるよ。
	あとは……。
？？？	『ガサガサガサガサ！　』
晶	ぎゃーーー！　虫！　！　
フィガロ	この辺り、虫が多いよね。あ、ほら、あそこ。猫くらいの大きさのバッタがいるよ。
~~~~~~~~~	~~~~~~~~~
選択	やめておく。
晶	今日はやめておきます……。でも、そんな動植物が出てきてしまうと、
	生態系のバランスが崩れたりしないんですか？　
フィガロ	どうなんだろうね。長い間、深刻な被害は聞かないけど。
	ここ以外に持っていくと、
	栄養が足りなくてすぐ枯れたり、死んでしまったりするみたいでさ。
	ここはここで、バランスが取れているんじゃないかな。
`},
{id:11822,title:"フィガロの評判",type:"personal",characters:["ミチル"],memo:"フィガロ",
text:`晶	ミチル、ここにいたんですね。フィガロは一緒じゃないんですか？　
ミチル	フィガロ先生は、村の人たちの健康診断をしてくるって言ってました。
晶	健康診断……。この辺りはお医者さんが少なそうですもんね。
ミチル	病の沼以外にも、お医者さんのいない街や村に出かけることが以前からありましたよ。
	魔法が使えると、遠くでも急いで往診に行けるから、
	先生を頼って来る患者さんは多かったです。
	先生も、お世話になったり、
	開拓を手伝ったりで縁がある人たちだからってその都度出向いてました。
晶	フィガロって、面倒臭がりなところもあるけど、
	面倒見がいいところもありますよね……。
ミチル	そうなんです。なんだかんだいって律儀人だなって。兄様ともよく話してるんですよ。
`},
{id:11823,title:"スポットの名物",type:"personal",characters:["ルチル"],memo:"フィガロ",
text:`ルチル	あ！　賢者様、見てください。これ、海の木ですよ。
晶	海の木？　あれ……、大きなビー玉がぶら下がってる……？　
ルチル	それは海の木の実です。青くて透明で綺麗ですよね。
	波の色だって聞きますけど、本当かな。
晶	え！？　このビー玉みたいなの、木の実なんですか？　
	わっ……！　触ったら柔らかい……。
ルチル	海の木は、病の沼の特産品なんです。木の実は食べられますよ。
	召し上がってみますか？　
晶	食べられるんですね……！　凄いな……。
ルチル	よいしょ……。どうぞ、賢者様。少し齧って、果汁を飲むんです。
晶	ありがとうございます。海の実ってことは、しょっぱいのかな……。
	……はむ……、ごくん……。
ルチル	いかがですか？　
晶	（……これ……、ラムネの味がする……！　）
	お、美味しいです……。冷やして飲みたい感じです。
ルチル	わあ、いいですね！　甘くて爽やかで、不思議な味がしますよね。
	子供のお土産に人気なんですよ。
`},
{id:11824,title:"スポットでの発見",type:"personal",characters:["レノックス"],memo:"フィガロ",
text:`晶	レノックス、釣りをしていたんですか？　
レノックス	はい。ここは魚の種類が多くて。
	珍しいのが釣れました。バケツの中、見てみてください。
晶	…………？　あれ、この中、空っぽじゃ……。
	うわ……！　魚の骨が動いてる……！？　
レノックス	スペクターフィッシュというんです。
	身も皮もほとんど透明で、骨が泳いでいるように見える魚ですね。
	群れていても天敵に狙われないから警戒心が薄くて、釣れやすいんですよ。
晶	なるほど……。びっくりしたけど、なんとなく深海魚の仲間っぽいな……。
	食べられる魚ですか？　
レノックス	ええ。焼くと身が白くなります。なかなか美味いですよ。
	持って帰って、ネロに調理を頼みましょう。
`},
{id:11825,title:"楽しい場所",type:"personal",characters:["ルチル"],memo:"フィガロ",
text:`ルチル	賢者様。この沼の花の葉、上に乗っかって、向こう岸まで渡って行けるんですって。
晶	そうなんですか？　すごいな……。
	ここは沼なのに水が澄んでて、深い底の方まで見えますね。
ルチル	葉の上を渡ると、高いところを歩いているみたいに感じられるそうですよ！　
	少し見に行ってみませんか？　水中花もたくさん咲いてて、すごく綺麗なんです。
晶	うーん、ちょっと恐いような……。
~~~~~~~~~	~~~~~~~~~
選択	高いところが苦手で……。
ルチル	そうだったんですね！　それなら今まで、箒で飛ぶのも恐かったんじゃないですか？　
晶	箒はだいぶ慣れてきました。
	この世界での主要な移動手段なので、克服したいとは思ってて……。
ルチル	なら、ここは落ちても水の中ですし、
	高いところに慣れる練習をするには、向いているかもしれませんね。
	頑張りたくなったら、私がお付き合いいたします。いつでも声を掛けてくださいね！　
~~~~~~~~~	~~~~~~~~~
選択	泳げないので……。
ルチル	そうなんですね！　溺れるのが恐いなら、
	フィガロ先生の魔法で、水中で呼吸出来るようにしてもらいましょうか。
晶	そんなことができるんですか？　
ルチル	はい！　私もミチルも、川で泳ぐ練習をした時は、いつもそうしてもらっていました。
	魔法で深くまで潜るのは楽しいです！　
	ここは景色もいいですし、水に慣れる練習にもってこいだと思いますよ！　
~~~~~~~~~	~~~~~~~~~
選択	チャレンジしてみます！　
ルチル	やったー！　早速行きましょう！　
	あっ、でも、ボートも出してもらえるみたいです。ご心配ならそちらにしますか？　
晶	……いえ！　一度、自分で歩いてみます！　
ルチル	そうこなくっちゃですね！　大丈夫、初めは私が手をお引きしますから。
	楽しみましょうね、賢者様。
`},
{id:11826,title:"マナエリア",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、
	賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
フィガロ	ああ、それね、この世界では「マナエリア」って呼ぶんだよ。
	自分自身の中にある原風景のような場所。
	自然と心が落ち着いて、精神を集中できるような場所のことだ。
晶	マナエリア……。フィガロにもマナエリアがありますか
フィガロ	もちろん。俺のマナエリアは、北の国にある海だよ。
	空は曇っていて、海は少し荒れていて、風が強くて、
	広い芝生の岬の先が崖になってて、雪はまだ降っていなくて……。そんな景色だ。
晶	そこはフィガロの故郷なんですか？
フィガロ	いや。俺の生まれ故郷は湖のそばだった。
	あの海は、昔々に少しだけ住んでみた土地だ。
	その頃、どんな人たちと一緒だったか、
	自分が何を考えてたのかは覚えていないけど、でも、あの景色だけは気に入っててさ。
	なんの思い出もない場所が、俺のマナエリアになって定着した。
	魔法使いの中じゃ、少し珍しいことかもね。
	今も考え事をしたいときや、集中力を思い出したいときに、たまに出かけるよ。
晶	……マナエリアのことは、まだよくわからないんですが、
	なんとなく、フィガロっぽいエピソードですね。
フィガロ	あはは……。俺もそう思うよ。
`},
{id:11827,title:"アミュレット",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`晶	マナエリアから長く離れる魔法使いは、
	マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	フィガロもアミュレットを持ってますか？
フィガロ	ああ、あるよ。ほら、ここに置いてある。
フィガロは、棚に置いていた四角いガラスケースを手にして、俺に見せてくれた。
淡く発光するケースの中には水が入っていて、
海面のように輝きながら波打っていた。かすかに潮騒のような音も聞こえている。
晶	水槽なのに、水が動いてる……。
フィガロ	これは幻影だよ。俺のマナエリアは、北の国の海だからさ。
	その風景を閉じ込めているんだ。
晶	幻影……。魔法で映した景色なんですね。
フィガロ	昔、双子先生に作り方を教わったんだよ。他の魔法使いのアミュレットにするなら
	ただの海水を置いてもよかったんだろうけど……。
	俺は特に、マナエリアから離れて、色々なところを住処にしてたからね。
	風景そのものを持っていた方がいいって。
晶	師匠から弟子に受け継がれた魔法だったんですか。そういうのいいですね。
フィガロ	そう言われると、オズのアミュレットも似たようなものだし、
	なんだか照れくさいな……。
`},
{id:11828,title:"家族",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`フィガロ	賢者様、いいところに来たね。クッキーどうぞ。
晶	わあ、ありがとうございます。どうしたんですか？
フィガロ	カナリアが焼いたんだって、クックロビンからもらったんだ。みんなの分もあるよ。
	こんなに料理上手の奥さんがいるなんて、羨ましいよねえ。
晶	……前から思ってたんですけど、フィガロってとても長生きなんですよね。
	家庭を持ったことはないんですか？
フィガロ	さあどうだったかな。いたかもしれないし、いなかったかもしれないね。
	家族を作ったところで俺だけ取り残されてしまう。
	仕方がないことだけど、ずっと繰り返すにはやっぱり少し寂しいんだ。
	南の国に居着いてからは、俺だけの家族を作る必要はないって気づいたんだ。
	あの国はみんなが家族みたいで居心地が良い。
晶	そうだったんですね……。
	なんだか、込み入ったことを聞いてしまってすみませんでした……。
フィガロ	あはは。気にしないで、賢者様。オズを見ていてわかったことなんだけど……。
	望まなくても、大事な人は、現れるときには現れるものさ。
`},
{id:11829,title:"長い付き合い",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`フィガロ	オズあすっかり丸くなったよねえ。
晶	そうなんですかね……。
	俺は厳しいけど優しいオズしか知らないからピンとこないです。
フィガロ	厳しいけど優しいオズだなんて、耳を疑うような評価だよ。
	でもまあ、見ててわかる気はするけどね。
~~~~~~~~~	~~~~~~~~~
選択	昔のオズはどんな人でしたか？
フィガロ	誰も必要とせず、誰のことも理解していないから、そりゃあ強くて、冷酷だった。
	不器用なところは変わってないけど、それの何が悪い、って態度だったよ。
	子供に付き合った分、根気強くなったのかもね。
	昔はお互い孤独なもの同士、連帯感があったのに。今は少しだけ、オズが羨ましいよ。
~~~~~~~~~	~~~~~~~~~
選択	フィガロはずっと一緒に居たんですか？
フィガロ	ずっとではないよ。腐れ縁で、付かず離れずって感じかな。
	オズが世界を征服しようとしている間は、けっこう付き合ってやってたんだ。
	あいつが先に飽きちゃったみたいだけどさ。
	昔はお互い孤独なもの同士、連帯感があったのに。今は少しだけ、オズが羨ましいよ。

晶	フィガロは知り合いも多いし、周りの人たちも賑やかじゃないですか。
	きっと、大事な人も見つかりますよ。
フィガロ	そうなんだけどねえ。
	寿命が長いと、寂しいことも多くてさ。賢者様には、俺より長生きしてほしいな。
`},
{id:11830,title:"幼い頃のアーサーは",type:"personal",characters:["アーサー","フィガロ"],memo:"フィガロ",
text:`晶	フィガロは、アーサーの幼い頃のことも知っているんですよね。
	何か思い出ってありますか？
フィガロ	たくさんあるよ。アーサーはわんぱくで、医者として面倒を見ることも多かったよね。
アーサー	フィガロ様……！　賢者様の前なので、あまり恥ずかしい話は……。
フィガロ	恥ずかしいんだ？
	例えば、初めて空を飛ぼうとして、バルコニーから落っこちた時……。
アーサー	わあ！　わあわあ！
晶	アーサー、それ、ごまかしてるんですか？
フィガロ	箒がコントロールできずに、針葉樹の森に突っ込んで、全身棘まみれになった時……。
アーサー	大した怪我ではありません！
	すぐに治りましたし、今も怖がらず空を飛べているでしょう？
晶	……オズじゃなくても、
	アーサーを育てる人は、しょっちゅう悲鳴を上げそうですね……。
フィガロ	あはは。小さな子供はどんな子も、そういうところがあるけどね。
	アーサーの魔力が強い分オズも大変だったろう。
	アーサーがひどい怪我をしたり風邪が長引いたりすると、
	オズが一瞬で南の国まで連れて来てさ。
	ずっとひとりでいたから、どんな治癒魔法を施していいのか困ったみたいだった。
	初めて頼られてるなーって思ったよね。
	そこはさすがに、気分が良かったな。アーサーに感謝だね。
`},
{id:11831,title:"長い長いお説教",type:"personal",characters:["スノウ","ホワイト","フィガロ"],memo:"フィガロ",
text:`晶	失礼します。スノウ、ホワイト……。あれっ、フィガロもいたんですか。
フィガロ	やあ、賢者様！　ちょうどいいところに来てくれた。
スノウ	フィガロや。まだ話は終わっておらん。
ホワイト	フィガロや。年寄りの話は長いのじゃ。
フィガロ	勘弁してくださいよ。もう、じゅうぶん反省しましたから。
晶	お話中だったんですね。俺の用事は後でも……。
フィガロ	いやいや、そう言わないで、おじいちゃんたちの相手をしてあげてよ。
	昔から、二人のお説教は長くて長くて……。
晶	お説教……？
フィガロ	うーん。正直に話すと、
	俺が人でなしな提案をして、二人に道徳を説かれていたところだったんだ。
スノウ	そなた、清々しいほどに反省の色がないの。
ホワイト	まごころっていうのはね……。
フィガロ	賢者様の前で話さなくてもいいでしょう。
	俺はまだ、この子に尊敬されていたいんですよ。
	ほら、このマナ石、口止め料にしてください。
スノウ	もー、しょうがないなあ。
ホワイト	今日だけなんだからねー？
晶	（気になる……）
`},
{id:11832,title:"頼れる先生",type:"personal",characters:["フィガロ","ルチル","ミチル"],memo:"フィガロ",
text:`晶	ルチルとミチルも、フィガロとは長い知り合いですよね。
ミチル	はい！
	フィガロ先生は、ボクも兄様も生まれた時からのかかりつけのお医者様でしたし。
ルチル	父が亡くなってからは、他のことでも色々と先生を頼りにすることが多かったですよ。
フィガロ	あはは。嬉しいなあ。もっと褒めてくれていいよ。
~~~~~~~~~	~~~~~~~~~
選択	ルチルが子供の頃のフィガロは？
ルチル	母が亡くなってからは、フィガロ先生に魔法を教わっていたんです。
	先生は教え方がとても上手で……。
	だから、私が教師になった時、同じ教師だった父親はもちろんですけど、
	フィガロ先生の教え方もお手本にしていました。
~~~~~~~~~	~~~~~~~~~
選択	ミチルが子供の頃のフィガロは？
ミチル	ボクが、あまり家から出たくなくなったとき、先生がよく遊びに来てくれて、
	おしゃべりだけをして帰っていくことがあって。
	どうしたの？　とか、学校に行ったらとか、そういうことは全然言わずに
	話を聞いてくれて、それがすごく嬉しかった時がありました。

フィガロ	うわ！　いいね！　すごくいい話！
	賢者様、聞いた？　俺ってすごくいい人じゃない？
晶	聞きましたし、そう思いますけど……。
ルチル	もー。フィガロ先生、すぐ茶化すんだから……。
ミチル	そういう所ですよ！
フィガロ	えー？　だめ？　先生そういうのもっと聞きたいな。
`},
{id:11833,title:"手強い相手",type:"personal",characters:["ファウスト","フィガロ"],memo:"フィガロ",
text:`晶	あれ、フィガロ。ファウストの部屋の前でどうしたんですか？
フィガロ	やあ、賢者様。
	珍しく廊下で鉢合わせたから、話でもしないかって声をかけたんだけどさ。
晶	部屋に入れてもらえなかったんですね……。
フィガロ	なかなか手強いねえ。どうしたら、ファウストとゆっくり話ができると思う？
~~~~~~~~~	~~~~~~~~~
選択	正面から頼んでみる
フィガロ	なるほど……。
	廊下からずっと話しかけてたら、鬱陶しがってドアを開けてくれるかな？
~~~~~~~~~	~~~~~~~~~
選択	こっそり忍び込む
フィガロ	本当？　怒られないかな。機嫌を損ねると長引きそうだよ。
~~~~~~~~~	~~~~~~~~~
選択	今はやめておく
フィガロ	機を待てってこと？
	俺も本来、気は長い方だけどさ。今はちょっと時間がないかなあ。

晶	何か用事があったんですか？
フィガロ	どうだろう。話がしたいのは、俺のためであり、彼のためでもある。
	用があるといえばあるし、ないといえばない。
晶	……なんだかムルみたいな答えですね。
[ドアの開く音]
ファウスト	何が僕のためだ……。お互い用事なんてあるわけないだろ。
フィガロ	やあ、出て来てくれると思った。嬉しいよファウスト。
ファウスト	文句が言いたかっただけだ！　人の部屋の前でブツブツうるさ……、
	……っ、おい！　靴先をドアに挟むな！
晶	（押し売り訪問販売員みたいな手口だな……）
`},
{id:11834,title:"まどろみの中で",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`晶	……すう、すう……。…………はっ。
フィガロ	あ、賢者様起きちゃった？　もう少し賢者様の寝顔を見ていたかったのに。
晶	フィガロ！？　もう外が暗くなってる……！
	大変だ……！今日ミチルに羊さんのお散歩に行きましょうって誘われていたのに。
	すぐミチルに謝りに行ってきます！
フィガロ	はい、ストップ。
	ミチルには俺から伝えておいたから大丈夫だよ。
	それよりも、賢者様はお昼からずっとここで眠っていたんだ。
	それだけ疲れてるんだよ。今日はもう休んだ方がいい。
晶	ですが、ミチルがすごく楽しみにしてくれていたのに……。
フィガロ	ミチルはそんなことで怒る子じゃないよ。
	だから今日はいっぱい休んで明日また遊んであげて賢者様。
晶	……そうですね、今日の分まで明日楽しめるように。
	ありがとうございます、フィガロ！
`},
{id:11835,title:"得意な魔法",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`晶	フィガロは、得意な魔法ってありますか？　フィガロにしか使えない魔法とか。
フィガロ	俺だけが使えるわけじゃないけど、得意な魔法はあるよ。
	《ポッシデオ》
フィガロが呪文を唱えた。その直後。突然、背筋が凍るような感覚に襲われた。
晶	（怖い）
そう自覚した途端、身体中の筋肉が一気に緊張して、指先や膝がブルブル震えだす。
頭が真っ白になって、息が詰まった。恐怖と、不安と、絶望が、全身を暴れまわる。
叫び声を上げようと息を吸い込んだ瞬間……。
フィガロ	賢者様。もう大丈夫なはずだよ。深呼吸してごらん。
晶	え……？　……っは……、はあ……。……あ、あれ……？
フィガロの声がすると、今度は急に、頭の中がクリアになる。爽やかで、晴れやかで、清々しい気分だ。
うっすらと浮かんでいた汗が引いていく。一瞬前の恐怖の感覚は、1ミリも思い出せなかった。
フィガロ	これが俺の得意な魔法だ。思考を支配することと、傷ついた心を修復すること。
	俺より魔力の弱い魔法使いにはだいたい使えるかな。
	どうだった？　かっこよかった？　
晶	いや、あの……。…………。
フィガロ	あれ？　なんか引いてない？
	やっぱりわかりやすくて派手な方がウケがいいのかなあ。
	花火も出せるよ？　見る？
`},
{id:11836,title:"優しい魔法使い？",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`晶	フィガロはどんな時に怒ったりするんですか？
フィガロ	突然だね、賢者様。もしかして、俺に怒られてみたいの？
晶	い、いえそういうわけではなくて。
	フィガロはいつも優しいので、どんなかんじなのかなーって少し気になって。
フィガロ	うーん、そうだなあ。
	自分の中の計画が狂わされたりすると、怒っちゃうかもしれないな。
晶	フィガロは事前にきちんと計画を立てて行動することが多いんですね。
	もし怒るとしたら、例えば朝食の時とかですか？
フィガロ	朝食？
晶	俺が寝坊したせいで、朝食のスタートの時間が予定よりも遅れてしまったり……。
フィガロ	あはは、それぐらいじゃ怒らないさ。
	朝起きれないくらい賢者様が疲れているのかなって心配はするけどね。
晶	じゃあ、あまり激しく怒ったりとかは本当にしないんですね。
フィガロ	ああ。それに、俺の計画を邪魔するような困ったやつは、
	声をあげて怒るよりも魔法で黙らせてやった方が手っ取り早いしね。
	ね？　俺は穏やかな優しい魔法使いでしょ。
晶	そ、そうですね。フィガロだけは絶対に怒らせないように、気をつけます……。
`},
{id:11837,title:"紋章",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`晶	賢者の魔法使いには、目印になる賢者の紋章が身体に現れるって聞きました。
	フィガロの紋章はどこにあるんですか？
フィガロ	服で隠れて見えない場所だよ。
	見たい？
晶	いえ！　場所を教えて貰うだけで十分です！
フィガロ	なんだ、遠慮しなくていいのに。賢者様が思うほどきわどい場所じゃないよ。
	アバラの上……、この辺りかな。
フィガロは右の胸の下の辺りを、服の上から撫でて示した。
フィガロ	安心した？
晶	ちょっと安心しました……。
フィガロ	あはは。やっぱり直接見てみる？
`},
{id:11838,title:"明日は何をしようか？",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`晶	フィガロ、夕食の支度ができましたよ。
フィガロ	おっと、もうそんな時間か。ありがとう。今行くよ。
晶	用事の途中でしたか？
フィガロ	薬の整理と、道具の手入れをね。
	少し足りないものがあったから、明日は買い物に行こうかな。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
フィガロ	なんでもできるよ。
	昼寝をしたり、考え事をしたり、本を読んだり。夜ならこっそり晩酌をしたりね。
	長い間生きて来て、ひとりの時間もとても長かった。暇を潰すのは得意さ。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
フィガロ	誰か部屋に居てくれると楽しいね。
	ルチルとミチルはよく遊びに来るし、レノもお茶に呼べば来てくれる。
	スノウ様とホワイト様は、たまに呼んでないのにやって来るよ。
	逆に、ファウストには振られっぱなしだな。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
フィガロ	あまり決めてないかな？
	昼ごろまで寝過ごすこともあるし、明け方に起きて散歩に出るときもある。
	魔法の修行や授業をする日は別だけどね。
	予定がある生活は張りがあっていいけど、予定に縛られすぎるのは嫌だな。

フィガロ	賢者様はどう？　この世界の暮らしには慣れて来た？
晶	そうですね……。まだまだ不慣れで、
	分からないことだらけですけど、皆さんと過ごす毎日はとても楽しいです。
フィガロ	それは良かった。明日は一緒に出かけてみようか。
	賢者様の生活に足りないものを探しに行こう。
晶	足りないものですか……？　何かあったかな。
フィガロ	俺たちと、もっと仲良くなる時間だよ。
`},
{id:11839,title:"飲みたい理由",type:"personal",characters:["フィガロ","ミチル"],memo:"フィガロ",
text:`ミチル	フィガロ先生！　いつもボクたちに魔法を教えてくれてありがとうございます。
	えっと、これは兄様とレノックスさん、そしてボクからの感謝のお手紙です！
	いつもはなかなか言えないので……。
フィガロ	賢者様も一緒だから、何の用なのかと思ったよ。
	あはは、こんな嬉しいサプライズは初めてだ。
ミチル	それは、ボクが頼んだんです。緊張しないように、一緒に来てくれませんかって。
晶	ちゃんとお手紙を渡せて良かったですね、ミチル。
フィガロ	よし、お祝いに今夜はシャイロックにお願いしてちょっとだけ……。
ミチル	フィガロ先生！　お酒はダメですよ！
フィガロ	えー？　ちょっとだけでもダメ？
晶	ミチル、これはきっとフィガロなりの照れ隠しってやつなんじゃないですか？
フィガロ	おや、バレちゃったか。
フィガロは愛しい我が子を見つめるかのように受け取った手紙に視線を落とした。
フィガロ	でも、半分は本心だよ。嬉しいことがあるとつい、飲みたくなっちゃうんだ。
	……ミチル、それに賢者様もありがとう。
	あとで他のみんなにもお礼を言わなくちゃね。
`},
{id:11840,title:"世界中に繋がる縁",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`晶	フィガロは本当に顔が広いですよね。
フィガロ	そうだな。誰かに会うのは嫌いじゃないし、遠くに出かけるのも好きだから。
晶	世界中に知り合いがいるんですか？
フィガロ	うん。だけど、人間は仲良くなっても、寿命が短いからすぐにお別れになっちゃうね。
	逆に、長生きしてる魔法使い同士は、どこかしらで縁が繋がることが多いよ。
	気が合う、合わないは別にしてさ。
	俺なんかは、北出身なのに、社交的でオズと知り合いだろ？
	何かと頼みごとをされる事も多かったな。
晶	頼みごとですか……。聞いてあげることが多かったですか？
フィガロ	内容によるかなあ。楽しそうなら乗るよ。
	ファウストとレノックスも、そんな流れで出会ったしね。
	人と魔法使いが共存するべきだと考え始めてからは、積極的に手を貸してるつもりだ。
晶	……いつかは、世界中の人と魔法使いが、仲良く暮らせるようになるんでしょうか。
フィガロ	わからないけど、このまま人間が増えていけば、
	俺たち魔法使いは、ひとり残らず石になってしまう日が来るかもしれない。
	そうならないために、友好的な関係は、
	人間にも、魔法使いにも、多いに越したことはないよね。
`},
{id:11841,title:"可愛くて癒される……？",type:"personal",characters:["スノウ","ホワイト","フィガロ"],memo:"フィガロ",
text:`晶	フィガロ、何をしているんですか？
フィガロ	やあ、賢者様。さっきまでミチルと遊んでいたんだ。
	やっぱり子供は可愛くて癒されるなあ。
晶	そういう割になんだか少しぐったりというか、だらけてませんか？
フィガロ	正直、元気が良すぎて疲れちゃったんだよね。
	けど、賢者様も俺と遊びたくなったら教えて。いつでも相手をしてあげるから。
スノウ	フィーガーローちゃん！
ホワイト	我らともあーそーぼ！
晶	わっ！　スノウ！　それにホワイトまで！
スノウ	何して遊ぶ？
ホワイト	何して遊びたい？
フィガロ	遊びません。
スノウ・ホワイト	そんなこと言わずに、可愛くて癒される子供と遊んでよ、ほらほら……！
フィガロ	まったくいい歳して甘えた声を出さないでください。
晶	（さっきとは打って変わってものすごい塩対応だ……）
`},
{id:11842,title:"ねえ、賢者様",type:"personal",characters:["⑱"],memo:"フィガロ",
text:`フィガロ	ねえ、賢者様。俺のこと怒ってみてくれる？
晶	えっ！？　突然どうしたんですか？
フィガロ	俺、ミチルやルチルに怒られているとすごく落ち着くというか、
	心地いい気持ちになるんだよね。
	だから、賢者様にも怒られたら楽しい気分になれるのかなって思ってさ。
晶	そんなこと言われても怒る理由もないのに、フィガロを怒るなんてできないですよ。
	逆にフィガロにはいつもお世話になってるので、
	褒める言葉なら伝えられると思うんですが……。
フィガロ	え、本当に！？　じゃあ、そっちでお願いしようかな。
	どんな風に俺を褒めてくれるのか楽しみだ。
晶	…………。
	すみません……。そっちはそっちで、恥ずかしくてやっぱり無理でした……。
フィガロ	あはは、残念。心の準備ができたら教えてね、賢者様。
	もちろんその時は、お礼をたくさんさせてもらうつもりだから。
`},
{id:11843,title:"フィガロ先生",type:"personal",characters:["南"],memo:"フィガロ",
text:`晶	皆さん、お疲れ様です。紅茶とお菓子を持ってきたので少し息抜きをしてくださいね。
レノックス	賢者様、わざわざありがとうございます。
晶	あれ？　フィガロがいないみたいですけど……。
ルチル	フィガロ先生の訓練のスタート時間は日によって変わるんです。
	多分もうすぐいらっしゃると思いますよ。
晶	（それで、みんな自習をしていたんだ。
	　好きな時間に来るなんて、まるでフレックスタイムみたいだな）
[扉が開く音]
フィガロ	みんな、おつかれさま。
	賢者様も来ていたんだね。俺の生徒たちはみんな勉強熱心だろう？
ミチル	もー、フィガロ先生遅いです！　ボク、前回の授業の復習はもう終わっちゃいました。
	早く新しい魔法を教えてください！
フィガロ	あはは、ミチルは偉いなあ。
	でも、ミチルのここの問題、答えが少し違ってるみたいだよ？
ミチル	あ、本当だ……。ごめんなさい、もう一度解いてみます！
晶	（すぐ先生モードに切り替わった……。
	　いつもはマイペースな感じだけど、やっぱり頼りになるなあ。それに――）
	少し見ただけで、答えが合っているかわかるなんてフィガロはすごいですね。
フィガロ	まあ、一応先生役だからね。けど、賢者様に褒めてもらえるなんて嬉しいなあ。
	賢者様も魔法に限らず、わからないことがあればいつでも聞いてね。
	がなんでも教えてあげるからさ。
`},

//ルチル
//レノックス
{id:12001,title:"スポットの印象（１）",type:"personal",characters:["ルチル"],memo:"レノックス",
text:`ルチル	レイタ山脈も、南の国の中では景色が綺麗で有名な場所です。いかがですか？賢者様。
晶	雲や空が近いですね。こんな高い山の高原には来たことがなかったです。
ルチル	大きい山のてっぺん近くにいるって思うと、なんだか感動しますよね。
	だけど、さすがに少し冷えるかな？寒かったら言ってくださいね。
晶	ありがとうございます。
	レノックスに言われて、中に暖かいものを着て来たので大丈夫です。
ルチル	夜や冬はもっと冷えると聞きますし、綺麗ですけど、きつい傾斜も崖も多いし……。
	この辺りで暮らす人たちは逞しいですね。
晶	そうですね。俺もこの世界に来てからかなり鍛えられましたけど、
	特に地形の厳しさを感じるというか。
	学校や仕事で街に出る人も大変そうですよね。
ルチル	たしかに、麓の町にも学校があるかはわからないですし、
	じゅうぶんに勉強できている子は少ないかもしれないです。
	だけど、自然のことなら、きっとここの子供達の方が詳しいし、賢いんじゃないかな。
	天気の読み方や、地形や地質の把握、植物や動物や鳥たちの生態……。
	暮らしに必要な知識がたくさんありますから。
	山脈で働いている子供たちは、教わったことを
	兄弟や年下に伝えていくのも仕事のひとつだから教え方も上手いんですよ。
晶	そうか……。どんなに小さな子でも、ここでは先生になるんですね。
`},
{id:12002,title:"スポットの印象（２）",type:"personal",characters:["ファウスト","レノックス"],memo:"レノックス",
text:`晶	ファウストも、この辺りに来るのは初めてですか？
ファウスト	そうだな。美しくて、穏やかで……。
	例の事件のあと、きみに助けられて、手当てを受けた場所に似ている。
レノックス	…………。はい。
ファウスト	なんだ。
レノックス	……なんと言えばいいのか、未だに分からないでいるんです。
	あなたを探し続けていたかったです。それが俺の誠意だと思っていたから。
	後悔をしているわけではありません。ですが……。
レノックス	俺はここに居ついてしまった。
晶	…………。
ファウスト	僕だって、あの事件から、人間を呪い続けるのが僕の憎しみだと思っていた。
	それでも、思い出さずに過ごしてしまう日もあった。
	後悔しているわけではないけれど。
レノックス	……俺には、嬉しい事です。心から。
ファウスト	僕も、この雄麗な景色の中、きみが穏やかに過ごしていたのなら、それが嬉しいんだ。
	心から。
	わかるだろう？
レノックス	はい……。
ファウスト	…………。
	この場所を気に入っていたんだな。僕と一緒にいた頃のきみを思い出すと、
	意外なような、納得するような、そんな景色だ。
`},
{id:12003,title:"スポットの印象（３）",type:"personal",characters:["シャイロック"],memo:"レノックス",
text:`晶	シャイロック。今日は一緒に来てくれてありがとうございました。
シャイロック	おや。私はあなたの可愛らしいおねだりなら、いつでも聞いて差し上げますよ。
	ねだってくださらないのは、賢者様の方では？
晶	あはは、えーと……。シャイロックの可愛い判定を押さえる自信がまだなくて……。
シャイロック	ふふ、つれないかた。
	今日の午後は休暇にしたんですよ。
	レノックスから星空が綺麗な場所だと聞いたので。
	夜を待って、一杯飲んで帰ろうかと。
晶	それはいいですね！南の国の風景はのんびりするのに向いてる気がします。
シャイロック	同感です。
	この景色がいつまでも変わらずにいてくれたらと願いますが……。
	南も開拓が進んでいると聞きます。人が住むには不便なところなんでしょうね。
晶	そうですね……。魔法が使えない人たちには、厳しい土地かもって思います。
シャイロック	世界は目まぐるしく変わり始めています。二百年、三百年と経った時、
	どんな景色になっているのか、もう誰にも予想ができません。
	せめて覚えておくために、
	この時代のいろいろな風景を見ておくのは、悪いことではない気がしますね。
晶	（そうか……。魔法使いは長生きだから、
	　世界が変わって行くのをずっと見続けることになるんだな……）
シャイロック	空が広くて、澄んだ風も心地いい……。夜空が華やぐ時間が楽しみです。
`},
{id:12004,title:"ブレイクタイム（１）",type:"personal",characters:["⑳"],memo:"レノックス",
text:`レノックス	すみません、賢者様。夜が明ける前から手伝ってもらってしまって。
晶	いえ、早朝の山って一度来てみたかったです。
	本当なら重装備じゃないと来られないのに、箒だとあっという間でしたね。
レノックス	ええ。寒かったらおっしゃってくださいね。
晶	大丈夫です！でも、霧がすごいですね。こんなところで仕事してたなんて凄いなあ……。
あたりに立ち込めた濃い霧を見回して言うと、レノックスは少しだけ何か言いたげに俺を見つめる。
晶	……どうかしましたか？
レノックス	……いえ、少し驚かせたくなってしまって。もうすぐ日の出ですよ。
青白い薄闇と、深い霧の奥、うっすらと明るくなって来た方向を示してレノックスが足を止めた。
風が吹いて、かすかに霧が薄くなる。
すると、霧と朝焼けの空の間に、ふわりとオレンジ色の陽光が輝いた。
それを合図にしたように、
辺りに立ち込めていた霧は波のようにうねり、もうもうと山峡へ流れ込んでいく。
目の前の景色を晴らして昇り始めた朝日が、
羊の毛を優しく撫でるように、雲の表面をきらきらと輝かせる。
気づくと、眼下の遥か彼方まで、雲の海が広がっていた。
晶	（霧じゃなくて、雲の中にいたんだ……）
絶景に、俺はしばらくの間、言葉を忘れて立ち尽くしていた。
レノックス	日が昇って山頂の気温が上がると、雲が麓に下りていくんです。
	ご一緒できてよかったです。この時間だけ見られる、ご褒美のような景色ですよ。
`},
{id:12005,title:"ブレイクタイム（２）",type:"personal",characters:["ファウスト","レノックス"],memo:"レノックス",
text:`レノックス	あの……。
晶・ファウスト	？
レノックス	あ、いえ…………。やっぱりいいです。
晶	珍しいですね。レノックスが言いよどむなんて。どうしました？
レノックス	実は、お二人にお見せしたかった景色があるんです。
	ですが、日暮れまで待つことになりますし、自己満足かもしれないと我に返って。
晶・ファウスト	…………。
ファウスト	そんな申し出を断ったりしないよ……。おかしな遠慮はしなくていい。
晶	そうですよ！ぜひ見てみたいです！
レノックス	……ありがとうございます。
晶	（この二人、やっぱりまだ少しギクシャクするところもあるみたいだ。
	　過去に色々あると大変そうだな……）
~~~~~~~~~	~~~~~~~~~
選択	話題を盛り上げる。
晶	レノックスがファウストの従者だった頃の話とか、よければ色々聞きたいです！
ファウスト	そうだな……。今と比べれば、もっとシャッキリしていたよな。
	ここまで穏やかな感じじゃなかったよ。
レノックス	……戦乱の時代でしたから。
	靴を脱いで寛いでいても、次の瞬間には逃げ出す必要があったんです。
	それに、それを言うなら、ファウスト様も同じです。もっと、覇気がありました。
	お忙しかったからですか。
ファウスト	言うじゃないか。
~~~~~~~~~	~~~~~~~~~
選択	二人で行くよう勧める。
晶	積もる話もあるでしょうし、二人で少しゆっくりして来たらどうですか？
	俺はみんなと先に帰っているので。
レノックス・ファウスト	……。
ファウスト	きみはどうしたい？
レノックス	いや……、もう少し気軽なつもりだったので、
	そう改まると緊張するというか、照れるというか……。
晶	（煮え切らないな……）
`},
{id:12006,title:"スポットの思い出（１）",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	レノックスの飼っていた牧羊犬って、どんな子だったんですか？
レノックス	あぁ……。そうだな……。
	自分の誕生日と同じ日に生まれた犬だったんです。
	最初は譲り受けるのを迷っていたんですが、なんとなく、運命的なものを感じて。
晶	そうだったんですね！それはたしかに縁がありそうです。
レノックス	はい。
	賢くて、気性も穏やかで、何より気が合いました。
	目を見れば、お互いが何をしたいのか、何をして欲しいのかが分かって。
	結婚を考えたことがあるとすれば、あいつだけですかね。
晶	……恋愛していたんですか？
レノックス	はは、恋ではないですよ。でも、そのくらい、大切な相方でした。
	あの辺りの斜面を気に入って、よく走り回っていたんです。
	ここを通るとやっぱり、思い出しますね。
`},
{id:12007,title:"スポットの思い出（２）",type:"personal",characters:["⑳"],memo:"レノックス",
text:`レノックス	昔、レイタ山脈の景色を気に入って、麓にレストランを開いた人がいました。
	「ヒウカーオ」という店で、コーヒーがとても美味くて。
	春に出かける時と、秋に帰ってきた時に通るたび、必ず立ち寄っていたんです。
晶	いいな！絶景を眺めながら飲むコーヒーは、格別に美味しそうですね。
レノックス	そうなんです。夕焼けから日が沈むまでの間、
	ゆっくりコーヒーを飲むのを毎年の楽しみにしていたんですが。
	一代で畳んでしまったんです。
	まだ続いていたなら、賢者様をお連れしたかったですね。
晶	ああ……、そうなんですね。残念です。
レノックス	店主とも親しくしていたので、続けてもらえないかと言ってみたんですが、
	そんなに言うなら跡を継いでくれと笑われて。
晶	冗談じゃなかったかもしれませんよ。
	レノックスは、喫茶店のマスターが似合う気がします。
レノックス	はは、俺は愛想がないからな……。
	気に入りのものを、誰かからいつまでも変わらずに提供してもらうことは難しいです。
	店主は最後の年まで楽しそうでした。
	本当に大切なものは、自分で作り出して育てるしかありませんね。
`},
{id:12008,title:"レノックスへの印象（１）",type:"personal",characters:["フィガロ"],memo:"レノックス",
text:`晶	フィガロはレノックスとも付き合いが長いんですよね。
	フィガロから見て、レノックスってどんな人ですか？
フィガロ	時代ごとに色々あるからなあ。俺が話しちゃったら怒られないかな。
晶	レノックスは怒ったりしないように思えますけど……。時代によって違うんですか？
フィガロ	いや、レノックス自体は変わらないよ。
	でも、見るものによって味わいが変わるみたいなところがあるよね。
	まず、基本的には頑固だ。最終的には言うことを聞いてくれるけど。
	それに、割り切らない。
	「まあしょうがないんじゃない」っていうのがない。できないのかもな。
	タイプ的にはオズに似てるよ。
晶	割り切らない、ですか……？
フィガロ	そうそう。割り切りを知っていれば、
	四百年も人探しなんてしないし、世界征服だってしないさ！
	でもまあ、いいやつだよ、すごく。最初は真面目なだけの軍人なんだと思ってたけど。
	あれが実直ってことなんだろう。あまりにも自分と違いすぎて……。
晶	違いすぎて、何ですか？
フィガロ	うーん。
	レノックスみたいになりたいとは思わないけど、
	レノックスみたいな人柄だったら真実の愛にも手が届くのかなって思ったかな。
`},
{id:12009,title:"レノックスへの印象（２）",type:"personal",characters:["ルチル"],memo:"レノックス",
text:`晶	ルチルは、子供の頃からレノックスと面識があるんですよね。
	レノックスのこと、どう思っているんですか？
ルチル	レノさんは、優しいお兄さん！って感じです。
	寡黙で大柄だから、少し怖いかもって思う人もいるかもしれないですけど……。
	どんな話もちゃんと全部聞いてくれるし、どんなことにも付き合ってくれるんです。
	嫌だって断ってる所を見たことがないくらい。
	できないときはできないときで、理由を話してくれるから、
	レノさんに拒絶されたと思ったことは一度もないんです。
晶	たしかに、なんでも受け止めてくれる感じしますね。包容力があるっていうか……。
ルチル	ですよね！魔法舎に来て初めて歴戦の勇者だったってお話を聞いたんですけど、
	そういうところもかっこいいです！
	ただでさえかっこいいのに、戦っても強いなんてどうするんだろ！って思います。
晶	あはは。なんだか、レノックスのファンみたいですね。
ルチル	私だけじゃないと思いますよ。
	優しくて頼もしくて、故郷のみんなや両親も、レノさんのことは大好きでしたから。
	母様はフィガロ先生とよくお話してたけど父様はレノさんと仲が良かった気がします。
	家具の修繕の仕方を教わったりしてました。
	そばにいてくれると、ほっと安心できる人なんですよね。
`},
{id:12010,title:"レノックスへの印象（３）",type:"personal",characters:["ミチル"],memo:"レノックス",
text:`ミチル	レノさんを見てると、これから冬が来るような気持ちになります。
晶	レノックスで季節を感じるんですか？
ミチル	はい。えへへ……。ちょっとおかしいかもしれないですけど……。
	レノさんは毎年春になると羊を連れて高原に出かけて行って、
	秋になると帰って来てたんです。
	だから……。
晶	羊飼いの仕事って、何ヶ月も高原を旅するんだって言ってましたもんね。
ミチル	はい。昔、薬学の勉強を始めた時に、高原にしか咲かない花で作る薬があって、
	レノさんにお願いしたことがあるんです。
	もし見かけたら、って言ったんですけど、
	その年の秋にはちゃんと採って来てくれたんですよ。
	でも、後でフィガロ先生に聞いたら、
	なかなか見つからない花なんだよって教えてくれて……。
	たぶん、すごく探してくれたんだと思うのに、レノさんは何も言わなかったんです。
	何も言わないけど、すごく優しい人なんだなって思いました。
晶	レノックスっぽいエピソードですね……。
	それじゃあ、２人が一緒に夏を過ごすのは魔法舎に来てからが初めてなんですか？
ミチル	そうなんです！
	レノさんはいつでも変わらない気がするけど、夏のレノさんと遊べるのは楽しみです。
	魔法はフィガロ先生に教わりましたけど、
	物作りとか、屋根の直し方とか、馬や牛の扱いはレノさんに教わりました。
	今度は、夏の魚の釣り方を教えてくれるんですって！
	大きいのが釣れたら、賢者様にも見せますね！
`},
{id:12011,title:"レノックスへの印象（４）",type:"personal",characters:["ファウスト"],memo:"レノックス",
text:`晶	ファウストはレノックスと付き合いが長いんですよね。
	レノックスのこと、どう思っていますか？
ファウスト	きみの知っている通りの魔法使いだよ。
	実直で、いい青年で、その反面、意志が強く強情で、譲らないところもある。
	……初めて会った時から変わらないな。
~~~~~~~~~	~~~~~~~~~
選択	初めて会った時っていうと……
ファウスト	四百年くらい昔の話だ。
	僕のいた軍に人が増え始めた頃に炭鉱夫の仲間と一緒にやって来た。
	荒くれ者の集まりなんじゃないかと少し警戒してたが、みな真面目だったな。
	だけが魔法使いで、僕付きの従者になった。
	僕より年上で身体も大きいし、最初は僕の方が恐縮してたくらいだ。
	も彼は気にせず忠義を尽くしてくれて……。
	もともと昔は人を疑うたちでもなかったけど、戦いの中でも、
	彼のそばにいれば安心できた。レノックスは初めから信用できる男だった。
~~~~~~~~~	~~~~~~~~~
選択	二人は上下関係が厳しそうですよね。
ファウスト	……言っておくが、僕が強いているわけじゃないからな。
	僕は敬語をやめるように言ったこともあるし、
	友人として彼の意見を聞きたいとも思ってた。
	気の許せる兄ができたような気持ちでいたこともあるくらいなのに……。
	彼のかしこまった態度がずっと変わらないから、
	いつの間にか部下として接するのが当たり前になったんだ。僕が譲ったんだよ。
~~~~~~~~~	~~~~~~~~~
選択	強情なんて意外です。
ファウスト	彼は強情で強引だよ。
	無礼だと思ったことはないけど、僕が折れることもそこそこあった。
晶	あまり想像つかないです。どんな時ですか？
ファウスト	レノックスが僕に休めと言う時には、
	僕がどれだけ大丈夫だと言っても聞いてもらえない。
	だけど、彼自身が無理をしている時には、僕がどれだけ休めと言っても聞かないんだ。
	命令だと言っても断られたことがある。
晶	あはは。なるほど、納得できました。

ファウスト	……彼には幸せになって欲しいと願ってる。彼は幸せになれる魔法使いだろうから。
晶	レノックスも同じことを言うと思いますよ。
	ファウストに幸せになってほしいって……。
ファウスト	僕はもう、幸せになるつもりなんてない。
	だから彼も僕とは関わらない方が幸せになれるだろう。
	四百年も彼の人生を費やさせてしまったことについては、
	どこかで責任を取るつもりだけど……。
	この景色みたいに穏やかで幸せな暮らしをしていて欲しいと思ってるよ。
`},
{id:12012,title:"レノックスへの印象（５）",type:"personal",characters:["フィガロ","レノックス"],memo:"レノックス",
text:`ジョン	わしがまだ子供の頃から、レノックスにはたびたび世話になっていたよ。
	レイタ山脈の羊飼いは皆そうだろう。
	息子のピーターが生まれた時も、レノックスに助けてもらったんだよ。
晶	レノックスに？
ジョン	産気づいた妻の容態が悪くなって、医者を呼ぼうと山を下り始めたら、
	天気が荒れ始めて、立ち往生しちまったんだ。
	雨の中、途方にくれてたら、レノックスが箒で飛んで来てくれた。
	「あんたが呼んでる気がしたから」って。
晶・フィガロ	かっこいい〜。
フィガロ	そんなのがわかる力なんてあったの？
レノックス	いえ、なんとなくです。魔力じゃないと思います。
晶	すごい！じゃあ、第六感ってやつですかね？
フィガロ	なにそれ。俺が死にそうになってたら、その時も駆けつけてくれる？
レノックス	……フィガロ様ならむしろ、俺が死にそうな時に駆けつけて欲しいですけど……。
フィガロ	あはは、そりゃそうか。
	でも、そんな時におまえが呼ぶ相手は俺じゃないと思うよ。
レノックス	時と場合によりますが、それはあなたも同じでしょう。
晶	まあまあ……。
	さすが、南の魔法使いというか、人助けすることが多いんですね。
レノックス	俺も困った時は助けられていました。
	山は厳しい土地ですから、山脈で働く者同士、助け合って仕事をしているんですよ。
`},
{id:12013,title:"レノックスへの印象（６）",type:"personal",characters:["ブラッドリー"],memo:"レノックス",
text:`ブラッドリー	何もねえとこだな。
	大陸の真逆にある場所なのに、雪が深けりゃ北の景色に似そうだぜ。
晶	レノックスはここで羊飼いをしてたそうですよ。
	ブラッドリーはレノックスのこと、どう思っていますか？
ブラッドリー	南の魔法使いのくせに物怖じしねえのは、
	魔力が弱くて相手の強さを測れねえだけなのか……。
	それとも、フィガロとも付き合いがあるっていうし、
	強い相手にも態度が変わらねえ奴なのか。
	どっちにしろ、北じゃすぐに死んじまうタイプだな。
晶	そうなんですか？
ブラッドリー	因縁つけられりゃ、弱え奴は謝るしかねえのが北の国だぜ。
	あいつ、中身は頑固そうだろ。
	まあ、どうしてもって頼むなら、俺様の手腕で盗賊に仕立ててやってもいいけどよ。
晶	盗賊、レノックスに向いてそうですかね……！？
ブラッドリー	身体はよく鍛えてるし、ガタイが良くて冷静だ。弱くてもハッタリが利く。
	強奪なんかは本来の性分じゃねえだろうが、
	何をしても生き延びてえって根性があるならできるだろ。
晶	うーん……。あんまりイメージがわかないです……。
ブラッドリー	まあ、ああいうやつは、自分のために働くよりも、
	何か守るものがある方が強くなるかもな。
`},
{id:12014,title:"スポットゆかりの話（１）",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	羊を群れで移動させながら育てるって、どんな意味があるんですか？
	大変そうだなって思いますけど……。
レノックス	同じ場所に留まっていると、どうしても食料にする草が足りなくなるんです。
	羊たちは栄養のある短い草しか食べなくて。
	俺が標高の高い場所を選んだのは、伝染病に掛かりにくいからですかね。
	他のルートを通っている羊飼いもいますよ。
	羊たちは群れるのが好きで、あまりはぐれないから面倒が見やすいです。
	数十匹なら、手間はそこまで変わらないですね。
晶	なるほど……。たしか、全部が全部、レノックスの羊ってわけじゃないんでしたよね。
レノックス	ええ。
	いくつかの家からまとめて預かって、春から秋にかけて代わりに放牧するんです。
	家財や命綱を預かるようなものなので、
	万が一、いなくなった時は、見つかるまで必死に探します。
	俺は魔法使いですから、箒に乗って追ったり、夜に灯りをつけたりできますが、
	人間がやるには大変な仕事ですよ。
晶	そうなんですね……。
	でも、魔法が使えるから簡単な仕事だってこともないと思いますよ。
レノックス	ありがとうございます、賢者様。
	羊を預けてくれる人たちから、あんたに任せておけば安心だと言われるのは、
	やはり嬉しいし、やりがいのある仕事ですね。
`},
{id:12015,title:"スポットゆかりの話（２）",type:"personal",characters:["⑳"],memo:"レノックス",
text:`レノックス	そうだ、賢者様。何か荷物からなくなったものがありませんか？
晶	なくなったもの……？確認してみますね。
突然の質問に驚きながら、俺はポケットや鞄の中を確かめた。
晶	……大丈夫みたいです。俺、落し物してましたか？
レノックス	いえ、それなら良かった。
	この辺りには悪戯好きの妖精が住んでいて、
	持ち物を隠されてしまうことがあるんです。
晶	妖精……。本物の妖精がいるんですか？レノックスは見たことがあるんですか？
レノックス	他の場所でならありますよ。
	ここの妖精たちは隠れるのが上手いので直接見たことはないですが。
晶	悪戯好きなんて、ちょっと西の国っぽいですね。
レノックス	そうですね。滅多に人の来ない場所だから、人恋しいのかもしれないな。
	なくなったことに気づくまで盗むので、
	「あれがなくなった、これがなくなった」と言いながら歩くと盗られないんですよ。
晶	あはは、おまじないみたい。盗られる前に盗られたフリをするんですね。
	じゃあ、ええと……。
	ハンカチがなくなったみたいだなー。……こんな感じでしょうか？
レノックス	お上手ですよ。俺は、替えの靴下が見当たらない。困ったな。
晶	あはは。じゃあ、予備の歯ブラシが……。
レノックス	羊の爪切りが……。
`},
{id:12016,title:"スポットゆかりの話（３）",type:"personal",characters:["フィガロ","レノックス"],memo:"レノックス",
text:`晶	フィガロはこの辺りに来たことがあるんですか？
フィガロ	あるよ。
	暇になった時に、レノ、今何してるかなって思って、顔見に来たりしてたよね。
レノックス	え？
フィガロ	え？
レノックス	いえ……。いつも何かのついでだとか、用事の途中だとおっしゃっていたのに。
フィガロ	あはは。そうだったっけ。
晶	本当はどっちなんですか？
フィガロ	顔を見に来てたんだよ。
	でも、面と向かって伝えるのは、なんだかちょっと恥ずかしいじゃない？
レノックス	そういうものですかね。
晶	今、話しててバレちゃったのは良いんですか？
フィガロ	今のは、言ってみたらどういう顔するのかなって。そっちの方が気になったんだ。
	もっと驚くと思ったのにさ。甲斐のないやつだな。
レノックス	驚きましたよ。
晶	顔に出ないですね……。
`},
{id:12017,title:"南の国について",type:"personal",characters:["⑳"],memo:"レノックス",
text:`レノックス	色々な国を旅しましたが、南の国が一番落ち着きます。
	旅疲れしていたせいもあるかもしれませんが。穏やかで安らげる時間が流れている。
晶	元の気質とも相性が良かったように思えますよ。
	レノックスが南の国の魔法使いだって、知れば知るほどしっくりくる気がします。
レノックス	そう言っていただけると誇らしいです。
	毎日、こつこつと生活を積み重ねて、周りの人たちと家族ぐるみでいる暮らしは、炭鉱にいた頃にも少しだけ似ています。
晶	そうか、レノックスは、炭鉱のある村で生まれ育ったって言ってましたもんね。
レノックス	炭鉱の方が閉鎖的で男社会でしたけどね。
	朝目覚めた瞬間から、動物や人々に手を貸して、自分もまた、必要な分だけ誰かの手を借りる。
	そうして皆が毎日働くことで、生活が成り立ち、この国の歴史が積み重なっていく。
晶	自分が一員でいる意味を実感しながら生きていけそうですね……。
	そんな風に考えたことなかったですけど……。
レノックス	どこにいても、生きている限り誰かの何かになっていくはずです。
	この国では、魔法は能力や個性と同じで、魔法使いということも隠さずに生きていける。
	それも、長く続いた積み重ねのひとつです。
	南の国のような場所がこの世界にあって、そこで暮らせて、自分は幸せだと思います。
`},
{id:12018,title:"〈大いなる厄災〉について",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	賢者の魔法使いになる前の、〈大いなる厄災〉が来る夜はどう過ごしていたんですか？
レノックス	あまり変わりませんでした。季節や天気と同じような日常のひとつで、
	自分には無縁のように思えていました。
	なんだか途方も無い話ですし、世界の仕組みにも俺は興味がなくて。
	自分が関わるなんて思ってもいませんでしたね。
	南の国に来てから、賢者の魔法使いに初めて会いました。
	俺と何も変わらない普通の魔法使いだったので、なんて言えばいいのか、
	それでようやく、それまでよりも身近に感じたくらいでしょうか。
晶	なるほど……。
	俺は賢者の魔法使いの方が馴染み深いですけど、本当はレアな存在なんですもんね。
レノックス	賢者様からすると、そうなるんですね。はは、なんだか面白いですね。
晶	〈大いなる厄災〉が近付くと、調子を崩す人もいるそうですけど、
	レノックスは影響はないですか？
レノックス	俺は、あまりないですね。自分でそう思っているだけなのかもしれませんが。
	月が近付いて来ると、もう１年経つのかと、
	その年も見つけることができなかったと、ファウスト様を思い出していました。
	賢者の魔法使いの役目で再会できたのは、ある意味、運命だったのかもしれません。
`},
{id:12019,title:"過去の魔道具",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	あれ、岩陰に何か置いてありますよ。これは……？
レノックス	槌ですね。誰かが忘れていったのかもしれません。
	農具の一種で岩を砕くのに使うものです。
	懐かしいな。俺の最初の魔道具もこいつだったんですよ。
~~~~~~~~~	~~~~~~~~~
選択	生まれ故郷にいた頃ですか？
レノックス	はい。故郷の炭鉱での仕事に使っていました。もう少し大きなものでしたが。
	毎日使っているうちに、いつのまにか魔道具になっていたみたいで。
	初めは気づきませんでした。
	炭鉱では、俺以外の魔法使いに出会う機会がなかったものですから、
	魔法の知識は噂で知る程度だったんです。
晶	じゃあ、お師匠様みたいな人はいなかったんですか？
レノックス	仕事の師は父親と炭鉱の仲間です。
	体を鍛えたり戦うことについては、自分でも試行錯誤していました。
	魔法の仕組みを詳しく学んだのは、
	ファウスト様や、革命軍の皆から教わったのが初めてですね。
~~~~~~~~~	~~~~~~~~~
選択	ファウストの従者だった頃ですか？
レノックス	ええ。あの頃の仕事は、主にファウスト様の身の回りのお世話でしたが、
	小隊の指揮をしていたこともありました。
晶	指揮官だったんですか？魔法使いの隊を？
レノックス	そちらはいつもファウスト様が。
	俺が任されるのは、アレク様が指揮する人間の部隊のうちのひとつでした。
	魔法使いたちは、魔法を使える分、体を鍛えている者が少なかったので、
	戦場にいると目立ってしまって。
	戦火の中、狙われやすかったんです。人間たちに混ざって俺が魔法を使っていると、
	人間の部隊も警戒されるようになるんですよ。
	そうやって、相手を驚かすような作戦はアレク様がお好きでしたね。
~~~~~~~~~	~~~~~~~~~
レノックス	革命軍に混ざってからは、装飾したメイスを魔道具にしていました。
	戦闘用の槌矛で、こういう感じの……。
レノックスが呪文を唱えると、手にしていた槌がふわりと光った。
頭部に重い装飾のある、杖のような形に変わる。
晶	ファンタジーゲームに出てくる武器っぽい……！
	これをレノックスが持ってたんですか？格好いいですね。
レノックス	はは……、格好良くはありません。
少しだけばつが悪そうに、レノックスは魔法を解いてしまった。
元に戻った質素な農具に視線を落としている。
俺はその横顔を見ながら、
歴戦の戦士と呼ばれ、メイスを魔道具に戦う魔法使いの姿を少しだけ想像した。
レノックス	こいつが持ち主のところに戻れるよう、縁を繋ぐ魔法をかけておきましょう。
	《フォーセタオ・メユーヴァ》
`},
{id:12020,title:"スポットの人々",type:"personal",characters:["ミチル"],memo:"レノックス",
text:`ミチル	レイタ山脈に暮らしている人たちから見ると、
	ボクたちが住んでいた雲の街も、都会に思えるんですね。
	都会の魔法使いさんだなんて言われて、照れ臭いけど、ちょっと嬉しかったです。
晶	雲の街には魔法科学のエレベーターがある塔も建っていますもんね。
ミチル	雲の街でも、住んでる人たち同士はみんな家族って感じがしていましたけど……。
	この辺りで暮らす人たちは、その絆がもっと強いような気がしました。
晶	家族ぐるみで仕事をしていて、家族それぞれも協力し合っているからでしょうか？
ミチル	そうかもしれません。
	この辺りに暮らす人たちは、ほとんどが家族と同じ仕事をするんだそうです。
	だから、ボクと同じくらいの年の子も、１０年以上同じ職場で働いていて、
	みんなが職人さんみたいになるんですって。
	南の国の人たちは働き者だってフィガロ先生も言ってましたけど、
	レイタ山脈の人たちは特別働き者な気がします。
晶	子供の頃からずっと仕事をしてるのは、偉いですけど、やっぱり大変そうですね……。
ミチル	でも、生まれた時からお師匠様のような人に仕事を見てもらえるなら、
	安心だなって思いました。
	兄様も、父様と同じように先生になりましたし。
	この辺りの人たちの生き方と似ているところがあるかもしれません。
晶	ミチルは先生の仕事に興味はないんですか？
	リケに勉強を教えてあげたりしてますよね。
ミチル	将来のことはまだわからないですけど……。
	実は、ちょっとだけ考えたことがあるんです。
	このまま勉強を頑張れば、ボクも、父様や兄様みたいな先生になれるでしょうか？
`},
{id:12021,title:"スポットにいた魔法使い",type:"personal",characters:["ルチル"],memo:"レノックス",
text:`晶	この辺りは、レノックスの他にも、魔法使いの羊飼いがいたりするんでしょうか？
ルチル	レノさんが初めて羊飼いになった頃は何人か居たって聞いたことがありますよ。
	今はどうでしょう？
	レノさんが仕事を引き継いだ羊飼いさんも、
	フィガロ先生のお知り合いの魔法使いだって聞いたことがあるような……。
晶	そうなんですね。じゃあ、羊飼いって魔法使いに多い職業なんでしょうか？
ルチル	人間がやるには大変なお仕事だから、そうかもしれないです。
	魔法使いがいないと不便な土地では、特に頼りにされると思いますし。
晶	たしかに、魔法で空を飛んだり、火を起こしたりできるところは、
	山の暮らしに向いてるかもしれないですね。
ルチル	困っている人が多くて、
	魔法で手助けができる場所に行ってあげたくなる気持ちはわかります。
	私も、雲の街の学校が大きくなったら、
	学校のないところでも先生をやりたいなって、ぼんやり思ってたんです。
	魔法使いも、先生も、お医者様も、他の仕事も、南の国ではまだまだ足りないから、
	どんな人も誰かの力になれる場所があるんですよ。
晶	そうか……。俺のいた世界は、人も物もたくさんあったから、
	そういう感覚はちょっと新鮮かもしれません。
ルチル	そうなんですね。賢者様の世界と行き来ができたら、きっと便利ですよね……。
	賢者様の世界の人たちが、
	こっちに出稼ぎに来てくれたら、南の国ももっと良くなりそうですね！
`},
{id:12022,title:"危険な場所",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	あれ……。あの岩のところ、赤い印みたいなものが書いてある。なんだろう……？
レノックス	賢者様！そちらは……！
晶	うわあ……っ！？
レノックス	……っ！
岩に近づいた途端、強烈な突風に煽られた。
突き飛ばされるような衝撃によろめいて、ふわりと、体が宙に浮きかける。
レノックス	《フォーセタオ・メユーヴァ》！
呪文と同時にレノックスの手元が光って、大きなフックのついた長い杖が現れた。
杖を器用に操ると、俺の後ろにフックを引っ掛けてぐいっと引き寄せる。
レノックス	……、……あっ……。
~~~~~~~~~	~~~~~~~~~
選択	助かりました！
晶	ありがとうございます、レノックス！助かりました……！
レノックス	ご無事で良かったです。危ない場所には、ああして、皆で目印をつけているんですよ。
~~~~~~~~~	~~~~~~~~~
選択	吹き飛ばされるかと思いました……！
晶	ありがとうございます、レノックス！吹き飛ばされるかと思いました……！
レノックス	飛ばされます。岩の向こうは崖になっていて、崖からの強い風が吹くんですよ。
~~~~~~~~~	~~~~~~~~~
レノックス	目印を教えていなくてすみません。
	それに、とっさに杖で引っ張るなんて、失礼なことをしてしまって……。
晶	え？そんなの、死ぬところだったのに気にしないですよ！
	魔法用の杖なのかと思いましたけど……。
レノックス	これは、羊飼いの牧羊杖なんです。
	子羊も同じ場所で吹き飛ぶので、普段もこれで捕まえていて……。
晶	（羊用……。それで恐縮してたのか……）
レノックス	すみません……。
`},
{id:12023,title:"スポットの名物",type:"personal",characters:["ミチル"],memo:"レノックス",
text:`ミチル	賢者様！これ見てください！
晶	わあ、カラフルで綺麗な織物ですね。しっかりした生地だし、上着にしたら暖かそう。
ミチル	羊毛なんですって！この辺りは織物が伝統工芸なんだそうです。
	模様に特徴があるでしょう。この柄は山脈に咲いてる花を表してるそうですよ。
ミチル	こっちは羊、こっちは鳥の柄ですね。
	動物柄は、最近新しく作ってみたんだって、麓の町の職人さんが言ってました。
晶	可愛いですね。クッションやラグにしても良さそうです。
ミチル	そうですよね！クロエさんのお土産にしたら喜んでくれるでしょうか？
晶	いいですね、きっと喜ぶと思いますよ！
	西の魔法使いは個性的なものが好きだから、この柄も気に入ってくれそうです。
ミチル	良かった！この柄、父様が持っていた帽子の柄によく似てるんです。
	もしかしたら、昔、この辺りの土地の人たちと交流があったのかもしれません。
晶	そうだったんですね。
	じゃあ、クロエにお願いして、帽子を作ってもらうのはどうですか？
	冬に被ったら暖かそうですよ。
ミチル	本当だ……！クロエさんとはあまり話したことがないから緊張するけど、
	兄様のお友達だからきっと優しいですよね……。
	魔法舎に戻ったら、お土産を渡す時に聞いてみますね！
`},
{id:12024,title:"スポットでの発見",type:"personal",characters:["ファウスト"],memo:"レノックス",
text:`晶	あっ、見てくださいファウスト。あそこ、草の陰に猫がいますよ！
ファウスト	猫？こんな場所に猫なんているわけが……。
晶	でも、ほら、あの動き。ちょっと太ってるけど、猫ですよ！
	あっ、こっち見た！可愛い！
ファウスト	……いや、あれはヤマネコの仲間だ。太ってるんじゃなくて骨格が太いんだよ。
	まだ子供だが、牙があるだろう。
晶	え！？野生動物ってことですか？
ファウスト	そうだ。親がどこかにいて、気を立てているかもしれない。近づかない方がいい。
晶	で、でも、見渡す限りどこにも親っぽい動物はいないみたいですよ。
	もしかしてはぐれたのかも……。
ファウスト	…………。
	《サティルクナート・ムルクリード》
	わずかだけだが、幸運を授ける魔法をかけた。
	たとえ1匹でも、しばらくは生き延びられるだろう。
晶	しばらくって、そのあとは……？
ファウスト	後は、あの子の運次第だよ。
	本来、自然の生き物には魔法を使ったりしないものなんだ。
晶	でも……！……いえ、そうですよね……。
	まだ子供とはいえ、
	今日からずっとひとりで生きていく運命だったのかもしれないですし……。
ファウスト	…………。きみがそんなに心配するなら、もう少しだけ……。
晶	…………！ありがとうございます、ファウスト！
`},
{id:12025,title:"楽しい場所",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	あ、ここ、花が咲いてますよ。花びらが半分透き通ってる……。
	葉っぱも花みたいだな。
	綺麗ですね。初めて見た形です。なんていう名前の花か分かりますか？
	ルチルに見せたら喜ぶかな。
レノックス	これは……。
	リンドウの一種なんですが、赤い花をつけるのは珍しいです。俺も初めて見ました。
晶	そうなんですか？レノックスが長い間通ってた道なのに……。
	じゃあ、レアな花なんですね。
レノックス	ええ。花弁が半透明なのは、光を集めやすくするためです。
	高山に咲く花は、昼間に熱をためて、夜の寒さに備えるんですよ。
	普段は青い花が咲くんですが……。
	花をつけること自体も珍しい種類だから、本当に貴重です。
	それとも、今まで別の花だと思って見過ごしていたのか……。
晶	……レノックスって、植物にも詳しかったんですね。好きなんですか？
	花とかそういうの。
レノックス	…………。いや、特にそういうわけではないんですが……。
	喋りすぎましたか？
晶	いや！そういう意味じゃないですよ！
	たしかに、たくさん話してくれるのは、花と同じくレアだなって思いましたけど……。
レノックス	失礼しました……。珍しいものに出会うと、つい、気が高ぶってしまうというか。
晶	わかります！
	俺も地元で有名人を見かけたらテンションが上がっちゃうと思うんで……。
	（個性的な魔法使いが多い中で、レノックスのちょっと普通なところは、
	　親近感が湧いて安心するなあ……）
`},
{id:12026,title:"マナエリア",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、
	賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
レノックス	パワースポット、ですか……。
	もしかして、マナエリアのことではないでしょうか。
	マナエリアというのは、魔法使い固有の、気力を養う場所、というか……。
	心が安定するような場所のことです。
晶	たぶん、それです！レノックスにもマナエリアがありますか？
レノックス	はい。俺のマナエリアは、生まれた場所にあった高原の景色ですね。
	広大な風景に広がる緑を見渡していると、
	自然と落ち着いて、集中することができました。
	地面に生えた草の先に触れながら、遠くまで心を飛ばしていくようなイメージが、
	魔法を操る感覚と重なるんです。
	だからなんとなく、普段からも、広い場所の方が力を発揮できる気がしますね。
晶	なるほど……。
	レノックスに魔法をお願いするときは、周りに何もないところを探しますね。
レノックス	はは……。精進いたします。
`},
{id:12027,title:"アミュレット",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	マナエリアから長く離れる魔法使いは、
	マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アミュレットがあれば、マナエリアにいるような効果を得られるって。
	レノックスもアミュレットを持ってますか？
レノックス	ええ。俺のはこれですね。
レノックスは、棚の上に置いていた一輪挿しのガラス瓶を、俺に手渡して見せてくれた。
シンプルで小さなガラスの花瓶に、白い花弁と蕾をつけた小さな花が生けられている。
晶	これがレノックスのアミュレット……。
レノックス	俺のマナエリアは故郷の高原です。
	そこにはそういう小さい花がよく咲いていたので、似たような花を摘んで飾ってます。
晶	そうなんですね……。可愛い感じのもので、少し意外でした。
レノックス	……そんな風に考えたことはなかったな。
	なんでもよかったんですが、草や石よりは部屋が華やぐかと思って。
晶	すみません、変な意味じゃないんです！
	むしろ、ギャップがあって、レノックスに似合うと思いました！
レノックス	はは……。そうでしょうか。ありがとうございます、賢者様。
`},
{id:12028,title:"笑顔の練習",type:"personal",characters:["⑳"],memo:"レノックス",
text:`レノックス	…………。
晶	（レノックスがめちゃくちゃ怖い顔で鏡を睨んでいる……）
レノックス	はっ、賢者様。いつからいらっしゃったんですか。
晶	すみません、覗き見る気はなかったのですが、
	レノックスが険しい顔をしていたので……。
レノックス	最近、あまり愛想が良くないと言われることが多いので、
	笑顔の練習をしていたんです。
晶	あれ、笑顔だったんですね……。
	そういうときって、誰かの笑顔を参考にするとうまくできたりしませんか？
レノックス	誰かの……。
~~~~~~~~~	~~~~~~~~~
選択	例えばファウストとか
レノックス	ファウスト様の笑顔はしばらく見ていませんが。
	確か上品で、繊細な笑顔をよく浮かべていた気がしますね。
~~~~~~~~~	~~~~~~~~~
選択	例えばルチルとか
レノックス	ルチルの笑顔は、皆を安心させてくれます。優しげで、明るくて、素敵だと思います。
~~~~~~~~~	~~~~~~~~~
選択	例えばフィガロとか
レノックス	フィガロ先生のことは尊敬していますが、あそこまで愛想のいい笑顔は……。
	俺には少し難しそうだな。
~~~~~~~~~	~~~~~~~~~
晶	あ！でも、今の笑顔、すごく自然で良かったですよ。もう一度やってみてください！
レノックス	もう一度……。
	こうですか？
`},
{id:12029,title:"家族",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	今更なんですが、レノックスは南の国に、家族がいたりしないんですか？
レノックス	ああ……。俺も、魔法使いですから、見た目よりはずっと長く生きているんです。
	両親と上と下に兄弟がいましたが、家族はずいぶん昔に故郷で死に別れていて。
晶	そうだったんですね……。
レノックス	そんな顔をしないでください。昔の事ですから。
	南の国に残してきた人がいないか、心配してくださったんですね。
晶	長く生きてるって言ってましたけど、その後もずっとひとりのままですか？
レノックス	ええ。結婚は約束をすることになるし、俺はまだ、その余裕がないですね。
	ただ、ルチルやミチルのことを、子供の頃から見ているから、
	勝手ですが、家族のような気がしています。
	二人に両親がいないこともあって、頼られることが多いですし。
	フィガロ様も同じじゃないかな。
晶	たしかに、南の魔法使いたちは家族みたいな温かい結びつきを感じますね。
レノックス	賢者様にそう言ってもらえて嬉しいです。
	自分のことを考えるのは、
	あの子達が大人になって、ファウスト様が落ち着かれた後ですかね。
`},
{id:12030,title:"アプローチの方法",type:"personal",characters:["ファウスト","レノックス"],memo:"レノックス",
text:`晶	あれ、レノックス。ファウストの部屋の前でどうしたんですか？
レノックス	賢者様。その……、少し、お話しさせて頂けないかと思って伺ったのですが……。
晶	部屋に入れてもらえなかったんですね……。
レノックス	はい……。どういう風に声をかけたら、聞き入れていただけるんでしょうか。
~~~~~~~~~	~~~~~~~~~
選択	気さくな感じで
晶	ファウストは昔のことを隠したがるし、
	気軽でフレンドリーな感じの方が、いいんじゃないでしょうか？
レノックス	そんな風に接したことは今まで一度もないのですが……。
	賢者様がおっしゃるなら、試してみます。
	よう、ファウスト。天気もいいし、一緒に筋トレでもしようぜ。
~~~~~~~~~	~~~~~~~~~
選択	可愛い感じで
晶	ファウストは面倒見もいいですし、
	可愛く甘える感じの方が、いいんじゃないでしょうか？
レノックス	そんな風に接したことは今まで一度もないのですが……。
	賢者様がおっしゃるなら、試してみます。
	ファウスト様。俺と一緒に遊んでくれませんか。
~~~~~~~~~	~~~~~~~~~
選択	真面目な感じで
晶	ファウストは真面目で誠実な人ですし、
	こちらも真剣な感じの方のが、いいんじゃないでしょうか？
レノックス	やはり、そうですね。もう一度、誠意をお伝えできるように、試してみます。
	ファウスト様。これからの俺の人生について、ご相談があるのですが。

ファウスト	……なんだ、今のは……。おまえ、もしかして、魔法舎に馴染めていないのか？
レノックス	ファウスト様……。いえ。上手くやれています。
ファウスト	嘘をつくな。明らかに異様だっただろ。
レノックス	それは……。
晶	（二人とも、めちゃくちゃ真面目だな……）
`},
{id:12031,title:"居心地のいい場所",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	レノックスは長い間旅をしていたんですよね。
	それでも南の国に落ち着いたのは、やっぱり、フィガロがいたからなんですか？
レノックス	そうですね……。
	しばらくどこかに定住することを勧めてくださったのがフィガロ様でした。
	ファウスト様を探す旅の途中で、
	フィガロ様とは連絡を取ったり、会いに伺ったりすることが多かったんです。
	それで、ある時、
	知り合いの人間が困っているから、仕事を手伝って欲しいと言われました。
晶	仕事ですか？
レノックス	はい。羊飼いの仕事です。時間はあったので、旅を休むことにして、引き受けました。
	春に羊を預かって、羊の食料になる草のある場所を移動しながら、
	荒野や山を歩いて行くんです。
	ひとりで景色を眺めながら、何も考えずにいる時間が増えた時、少しだけ、
	……疲れていたのかもしれないなと思いました。
晶	レノックス……。
レノックス	秋になって町に戻った時、フィガロ様に、羊飼いの仕事を続けてみないかと聞かれて。	しばらく、やってみることにしたんです。
晶	それからは、南の国で暮らしているんですね。
レノックス	はい。南の土地とは気性が合うなと思っていましたが、
	住んでみると、とても居心地のいい場所でした。
	……あの時、フィガロ様は、
	なんとなく俺のことを察して仕事を勧めてくださった気がしていて。
	南の国の魔法使いになれたことで、ファウスト様にもお会いできましたし。
	先生には、今も昔も感謝しているんです。
`},
{id:12032,title:"親戚の子供？",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	レノックスは、ルチルやミチルとも長い付き合いなんですか？
レノックス	長いかどうかはわかりませんが、小さな頃から知っています。
	二人の母親とも顔見知りだったので、俺が子守をすることもありました。
	南の国の町は小さいですから、みな、知り合いのようなもので、
	そういうことは多いんですよ。
~~~~~~~~~	~~~~~~~~~
選択	ルチルの子供の時の思い出は？
レノックス	母親のチレッタが溺愛していたので、最初に会った頃は母親にべったりでしたね。
	母親似だったし、女の子みたいでしたよ。
	眼鏡を掛けていると怖がって泣くので、ルチルに近づくときは外すようにと、
	チレッタに言われていました。
	ルチルが慣れてからも、素顔で覚えられていたみたいで、
	よく魔法で眼鏡を飛ばされたりしましたね。
~~~~~~~~~	~~~~~~~~~
選択	ミチルの子供の時の思い出は？
レノックス	赤ん坊の頃のミチルも見たことがあります。小さくて……、赤ん坊らしい顔でした。
	物心ついた頃に会いに行くと、大柄なのを怖がられてよく泣かれましたね。
	俺よりも、
	気を引くために連れてきた羊の方が先にミチルと仲良くなったみたいでした。

晶	レノックスは優しいから、すぐに子供達と仲良くなれたのかと思ってました。
レノックス	大人でも子供でも、始めはよく怖がられますね。
	でも、俺の見た目に慣れてからは、二人ともよく懐いてくれたように思います。
	母親のチレッタが亡くなってからは、家族に手を貸す機会が多かったかもしれません。
	だから二人とは、親戚の子供のような距離感かな。
`},
{id:12033,title:"力自慢の演技",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	よいしょ！
	うーん、どうしよう。やっぱり届かないな……。
レノックス	賢者様、なぜ飛び跳ねているのですか。
晶	あっ、レノックス！依頼書の束が風に飛ばされてしまって。
	そこの木に引っかかってるんですけど……。
レノックス	なるほど。わかりました。
晶	うわっ！？
	（軽々と持ち上げられてしまった……！）
レノックス	これで届きますか。
晶	は、はい！取れました！
	レノックスは力持ちなんですね。あんな猫みたいに持ち上げられたのはじめてでした。
レノックス	はっ、すみません。考えるより先に手が出てしまって……。
晶	いえ、助かりました！猫の気持ちも分かったし。
	ありがとうございます、レノックス！
`},
{id:12034,title:"得意な魔法",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	レノックスは、得意な魔法ってありますか？レノックスにしか使えない魔法とか。
レノックス	俺の魔力は、あまり強い方ではありません。俺にしか、という魔法はないですね。
	得意というのも難しいですが。
	何かの力を強めるよりは、力を抑えたり、逃す魔法が得意です。
晶	抑えたり、逃がしたり、ですか。
レノックス	ええ。少し、お見せしましょうか。強く拳を握ってみてください。
晶	ん……。こうですか？
レノックス	《フォーセタオ・メユーヴァ》
レノックスが俺の拳に手を重ねて、呪文を唱えた途端、体の力が入らなくなってしまった。
晶	わ……、あわわ……。
レノックス	おっと。大丈夫ですか、賢者様。
	こんな風に、力や気力を抑えたり、
	火や水や風の勢いを抑えたりするのは、そこそこ得意な魔法です。
晶	な……、なるほど……。力を入れようとすればするほど抜けてく感じですね……。
	あの……、理解できたので、元に戻してもらってもいいですか……。
レノックス	…………。
	申し訳ありません……。時間が経たないと戻らないんです。
晶	え……、ええー……！
レノックス	失念していて……。部屋までお運びします。本当にすみません。よっ、と……。
晶	（担がれた……。運ぶのは魔法を使わないんだな……）
`},
{id:12035,title:"シュガーをひとつ",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	コーヒーのいい匂いがする……。誰かが淹れてるのかな。
レノックス	賢者様。
晶	レノックス！こんにちは。とてもいい香りですね。
レノックス	はい。ちょうど豆を挽き終わったところです。コーヒー、賢者様も飲まれますか？
晶	いいんですか？それじゃあお願いします。
レノックス	わかりました。
	《フォーセタオ・メユーヴァ》
晶	……！
レノックス	シュガーはこちらをお使いください。
	……なぜ、そんなに嬉しそうな顔をしているんですか。
晶	す、すみません。魔法を使うレノックスがとてもレアな気がして……。
レノックス	確かに。普段自分で出来ることはだいたい自分でやってしまうので、
	あまり頻繁には使わないかもしれません。
	ですが、たまには使うこともありますよ。俺も、あなたの魔法使いですから。
`},
{id:12036,title:"紋章",type:"personal",characters:["⑳"],memo:"レノックス",
text:`晶	賢者の魔法使いには、目印になる賢者の紋章が身体に現れるって聞きました。
	レノックスの紋章はどこにあるんですか？
レノックス	ああ。この服じゃ分かりにくいかもしれません。首の後ろ……、たぶんこの辺です。
レノックスは襟に指を入れて、首筋の辺りを示した。身を屈めて、紋章を見せてくれる。
レノックス	見えますか？この位置にあるので、自分でもあまりちゃんと見れませんが……。

document.getElementById("result").addEventListener("click", e => {
  if (!e.target.classList.contains("favorite-btn")) return;

  const storyDiv = e.target.closest(".story");
  const storyId = Number(storyDiv.dataset.id); // divに data-id をセットしておく

  if (favorites.has(storyId)) {
    favorites.delete(storyId);
    e.target.style.color = "#ccc";
  } else {
    favorites.add(storyId);
    e.target.style.color = "gold";
  }

  localStorage.setItem("favorites", JSON.stringify([...favorites]));
});
document.getElementById("result").addEventListener("click", e => {

    if (e.target.classList.contains("favorite-btn")) return;

    const card = e.target.closest(".story");
    if (!card) return;

    const id = Number(card.dataset.id);
    const story = stories.find(s => s.id === id);

    document.getElementById("modalTitle").textContent = story.title;
    document.getElementById("modalBody").innerHTML =
    story.text ? formatStory(story.text) : "本文がありません";
    document.getElementById("storyModal").style.display = "block";
});
