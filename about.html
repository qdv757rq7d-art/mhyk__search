#numberButtons button, #nameButtons button {

#numberButtons button.active, #nameButtons button.active { color:#fff; border-color:currentColor; }

#result {

  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));

  margin-top: 12px;

/* 1件ずつのカード */
.story {
  border: 2px solid #ddd;

  background: #fff;
  box-shadow: 2px 2px 6px rgba(0,0,0,0.1);

  align-items: center;
  gap: 8px;

/* タイトル */
.story-header h3 {
  margin: 0;
  font-size: 16px;
}

/* 種別ラベル */
.story-type {
  font-size: 12px;
  padding: 2px 6px;
  border-radius: 6px;
  background: #eee;
  white-space: nowrap;
}

/* 登場人物を少し小さく */
.story .characters {
  font-size: 12px;
  color: #555;
  margin-top: 6px;
}

/* メモ */
.story .memo {
  font-size: 15px;
  margin-top: 6px;
}

.story h3 .type {
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 12px;
  background: #eee;
}

.story-type.login { background:#d9edf7; }
.story-type.personal { background:#fde2e2; }

.story:hover {
  transform: translateY(-2px);
}


#toggleNameButtons {

.type-tabs button {

.header-area {

.type-tabs {

function formatStory(text){
   let html = "";

  text.split("\n").forEach(line => {

    if(line.includes("\t")){
      const [name, dialog] = line.split("\t");

      html += `
      <div class="line">
        <span class="name">${name}</span>
        <span class="dialog">${dialog}</span>
      </div>`;
    }
    else if(line.trim() !== ""){
      html += `
      <div class="narration">
        ${line}
      </div>`;
    }
  });

  return html;
}

クックロビン	失礼します！北の魔法使いさんたちに、新規の依頼書を届けにきました！
オーエン	……こういうものさえなければ。
ミスラ	ちょっと、本当に俺たち向きなんでしょうね。
	この前はわざわざ出向いて、小娘の指に刺さった棘を抜いて帰っただけだったじゃないですか。
クックロビン	す、すみません！
	最近、みなさん、どんな風に依頼書を書けば優先されるか
	コツがわかってきたみたいで、大げさに盛られるんです……。
ブラッドリー	盛られるって何だよ。飯以外の大盛りはお断りだぜ。
オーエン	依頼書書いたやつの名前と毛髪つけてよ。次から呪ってやるから。
クックロビン	の、呪うのはちょっと……。
スノウ	ぶつくさ文句を言うでない。
	おお、この異変は急いで片付けたほうが良いの。そなたら、北の国へ向かうぞ。
ホワイト	ミスラちゃん、あれやって〜。ぱっと北の国へ行けるやつ〜。
ミスラ	はあ……。面倒くさいなあ……。
スノウ・ホワイト	お願いだから〜！やって〜！
ブラッドリー	さっさと行ってこいよ。俺、くしゃみした設定で今回休みな。
ミスラ	くしゃみした設定ってなんですか。殺しますよ。
オーエン	僕もだるいし、働きたくない。
ミスラ	俺だって働きたくないですよ。
スノウ	じゃあ遊ぶ感じで行こう〜！次の討伐を一番早く片付けた人が、みんなのボスね！
ミスラ・オーエン・ブラッドリー	…………。
ブラッドリー	ボスなら俺だな……。
ミスラ	この中で一番強いのは俺でしょう。
オーエン	人の下ってなんか嫌。
スノウ	さあ、では出発じゃ！
`},
{id:200201,title:"正義と祝祭のプレリュード",type:"login",characters:["西"],memo:"（１）西の魔法使いの休み方",date:"2019-12-20",
text:`ラスティカ	西の国の聖なる祝祭が、無事に終わってよかったね。
クロエ	うん！少し大変だったけど、楽しかったなあ。
シャイロック	祝祭でお疲れでしょうから、私たちは一旦休息をとりましょうか。
クロエ	了解！
ムル	ねえ、何か忘れてない？何か大事な物を西の国に置いてきたよね？
クロエ	え？衣装も、裁縫道具もちゃんと持って帰ってきたはずだけど……。
ムル	遊びだよ。せっかくカジノに行ったっていうのに、俺たちは遊び尽くしてない。
	だから、もう一度戻ろう。西の国へ。
クロエ	ええ！？またあそこに戻るの？
ムル	そうさ。俺たちにとって、休息はなんだったか忘れた？
ラスティカ	休息とは、じっとしていることに限らない。
	心赴くまま、心が喜ぶことをすることだね。
シャイロック	私も、その考えには同意です。どんな時も、休み方は自由に選んでいい。
クロエ	カジノは緊張するけど……。新しいことに挑戦するのは、楽しそう……！
ムル	それじゃあ、行こうか。俺たちの忘れ物を取りに！
`},
{id:200202,title:"正義と祝祭のプレリュード",type:"login",characters:["東"],memo:"（２）東の魔法使いの休み方",date:"2019-12-20",
text:`ヒースクリフ	無事に西の祝祭を終えられたのはよかったけど、討伐の依頼はまだ山積みですね。
ネロ	今回は留守番といっても、こっちはこっちでやることがたくさんあるな。
	今日はどの討伐に出かけるんだ？
ファウスト	どこにも出かけない。ずっと魔法舎にいる。
シノ	は？目の前にこんなにたくさん任務があるって言うのに？
ネロ	なんだ、責任感の強いあんたらしくないな。
	明るい西の奴らに揉まれて、疲れちまったのか？
ファウスト	……確かに彼らは騒がしいし、疲れたことは否定しない。
	だが、それだけが理由じゃない。
シノ	じゃあ、何でだ。
ファウスト	きみたちの方こそ、聖なる祝祭で心も体も疲れている。
	自分では気づいていないみたいだが。
	責任感が強いのはいいことだ。しかし、時には休むことも必要だ。
	今日くらいは休みなさい。
ヒースクリフ	ファウスト先生……。
	もちろんです！今日はゆっくり休みましょう。おまえもちゃんと休むんだぞ、シノ。
シノ	わかった。けど、休んだ分だけ、明日から目を剥くくらい討伐してやるからな。
ファウスト	ああ。僕たちは僕たちの使命を果たそう。
ネロ	じゃあ、また明日から頑張りますか。
`},
{id:200203,title:"正義と祝祭のプレリュード",type:"login",characters:["北"],memo:"（３）北の魔法使いで褒め褒めゲーム",date:"2019-12-20",
text:`スノウ	よし、ようやく北の魔法使いが全員集まったようじゃ。それでは、ホワイトに注目。
ホワイト	今日はそなたたちに、大事な話がある。我らの今後に関わる話じゃ。
ブラッドリー	なんだよ、急に改まって……。
スノウ	北の国の魔法使いには、圧倒的に足りないものがある。
	他の国にはあって、我らだけにないものじゃ。
ミスラ	なんですか？殺した数が足りないとか？
オーエン	生クリームが足りない。まだ食べられるのに。
スノウ	我らに足りないもの、それはチームワークじゃ！
ホワイト	だから、今日はチームワークを磨くために『褒め褒めゲーム』をしようと思う。
スノウ	相手のいいところをひとつひとつ言っていくと、
	ほんわかして仲良くなれるらしいのじゃ！
ミスラ	へえ、それはいいですね。さようなら。
ブラッドリー	そんな茶番に付き合ってられるかよ。………あ？ドアが開かねえ！
スノウ	ほっほっほ。どうせこうなると思って、この部屋に魔法をかけたんじゃ。
ホワイト	ゲームが終わるまでこの部屋から絶対出さないもんね。
オーエン	……へえ。つまり、
	きみたちの息の根を止めてあげれば、ここから出られるってことだ。
スノウ･ホワイト	え？我らの話聞いてた？
ブラッドリー	気にくわねえ奴らを無理やり褒めるよりも、手っ取り早くていいじゃねえか。
	じじいども覚悟しやがれ！
ミスラ	ちょうどむしゃくしゃしてたので、気分転換になりそうですね。
スノウ	え、ちょ、まっ……。なんでこういう時ばっかり、団結力が強っ……。
スノウ･ホワイト	きゃーー！
`},

{id:200401,title:"奇跡と祝祭のプレリュード",type:"login",characters:["ムル","クロエ"],memo:"（１）勇気の手助け",date:"2020-01-07",
text:`クロエ	うーん。うーん……。
ムル	クロエ。同じところばかり歩いてどうしたの？
	イカれておかしくなっちゃった？
クロエ	違うよ！ヒースが祝祭で東の国へ行くって聞いたから、お守りを作ったんだけど……。
	いざ渡すとなると緊張してきちゃってさ。
ムル	そっかー！じゃあ、勇気が出る薬を飲む？
クロエ	えっ？そんな薬があるの？
ムル	あるよ。飲むだけで、なんでもできる気がしてくる魔法みたいな薬さ！
クロエ	（ムルの発明した魔法薬なのかな？怖いけど、ちょっと頼りたい……）
ムル、その薬買ってもいい？
	俺、勇気が欲しいんだ！
ムル	いいよ！どうぞ召し上がれ。
クロエ	いただきます……。
	これって……。
	お酒じゃん！わっ、頬が熱くなってきた！
ムル	あはは！でも、思い切りがよくなるだろう？
クロエ	うう、酔った勢いじゃないと渡せないなんて、自分が情けなくなっちゃうな……。
ムル	ほら、肩を落としていないで。早くしないとヒースが出発しちゃう。
クロエ	た、確かに！行ってきます！ありがとう、ムル！
ムル	本当はお酒じゃないよ、クロエ。瞬間的に、頬が熱くなるだけの薬。
	クロエの足を動かしたのはクロエの勇気だよ！
	行ってらっしゃい！
`},
{id:200402,title:"奇跡と祝祭のプレリュード",type:"login",characters:["中央"],memo:"（２）オズにマッサージを",date:"2020-01-07",
text:`リケ	オズ、ソファに座ってください。
オズ	何故。
リケ	マッサージをしたいんです。
	オズは中央の国の祝祭のときにみんなを守ってくれました。そのお礼をしたくて！
	頑張った人を労う肩揉みというものがあるって、ルチルに聞きました。
	僕、オズにやってみたいです。
オズ	そうか……。だが、私には必要がない。
リケ	無理しなくていいですよ！大人は肩が凝りやすいって教えてもらいましたから。
	ほら、早くそこに座って。
オズ	…………。
リケ	ええっと、まずは首の下を握りしめて、潰すんですよね。
	ネロがパンをこねる時みたいに……。
	……わあ！とっても固い！やっぱりオズ、肩凝ってますよ。
オズ	そこは骨だ。
アーサー	オズ様、ここにいらっしゃったのですね。リケは何をしているのだ？
リケ	アーサー様、カイン、こんにちは。今オズに肩揉みをしていたんです。
	オズの肩って、大きくて格好いいんですよ！
アーサー	オズ様に肩揉み……。
カイン	あはは。それは羨ましいな。リケ、良かったら俺の肩も揉んでくれないか。
リケ	いいですよ！オズが終わったら次はカインの番。
	その次はアーサー様の肩揉みをします！
アーサー	ありがとう、リケ。
	あの、オズ様。リケの番が終わったら、私もオズ様に肩揉みをしても良いでしょうか？
オズ	少しの間だけだ。
アーサー	ありがとうございます！それでは、精一杯頑張りますね。
`},
{id:200403,title:"奇跡と祝祭のプレリュード",type:"login",characters:["フィガロ","ルチル","ミチル"],memo:"（３）トカゲのお守り",date:"2020-01-07",
text:`ルチル	ミスラさんからもらったトカゲのお守り、どこに飾ろうかな〜♪
	枕元に置こうかな？いっそ机の真ん中にどーんと飾るのも……。
フィガロ	ルチル、入るよ。小説を返しに。うわっ、それ……呪いのアイテム？
	一瞬、間違えてファウストの部屋に来ちゃったのかと思ったよ。
ルチル	もー！フィガロ先生酷いです。
	中央の祝祭のときに、ミスラさんにもらったトカゲのお守りですよ。
	私も最初は気持ち悪いと思ってたけど、だんだんと愛着が生まれてきて……。
	この独特の表情も、可愛く思えてきちゃいました！
フィガロ	これを可愛いというなんて、きみ、なかなかいい趣味してるよねえ。
	相変わらず独特なセンスというか……。
ルチル	え？何か言いました？
フィガロ	あはは。なんでもないよ。
ミチル	兄様、そろそろお昼ご飯食べませんか？ネロさんが、今日はサンドウィッチを。
	うわっ！気持ち悪いトカゲ！夜、動き出しそうで怖いです……！
ルチル	もー！ミチルまで！せっかくミスラさんがプレゼントしてくれたのに！
`},
{id:200501,title:"親愛と祝祭のプレリュード",type:"login",characters:["カイン","リケ"],memo:"（１）練習のあとの一杯に",date:"2020-01-20",
text:`リケ	カイン。今日は、魔法の練習に付き合ってくれてありがとうございました。
カイン	こちらこそ。いい鍛錬になったよ。だが、魔法舎に帰る前に……。
	《グラディアス・プロセーラ》！
	これを俺と一緒に楽しまないか？
リケ	ティーポットとカップ……？
	甘い匂いがしますけど、一体何が入っているんですか？
カイン	ココアだよ。こっそり持ってきたんだ。あ、ちゃんと魔法で温めておいたからな。
リケ	ココア……？もしかして、チョコと水を混ぜた美味しい飲み物ですか？
	ネロにいただいたことがあります。
	でも、魔法舎に帰ってから飲むほうが良いんじゃないでしょうか。
	ここは寒いですし、冷めちゃうんじゃ……。
カイン	いや、ここで飲むのがいいんだ。騙されたと思って飲んでみろって。
リケ	……美味しい……。前に飲んだ時よりも、もっと美味しい気がします……。
カイン	だろ！寒い日に外であったかいものを飲むと、特別美味しく感じるんだ。
	これが寒い日のささやかな楽しみでさ。リケにも、教えてやりたかったんだ。
リケ	そうだったんですね……。ありがとうございます、カイン！
	ふふ。明日の練習が楽しみになりますね。
	明日はもっと、もっと、寒い日になりますように……。
カイン	うーん。それはちょっと困るかな……。
`},
{id:200502,title:"親愛と祝祭のプレリュード",type:"login",characters:["シノ","ヒースクリフ",""],memo:"（２）あなたのためのこたつを",date:"2020-01-20",
text:`ヒースクリフ	シノ。もうすぐ夕飯の時間だって―――。
	ん、何だろうこれ？テーブルに毛布がかけられてる……。
シノ	ヒース。
ヒースクリフ	シノ！毛布の中に潜ってたのか……。
	一体何をしていたんだ？
シノ	コタツだ。
ヒースクリフ	コタツ……？
シノ	賢者が言ってたんだ。机に毛布をかけて、
	みかんとかいうオレンジみたいなものを食べると、コタツになるらしい。
ヒースクリフ	そうなんだ……？
	よく分からないけど、賢者様の世界の文化なんだね。
シノ	ああ。これは、お前に入ってもらうために作った。
ヒースクリフ	えっ、どうして？俺がコタツに入ると何かあるの？
シノ	最近、寒いからな。お前が風邪をひいたら困る。ここで温まっていくといい。
ヒースクリフ	シノ……。俺のために、わざわざありが……。
シノ	ふふん、気にするな。ヒースは昔から軟弱だからな。
ヒースクリフ	…………。おまえは、いつもいつもそうやって……。
シノ	なんだよ。
ヒースクリフ	……もういいよ。あ。温かい……。なんだかほっとするな……。
シノ	だろ？南の国から帰ってきたら、賢者も入れてやろう。あいつ、きっと喜ぶぜ。
ヒースクリフ	そうだね。それまでに、オレンジも用意しないと。あと……。
	俺、コタツのこと結構好きかも。ありがとう、シノ。
`},
{id:200503,title:"親愛と祝祭のプレリュード",type:"login",characters:["スノウ","ホワイト","ブラッドリー","ネロ"],memo:"（３）餅つき係",date:"2020-01-20",
text:`スノウ	おお。ブラッドリー、ネロ。よく来てくれた。
	そなたたちにお願いしたいことがあっての。
ネロ	別に構わないよ。でも、なんで俺とこいつなんだ……？
ブラッドリー	依頼ってのは、財宝の強奪か？討伐か？
ネロ	はあ……。悪いが、そういうことなら俺は遠慮させてもらうよ。
スノウ	そうではない。おぬしらに任せたいのは、『餅つき』じゃ。
ブラッドリー	はあ？なんだそれ？
ホワイト	賢者の世界では『米』というものを叩くと、『餅』という物になるらしくてな。
	それがとても美味だと言っておった。
スノウ	ブラッドリーの腕力と、ネロの料理の腕があれば、最高の『餅』を作れるはずじゃろ？
ホワイト	我ら、それを賢者にプレゼントしたいのじゃ！
	手伝ってくれるかの？
ブラッドリー	くだらねえ……。んなこと、てめえらで勝手にやりゃあいいだろ。
	俺は降りるぜ。じゃあな。
スノウ	ブラッドリーちゃん……。本当に、行っちゃうの？
ブラッドリー	ああ？
ホワイト	我ら、老い先短いのに……。若者の笑顔が見たいっていう、楽しみ奪っちゃうの？
	ちょっと悲しいな……。
ブラッドリー	…………。
	ったく、仕方ねえなあ！このハンマーで『気持ち米』をぶん殴れば良いのか？
スノウ・ホワイト	わーい！ブラッドリーは良い子じゃの！
ネロ	……お前、相変わらずこういうのに弱いんだな。
ブラッドリー	なんだよ？
ネロ	いや、別に。
	さ。『餅』ってやつを作ろうぜ。賢者さんたちが南の国から帰ってくる前にな。
`},
{id:200601,title:"矜持と祝祭のプレリュード",type:"login",characters:["シャイロック","ラスティカ"],memo:"（１）身だしなみを整えて",date:"2020-01-31",
text:`ラスティカ	こんばんは、シャイロック。今夜も美味しいお酒をいただきに来たよ。
シャイロック	いらっしゃい。おや、髪が乱れているようですが……。湯上りですか？
ラスティカ	うん。髪を整えるのは、とても難しいね。
	クロエは今夜、出かけているから、自分でやってみようと思ったのだけれど。
シャイロック	それなら……。
	私がお世話をして差し上げます。どうぞ、ソファに腰掛けて。
ラスティカ	はは、くすぐったいな……。心地が良くて、このまま寝てしまいそうだ。
	シャイロックは、お世話が得意なんだね。
シャイロック	あなたはお世話がしやすいですね。
	何処かの誰かさんと違って、あちらこちらに動き回りませんし。
ラスティカ	……………。………すう。
シャイロック	おや。これからの乾杯を、楽しみにしていたのに。
	……お休みなさい、ラスティカ。
	あなたの大切な友人が、早く帰ってくるといいですね。
	どうぞ、素敵な夢を。
`},
{id:200602,title:"矜持と祝祭のプレリュード",type:"login",characters:["フィガロ","レノックス"],memo:"（２）夜の散歩",date:"2020-01-31",
text:`フィガロ	夜の散歩もいいものだね。レノ、誘ってくれてありがとう。
レノックス	フィガロ先生は運動不足みたいですから。
	少し体を動かした方がいいんじゃないかと思ったんです。
フィガロ	ええ、ひどいなあ。
	今日は授業を頑張ったのに。俺、すごく良い先生だったと思わない？
レノックス	そうですね。ミチルもフィガロ先生に褒められて、やる気を出していましたし。
	さっきルチルも、『優しくて、自慢の先生です！』って、言っていましたよ。
フィガロ	あはは！それなら良かった。まあ、俺は普段通りにやっただけなんだけどね。
レノックス	（嬉しそうだな……）
フィガロ	ねえ、レノ。気分がいいから、もっと遠くまで散歩に行かない？
レノックス	遠く……？どこまでですか？
フィガロ	中央の国の橋の近くとかさ。あそこから見える景色、綺麗だろう？
レノックス	本当に遠くですね……。構いませんが、夜明けまでには帰って来ましょう。
フィガロ	ありがとう。レノって本当に付き合いいいよねえ。
	それじゃあ、行こうか。どきどき☆大人だけの夜のお散歩に。
レノックス	何故かあまり気が進まなくなってきました……。
`},
{id:200603,title:"矜持と祝祭のプレリュード",type:"login",characters:["ファウスト","ネロ"],memo:"（３）二人で静かな晩酌を",date:"2020-01-31",
text:`ネロ	よし、誰もいないな。酒とつまみも、こんなもんでいいだろ。
ファウスト	ネロ……？
ネロ	うわっ。おいおい、いきなり出てきて驚かすなよ。
ファウスト	そっちが勝手に驚いたんだろう。おまえはこんなところで晩酌か。
ネロ	まあ、そんなところだけど。あんたこそ、何しに来たんだ。
ファウスト	僕は………。ただの散歩だ。
ネロ	散歩にグラスは必要ねえと思うけどな。
	あんたも晩酌をしに来たんなら、はっきり言えばいいのに。
ファウスト	うるさいな。晩酌は個人で楽しむものだ。
	だから、僕はここを去るべきだと思っただけだ。
	じゃあな。あまり飲み過ぎるなよ。
ネロ	あー……実はさ。少しつまみを作り過ぎちまって……。
	よかったらあんたも食っていかないか？
ファウスト	は？だが……。
ネロ	もちろん、無理にとは言わねえけどさ。ただ、ひとりが好きなやつが
	２人並んで、飲んだところで騒がしくもならないだろうし。
ファウスト	……確かにそうかもしれないな。なら、少しだけいただいていこう。
	ただし、シノには秘密にしてくれよ。
ネロ	はは……。あいつは食い意地が張っているからな。
	知られたら大変なことになりそうだ。
	それじゃあ、乾杯。
ファウスト	乾杯。
	……たまにはこんな夜も悪くない、か。
`},

{id:201901,title:"星降る空のメモワール",type:"login",characters:["フィガロ","レノックス"],memo:"（１）レノックスの願い事",date:"2020-07-02",
text:`フィガロ	やあ、レノ。こんなところで何をしてるの？
レノックス	フィガロ先生。短冊を書いていました。
	賢者様のいらっしゃった元の世界の七夕という文化だそうで。
	細長い紙に自身の願いを書いて、笹の葉というものに吊り下げると、
	その願いが叶うと言われているそうです。
フィガロ	へえ。ロマンチックな文化じゃないか。
	レノはどんな願い事を書いたんだ？どれどれ……。
	「賢者様が危険な目に遭いませんように」
	「ファウスト様が心安らかな日々を過ごせますように」
	「フィガロ先生が健康でいられますように」
	「ルチルの夢が叶いますように」
	「ミチルが健やかに成長できますように」
	……あはは、面倒見のいいレノらしい願い事ばかりだね。
	でも、これにはひとつだけ問題があるよ。
レノックス	問題ですか？願い事が多すぎた、とかでしょうか。
フィガロ	違う違う。今書いてあるのは他の誰かの幸せを願うような事ばかりだろう。
	レノ自身の願い事はないの？
レノックス	……ああ、確かにそうですね。
	ですが、俺はいま十分満たされているので、特に願いはありません。
フィガロ	うーん、真面目だなあ……。じゃあさ、こういうのはどうかな。
	紙とペンを貸してもらえる？
	「レノがもっと強欲になりますように」
	「レノがもっとはじけた日々を過ごせますように」
レノックス	もっと強欲で、もっとはじけた……？
フィガロ	よし、これで万事解決だ！
	というわけで、レノが皆の幸せを祈る分、俺もレノの幸せを祈らせてもらうよ。
レノックス	フィガロ先生が願うと、本当に叶ってしまいそうなのが怖いですね……。
`},
{id:201902,title:"星降る空のメモワール",type:"login",characters:["ヒースクリフ","クロエ","ルチル"],memo:"（２）新発見",date:"2020-07-02",
text:`クロエ	ヒース。賢者様に教えてもらった、七夕の短冊って書いてみた？
ヒースクリフ	うん。「シノの身長が伸びますように」って、書いておいたよ。
クロエ	えっ、ヒースってシノの身長のことをそんなに気にしてたんだ。
ヒースクリフ	いや、俺は別に……。
	おまえが書いた短冊なら、絶対に願いが叶うはずだって、シノに頼まれたから……。
ルチル	……………………。
クロエ	あれ？なんか……ルチルが俺たちのことじっと見てるね……？
ヒースクリフ	う、うん。何かあったのかな……。
ルチル	クロエ。ヒースクリフ。
クロエ・ヒースクリフ	はい！どうしたの？
ルチル	二人とも、背中合わせで立ってみてもらってもいいかな？
クロエ	ヒースと背中合わせ？もちろん大丈夫だけど……。
ヒースクリフ	……こんな感じでいいかな。ルチル、これがどうしたの？
ルチル	やっぱり……。二人って同じ身長なんだね！ほら、並ぶとぴったり同じだよ。
クロエ	あ……本当だ！
ヒースクリフ	全然、気づかなかった……。
ルチル	ふふ。歳の近い兄弟みたいで素敵だね。クロエがお兄さんで、ヒースが弟さんかな？
クロエ	あはは。ヒースが弟っていうのはちょっと分かるな。
	守ってあげたくなる時があるもんね。
ヒースクリフ	なんだか恥ずかしいな……。
	……あれ？ルチル、クロエの隣に並んでもらってもいい？
ルチル	もちろん。でもどうして……。
	………あ！
クロエ	ルチルも同じ身長だね！三人で一緒だなんて、すごいなあ。
ヒースクリフ	はは。こんな偶然ってあるんだね。
ルチル	よーし。じゃあ、私、一番上のお兄さんやりまーす！
クロエ	え……！？じ、じゃあ、俺は二番目のお兄さん！
ヒースクリフ	ん？もしかして、なにか始まった……？
`},
{id:201903,title:"星降る空のメモワール",type:"login",characters:["ミスラ","オーエン"],memo:"（３）オーエンの企み",date:"2020-07-02",
text:`オーエン	ねえ、ミスラ。手を貸してよ。今度借りは返すからさ。
ミスラ	嫌ですよ、面倒くさい。
オーエン	はは……。まだ何も聞いていないのに断るの？
ミスラ	眠いし、気が乗らないんですよね。
	まあ、でも少しくらいなら話を聞いてやってもいいですよ。
オーエン	……今、双子は仲違いをしているんだ。
	スノウがどれだけ名前を呼んでもホワイトはあいつの前に姿を現さない。
	いつも気持ち悪いくらい一緒にいたくせに、くだらないことで揉めて、
	殺し合って、また別れて、あいつらは今どんな気持ちだと思う？
ミスラ	さあ、知りませんけど。
	つまり片割れでいる今なら仕留めやすいから、手伝ってほしいってことですか。
オーエン	違うよ。まだ話は終わってない。
ミスラ	はあ……。
オーエン	スノウがホワイトの機嫌をとるために、オリヴィア・レティシアの、
	カーケンメテオルを作るんだって。
	ふふ。オリヴィア・レティシアは特別だって噂だ。きっと口が爛れて、
	骨がとけそうなくらいとても甘いカーケンメテオルになるだろうね。
ミスラ	おり……？かーけ……？
オーエン	それを横取りしたい。けど、ブラッドリーとオズはあっちについてる。
	おまえがいたほうが手っ取り早いだろ。
ミスラ	…………。はあ、そうなんですか。
オーエン	ホワイトとやっと仲直りが出来ると思ったのに、
	目の前でその希望を食べられるスノウ……。
	ねえ、楽しそうじゃない？
ミスラ	はあ、そうなんですか。
オーエン	…………。ちゃんと僕の話聞いてる？
ミスラ	あなたが何を言ってるのか、よくわからなくて……。
	あと、今日はあたたかいなあと思って……。
オーエン	…………。
ミスラ	…………。
オーエン	《クアーレ・モリト》
ミスラ	《アルシム》
`},

{id:203001,title:"勇敢な開拓者のバラッド",type:"login",characters:["シノ","ネロ","ラスティカ"],memo:"（１）『地下宮殿に行きたかったのに』作詞作曲ラスティカwithネロ",date:"2020-11-06",
text:`シノ	おい、ネロ。ファウストのやつを見なかったか。
ネロ	いや、見てないけど……。
	先生なら部屋に引きこもってるんじゃねえの。何か用事でもあるのか？
シノ	南と北の魔法使いたちが、地下宮殿の調査に行ったらしい。
ネロ	地下宮殿？へえ、そんなもんがあるのか。
	で、シノはそれに行きたかった訳だ。
シノ	だって、地下宮殿だぞ？響きだけで、格好いい。
	それに……。
ネロ	宮殿っていうくらいだ。金目のもんがたくさん眠ってそうだしな。
	行きたくなる気持ちはわかるよ。
シノ	強い魔物がたくさんいるはずだからな。
	オレの名をあげるチャンスだったかもしれないのに。
シノ・ネロ	ん？
シノ	……だからファウストに、次に地下宮殿の調査の依頼が来たら、
	オレを絶対連れて行くように言っておくつもりだ。
ネロ	やる気があるのは悪いことじゃねえけど、あまり先生を困らせるなよ。
ラスティカ	じゃあ、僕は
	『地下宮殿に行きたかったのに』の歌を作ってシノを応援させてもらおうかな。
ネロ	うお！婿さん、いつのまに！？
シノ	いいな。それならきっと、ファウストもやる気になる。
ネロ	おまえ、よく自然に受け止められたな……。
ラスティカ	こちらこそ、みんなのお役に立てるなら光栄だよ。
	でも、残念だ。
	オーエンがいてくれたら、僕の作った歌を一緒に合唱してくれたかもしれないのに。
ネロ	まじで？
シノ	ラスティカ、すぐにファウストの部屋にいこう。
ラスティカ	そうだね。僕の演奏を待ってくれているお客様をお待たせしてはいけないから。
ネロ	……夕飯はガレットにしてやるか。
`},
{id:203002,title:"勇敢な開拓者のバラッド",type:"login",characters:["オズ","カイン","ヒースクリフ"],memo:"（２）カイン的オズとの距離の詰め方と、ヒースのハードル",date:"2020-11-06",
text:`ヒースクリフ	賢者様たち、今頃どうしてるだろう……。
カイン	そろそろ、南の国についた頃じゃないか？
ヒースクリフ	わっ、カイン。ごめん、俺、独り言を言ってたみたいで……。
カイン	おまえが心配になる気持ちもわかる。
	地下宮殿なんて、いかにも危険が待ち受けてそうな響きの場所だしな。
	だが、南と北の魔法使いが同行しているんだ。
	もしも何か起きたとしても、きっと賢者様を守ってくれるはずだ。
ヒースクリフ	……そうだよね。ありがとう、カイン。
カイン	どういたしまして。なあ、ヒース。
	これからオズの訓練を受けるんだが、良かったらおまえも参加しないか？
ヒースクリフ	え……。それって、俺も参加していいの？
カイン	もちろん！みんな大歓迎さ。体を動かせば気分転換にもなるだろ。
ヒースクリフ	みんなって……オズ様も？俺、実はオズ様とあまり話をしたことがないんだ。
	だから、少し緊張するというか……。
カイン	心配しなくても良いよ。
	オズに「あんたは最高だ！」って、伝えて、肩を叩けばすぐ打ち解けられる。
ヒースクリフ	本当に……？
オズ	…………。
ヒースクリフ	あ、オズ様……！
カイン	ヒース、今だ！「あんたは最高だ！」
ヒースクリフ	そ、そんな急に無理だよ。
カイン	うーん、じゃあ……。
	「よう、最近どうだ？」くらいならいけるか？
ヒースクリフ	あともう少し控えめなら頑張れるかも……？
オズ	…………。
	若者は賑やかだな……。
`},
{id:203003,title:"勇敢な開拓者のバラッド",type:"login",characters:["アーサー","ムル","クロエ"],memo:"（３）小さくなってサプライズ",date:"2020-11-06",
text:`クロエ	南の国の任務、寒い場所に行くって言ってたけど、大丈夫かな。
	一応、服は厚めの布地で作ったけど……。
	あれ？こんなお菓子、俺の部屋にあったっけ……？
ムル・アーサー	クロエ。
クロエ	ムルとアーサーの声がしたけど、気のせい？
ムル	気のせいじゃないよ！
	《エアニュー・ランブル》！
クロエ	わあっ！もしかして、魔法で小さくなってたの？
ムル	大正解！クロエに気づかれないように、こっそりお菓子を差し入れてみたんだ！
アーサー	私はムルに誘われたんだ。楽しいことをするから一緒にやらないかと。
クロエ	そうなんだ。サプライズ感があって、とっても楽しかったよ。
	ありがとう二人共！
ムル	……そうだ。いいこと考えた。
アーサー	いいこと？
ムル	南の国から賢者様たちが帰ってきたら、小さな姿でお迎えするんだ！
ほら、普通に出迎えるのじゃつまらないでしょ？
	小さな姿でお茶を淹れたり、机の隅でダンスをするんだ！
	それに、肩の上で飛び跳ねればマッサージになる！
アーサー	それは、素晴らしい案だな。
	きっと賢者様も驚いてくださるだろう。
クロエ	うん、俺もやってみたい！
ムル	それじゃあ、三人で練習を始めよう！
アーサー・クロエ	了解！
ムル	さっそく小さくなるよー！
	《エアニュー・ランブル》！
`},
//31-40
{id:203101,title:"1stanniversary",type:"login",characters:["北"],memo:"（１）北まほでカーケン・メテオル",date:"2020-11-20",
text:`スノウ	我らの賢者ちゃん！おめでとう！
ホワイト	異界からやってきた賢者ちゃんには、今日まで大変な日々であったことじゃろう！
スノウ	しかし、幾多の危機を乗り越え、賢者ちゃんは無事に生き延びました！
ホワイト	生きてて偉い！賢者ちゃん！
スノウ	生き延びておめでとう！賢者ちゃん！
スノウ・ホワイト	ここまで一緒に頑張ってくれてありがとう〜〜！！
スノウ	お礼に式典でも振る舞われる、北の国のお祝い料理
	カーケン・メテオルを披露するのじゃ！
ホワイト	スタジオのミスラちゃんどうぞ！
ミスラ	ミスラです。賢者様、おめでとうございます。
	今からブラッドリーが空に放るパンの種をオーエンが魔法でカラッと焼きます。
ブラッドリー	おう。見てろよ、賢者。
	これを食っておけば、怪我知らず、風邪知らずで、間違いなしだからな。
	行くぞ、オーエン！
オーエン	いいよ。
ブラッドリー	せーの！
オーエン	《クーレ・メミニ》
ミスラ	はい、火が出ました。
ブラッドリー	おい、ちょっと火力が強すぎやしねえか？
オーエン	お祝いなんだしこのくらいの方がいいでしょ。
	賢者様、おめでとう。
	《クアーレ・モリト》
ブラッドリー	いや、焦げてる焦げてる！
オーエン	賢者様、おめでとう。
	《クアーレ・モリト》
ブラッドリー	いや、焦げてる焦げてる！
ミスラ	消し炭になってしまいましたね。これは俺が食います。好物なんで。
スノウ・ホワイト	最後にみんなで〜！せ〜の！

オーエン	ふふ……。さあ、どうかな。問題。この羊はなんて言っているでしょうか？
羊	メエ。
オーエン	１、ブランシェット家にとりついて、城中を毛玉だらけにしてやる。
	２、中央の国の騎士は、羊より臆病で弱いって言いふらしてやる。
	３、お尻がかゆい。
シノ	３。
ヒースクリフ	３。
オーエン	ちっ……。正解。
カイン	続いての問題！
オーエン	この羊はなんて言ってるでしょうか。
羊	メエ。
オーエン	１、ヒースクリフの恥ずかしい姿を目撃して興奮してる。
	２、シノの情けない姿を見て、嘲笑してる。
	３、お尻がかゆい。
シノ	３。
ヒースクリフ	３。
オーエン	ちっ……。正解。
シノ	そろそろ尻を掻いてやれよ。
オーエン	僕が羊の尻を掻くわけないだろ。
ヒースクリフ	あの……。俺がやろうか？羊がかわいそうだし……。
カイン	掻くまで、かゆい以外のこと発信しないぞ、その羊。
オーエン	うるさいなあ、もう。わかったよ。ほらほら。
羊	メエメエメエ。
カイン	続いての問題！
オーエン	この羊はなんて言ってるでしょうか。
シノ	かゆくなくなった。
ヒースクリフ	かゆくなくなっただと思う。
オーエン	正解。
カイン	シノとヒースクリフ、全問正解！
シノ・ヒースクリフ	イエーイ。
カイン	全問正解した感想は？
シノ	ヒースの恥ずかしい姿に興奮する羊は大鎌の錆にしてやるから出てこい。不敬だぞ。
ヒースクリフ	賢者様の世界では、不思議なものが楽しまれているんだなと思いました。
カイン	ありがとう！出題者のオーエンもありがとうな。晶！いや、賢者様！これからも俺たちを……。
シノ	よろしく。
ヒースクリフ	よろしくお願いします！
オーエン	ふふ……。この問題出すやつ、猫でもやってあげようか？
カイン	これ気に入ったんだ？
シノ	気に入ったのか。
ヒースクリフ	気に入ったみたいだね……。
`},
{id:205505,title:"2nd anniversary",type:"login",characters:["オズ","アーサー","ミスラ","ルチル"],memo:"（５）トークバラエティ",date:"2021-11-19",
text:`アーサー	賢者様！賢者様と出会ってから、たくさんの思い出が増えましたね。
	そのどれもが、特別な宝物のように輝いています。
ルチル	賢者様と出会って、色々な経験をして、私も少しだけ、成長できたような気がします。
	これからもよろしくお願いしますね。
アーサー	それでは、日ごろの感謝を込めて、賢者様にトークバラエティをご覧いただきたいと思います！
	司会は私、アーサー・グランヴェル。
ルチル	アシスタント、ルチル・フローレスでお送りいたします。
アーサー	それでは、今週のゲストにご登場いただきましょう！
オズ	こんばんは。
ミスラ	こんばんは。
ルチル	今週のゲストは、オズ様とミスラさんです〜！拍手〜！
アーサー	さっそく、お二人に質問していきたいと思いますが、お二人が出会ったのはいつ頃ですか？
オズ	……
ミスラ	オズ。２０００年前……？
	俺はまだ生まれていませんよ。
オズ	……１０００年前……
ミスラ	もっと早く会ってたと思いますけどね。
アーサー	なるほど！１０００年から２０００年の間ということですね。
ルチル	私も大ざっぱな方ですが、壮大な大ざっぱさですねー！
アーサー	初対面の時の、お互いの印象はどうでしたか？
	オズ様もミスラも、強い魔力の持ち主ですから、さぞ、印象深い出会いだったかと思いますが。
ミスラ	そうですね。今はやれないけど、いつか必ずやってやると思いました。
オズ	覚えていない。
ミスラ	本当にむかつくな……。
オズ	赤い髪をしていた……？
ミスラ	今でもしてます。
アーサー	それでは、最後に、二人の仲良しの秘訣を教えてください！
オズ	……仲良しの秘訣……？
ミスラ	……仲が良かったこと、一度もないんですが……？
ルチル	でも……。トークバラエティでは、よくある質問なんですって。
アーサー	では、こうしましょう。もしも、仲良しだと仮定して、何が仲良しの秘訣だと思いますか？
オズ	縄張りが離れている。
ミスラ	俺の方が背が高い。
ルチル	ありがとうございます！お二人の秘訣を見習って、私たちも仲良くしていきたいですね！
アーサー	そうだな！ルチルとだったら、縄張り争いも楽しそうだけどな。さてさて、まだ聞きたいことはたくさんありますが……。
	あっという間にお別れの時間がやって参りました。
ルチル	ええー！？
オズ・ミスラ	どうも。
アーサー	オズ様、ミスラ。最後に、賢者様に向かって、コメントをお願いします。
オズ	賢者よ。このトークバラエティを見て、望郷の哀愁も癒されたことだろう。おまえにはまだ、こちらの世界の住人でいてもらう。よろしく頼む。
ミスラ	賢者様、あなたの好きな、バラエティをやってやりましたよ。どうです？嬉しいですか？これからも文句を言わずに、俺のために働いてくださいね。
アーサー	以上、トークバラエティでした！賢者様、これからも何卒……。
オズ・ルチル・アーサー・ミスラ	よろしくお願いします！
`},


{id:206001,title:"銀宿る卵屋のファンタジア",type:"login",characters:["アーサー","クロエ","ラスティカ"],memo:"（１）夢の卵のお洋服",date:"2022-02-20",
text:`ラスティカ	さすがクロエだ。あっという間に上達していくね。
クロエ	ありがとう！でも、もうちょっと弱火にしたほうが綺麗な黄色になるのかな。
アーサー	こんにちは。クロエ、ラスティカ。
クロエ	アーサー。こんにちは！
アーサー	クロエが料理をしていたのか。卵とバターの香りについ釣られて来てしまった。
ラスティカ	そのお気持ち、とてもよく分かります。
	僕もキッチンを包むこの美味しそうな香りに踊りだしたくなっていますから。
クロエ	あはは、でも踊りだすのは料理が終わってからにしてね。
	実は今、ラスティカのために薄焼き卵を作る練習をしてるんだ。
アーサー	なるほど。ラスティカはお腹が空いているのか。
ラスティカ	もちろん、その卵は後で美味しくいただくつもりではありますが違います。
	先程朝食をいただいたばかりですから。
クロエ	俺たちはね。これで服を作りたいんだ。
アーサー	薄焼き卵で服を……？
ラスティカ	はい。今日夢を見たのです。
	夢の中でバターの香りが漂うふわふわの卵に包まれて僕はすやすやと眠っていました。
	そう、それはとても幸せな夢だったんです。
クロエ	それを聞いてピンときたんだ！
	薄焼き卵を生地にした服を作れたら、その幸せな夢を再現できるんじゃないかって。
アーサー	…………。
クロエ	あっ……。ごめん、驚かせちゃった？
	俺たち少し変なことを言っちゃったかな……。
アーサー	いや、そんなことはないよ。想像していたんだ。
	卵で作った服はどんなものになるのかと。
	クロエが作るのなら、卵の優しい黄色を活かした、とてもおしゃれな服になるのだろうな。
ラスティカ	ええ。見て楽しめる、着て楽しめる、そして食べても楽しめる、
	とても素晴らしい服になるでしょうね。
クロエ	わー！そんなに期待されると、なんだか緊張して……。
	ああっ、卵が少し焦げちゃった。
アーサー	あはは、少し焦げていたっていいじゃないか。
ラスティカ	ええ、デザインのいいアクセントになりそうです。可愛らしいな。
クロエ	確かにそうかも……？って、あああ～！今度は破けちゃった……。
	……卵の服を作れるまではまだ先が長そうだけど、
	二人が楽しみにしてくれているなら俺、頑張るよ！
アーサー・ラスティカ	ああ、応援しているよ。
`},
{id:206002,title:"銀宿る卵屋のファンタジア",type:"login",characters:["オズ","リケ","ルチル"],memo:"（２）ゆで卵と生卵",date:"2022-02-20",
text:`ルチル・リケ	…………。
オズ	何をしている。
ルチル	わあ、オズ様！こ、こんにちは。
リケ	もう、オズ。突然現れて驚かせないでください。
オズ	おまえたちは……。卵を見つめているのか。
ルチル・リケ	はい！
オズ	……空腹なのか。
リケ	それは……。半分、正解です。
ルチル	少しお腹が空いたので、リケと一緒に卵を茹でていたんです。
	夕飯の前に軽いおやつに食べようと。
リケ	でも、茹でた卵を、うっかり生の卵と同じ場所に置いてしまって……。
ルチル	だから、二人でどれが茹でた卵で、
	どれが生の卵なのかを見極めようとしていたんです。
オズ	わかったのか。
リケ	わかりません。
オズ	…………。
ルチル	茹でた卵も、生の卵も、ほとんど見た目が同じで、
	これはかなり難易度が高い問題ですね。
オズ	ならば……。
リケ	駄目です、オズ……！不思議の力は使いません。
	不思議の力を使ってどちらが、茹でた卵か、生の卵かを判別するのは簡単かもしれません。
	ですが、僕は僕自身の力で、どちらがどちらなのかをわかってあげたいのです。
	それが、僕がこの卵を生み出した責任だと思うので……。
オズ	……そうか。
ルチル	でも、そろそろ本格的にお腹が空いてきたね。
	このまま卵を見つめていても埒が明かないし……。
オズ	ならば……。
ルチル	ええ。もう覚悟を決めて、
	卵を手にとって自分のおでこで割ってみてもいいかもしれません！
リケ	そんな……！？おでこで割るのは危険すぎる気が……。
	もし生の卵だったら大変なことになりますよ。
ルチル	だけど、もし茹でた卵だったら、普通に割るよりも嬉しい気持ちにならないかな？
オズ	…………。
リケ	あっ、オズ。どうしたのですか、急に卵をこんこんしたりして……。
オズ	これは茹でた卵だ。
ルチル・リケ	えっ！？
オズ	これは生の卵だ。
ルチル	そう言えば、聞いたことがあったかも。
	茹でた卵と生の卵は、叩いた音で判別ができるって……。
リケ	オズすごいです！とっても博識なのですね。
	これはお礼の茹でた卵です。オズも僕たちと一緒に食べましょう。
オズ	…………。これは生の卵だ。
`},
{id:206003,title:"銀宿る卵屋のファンタジア",type:"login",characters:["シャイロック","レノックス"],memo:"（３）早起きと夜更かし。エッグノックを添えて",date:"2022-02-20",
text:`レノックス	うん、いい焼き加減だな……。
シャイロック	おや、レノックス。おはようございます。
レノックス	シャイロック、おはよう。
	珍しいな、あなたがまだ日が昇りきらない時間に起きているなんて。
シャイロック	そうですね。昨夜バーを閉めたあと、読書に耽ってしまって。
	気づいたらこの時間だったんです。
	あなたは鍛錬の帰りのようですね。
レノックス	今日は早くに目が覚めたから、魔法舎の周りを少し走ってきたんだ。
シャイロック	…………。もしかして、その大量の目玉焼きを今から食べるのですか？
レノックス	ああ、卵を食べると精力がつくからな。
	だが、大量といっても卵を５個使っているくらいで……。
	……いや、少し多いのか？
シャイロック	ひとによると思いますよ。卵は体作りに必要な栄養が豊富ですからね。
	どうぞ、たくさん召し上がって。
レノックス	そうか。では、遠慮なく……。
シャイロック	…………。
レノックス	……ごくん。
シャイロック	素晴らしい。一口で食べてしまいましたね。
レノックス	こんなにじっと見つめられながら卵を食べる機会はなかなかないな……。
シャイロック	すみません。つい、少し珍しくて。ワイルドで素敵でしたよ。
	……そうだ。そちらの卵、私も少しわけていただいていいですか？
レノックス	構わないが、シャイロックも腹が減っているのか。
シャイロック	いえ。私はこれから休むので、エッグノッグを作ろうかと思いまして。
	甘さを控えめにして、いい香りのブランデーを垂らして、ゆったり味わってから眠るんです。
	きっと体も温まって、いい心地で休めますからね。
	あなたにも一杯お作りしましょうか？
レノックス	エッグノッグか……。とても美味そうだが、俺は起きたばかりだからな。
シャイロック	ふふ、そうでしたね。では今度、私のバーにいらしたときにお作りいたしましょう。
`},

{id:212601,title:"5thanniversary",type:"login",characters:["中央"],memo:"（１）中央で絶景カフェin赤坂?名古屋?",date:"2024-11-17",
text:`アーサー・カイン・リケ	賢者様！
オズ	賢者よ。
中央の魔法使い	記念日おめでとうございます！
アーサー	どんな困難にあっても、賢者様が見守ってくださることが、私の支えになっています。
	今日も、そしてこれからも、賢者様と共に過ごせること、心より感謝いたします。
カイン	いつも俺たちに、真っ直ぐに向き合ってくれて、本当にありがとう。
	あんたのその真摯な姿勢に、日々救われてる。改めて、礼を言わせてくれ。
リケ	神の使徒としても、賢者の魔法使いとしても。
	少しずつ、成長している自分を感じています。
	今日はきっと、賢者様の努力も報われる日です！記念日を楽しんでくださいね！
オズ	おまえは日々、よくやっている。
	だが、役目に縛られすぎず、自身の心に従い、時には休息も取るように。
晶	みなさん……。ありがとうございます！
	この世界に来て、戸惑うことも多かったですが……。
	今では、この魔法舎が、もうひとつの居場所のように感じています。
アーサー	そうおっしゃっていただけて、とても嬉しいです！
	私たちも、魔法使いを導いてくださるのが、晶様で本当に良かったと思います。

{id:215301,title:"6thanniversary",type:"login",characters:["中央"],memo:"（１）中央と賢者(爪・文字・故郷・過ごす時間)",date:"2025-11-14",
text:`アーサー	賢者様、記念日、おめでとうございます！
	この輝かしい日を迎えられたのは、賢者様がいつも私たちを導いてくださったおかげです。
	賢者様と共に歩んだ日々は、私の誇りであり、かけがえのない宝物です。
カイン	賢者様、記念日おめでとう！
	ここまで来られたのは、晶が俺たちを信じてくれたからだ。
	これからも、晶となら、どんな困難も乗り越えられる。そう確信してるよ。
リケ	賢者様、記念日、おめでとうございます。
	賢者様が僕たちに希望の光を与えてくださったから、この素晴らしい日を迎えられました。
	賢者様の優しさと勇気に、心から感謝しています。
オズ	賢者よ。よくぞここまで歩んできた。これからも私がおまえの力となってやる。
カイン	オズの挨拶、いつもかっこいいよな！
リケ	それ！僕も思っていました。
アーサー	私もだ。いつか言ってみたい。
	よくぞここまで歩んできた。
カイン	よくぞここまで歩んできた。
リケ	よくぞここまで歩んできました。
オズ	…………。
	本題へ。
アーサー	そうでしたね！
	今日は記念日ということで、みなで賢者様との記憶を語り合いたいと思う。
	特別な思い出については、今までも何度か話したことがあったから……。
	今回はささやかな、こんなことでもなければ、話さなかったような思い出話がいいな。
カイン	いいな！晶との思い出なら、いくらでも出てくるぜ。
リケ	僕も賢者様との思い出はたくさんあります！ささやかなものなら、もっとたくさん！
オズ	…………。
カイン	オズ、聞いてたか？
オズ	聞いている。
リケ	聞いていないのかと思いました。
アーサー	熟考してくださっていたのですよね。嬉しいです！
	オズ様の思い出は最後に伺うことにして、まずは私から語らせていただきますね。
	以前、賢者様が私の爪を見て、『いつもぴかぴかですね』と褒めてくださったことがあるのです。
	王宮では侍従が私の爪を手入れしてくれるのですが、実は、じっとしているのがもどかしくて……。
	でも、賢者様にそう言われて、先日、こっそり侍従に方法を習い、
	賢者様の爪のお手入れをさせていただきました！
	おかげで、自分の爪の手入れも、充実した学びの時間になりました。
カイン	へえ！そんなことがあったのか。アーサーらしいな。
	晶もよく見てる。喜んだだろうな。アーサーに手入れしてもらえて。
リケ	素敵ですね！爪の手入れなんて、考えたこともありませんでした。
	アーサー様の細やかな心遣いは、いつも勉強になります。今のお爪もぴかぴかですね！
カイン	本当だ！
アーサー	あはは！ありがとう。
オズ	…………。
アーサー	あっ。オズ様。どうぞ、ご覧になってください。
オズ	ほう……。
リケ	それでは、僕からも、賢者様についての記憶をお話ししますね。
	この前、賢者様から賢者様の世界の文字について教えていただきました。
	そうしたら、なんと、賢者様の世界では、
	『漢字』『ひらがな』『カタカナ』という三種類の文字があるそうなんです！
カイン	三種類？どういうことだ？
リケ	組み合わせて使うのだそうです。僕は……とても驚きました。
	いえ、慄きました。
	一種類の文字だけでも大変なのに、賢者様は三種類も扱えるなんて！
オズ	誰にでもできることではあるまい。賢者の世界でも、特別な能力なのだろう。
アーサー	私も賢者様が書かれた文字を拝見したことがあります。
	美しい曲線や、力強い線が組み合わさった、神秘的な文字でした。
カイン	よく使い分けられるよな。もしかして、身分によって使う文字が違うとか？
	例えば……。王様用、騎士用、平民用、みたいな。
リケ	神に捧げる用、人に伝える用、自分の心に刻む用、かもしれません。
アーサー	あるいは、音を表す用、意味を表す用、両方を合わせた用、などもあるかもしれないな。
リケ	オズはどう思いますか？
オズ	…………。敵用、味方用、自分用。
カイン	仲間だけで使う言葉があるのはいいな。
	敵用から味方用の言葉に変えてくれたら、やったぜ、って気持ちになれそうだ。
オズ	……従えたということか？
カイン	友達になったのさ！じゃあ、次は俺が話そう。晶の記憶だよな。
	この前、任務の帰りに、晶と地元の近くを通ったんだよ。
	そしたら子供の頃よく泳いでた川が見えてさ。
	晶にその話をしてるうちに、だんだん懐かしくなっちまって……
	久しぶりに地元の川で泳いだんだ。晶と一緒に。
	子供の頃の思い出の場所に、晶がいる。なんだか、不思議で嬉しい気分だったな。
アーサー	素敵な思い出だ。
	故郷の風景に賢者様がいらっしゃるのを、想像するだけでも胸が温かくなる。
リケ	自分の大切な場所や、大好きな場所に一緒に来ていただきたい気持ち、
	僕もわかります！
オズ	…………。
	私の城にも来たことがある。
カイン	そうだったな！それがあんたと賢者様の思い出か？
オズ	…………。それもあるが……。
	…………。
	先日、賢者が私の部屋に来た。
	話が終わると、私は黙っていた。賢者は、何か話していた。
	言葉が尽き、賢者は少し落ち着かない様子だった。
	部屋を見回したり、居住まいを正したりした。
	だが、しばらくすると、だんだんと静かになった。
	暖炉の火を見つめながら、表情と呼吸が少しずつ穏やかになっていくのがわかった。
	やがて、うとうととし始めた。私はただ、それを眺めて……。
	…………。
	その時間が、ずっと続けばいいと思った。
アーサー	…………！
	オズ様、素敵です！穏やかで美しい時間だったのですね。
	私も、静かな時をご一緒に過ごしてみたかったです。
リケ	僕も賢者様と、そんなふうに、一緒にいられたら嬉しいです！ですが……。
	オズは相変わらず話すのが遅いです。
	賢者様のように、うとうと、眠ってしまうかと思いました。
アーサー	オズ様のお声は心地いいものな。
カイン	この時間がずっと続けばいいだなんて、あんたもそんなこと思うんだな。
オズ	……そうだな。
リケ	今もですか？
オズ	今はそうでもない。
リケ	もう｡せっかくなのですから、素敵な言葉で終わらせればいいのに。
オズ	よくぞここまで来た。
カイン	その台詞、格好いいって自分でも思ってたんだな。
アーサー	こんな風に、これからも、
	賢者様と一緒に、ささやかで、素敵な思い出を作っていきたいですね。
カイン	ああ。まだまだ、晶と過ごす時間はたくさんあるさ。
リケ	はい！これからも賢者様とご一緒したいです！
オズ	賢者よ。これからも、賢者の魔法使いが、おまえと共にあった記憶を刻もう。`},
{id:215302,title:"6thanniversary",type:"login",characters:["南"],memo:"（２）南と賢者(緊張・瞳・箒散歩・病気の知識)",date:"2025-11-14",
text:`ルチル	賢者様、記念日おめでとうございます。
	今日まで一緒に過ごせたこと、本当に、奇跡みたいに嬉しいです。
	賢者様がいてくださったからこそ、私たちはどんな時も、前を向いて歩いてこられました。
	これからも、賢者様と一緒に、素敵な時間を作っていきたいです。
	仲良く頑張りましょうね！
ミチル	賢者様、記念日おめでとうございます！
	ボクたちがここまで来られたのは、賢者様のおかげです！
	いつも、励ましてくれて、ボクたちを信じてくださって、
	本当にありがとうございます。
	これからも、ボクたち、南の魔法使いと仲良くしてください！
レノックス	賢者様、記念日おめでとうございます。
	ここまで共に歩んでこられたこと、心から感謝しています。
	これからも、あなたの力になれるよう、精一杯努めます。
	仲良くしてください。
フィガロ	賢者様、特別な記念日おめでとう。
	きみと過ごした日々は、俺にとって、かけがえのない宝物だよ。
	これからも一緒に、笑ったり、困ったりしながら、楽しい毎日を重ねていこう。
	仲良くしてね。
ルチル	せっかくの機会ですから、賢者様との思い出を話しませんか？
	こんな時でもないと話さないような、ささやかだけど、素敵な思い出話とか。
ミチル	ボク、あります！いつか、話そうと思っていたんですが、この機会にお話ししますね。
	賢者様が、魔法の授業を見に来てくれた時のことです！
	よし、失敗しないように頑張ろう！って気合を入れて、少し緊張してた時……。
	ふと、賢者様を見たら、
	賢者様も、ボクとおんなじような顔で、見守ってくれてたんです。
	それで、ほっとして……。
	少しだけ、恥ずかしかったけど、とても、嬉しかったです！
ルチル	わかるわかる！嬉しいし、可愛いよね！
	私たちに共感して、一緒に意気込んでくれてる、あの、ちょっと緊張してる顔。
フィガロ	ミチルたちが頑張ってる時、賢者様も一緒に力んでるんだよね。
レノックス	わかります。一生懸命、見守ってくれてる時の、あの表情ですね。
フィガロ	可愛いよね、賢者様。
レノックス	俺はささやかな思い出というと、賢者様を箒に乗せて飛ぶ時のことを思い出すな。
	最初は緊張して、体がこわばっているんだが、だんだんと、リラックスしてくれる。
	体を預けてくれるのがわかって、それがなんだか……。
	家族や兄弟のようだなと感じる。
ルチル	信頼してくれてるんだなって、嬉しくなりますよね！
レノックス	そうなんだ。後は、急に、風が吹いた時、髪が顔にかかったから、
	そっと、避けたことがあったんだが。
	そうしたら、瞳が見えて……。きれいで、印象深かったな。
	また、風が吹いて、ぎゅっと体が緊張してしまうのも、
	ちょっと、いいなって思ってる。
フィガロ	わかるなあ。箒に乗せる時、前に乗せるか、後ろに乗せるか、いつも、迷うんだよね。
ミチル	後ろに乗せるの、ちょっと怖くないですか？落としちゃいそうで……。
ルチル	でも、前に乗せると、賢者様の表情が見えないから、
	それはそれで、心配になりますよね。
フィガロ	あー、そうだね。大丈夫かなって、つい、気になっちゃうよね。
ルチル	私は以前、賢者様を自分の前に乗せていた時、
	風が吹きつけて顔が痛いっておっしゃっていました。
	だから、私の方を向いてもらって、乗ってもらったことがあるんですけど。
ミチル	えっ！？兄様の箒、速いですよね！？後ろ向きで乗るの、怖くなかったのかな。
ルチル	最初は怖がってたかも！でも、向かい合ってると、なんだか面白くなっちゃって。
	二人で笑いあってたら、ゆっくり飛びたい気分になって、
	のんびり、遠くまで飛んで帰ってきました。
	二人だけの秘密の話もできて、楽しかったなあ。それが私の、ささやかな思い出です。
フィガロ	いいね、それ。のんびり飛ぶのも、たまには悪くないよね。
	俺は賢者様が、風邪気味って言うから、薬を飲ませて、
	部屋で眠るのを見守っていた時のことかな。
	賢者様は病気の知識が結構あって。
	熱中症とか、応急処置の基礎を、意外と知ってるから、感心しちゃった。
	手洗いの重要性とか、傷口を消毒する理由とかもね。

	賢者様は動物が好きだよね？って尋ねた。
ホワイト	出だしから意地が悪そうじゃ。
スノウ	見事に性格が悪いのう。
オーエン	賢者様が好きですっていうから、
	僕のケルベロスの喉の奥に魚の骨が刺さっちゃったみたいだから……。
	頭を突っ込んで、様子を見てあげてよって言った。
	動物に優しい賢者様なら、そのぐらいできるよねって。
ミスラ	それでどうなったんです？
オーエン	覚えてない。
ブラッドリー	マジかよ……。
スノウ	賢者ちゃん、首ついてるかの？
オーエン	さっき会ったから大丈夫だよ。ミスラは？ささやかな話ある？
ミスラ	俺が厄災の傷で眠れなくて、賢者様に寝かしつけてもらっていた時のことです。
	羊の数を数えろと言われても、眠れなかったので、空間の扉を開いて、
	究極進化超覚醒羊を招いたんですよ。
ブラッドリー	なんだそいつら……。
オーエン	初めて聞いた……。
ミスラ	どこかの村にいた羊に、俺が勝手に名前をつけました。
	賢者様から聞いたゲームのカードのクラスアップをイメージして。
スノウ	それで、どうなったのじゃ？
ミスラ	部屋中が究極進化超覚醒羊だらけになりました。
ホワイト	それだけか。
ミスラ	それだけです。
ブラッドリー	マジでささやかじゃねえかよ。北のミスラが……。
オーエン	トリにされた意味、まったく、わかってないよね。
ミスラ	ささやかがいいって言うから。
	じゃあ、賢者様が究極進化超覚醒賢者様になった話もします？
スノウ・ホワイト	聞きたい、聞きたい！
スノウ	賢者ちゃん、これからも！
ホワイト	こうして、楽しい思い出を、いっぱい重ねていこうね！
ミスラ	これからも俺たちを……。
北の魔法使い	よろしくお願いします！
`},
{id:215401,title:"空の下のティータイム",type:"login",characters:["ミスラ","ブラッドリー","ファウスト","ムル","ミチル"],memo:"～白雪舞うある日の一杯～",date:"2025-12-12",

{id:215501,title:"魔法舎のクリスマスソワレ",type:"login",characters:["アーサー","ミチル"],memo:"（１）サンタさんの正体は？",date:"2025-12-17",
text:`ミチル	うーん。このプレゼント、一体誰がくれたんだろう？
アーサー	どうしたんだ、ミチル。あっ、その大きな靴下は……。
ミチル	アーサー様。もしかして、この靴下のこと知ってるんですか？
	これ、ボクの部屋のドアノブに吊るしてあったんです。
アーサー	では、ミチルのところにもサンタクロースがやってきたのだな。
	今朝、それと同じものが、私の部屋のドアノブにもかけてあったよ。
ミチル	えっ、アーサー様の部屋にも？
アーサー	ああ。中には、私の欲しかったものがたくさん詰まっていた。
	今は送り主にお礼を伝えたくて、探しているところだ。
ミチル	わあ、ボクと一緒です！
	ボクの靴下の中にも、プレゼントがいっぱい入っていました。
	兄様か、フィガロ先生、レノさんがくれたのかなって思っているんですけど、
	みんな今、どこかに出かけてるみたいで……。
	アーサー様は、プレゼントをくれたサンタさんに、心当たりはありますか？
アーサー	ああ。実はこれから、その御方……。いや、その方々の部屋を訪ねる予定なんだ。
	もしかしたら、ミチルにプレゼントをくれたのも、その方々かもしれないぞ。
	一緒に行ってみないか？
ミチル	えっ。行きたいです！誰のお部屋ですか？
アーサー	スノウ様とホワイト様のお部屋だ。
	……というのも昨晩、任務のことで
	スノウ様たちの部屋を訪ねてみたら、なぜか扉が少しだけ、開いていてな。
	お二人が、オズ様とフィガロ様とこんな話をしているのを聞いてしまったのだ。
	『赤い服を着て髭を生やし、子供たちの部屋に向かおう』と。
ミチル	それって……！
	賢者様が教えてくれた『サンタさん』の特徴ですよね。
ミチル	もしそのお話が本当なら……。
	フィガロ先生たちがサンタさんの格好をして、この靴下を置いてくれたってことですか？
アーサー	その可能性は、大いにありうる。
ミチル	で、でも、待ってください。
	フィガロ先生やスノウ様たちはノリノリでやってくれる気がしますけど……。
	オズ様がサンタさんの格好なんて、してくれるんでしょうか？
アーサー	もちろんだ。オズ様はお優しい方だからな。
	私たちが喜ぶと思えば、お髭も生やしてくださる。
ミチル	サンタさんの赤い服も？
アーサー	着てくれたに違いない！帽子もかぶっていたことだろう。
ミチル	ええ……！？
アーサー	一目でいいから、見てみたかったな。
	ミチルも、私の推理が合っているかどうか、一緒に確かめに行かないか？
ミチル	はい、ぜひ！
	それに、もしフィガロ先生たちが
	サンタさんの姿になってくれていたなら、ボクも一回見てみたいです。
アーサー	では、真相を確かめに行きつつ、
	サンタさんの正体がわかった暁には、一緒におねだりしてみよう。
	さあ、そうとなれば、スノウ様とホワイト様の部屋を目指して、出発だ！
ミチル	おー！
`},
{id:215502,title:"魔法舎のクリスマスソワレ",type:"login",characters:["ミスラ","シノ","フィガロ"],memo:"（２）いい子の基準は？",date:"2025-12-17",
text:`ミスラ	……それが本当なら、聞き捨てならないですね。
シノ	だろ？まあ、その爺さんがこっちの世界にいればって話だけどな。
フィガロ	やあミスラ、シノ。珍しい組み合わせだね。二人で何を話してるの？
シノ	フィガロ。こいつにサンタクロースのことを教えてやってたんだ。
フィガロ	サンタクロース？
	それって確か、賢者様の世界にいる不思議なおじいさんのことだよね。
	世界中を駆け回って、いい子にはプレゼントをあげるって話だ。
ミスラ	はい。フィガロはその人が魔法舎に侵入してきたら、どうやって殺しますか？
フィガロ	ストップストップ、途端に物騒だな。なんでそんな話になるの？
シノ	どこの誰だかわからない爺さんが、夜中に家に上がり込んで、タダで物をよこすんだ。
	十分、不審者だろ。
ミスラ	しかもその人、寒い所から来るらしいじゃないですか。
	絶対北の魔法使いですよ。気をつけた方がいいです。
フィガロ	なるほど……？まあ、こちら側の感覚だとそうなるのも仕方ないのかな。
シノ	しかも、そのサンタってやつは、『いい子』を狙ってくるんだぞ。
	もし魔法舎に来るなら、迷わずヒースのもとに向かうはずだ。
	主君の部屋へ忍び込むなんて、従者として許せない。返り討ちにしてやるぜ。
フィガロ	あはは。そうやって、周りの人を大切にできるきみも、十分『いい子』なんじゃない？
	シノの部屋にも、サンタさんが遊びに来てくれるかもね。歓迎してあげたら？
ミスラ	何言ってるんですか。その人が最初に来るのは、俺の部屋ですよ。
シノ・フィガロ	え？
ミスラ	俺、いい子ですから。
シノ	あんたのどこがいい子なんだ？ミスラがいい子なら、ヒースは神になるぞ。
ミスラ	さっき、スノウとホワイトが、俺に言ってきたんです。
	『いい子じゃのう』って。
フィガロ	うーん。お二人は誰にでもそう言うからなあ。
シノ	ミスラ、何かいいことでもしたのか。
ミスラ	さあ？あのときは確か、
	『お疲れ様パーティをするから、中庭を壊さないように』って頼まれたんです。
	よくわかりませんが、『わかりました』って答えておきました。
フィガロ	へえ。確かに、それはいい子かもね。
シノ	ちゃんと最後まで、中庭が無事だったらな。
ミスラ	でしょう。
フィガロ	そっか。じゃあ、ここにいる三人とも、『いい子』ってことになるんだね。
シノ・ミスラ	は？
フィガロ	だってそうだろう？
	俺は、南の国のお医者さんとして、少しは貢献しているつもりだよ。
	そんな俺がいい子じゃなかったら、サンタさんとは話し合いが必要だと思うな。
ミスラ	ありえませんね。あなたがいい子だなんて、何千年経とうとありえません。
シノ	そもそも、いい歳した大人が、『子』とか言って恥ずかしくないのか？
フィガロ	そんなこと言ったら、ミスラだって似たようなものじゃないか。
シノ	確かに。こいつ、千年以上は生きてるんだった。
ミスラ	でしょう。
フィガロ	でもまあ、流石に大人気なかったかな。なら、俺は『いい人』ってことで手を打とう。
	いい人にしてればきっと、お酒とかをくれる
	大人用のサンタさんが来てくれるかも。楽しみに待っていようかな。
`},
{id:215503,title:"魔法舎のクリスマスソワレ",type:"login",characters:["ヒースクリフ","シャイロック","レノックス"],memo:"（３）幹事のためのプレゼントを",date:"2025-12-17",
text:`ヒースクリフ	ふう、お腹いっぱいになっちゃった。
	今日のランチも美味しかったね。
レノックス	ああ、温かいシチューが体に染みるな。
シャイロック	今日の食事はネロではなく、カナリアが作ってくれたんですよね。
ヒースクリフ	うん。
	ネロが明日の仕込みに集中できるよう、カナリアさんが代わってくれたんだって。
レノックス	明日の仕込み……。ああ、『お疲れ様パーティ』のことか。
シャイロック	賢者様の世界の文化にちなんだ、様々な料理を用意してくれているそうですよ。
	楽しみですね。
ヒースクリフ	他にも、俺たちみんなで楽しめるような企画を、たくさん考えてくれてるんだって。
シャイロック	ムルとカイン、ファウスト、賢者様の４人が中心になって、
	企画してくれているんでしょう？
	珍しい組み合わせだと思いましたが、賢者様以外は、ムルのくじ引きで決めたとか。
ヒースクリフ	俺も、ファウスト先生が企画に参加してるって聞いた時は驚いたよ。
	そういう経緯だったんだね。
レノックス	ファウスト様がいてくれて心強いと、賢者様も仰っていた。
	あの方は周りへの気配りが細やかだし、責任感も強い。
	視野も広いから、意見の漏れを防ぎ、
	誰しもが納得のいく場を作ってくださることだろう。
ヒースクリフ	うん。俺もそう思う。
	それにカインもいるから、きっと会議もスムーズなんじゃないかな。
	カインは年上の人がいても気後れしないし、その場にいる全員が、発言しやすい
	空気を作るのが上手だもの。
	俺とそんなに歳が変わらないのに、すごいよね……。
	騎士団時代に、多くの人を率いていたんだなって感じるよ。
シャイロック	ふふ。そんな素晴らしいお二人と、寛大なお心を持つ賢者様を、うちの猫が
	困らせていなければいいのですが。
	誰にも思いつかないような、アイデアメーカーとしての腕は抜群ですが、
	ムルの発想は少々過激ですからね。
レノックス	きっと大丈夫だ。皆で知恵を出し合いながら、全員が安心して楽しめるような場を
	用意してくれることだろう。
ヒースクリフ	全員が楽しめるような場、か……。
	もしかしなくても、総勢２２人のパーティの企画って、
	きっとすごく大変なことだよね。
	何か俺たちにも、手伝えることってないのかな……。
レノックス	そういうことなら、俺たちで差し入れを持っていくのはどうだ？
	ファウスト様たちは今夜、最後の仕上げに、夜遅くまで会議をするそうだ。
	確か……月が昇る頃、談話室に集合するのだと。
シャイロック	名案ですね。では私は、疲れがほどけるようなドリンクを。
レノックス	俺は、小腹が空いたときの食事を見繕っておこう。
ヒースクリフ	じゃあ俺は、食後のデザートを持っていこうかな。
シャイロック	ふふ。私たちからのサプライズプレゼント、きっと喜んでくださることでしょう。
レノックス	では、後ほど。
シャイロック	夜更けと共に。
ヒースクリフ	談話室前に、集合で！
`},

{id:10101,title:"スポットの印象（１）",type:"personal",characters:["①"],memo:"オズ",
text:`晶	オズはずっと、北の国で暮らしていたんですよね。
オズ	ああ。
晶	だけど、ここにこんな魔法の跡があるってことは、
	たまに他の国に遊びに行ってたんですか？
オズ	…………。遊びに出向いたわけではない。
	世界のすべてを手に入れようとして、あらゆるものをなぎ倒しながら進んだ。
	それだけだ。
晶	……そうだったんですね……。
オズ	一度は草も残らぬほど焼き尽くした土地だが、いつの間にか、
	裂けた地を残して元に戻っている。
	無駄なことをしたと、つくづく思い知らされるようだな。
晶	……やっぱり、世界征服しようとしたことを、悔やんでいるんですか？
オズ	悔やみなどしない。ただ……。
	この世界を愛していたことも、この世界を知ろうとしたこともなかった。
	よく知りもしないものを、
	手中に収めて支配しようとしたことを、時折、滑稽に思う。
	このあたりの地形が、
	このような姿をしていたことも、あの頃は気にもとめなかったからな。
晶	今はどんな風に見えるんですか……？この景色は……。
オズ	この場所のような断層は危険だ。走り回る子供が、落ちてしまいそうだからな。
`},
{id:10102,title:"スポットの印象（２）",type:"personal",characters:["アーサー"],memo:"オズ",
text:`アーサー	《パルノクタン・ニクスジオ》！
晶	わっ……！？
	オズの爪痕に小さい稲妻が落ちた……！！
アーサー	……賢者様！？も、申し訳ありません！そばにいらっしゃったのに気付かず……。
	お怪我はありませんでしたか？
晶	いえ、離れてたから大丈夫ですよ。でも、ちょっと驚きました。
	何をしていたんですか？
アーサー	実は……、オズ様の魔法の痕に、オズ様と同じような魔法を使ってみていたのです。
晶	同じ魔法……。アーサーも、魔法で天気を変えたりできたんですか？
アーサー	私には、まだそのような強い魔法は使えません。
	今のは、稲妻に似てはいましたが、全く別の、とても弱い魔法です。
	魔法で出来た亀裂を見ながら、同じ傷がつくように真似してみたのですが……。
	まだまだでしたね。
晶	（お手本を見て練習してたのか。漢字の書き取りみたいだな……）
`},
{id:10103,title:"スポットの印象（３）",type:"personal",characters:["リケ"],memo:"オズ",
text:`リケ	こういう辺境の地は、僕がいた教団のあった場所に似た気配がします。
	静かで、質素で、少し不便だけれど、
	自然の中で、敬虔な人々が、同じ仕事を繰り返して暮らしている……。
晶	リケの住んでいたところは、こんな風景だったんですね。
	懐かしくなっちゃいますか？
リケ	そうですね、少しだけ。でも、本音を言うなら……。
	せっかく出かけるのですから、もっと賑やかな場所が良かったです。
晶	そうなんですか……？リケがそんなこと言うなんて、なんだか意外ですね。
リケ	この頃、人がたくさんいる場所が楽しいのです。
	知らないものがたくさんあって、知らない話がたくさん聞けて……。
	……これは良くないことでしょうか？
	喧騒の中にいては、やはり堕落してしまうでしょうか……。
晶	そんなことないですよ。
	色々見聞きして、見識を深めるのは、俺の元いた世界では大切なことでしたよ。
リケ	そうですか？なら良かった。
	大きな街へ行く任務の時は、是非お手伝いさせてくださいね！
`},
{id:10104,title:"スポットの印象（４）",type:"personal",characters:["ミスラ"],memo:"オズ",
text:`ミスラ	これがオズの爪痕ですか。
晶	はい。この辺りに住む人たちには、そう呼ばれてるみたいですね……。
ミスラ	まあ、たしかに彼の魔法でしょうね。オズの癖がありますよ。
晶	癖？魔法を使う時の癖ってことですか？
ミスラ	ええ。喰らったことがあるからわかります。
	オズは相手が倒れていても、しばらくは攻撃を続けるんですよ。容赦無く。
	だから地面がこんなになるんです。
	一発、大きなのを当てただけじゃ、ここまでにはならないでしょうから。
晶	……それってつまり、確実にトドメを刺す的な……？
ミスラ	そうですね。
晶	今のオズからは想像できないな……。
	でも、そんな攻撃を受けて生きているミスラも、
	やっぱり相当強い魔法使いなんですね……。
ミスラ	当然です。
	……それにしても、ふてぶてしい魔法の痕を見ていると、なんだか苛々してきたな。
	ここに、ミスラの爪痕も作っておきましょうか。
	こんなのよりも、もっと長くて深い痕を残してやりますよ。
晶	ま、ま、待ってください……！今ここで、ですか！？
	そんなにいきなり、危ない魔法は……！
ミスラ	《アルシム》
`},
{id:10105,title:"スポットの印象（５）",type:"personal",characters:["ブラッドリー"],memo:"オズ",
text:`ブラッドリー	これがオズの魔法の痕だって？えげつねえ割れ方してやがんな。
晶	ブラッドリーでもやっぱりそう思うんですね。
ブラッドリー	ビビってるわけじゃねえが、これを食らったときのこと想像すると、
	痛ててててって気になるぜ。
晶	転んだ人の痣を見るみたいな気分ですか？
ブラッドリー	そうそう。
晶	地面がこんなになる魔法が当たって、痛ててで済むものですか……？
ブラッドリー	いや、無理無理。死ぬの死なねえのって感じだよ。
	実際、俺も何度か死にかけてるしな。
晶	当たったことあるんですか……！？
ブラッドリー	うっせえな。次は避けられるよ。
晶	別にそこは責めてないです……。
	こんな魔法を受けて生きてるなんて、そっちの方が不思議ですよ。
ブラッドリー	なんだ、褒めてんのか。あはは、まあな。
	俺が昔、オズに魔法を食らった別の場所も、崖がえぐれて跡が残っててよ。
	そこでも、やっぱり人間がありがたがって、オズの伝承だなんだって言ってたな。
	見るたびムカついてたのを思い出しちまうぜ。
`},
{id:10106,title:"スポットの印象（６）",type:"personal",characters:["クロエ"],memo:"オズ",
text:`クロエ	うわーっ！すっごいね！？本当に地面が割れちゃってる！
	これ、オズ様が魔法を使った跡なんだよね？
	ほんとに？魔法でこんなになることってあるの？言い過ぎじゃなくて？
~~~~~~~~~	~~~~~~~~~
選択	はい。
晶	はい……。本人からもそう聞いています。
クロエ	じゃあ、本物なんだ！魔法って凄いんだなあ。
	これじゃあ、人間が魔法使いを怖がるのも、仕方ないことかもしれないよね。
~~~~~~~~~	~~~~~~~~~
選択	若干盛ってるかも。
晶	そこまで言われると、若干盛ってるような気がしてきました……。
クロエ	あ、やっぱりそう？俺は盛っててもいいなあ。本当だった方が怖いもんね。
~~~~~~~~~	~~~~~~~~~

晶	クロエも魔法使いなのに、すごく驚くんですね。
クロエ	だって地面が裂けるほどの力だよ！？魔法舎には強い魔法使いが多いけど、本当は、
	こんなことできる魔法使いは少ないと思うな。
晶	ラスティカも、けっこう魔力の強い魔法使いでしたよね。
	こういう魔法は教わらなかったんですか？
クロエ	ラスティカは強いみたいだけど、のんびりぼんやりしてるからなあ……。
	一緒にいてもあんまり実感が湧かないかも。
	西の国だと、魔法使いや魔物に襲われることってなくて、
	人間に怒られる方が多かったし。
	攻撃魔法が使えても、使う機会がなかったと思うな。
晶	そうだったんですね。
	北の国の魔法使いたちに、慣れすぎちゃってたかもしれません……。
クロエ	あはは！この世界に来たばっかりで、
	あんな人たちに囲まれてたんじゃ仕方ないことだよ。
	比べることじゃないかもしれないけど、俺は細かい作業をしたり、ものを作ったり、
	したりする魔法の方が得意だな。
	もしも、こんなに強い魔法を教わることになったら、少しためらっちゃうかも。
	真面目さや慎ましさからじゃないよ。
	強い力があったら、使ってみたくなりそうで、怖いからさ。
`},
{id:10107,title:"ブレイクタイム（１）",type:"personal",characters:["①"],memo:"オズ",
text:`オズ	…………。
晶	オズ。何をしているんですか？
オズ	景色を見ていた。
晶	景色……。何か面白いものや、興味深いものがありましたか？
オズ	いや。
晶	なら……、何か考え事ですか？
	地面に亀裂が入るような魔法を使ったことに感慨深くなったり……？
オズ	いや。ただ景色を見ていた。
オズ・晶	…………。
晶	……失礼に感じたらすみませんが、
	オズって、少し、ぼんやりしている時がありますよね。
オズ	…………。いつか、フィガロに言われたことがある。
	心を悩ませすぎる者は長く生きられない。私が鈍重なのは長寿の証だと。
	性分だな。
晶	（……たしかに、象とか亀とか、長生きの動物に似てるかもしれない……）
`},
{id:10108,title:"ブレイクタイム（２）",type:"personal",characters:["①"],memo:"オズ",
text:`オズ	賢者。どこへ行く気だ。
晶	オズ。散歩みたいな感じです。亀裂に沿って歩いてみようと思って。
オズ	…………。付き合おう。
~~~~~~~~~	~~~~~~~~~
晶	いい景色ですよね。
	俺の住んでいたところは、こんなにひらけた場所はなかなかなくて。
オズ	そうか……。あまり淵に近付きすぎるな。危険だ。
晶	あっ……、すみません。
オズ	…………。
無口に並んで歩いていく。
不意に、オズが魔法を使って、地面に生えていた草の葉を元に引き寄せた。
オズ	…………。ピー。
晶	…………！？草笛……。
	この世界でも草笛するんですね……。
	というか、オズでもそんな遊びをするんですね……。
オズ	…………。
	気に入らなかったか？おまえといると、
	つい、子供と一緒にいる気分になる時がある。
晶	あはは。なんだかそんな気はしてました。
	長生きのオズにとっては、俺なんて、赤ちゃんみたいなものかもしれないですね。
`},
{id:10109,title:"ブレイクタイム（３）",type:"personal",characters:["アーサー"],memo:"オズ",
text:`アーサー	ようやく、本物のオズ様の魔法の跡地が見られて嬉しいです。
	以前、私が見に行った「オズの足痕」と呼ばれる泉は、明らかな偽物だったので。
晶	オズがやったことになっているけど、
	実際は自然現象の場合も多いと、言ってましたもんね。
	でも、わざわざ見に行くなんて、地面に亀裂が入るようなオズの魔法は、
	アーサーも見たことないほどレアなんですか？
アーサー	強い魔法を見せていただいたことはもちろん何度もありますよ！ですが……。
	泉に出かけたのは、しばらくオズ様に会えずにいて、
	寂しかったせいもあるかもしれません。
	オズ様が訪れたという場所を、私も見てみたいと思ったのです。
	少しでもオズ様を近くに感じられたらと。
晶	（そうか……。
	　オズと離れ離れになった時のアーサーは、まだ幼かったんだもんな……）
	俺も元の世界にいた時、憧れの人の聖地巡礼をしたことがあるので、
	なんとなく、気持ちわかりますよ！
	好きな人のゆかりの地って、テンション上がりますよね！
アーサー	おっしゃる通りです！
	この景色を見ていると、オズ様の勇姿が目に浮かぶようで、気持ちが高揚します。
	みなで訪れることが出来たおかげで、
	この国でのお気に入りの場所が、また一つ増えました！
`},
{id:10110,title:"スポットの思い出（１）",type:"personal",characters:["①"],memo:"オズ",
text:`晶	アーサーは、オズの爪痕の景色が気に入ったみたいですね。
オズ	私の魔法など、飽きるほど見ただろうに。
晶	でも、これほど強くて古い魔法の跡は、
	オズのお城の近くにはなかったって言ってましたよ。
	やっぱり、
	自分の住んでる家のそばで、こんな魔法を使うのはためらう感じですか？
オズ	いや。城の周辺にも、似たような場所は多くあった。
	あの城を住処にして長い。
	私の命や土地を狙うものが現れるたび、魔法で追い払うことが多かった。
晶	そうなんですか？じゃあ、アーサーが知らなかったのは、どうして……。
オズ	幼いアーサーは命知らずだ。
	崖でも、崩れかけた岩でも、毒の沼でも、躊躇なく近寄る。
	何度か危ない目にあって、近隣にあった魔法の跡は、ひとつずつ埋め立てた。
晶	え……！？大変だったんじゃないですか……？
オズ	大変だったな……。
	破壊など容易い。地を裂く魔法など、大したことではない。
	何かを創造し、修復するほうが、何倍も難しいものだ。
`},
{id:10111,title:"スポットの思い出（２）",type:"personal",characters:["シャイロック"],memo:"オズ",
text:`シャイロック	なるほど、ここもオズの爪痕と呼ばれているのですね。
晶	シャイロックは、別の場所にあるオズの爪痕を見たことがあるんですか？
シャイロック	ええ。西の国にもたくさんありますよ。偽物も、西では特に多いでしょうね。
晶	偽物……。本物と偽物の区別ってつきますか？
シャイロック	そうですねえ。見た目で判別するのは難しいかもしれません。
	けれど、年々増えて行ったものですから。
	古くからある爪痕なら本物だろうと、予想はできるでしょうか。
晶	そうか……。シャイロックも長生きだったんでしたね。
シャイロック	猫が爪を研いだ柱を覚えていないように、
	どの土地にどんな魔法を使ったのかなんて、オズ自身も把握していないでしょうね。
晶	猫の爪研ぎ……。そんな可愛い感じの景色じゃないですけど……。
シャイロック	ふふ。私もぞっとしますよ。ですが、オズにとってはその程度のことでしょう。
	私も、私が飲み干したワイン瓶が、世界各地に残って伝承になっていたら……。
	私が飲んでもいない瓶さえも、
	私が飲んだものとして、誰かの大切な何かになっているとしたら。
	なんだか嫌な気分がするかもしれません。
晶	うーん……。たしかに、自分の知らないところで、
	自分のことを、あれこれ言われるのは嫌かもしれないです。
シャイロック	同感です。
	オズにとって、人間の世界は、少々居心地の悪いものなのかもしれませんね。
`},
{id:10112,title:"オズへの印象（１）",type:"personal",characters:["アーサー"],memo:"オズ",
text:`晶	凄い亀裂だな……。オズの魔法って、本当に凄まじいですね……。
アーサー	そうでしょう？賢者様にそう言っていただけると、
	私まで嬉しくなってしまいますね。
晶	（単純に褒めてるだけじゃないんだけど……）
	アーサーは、オズの魔法をいつも喜びますよね。
	こういう景色を見て、どう思うんですか？
アーサー	強くて格好いいなと思います！私も早く、オズ様のような魔法使いになりたいとも。
晶	なるほど……。オズの魔力が怖くなったりはしないんですか？
アーサー	怖い？いいえ、オズ様を怖いと思ったことは一度もありません。
晶	そうなんですね……。子供の頃から見てると、慣れるものなのかな。
アーサー	慣れもあるかもしれませんが、
	きっと、オズ様の優しい人柄を知っているからだと思いますよ。
	このような魔法を理由もなく、無闇に振るうお方ではないとわかっていれば、
	恐ろしくはないでしょう？
晶	そう言われると、たしかに……。
アーサー	オズ様はお優しい方です。
	地を割く稲妻も、私や賢者様に向けられることは決してありません。
	これほど強い魔力の宿る先が、正しく力を使われるオズ様だということは、
	とても頼もしく心強いことだと感じています。
`},
{id:10113,title:"オズへの印象（２）",type:"personal",characters:["カイン"],memo:"オズ",
text:`カイン	オズは無口だけど、根はいいやつだよな。
	名誉のために他人を傷つけたりもしないし。
	あの伝説のオズだっていうから、初めはさすがに身構えたけどさ。
	今は、仲間でいられることを嬉しく思ってるよ。
晶	童話の登場人物のような人ですもんね。
	でも、このオズの爪痕みたいな、物凄い魔法を見ると、少し怖くなりませんか？
カイン	怖さも多少はあるかもしれないが……。
	それよりも、やっぱり俺は、圧倒的な力が格好いいと感じるかな。
	これほどの魔力があれば、どんな災いからも大切な人たちを守れる。
	〈大いなる厄災〉との戦いでも、オズの魔法は壮絶だった。
	あの力がなければ、言い伝えの通りに世界は滅んでいただろう。
晶	たしかに、強い力に対抗するためには、強い力が必要なのかもしれません……。
カイン	怖がることはないさ。オズの人柄は、晶だって感じてるだろ。
	それにしても、普段は寡黙な奴が、
	いざという時に凄まじく強いってのは、なんていうか、絵になるよな。
	俺はつい喋りすぎちまう。今からでも、無口な感じに挑戦してみようかな？
晶	あはは。カインはカインのままで、十分格好いいですよ。
カイン	おっ。やっと笑った。
	地を割るほどとはいかないかもしれないが、
	あんたを守るって言ったこと、有言実行できるくらいには俺も頑張らないとな。
`},
{id:10114,title:"オズへの印象（３）",type:"personal",characters:["リケ"],memo:"オズ",
text:`晶	リケはオズのこと、どういうふうに思っていますか？
リケ	恐ろしい噂も耳にしますし、神の正しい導きが必要だと感じますね。
晶	オズと直接会っていても、やっぱり恐い噂は本当だと思いますか？
リケ	……オズは無口ですから、誤解を生むことがあるかもしれません。
	アーサー様もそう話していましたけど……。
	でも、教団では、オズは悪い魔法使いなのだと教わりました。
	火のない場所に煙は立たないとも言いますし、
	彼が正しいかどうかは、まだ決められません。
晶	たしかに、地面を切り裂くような強い魔法は、
	一部の人を恐がらせてしまう力かもしれませんね……。
リケ	僕はオズの力を恐れてはいませんよ。
	こんなに強い魔法を使えたら、気持ち良いかもとは思いますが……。
晶	リケ……。
リケ	こ、こほん！
	もちろん、僕の魔法は僕のためではなく、迷える人々を導くためにあるものです。
	オズも、せっかく強大な力を持っているのですから、
	もっと人々のために使うべきだと思いますね。
`},
{id:10115,title:"オズへの印象（４）",type:"personal",characters:["オーエン"],memo:"オズ",
text:`晶	オーエンも、オズとの付き合いが長いんですよね。
オーエン	付き合いなんてないよ。目障りなだけ。
晶	またそんな言い方して……。オーエンは、オズのこと、どう思っているんですか？
オーエン	僕より強いから嫌。最近は特に嫌。
晶	ど、どうして最近は……？
オーエン	距離が近すぎる。
	しょっちゅう顔を合わせるし、
	討伐だの、依頼だのって、面倒なことを押し付けて脅してくる。最悪。
晶	あれは、脅しじゃなくて、あくまでお願いですよ……。
	協力してくれて、俺は凄く助かってますし……。
オーエン	知らないよそんなこと。
	北の国にいた時も気に食わなかったけど、
	構いに行かなければ構ってはこなかったのにさ。
晶	嫌だって言いながら、構いには行ってたんですね……？
オーエン	嫌な顔されるのって楽しいし、
	誰かが腹をたてるところを見るのってちょっと興奮するでしょ。
晶	（ピンポンダッシュみたいだな……）
`},
{id:10116,title:"オズへの印象（５）",type:"personal",characters:["フィガロ"],memo:"オズ",
text:`フィガロ	これがオズの爪痕かあ。あはは、また景気のいい割れ方してるね。
晶	（なんだか呑気な感想だな……）
	フィガロはオズと昔馴染みなんですよね。
	やっぱり、付き合いが長いと慣れちゃって、こういうのを見ても驚きませんか？
フィガロ	いやいや、驚く驚く。ゾッとしちゃうよ、こんなの。
	俺が食らったんじゃなくてよかったなーって心底思うよ。
晶	そうですか……？
	そういう割には、たまに、オズの扱いがぞんざいな気がしますけど……。
	フィガロは、オズのこと、どう思っているんですか？
フィガロ	どうって言われると難しいな。
	兄弟弟子でもあるし、強いていうなら、弟分みたいなものかな？
	初めて会ったころは、無愛想で魔力が強いから、怖いなって思っていたけどね。
	なんだかんだ、ここまで付き合いが長いと、さすがに扱いには慣れて来たし、
	向こうも、腐れ縁を感じてるみたいだからさ。
晶	たしかに、フィガロに怒られると、オズも気まずそうにすることがありますよね。
	一目置いているのかなって感じがします。
フィガロ	ふふ。そうだろう？
	自覚がないから言ってもわからないだろうけど、あいつは、俺や、
	スノウ様やホワイト様や、アーサーのことが、ちょっとだけ好きなんだよ。
	そこを上手く突いて手綱を取れば、世界は大抵、俺の思い通りになる。
	そういうところは、やっぱりちょっと気分がいいよね。
`},
{id:10117,title:"スポットゆかりの話（１）",type:"personal",characters:["カイン"],memo:"オズ",
text:`晶	オズの爪痕は、世界中にあるって言ってましたよね。
	カインも、どこか別の場所にある、オズの魔法の痕を見たことがあるんですか？
カイン	ああ。生まれ故郷の近くに、オズが落としたって言われてた、
	家くらいの大きさの大岩があったな。
	人間と魔法使いが協力して、何度か退かそうと試したみたいだが、
	ダメだったらしい。
晶	魔法でも歯が立たないなんて、信憑性がありますね……｡本物なんでしょうか？
カイン	さあ。オズに直接聞いてみてもいいが、覚えてないって言われそうだ。
	岩には未だに魔力が残ってて、嘘か本当か、
	側に立ってると肩こりに効くって噂があってさ。
	じいさんやばあさんがよく集まってたよ。
晶	どこでも名物にされてますね……。
	じゃあ、オズが思い出したとしても、
	岩を退かしたりしないほうがいいんでしょうか。
カイン	だろうな。岩の周りは地元の人間の憩いの場になってたし、
	大岩の形を真似た焼き菓子まで売ってるんだ。
	大抵は恐ろしい化け物だって言われてるオズが、
	一部では、和やかな伝承になってる。
	子供の頃はそれが不思議だったけど……。
	恐いだけじゃないオズ本人を知った今は、
	なんとなく、オズらしい話だなって思うようになったよ。
`},
{id:10118,title:"スポットゆかりの話（２）",type:"personal",characters:["フィガロ"],memo:"オズ",
text:`晶	せっかく来たんだから、この場所を満喫して帰りたいですよね！
	オズの爪痕ならではの楽しみ方ってあるでしょうか？
フィガロ	賢者様が何を楽しいと感じるかによるかな。
	旅に出かける時は何を楽しみにしてるタイプ？
~~~~~~~~~	~~~~~~~~~
選択	土地のご飯。
晶	土地それぞれのご飯を味わうのが楽しみです！
フィガロ	いいねえ。たしかこの辺りには、
	オータムナッツっていう、芋と栗と南瓜の味がする木の実があるんだよ。
	その実をパンに練り込んで焼いたり、
	どっさりスープに入れて食べると美味しいんだ。
	探して食べてみようか。持って帰って、ネロに調理を頼んでもいいしね。
~~~~~~~~~	~~~~~~~~~
選択	土地の景色。
晶	土地それぞれの景色を見るのが楽しみです！
	今見ている風景を、そのまま残せたらいいんですけど……。
フィガロ	幻影でよければ、俺の魔法で、紙でも布でも、映しておくことができるよ。
晶	本当ですか！？是非お願いします！
フィガロ	いいよ。それじゃあ、もう少し日が傾くのを待とうか。
	この辺りの地層に混じってる鉱石は、夕日を受けると輝くんだよ。
	断層の縁が一列に光るんじゃないかな。
~~~~~~~~~	~~~~~~~~~
選択	土地の体験。
晶	土地それぞれの体験をするのが楽しみです！
	何かこの場所で、やり遂げたなって思えたら、最高なんですけど……。
フィガロ	そうは言っても、この辺は地面の亀裂しかないからなあ……。
	飛び込んでみる？
晶	え？
フィガロ	淵から亀裂に飛び込んでみるのはどう？
	異界には、谷底に飛び降りる遊びがあるって前に言ってなかったっけ？
晶	や、やめておきます……。
~~~~~~~~~	~~~~~~~~~
晶	フィガロ……。なんだかこの辺りの土地に詳しそうですね？
フィガロ	オズのやんちゃに付き合って、俺もこの辺まで来たことがあるんだ。
	昔のことだけどさ。
	慣れない場所に出向いた時は、俺が土地のことを調べてやったりしてたんだよ。
	甲斐甲斐しいだろ？
`},
{id:10119,title:"中央の国について",type:"personal",characters:["①"],memo:"オズ",
text:`晶	中央の国のお城の側は賑やかですけど、郊外に来るとこういう場所もあるんですね。
オズ	そうだな。私も中央の国については詳しくないが……。
晶	えっ。そんなに長生きして、中央の国の魔法使いとして召喚されてるのにですか？
オズ	……知る必要がなかった。
	アーサーと共に学んだことなら答えられる。何が知りたい？
~~~~~~~~~	~~~~~~~~~
選択	中央の国の歴史
オズ	人間たちの政権は移ろいやすい。
	大陸の中心は長く戦を繰り返し、
	今のグランヴェル王朝になったのは４００年程前だ。
オズ	ファウストとその友人……、アーサーの祖先が築いたと言われる。
晶	ファウスト本人は、いつ聞いても知らないと言いますけど、
	本当のところはどうなんでしょうか？
オズ	さあな。私のように、してもいないことが伝承されることもある。
	本人に尋ねればいい。
	長く北の国から出なかった間に、どんなことがあったのか知らなかったが、
	ファウストは苦労したようだ。
	私のしたことで世界は混迷した。多少は恨まれているかもしれないな。
~~~~~~~~~	~~~~~~~~~
選択	中央の国の人々
オズ	大陸の中央に位置し、世界で最も多くの人間が行き交う国だ。
	そのために、中央に暮らす人々は、魔法使いや他国の人間を受け入れて、
	摩擦が少ないように生活しようとしている。
	世界のどこに行くにも、通り道になるのだから仕方ない。
	柔軟な性質になる必要があったのだろう。
晶	確かに中央の人たちは、みんな気さくですよね。
	だけど、自分の意思がしっかりある感じがします。
オズ	柔軟に受け入れてばかりでは、他国に侵食されてしまう。
	自国の仲間を好きにさせないために、高い意思疎通力と、統率力を身につけた。
	そういう気質の者たちだ。
~~~~~~~~~	~~~~~~~~~
選択	中央の魔法使い
オズ	私も本来は北の国の魔法使いに属するだろう。
	中央の魔法使いたちが、なぜこんな生き方をするのか分からない。
晶	こんな、というのは……？
オズ	……名誉と感じるものが、中央の魔法使いと北の魔法使いとでは、
	異なっているように見える。
	北の国では畏怖されることが名誉だった。中央の国では、信用と尊敬が名誉だ。
	信頼や尊敬を得るには忍耐力がいる。苦労も伴う。
	だが、この国のものはみな、卑屈にもならず、明るく篤実でいる。
	煩わしい手段を選ぶことに理解はできないが、
	不思議で、どこか興味をひかれる者たちだ。
`},
{id:10120,title:"〈大いなる厄災〉について",type:"personal",characters:["①"],memo:"オズ",
text:`晶	この前の〈大いなる厄災〉との戦いは、
	こんな風に地面を割くオズの力があっても、苦戦したんですよね……。
	厄災について、オズはどう思っていますか？
オズ	……今までは、私の力でどうにもならない相手など、存在しなかった。
	そういうものに遭遇して初めて、
	不愉快なような、憤りのような、畏怖のような思いを抱いた。
晶	……オズほどの人でも、厄災が怖いと思うんですね……。
オズ	強大で未知な力を恐れたわけではない。あれを恐怖と呼ぶのかもわからない。
	ただ……。
	〈大いなる厄災〉に、何かを奪われてしまうことは、恐ろしいと感じた。
	気の遠くなる時間を生きてきたが、そんなことが頭を過ぎったのは、
	生まれて初めてだった。
晶	…………。
オズ	晶。おまえが今この時、この世界にやって来たことには、意味があるはずだ。
	私は、私の全てを以って、おまえと共に戦う。
`},
{id:10121,title:"スポットの人々",type:"personal",characters:["①"],memo:"オズ",
text:`晶	オズ、何を見ているんですか？
オズ	……人がいる。旅人のようだ。
晶	本当だ……。断層の傍に立ち尽くして、途方に暮れている感じがしますね。
	もしかしたら、オズの爪痕のことを知らないまま歩いてきて、
	向こう岸に渡れずに困っているのかも……。
オズ	そうだな。
晶	もうすぐ日暮れだし大変そうだな……。
	こんな事を言うのはあれなんですけど、助けてあげたらどうですか？
オズ	必要ない。
晶	……すみません。俺が魔法を使えるわけでもないのに。
オズ	そうではない。人はもっと、たくましいものだ。
晶	え？
	……あ！あの人、ロープを使って谷底に降りていってる！
	すごい……！険しい崖を道具を使って、一歩一歩……。
	物凄い高さなのに、怖がりもしないで……。
オズ	カインのように勇敢な若者だな。
	不思議の力を持たないからこそ、己の肉体を鍛え、道を切り開く方法を習得した。
	……私も魔法が使えぬ夜の間に備えて、体を鍛えなければな……。
晶	（オズ……。筋トレする気なのかな……）
`},
{id:10122,title:"スポットにいた魔法使い",type:"personal",characters:["カイン"],memo:"オズ",
text:`晶	あれ、カイン。そのおじいさんは……？
カイン	魔法使いだそうだ。ここで商売をしてるって言うから、話を聞いてたんだよ。
老人	わしはオズの爪痕の渡し守。
	向こう岸に行きたいのなら、魔法で連れて行って差し上げましょう。
カイン	銀貨1枚だってさ。面白そうだし、賢者様、試しに渡ってみないか。
~~~~~~~~~	~~~~~~~~~
選択	やってみる
老人	承知いたしました。それでは、わしの腕にお掴まりください。
晶	掴まる……。箒は使わないんですか？
老人	はっはっは。魔法使いが箒に乗るなど、迷信です。傘を使いますのじゃ。
晶	傘？
カイン	なんだか危なっかしいな。やっぱり、俺が行こう。じいさん、片道で頼む。
~~~~~~~~~	~~~~~~~~~
選択	やめておく
晶	いつも通り、カインの箒に乗る方がいいです……。
カイン	そうか？なら、あんたは後で俺が運んでやる。じいさん、片道で頼むよ。
老人	承知いたしました。それでは、わしの腕にお掴まりください。
カイン	腕に？箒は使わないのか？
老人	はっはっは。魔法使いが箒に乗るなど、迷信です。傘を使いますのじゃ。
カインがおじいさんの腕を掴むと、おじいさんは古びた傘を開いた。
次の瞬間、ものすごい風を受け、吹き飛ばされるように、二人の体が舞い上がった！
晶	わーっ！？カイン……！
カイン	荒っぽいが、一応魔法だな……！？大丈夫だ、すぐ戻……！
大声で応えながら、カインとおじいさんは飛んで行き、対岸に不時着するのを見た。
晶	い、痛そう……。賢者の魔法使いたちって、やっぱり優秀なんだな……。
`},
{id:10123,title:"オズの評判",type:"personal",characters:["リケ"],memo:"オズ",
text:`晶	リケ。村の人と話をしていたんですか？
リケ	はい。この辺りに住んでいる方だそうです。
	いつかオズに一目会ってみたいと言っていて。
晶	オズに……。
近隣の村人	その昔、オズはこの村にいた娘に一目惚れしたという言い伝えがあり、
	この村の血筋を気に入っているようなのです。
晶	…………。現在進行形ですか？
近隣の村人	どうやら。オズは、自ら大地に残した爪痕を目印に、この地にやってくるそうです。
近隣の村人	魔法で獣に姿を変えるのが得意らしく、
	見かけない大きな獣はオズの化身だとして、この地では恐れられているんですよ。
近隣の村人	先日も黒い大きな鳥が現れて、
	村の娘が攫われないようにと、みなで丁重に餌をやったところです。
晶	オズに餌を。
リケ	ふふ。なかなか面白いお話でした。
	神のご加護により、オズからこの地が護られるよう祈っています。
晶	本当のこと、教えてあげないんですか？
リケ	村の方々に会わせようとしたのですが、
	オズが煩わしがったので、お話を伺うだけにしているんです。
	本当のことを知りながらオズの噂話を聞くと、
	少しだけ心がわくわくしてしまうのはなぜでしょうね？
`},
{id:10124,title:"スポットの名物",type:"personal",characters:["スノウ"],memo:"オズ",
text:`晶	スノウ。何か買い物していたんですか？
スノウ	ほほほ、魔法舎のみなへの土産じゃ。そなたもこれを飲んでみるがよい。
晶	小瓶に水が……。なんですか？これ。
スノウ	近くの村に、飲めば美しくなる水の湧く、不思議な井戸があるらしい。
	そこの水じゃ。
	言い伝えによれば、大魔法使いオズが恋をした美しい村の娘も、
	この井戸の水を飲んでおったという……。
晶	そのオズの言い伝えって、ただの噂話だったんですよね……？
	この井戸の水だけは本当なんですか？
スノウ	さあのう。なんの魔力も感じられぬが、水の質自体は良いようじゃ。
	そなたの喉を潤してくれるじゃろう。
晶	偽物だってわかってるのに、わざわざ買うなんて……。スノウは人がいいですよね。
スノウ	オズが恋をするほど美しくなれる水など、真実ならばこれほど面白いことはない。
	我ら、面白いことは大好きじゃ。
晶	たしかに、オズが一目惚れするような美人って、ちょっと興味があるかも……。
スノウ	そうじゃろう、そうじゃろう。
	水の効果が本物ならば、美しくなったそなたらを愛でられて、
	我らも一石二鳥じゃからのう。
`},
{id:10125,title:"スポットでの発見",type:"personal",characters:["ムル"],memo:"オズ",
text:`ムル	断層だ！断層好きー！
晶	ムル……！地面の裂け目に飛び込んだりしたら危ないですよ……！
ムル	じゃあ、やめよっと！
晶	！？珍しく聞き分けがいいですね……。
ムル	思い出したんだ。この場所、前に来たことがある！
晶	こんな辺境にですか？何をしに来ていたんですか？
ムル	オズの爪痕の調査さ！
	オズが無茶苦茶な魔法を使うと、地底の深い場所まで調べられて便利なんだ！
	オズの爪痕を調べて追いかけていけば、
	どういう順番で世界が支配されていったのかも正確にわかる。
	歴史にはあまり興味ないけど。
	学者だった頃、世界中のオズの爪痕を巡ってた。
	年代別にオズの爪痕を紹介できるよ。
	オズの使った魔法の強さと、その時に大地が受けた星や月の光を計算して、
	地殻の変動を分析した本も書いた！
晶	本なんて凄いな……。じゃあムルは、オズの爪痕が本物かどうかわかるんですね。
	今も全部覚えているんですか？
ムル	うーん、思い出せるかもしれないけど、調査は終わってるし、頭使いたくないや！
	もっと大事なことを考えたい！
	例えば、寝心地のいい昼寝の場所、一番快適な頭を撫でる速度……。
晶	……もしかして、ムル、眠たくなってきちゃいましたか……？
ムル	あはは！賢者様、大当たりー！
`},
{id:10126,title:"マナエリア",type:"personal",characters:["①"],memo:"オズ",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、
賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
オズ	パワースポット……。
晶	「マナエリア」と呼ぶと聞きました。オズにもマナエリアがありますか？
オズ	ああ……｡私のマナエリアは、私の城の一番高い塔から見る景色だ。
晶	オズの城……。たしか、北の国にあるんですよね。
オズ	そうだ。冬の、細氷の現れる早朝に最も効果がある。
	雪がなくとも、展望の良い場所は代わりになる。
	強い魔力を必要とするときは、上空へ上がることもある。
晶	マナエリアに景色が近い場所にいると、魔力が強くなるってことですか？
オズ	魔法は心で使う。
	マナエリアはそれぞれが持つ原風景のような、
	精神を安定させ心を研ぎ澄ます場所のことだ。
	私の魔法は、世界の全てから力を得て、従える。
	強い魔法を使うには、その意識を強く掴むことが必要になる。
晶	（魔法を使う時のイメージが、湧きやすい場所ってことなのかな……？）
オズ	今は理解し難いかもしれないが、賢者よ。おまえにもマナエリアは存在する。
	心の落ち着ける場所は、これからおまえが生きて行く上で必要なものだ。
	慎重に見極め、見つけておくことだな。
`},
{id:10127,title:"アミュレット",type:"personal",characters:["①"],memo:"オズ",
text:`晶	マナエリアから長く離れる魔法使いは、
	マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	オズもアミュレットを持ってますか？
オズ	ああ。
オズは、机の上に置いていた四角いガラスケースを視線で示した。
淡く発光するケースの中で、繊細な虹色の光の粒が輝いている。
晶	すごい。キラキラしてる……。
オズ	私のマナエリアは、私の城の一番高い塔から見る細氷の景色だ。
	その幻影を閉じ込めて持ち出した。
晶	幻影……。なら、これは魔法で映してるんですね。すごく綺麗です。
	オズほど魔力が強い人も、アミュレットが必要なんですか？
オズ	強い魔法を使うほど、精神を摩耗する。
	その回復に必要なのが、マナエリアとアミュレットだ。
	体力の回復に睡眠や栄養を欲するようなもの。
	魔力を鍛えたからといって、不要になるものではない。
晶	（怖いくらいの力を持ってる人が、こんな綺麗なアミュレットを
	　必要としてるなんて、ちょっとほっこりする仕組みだな……。）
`},
{id:10128,title:"北の国での暮らし",type:"personal",characters:["①"],memo:"オズ",
text:`晶	オズは北の国のお城に住んでいたんですよね？
	そこでは――――。
~~~~~~~~~	~~~~~~~~~
選択	食事はどうしていたんですか？
オズ	私の城の前に人間たちが貢物と称して、食料や調理したものを置いていく。
	狩りをしたり、買い付けることもあったが、
	本来、魔力のおかげで長く食事をしなくても、生きていける体質ではあるからな……。
~~~~~~~~~	~~~~~~~~~
選択	今の生活と違いますか？
オズ	ああ。城は雪が降る音が聞こえそうなほど静かだった。
	だが、ここは毎日が祭事のように騒がしい。
~~~~~~~~~	~~~~~~~~~
晶	お城では普段、何をして過ごしていたんですか？
オズ	城の塔から北の国に降り注ぐ細氷を見ていた。
晶	素敵ですね！銀世界を覆うダイヤモンドダスト……。
	もしオズのお城に行くことがあったら見てみたいです。
オズ	……いつか機会があれば。
`},
{id:10129,title:"家族",type:"personal",characters:["①"],memo:"オズ",
text:`晶	オズは家族のこと、何か覚えていますか？父親や母親のことを。
オズ	覚えていないな。気付いたときにはひとりでいた。
晶	そうなんですね……。寂しくはなかったですか？
オズ	ああ。
	物心ついた頃には、魔法が自在に使えていた。ひとりでいることは自然だった。
	知らなければ、足りないと思うこともない。
晶	……たしかにそうかもしれません。スノウとホワイトはオズのお師匠様ですよね。
	二人とはどんな風に出会ったんですか？
オズ	ある日突然、私の前に現れた。
	一緒に来るように言われ、断ると、双子は私を叩きのめして住処に連れ帰った。
	フィガロにも、そこで会った。
晶	叩きのめして……？けっこう、物騒な出会いですね！？
オズ	そうだな。
	双子はその頃から騒々しい。フィガロも、初めからよく喋る男だった。
	彼らを家族のように思ったことはないが……。
	ホワイトが死んだ今は、欠けた、足りないと、たまに感じることがある。
	今後も、そうなるのかもしれないな。
`},
{id:10130,title:"アーサーからの手紙",type:"personal",characters:["①"],memo:"オズ",
text:`晶	オズ。部屋に居ないから探したんですよ。アーサーが顔を見たがってて……。
オズ	いい。もう城に戻る時刻だろう。
晶	魔法の授業や依頼任務の時には会ってるんですから、今更隠れなくても……。
オズ	今日は城の者が迎えに来ている。私が出向いて、余計な噂が立つのも煩わしい。
晶	アーサーの立場も大事でしょうけど、アーサーの気持ちもきっと大事ですよ。
	これ、どうぞ。
オズ	……手紙？
晶	会えなかった時のために、お城で書いてきたんですって。
	渡してくれって頼まれました。
	今までは、手紙を書いても、オズのお城までは届けてもらえなかったそうなんです。
オズ	…………。
	他国から北の国へ手紙を運ぶ便はない。
	国境の山は険しく、辿り着いても、荷重の人間など真っ先に襲われるからな。
	私の元を離れるまで、アーサーも知らなかったのだろう。
	私も、教えぬまま行かせてしまった。
晶	そうなんですね……。でも、よかったら、返事をしてあげてください。
	今は手紙も、こうして届くんですし。
オズ	ああ……。
	…………いや。次は、私が出迎えよう。
`},
{id:10131,title:"長く続く関係",type:"personal",characters:["オズ","フィガロ"],memo:"オズ",
text:`晶	フィガロにオズ。二人が一緒に飲んでるなんて珍しいですね。
フィガロ	ずっと誘ってやっと出てきたんだよ、こいつ。
オズ	ずっと断っていたのに、無理矢理連れ出された。
フィガロ	たまには昼間に出てきて、子守にも混ざってほしいよ。おまえ、得意なんだからさ。
オズ	年若い魔法使いは私を怖がるだろう。
フィガロ	今更だろ、そんなの。
	それに、若い子たちにはおまえが思うほど、おまえの威厳なんてないよ。
晶	二人は古い友人同士でしたよね。
	付き合いが長くなると、兄弟や家族とか、そんな感じになりますか？
フィガロ	どうなの？
オズ	一切ないな……。
フィガロ	だよねえ。もう少しオズに可愛げがあれば、何か違ったかもしれないんだけどね。
オズ	お互い様だ。
晶	（そうは言ってるけど……、千年以上も仲良くできるんだから、
	　なんだかんだ気が合うんだろうな……。）
`},
{id:10132,title:"スノウとホワイトのお願い",type:"personal",characters:["オズ","スノウ","ホワイト"],memo:"オズ",
text:`スノウ	オズ、オズや。
ホワイト	あそこの棚の上段にある赤い本を取ってくれんかのう。
オズ	……自分で取ればいい。
晶	二人とも、魔法の調子が悪いんですか？
	俺がはしごを持ってきて取りましょうか。
スノウ	いかんいかん！賢者にそのようなことはさせられぬ！
	我らはオズに取って欲しいのじゃ！
ホワイト	育ててやった恩を忘れるとは薄情者じゃ！取ってくれるまで言い続けるのじゃ！
オズ	鬱陶しい……。……ほら、これでいいか。
スノウ・ホワイト	きゃっきゃ！
スノウ	たまにこうしてわがまま言って、上下関係わかってもらわないとねー。
ホワイト	また手がつけられないほど調子に乗って世界征服されちゃうと困るからねー。
オズ	くだらん……。
晶	もう。そんなことしなくても、オズはちゃんと二人に恩を感じていると思いますよ。
スノウ	ええー？オズちゃんってば、マジ〜？
ホワイト	でも我、ちょっとそうかなって思ってた！
オズ	…………。
スノウ・ホワイト	きゃっきゃ！
`},
{id:10133,title:"オズと北の国の魔法使いと",type:"personal",characters:["①"],memo:"オズ",
text:`晶	オズは、魔法舎にいる北の国の魔法使いたちみんなと、
	以前から面識があったんですか？
オズ	ああ。北の土地は神秘の力が強く、住まう者は長命になりやすい。
	だが、弱い者はすぐに殺される。
	北で長く生きる者同士は、いずれどこかで出会うことになる。
晶	……といっても、ご近所付き合いみたいな、仲良い感じともまた違いますよね。
オズ	北で他人の土地に足を踏み入れるのは、何かを奪うためだ。
	土地や財産、名声に権力、魔力の源となるマナ石……。
	中でも、ミスラとオーエン、ブラッドリーは、私のマナ石を狙って度々現れた。
晶	全員と喧嘩したことがあるんですか？みんな強そうですけど……。
オズ	そうだな。あの三人は厄介だった。相手にするたび、長引いて手を焼いていた。
	何もしないままでいれば、私もいつか、石にされていたのかもしれないが……。
	私もまた、奪われないために、奪って生きていた。
	北の国とは、そういう者の集まりだ。
`},
{id:10134,title:"幸せな花",type:"personal",characters:["①"],memo:"オズ",
text:`晶	先ほどアーサーが悲しそうな表情で植えていた花はこれですね。
	少し萎れてしまっているけど真っ白な花弁がとても綺麗です。
オズ	王妃が好きだという花を育てていたらしい。
晶	そうだったんですね。この花を王妃様が……。
オズ	だが、じきに枯れる。それならと思って、外に植えてやったのだろう。
晶	アーサーにたくさんの愛情を注いでもらって今日まで咲いていたんですね。
	花を最後まで育てるのって難しいから
	アーサーがこの花をとても大切にしたのが伝わってきます。
	きっと、この花は幸せだったと思います。
オズ	……そうだな。
	賢者よ、礼を言う。
晶	えっ、どうしてですか？
オズ	今の話を聞けばアーサーもきっと喜ぶだろう。
`},
{id:10135,title:"てるてる坊主VSオズ？",type:"personal",characters:["①"],memo:"オズ",
text:`オズ	何をしている。
晶	明日ミチルと買い物に行くので雨が止むおまじないを作っていました！
	てるてる坊主といって俺の世界ではこれを窓辺に吊るすと
	雨が止むと言われてるんです。
オズ	そうなのか。てるてる坊主とは、私の顔を描くものなのか？
晶	いえ……。どうせなら、魔法使いみんなの顔を書いてみようかなと思って。
オズ	そうか。
	……魔法で雨を止めてやってもいいが。
晶	ありがとうございます！でも、それは申し訳ないので大丈夫ですよ。
オズ	……私よりも、その人形の方が有能だとでも言うのか？
晶	い、いや、そう意味ではなくて……！
オズ	構わない。だが、そのようなことを言う者を初めて見た。
晶	（俺もてるてる坊主に張り合う人を初めて見た……）
`},
{id:10136,title:"得意な魔法",type:"personal",characters:["オズ","フィガロ"],memo:"オズ",
text:`晶	オズの魔法が強力なことは分かりましたが、特別得意な魔法はあるんですか？
	オズにしかできないこととか……。
オズ	…………。
オズはいつものように黙り込むと、考えるような眼差しを空へと向けた。
すると、近くに浮かんでいた雲がむくむくと膨らみ始め、太陽を覗かせたまま雨が降り出した。
晶	天気雨だ……。これもオズが？
オズ	私の知る中で、天候を操れるものは少ない。
	雨を呼ぶことも、雲を晴らすことも、雷を落とすことも、
	通常、ひとり分の魔力では難しいだろう。
晶	たしかに、天候を操作するのに強い魔力が必要って言われると、
	納得できる感じがします。
フィガロ	おい、オズ！この雨、おまえだろう。勝手に降らせるなよ。
	ルチルが洗濯物干してるのに。
オズ	…………。
晶	あ……、雨が止んだ……。でも、ちょっと曇ってきた……？
フィガロ	こらこら、拗ねるんじゃない。気分転換してこい。
晶	（オズの気持ちが天気に影響することもあるみたいだ……）
`},
{id:10137,title:"魔法の思い出",type:"personal",characters:["①"],memo:"オズ",
text:`晶	オズはアーサーの魔法の師匠なんですよね。
	アーサーの小さい頃は、どんな風に魔法を教えていたんですか？
オズ	……それまで、誰かに何かを教えたことなど一度もなく、戸惑った。
	かれれば答えたが、私は言葉も上手くはない。目の前で魔法を見せてやっていた。
晶	なるほど。まずは実演でどんな魔法なのか掴んでもらおうとしたんですね。
	オズがアーサーに見せた魔法って――――。
~~~~~~~~~	~~~~~~~~~
選択	攻撃魔法ですか？
オズ	そうだ。雨雲を消滅させてみせた。
晶	さすがオズ……！その時アーサーはびっくりしていましたか？
~~~~~~~~~	~~~~~~~~~
選択	治癒魔法ですか？
オズ	アーサーの指にあった小さな傷を治してみせた。
	だが、その後も怪我をするたびに私に治して欲しいとせがむようになってしまった。
晶	なんだか可愛いですね！
	アーサーはオズの魔法を見るたび、なんて言っていましたか？
~~~~~~~~~	~~~~~~~~~
オズはそこで、言い澱むように一度口を噤んだ。
オズ	「すごく格好いい」と。
晶	あはは、アーサーらしいですね。
	（アーサーはきっとオズの魔法をみて、感激したんだろうな。
	　きらきらした笑顔が目に浮かぶ……）
オズ	なぜ笑う。
晶	今度俺にもオズの魔法を見せてくれませんか？
	俺ももっと、オズのすごい魔法が見てみたいと思ったんです！
`},
{id:10138,title:"紋章",type:"personal",characters:["①"],memo:"オズ",
text:`晶	賢者の魔法使いには、目印になる賢者の紋章が身体に現れるって聞きました。
	オズの紋章はどこにあるんですか？
オズ	……この辺りだ。
晶	左の……、鎖骨の下ですか？なんだかちょっと、色っぽいですね。
オズ	…………｡
晶	あっ！すみません！セクハラのつもりじゃなくて……！
オズ	セクハラとは。
晶	ええと……。嫌な気分にさせたら申し訳なかったと思って……。
オズ	おまえの所感に良いも悪いもないが、私にそんな物言いをする者は少ない。
	なんと答えるべきか、いつも迷うが、迷うだけだ。
晶	（……たぶん、気にするなって言ってくれてるんだな……）
`},
{id:10139,title:"オズの親心",type:"personal",characters:["①"],memo:"オズ",
text:`晶	おはようございます、オズ。急に尋ねてしまってすみません！
オズ	構わない。……何かあったのか。
晶	実は、アーサーのことで少し相談があって……。
	な、なんか、お隣の部屋からすごい物音が聞こえますけど、大丈夫ですか。
オズ	スノウとホワイトがオーエンを起こしているようだな。
晶	（どんなアグレッシブな起こし方をしているんだろうか……）
オズ	それよりも、アーサーがどうし……。
	…………。
	《ヴォクスノク》
晶	あれ？急に静かになりましたね。
オズ	騒がしい奴らを中庭へ移した。賢者、続きを。
晶	（ち、力技だ！さすがオズ……）
`},
{id:10140,title:"困った時は……",type:"personal",characters:["オズ","アーサー"],memo:"オズ",
text:`晶	オズ、みんなでお茶にしようって言ってるんです。
	よかったら、オズも一緒にどうですか？
オズ	私はいい。
晶	でも、用事がある時以外、部屋から出てこないでしょう。体に悪そうですし……。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
オズ	何をするでもない。本を読むことがあるくらいだ。
晶	何も？一日中ずっとですか？
オズ	……たまに瞑想もする。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
オズ	私から部屋に呼ぶことはない。私を恐れている者たちは近づかないが……。
	双子やフィガロや、若い魔法使いが無遠慮に部屋にやってくることはある。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
オズ	食事の時間は部屋を出る。座学や訓練をする日も出向いている。
	夜はたまに、シャイロックのバーに酒を飲みに行く。夜更けに眠るようにしている。
~~~~~~~~~	~~~~~~~~~
オズ	心配せずとも、必要な運動はしている。
	おそらく、おまえたちとは身体の作りが違う。何日も眠らず過ごすこともでき……。
アーサー	オズ様、賢者様！遅かったので、お迎えにあがりました。
オズ	…………。
アーサー	というのは口実で、オズ様のお顔を見に参りました。
	もしかしたら、お茶はご遠慮なさるかと思って。
	夜には城に戻る予定なのです。
	お会いできないままかと思いましたが、ご挨拶ができてよかった。
オズ	……いや、今行く所だ。
アーサー	わあ！本当ですか？
晶	（やっぱり、オズはアーサーに少し甘い気がするな……。
	　困った時があったらアーサーに頼ろう）
`},
{id:10141,title:"世話焼きオズ",type:"personal",characters:["①"],memo:"オズ",
text:`晶	オズがキッチンにいるなんて珍しい。何をしているんですか？
オズ	栗を茹でている。
晶	栗？もしかして、お腹が空いて……。
オズ	これは私の栗ではない。リケのものだ。
	市場で買った栗らしい。だが、硬くて食べられないと落ち込んでいた。
晶	なるほど！それで、オズが茹でて食べられるようにしてあげているんですね。
オズ	ああ。
晶	…………。
	（意外っていうと失礼かもしれないけど、
	　オズはお父さんみたいなところがあるよな
	　今もなんとなく優しい目をしている気がするし）
オズ	……賢者も腹が減っているのか。
晶	えっ、ちが……！
`},
{id:10142,title:"名前を呼んで",type:"personal",characters:["①"],memo:"オズ",
text:`晶	……はあ。
オズ	賢者。何かあったのか。
晶	前の賢者様に比べて俺が皆さんの役に立ててるのか不安で……。
オズ	…………。
	……お前は賢者である前に、晶というひとりの人間だ。
晶	オズ……？
オズ	晶は晶だ。晶にしかできないことがある。
オズの言葉は不思議だ。
まるで雪山に咲いた一輪の花のように力強く、そして優しく、不安を解いてくれる。
賢者という呼び名に慣れてしまっていたけど俺には晶という名前があるんだ。
晶	……オズ、もう一回だけ俺の名前を呼んでくれませんか？
オズ	……晶。
晶	ありがとうございます！これでもう、大丈夫です！
`},
{id:10143,title:"オズのパンケーキ教室",type:"personal",characters:["中央"],memo:"オズ",
text:`晶	みなさん揃って何をしているんですか？
アーサー	賢者様。カインとリケがパンケーキを食べたいというので、
	オズ様に作り方を伺っていました。
リケ	せっかくなので、みんなで一緒に作ることにしたんです！
晶	そうだったんですね。あれ？ここにある――――。
~~~~~~~~~	~~~~~~~~~
選択	蜂蜜は何ですか？
オズ	最後にパンケーキの上にかけるものだ。
アーサー	昔、オズ様が蜂蜜でウサギの絵を描いてくださったのですよ。
	可愛くて食べるのが勿体無かったです。
~~~~~~~~~	~~~~~~~~~
選択	クリームは何ですか？
オズ	最後にパンケーキの上に乗せるものだ。
アーサー	オズ様が作るパンケーキは甘さ控えめなので生クリームとも相性抜群なんですよ。
~~~~~~~~~	~~~~~~~~~
カイン	なあ、もうひっくり返していいか？
	これ以上焼くと、焦げちまう気がするんだが……。
オズ	まだだ。あと少し待て。
リケ	……あ！オズ！生地の表面がぷくぷくしてきました。
	これがひっくり返す合図ですね。
アーサー	私にお任せください、オズ様！
オズ	空気をすくうようにひっくり返すのがコツだ。火傷には気をつけろ。
晶	（子供達の初めての料理を見守るお父さん……。そんな空気感だ……）
`},
//アーサー
{id:10201,title:"スポットの印象（１）",type:"personal",characters:["オズ"],memo:"アーサー",
text:`晶	オズから見た中央の国ってどうですか？
オズ	…………。
	人が多いな。馴れ馴れしい者が多い。
晶	俺は気さくだなって感じたんですけど、オズは馴れ馴れしいって思うんですね……。
オズ	ああ。
	気候はいい。暑さも寒さも、程度を知っている。
晶	過ごしやすいですよね！俺の住んでたところより、少し涼しい感じです。
オズ	そうか。
	あとは……、食べ物が美味い。
晶	えっ。オズが食べ物の話をするのなんだか意外ですね。
	中央の国で、何か気に入ったものはありましたか？
オズ	…………。栗か？ 
`},
{id:10202,title:"スポットの印象（２）",type:"personal",characters:["リケ"],memo:"アーサー",
text:`リケ	首都はやはり人が多いですね。お城の中だけでも、こんなにたくさんいるなんて。
晶	リケの住んでいたところはもっと少なかったんですか？
リケ	はい。教団の教えが理解できる者しか住んでいない場所でしたから。
晶	でも……、このお城も綺麗ですよ。好きになったところは一つもないですか？
リケ	ひとつもってことは……、ないですけれど……。
晶	本当？どこが気に入りました？
リケ	……市場には、見たことのない美味しいものや綺麗なものがありました。
	騒々しくて、慌しくて、教団で教わってきた神聖な精神とは真逆の喧騒でしたが……。
	でも皆、楽しそうでした。
	司教様から聞いていた、不浄な場所だという外の世界の印象とは、違っていて……。
晶	リケが感じたことは、きっと間違いじゃないですよ。
	今度一緒に、市場へ美味しいものを探しにいきませんか？
リケ	……賢者様がいうなら。ぜひ。
`},
{id:10203,title:"スポットの印象（３）",type:"personal",characters:["レノックス"],memo:"アーサー",
text:`晶	いつ見てもすごいお城ですね。
レノックス	……はい……。豊かで、美しい国です。
晶	あ、そうか。レノックスは、中央の国にいたことがあるんですよね。
	懐かしい感じしますか？
レノックス	……懐かしいですが、思うところもあります。
晶	思うところ？
レノックス	この城や、この国が豊かなのは、
	中央の国の初代王、アレク様の統治が、良いものだった証です。
	……ですが、建国に貢献した魔法使いが、一時的に排斥されたのも事実です。
	仕方ないことだったのかもしれません。俺も、仲間も、精一杯でした。
	だけど、なんというか……。
晶	複雑……？
レノックス	そうですね。……複雑です。
	でもやはり、美しくて、懐かしい国ですね。
`},
{id:10204,title:"ブレイクタイム（１）",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	綺麗な庭を眺めながらのんびりお茶するなんて、すごく贅沢な時間だな……。
アーサー	気持ちがいいでしょう。
	私も、賢者様がご一緒なら、みなに気兼ねなく羽を伸ばせます。
	エア茶はお口に合いましたか？
晶	はい！スッキリしてて、喉がすっと通るような不思議な味ですね。
	でも、アーサーがお茶を煎れられるなんて、少し意外でした。
	王子様って、なんでも召使いさんにやってもらうようなイメージだったので……。
アーサー	確かに、そういう貴族は多いかもしれません。
	でも、私はオズ様の城で仕込まれましたから。
	ふわぁ……。日差しが暖かくて、心地いいです……。
晶	（うわ、うとうとし始めちゃった……
	　レアなアーサーだ……）
	うーん……、ぽかぽかしてるな……。なんだか……俺も眠たくなってきた……。
アーサー・晶	すーすー……。
`},
{id:10205,title:"ブレイクタイム（２）",type:"personal",characters:["リケ"],memo:"アーサー",
text:`リケ	わあ、夕焼けが美しいですね。賢者様の世界にも夕焼けはありますか？
晶	はい。でも、建物が高くて、
	沈んでいく太陽を見ることはあまりなかったかもしれないです。
リケ	私の故郷の傍にある既知の遺跡から見る夕日も、雄大で素晴らしいものだそうです。
晶	綺麗なところだったんですね。
リケ	…………。
	故郷の話をすると、故郷が恋しくなりませんか？
晶	え？そう言われると、そうかも……？
リケ	寂しくないように、私が手を握っていて差し上げます。
	夕暮れが終わるまで。
晶	（もしかして、話してたら寂しくなっちゃったのかな
	　リケは気丈だけど、見かけより幼いところもある気がする……）
	じゃあ……お願いします。
リケ	ええ。賢者様、お手をどうぞ。
`},
{id:10206,title:"スポットの思い出（１）",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	アーサーは子供の頃、このお城にいたんですよね。
	何か思い出ってありますか？
アーサー	そうですね……。
	ここを離れたのは４つの頃ですから覚えてることも少ないのですが……。
	ちょうどこの城につながる橋の上を、父上と母上と三人、手を繋いで渡った記憶があります。
晶	微笑ましくて可愛いエピソードですね。ロイヤルファミリーっぽい感じがして。
アーサー	うーん……。
晶	どうしました？
アーサー	王家の者は通常、馬車で移動するんです。
	どこかへ出かけるために、この橋を歩いて渡ったとは考えにくくて。
	……おそらく、どうしてもこの橋を歩いてみたいと、私がわがままを言ったのでしょう。
晶	あはは。子供の頃のアーサーはわんぱくだったって、オズも言ってましたもんね。
アーサー	お恥ずかしい限りです……。
`},
{id:10207,title:"スポットの思い出（２）",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	ここから見る景色は綺麗ですね……。
アーサー	はい。私も大好きです。
	オズ様の城からこちらに戻って寂しかった時は、自分の部屋や、このバルコニーから、
	北の国の方角ばかり眺めていました。
	たまにオズ様の気配がした気がしてあたりを探すんです。
	でも、当然お姿はなくて……。
晶	…………。
アーサー	そうだ。代わりに、黒い鳥をよく見かけました。
	ハヤブサのような……燃えるような赤い瞳の、美しくて凛々しい、不思議な鳥です。
晶	赤い瞳の……、黒い鳥？
アーサー	ええ。いつも離れた場所からこちらを伺っていて、
	やがて街を旋回して翔び去って行くんです。
	その姿を追ううちに、街並みの美しさに気付きました。
	今はここに住む人々のために私があるということも。
晶	その鳥が、アーサーに元気をくれたんですね。
アーサー	元気も、勇気ももらいました。そういえば、最近見かけないけれど……。
	なんとなく、今も近くで見守ってくれてるような、そんな気がしているんです。
`},
{id:10208,title:"スポットの思い出（３）",type:"personal",characters:["カイン"],memo:"アーサー",
text:`晶	騎士団ではどんな仕事をしていたんですか？
カイン	ここのところ、大きな戦争もなかったからな。護衛や警備、あとは訓練。
	賢者様の世界の騎士はどんなだった？
晶	俺がいたところには、騎士って職業はなかったんです。昔はいたんですけど。
	同じような仕事をしてるのは、警察になるのかな……？
カイン	警察。へえ。どんな馬に乗る？
晶	馬！？馬には乗らないですね……。カインは乗馬もできるんですか？
カイン	もちろん。箒に乗るより得意だぜ。乗ったことがないなら、今度乗せてやるよ。
晶	わ……。楽しみにしていますね！ 
`},
{id:10209,title:"アーサーへの印象（１）",type:"personal",characters:["オズ","アーサー"],memo:"アーサー",
text:`ドラモンド	アーサー様！ アーサー様！
アーサー	ああ、呼ばれているようです。
	すみません、賢者様。少し失礼いたします。
晶	はい。いってらっしゃい。
オズ	…………。
晶	忙しそうですね、アーサー。
オズ	ああ……。
	病に伏せる国王の公務も任されている。多忙だろうな。
晶	そうですか……。頑張りすぎてないか、少し心配だな。
オズ	…………。
	無理をしている時の顔色はわかる。
	そそっかしいところはあるが、ここでの仕事はこなしているようだ。
	案ずる必要はないだろう。
晶	よかった。育ての親のオズが言うなら、大丈夫ですね。
	戻ってきたアーサーが休めるように、お茶を煎れて待っていましょうか。
オズ	ああ。……そうだな。
`},
{id:10210,title:"アーサーへの印象（２）",type:"personal",characters:["カイン"],memo:"アーサー",
text:`カイン	アーサー様に初めて会ったのは、俺がまだ騎士団にいた頃だ。
	死んだと思われてた王子が生きて帰って来たって言うんで、城内は大騒ぎさ。
晶	それは確かに、大変そうですね……。
カイン	俺にとっても新しい主君になる人だろ。
	楽しみな気持ちも、言い方は悪いが品定めするような気持ちも、正直あったんだ。
	ちょうどこの広間で初めてアーサー王子に挨拶した。
	当時は騎士団長だったから、そんな紹介で。
カイン	１３か、１４くらいだったろうが、幼いのに落ち着いてて、威厳を感じたよ。
	アーサー様はなんて言ったと思う？
晶	何でしょう。よろしく頼む、とか……？
カイン	「騎士団長か」
	「格好いいな」
晶	あはは！無邪気ですね！
カイン	だろ？一発で好きになっちまった。騎士団のやつらもそうさ。
	誰だって、格好いいと言われたくて、騎士になるんだからな。
`},
{id:10211,title:"アーサーへの印象（３）",type:"personal",characters:["リケ"],memo:"アーサー",
text:`晶	アーサーは、今晩はお城に泊まるそうです。
リケ	そうですか。一国の王子ともなると、やはりお忙しいのですね。
晶	アーサーのこと……、リケはどう思ってますか？
リケ	アーサー様を？そうですね……。
	アーサー様はいつも私の話をちゃんと聞いてくださいます。
	教団では、私が話を聞く役でした。司教様の話や、信徒の方たちの話……。
	だから、アーサー様と話すのは、少し、難しい……。
晶	難しい？
リケ	嫌なわけではありません。
	でも、何をしたいか、どう思う、と、聞かれることはあまりなかったんです。
	アーサー様はいつも、私の話を聞いてくださいます。
	だから、ちゃんと話さなければと思って。
	難しいけれど、嬉しいです。
`},
{id:10212,title:"アーサーへの印象（４）",type:"personal",characters:["ファウスト"],memo:"アーサー",
text:`晶	アーサーのこと、ファウストから見てどうですか？
ファウスト	どうって？
晶	すみません、他意はないんですけど……。
ファウスト	…………。
	無鉄砲なところが、昔の友人に似ているかもな。
	僕はどうしても、そいつに重ねてしまう。
	だから、アーサーに対する公正な印象にはならないだろう。
晶	（ファウストが中央の国を建国した人と関係があるって話、本当なのかもな……）
ファウスト	ただ、因縁を感じる。
晶	因縁？
ファウスト	魔法使いを信用できなかった初代国王の子孫が、賢者の魔法使いに選ばれた。
	それも、信用されなかった魔法使いと一緒に。
	ぞっとするような因縁だろう。総括すると、なんだこれ、って感じだよ。
	だが、まあ、アーサー自身は……。
	しっかりやっているんじゃないか。王子としても、賢者の魔法使いとしても。
	以上だ。
`},
{id:10213,title:"アーサーへの印象（５）",type:"personal",characters:["②"],memo:"アーサー",
text:`クックロビン	最近は、アーサー様の魔法で、色々な動物に変身する遊びをしてるんですよ。
	俺の軍艦鳥っぷりを気に入ってくださってて。
晶	え！？そんな遊びを……？めちゃくちゃ仲良しっぽくないですか。
クックロビン	いやそんな、アーサー様は誰にでもそんな感じで、俺だけ特別だなんて、そんな……。
晶	（まんざらでもなさそうだ……）
~~~~~~~~~	~~~~~~~~~
選択	猫になったことはありますか？
クックロビン	ええ。ファウストさんが猫が好きだという噂を聞いて、猫に変身して絡んでみてくれと頼まれました。
	それで、猫になりきってすり寄ってみたら、「正体は分かっている。失せろ」って、冷ややかな視線を受けたのでキュンとしました。
~~~~~~~~~	~~~~~~~~~
選択	馬になったことはありますか？
クックロビン	ありますよ！馬になってみたいってお願いしました！馬ってかっこいいですよね。
	ただ、カインさんがやって来て、馬の俺を見るなり飛び乗って走らせようと脇腹や尻を叩かれたので、動揺しました。
~~~~~~~~~	~~~~~~~~~
選択	別人になったことはありますか？
クックロビン	これは内緒にして欲しいですが、実は、ヴィンセント様の姿に変身させられたことがあります……。
	アーサー様の書類業務が溜まっていたそうで、作業の間、サボらないように見ててくれ、と。
	大変捗った様子で、俺もちょっと偉そうにできて気分良かったです。
~~~~~~~~~	~~~~~~~~~
晶	変身するなんて、ちょっと怖そうかなと思ったんですけど、すごく楽しそうですね。
クックロビン	そうなんです。俺自身まだ、魔法って、
	得体の知れない恐ろしいものだと思っていたところがありましたが……。
	アーサー様と遊んでいるうちに、怖いだとか奇妙だとかいう気持ちが薄れて、楽しくて素敵だなって思うようになったんです。
	たまにやんちゃではらはらしますが、アーサー様は、お優しくて、お強くて、本当に素晴らしい方です。
	どこか世間知らずなところもあって、僭越ながら、弟のように感じることもありますね。
`},
{id:10214,title:"スポットゆかりの話（１）",type:"personal",characters:["アーサー","レノックス"],memo:"アーサー",
text:`アーサー	この城は戦乱の時代に、この辺りを制圧していた残忍な魔法使いが人間から奪って住み着いていた城でした。
	のちにアレク初代国王陛下がそれを奪還し、中央の国の建国の際、グランヴェル城として再建されたものです。
晶	古い歴史のある建物なんですね……。
アーサー	ええ。
	レノックスは建国の革命軍にいて、そこに立ち合ったそうですから、今度ゆっくり話を聞けたらと思っています。
晶	えっ！？あっ、そうか！そうですね……。
	（そういえば魔法使いは長生きなんだった……。
	　なんていうか、歴史上の偉人たちと、一緒に暮らしてるみたいな話なんだろうけど……）
はぐれた羊	メエ！　メエメエ！
アーサー	わっ！　羊……？
レノックス	アーサー様、賢者様！
	すみません、羊がはぐれてしまって……。
晶	（あんまり実感わかないな……）
`},
{id:10215,title:"スポットゆかりの話（２）",type:"personal",characters:["②"],memo:"アーサー",
text:`アーサー	中央建国の戦いに貢献した、
	初代国王と聖なる魔法使いの逸話はこのグランヴェル城にも多く残ります。
	ほら、賢者様、あそこの……城の東の広間の窓が見えますか？
晶	ええと、大きなステンドグラスがある場所ですか？
アーサー	そうです。あのステンドグラスには紫が使われていないんです。
晶	紫が……。どんな意味があるんですか？
アーサー	言い伝えでは、
	紫色は聖なる魔法使いファウストが好んで身につけた色なんだそうです。
	彼が再び城に戻った時、彼の魔法で紫を加えて装飾が完成するようにと、
	初代国王アレクの願いが込められてるんですよ。
`},
{id:10216,title:"中央の国について",type:"personal",characters:["②"],memo:"アーサー",
text:`アーサー	賢者様は、この国に馴染んでこられましたか？
晶	そうですね……。
	慣れないこともあるんですけど、みんな親切にしてくれるし、景色や街並みも綺麗だし……。
	だんだん、好きになってきたように思います。
アーサー	そうですか。それは、この国も王子としても、とても嬉しいです。
晶	アーサーも、中央の国が好きですか？
アーサー	もちろん大好きです！
	文化と学間を大事にするところや、流通が盛んで旅人が多く、賑やかなところも。
	ですが……、私もどこか、故郷は北の国だという気がしているのかもしれません。
	賢者様とは、少し境遇が似ているのかもしれませんね。
`},
{id:10217,title:"〈大いなる厄災〉について",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	〈大いなる厄災〉が来る時って、他の場所にいる人たちは、どんな風に過ごしてるんですか？
アーサー	家の中から見守る者や、早々に寝てしまう者もいると聞きます。
	みな、それぞれですね。
晶	アーサーは？
アーサー	子供の頃から、私は起きてることが多いです。
	オズ様も、〈大いなる厄災〉が来る夜は、夜更かしを許してくださって。
晶	じゃあ、ちょっと楽しみだったんですか？
アーサー	……不謹慎ですが、そうかもしれません。
	今回のような深刻な被害が出たのは稀で、私が生まれてから一度もなかったことでした。
	魔力の強い、スノウ様とホワイト様が、賢者の魔法使いだということも
	知っていたので、怖いと思ったことはありませんでした。
	大きくなった〈大いなる厄災〉が、空に還っていく姿を見るたびに、お二人の活躍を想像し、胸を躍らせていました。
晶	そうなんですね……。
アーサー	ご心配なく、賢者様。
	次の戦いでは、美しく大きくなるだけの〈大いなる厄災〉をご覧に入れられるよう、みなで励みますから。
`},
{id:10218,title:"スポットの人々",type:"personal",characters:["②"],memo:"アーサー",
text:`お城の侍女	アーサー様、賢者様。ご機嫌よう。
アーサー	ああ。ありがとう。
晶	ご、ご機嫌ようです……！
	（お城の挨拶、いつまでも慣れないな……でも……）
	ここのみなさん、気さくですよね。すぐ打ち解けてくれるし。
アーサー	そうですね。みな、おおらかで真面目で、親しみやすい者たちばかりです。
晶	優しくて親切な人が多いですし、俺がお世話になるのが、中央の国でよかったなって思います。
アーサー	わあ、本当ですか？賢者様にそう言っていただけると、きっとみなも喜びます！
	ああ、そこのきみ。聞いたか？今、賢者様がおまえたちのことを……。
お城の召使い	わっ、アーサー様！？わ、私ですか……！？
晶	（王子様が率先して気さくだもんな……）
`},
{id:10219,title:"アーサーの特効薬",type:"personal",characters:["オズ","アーサー"],memo:"アーサー",
text:`晶	あれ……。アーサー、少し顔色が悪くないですか？午後は無理せずに休んだ方が……。
アーサー	そういえば……、朝から少し、喉の調子が悪かったのです。
	ただ、このあと会議の予定があって。
	夜は早めに休むようにいたしますね。ご心配ありがとうございます、賢者様。
晶	（アーサー、若いのに、会社員みたいだ……。倒れたりはしないだろうけど……）
~~~~~~~~~	~~~~~~~~~
選択	思い切って休暇をもらっては？
晶	こじらせた方が大変そうですよ。
	別の日に変更できるなら、大事をとって休んだ方がいいと思います。
アーサー	そんなに悪そうに見えますか？
	……賢者様がそうおっしゃるなら、少し、相談してみます。
~~~~~~~~~	~~~~~~~~~
選択	アーサーがそう言うなら……。
晶	頑張りすぎないでくださいね。
アーサー	はい。……とは言っても、午後の会議は眠らないのが大変なくらい、
	のんびりしているので大丈夫ですよ。
~~~~~~~~~	~~~~~~~~~
選択	代役はたてられませんか？
晶	誰か、代わりに出てもらうことはできないんですか？
アーサー	代役か……。ドラモンドなら任せられるかもしれません。あとで確認してみます。
~~~~~~~~~	~~~~~~~~~
アーサー	子供の頃なら、このくらいの体調不良はすぐ……。
オズ	無茶をするのはおまえの悪い癖だ。
アーサー	あ……、 オズ様！
不意に現れたオズが、指先をひらめかせた。
はっとして、アーサーが何かを受け止めるように両手を差し出す。
次の瞬間、ふわりとオズの手元が光り、
ころころとした、形のいい砂糖菓子が、アーサーの手のひらに転がった。
晶	シュガーですね！薬の代わりにもなるんですか？
アーサー	体力の回復の助けになるのです。
	子供の頃に風邪をひくと、いつもオズ様がシュガーを作ってくださいました。
	……オズ様、ご心配をお掛けしてすみません。ありがとうございます。
オズ	大事にな。
`},
{id:10220,title:"スポットにいた魔法使い",type:"personal",characters:["②"],memo:"アーサー",
text:`アーサー	聖なる魔法使いファウストは、初代国王アレクと力を合わせ、多くの人々を救いました。
	中央の国に生まれれば、誰しも一度は名前を耳にする、建国の英雄たちです。
晶	聖なる魔法使いファウストって……。
	俺たちの仲間の、東の魔法使いのファウストと同じ人なんですか？
アーサー	どうでしょう。私も本人に尋ねてみたのですが、否定されてしまいました。
	高潔で、思慮深く、文武に長けた優しい人物で……。
	猫が好きだったと言い伝えられています。
晶	…………。猫派なんだ。
アーサー	はい。ちなみに、初代国王アレクは、犬好きだったそうです。
	そのため、グランヴェル城には、犬の彫刻が施された柱があるんですよ。
	ご覧になりますか？
`},
{id:10221,title:"危険な場所",type:"personal",characters:["オズ"],memo:"アーサー",
text:`晶	あれ、あの塔みたいなのはなんだろう？
	窓の格子の形が、他と違うような……。
オズ	賢者。そちらに何か用があるのか。
	なければ戻れ。
晶	オズ……。すみません。立ち入り禁止の場所でしたか？
オズ	…………。
	あそこの地下は牢獄だ。魔法使いのな。
晶	魔法使いの……。
	どんなところなんですか……？
オズ	私も入ったことはない。強い結界が張られている。
	ブラッドリーの方が詳しいだろう。
晶	（怖そうなところだ……）
`},
{id:10222,title:"アーサーの評判",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	カナリアさん。女性から見たアーサーの評判って、どんな感じなんでしょうか？
カナリア	お優しくて、聡明で、あのお顔立ちですもの！憧れと噂の的ですよ。
晶	やっぱり有名人なんですか？国中みんな、顔を知ってる感じとか。
カナリア	少なくとも中央の街では、知らない者はおりませんね。
	中央のお城に戻られた時から、民衆にお目見えする国王陛下のお仕事は、
	アーサー様が取り仕切るようになりましたし。
	一度、街でパレードがあった時に、アーサー様のお顔を見たがった子供が飛び出して隊列を止めてしまったことがあったんです。
	子供とはいえ、厳しい処罰を受けかねないのに、アーサー様が取り成して収めてくださって！
	それからまた、ファンが増えたみたいですよ。
晶	なるほど……。
~~~~~~~~~	~~~~~~~~~
選択	若い女性からの人気は？
カナリア	まさに憧れの王子様なんでしょうね。
	アーサー様のお顔が彫ってあるメダルや、姿絵を集めている女の子も多いみたいです。
	この前の叙任式も、前方でアーサー様のお姿を見るために、朝早くから並んでいた女性が多かったそうですよ
晶	（アイドルの追っかけみたいだ……）
~~~~~~~~~	~~~~~~~~~
選択	大人の女性からの人気は？
カナリア	大人の女性は……、本気の方が多いですね。
	結婚や、旦那様を取り立てていただこうと、狙っている方も多そうです。
	私も、そのうちの一人だと言えば、そうなるのかもしれません。
	クックロビンのこと、よろしくお願い致します。
晶	（しっかりしてる奥さんだな……）
~~~~~~~~~	~~~~~~~~~
選択	年配の女性からの人気は？
カナリア	年配の女性は、魔法使いに怖い印象を持たれてる方が多かったのですが、
	アーサー様が来てから雰囲気が変わりました。
	誰が相手でも、てらいなく素直に接してくださるお姿を間近に見ていると、孫や息子のように感じるんじゃないでしょうか。
	アーサー様もわからないことがあると、身分も問わずなんでもお尋ねになりますから。
	つい可愛くなってしまうのは仕方ないでしょうね。
`},
{id:10223,title:"スポットの名物",type:"personal",characters:["②"],memo:"アーサー",
text:`クックロビン	賢者様、こちらをどうぞ！グランヴェル城の特製品です。
晶	ありがとうございます。これはなんですか？メダル？
クックロビン	はい。祝日に城の一部を解放する際、見学に来た方へお配りしているんです。
	絵柄もいろいろあって、収集家もいるくらい好評なんですよ。
晶	すごい！お土産がもらえるんですね！表にグランヴェル城が彫ってある。
	裏面は……？
~~~~~~~~~	~~~~~~~~~
選択	……アーサーだ！
晶	……アーサーだ！
クックロビン	おお！ それは当たりです！
	お優しいアーサー殿下のメダルは、どんな方でも欲しがるので。
	特に女性や、子供に人気ですね。
	数年前までは、カイン元騎士団長のメダルもあって、それがまた評判良くて。
晶	わかる気がします……。大事にしますね！
~~~~~~~~~	~~~~~~~~~
選択	……ドラモンドさんだ！
晶	……ドラモンドさんだ！すごい！ドラモンドさんの柄もあるんですね！
クックロビン	お城の関係者の顔が彫ってあるんですよ。
	あはは、ドラモンド様のメダルでそんなに喜ぶ方は初めて見ました。
	でも残念、ハズレでしたね！よろしければ、もう一枚どうぞ。
晶	（この人、上司の顔のメダルをハズレって言い放った……。
	　酷いけど、ちょっと親近感湧くな……）
~~~~~~~~~	~~~~~~~~~
選択	……知らないおじさんだ！
クックロビン	賢者様……！
	それは国王陛下です……！！
晶	えっ、あっ！？……すみません！！
クックロビン	ここでおじさんはまずいですよ！！
晶	すみません、すみません……！
`},
{id:10224,title:"スポットでの発見",type:"personal",characters:["オズ"],memo:"アーサー",
text:`晶	あれ、紙くずが落ちてる。こんなに綺麗な庭なのに……。
	たくさんあるな。書類を破いて捨てたのかな？とりあえず拾って……。
オズ	《ヴォクスノク》
晶	オズ……！？うわ！紙の破片が集まって来た……！
オズ	…………。
晶	書類が元に戻ってる！ありがとうございます。魔法って掃除に便利ですね。
オズ	これは……。
晶	なんて書いてありましたか？俺には読めない文字で……。
オズ	恋文の下書きだ。
	……アーサー宛の。
晶	え！？恋文って……ラブレターのことですよね！？だ、誰が……。
オズ	賢者よ。
晶	は、はいっ。
オズ	これは、おまえに託す。
晶	えっ……。
オズ	頼んだぞ。
晶	消えた……！？ま、待ってください！
	気まずいのはわかりますけど、こんなの無理ですよ……！
	オズ！オズ……！
`},
{id:10225,title:"楽しい場所",type:"personal",characters:["カイン"],memo:"アーサー",
text:`カイン	賢者様。ちょっとついてきてくれ。
晶	カイン。何かありましたか？
カイン	ここから見る夕暮れが綺麗なんだ。あんたに見せてやりたくてな。
晶	あ……、ありがとうございます……。
カイン	ああ。もうすぐだ。
晶	（………夕日を見るために、ただ待つなんてこと、初めてかも
	　ここにきてから、なんだか、贅沢でのんびりした時間をたくさん過ごしてるなあ……）
カイン	…………。
晶	…………。
カイン	…………。暇だな。早すぎたか？
晶	えっ。
カイン	今度にして、飲みに行こう。いい店があるんだ。
晶	（カインはわりとせっかちだな。夕日に向かって走るほうがいいかも……）
`},
{id:10226,title:"マナエリア",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	魔法使いにはそれぞれ、お気に入りのパワースポットがあるって、賢者の書に書いてあったんです。
	リフレッシュしたり、意識を集中したりするための、気場のような場所があるって。
アーサー	パワースポット……。ああ、マナエリアのことでしょうか。
	マナエリアとは、それぞれ自分自身が持つ原風景のような、自然と心の落ち着く場所のことです。
晶	たぶん、それです！アーサーにもマナエリアがありますか？
アーサー	私のマナエリアは、オズ様の城で暮らしている時に見た、オーロラの降る雪景色です。
	空一面に広がる幻想的な光を見つめていると、
	私の身体が内側から目覚めるような、胸の奥から湧き上がる力を感じられました。
	心が落ち着く場所と言いましたが、私の場合は元気を貰うような感覚になります。
	集中して、やる気が出るような。
	落ち込んだ考えを吹き飛ばしたい時や、朝、目覚めてすぐ、仕事の前に訪れたいような場所ですね。
晶	なるほど。気合を入れたい時や気持ちを切り替える時に行くんですね。
	なんとなく、前向きなアーサーらしいですね！
アーサー	ありがとうございます。
	賢者様にとってのマナエリアがわかったら、ぜひ教えてくださいね。
`},
{id:10227,title:"アミュレット",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	マナエリアから長く離れる魔法使いは、マナエリアを模したアミュレットを持ってるって賢者の書に書いてあったんです。
	アーサーもアミュレットを持ってますか？
アーサー	はい。私がグランヴェル城に戻る時に、オズ様が作ってくださいました。
アーサーは、机の上に置いていた足つきのガラスドームを両手で持ち上げて、俺に見せてくれた。
瓶の中で、輝くような光のカーテンがさらさらと流れ揺らめいている。
晶	すごい……。
アーサー	私のマナエリアは北の国のオーロラの風景です。
	似たものを持ち出せなかったので、オズ様がオーロラの幻影を瓶に閉じ込めてくれました。
晶	幻影……。なら、これはオズの魔法なんですね……。
	すごく綺麗です。
アーサー	そうなんです！見惚れてしまいますよね。
	オズ様の城を出たあの日からずっと、このアミュレットに力を貰っていました。
	城で落ち込んだ時も、この光を眺めていると、オズ様と見たオーロラを思い出して、心を持ち直せたのです。
晶	確かに、この綺麗な光を見つめてたら、くよくよした気持ちが浄化されそうですね……。
アーサー	賢者様も、心の落ち着くものを見つけたら、それをアミュレットとして部屋に置いておくと良いと思いますよ。
`},
{id:10228,title:"職業",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	アーサー！魔法舎に来てたんですね。
アーサー	賢者様。今、ご挨拶に行くところでした。城での仕事が早く終わったのです。
晶	そうだったんですね！お疲れ様です。お城と行き来するのは少し大変ですね。
アーサー	箒に乗って行きますから大丈夫ですよ。空を飛ぶのは好きですから。
晶	（俺の世界ならまだ高校生くらいなのに、王子様の仕事も両立していて、偉すぎるな……）
~~~~~~~~~	~~~~~~~~~
選択	お城ではどんな仕事をしていますか？
アーサー	色々ありますが、父上の公務の手伝いをしています。
	今は、会議や式典への出席と、客人のもてなしや、それらの準備。
	王家の承認を求める書類の確認などが主ですね。

~~~~~~~~~	~~~~~~~~~
選択	王子様になって良かったことはありますか？
アーサー	良かったこと、ですか……。
	…………。
	贅沢でいい暮らしをさせて貰っているとは、思っているのですが……。
	あっ！王子になったおかげで、魔法使いたちのために出来ることが増えました。
	それは、とても嬉しいです！
~~~~~~~~~	~~~~~~~~~
選択	好きな業務と嫌いな業務は？
アーサー	色々な者たちと会って話すのは楽しいです。
	行ったことのない土地へ赴くのも好きですよ。
	反対に、書類の仕事は、調べなくてはならないことも多くて、
	どうしても眠くなってしまいますね……。
~~~~~~~~~	~~~~~~~~~
アーサー	明日は城での仕事が午後からなので、今夜は魔法舎に泊まる予定です。
晶	なら、今夜はゆっくりできますね。シノたちが、新しいゲームに誘いたがってましたよ。
アーサー	それは楽しそうだな。すぐに着替えてきますね！
`},
{id:10229,title:"家族",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	アーサー。これからお城に戻るって聞きましたけど、用事があるんですか？
アーサー	ええ。今日は朝から父上のお加減が良かったので、午後のお茶をご一緒にと、お誘いしたのです。
晶	そうだったんですね！アーサーのお父さん……、国王様って、どんな方なんですか？
アーサー	穏やかで優しい方ですよ。公正で見識も広く、魔法使いの私にも、偏見なく接してくださいます。
	そして、身近な人たちをとても大切になさっています。
	母上や私はもちろん、城や国のものたちを。
晶	王様らしい、立派な人なんですね……。
アーサー	そうですね。今は病に伏していますが、とても威厳があった方だと聞いていますし、
	寝台の中であっても、その面影を感じます。
	ですが、近寄りがたい雰囲気はありません。
	病が治ったら一緒に中央の国を見て回ろうと、言ってくださいました。
	おそばにいて、学ぶことの多い方です。
	私も、父上のようにみなを導けるよう、頑張らねばなりませんね。
`},
{id:10230,title:"オズとの暮らし",type:"personal",characters:["②"],memo:"アーサー",
text:`アーサー	魔法舎の談話室で寛いでいると、オズ様の城を思い出します。
晶	そうなんですね。北の国のオズの城も、この部屋みたいな感じなんですか？
アーサー	雰囲気はかなり違いますが、広間に大きな暖炉があって、夜はその前で過ごすことが多かったのです。
	夕食後のオズ様は、昼間よりももっと寡黙でした。
	時折話す声も、低くてゆったりしていた。
	幼い頃の私も、なんとなく静かにしていなければと思って、オズ様のそばで本を読んでいました。
	そのうち、いつの間にか眠ってしまって、オズ様に起こされて部屋に戻るんです。
晶	ゆったりしてて、なんだか優雅な暮らしですね……。
アーサー	ええ。何気ないですが、静かで楽しい毎日でした。
	私がどうして起きない時は、オズ様がベッドに連れて行ってくださるので、
	たまに、寝たふりをしてたんです。
	今思えば、オズ様は、私が起きていることに気付いていた気がします。
	少し、恥ずかしい思い出ですね。
`},
{id:10231,title:"頼れる魔法使い",type:"personal",characters:["アーサー","フィガロ"],memo:"アーサー",
text:`晶	アーサーとフィガロは、以前からの知り合いなんですよね。
フィガロ	そうそう。アーサーがまだ、こんな小さな頃からね。
	よくオズの城に遊びに行ってたよね。
アーサー	はい。フィガロ様に初めて会った時、たくさんおしゃべりをしてくださる方だと、びっくりしたのを覚えています。
フィガロ	あはは。無口なオズと二人きりで暮らしてたら、誰に会ったっておしゃべりだなって驚くさ。
アーサー	フィガロ様は楽しくて物知りでした。
	色々な国と人々の話をしてくれましたし、たくさん構ってくれました。
	いつも私を気にかけてくださって、オズ様に言えないことができたら相談してと会うたびおっしゃっていました！
フィガロ	その話、まだ有効だよ、アーサー。オズに内緒で、いつでも部屋においで。
晶	フィガロから少し、面白がってるような雰囲気を感じますけど……。
アーサー	私が中央の国に来てからも、何度か会いに来てくれたことがありました。
	前の賢者様にご紹介したこともあります。
晶	そう言えば、フィガロも前の賢者様と、面識があるって聞きましたね。
フィガロ	前の賢者様は俺のこと、どんなやつだって言ってた？
アーサー	たしか……。
	ちょいワルリア充の匂いがすると、おっしゃっていましたね。
`},
{id:10232,title:"お茶目な友達",type:"personal",characters:["②"],memo:"アーサー",
text:`アーサー	幼い頃、スノウ様とホワイト様にも、よく遊んでいただきました。
晶	スノウとホワイトは、オズやフィガロの、魔法のお師匠様だったんですよね。
アーサー	はい。私も、初めてお会いした頃はそのことを知らず、年の近い魔法使いだと勘違いしてしまって。
	お二人もご自分から誤解を解かれずに、「お兄ちゃまと呼ぶように」とおっしゃるので、しばらくの間、そう呼んでおりました。
	私も、子供同士なのだと思って、「こっち来て！」とか「あれやって！」などと、平気で言っていましたね……。
晶	あはは！スノウとホワイトはいたずら好きですもんね。
	どこで正体がバレたんですか？
アーサー	野原で駆け回っている時だったと思います。
	急に大人の姿に変化なさって、我らは疲れたからオズに遊んでもらえ、と……。
晶	（気ままだ……）
アーサー	驚きましたし、子供の友達ができたと思っていたので、
	当時は少しだけさみしかったのです。
	今も、スノウ様とホワイト様は、大人のお姿より、子供のお姿の時の方が、親しみを覚えますね。
`},
{id:10233,title:"前賢者との思い出",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	前の賢者様とは、どんな話をしていたんですか？
アーサー	お互いの世界についてです。仕事、生活、遊び、住居、それから、食べ物について。
	賢者様の世界の食事を再現することには、二人で何度か挑戦しました。
	前の賢者様はラーメンがお好きでしたね。私はグラタンコロッケが好きでした。
晶	グラタンコロッケ美味しいですよね！俺が好きだった食べ物は……。
~~~~~~~~~	~~~~~~~~~
選択	寿司です！
アーサー	寿司は前の賢者様に聞いたことがあります！
	ぜひ食べて見たかったのですが、中央の国は大陸の真ん中にあるので、新鮮な魚が手に入らなくて……。
	代わりに、きゅうりを、蒸した米穀で包んで食べました。
	それも寿司だと伺いましたが、本当ですか？
晶	（カッパ巻きだ……）
~~~~~~~~~	~~~~~~~~~
選択	肉まんとあんまんです！
アーサー	肉まんと、あんまん……。それは初めて聞く食べ物です。
	まん、とは、どんなものですか？
晶	えっ？えっと、ハンバーグっぽい肉を、白パンのようなもので包んで蒸したのが、肉まんで……。
アーサー	なるほど。では、グラタンコロッケをまんで包むと、グラタンコロッケまんになるのですね！
晶	お、おそらく……？
~~~~~~~~~	~~~~~~~~~
選択	タピオカミルクティーです！
アーサー	タピオカとは、初めて聞きました。茶葉の名前でしょうか？
晶	いえ、タピオカは黒くてもちもちしてる外国のお菓子で、甘くて美味しいんです。
アーサー	もちもち……？何でできているのですか？
晶	えっ……？か、考えたことなかった……。小麦粉……？果物……？野菜……？
	（あんなに飲んでたのに……。なんかショックだな……）
~~~~~~~~~	~~~~~~~~~
アーサー	食堂で、似たものが作れないか、試しに行ってみましょうか。
晶	アーサーが作るんですか？
アーサー	簡単な家事なら、一通りのことはできますから。
	味見は、賢者様にお任せいたしますね。
`},
{id:10234,title:"本物の王子様",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	あっ……、うわっ！
アーサー	賢者様！
タイルに足を取られて転びそうになった瞬間、そばにいたアーサーが、俺の体を支えてくれた。
すぐに、心配そうに顔を覗き込んでくる。
アーサー	危なかった。お怪我はありませんか？
晶	はい、大丈夫です。ありがとう、アーサー。
アーサー	賢者様がご無事で良かったです。
	あ……、靴が脱げてしまいましたね。
いつのまにか転がっていた片方の靴を拾うと、アーサーは、躊躇いなく俺の前に跪き、靴を履かせてくれた。
晶	（うわ……、本物……）
	あの、それ、めちゃくちゃ王子様っぽいですね……！
アーサー	そうですか？
晶	はい。ちょっとテンション上がりました……。
アーサー	あはは。喜んでいただけたのなら光栄です。
	夜の庭は、散歩するには少し暗かったですね。部屋に戻るまで、お手をどうぞ。
	賢者様。
`},
{id:10235,title:"得意な魔法",type:"personal",characters:["②"],memo:"アーサー",
text:`アーサー	《パルノクタン・ニクスジオ》！
晶	すごい！先週から練習していた魔法、使えるようになったんですね！
アーサー	ありがとうございます。賢者様にお褒めいただき光栄です。
晶	（アーサーは、飲み込みが早くて、どんな魔法も上手くこなせる、優等生タイプの魔法使いみたいだな）
	アーサーの得意な魔法ってあるんですか？
アーサー	得意か……。強いて挙げるとすれば攻撃魔法でしょうか。
晶	そうなんですね！？アーサーは優しいのに、ちょっと意外です。
アーサー	オズ様から、攻撃魔法を教わる機会が多かったのです。
晶	なるほど、オズらしいですね……。
アーサー	最初に教えていただいたのは、刃物のように、鋭く物質を切り裂く魔法です。
	普段は薪にする木を切るのに使っていましたね。
晶	（生活感ある……）
`},
{id:10236,title:"アーサーの初めての魔法",type:"personal",characters:["②"],memo:"アーサー",
text:`テーブルを離れようとした瞬間、指先に何かを引っ掛けた感触がした。
コーヒーカップだ。
晶	わっ……！
アーサー	あっ……！
	……はあ、よかった。間に合いました。
晶	魔法でカップが浮いたまま止まってる……。
	ありがとうございます、アーサー。割ってしまうところでした。
アーサー	お怪我がなくてよかったです。
ふわりと柔らかな動きで、カップは行儀よく元あった場所に戻る。不意に、アーサーが小さく笑った。
晶	どうかしましたか？
アーサー	初めて使った魔法も、同じような場面でした。
	中央の城にいた頃、私のいたずらで、メイドが食器を落としそうになったのをとっさに止めたのです。
	幼い時から、物を落としたり、壊しそうになったりする、慌ただしい子供だったとよく言われます。
	素早く魔法を使う術は、そういうことがきっかけで、身についたのかもしれませんね。
`},
{id:10237,title:"紋章",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	アーサーの賢者の紋章は、手の甲に出たんですよね。
アーサー	はい、ここです。
	以前、カインの紋章を見せてもらっていたので、これが月に選ばれた紋章なのだと、すぐにわかりました。
~~~~~~~~~	~~~~~~~~~
選択	びっくりしましたか？
アーサー	ええ。城の者たちと、厄災の影響について話し合っている最中に、急に光り始めたのです。
	驚きましたが、私はやはり、嬉しかったです。
	みなのために魔法を使えること、世界を守る使命を与えられたこと、師や、仲間と、共に過ごし戦えること、全て。
~~~~~~~~~	~~~~~~~~~
選択	辛くはないですか？
アーサー	賢者様の魔法使いに選ばれたことを、辛いと思ったことはありません。
	以前から、魔法舎の手助けをしていたつもりですが、これでようやく、直接力を貸すことができると、嬉しく思いました。
~~~~~~~~~	~~~~~~~~~
アーサー	もうひとつ、焼しかったのは、城で働いている子供に、話しかけられたことですね。
晶	子供に？
アーサー	手の模様は何？と。賢者様の紋章だと説明したら、格好いい、と言われて。
	次に会った時、真似をして、自分の手の甲に絵を描いていたのです。
	嬉しくて、身の引き締まる出来事でした。
`},
{id:10238,title:"大好物の為なら",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	あれ、エレベーターから物音が……。誰か来るのかな……？
アーサー	あっ……、賢者様！？
晶	アーサー！？びっくりした……。
	中央の街の塔から来たんですよね？
	エレベーターを使って来るなんて、よっぽど急いでたんですね。
アーサー	それが、その……。
晶	（アーサーが言い澱むなんて。まさか、よくないことが……）
	アーサー、何かあったんですか？俺に手伝えることはありますか？
アーサー	ち、違うのです、賢者様。実は今夜……。
	魔法舎の夕食にシチューが出ると、カインが知らせてくれたのです。
	私の好物だからと。
	ですが、用事で遅くなってしまったので、夕食に間に合うように、エレベーターで……。
晶	このエレベーターって、確かマナ石の力で動くんでしたよね。
	マナ石は……高価なものじゃなかったですか？
アーサー	自分用に取っておいたものを使いました。
	ネロの作る料理は美味しいので、どうしても冷めないうちに食べたくて……。
晶	（セレブの使い方だ……）
`},
{id:10239,title:"今はあなたと",type:"personal",characters:["②"],memo:"アーサー",
text:`晶	アーサー、お茶を入れて来ました。部屋で仕事をしてるって聞いたので。
アーサー	賢者様！ありがとうございます。ちょうど今、終わったところでした。
晶	書類の持ち帰りなんて大変ですね……。
アーサー	城で済ませてもよかったのですが、魔法舎で、みなと夕食を食べたくて。
	それに、この部屋で作業をすると、少しだける気がするのです。
~~~~~~~~~	~~~~~~~~~
選択	ひとりの時は何をしていますか？
アーサー	今のように、城の仕事が残っていたらやっています。
	あとは、読書などでしょうか？
	魔法舎では、ゆっくりくつろぐより、誰かと一緒にいることが多いかもしれません。
~~~~~~~~~	~~~~~~~~~
選択	誰かを部屋に呼んだりしますか？
アーサー	カインはよく尋ねて来てくれます。私が彼の部屋に行くことも多いですね。
	リケも、一人でいると声をかけてくれます。
	あとは、シノが空腹の時に来ることが多いので、城で出た菓子を置いておくようにしています。
~~~~~~~~~	~~~~~~~~~
選択	１日のタイムスケジュールは？
アーサー	魔法舎に来る曜日や時間は決まっていません。
	城での会議や謁見の仕事をして、午後からこちらに来ることが多いでしょうか。
	ただ、今は厄災との戦いに備えるために、魔法舎で魔法の訓練をする時間を、優先して取るようにしています。
~~~~~~~~~	~~~~~~~~~
アーサー	明日は朝からオズ様が魔法の授業をしてくださるので、今夜は魔法舎に泊まって行く予定です。
晶	なら、このあとはゆっくりできるんですね。
	お茶は談話室に持って行って、みんなと飲みましょうか。
アーサー	そうですね……。ですが、私は、賢者様ともう少しお話がしたいです。
	飲み終えてからでも構いませんか？
`},
{id:10240,title:"昔のようなひと時",type:"personal",characters:["オズ"],memo:"アーサー",
text:`晶	談話室のソファに誰かいる……。あの後ろ姿はオズかな？
	オズ……、あっ……。
ソファを覗き込むと、オズにもたれてアーサーが眠り込んでいた。
見つかったオズは、少しだけ決まりの悪そうな顔をする。珍しく、俺より先にオズが口を開いた。
オズ	……話しながら眠ってしまった。
晶	疲れていたんでしょうか。
オズ	子供の頃からこうだ。
	部屋に戻れと促しても聞かずに、話し続けて、そのまま寝入ってしまう。
晶	オズが聞いてくれるのが嬉しいんですよ。きっと。
オズ	そうか……。
晶	毛布を持って来ましょうか？
オズ	いや。もう、部屋に連れて行く。おまえも、早く休むといい。おやすみ、賢者。
ふわりと、オズが上着をアーサーに覆いかぶせると、二人はそのまま手品のように姿を消した。
`},
{id:10241,title:"パンケーキ論争",type:"personal",characters:["アーサー","ミスラ"],memo:"アーサー",
text:`晶	あれ……。アーサーとミスラが話してる。
	珍しい組み合わせだけどちょっと心配だな……。
	アーサー、ミスラ。何かありましたか？
アーサー	賢者様。二人でオズ様のお部屋へ行くところなのです。
晶	オズの？
ミスラ	この子、オズがパンケーキを焼けるんだと言い張るんですよ。信じられなくて。
アーサー	私は嘘などつかない。オズ様は、パンケーキを焼くのだってとてもお上手だ。
	重ねて１０段まで積んだこともある。
	二人では食べきれなくて、次からは控えようということになったが。
ミスラ	へえ……。俺ならきっと、食べきれますけどね。
アーサー	パンケーキを食べたことがないのか？
	パンケーキを食べていると喉が乾いて、ついミルクを飲んでしまうが……。
	ミルクを飲むと、スポンジが胃の中で水分を吸収して膨らんで、すぐにお腹がいっぱいになってしまうのだ。
ミスラ	俺にはできますよ。オズには無理だったとしても。
晶	（張り合ってる……。喧嘩じゃないみたいだし、平和そうだ……）
	そうなんですね。みんなでおやつを食べるなら、あとで食堂に寄ってみます。
ミスラ	１０段でも２０段でも食べてやりますよ。
アーサー	食べられる分だけにしておけ。
	代わりにバラの形に焼いてくださるよう、私がオズ様にお願いしてみよう。
`},
{id:10242,title:"勇敢で無垢な王子様",type:"personal",characters:["アーサー","クロエ"],memo:"アーサー",
text:`晶	わっ……！今、変な物音がしませんでしたか？
クロエ	俺も聞こえた……！何だろう、こんな夜に怖いな……。
アーサー	…………。上から気配がする。
	ちょっと見てこよう。
クロエ	え！？や、やめなって、アーサー。
アーサー	大丈夫だ。
俺たちに笑いかけると、アーサーはふわりと身体を浮かせ、天井を通り抜けるように消えてしまった。
クロエ	アーサー！
	行っちゃった……。誰か呼んできた方がいいかな……。
アーサー	必要ない。
晶	わ！戻ってきた！無事でよかったです……。
アーサー	大きなネズミが巣を作ろうとしていたのです。追い払っておきました。
クロエ	何だ、ネズミが……。
	助かったけど、王子様なのに危ないよ！
	アーサーの命を狙ってる暗殺者だったら、どうするの？
アーサー	暗殺者？とても面白い発想だな！
クロエ	喜ばないで。もー、埃まみれだよ。綺麗にしてあげるね。
アーサー	ありがとう、クロエ。
晶	（迷わず、真っ先に危ないところを調べに行くなんて、アーサーらしいけど……
	　王子様って立場を思うとひやひやするな。
	　これはドラモンドさんも苦労するはずだ……）
`},
{id:10243,title:"嘘つきは誰？",type:"personal",characters:["中央"],memo:"アーサー",
text:`晶	じゃあ、いきますね。アーサー。
アーサー	お願いします、賢者様。
晶	問題！アーサーのケーキを食べてしまった犯人は、この中の誰でしょうか？
オズ	私ではない。
カイン	俺じゃないぜ。
リケ	僕ではありません。
アーサー	……みな、本当のことを言っているように思います。別の誰かなのでは？
オズ	アーサー、犯人はこの中にいる。これは嘘を見抜く練習だと言っただろう。
カイン	アーサーは本当に騙されやすいからな。俺が城での護衛につけなくて心配だよ。
リケ	ケーキを食べた者は絶対に許さない！と、怒りに燃えるといいのではないでしょうか？
アーサー	わかった、やってみよう。
	むむむ……。
晶	その調子で頑張ってください！正解したら、別のケーキをお出ししますね！
	じゃあ、みんな、もう一度お願いします。
オズ	私ではない。
カイン	俺じゃあない。
リケ	僕ではありません。
アーサー	…………｡
	やはり、別の誰かなのでは？
`},
//カイン
{id:10301,title:"スポットの印象（１）",type:"personal",characters:["オズ"],memo:"カイン",
text:`晶	オズは長生きなんですよね。この街に来たことはありましたか？
オズ	街になってからは初めてだ。
晶	そうでしたか。栄光の街はどうですか？
オズ	サーペントの守護を感じる。街でなく、己の身を護っているのかもな。
	川辺だが水害の心配は当分ないだろう。
晶	そんなこともわかるんですね。街の人たちが喜びますよ、きっと。
オズ	……街の者は、賑やかで皆陽気だ。
	グランヴェル城の周りもそうだが、さらに陽気だな。この辺りは。
晶	確かに、ここと比べると、中央の街は都会な雰囲気があるかもしれません。
	ここは活気のある観光地って感じがするかも。
オズ	すぐに友人のように話しかけられる。
	「よう、にいちゃん」と言われるが……。
	私の方が年上だぞ。と、思いながらやり過ごす。
晶	オズ……。もしかして気に障りました……？
オズ	いや……。
	だが、戸惑う。
`},
{id:10302,title:"スポットの印象（２）",type:"personal",characters:["ヒースクリフ"],memo:"カイン",
text:`晶	……あれ？ヒースがいない……。
	さっきまで見えるとこにいたのに、はぐれちゃったのかな。
	ヒース？ヒース……。
ヒースクリフ	……賢者様……。
晶	わっ。びっくりした……！魔法で姿を消してたんですか？
ヒースクリフ	なんかこの街……。
	すごく話しかけられるし、すごく顔を褒められるし、すごく誘われるし……。
	みんな知らない人なのに……。それで、ちょっと……。
晶	そ、そっか……。ヒース、人見知りなんでしたね……。大丈夫ですか？
ヒースクリフ	はい……。嫌だってわけじゃないんですけど……。
晶	みなさん気さくですもんね。俺も最初は驚きました。
ヒースクリフ	そうですよね……。
	ちょっと、次に来るときは、栄光の街に行くぞ！って気合いを入れないと
	出かけられないかもしれません……。
晶	ああ……。無理はしないでくださいね。
ヒースクリフ	すみません……。しばらく失礼しています……。
`},
{id:10303,title:"スポットの印象（３）",type:"personal",characters:["シャイロック"],memo:"カイン",
text:`晶	シャイロックは、栄光の街には初めていらしたんですか？
シャイロック	何度か訪れたことがあります。陽気でいい街ですね。
	この辺りは水が美しいので、美酒との出会いも多いんですよ。
晶	そうでしたか。シャイロックは静かな場所が好きそうだから、
	賑やかな街だけど大丈夫かなと思ってたんです。
シャイロック	おや、お気遣いありがとうございます。
	私も出身が港町だったので、この街の雰囲気は嫌いじゃないですよ。
	人や物が、多く流れるところが好きです。
